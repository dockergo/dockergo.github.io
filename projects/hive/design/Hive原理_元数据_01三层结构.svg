<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8ec6a3"/></marker></defs>
  <rect width="920" height="340" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="14" font-weight="600" fill="#1d1d1f">HMS 三层：Thrift 服务 → HMSHandler → ObjectStore → RDBMS（独立目录服务，全生态共享）</text>

  <!-- clients -->
 <g text-anchor="middle" font-size="10.5">
    <rect x="60" y="70" width="90" height="34" rx="9" fill="#eef3fb" stroke="#bcd0ec"/><text x="105" y="92" fill="#1b2a4a">Hive</text>
    <rect x="60" y="116" width="90" height="34" rx="9" fill="#eef3fb" stroke="#bcd0ec"/><text x="105" y="138" fill="#1b2a4a">Spark</text>
    <rect x="60" y="162" width="90" height="34" rx="9" fill="#eef3fb" stroke="#bcd0ec"/><text x="105" y="184" fill="#1b2a4a">Trino / Iceberg</text>
  </g>
  <text x="105" y="220" font-size="9.5" fill="#a1a1a6" text-anchor="middle">共享同一 HMS</text>

  <!-- three layers -->
  <g text-anchor="middle" font-size="11">
    <rect x="210" y="86" width="150" height="128" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#s)"/><text x="285" y="112" font-weight="600" fill="#12402a">Thrift Server</text><text x="285" y="134" font-size="9.5" fill="#3f7a56">HiveMetaStore</text><text x="285" y="150" font-size="9.5" fill="#3f7a56">startMetaStore()</text><text x="285" y="172" font-size="9.5" fill="#6e6e73">对外 RPC</text><text x="285" y="188" font-size="9.5" fill="#6e6e73">get_table/create_table</text>
    <rect x="400" y="86" width="150" height="128" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#s)"/><text x="475" y="112" font-weight="600" fill="#12402a">HMSHandler</text><text x="475" y="134" font-size="9.5" fill="#3f7a56">get_table_core</text><text x="475" y="150" font-size="9.5" fill="#3f7a56">create_table_req</text><text x="475" y="172" font-size="9.5" fill="#6e6e73">校验·权限·事件</text><text x="475" y="188" font-size="9.5" fill="#6e6e73">调 RawStore</text>
    <rect x="590" y="86" width="150" height="128" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#s)"/><text x="665" y="112" font-weight="600" fill="#12402a">ObjectStore</text><text x="665" y="134" font-size="9.5" fill="#3f7a56">RawStore 实现</text><text x="665" y="150" font-size="9.5" fill="#3f7a56">openTransaction</text><text x="665" y="172" font-size="9.5" fill="#6e6e73">JDO/DataNucleus</text><text x="665" y="188" font-size="9.5" fill="#6e6e73">屏蔽 DB 方言</text>
  </g>

  <!-- rdbms -->
  <rect x="780" y="110" width="110" height="80" rx="12" fill="#fdf6ea" stroke="#efdcb4" filter="url(#s)"/>
  <text x="835" y="138" font-size="11" font-weight="600" fill="#5a3410" text-anchor="middle">RDBMS</text>
  <text x="835" y="158" font-size="9.5" fill="#8a6a2e" text-anchor="middle">TBLS/PARTITIONS</text>
  <text x="835" y="173" font-size="9.5" fill="#8a6a2e" text-anchor="middle">/SDS…</text>

  <g stroke="#8ec6a3" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M150,133 L208,150"/><path d="M360,150 L398,150"/><path d="M550,150 L588,150"/>
    <path d="M740,150 L778,150" stroke="#d0a95a"/>
  </g>
  <text x="380" y="144" font-size="9" fill="#8ec6a3" text-anchor="middle">Thrift RPC</text>

  <!-- bottom band -->
  <rect x="60" y="256" width="500" height="56" rx="10" fill="#eafaf1" stroke="#dbe9e0"/>
  <text x="310" y="278" font-size="10.5" fill="#12402a" text-anchor="middle">HMS 不碰数据字节：只管「库表→目录 + SerDe + Schema」映射</text>
  <text x="310" y="296" font-size="10.5" fill="#12402a" text-anchor="middle">每次读写包在 JDO 事务(openTransaction/commitTransaction)里保原子</text>
  <rect x="580" y="256" width="280" height="56" rx="10" fill="#fdf6ea" stroke="#efdcb4"/>
  <text x="720" y="278" font-size="10.5" fill="#5a3410" text-anchor="middle">共享单点：大集群 get_partitions 高并发</text>
  <text x="720" y="296" font-size="10.5" fill="#5a3410" text-anchor="middle">易打爆 RDBMS → 连接池 + 分区裁剪下推</text>
</svg>