<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8fb0d8"/></marker></defs>
  <rect width="920" height="360" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="14" font-weight="600" fill="#1d1d1f">Tez DAG：算子树编成有向无环图，一次提交、算子间流水传递（对比 MR 多轮落盘）</text>

  <!-- MR baseline (top, faded) -->
  <text x="30" y="66" font-size="11" font-weight="600" fill="#a1616a">MR（遗留）：每段 Map→Reduce 结果落 HDFS，多轮启停</text>
  <g text-anchor="middle" font-size="10.5">
    <rect x="60" y="76" width="70" height="30" rx="8" fill="#fbeef0" stroke="#eccdd3"/><text x="95" y="95" fill="#7a3b45">Map1</text>
    <rect x="170" y="76" width="70" height="30" rx="8" fill="#fbeef0" stroke="#eccdd3"/><text x="205" y="95" fill="#7a3b45">Reduce1</text>
    <rect x="280" y="76" width="70" height="30" rx="8" fill="#fbeef0" stroke="#eccdd3"/><text x="315" y="95" fill="#7a3b45">Map2</text>
    <rect x="390" y="76" width="70" height="30" rx="8" fill="#fbeef0" stroke="#eccdd3"/><text x="425" y="95" fill="#7a3b45">Reduce2</text>
  </g>
  <g stroke="#d9b6bd" stroke-width="1.3" fill="none">
    <path d="M130,91 L168,91"/><path d="M240,91 L278,91"/><path d="M350,91 L388,91"/>
  </g>
  <text x="500" y="95" font-size="9.5" fill="#b98f97">↳ 每箭头一次落盘 HDFS</text>

  <!-- Tez DAG (main) -->
  <text x="30" y="150" font-size="11" font-weight="600" fill="#1b2a4a">Tez（默认）：一张 DAG 一次提交，边即流水，容器复用</text>
  <g text-anchor="middle" font-size="11">
    <rect x="60" y="164" width="96" height="38" rx="9" fill="#eef3fb" stroke="#bcd0ec" filter="url(#s)"/><text x="108" y="187" fill="#1b2a4a">Scan A</text>
    <rect x="60" y="238" width="96" height="38" rx="9" fill="#eef3fb" stroke="#bcd0ec" filter="url(#s)"/><text x="108" y="261" fill="#1b2a4a">Scan B</text>
    <rect x="240" y="200" width="110" height="40" rx="9" fill="#e3edfa" stroke="#9fbde3" filter="url(#s)"/><text x="295" y="224" fill="#1b2a4a">Join Vertex</text>
    <rect x="440" y="200" width="110" height="40" rx="9" fill="#e3edfa" stroke="#9fbde3" filter="url(#s)"/><text x="495" y="224" fill="#1b2a4a">GroupBy</text>
    <rect x="640" y="200" width="110" height="40" rx="9" fill="#eafaf1" stroke="#bfe0cd" filter="url(#s)"/><text x="695" y="224" fill="#12402a">Output</text>
  </g>
  <g stroke="#8fb0d8" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M156,183 L238,212"/><path d="M156,257 L238,228"/>
    <path d="M350,220 L438,220"/><path d="M550,220 L638,220"/>
  </g>
  <g font-size="9" fill="#8fb0d8" text-anchor="middle">
    <text x="395" y="212">shuffle 边</text><text x="595" y="212">流水边</text>
  </g>

  <!-- bottom band -->
  <rect x="60" y="300" width="420" height="42" rx="10" fill="#eef3fb" stroke="#dbe6f5"/>
  <text x="270" y="318" font-size="10.5" fill="#2f4a7c" text-anchor="middle">DAG 一次提交给 Tez AM，顶点(Vertex)= 一组并行 Task</text>
  <text x="270" y="333" font-size="10.5" fill="#2f4a7c" text-anchor="middle">边(Edge)= 数据传递方式(流水/广播/shuffle)，容器复用免冷启动</text>
  <rect x="500" y="300" width="360" height="42" rx="10" fill="#fdf6ea" stroke="#efdcb4"/>
  <text x="680" y="318" font-size="10.5" fill="#5a3410" text-anchor="middle">TezTask.build() 编 DAG → submit() 提交</text>
  <text x="680" y="333" font-size="10.5" fill="#5a3410" text-anchor="middle">TezJobMonitor 打各 Vertex 进度；调度归 YARN</text>
</svg>