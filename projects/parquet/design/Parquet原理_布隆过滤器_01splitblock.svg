<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#7c5fe6"/></marker></defs>
  <rect width="1000" height="430" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · SplitBlock 布隆过滤器：XxHash + 8 词块</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">等值查询里 min/max 无能为力（值落在区间内但不存在）;布隆过滤器用一个块内 8 个 32 位词、每词置 1 位,快速判“肯定没有 / 可能有”</text>

  <!-- 构建流程 -->
  <rect x="30" y="76" width="180" height="70" rx="10" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="120" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#12402a">列值 v</text>
  <text x="120" y="124" font-size="8.2" text-anchor="middle" fill="#2f6f5f">如 "user_8842"</text>

  <path d="M214,111 L252,111" stroke="#7c5fe6" stroke-width="1.8" fill="none" marker-end="url(#ac)"/>

  <rect x="256" y="76" width="200" height="70" rx="10" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="356" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#0a3d78">XxHash64(v)</text>
  <text x="356" y="124" font-size="8.2" text-anchor="middle" fill="#2a5a92">规范指定的哈希函数</text>

  <path d="M460,111 L498,111" stroke="#7c5fe6" stroke-width="1.8" fill="none" marker-end="url(#ac)"/>

  <rect x="502" y="76" width="220" height="70" rx="10" fill="#faf5ff" stroke="#e4d5f2" filter="url(#soft)"/>
  <text x="612" y="100" font-size="9.4" font-weight="700" text-anchor="middle" fill="#3d2a5a">高位选块 · 低位派生 8 掩码</text>
  <text x="612" y="120" font-size="8" text-anchor="middle" fill="#6a4f9a">block_idx = hi % 块数</text>
  <text x="612" y="136" font-size="8" text-anchor="middle" fill="#6a4f9a">8 个 mask 由固定奇数常量得出</text>

  <path d="M726,111 L764,111" stroke="#7c5fe6" stroke-width="1.8" fill="none" marker-end="url(#ac)"/>

  <rect x="768" y="76" width="202" height="70" rx="10" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="869" y="100" font-size="9.4" font-weight="700" text-anchor="middle" fill="#5a3410">块内每词置 1 位</text>
  <text x="869" y="120" font-size="8" text-anchor="middle" fill="#93762e">8 词 × 32 位 = 256 位</text>
  <text x="869" y="136" font-size="8" text-anchor="middle" fill="#93762e">写入即“插入 v”</text>

  <!-- 一个块的位图 -->
  <rect x="30" y="166" width="940" height="120" rx="12" fill="#f7f7f9" stroke="#e3e3e8" filter="url(#soft)"/>
  <text x="46" y="190" font-size="10.5" font-weight="700" fill="#5a3410">一个块 = 连续 8 个 32 位词（缓存行对齐，一次读取）</text>
  <g font-size="7.6" text-anchor="middle">
    <rect x="46" y="202" width="112" height="54" rx="6" fill="#eef3fb" stroke="#bcd0ec"/><text x="102" y="224" fill="#0a3d78">word0</text><text x="102" y="240" fill="#2a5a92">置 bit m0</text>
    <rect x="162" y="202" width="112" height="54" rx="6" fill="#eef3fb" stroke="#bcd0ec"/><text x="218" y="224" fill="#0a3d78">word1</text><text x="218" y="240" fill="#2a5a92">置 bit m1</text>
    <rect x="278" y="202" width="112" height="54" rx="6" fill="#eef3fb" stroke="#bcd0ec"/><text x="334" y="224" fill="#0a3d78">word2</text><text x="334" y="240" fill="#2a5a92">置 bit m2</text>
    <rect x="394" y="202" width="112" height="54" rx="6" fill="#eef3fb" stroke="#bcd0ec"/><text x="450" y="224" fill="#0a3d78">word3</text><text x="450" y="240" fill="#2a5a92">置 bit m3</text>
    <rect x="510" y="202" width="112" height="54" rx="6" fill="#eef3fb" stroke="#bcd0ec"/><text x="566" y="224" fill="#0a3d78">word4</text><text x="566" y="240" fill="#2a5a92">置 bit m4</text>
    <rect x="626" y="202" width="112" height="54" rx="6" fill="#eef3fb" stroke="#bcd0ec"/><text x="682" y="224" fill="#0a3d78">word5</text><text x="682" y="240" fill="#2a5a92">置 bit m5</text>
    <rect x="742" y="202" width="112" height="54" rx="6" fill="#eef3fb" stroke="#bcd0ec"/><text x="798" y="224" fill="#0a3d78">word6</text><text x="798" y="240" fill="#2a5a92">置 bit m6</text>
    <rect x="858" y="202" width="96" height="54" rx="6" fill="#eef3fb" stroke="#bcd0ec"/><text x="906" y="224" fill="#0a3d78">word7</text><text x="906" y="240" fill="#2a5a92">置 bit m7</text>
  </g>
  <text x="46" y="276" font-size="8.2" fill="#8a8a90">SplitBlock 把 8 次探测集中到一个块 → 一次内存/IO 访问命中缓存行,比经典 Bloom 的分散探测快得多。</text>

  <rect x="30" y="298" width="940" height="118" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="46" y="322" font-size="11" font-weight="700" fill="#0a3d78">为什么这样设计</text>
  <text x="46" y="344" font-size="9.4" fill="#2a5a92">· 固定“8 词 / 块 / 256 位”让实现无需协商参数,写读双方按同一算法即可互通。</text>
  <text x="46" y="364" font-size="9.4" fill="#2a5a92">· XxHash 快且分布均匀;高位定位块、低位派生 8 个位,单值只碰一个块 → 局部性好。</text>
  <text x="46" y="384" font-size="9.4" fill="#2a5a92">· 语义：全部 8 位都为 1 → “可能存在”（可能假阳）;任一位为 0 → “肯定不存在”（绝无假阴）。</text>
  <text x="46" y="404" font-size="8.4" fill="#5b7db1">布隆过滤器可整块存于列块附近,偏移记于 ColumnMetaData;裁剪流程见下一图。</text>
</svg>
