<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter></defs>
  <rect width="1000" height="430" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · DataPageV2：rep/def 级不压缩，可免解压读级</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">V2 把 repetition/definition 级从“压缩块”里拆出来单独明文放置(恒 RLE、不压缩),只对值区可选压缩;于是读级/跳页无需解压整页</text>

  <!-- V1 -->
  <rect x="30" y="76" width="455" height="180" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="48" y="100" font-size="11" font-weight="700" fill="#0a3d78">DataPage V1</text>
  <text x="48" y="120" font-size="8.8" fill="#2a5a92">rep 级 + def 级 + 值 一起打包后整页压缩</text>
  <rect x="48" y="132" width="419" height="44" rx="8" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="257" y="158" font-size="9" text-anchor="middle" fill="#0a3d78">[ rep 级 | def 级 | encoded values ] → 整体 codec 压缩</text>
  <text x="48" y="200" font-size="8.8" fill="#5b7db1">读级/取统计前必须先解压整页</text>
  <text x="48" y="220" font-size="8.8" fill="#5b7db1">→ 只想看“这页有没有匹配值”也得付解压代价</text>
  <text x="48" y="240" font-size="8.4" fill="#7fa0c4">简单,但跳页/裁页时不够省</text>

  <!-- V2 -->
  <rect x="505" y="76" width="465" height="180" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="523" y="100" font-size="11" font-weight="700" fill="#12402a">DataPage V2</text>
  <text x="523" y="120" font-size="8.8" fill="#2f6f5f">rep/def 级恒 RLE、明文置于头部;仅值区按 is_compressed 压缩</text>
  <rect x="523" y="132" width="150" height="44" rx="8" fill="#e6f4f1" stroke="#b9dfd8"/>
  <text x="598" y="152" font-size="8.4" text-anchor="middle" fill="#0f6b5e">rep 级(RLE,明文)</text>
  <text x="598" y="168" font-size="8.4" text-anchor="middle" fill="#0f6b5e">def 级(RLE,明文)</text>
  <rect x="681" y="132" width="270" height="44" rx="8" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="816" y="152" font-size="8.4" text-anchor="middle" fill="#0a3d78">encoded values</text>
  <text x="816" y="168" font-size="8.4" text-anchor="middle" fill="#2a5a92">is_compressed=true 时才压这段</text>
  <text x="523" y="200" font-size="8.8" fill="#2f6f5f">头部还直接记 num_nulls / num_rows / num_values</text>
  <text x="523" y="220" font-size="8.8" fill="#2f6f5f">→ 无需解压即可知空值数、行数、跳过整页</text>
  <text x="523" y="240" font-size="8.4" fill="#4c8567">读级/裁页只碰明文级区,值区按需解压</text>

  <rect x="30" y="278" width="940" height="140" rx="12" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="48" y="302" font-size="11" font-weight="700" fill="#1b2a4a">为什么 V2 更适合裁剪型读取</text>
  <text x="48" y="326" font-size="9.4" fill="#5b7db1">· 级(levels)是重建嵌套/判断 null 的关键,读取频繁;明文放置让这步零解压</text>
  <text x="48" y="346" font-size="9.4" fill="#5b7db1">· 结合 PageIndex：先用 ColumnIndex 判断“这页 min/max 是否命中”,命中才解压值区</text>
  <text x="48" y="366" font-size="9.4" fill="#5b7db1">· 头部自带 num_rows/num_nulls,统计与行定位无需触碰值区</text>
  <text x="48" y="390" font-size="8.6" fill="#7fa0c4">代价：格式略复杂,老读者需支持 V2;是否用 V2 由写库配置。语义与 V1 等价,只是布局更利于按需解压。</text>
</svg>
