<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter></defs>
  <rect width="1000" height="440" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · 四种页类型 + PageHeader union</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">每个页前置统一 PageHeader（记类型/压缩前后大小/CRC）,其 union 字段按页类型只填一个具体 header;四型页职责分明</text>

  <!-- PageHeader -->
  <rect x="30" y="76" width="940" height="86" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="48" y="100" font-size="11" font-weight="700" fill="#0a3d78">PageHeader（每页前置 · 统一头）</text>
  <g text-anchor="middle" font-size="8.6">
    <rect x="48" y="112" width="160" height="34" rx="6" fill="#fff" stroke="#a9ccf5"/><text x="128" y="133" fill="#0a3d78">type（页类型）</text>
    <rect x="216" y="112" width="200" height="34" rx="6" fill="#fff" stroke="#a9ccf5"/><text x="316" y="133" fill="#0a3d78">uncompressed / compressed 大小</text>
    <rect x="424" y="112" width="120" height="34" rx="6" fill="#fff" stroke="#a9ccf5"/><text x="484" y="133" fill="#0a3d78">crc（可选 CRC32）</text>
    <rect x="552" y="112" width="400" height="34" rx="6" fill="#f3f9ff" stroke="#bcd8f5"/><text x="752" y="133" fill="#2a5a92">4 个可选 *_header union：按 type 只填其一</text>
  </g>

  <!-- 四型页 -->
  <rect x="30" y="184" width="228" height="150" rx="12" fill="#f3f9ff" stroke="#bcd8f5" filter="url(#soft)"/>
  <text x="46" y="208" font-size="10.5" font-weight="700" fill="#0a3d78">DataPage（V1）</text>
  <text x="46" y="230" font-size="8.6" fill="#2a5a92">DataPageHeader</text>
  <text x="46" y="248" font-size="8.6" fill="#2a5a92">rep/def 级 + 值</text>
  <text x="46" y="266" font-size="8.6" fill="#2a5a92">整页一起压缩</text>
  <text x="46" y="290" font-size="8.4" fill="#5b7db1">记 num_values</text>
  <text x="46" y="308" font-size="8.4" fill="#5b7db1">及各自编码</text>
  <text x="46" y="326" font-size="8" fill="#7fa0c4">最经典的数据页</text>

  <rect x="270" y="184" width="228" height="150" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="286" y="208" font-size="10.5" font-weight="700" fill="#12402a">DataPageV2</text>
  <text x="286" y="230" font-size="8.6" fill="#2f6f5f">DataPageHeaderV2</text>
  <text x="286" y="248" font-size="8.6" fill="#2f6f5f">rep/def 级恒 RLE</text>
  <text x="286" y="266" font-size="8.6" fill="#2f6f5f">且不压缩</text>
  <text x="286" y="290" font-size="8.4" fill="#4c8567">仅值区按 is_compressed</text>
  <text x="286" y="308" font-size="8.4" fill="#4c8567">决定是否压缩</text>
  <text x="286" y="326" font-size="8" fill="#7fae9f">可免解压读级/跳页</text>

  <rect x="510" y="184" width="228" height="150" rx="12" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="526" y="208" font-size="10.5" font-weight="700" fill="#5a3410">DictionaryPage</text>
  <text x="526" y="230" font-size="8.6" fill="#93762e">DictionaryPageHeader</text>
  <text x="526" y="248" font-size="8.6" fill="#93762e">存字典的去重值</text>
  <text x="526" y="266" font-size="8.6" fill="#93762e">列块首位、至多一个</text>
  <text x="526" y="290" font-size="8.4" fill="#a1877f">值用 PLAIN 编码</text>
  <text x="526" y="308" font-size="8.4" fill="#a1877f">数据页存下标</text>
  <text x="526" y="326" font-size="8" fill="#b99b6e">配合 RLE_DICTIONARY</text>

  <rect x="750" y="184" width="220" height="150" rx="12" fill="#f4eefb" stroke="#d9c7ec" filter="url(#soft)"/>
  <text x="766" y="208" font-size="10.5" font-weight="700" fill="#3d2a5a">IndexPage</text>
  <text x="766" y="230" font-size="8.6" fill="#8a6db3">IndexPageHeader</text>
  <text x="766" y="248" font-size="8.6" fill="#8a6db3">页级索引（历史）</text>
  <text x="766" y="266" font-size="8.6" fill="#8a6db3">现代跳页改用</text>
  <text x="766" y="290" font-size="8.4" fill="#a58cc4">尾部 PageIndex</text>
  <text x="766" y="308" font-size="8.4" fill="#a58cc4">(ColumnIndex/OffsetIndex)</text>
  <text x="766" y="326" font-size="8" fill="#b8a4d0">PageType 中仍保留</text>

  <rect x="30" y="356" width="940" height="62" rx="12" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="48" y="380" font-size="9.6" fill="#1b2a4a">读者流程：读 PageHeader → 看 type → 取对应 *_header → 据大小取页体 → (可选)校验 CRC → 解压 → 解码。</text>
  <text x="48" y="400" font-size="9" fill="#5b7db1">PageType 枚举定义合法页类型;不感兴趣的页可仅读 header、按 compressed 大小整页跳过,无需解压。</text>
</svg>
