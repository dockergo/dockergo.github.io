<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter></defs>
  <rect width="1000" height="400" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · 排序特例：NaN 不入 min/max，INT96 特殊处理</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">浮点 NaN 与已弃用 INT96 破坏“正常序”,若照单全收会让裁剪出错;规范给出明确特例规则,保证 min/max 语义可靠</text>

  <!-- NaN 特例 -->
  <rect x="30" y="76" width="455" height="180" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="48" y="100" font-size="11" font-weight="700" fill="#0a3d78">浮点 NaN 特例</text>
  <text x="48" y="122" font-size="9" fill="#2a5a92">NaN 与任何值比较都为 false,无法排序</text>
  <rect x="48" y="134" width="419" height="30" rx="6" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="60" y="154" font-size="8.8" fill="#0a3d78">规则1：计算 min/max 时忽略 NaN(不参与)</text>
  <rect x="48" y="170" width="419" height="30" rx="6" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="60" y="190" font-size="8.8" fill="#0a3d78">规则2：全为 NaN 的页/块 → 不写 min/max</text>
  <rect x="48" y="206" width="419" height="30" rx="6" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="60" y="226" font-size="8.8" fill="#0a3d78">规则3：-0.0/+0.0 视相等,写 min 用 -0.0、max 用 +0.0</text>

  <!-- INT96 特例 -->
  <rect x="505" y="76" width="465" height="180" rx="12" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="523" y="100" font-size="11" font-weight="700" fill="#5a3410">INT96 时间戳特例</text>
  <text x="523" y="122" font-size="9" fill="#93762e">INT96 已弃用,其字节序 ≠ 时间先后</text>
  <rect x="523" y="134" width="429" height="30" rx="6" fill="#fbf6ef" stroke="#e6d8c4"/>
  <text x="535" y="154" font-size="8.8" fill="#5a3410">按普通整数序比较会得到错误 min/max</text>
  <rect x="523" y="170" width="429" height="30" rx="6" fill="#fbf6ef" stroke="#e6d8c4"/>
  <text x="535" y="190" font-size="8.8" fill="#5a3410">需 Int96TimestampOrder 才能得到时间序</text>
  <rect x="523" y="206" width="429" height="30" rx="6" fill="#fbf6ef" stroke="#e6d8c4"/>
  <text x="535" y="226" font-size="8.8" fill="#5a3410">许多实现干脆不为 INT96 写可用 min/max</text>

  <rect x="30" y="276" width="940" height="110" rx="12" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="48" y="300" font-size="11" font-weight="700" fill="#1b2a4a">为什么这些特例重要</text>
  <text x="48" y="322" font-size="9.4" fill="#5b7db1">· 裁剪依赖 min/max 的“保守正确性”：宁可不裁,不能错裁（把命中的块当成不命中而跳过 → 丢数据）。</text>
  <text x="48" y="342" font-size="9.4" fill="#5b7db1">· NaN 处理不当会让含 NaN 的页被错误跳过,或让 max 变成 NaN 污染所有比较 → 故规范要求忽略 NaN。</text>
  <text x="48" y="362" font-size="9.4" fill="#5b7db1">· INT96 因序不明确被整体弃用,新写应用 INT64+TimestampType;读老文件时对 INT96 的 min/max 要谨慎信任。</text>
  <text x="48" y="382" font-size="8.2" fill="#7fa0c4">这些规则集中体现在 ColumnIndex/ColumnOrder 相关注释与 README 的 Sort Order 一节,读者与写者都须遵守。</text>
</svg>
