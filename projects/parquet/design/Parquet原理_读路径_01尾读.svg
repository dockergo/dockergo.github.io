<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#7c5fe6"/></marker></defs>
  <rect width="1000" height="440" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · 读路径尾读：末 8 字节起步，反跳拿全图</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">元数据尾置，读者必先 seek 到文件尾:读末 8 字节（4 字节 FileMetaData 长度 + 魔数 PAR1）→ 回跳读 FileMetaData → 得到全文件地图</text>

  <!-- 文件尾字节布局 -->
  <text x="30" y="82" font-size="10" font-weight="600" fill="#8a8a90">文件尾部字节布局（越靠右越接近 EOF）</text>
  <g text-anchor="middle" font-size="8.6">
    <rect x="30" y="94" width="470" height="56" rx="8" fill="#e9f2ff" stroke="#a9ccf5"/><text x="265" y="118" font-weight="700" fill="#0a3d78">… 行组数据 …</text><text x="265" y="138" fill="#2a5a92">列块 / 页背靠背</text>
    <rect x="508" y="94" width="270" height="56" rx="8" fill="#fdf6ea" stroke="#efdcb4"/><text x="643" y="118" font-weight="700" fill="#5a3410">FileMetaData（Thrift）</text><text x="643" y="138" fill="#93762e">类型/行组/列块/统计/偏移</text>
    <rect x="786" y="94" width="94" height="56" rx="8" fill="#fdf1e0" stroke="#e8c99a"/><text x="833" y="118" font-weight="700" fill="#5a3410">4B 长度</text><text x="833" y="138" fill="#93762e">小端 int32</text>
    <rect x="888" y="94" width="82" height="56" rx="8" fill="#faf5ff" stroke="#e4d5f2"/><text x="929" y="118" font-weight="700" fill="#3d2a5a">PAR1</text><text x="929" y="138" fill="#6a4f9a">魔数</text>
  </g>
  <text x="833" y="166" font-size="8" text-anchor="middle" fill="#8a8a90">↑ 末 8 字节 = 4B 长度 + 4B "PAR1"</text>

  <!-- 三步 -->
  <rect x="30" y="182" width="300" height="150" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="46" y="206" font-size="11" font-weight="700" fill="#12402a">步骤① 读末 8 字节</text>
  <text x="46" y="230" font-size="9.2" fill="#2f6f5f">· seek(EOF − 8)，读 8 字节</text>
  <text x="46" y="250" font-size="9.2" fill="#2f6f5f">· 后 4 字节校验 = "PAR1"</text>
  <text x="46" y="270" font-size="9.2" fill="#2f6f5f">· 前 4 字节 = FileMetaData 长度 L</text>
  <rect x="46" y="284" width="268" height="40" rx="8" fill="#f0faf3" stroke="#bfe0cd"/>
  <text x="180" y="309" font-size="9" text-anchor="middle" fill="#12402a">开头也有 PAR1 → 双魔数确认是 Parquet</text>

  <path d="M336,257 L376,257" stroke="#7c5fe6" stroke-width="1.8" fill="none" marker-end="url(#ac)"/>
  <text x="356" y="249" font-size="8" text-anchor="middle" fill="#7c5fe6">长度 L</text>

  <rect x="382" y="182" width="300" height="150" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="398" y="206" font-size="11" font-weight="700" fill="#0a3d78">步骤② 回跳读 FileMetaData</text>
  <text x="398" y="230" font-size="9.2" fill="#2a5a92">· seek(EOF − 8 − L)，读 L 字节</text>
  <text x="398" y="250" font-size="9.2" fill="#2a5a92">· Thrift 反序列化 FileMetaData</text>
  <text x="398" y="270" font-size="9.2" fill="#2a5a92">· 常与尾读合并成一次范围读</text>
  <rect x="398" y="284" width="268" height="40" rx="8" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="532" y="309" font-size="9" text-anchor="middle" fill="#0a3d78">尾部大猜读（如末 64KB）常一次到位省 IO</text>

  <path d="M688,257 L728,257" stroke="#7c5fe6" stroke-width="1.8" fill="none" marker-end="url(#ac)"/>

  <rect x="734" y="182" width="236" height="150" rx="12" fill="#faf5ff" stroke="#e4d5f2" filter="url(#soft)"/>
  <text x="750" y="206" font-size="11" font-weight="700" fill="#3d2a5a">步骤③ 拿到全图</text>
  <text x="750" y="230" font-size="9" fill="#6a4f9a">· schema 类型树</text>
  <text x="750" y="250" font-size="9" fill="#6a4f9a">· 各行组 / 列块偏移</text>
  <text x="750" y="270" font-size="9" fill="#6a4f9a">· 每列 Statistics 与编码</text>
  <text x="750" y="290" font-size="9" fill="#6a4f9a">· PageIndex / 布隆偏移</text>
  <text x="750" y="312" font-size="8.4" fill="#8a6fb0">→ 据此规划要读哪些列/页</text>

  <!-- 收益条 -->
  <rect x="30" y="344" width="940" height="44" rx="10" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="46" y="365" font-size="10" font-weight="700" fill="#5a3410">尾读省 IO：不必扫全文件，一次小范围尾读即得全文件地图，再据地图精准定位要读的字节段。</text>
  <text x="46" y="382" font-size="8.6" fill="#93762e">与 ORC 的 postscript/footer 尾部索引同源;代价是读文件必须能 seek 到尾部（不适合纯流式读入）。</text>

  <rect x="30" y="400" width="940" height="32" rx="9" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="46" y="420" font-size="9.2" fill="#1b2a4a">全图在手后进入下一步“裁列裁页”：只读命中列与命中页，其余字节一概不碰。</text>
</svg>
