<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#0f9e8e"/></marker></defs>
  <rect width="1000" height="460" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · schema 树的深度优先扁平化（SchemaElement + num_children）</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">schema 是树,但文件里存成一维 SchemaElement 数组;靠每个节点的 num_children,读者按深度优先顺序精确还原树形</text>

  <!-- 左：逻辑树 -->
  <text x="30" y="78" font-size="11" font-weight="700" fill="#1b2a4a">① 逻辑 schema 树</text>
  <rect x="60" y="90" width="150" height="40" rx="9" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="135" y="115" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1b2a4a">root（分组）</text>

  <rect x="40" y="170" width="130" height="40" rx="9" fill="#e9f2ff" stroke="#a9ccf5"/><text x="105" y="195" font-size="9.2" text-anchor="middle" fill="#0a3d78">id : INT64</text>
  <rect x="185" y="170" width="150" height="40" rx="9" fill="#eef3fb" stroke="#bcd0ec"/><text x="260" y="195" font-size="9.2" text-anchor="middle" fill="#1b2a4a">addr（分组）</text>

  <rect x="185" y="250" width="150" height="40" rx="9" fill="#eafaf1" stroke="#bfe0cd"/><text x="260" y="275" font-size="9.2" text-anchor="middle" fill="#12402a">city : STRING</text>
  <rect x="40" y="330" width="130" height="40" rx="9" fill="#eafaf1" stroke="#bfe0cd"/><text x="105" y="355" font-size="9.2" text-anchor="middle" fill="#12402a">tags : LIST</text>

  <!-- 树连线 -->
  <path d="M105,130 L105,170" stroke="#b8b8bf" stroke-width="1.4" fill="none"/>
  <path d="M135,130 L135,150 L260,150 L260,170" stroke="#b8b8bf" stroke-width="1.4" fill="none"/>
  <path d="M260,210 L260,250" stroke="#b8b8bf" stroke-width="1.4" fill="none"/>
  <path d="M75,130 L75,310 L105,310 L105,330" stroke="#b8b8bf" stroke-width="1.4" fill="none"/>

  <!-- 扁平箭头 -->
  <path d="M360,240 L420,240" stroke="#0f9e8e" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="366" y="232" font-size="8.4" fill="#0f9e8e">深度优先展开</text>

  <!-- 右：扁平数组 -->
  <text x="440" y="78" font-size="11" font-weight="700" fill="#5a3410">② 文件中存储：一维 SchemaElement[]（前序 / 深度优先）</text>
  <g>
    <rect x="440" y="90" width="530" height="34" rx="7" fill="#fdf6ea" stroke="#efdcb4"/>
    <text x="454" y="112" font-size="9.2" fill="#5a3410">[0] root · type=∅ · <tspan font-weight="700">num_children=3</tspan>（id / addr / tags）</text>
    <rect x="440" y="130" width="530" height="34" rx="7" fill="#fff7e6" stroke="#efdcb4"/>
    <text x="454" y="152" font-size="9.2" fill="#5a3410">[1] id · type=INT64 · num_children=∅（叶）· repetition=REQUIRED</text>
    <rect x="440" y="170" width="530" height="34" rx="7" fill="#fdf6ea" stroke="#efdcb4"/>
    <text x="454" y="192" font-size="9.2" fill="#5a3410">[2] addr · type=∅ · <tspan font-weight="700">num_children=1</tspan>（city）· OPTIONAL</text>
    <rect x="440" y="210" width="530" height="34" rx="7" fill="#fff7e6" stroke="#efdcb4"/>
    <text x="454" y="232" font-size="9.2" fill="#5a3410">[3] city · type=BYTE_ARRAY(String) · num_children=∅（叶）</text>
    <rect x="440" y="250" width="530" height="34" rx="7" fill="#fdf6ea" stroke="#efdcb4"/>
    <text x="454" y="272" font-size="9.2" fill="#5a3410">[4] tags · LIST · num_children=1（element）· REPEATED 结构</text>
  </g>

  <!-- 还原规则 -->
  <rect x="30" y="304" width="940" height="130" rx="12" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="48" y="328" font-size="11" font-weight="700" fill="#1b2a4a">还原规则：读者顺序扫数组,用 num_children 递归“认领”子节点</text>
  <text x="48" y="350" font-size="9.4" fill="#5b7db1">读 [0] 见 num_children=3 → 接下来 3 个顶层子节点。读 [1] id 是叶(无 children) → 顶层第 1 个认领完。</text>
  <text x="48" y="368" font-size="9.4" fill="#5b7db1">读 [2] addr num_children=1 → 递归认领它的 1 个子节点 [3] city;认领完回到顶层,继续 [4] tags。</text>
  <text x="48" y="390" font-size="9.4" fill="#5b7db1">整棵树无需存指针/括号,仅靠“顺序 + num_children”即可无歧义重建——紧凑且流式可读。</text>
  <text x="48" y="414" font-size="9" fill="#8a8a90">叶节点定义 type(物理类型);分组节点 type 为空、仅靠 num_children 组织;repetition_type 决定该字段的 max def/rep 级。</text>
</svg>
