<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter></defs>
  <rect width="1000" height="420" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · 排序语义：ColumnOrder / BoundaryOrder / SortingColumn</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">min/max 只有在明确“用什么序比较”时才有意义;三个概念分别定义列的比较序、页边界是否有序、以及行组按哪些列排序</text>

  <!-- ColumnOrder -->
  <rect x="30" y="76" width="300" height="200" rx="12" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="46" y="100" font-size="11" font-weight="700" fill="#5a3410">ColumnOrder（union · 列的比较序）</text>
  <rect x="46" y="112" width="268" height="40" rx="7" fill="#fff" stroke="#efdcb4"/>
  <text x="60" y="130" font-size="9" fill="#5a3410">TypeDefinedOrder</text>
  <text x="60" y="145" font-size="8" fill="#93762e">按物理/逻辑类型的自然序</text>
  <rect x="46" y="158" width="268" height="40" rx="7" fill="#fff" stroke="#efdcb4"/>
  <text x="60" y="176" font-size="9" fill="#5a3410">IEEE754TotalOrder</text>
  <text x="60" y="191" font-size="8" fill="#93762e">浮点全序（-0/+0/NaN 明确排位）</text>
  <rect x="46" y="204" width="268" height="40" rx="7" fill="#fff" stroke="#efdcb4"/>
  <text x="60" y="222" font-size="9" fill="#5a3410">Int96TimestampOrder</text>
  <text x="60" y="237" font-size="8" fill="#93762e">INT96 时间戳按时间序</text>
  <text x="46" y="264" font-size="8.4" fill="#93762e">存于 FileMetaData.column_orders[]（每列一个）</text>

  <!-- BoundaryOrder -->
  <rect x="350" y="76" width="300" height="200" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="366" y="100" font-size="11" font-weight="700" fill="#12402a">BoundaryOrder（页边界是否有序）</text>
  <g font-size="9">
    <rect x="366" y="112" width="268" height="34" rx="7" fill="#fff" stroke="#b9dfd8"/><text x="380" y="134" fill="#0f6b5e">UNORDERED · 页间 min/max 无序</text>
    <rect x="366" y="152" width="268" height="34" rx="7" fill="#fff" stroke="#b9dfd8"/><text x="380" y="174" fill="#0f6b5e">ASCENDING · 页 min/max 递增</text>
    <rect x="366" y="192" width="268" height="34" rx="7" fill="#fff" stroke="#b9dfd8"/><text x="380" y="214" fill="#0f6b5e">DESCENDING · 递减</text>
  </g>
  <text x="366" y="248" font-size="8.4" fill="#2f6f5f">存于 ColumnIndex;有序时读者可二分定位候选页,</text>
  <text x="366" y="264" font-size="8.4" fill="#2f6f5f">而非逐页比较,裁页更快。</text>

  <!-- SortingColumn -->
  <rect x="670" y="76" width="300" height="200" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="686" y="100" font-size="11" font-weight="700" fill="#0a3d78">SortingColumn（行组的排序键）</text>
  <g font-size="9">
    <rect x="686" y="112" width="268" height="34" rx="7" fill="#fff" stroke="#a9ccf5"/><text x="700" y="134" fill="#0a3d78">column_idx（按哪列排）</text>
    <rect x="686" y="152" width="268" height="34" rx="7" fill="#fff" stroke="#a9ccf5"/><text x="700" y="174" fill="#0a3d78">descending（升/降）</text>
    <rect x="686" y="192" width="268" height="34" rx="7" fill="#fff" stroke="#a9ccf5"/><text x="700" y="214" fill="#0a3d78">nulls_first（null 排前/后）</text>
  </g>
  <text x="686" y="248" font-size="8.4" fill="#2a5a92">存于 RowGroup.sorting_columns;声明数据实际</text>
  <text x="686" y="264" font-size="8.4" fill="#2a5a92">按这些列排好 → 读者可做区间/归并优化。</text>

  <rect x="30" y="296" width="940" height="106" rx="12" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="48" y="320" font-size="11" font-weight="700" fill="#1b2a4a">三者如何协作</text>
  <text x="48" y="342" font-size="9.4" fill="#5b7db1">1. ColumnOrder 定“怎么比”——统计 min/max 和裁剪都以它为准,避免不同实现比较不一致。</text>
  <text x="48" y="362" font-size="9.4" fill="#5b7db1">2. 若写者按某列排序（SortingColumn）,该列的页边界往往 ASCENDING（BoundaryOrder）→ 二分跳页。</text>
  <text x="48" y="382" font-size="9.4" fill="#5b7db1">3. 读者据此把“范围/等值/排序输出”优化到极致:先按序裁块裁页,再局部读取。</text>
  <text x="48" y="398" font-size="8.2" fill="#7fa0c4">排序是“写者承诺 + 元数据声明”,格式本身不强制;NaN/INT96 等特例见下一图。</text>
</svg>
