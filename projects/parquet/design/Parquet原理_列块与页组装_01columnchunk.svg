<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#7c5fe6"/></marker></defs>
  <rect width="1000" height="430" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · ColumnChunk 与 ColumnMetaData（列块的“说明书”）</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">ColumnChunk 是一列在一个行组的全部数据;ColumnMetaData 记它的偏移/编码集/codec/统计/各辅助结构位置——读者据此直接寻址,不必扫全列</text>

  <!-- ColumnMetaData -->
  <rect x="30" y="76" width="420" height="330" rx="12" fill="#f4eefb" stroke="#d9c7ec" filter="url(#soft)"/>
  <text x="46" y="100" font-size="11" font-weight="700" fill="#3d2a5a">ColumnMetaData（存于 FileMetaData 内）</text>
  <g font-size="9">
    <rect x="46" y="112" width="388" height="30" rx="6" fill="#fff" stroke="#d9c7ec"/><text x="60" y="132" fill="#3d2a5a">type · path_in_schema（定位是哪一列）</text>
    <rect x="46" y="148" width="388" height="30" rx="6" fill="#fff" stroke="#d9c7ec"/><text x="60" y="168" fill="#3d2a5a">encodings[]（本列用过的编码集合）</text>
    <rect x="46" y="184" width="388" height="30" rx="6" fill="#fff" stroke="#d9c7ec"/><text x="60" y="204" fill="#3d2a5a">codec（压缩算法）· num_values</text>
    <rect x="46" y="220" width="388" height="30" rx="6" fill="#fef7ff" stroke="#e4d5f2"/><text x="60" y="240" fill="#5a3f82">data_page_offset（首个数据页偏移）</text>
    <rect x="46" y="256" width="388" height="30" rx="6" fill="#fef7ff" stroke="#e4d5f2"/><text x="60" y="276" fill="#5a3f82">dictionary_page_offset（有字典页时）</text>
    <rect x="46" y="292" width="388" height="30" rx="6" fill="#fef7ff" stroke="#e4d5f2"/><text x="60" y="312" fill="#5a3f82">statistics（min/max/null_count）</text>
    <rect x="46" y="328" width="388" height="30" rx="6" fill="#fef7ff" stroke="#e4d5f2"/><text x="60" y="348" fill="#5a3f82">bloom_filter_offset / length（可选）</text>
  </g>
  <text x="46" y="382" font-size="8.4" fill="#8a6db3">全部“指针 + 摘要”集中在元数据,读者一次尾读即拿到</text>
  <text x="46" y="398" font-size="8.4" fill="#8a6db3">整列地图,再按需 seek。</text>

  <!-- 指向物理列块 -->
  <path d="M456,240 L500,240" stroke="#7c5fe6" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="460" y="232" font-size="8.4" fill="#7c5fe6">偏移指向</text>

  <!-- 物理列块 -->
  <rect x="510" y="76" width="460" height="330" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="526" y="100" font-size="11" font-weight="700" fill="#0a3d78">物理 ColumnChunk（数据区中的字节）</text>
  <rect x="526" y="112" width="428" height="36" rx="7" fill="#fff7e6" stroke="#efdcb4"/>
  <text x="740" y="135" font-size="9" text-anchor="middle" fill="#5a3410">字典页（若有）← dictionary_page_offset</text>
  <rect x="526" y="156" width="428" height="36" rx="7" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="740" y="179" font-size="9" text-anchor="middle" fill="#0a3d78">DataPage 0 ← data_page_offset</text>
  <rect x="526" y="200" width="428" height="36" rx="7" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="740" y="223" font-size="9" text-anchor="middle" fill="#0a3d78">DataPage 1</text>
  <rect x="526" y="244" width="428" height="36" rx="7" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="740" y="267" font-size="9" text-anchor="middle" fill="#0a3d78">DataPage 2 …（背靠背）</text>
  <rect x="526" y="288" width="428" height="36" rx="7" fill="#e6f4f1" stroke="#b9dfd8"/>
  <text x="740" y="311" font-size="9" text-anchor="middle" fill="#0f6b5e">布隆过滤器位图（可选）← bloom_filter_offset</text>
  <text x="526" y="348" font-size="8.6" fill="#2a5a92">页与页之间无 padding;每页自带 PageHeader,故可独立解析。</text>
  <text x="526" y="366" font-size="8.6" fill="#2a5a92">列块本身也无块级 header——所有元信息都上移到 ColumnMetaData。</text>
  <text x="526" y="388" font-size="8.4" fill="#5b7db1">ColumnChunk 还可记 file_path（指向别的文件,少用）,一般就在本文件内。</text>
</svg>
