<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="el2s" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter>
    <marker id="el2a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8ec6a3"/></marker>
  </defs>
  <rect width="920" height="380" fill="#fbfbfd"/>
  <text x="40" y="42" font-size="14" font-weight="600" fill="#1d1d1f">选举流程时序：随机超时 → PreVote 探路 → electSelf → 多数派</text>

  <g filter="url(#el2s)">
    <rect x="36" y="76" width="150" height="112" rx="12" fill="#eef3fb" stroke="#bcd0ec" stroke-width="1"/>
    <rect x="216" y="76" width="150" height="112" rx="12" fill="#eef3fb" stroke="#bcd0ec" stroke-width="1"/>
    <rect x="396" y="76" width="150" height="112" rx="12" fill="#eafaf1" stroke="#bfe0cd" stroke-width="1"/>
    <rect x="576" y="76" width="150" height="112" rx="12" fill="#eafaf1" stroke="#bfe0cd" stroke-width="1"/>
    <rect x="756" y="76" width="128" height="112" rx="12" fill="#fdf6ea" stroke="#efdcb4" stroke-width="1"/>
  </g>
  <text x="111" y="104" font-size="12.5" font-weight="600" fill="#1b2a4a" text-anchor="middle">① 随机超时</text>
  <text x="111" y="128" font-size="10.5" fill="#3a5580" text-anchor="middle">Follower 无心跳</text>
  <text x="111" y="146" font-size="10.5" fill="#6e6e73" text-anchor="middle">randomTimeout [T,2T)</text>
  <text x="111" y="164" font-size="10.5" fill="#6e6e73" text-anchor="middle">错峰防分票</text>

  <text x="291" y="104" font-size="12.5" font-weight="600" fill="#1b2a4a" text-anchor="middle">② PreVote 探路</text>
  <text x="291" y="128" font-size="10.5" fill="#3a5580" text-anchor="middle">preElectSelf</text>
  <text x="291" y="146" font-size="10.5" fill="#6e6e73" text-anchor="middle">不递增 term</text>
  <text x="291" y="164" font-size="10.5" fill="#6e6e73" text-anchor="middle">默认开·防隔离扰动</text>

  <text x="471" y="104" font-size="12.5" font-weight="600" fill="#12402a" text-anchor="middle">③ electSelf</text>
  <text x="471" y="128" font-size="10.5" fill="#3f7a56" text-anchor="middle">term++ 转 Candidate</text>
  <text x="471" y="146" font-size="10.5" fill="#6e6e73" text-anchor="middle">persistVote 先投己</text>
  <text x="471" y="164" font-size="10.5" fill="#6e6e73" text-anchor="middle">落盘·一任期一票</text>

  <text x="651" y="104" font-size="12.5" font-weight="600" fill="#12402a" text-anchor="middle">④ RequestVote</text>
  <text x="651" y="128" font-size="10.5" fill="#3f7a56" text-anchor="middle">并发发所有 Voter</text>
  <text x="651" y="146" font-size="10.5" fill="#6e6e73" text-anchor="middle">得 voters/2+1 票</text>
  <text x="651" y="164" font-size="10.5" fill="#6e6e73" text-anchor="middle">即当选</text>

  <text x="820" y="104" font-size="12.5" font-weight="600" fill="#5a3410" text-anchor="middle">⑤ Leader</text>
  <text x="820" y="128" font-size="10.5" fill="#8a6a2e" text-anchor="middle">立即发心跳</text>
  <text x="820" y="150" font-size="10.5" fill="#6e6e73" text-anchor="middle">压制其他候选人</text>

  <g stroke="#8ec6a3" stroke-width="1.5" marker-end="url(#el2a)" fill="none">
    <path d="M186,132 L214,132"/><path d="M366,132 L394,132"/><path d="M546,132 L574,132"/><path d="M726,132 L754,132"/>
  </g>

  <g filter="url(#el2s)"><rect x="36" y="216" width="848" height="120" rx="10" fill="#eef3fb" stroke="#bcd0ec" stroke-width="1"/></g>
  <text x="56" y="242" font-size="12.5" font-weight="600" fill="#1b2a4a">接收方裁决 requestVote · 逐条否决</text>
  <g font-size="11" fill="#3a5580">
    <text x="70" y="268">term 更低 → 拒；term 更高 → 先退位为 Follower</text>
    <text x="470" y="268">已有已知 Leader 且非领导权转移 → 拒</text>
    <text x="70" y="292">候选人不在配置 / 非 Voter → 拒</text>
    <text x="470" y="292">候选人日志不比自己新 → 拒(比 LastLogTerm/Index)</text>
    <text x="70" y="316">本任期已投过别人 → 拒（一任期一票，落盘保证重启不违反）</text>
  </g>
</svg>