<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="860" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">复制策略对比 —— 主从 / 多主 / 无主在四个维度上的真实取舍，无主一列为概念参考，未做源码级核实</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">Postgres（主从）与 ClickHouse（多主）的结论均来自源码/官方文档核实；Dynamo/Cassandra（无主）一列仅代表经典论文与公开文档的通用描述</text>

  <text x="30" y="84" font-size="10" fill="#3a3a3c">图例</text>
  <rect x="70" y="76" width="14" height="14" rx="3" fill="#eaf1fb" stroke="#4a7fd0"/>
  <text x="90" y="87" font-size="10" fill="#3a3a3c">源码/文档级核实</text>
  <rect x="230" y="76" width="14" height="14" rx="3" fill="#f4eefb" stroke="#8a5cae" stroke-dasharray="3 2"/>
  <text x="250" y="87" font-size="10" fill="#3a3a3c">概念参考 · 未源码级核实</text>
  <line x1="30" y1="98" x2="1170" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- ============ 表头 ============ -->
  <rect x="30" y="112" width="180" height="54" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="120" y="144" font-size="10.5" font-weight="700" fill="#4a4a4f" text-anchor="middle">维度</text>

  <rect x="224" y="112" width="300" height="54" rx="8" fill="#4a7fd0" filter="url(#soft)"/>
  <text x="374" y="136" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Postgres</text>
  <text x="374" y="152" font-size="8.5" fill="#dbe8fb" text-anchor="middle">主从 Primary-Standby</text>

  <rect x="538" y="112" width="300" height="54" rx="8" fill="#2f9e6e" filter="url(#soft)"/>
  <text x="688" y="136" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">ClickHouse</text>
  <text x="688" y="152" font-size="8.5" fill="#dcf3e7" text-anchor="middle">多主 Multi-Master</text>

  <rect x="852" y="112" width="318" height="54" rx="8" fill="#8a5cae" stroke="#6f3ea8" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#soft)"/>
  <text x="1011" y="132" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Dynamo / Cassandra</text>
  <text x="1011" y="147" font-size="8" fill="#f0e6fa" text-anchor="middle">无主 Leaderless</text>
  <text x="1011" y="160" font-size="7.5" fill="#f0e6fa" text-anchor="middle">⚠ 概念参考 · 未源码级核实</text>

  <!-- ============ 行① 写入拓扑 ============ -->
  <rect x="30" y="176" width="180" height="118" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="202" font-size="10.5" font-weight="700" fill="#1d1d1f">① 写入拓扑</text>
  <text x="46" y="220" font-size="8" fill="#8a97ab">写请求的目的地</text>
  <text x="46" y="236" font-size="8" fill="#8a97ab">与是否有中心节点</text>

  <rect x="224" y="176" width="300" height="118" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="240" y="202" font-size="9.5" fill="#20375e">写只能去 Primary；</text>
  <text x="240" y="220" font-size="9.5" fill="#20375e">Standby 只读，不接受写入</text>
  <text x="240" y="242" font-size="8.5" fill="#5a7099">walsender → walreceiver</text>
  <text x="240" y="258" font-size="8.5" fill="#5a7099">单向流复制，拓扑固定</text>

  <rect x="538" y="176" width="300" height="118" rx="8" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="554" y="202" font-size="9.5" fill="#2f6b4e">任意副本都可接受</text>
  <text x="554" y="220" font-size="9.5" fill="#2f6b4e">INSERT / ALTER</text>
  <text x="554" y="242" font-size="8.5" fill="#3f8a63">本地处理后异步扩散</text>
  <text x="554" y="258" font-size="8.5" fill="#3f8a63">给其余副本，无固定拓扑</text>

  <rect x="852" y="176" width="318" height="118" rx="8" fill="#f4eefb" stroke="#dcc9ef" stroke-dasharray="4 3"/>
  <text x="868" y="202" font-size="9.5" fill="#5a3a7a">写发给 N 个副本，</text>
  <text x="868" y="220" font-size="9.5" fill="#5a3a7a">凑够 W 个确认即成功</text>
  <text x="868" y="242" font-size="8.5" fill="#8a97ab">无固定主节点（概念层）</text>
  <text x="868" y="258" font-size="8.5" fill="#8a97ab">具体路由由一致性哈希等决定</text>

  <!-- ============ 行② 故障切换方式 ============ -->
  <rect x="30" y="304" width="180" height="118" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="330" font-size="10.5" font-weight="700" fill="#1d1d1f">② 故障切换</text>
  <text x="46" y="348" font-size="8" fill="#8a97ab">节点下线后</text>
  <text x="46" y="364" font-size="8" fill="#8a97ab">如何恢复写入能力</text>

  <rect x="224" y="304" width="300" height="118" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="240" y="330" font-size="9.5" fill="#20375e">Primary 故障 →</text>
  <text x="240" y="348" font-size="9.5" fill="#20375e">promote 一个 Standby 为新 Primary</text>
  <text x="240" y="370" font-size="8.5" fill="#5a7099">通常需要人工判断或工具介入</text>
  <text x="240" y="386" font-size="8.5" fill="#5a7099">切换期间写入能力短暂中断</text>

  <rect x="538" y="304" width="300" height="118" rx="8" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="554" y="330" font-size="9.5" fill="#2f6b4e">副本彼此对等，</text>
  <text x="554" y="348" font-size="9.5" fill="#2f6b4e">不存在"主故障"这个概念</text>
  <text x="554" y="370" font-size="8.5" fill="#3f8a63">单副本下线，其余副本</text>
  <text x="554" y="386" font-size="8.5" fill="#3f8a63">继续正常读写，无需切换动作</text>

  <rect x="852" y="304" width="318" height="118" rx="8" fill="#f4eefb" stroke="#dcc9ef" stroke-dasharray="4 3"/>
  <text x="868" y="330" font-size="9.5" fill="#5a3a7a">无主节点，天然</text>
  <text x="868" y="348" font-size="9.5" fill="#5a3a7a">没有"切换"这一步</text>
  <text x="868" y="370" font-size="8.5" fill="#8a97ab">单副本下线只影响它贡献的</text>
  <text x="868" y="386" font-size="8.5" fill="#8a97ab">那一份确认（概念层，未核实实现细节）</text>

  <!-- ============ 行③ 数据丢失窗口 ============ -->
  <rect x="30" y="432" width="180" height="118" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="458" font-size="10.5" font-weight="700" fill="#1d1d1f">③ 数据丢失窗口</text>
  <text x="46" y="476" font-size="8" fill="#8a97ab">故障发生时</text>
  <text x="46" y="492" font-size="8" fill="#8a97ab">最多可能丢多少已提交数据</text>

  <rect x="224" y="432" width="300" height="118" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="240" y="458" font-size="9.5" fill="#20375e">由 synchronous_commit 决定：</text>
  <text x="240" y="478" font-size="8.5" fill="#5a7099">off / remote_write 可能丢已提交事务；</text>
  <text x="240" y="494" font-size="8.5" fill="#5a7099">on 仅极短回放窗口；</text>
  <text x="240" y="510" font-size="8.5" fill="#5a7099">remote_apply 可到 0 丢失</text>

  <rect x="538" y="432" width="300" height="118" rx="8" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="554" y="458" font-size="9.5" fill="#2f6b4e">= 副本间异步传播延迟</text>
  <text x="554" y="480" font-size="8.5" fill="#3f8a63">网络分区或节点下线期间，</text>
  <text x="554" y="496" font-size="8.5" fill="#3f8a63">各副本可能短暂持有不同版本，</text>
  <text x="554" y="512" font-size="8.5" fill="#3f8a63">恢复后随异步传播收敛</text>

  <rect x="852" y="432" width="318" height="118" rx="8" fill="#f4eefb" stroke="#dcc9ef" stroke-dasharray="4 3"/>
  <text x="868" y="458" font-size="9.5" fill="#5a3a7a">W+R&gt;N 只保证读写</text>
  <text x="868" y="476" font-size="8.5" fill="#8a97ab">副本集合相交，不直接等于</text>
  <text x="868" y="492" font-size="8.5" fill="#8a97ab">"零丢失"；具体取决于 W 取值</text>
  <text x="868" y="508" font-size="8.5" fill="#8a97ab">与实现细节（概念层，未核实）</text>

  <!-- ============ 行④ 读一致性 ============ -->
  <rect x="30" y="560" width="180" height="118" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="586" font-size="10.5" font-weight="700" fill="#1d1d1f">④ 读一致性</text>
  <text x="46" y="604" font-size="8" fill="#8a97ab">读到的数据</text>
  <text x="46" y="620" font-size="8" fill="#8a97ab">相对最新写入有多新</text>

  <rect x="224" y="560" width="300" height="118" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="240" y="586" font-size="9.5" fill="#20375e">取决于是否读 Standby，</text>
  <text x="240" y="604" font-size="9.5" fill="#20375e">以及 synchronous_commit 级别</text>
  <text x="240" y="626" font-size="8.5" fill="#5a7099">remote_apply 下，Standby 读到</text>
  <text x="240" y="642" font-size="8.5" fill="#5a7099">的就是已提交的最新值</text>

  <rect x="538" y="560" width="300" height="118" rx="8" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="554" y="586" font-size="9.5" fill="#2f6b4e">读不经过 Keeper，</text>
  <text x="554" y="604" font-size="9.5" fill="#2f6b4e">直接查本地副本数据</text>
  <text x="554" y="626" font-size="8.5" fill="#3f8a63">可能读到略旧版本，</text>
  <text x="554" y="642" font-size="8.5" fill="#3f8a63">一致性窗口 = 副本同步延迟</text>

  <rect x="852" y="560" width="318" height="118" rx="8" fill="#f4eefb" stroke="#dcc9ef" stroke-dasharray="4 3"/>
  <text x="868" y="586" font-size="9.5" fill="#5a3a7a">取决于 R 取值；</text>
  <text x="868" y="604" font-size="9.5" fill="#5a3a7a">R 越大越可能读到最新版本</text>
  <text x="868" y="626" font-size="8.5" fill="#8a97ab">仍可能出现多版本需要仲裁</text>
  <text x="868" y="642" font-size="8.5" fill="#8a97ab">（概念层，未核实具体仲裁实现）</text>

  <!-- ============ 底部一句话总结 ============ -->
  <rect x="30" y="696" width="1140" height="94" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="600" y="726" font-size="11.5" text-anchor="middle" fill="#1d1d1f">
    <tspan font-weight="700" fill="#2f5c98">主从</tspan>用单点写换来简单的一致性模型，<tspan font-weight="700" fill="#2f6b4e">多主</tspan>用无中心写换来更高的写可用性，
  </text>
  <text x="600" y="748" font-size="11.5" text-anchor="middle" fill="#1d1d1f">
    <tspan font-weight="700" fill="#6f3ea8">无主（概念参考）</tspan>把权衡编码成 N/R/W 三个可调数字——三者都没有绝对优劣
  </text>
  <text x="600" y="772" font-size="10" text-anchor="middle" fill="#6e6e73">选型的本质，是替业务在「写去哪 / 读多新 / 丢多少」这三根轴上，提前做一次明确的取舍。</text>

  <text x="30" y="828" font-size="9" fill="#8a97ab">Postgres / ClickHouse 两列的结论对应各自的 walsender-walreceiver 机制与 Keeper 协调簿记机制，均可追溯到源码或官方文档；</text>
  <text x="30" y="844" font-size="9" fill="#8a97ab">Dynamo/Cassandra 一列仅为经典论文与公开文档中的通用模型转述，不代表对任一具体版本源码的核实结论，请勿以同等置信度引用。</text>
</svg>
