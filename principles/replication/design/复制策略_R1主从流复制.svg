<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#c0533a"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">R1 · 主从流复制 —— Postgres 用 WAL 单向流复制，用 synchronous_commit 的四级开关在「丢多少」和「等多久」之间连续调节</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">walsender 把 WAL 流式发给 walreceiver 只是运输通道；真正决定故障切换丢多少数据的，是主库等哪一级确认才向客户端返回 COMMIT</text>

  <line x1="30" y1="46" x2="30" y2="46" stroke="none"/>
  <rect x="30" y="70" width="1140" height="20" rx="6" fill="none"/>
  <line x1="30" y1="98" x2="1170" y2="98" stroke="#e4e7ec" stroke-width="1"/>
  <text x="30" y="84" font-size="10" fill="#3a3a3c">图例</text>
  <line x1="70" y1="80" x2="94" y2="80" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="100" y="84" font-size="10" fill="#3a3a3c">WAL 流复制 / 确认路径</text>
  <rect x="300" y="73" width="14" height="14" rx="3" fill="#c0533a"/>
  <text x="320" y="84" font-size="10" fill="#3a3a3c">故障切换丢失窗口（越长越危险）</text>

  <!-- ============ Panel 1: 机制流程 ============ -->
  <rect x="30" y="112" width="1140" height="196" rx="14" fill="#eaf1fb" stroke="#c6d9f2" filter="url(#soft)"/>
  <text x="50" y="138" font-size="12.5" font-weight="700" fill="#20375e">WAL 流复制机制 · 单向、只能从 Primary 到 Standby</text>
  <line x1="46" y1="148" x2="1154" y2="148" stroke="#c6d9f2" stroke-width="1"/>

  <rect x="60" y="164" width="230" height="120" rx="10" fill="#ffffff" stroke="#c6d9f2"/>
  <text x="175" y="188" font-size="12" font-weight="700" fill="#20375e" text-anchor="middle">Primary</text>
  <text x="175" y="206" font-size="8.5" fill="#5a7099" text-anchor="middle">客户端写入 → 生成 WAL 记录</text>
  <rect x="76" y="216" width="198" height="52" rx="7" fill="#f6f9fe" stroke="#c6d9f2"/>
  <text x="175" y="234" font-size="9" font-weight="700" fill="#2f5c98" text-anchor="middle">walsender</text>
  <text x="175" y="250" font-size="8" fill="#5a7099" text-anchor="middle">StartReplication → WalSndLoop</text>
  <text x="175" y="262" font-size="8" fill="#5a7099" text-anchor="middle">→ XLogSendPhysical 逐段发送</text>

  <rect x="910" y="164" width="230" height="120" rx="10" fill="#ffffff" stroke="#c6d9f2"/>
  <text x="1025" y="188" font-size="12" font-weight="700" fill="#20375e" text-anchor="middle">Standby</text>
  <text x="1025" y="206" font-size="8.5" fill="#5a7099" text-anchor="middle">持续回放 WAL · 可只读查询</text>
  <rect x="926" y="216" width="198" height="52" rx="7" fill="#f6f9fe" stroke="#c6d9f2"/>
  <text x="1025" y="234" font-size="9" font-weight="700" fill="#2f5c98" text-anchor="middle">walreceiver</text>
  <text x="1025" y="250" font-size="8" fill="#5a7099" text-anchor="middle">WalReceiverMain 接收并写入</text>
  <text x="1025" y="262" font-size="8" fill="#5a7099" text-anchor="middle">本地 WAL，再交由 Startup 进程回放</text>

  <line x1="290" y1="224" x2="924" y2="224" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="607" y="214" font-size="9.5" font-weight="700" fill="#2f5c98" text-anchor="middle">WAL 流式发送（单向）</text>

  <text x="607" y="252" font-size="8.5" fill="#3a4a63" text-anchor="middle">Standby 收到后依次经历：写入本地 → flush 落盘 → apply 回放到数据文件</text>
  <text x="607" y="270" font-size="8.5" fill="#3a4a63" text-anchor="middle">三个阶段的完成时刻，恰好对应下面四级 synchronous_commit 各自等待的确认点</text>

  <text x="60" y="298" font-size="8.5" fill="#5a7099">Primary 故障 → 从某个 Standby promote 为新 Primary；旧 Primary 若恢复需重新以 Standby 身份接入</text>

  <!-- ============ Panel 2: 同步级别四级梯 ============ -->
  <rect x="30" y="326" width="1140" height="358" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="352" font-size="12.5" font-weight="700" fill="#1d1d1f">synchronous_commit 四级 · 等待的确认点越晚，丢失窗口越小，但提交延迟越高</text>
  <text x="50" y="368" font-size="9" fill="#8a97ab">强弱顺序：remote_apply &gt; on &gt; remote_write &gt; off —— 从上到下依次变弱，丢失窗口依次变长</text>
  <line x1="46" y1="378" x2="1154" y2="378" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 阶段刻度轴标注 -->
  <text x="640" y="396" font-size="8" fill="#a1a1a6" text-anchor="middle">Standby 处理阶段 →</text>
  <line x1="600" y1="402" x2="600" y2="666" stroke="#e4e7ec" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="760" y1="402" x2="760" y2="666" stroke="#e4e7ec" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="920" y1="402" x2="920" y2="666" stroke="#e4e7ec" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="600" y="414" font-size="8" fill="#8a97ab" text-anchor="middle">收到写入</text>
  <text x="760" y="414" font-size="8" fill="#8a97ab" text-anchor="middle">flush 落盘</text>
  <text x="920" y="414" font-size="8" fill="#8a97ab" text-anchor="middle">apply 回放</text>

  <!-- Row: remote_apply -->
  <rect x="46" y="422" width="1108" height="58" rx="9" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="66" y="446" font-size="10.5" font-weight="700" fill="#2f6b4e">remote_apply</text>
  <text x="66" y="464" font-size="8.5" fill="#3f8a63">等 Standby 回放完才算提交</text>
  <rect x="600" y="440" width="320" height="22" rx="5" fill="#d7efe2" stroke="#9ed3b8"/>
  <rect x="920" y="440" width="4" height="22" fill="#2f9e6e"/>
  <text x="1000" y="466" font-size="8.5" fill="#2f6b4e" text-anchor="middle">丢失窗口 ≈ 0 · 延迟最高</text>

  <!-- Row: on -->
  <rect x="46" y="486" width="1108" height="58" rx="9" fill="#eef6fb" stroke="#c9e2f0"/>
  <text x="66" y="510" font-size="10.5" font-weight="700" fill="#20375e">on（默认值）</text>
  <text x="66" y="528" font-size="8.5" fill="#3a4a63">等 Standby flush 落盘即算提交，不等回放</text>
  <rect x="600" y="504" width="160" height="22" rx="5" fill="#d7e8fa" stroke="#a9cceb"/>
  <rect x="760" y="504" width="4" height="22" fill="#4a7fd0"/>
  <text x="1000" y="530" font-size="8.5" fill="#20375e" text-anchor="middle">丢失窗口 = 回放未完成的极短区间</text>

  <!-- Row: remote_write -->
  <rect x="46" y="550" width="1108" height="58" rx="9" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="66" y="574" font-size="10.5" font-weight="700" fill="#8a6417">remote_write</text>
  <text x="66" y="592" font-size="8.5" fill="#7a5a1a">等 Standby 写入 OS 即算提交，不等 flush/回放</text>
  <rect x="600" y="568" width="0" height="22" rx="5" fill="#fbf3e2"/>
  <rect x="600" y="568" width="4" height="22" fill="#c99a3a"/>
  <text x="1000" y="594" font-size="8.5" fill="#8a6417" text-anchor="middle">丢失窗口 = 未 flush 前的操作系统缓存区间</text>

  <!-- Row: off -->
  <rect x="46" y="614" width="1108" height="58" rx="9" fill="#fbeeee" stroke="#ecc6c6"/>
  <text x="66" y="638" font-size="10.5" font-weight="700" fill="#9a3a2f">off</text>
  <text x="66" y="656" font-size="8.5" fill="#8a4a3f">不等任何 Standby 确认，本地提交即返回</text>
  <rect x="46" y="632" width="554" height="22" rx="5" fill="#f6d9d3" stroke="#e3a89b"/>
  <text x="1000" y="658" font-size="8.5" fill="#9a3a2f" text-anchor="middle">丢失窗口最大 · 主库崩溃可丢已提交事务（RPO≠0）</text>

  <text x="30" y="704" font-size="9" fill="#8a97ab">四级不是互斥的"选一个"，是同一条流复制通道上确认点前移/后移的连续调节——越靠右（越晚确认）越安全、越靠左越快。</text>
</svg>
