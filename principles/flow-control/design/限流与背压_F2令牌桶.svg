<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="650" viewBox="0 0 1150 650" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a5cae"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
  </defs>
  <rect width="1150" height="650" fill="#fbfbfd"/>

  <!-- 判型标题带 -->
  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">F2 · k8s client-go 令牌桶 + 指数退避组合 · `DefaultTypedControllerRateLimiter` 不是单一令牌桶，是两种限速器取更严格的一个</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">`TypedItemExponentialFailureRateLimiter`（逐 item 指数退避）+ `TypedBucketRateLimiter`（整体令牌桶）经 `NewTypedMaxOfRateLimiter` 组合——`AddRateLimited` 调用时取两者建议延迟中较大的一个</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">逐 item 指数退避（该 item 专属）</text>
  <line x1="288" y1="80" x2="312" y2="80" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="318" y="84" font-size="10" fill="#3a3a3c">整体令牌桶（所有 item 共享）</text>
  <line x1="536" y1="80" x2="560" y2="80" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="566" y="84" font-size="10" fill="#3a3a3c">MaxOf 组合 · 取更保守的延迟</text>
  <text x="1120" y="84" font-size="10" fill="#a1a1a6" text-anchor="end">源码级已核实</text>
  <line x1="30" y1="98" x2="1120" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 入口：AddRateLimited -->
  <rect x="28" y="128" width="184" height="110" rx="12" fill="#ffffff" stroke="#d9dde4" filter="url(#soft)"/>
  <text x="120" y="154" font-size="11.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">workqueue item 处理失败</text>
  <text x="46" y="176" font-size="9" fill="#4a4a4f">controller reconcile 出错</text>
  <text x="46" y="194" font-size="9" fill="#4a4a4f">→ 调用 `AddRateLimited(item)`</text>
  <text x="46" y="212" font-size="9" fill="#4a4a4f">（`TypedRateLimitingInterface`）</text>
  <text x="46" y="228" font-size="8.5" fill="#8a97ab">而非立即重新入队</text>

  <!-- 分叉箭头 -->
  <line x1="212" y1="160" x2="272" y2="160" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <line x1="212" y1="210" x2="272" y2="330" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>

  <!-- 上：TypedItemExponentialFailureRateLimiter -->
  <rect x="282" y="118" width="380" height="180" rx="13" fill="#f4eefb" stroke="#dcc9ef" filter="url(#soft)"/>
  <text x="472" y="144" font-size="12" font-weight="700" fill="#6f3ea8" text-anchor="middle">TypedItemExponentialFailureRateLimiter</text>
  <line x1="298" y1="154" x2="646" y2="154" stroke="#dcc9ef" stroke-width="1"/>
  <text x="298" y="176" font-size="9.5" fill="#5a3a7a">按 item 唯一键记录失败次数 `failures[item]`</text>
  <text x="298" y="196" font-size="9.5" fill="#5a3a7a">该 item 每失败一次，下次允许处理的延迟</text>
  <text x="298" y="214" font-size="9.5" fill="#5a3a7a">按指数增长（base × 2^failures，封顶于 maxDelay）</text>
  <text x="298" y="236" font-size="9.5" fill="#5a3a7a">同一 item 反复失败 → 越等越久；</text>
  <text x="298" y="254" font-size="9.5" fill="#5a3a7a">item 一旦成功需调用 `Forget` 清零计数</text>
  <text x="298" y="278" font-size="8.5" fill="#8a5cae">只影响这一个 item，不影响队列里其他 item</text>

  <!-- 下：TypedBucketRateLimiter -->
  <rect x="282" y="318" width="380" height="180" rx="13" fill="#eaf6f0" stroke="#bfe3d1" filter="url(#soft)"/>
  <text x="472" y="344" font-size="12" font-weight="700" fill="#2f6b4e" text-anchor="middle">TypedBucketRateLimiter</text>
  <line x1="298" y1="354" x2="646" y2="354" stroke="#bfe3d1" stroke-width="1"/>
  <text x="298" y="376" font-size="9.5" fill="#3f8a63">令牌桶，控制的是队列整体吞吐速率——</text>
  <text x="298" y="394" font-size="9.5" fill="#3f8a63">不区分是哪个 item，所有 `AddRateLimited`</text>
  <text x="298" y="412" font-size="9.5" fill="#3f8a63">调用共享同一个桶的令牌</text>
  <text x="298" y="434" font-size="9.5" fill="#3f8a63">桶空 → 建议延迟就是等下一个令牌产生的时间</text>
  <text x="298" y="456" font-size="8.5" fill="#3f8a63">保护的是「整条队列别一次性打太猛」这个全局约束</text>
  <text x="298" y="478" font-size="8.5" fill="#3f8a63">与上面逐 item 退避是完全独立的两套状态</text>

  <!-- 汇合箭头 -->
  <line x1="662" y1="200" x2="742" y2="280" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <line x1="662" y1="410" x2="742" y2="340" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>

  <!-- NewTypedMaxOfRateLimiter 组合器 -->
  <rect x="752" y="240" width="366" height="150" rx="14" fill="#eaf1fb" stroke="#c6d9f2" filter="url(#soft)"/>
  <text x="935" y="266" font-size="12.5" font-weight="700" fill="#20375e" text-anchor="middle">NewTypedMaxOfRateLimiter</text>
  <line x1="768" y1="278" x2="1102" y2="278" stroke="#c6d9f2" stroke-width="1"/>
  <text x="768" y="300" font-size="9.5" fill="#3a4a63">同时问两个限速器：「这个 item 该等多久？」</text>
  <text x="768" y="320" font-size="10" font-weight="700" fill="#20375e">delay = max(退避延迟, 令牌桶延迟)</text>
  <text x="768" y="342" font-size="9.5" fill="#3a4a63">取两者中更大（更保守）的一个作为最终延迟</text>
  <text x="768" y="362" font-size="8.5" fill="#5a7099">任一策略认为该慢，就必须慢——不是二选一</text>
  <text x="768" y="380" font-size="8.5" fill="#5a7099">默认组合正是这个 Max，而非单一令牌桶</text>

  <!-- 输出：延后重新入队 -->
  <line x1="935" y1="390" x2="935" y2="440" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <rect x="752" y="450" width="366" height="86" rx="12" fill="#ffffff" stroke="#d9dde4" filter="url(#soft)"/>
  <text x="935" y="474" font-size="11" font-weight="700" fill="#1d1d1f" text-anchor="middle">item 延后 delay 后重新出现在队列</text>
  <text x="768" y="494" font-size="9" fill="#4a4a4f">item 本身不丢弃，只是变慢；到期后</text>
  <text x="768" y="510" font-size="9" fill="#4a4a4f">worker 会再次尝试 reconcile 这个 item</text>

  <!-- 底部：常见误解澄清横幅 -->
  <rect x="30" y="558" width="1090" height="72" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="582" font-size="10.5" font-weight="700" fill="#1d1d1f">易错点</text>
  <text x="128" y="582" font-size="9.5" fill="#4a4a4f">很容易把 `DefaultTypedControllerRateLimiter` 简化理解成「纯令牌桶」——但它默认组合的是<tspan font-weight="700" fill="#6f3ea8">「逐 item 指数退避」</tspan>与<tspan font-weight="700" fill="#2f6b4e">「整体令牌桶」</tspan>两种性质不同的限速器。</text>
  <text x="128" y="602" font-size="9.5" fill="#4a4a4f">前者惯性来自「这个 item 反复失败」，后者惯性来自「整条队列的总速率上限」；`NewTypedMaxOfRateLimiter` 取更严格的一方生效，两个约束都不能违反。</text>
</svg>
