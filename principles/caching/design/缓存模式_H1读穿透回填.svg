<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="670" viewBox="0 0 1150 670" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2aa0a4"/></marker>
    <marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#a1a1a6"/></marker>
  </defs>
  <rect width="1150" height="670" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">H1 · nginx proxy_cache 未命中回填 · cache-aside 读路径 —— miss 回源、落盘填充，淘汰全部下放给独立的 cache-manager 进程</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">deepwiki 对该机制的官方口径本身即用「cache-aside style」描述；请求路径只管命中/回源，淘汰判断完全不占用请求路径</text>

  <line x1="30" y1="80" x2="54" y2="80" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">请求路径 · miss → 回源 → 落盘填充</text>
  <line x1="300" y1="80" x2="324" y2="80" stroke="#2aa0a4" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aT)"/>
  <text x="330" y="84" font-size="10" fill="#3a3a3c">后续命中 · 不再回源</text>
  <line x1="520" y1="80" x2="544" y2="80" stroke="#a1a1a6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aN)"/>
  <text x="550" y="84" font-size="10" fill="#3a3a3c">cache-manager 后台巡检 · 与请求路径解耦</text>
  <text x="1120" y="86" font-size="9.5" fill="#a1a1a6" text-anchor="end">nginx proxy_cache · 已核实</text>
  <line x1="30" y1="98" x2="1120" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- Panel A: 请求路径 -->
  <rect x="30" y="110" width="1090" height="250" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="136" font-size="13" font-weight="700" fill="#1d1d1f">① 请求路径 · 未命中回源 → 落盘填充 → 后续直出命中</text>
  <rect x="900" y="118" width="190" height="28" rx="14" fill="#2aa0a4"/>
  <text x="995" y="137" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">cache-aside 读路径</text>
  <line x1="46" y1="150" x2="1104" y2="150" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 主流水线 -->
  <rect x="50" y="172" width="140" height="64" rx="10" fill="#e4f4f4" stroke="#bfe1e1"/>
  <text x="120" y="196" font-size="10.5" font-weight="700" fill="#1d6b6e" text-anchor="middle">客户端请求</text>
  <text x="120" y="214" font-size="9" fill="#4a8a8c" text-anchor="middle">GET /resource</text>

  <rect x="214" y="172" width="176" height="64" rx="10" fill="#e4f4f4" stroke="#bfe1e1"/>
  <text x="302" y="196" font-size="10.5" font-weight="700" fill="#1d6b6e" text-anchor="middle">查本地磁盘缓存</text>
  <text x="302" y="214" font-size="9" fill="#4a8a8c" text-anchor="middle">按 URI/参数判定 cache key</text>

  <rect x="414" y="172" width="176" height="64" rx="10" fill="#fbeee2" stroke="#ecc6a8"/>
  <text x="502" y="196" font-size="10.5" font-weight="700" fill="#9a5f1c" text-anchor="middle">MISS → 回源</text>
  <text x="502" y="214" font-size="9" fill="#b0854a" text-anchor="middle">转发请求给 upstream 源站</text>

  <rect x="614" y="172" width="272" height="64" rx="10" fill="#e4f4f4" stroke="#bfe1e1"/>
  <text x="750" y="192" font-size="9.5" font-weight="700" fill="#1d6b6e" text-anchor="middle" font-family="'SF Mono',ui-monospace,Menlo,monospace">ngx_http_file_cache_new</text>
  <text x="750" y="208" font-size="9.5" font-weight="700" fill="#1d6b6e" text-anchor="middle" font-family="'SF Mono',ui-monospace,Menlo,monospace">ngx_http_file_cache_update</text>
  <text x="750" y="224" font-size="8.5" fill="#4a8a8c" text-anchor="middle">创建缓存项 + 落盘更新元数据</text>

  <rect x="910" y="172" width="176" height="64" rx="10" fill="#e4f4f4" stroke="#bfe1e1"/>
  <text x="998" y="196" font-size="10.5" font-weight="700" fill="#1d6b6e" text-anchor="middle">响应返回客户端</text>
  <text x="998" y="214" font-size="9" fill="#4a8a8c" text-anchor="middle">缓存项已落地，待后续命中</text>

  <line x1="190" y1="204" x2="212" y2="204" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>
  <line x1="390" y1="204" x2="412" y2="204" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>
  <text x="401" y="196" font-size="8.5" fill="#9a5f1c" text-anchor="middle">MISS</text>
  <line x1="590" y1="204" x2="612" y2="204" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>
  <line x1="886" y1="204" x2="908" y2="204" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>

  <!-- HIT 分支 -->
  <rect x="214" y="266" width="176" height="56" rx="10" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="302" y="288" font-size="10.5" font-weight="700" fill="#2f6b4e" text-anchor="middle">HIT → 直接返回</text>
  <text x="302" y="305" font-size="9" fill="#3f8a63" text-anchor="middle">读磁盘缓存文件，不回源</text>
  <line x1="302" y1="236" x2="302" y2="264" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aT)"/>
  <text x="312" y="252" font-size="8.5" fill="#2f6b4e">HIT</text>

  <!-- 后续命中回环 -->
  <path d="M 998 236 C 998 320, 420 340, 320 268" fill="none" stroke="#2aa0a4" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aT)"/>
  <text x="700" y="336" font-size="9" fill="#1d6b6e" text-anchor="middle">后续相同 key 请求 → 命中 ③ 落盘的缓存项，直接返回，不再回源</text>

  <!-- Panel B: cache-manager -->
  <rect x="30" y="380" width="1090" height="260" rx="14" fill="#e4f4f4" stroke="#bfe1e1" filter="url(#soft)"/>
  <text x="50" y="406" font-size="13" font-weight="700" fill="#1d6b6e">② cache-manager 独立进程 · 淘汰不占请求路径，两条路径各管一头</text>
  <text x="50" y="424" font-size="9.5" fill="#4a8a8c">后台周期性巡检磁盘缓存目录，与 worker 处理请求完全解耦（异步、不阻塞任何请求）</text>
  <line x1="46" y1="436" x2="1104" y2="436" stroke="#bfe1e1" stroke-width="1"/>

  <rect x="50" y="452" width="230" height="170" rx="12" fill="#ffffff" stroke="#bfe1e1" filter="url(#soft)"/>
  <text x="165" y="480" font-size="11.5" font-weight="700" fill="#1d6b6e" text-anchor="middle">cache-manager</text>
  <text x="165" y="502" font-size="9" fill="#4a8a8c" text-anchor="middle">独立于 worker 的后台进程</text>
  <text x="165" y="522" font-size="9" fill="#4a8a8c" text-anchor="middle">周期性巡检磁盘缓存目录</text>
  <text x="165" y="542" font-size="9" fill="#4a8a8c" text-anchor="middle">两条淘汰路径均由它执行</text>
  <text x="165" y="600" font-size="8.5" fill="#8a97ab" text-anchor="middle">不占用请求处理路径</text>

  <rect x="320" y="452" width="800" height="76" rx="12" fill="#ffffff" stroke="#bfe1e1"/>
  <text x="336" y="476" font-size="11" font-weight="700" fill="#1d6b6e" font-family="'SF Mono',ui-monospace,Menlo,monospace">ngx_http_file_cache_expire</text>
  <text x="700" y="476" font-size="10" font-weight="700" fill="#9a5f1c">「用不着」→ 不活跃超时清理</text>
  <text x="336" y="496" font-size="9.5" fill="#4a4a4f">触发：缓存项超过 <tspan font-family="'SF Mono',ui-monospace,Menlo,monospace">inactive</tspan>（由 proxy_cache_path 配置）设定的时长未被访问</text>
  <text x="336" y="514" font-size="9.5" fill="#4a4a4f">处理：cache-manager 巡检到期项，直接从磁盘缓存中移除</text>

  <rect x="320" y="546" width="800" height="76" rx="12" fill="#ffffff" stroke="#bfe1e1"/>
  <text x="336" y="570" font-size="11" font-weight="700" fill="#1d6b6e" font-family="'SF Mono',ui-monospace,Menlo,monospace">ngx_http_file_cache_forced_expire</text>
  <text x="760" y="570" font-size="10" font-weight="700" fill="#9a5f1c">「装不下」→ LRU 式强制淘汰</text>
  <text x="336" y="590" font-size="9.5" fill="#4a4a4f">触发：磁盘缓存总量逼近或超过 <tspan font-family="'SF Mono',ui-monospace,Menlo,monospace">max_size</tspan> / <tspan font-family="'SF Mono',ui-monospace,Menlo,monospace">watermark</tspan> 水位线</text>
  <text x="336" y="608" font-size="9.5" fill="#4a4a4f">处理：按最久未使用顺序强制清理，直到磁盘占用回落到水位以下</text>

  <line x1="280" y1="490" x2="318" y2="490" stroke="#2aa0a4" stroke-width="1.8" marker-end="url(#aT)"/>
  <text x="299" y="482" font-size="8" fill="#4a8a8c" text-anchor="middle">周期检查</text>
  <line x1="280" y1="584" x2="318" y2="584" stroke="#2aa0a4" stroke-width="1.8" marker-end="url(#aT)"/>
  <text x="299" y="576" font-size="8" fill="#4a8a8c" text-anchor="middle">水位检查</text>
</svg>
