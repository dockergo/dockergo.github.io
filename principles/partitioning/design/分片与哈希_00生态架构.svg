<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="700" viewBox="0 0 1140 700" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a5cae"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1140" height="700" fill="#fbfbfd"/>

  <!-- 判型标题带 -->
  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">分片与一致性哈希 · 把一张表拆成可独立搬动的单元，核心取舍是加/减节点时要搬多少数据——映射越间接，搬迁范围越小</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">三个真实项目落在同一根「刚性↔柔性」轴上：Doris 两级静态分片 / Redis Cluster 固定哈希槎 / Hudi 一致性哈希环，按扩缩容代价从高到低排列</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">Doris 两级 Range/List + Hash 分桶</text>
  <line x1="290" y1="80" x2="314" y2="80" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="320" y="84" font-size="10" fill="#3a3a3c">Redis Cluster 固定哈希槎</text>
  <line x1="522" y1="80" x2="546" y2="80" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="552" y="84" font-size="10" fill="#3a3a3c">Hudi 一致性哈希环 bucket 索引</text>
  <text x="1110" y="84" font-size="10" fill="#a1a1a6" text-anchor="end">扩缩容代价谱</text>
  <line x1="30" y1="98" x2="1110" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 刚性↔柔性 轴 -->
  <text x="60" y="118" font-size="10.5" font-weight="700" fill="#6f3ea8">刚性 · 加/减节点代价高，常需搬全量或大范围重写</text>
  <text x="1080" y="118" font-size="10.5" font-weight="700" fill="#2f6b4e" text-anchor="end">柔性 · 只搬被影响的小范围，代价低</text>
  <line x1="60" y1="136" x2="1080" y2="136" stroke="#d7d7dd" stroke-width="1.5"/>
  <circle cx="203" cy="136" r="7" fill="#8a5cae"/>
  <circle cx="570" cy="136" r="7" fill="#4a7fd0"/>
  <circle cx="937" cy="136" r="7" fill="#2f9e6e"/>
  <line x1="203" y1="143" x2="203" y2="160" stroke="#8a5cae" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="570" y1="143" x2="570" y2="160" stroke="#4a7fd0" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="937" y1="143" x2="937" y2="160" stroke="#2f9e6e" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- 列 1 Doris（紫，最刚性） -->
  <rect x="30" y="160" width="346" height="376" rx="14" fill="#f4eefb" stroke="#dcc9ef" filter="url(#soft)"/>
  <text x="46" y="186" font-size="12.5" font-weight="700" fill="#6f3ea8">Doris · 两级静态分片</text>
  <text x="46" y="206" font-size="9.5" fill="#8a5cae">PARTITION（Range/List）+ BUCKETS（Hash）</text>
  <line x1="46" y1="218" x2="360" y2="218" stroke="#dcc9ef" stroke-width="1"/>
  <text x="46" y="240" font-size="9.5" fill="#5a3a7a">① PARTITION BY RANGE|LIST(...)</text>
  <text x="58" y="257" font-size="9" fill="#5a3a7a">第一级：范围 / 枚举分区</text>
  <text x="46" y="277" font-size="9.5" fill="#5a3a7a">② DISTRIBUTED BY HASH(...) BUCKETS n</text>
  <text x="58" y="294" font-size="9" fill="#5a3a7a">第二级：桶数 n 建表时给定</text>
  <text x="46" y="314" font-size="9" fill="#8a5cae">thrift TPartitionType/TDistributionType 枚举显式区分两级</text>

  <text x="46" y="342" font-size="10" font-weight="700" fill="#6f3ea8">搬迁范围示意（方块=数据单元，非精确比例）</text>
  <g>
    <rect x="46" y="352" width="22" height="22" rx="4" fill="#8a5cae"/>
    <rect x="72" y="352" width="22" height="22" rx="4" fill="#8a5cae"/>
    <rect x="98" y="352" width="22" height="22" rx="4" fill="#8a5cae"/>
    <rect x="124" y="352" width="22" height="22" rx="4" fill="#8a5cae"/>
    <rect x="150" y="352" width="22" height="22" rx="4" fill="#8a5cae"/>
    <rect x="176" y="352" width="22" height="22" rx="4" fill="#8a5cae"/>
    <rect x="202" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#dcc9ef"/>
    <rect x="228" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#dcc9ef"/>
  </g>
  <text x="46" y="390" font-size="8.5" fill="#8a97ab">深色 = 需随重分区重写；6/8 示意「多数单元受影响」</text>

  <rect x="46" y="404" width="304" height="46" rx="9" fill="#ffffff" stroke="#dcc9ef"/>
  <text x="60" y="424" font-size="9.5" font-weight="700" fill="#6f3ea8">搬迁范围：扩容通常需重分区</text>
  <text x="60" y="441" font-size="9" fill="#5a3a7a">代价最高（三者中）</text>
  <text x="46" y="468" font-size="8.5" fill="#8a97ab">新增 Range 分区本身较轻；但既有分区要重新均衡</text>
  <text x="46" y="484" font-size="8.5" fill="#8a97ab">bucket 分布到新节点，通常要整段重写</text>
  <text x="46" y="522" font-size="8.5" fill="#a1a1a6">→ 详见 图解点 P3</text>

  <!-- 列 2 Redis（蓝，居中） -->
  <rect x="397" y="160" width="346" height="376" rx="14" fill="#eaf1fb" stroke="#c6d9f2" filter="url(#soft)"/>
  <text x="413" y="186" font-size="12.5" font-weight="700" fill="#20375e">Redis Cluster · 固定哈希槎</text>
  <text x="413" y="206" font-size="9.5" fill="#3a4a63">CLUSTER_SLOTS = 16384，槎总数恒定</text>
  <line x1="413" y1="218" x2="727" y2="218" stroke="#c6d9f2" stroke-width="1"/>
  <text x="413" y="240" font-size="9.5" fill="#3a4a63">① keyHashSlot：CRC16 求槎位</text>
  <text x="425" y="257" font-size="9" fill="#3a4a63">{...} hash-tag 特殊处理，强制多 key 同槎</text>
  <text x="413" y="277" font-size="9.5" fill="#3a4a63">② CLUSTER_SLOTS = 1&lt;&lt;14 = 16384</text>
  <text x="425" y="294" font-size="9" fill="#3a4a63">槎总数固定，不随节点增减而改变</text>
  <text x="413" y="314" font-size="9" fill="#5a7099">节点变动搬的是「槎」（及其归属 key），非整表</text>

  <text x="413" y="342" font-size="10" font-weight="700" fill="#20375e">搬迁范围示意（方块=数据单元，非精确比例）</text>
  <g>
    <rect x="413" y="352" width="22" height="22" rx="4" fill="#4a7fd0"/>
    <rect x="439" y="352" width="22" height="22" rx="4" fill="#4a7fd0"/>
    <rect x="465" y="352" width="22" height="22" rx="4" fill="#4a7fd0"/>
    <rect x="491" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#c6d9f2"/>
    <rect x="517" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#c6d9f2"/>
    <rect x="543" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#c6d9f2"/>
    <rect x="569" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#c6d9f2"/>
    <rect x="595" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#c6d9f2"/>
  </g>
  <text x="413" y="390" font-size="8.5" fill="#8a97ab">深色 = 被迁移槎覆盖的单元；3/8 示意「部分槎搬迁」</text>

  <rect x="413" y="404" width="304" height="46" rx="9" fill="#ffffff" stroke="#c6d9f2"/>
  <text x="427" y="424" font-size="9.5" font-weight="700" fill="#20375e">搬迁范围：槎迁移，槎总数不变</text>
  <text x="427" y="441" font-size="9" fill="#3a4a63">代价居中（三者中）</text>
  <text x="413" y="468" font-size="8.5" fill="#8a97ab">迁移期新旧路由并存：MOVED 永久重定向，</text>
  <text x="413" y="484" font-size="8.5" fill="#8a97ab">ASK（需先 ASKING）覆盖临时窗口</text>
  <text x="413" y="522" font-size="8.5" fill="#a1a1a6">→ 详见 图解点 P1</text>

  <!-- 列 3 Hudi（绿，最柔性） -->
  <rect x="764" y="160" width="346" height="376" rx="14" fill="#eaf6f0" stroke="#bfe3d1" filter="url(#soft)"/>
  <text x="780" y="186" font-size="12.5" font-weight="700" fill="#2f6b4e">Hudi · 一致性哈希环 bucket 索引</text>
  <text x="780" y="206" font-size="9.5" fill="#3f8a63">动态 split / merge，只动被触及的 bucket</text>
  <line x1="780" y1="218" x2="1094" y2="218" stroke="#bfe3d1" stroke-width="1"/>
  <text x="780" y="240" font-size="9.5" fill="#2f6b4e">① HoodieConsistentHashingMetadata</text>
  <text x="792" y="257" font-size="9" fill="#2f6b4e">numBuckets/seqNo/List&lt;ConsistentHashingNode&gt;</text>
  <text x="780" y="277" font-size="9.5" fill="#2f6b4e">② splitBucket() / mergeBucket()</text>
  <text x="792" y="294" font-size="9" fill="#2f6b4e">超 splitSize 拆分；相邻低于 mergeSize 合并</text>
  <text x="780" y="314" font-size="9" fill="#3f8a63">执行走 SingleSparkJobConsistentHashingExecutionStrategy</text>

  <text x="780" y="342" font-size="10" font-weight="700" fill="#2f6b4e">搬迁范围示意（方块=数据单元，非精确比例）</text>
  <g>
    <rect x="780" y="352" width="22" height="22" rx="4" fill="#2f9e6e"/>
    <rect x="806" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#bfe3d1"/>
    <rect x="832" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#bfe3d1"/>
    <rect x="858" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#bfe3d1"/>
    <rect x="884" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#bfe3d1"/>
    <rect x="910" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#bfe3d1"/>
    <rect x="936" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#bfe3d1"/>
    <rect x="962" y="352" width="22" height="22" rx="4" fill="#fff" stroke="#bfe3d1"/>
  </g>
  <text x="780" y="390" font-size="8.5" fill="#8a97ab">深色 = 被 split/merge 触及的相邻 bucket；1/8 示意「范围最小」</text>

  <rect x="780" y="404" width="304" height="46" rx="9" fill="#ffffff" stroke="#bfe3d1"/>
  <text x="794" y="424" font-size="9.5" font-weight="700" fill="#2f6b4e">搬迁范围：仅相邻 bucket</text>
  <text x="794" y="441" font-size="9" fill="#3f8a63">代价最低（三者中）</text>
  <text x="780" y="468" font-size="8.5" fill="#8a97ab">split/merge 由 clustering 计划生成，经</text>
  <text x="780" y="484" font-size="8.5" fill="#8a97ab">BaseConsistentHashingBucketClusteringPlanStrategy 调度</text>
  <text x="780" y="522" font-size="8.5" fill="#a1a1a6">→ 详见 图解点 P2</text>

  <!-- 底部：核心权衡带 -->
  <rect x="30" y="556" width="1080" height="112" rx="13" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="582" font-size="11" font-weight="700" fill="#1d1d1f">扩缩容代价排序（按已核实事实排列，同一取舍轴的三个真实落点）</text>
  <text x="48" y="606" font-size="10" fill="#4a4a4f"><tspan font-weight="700" fill="#6f3ea8">Doris 两级静态</tspan>代价最高——扩容后要让既有分区的桶重新均衡，通常需重分区；<tspan font-weight="700" fill="#20375e">Redis 固定哈希槎</tspan>居中——只搬被迁移的槎，槎总数 16384 恒定；<tspan font-weight="700" fill="#2f6b4e">Hudi 一致性哈希环</tspan>最低——只动 split/merge 触及的相邻 bucket。</text>
  <text x="48" y="630" font-size="9.5" fill="#6e6e73">三者的分片单元都是「key 与节点之间的一层间接映射」（槎 / bucket / 分区+桶），差异在这层映射有多细、多能局部调整——映射越细粒度、越能局部增减，加减节点时牵动的范围就越小。</text>
  <text x="48" y="652" font-size="9" fill="#a1a1a6">详细机制见 P1（Redis）/ P2（Hudi）/ P3（Doris）；三者横向对比见 CMP 对比图。</text>
</svg>
