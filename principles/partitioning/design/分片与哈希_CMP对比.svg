<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="660" viewBox="0 0 1140 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1140" height="660" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">分片模型横向对比 · Redis Cluster 固定哈希槎 vs Hudi 一致性哈希环 vs Doris 两级静态分片 —— 都在解「key 到物理位置的映射」，分歧在这层映射有多细、多能局部调整</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">同一目标下的三个真实落点；下表按 4 个维度横向对照，核心分歧集中在「加节点时到底搬多大范围」</text>

  <!-- 列头 -->
  <rect x="30" y="72" width="176" height="40" rx="9" fill="#eef0f3" stroke="#e4e7ec"/>
  <text x="118" y="97" font-size="12" font-weight="700" fill="#4a4a4f" text-anchor="middle">对比维度</text>
  <rect x="222" y="72" width="286" height="40" rx="9" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="365" y="97" font-size="12.5" font-weight="800" fill="#20375e" text-anchor="middle">Redis Cluster</text>
  <rect x="514" y="72" width="286" height="40" rx="9" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="657" y="97" font-size="12.5" font-weight="800" fill="#2f6b4e" text-anchor="middle">Hudi</text>
  <rect x="806" y="72" width="286" height="40" rx="9" fill="#f4eefb" stroke="#dcc9ef"/>
  <text x="949" y="97" font-size="12.5" font-weight="800" fill="#6f3ea8" text-anchor="middle">Doris</text>

  <!-- 行1 分片单元的粒度 -->
  <rect x="30" y="120" width="176" height="112" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="150" font-size="11.5" font-weight="700" fill="#1d1d1f">① 分片单元的粒度</text>
  <text x="46" y="172" font-size="9" fill="#8a97ab">最小可独立</text>
  <text x="46" y="186" font-size="9" fill="#8a97ab">搬动的单元是什么</text>
  <rect x="222" y="120" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="238" y="146" font-size="10" font-weight="700" fill="#20375e">槎（slot），总数固定 16384</text>
  <text x="238" y="166" font-size="9.5" fill="#4a4a4f">keyHashSlot 用 CRC16 把 key 映射到</text>
  <text x="238" y="182" font-size="9.5" fill="#4a4a4f">0~16383 的固定槎位；{...} hash-tag</text>
  <text x="238" y="198" font-size="9.5" fill="#4a4a4f">可强制多 key 落同一槎。</text>
  <text x="238" y="218" font-size="9" fill="#8a97ab">槎总数恒定，不随节点数变化</text>
  <rect x="514" y="120" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="530" y="146" font-size="10" font-weight="700" fill="#2f6b4e">bucket，数量动态可变</text>
  <text x="530" y="166" font-size="9.5" fill="#4a4a4f">HoodieConsistentHashingMetadata 记录</text>
  <text x="530" y="182" font-size="9.5" fill="#4a4a4f">numBuckets/seqNo/节点列表；bucket 是</text>
  <text x="530" y="198" font-size="9.5" fill="#4a4a4f">环上一段区间，可 split/merge。</text>
  <text x="530" y="218" font-size="9" fill="#8a97ab">粒度随 split/merge 持续细化或粗化</text>
  <rect x="806" y="120" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="822" y="146" font-size="10" font-weight="700" fill="#6f3ea8">两级：分区 + 桶，均静态声明</text>
  <text x="822" y="166" font-size="9.5" fill="#4a4a4f">PARTITION BY RANGE|LIST(...) 定第一级；</text>
  <text x="822" y="182" font-size="9.5" fill="#4a4a4f">DISTRIBUTED BY HASH(...) BUCKETS n 定</text>
  <text x="822" y="198" font-size="9.5" fill="#4a4a4f">第二级，n 建表时给定。</text>
  <text x="822" y="218" font-size="9" fill="#8a97ab">两级模型由 thrift 两个独立枚举确认</text>

  <!-- 行2 加节点时的搬迁范围 -->
  <rect x="30" y="236" width="176" height="112" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="266" font-size="11.5" font-weight="700" fill="#1d1d1f">② 加节点时的搬迁范围</text>
  <text x="46" y="288" font-size="9" fill="#8a97ab">这是三者最核心</text>
  <text x="46" y="302" font-size="9" fill="#8a97ab">的分歧点</text>
  <rect x="222" y="236" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="238" y="262" font-size="10" font-weight="700" fill="#20375e">搬被迁移的槎，槎总数不变</text>
  <text x="238" y="282" font-size="9.5" fill="#4a4a4f">resharding 只搬部分槎（及其 key）；</text>
  <text x="238" y="298" font-size="9.5" fill="#4a4a4f">迁移期 MOVED（永久重定向）与 ASK</text>
  <text x="238" y="314" font-size="9.5" fill="#4a4a4f">（需先 ASKING）并存过渡。</text>
  <text x="238" y="332" font-size="9" font-weight="700" fill="#3a4a63">代价：居中</text>
  <rect x="514" y="236" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="530" y="262" font-size="10" font-weight="700" fill="#2f6b4e">只动被触及的相邻 bucket</text>
  <text x="530" y="282" font-size="9.5" fill="#4a4a4f">splitBucket()（超 splitSize 触发）/</text>
  <text x="530" y="298" font-size="9.5" fill="#4a4a4f">mergeBucket()（相邻低于 mergeSize 触发）</text>
  <text x="530" y="314" font-size="9.5" fill="#4a4a4f">只重写涉及的 bucket，其余不动。</text>
  <text x="530" y="332" font-size="9" font-weight="700" fill="#3f8a63">代价：三者中最低</text>
  <rect x="806" y="236" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="822" y="262" font-size="10" font-weight="700" fill="#6f3ea8">通常需重分区，重写整段数据</text>
  <text x="822" y="282" font-size="9.5" fill="#4a4a4f">新增 Range 分区本身较轻，但既有</text>
  <text x="822" y="298" font-size="9.5" fill="#4a4a4f">分区的桶数已固定，扩容后要让桶在</text>
  <text x="822" y="314" font-size="9.5" fill="#4a4a4f">更多节点间重新均衡，常需整段重写。</text>
  <text x="822" y="332" font-size="9" font-weight="700" fill="#5a3a7a">代价：三者中最高</text>

  <!-- 行3 路由信息的复杂度 -->
  <rect x="30" y="352" width="176" height="112" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="382" font-size="11.5" font-weight="700" fill="#1d1d1f">③ 路由信息的复杂度</text>
  <text x="46" y="404" font-size="9" fill="#8a97ab">谁记录「单元→</text>
  <text x="46" y="418" font-size="9" fill="#8a97ab">节点」的映射</text>
  <rect x="222" y="352" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="238" y="378" font-size="10" font-weight="700" fill="#20375e">客户端侧路由表 + 服务端重定向</text>
  <text x="238" y="398" font-size="9.5" fill="#4a4a4f">getNodeByQuery 判定 MOVED/ASK，</text>
  <text x="238" y="414" font-size="9.5" fill="#4a4a4f">clusterRedirectClient 执行跳转；客户端</text>
  <text x="238" y="430" font-size="9.5" fill="#4a4a4f">缓存槎→节点表，MOVED 才更新它。</text>
  <rect x="514" y="352" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="530" y="378" font-size="10" font-weight="700" fill="#2f6b4e">元数据对象记录环的完整状态</text>
  <text x="530" y="398" font-size="9.5" fill="#4a4a4f">HoodieConsistentHashingMetadata 一份</text>
  <text x="530" y="414" font-size="9.5" fill="#4a4a4f">对象即完整路由：version/instant/</text>
  <text x="530" y="430" font-size="9.5" fill="#4a4a4f">numBuckets/seqNo，由 seqNo 做版本。</text>
  <rect x="806" y="352" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="822" y="378" font-size="10" font-weight="700" fill="#6f3ea8">两级枚举 + 静态元数据表</text>
  <text x="822" y="398" font-size="9.5" fill="#4a4a4f">TPartitionType 定分区归属，</text>
  <text x="822" y="414" font-size="9.5" fill="#4a4a4f">TDistributionType 定分桶归属；两级</text>
  <text x="822" y="430" font-size="9.5" fill="#4a4a4f">都由 FE 元数据显式管理，非算出。</text>

  <!-- 行4 典型适用场景 -->
  <rect x="30" y="468" width="176" height="112" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="498" font-size="11.5" font-weight="700" fill="#1d1d1f">④ 典型适用场景</text>
  <text x="46" y="520" font-size="9" fill="#8a97ab">哪种负载形态</text>
  <text x="46" y="534" font-size="9" fill="#8a97ab">最适配</text>
  <rect x="222" y="468" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="238" y="494" font-size="10" font-weight="700" fill="#20375e">KV 缓存 / 存储集群</text>
  <text x="238" y="514" font-size="9.5" fill="#4a4a4f">节点数变化相对不频繁，槎级别的</text>
  <text x="238" y="530" font-size="9.5" fill="#4a4a4f">迁移粒度足够，路由表简单易实现。</text>
  <rect x="514" y="468" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="530" y="494" font-size="10" font-weight="700" fill="#2f6b4e">数据湖表写入侧动态扩缩容</text>
  <text x="530" y="514" font-size="9.5" fill="#4a4a4f">写入热点随数据增长持续变化，需要</text>
  <text x="530" y="530" font-size="9.5" fill="#4a4a4f">按需细粒度调整，异步 clustering 执行。</text>
  <rect x="806" y="468" width="286" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="822" y="494" font-size="10" font-weight="700" fill="#6f3ea8">OLAP 宽表，分区+分桶双语义</text>
  <text x="822" y="514" font-size="9.5" fill="#4a4a4f">按时间/枚举分区管理生命周期，</text>
  <text x="822" y="530" font-size="9.5" fill="#4a4a4f">分区内哈希分桶服务并行扫描。</text>

  <!-- 底部一句话 -->
  <rect x="30" y="596" width="1080" height="48" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="618" font-size="10.5" font-weight="700" fill="#1d1d1f">一句话</text>
  <text x="106" y="618" font-size="10" fill="#4a4a4f">三者都是「key 到物理位置」之间的一层间接映射，差异只在这层映射的可调粒度——</text>
  <text x="48" y="636" font-size="9.5" fill="#4a4a4f"><tspan font-weight="700" fill="#6f3ea8">Doris 两级静态</tspan>扩容代价最高（常需重分区）→ <tspan font-weight="700" fill="#20375e">Redis 固定哈希槎</tspan>居中（槎搬迁但槎总数不变）→ <tspan font-weight="700" fill="#2f6b4e">Hudi 一致性哈希环</tspan>最低（只动相邻 bucket），映射越能局部动态调整，扩缩容代价越低。</text>
</svg>
