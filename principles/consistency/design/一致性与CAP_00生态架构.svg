<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="780" viewBox="0 0 1140 780" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#c99a3a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a97ab"/></marker>
  </defs>
  <rect width="1140" height="780" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">一致性不是有没有，是「多强」· 线性一致 → 顺序一致 → 最终一致是一条频谱，落点由项目愿意为正确性支付多少延迟决定</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">同为分布式存储，etcd / ZooKeeper / ClickHouse 因架构选择不同，分别落在频谱的三个不同位置——强弱之分不是优劣之分，是取舍之分</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">etcd（线性一致）</text>
  <line x1="230" y1="80" x2="254" y2="80" stroke="#c99a3a" stroke-width="2" marker-end="url(#aA)"/>
  <text x="260" y="84" font-size="10" fill="#3a3a3c">ZooKeeper（顺序一致）</text>
  <line x1="470" y1="80" x2="494" y2="80" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="500" y="84" font-size="10" fill="#3a3a3c">ClickHouse（最终一致）</text>
  <text x="1110" y="86" font-size="10" fill="#a1a1a6" text-anchor="end">CAP / PACELC 落点</text>
  <line x1="30" y1="98" x2="1110" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 频谱主面板 -->
  <rect x="30" y="110" width="1080" height="390" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="52" y="136" font-size="12.5" font-weight="700" fill="#1d1d1f">① 一致性频谱 · 同一条轴，左强右弱——落点越靠左，为正确性多付的延迟/协调代价越高</text>
  <text x="52" y="154" font-size="9" fill="#8a97ab">纵轴为示意高度（正确性代价），非精确度量；三个真实项目分别落在三个典型强度点上</text>

  <!-- 三级台阶（landscape） -->
  <rect x="90" y="168" width="300" height="114" rx="10" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="240" y="194" font-size="12.5" font-weight="700" fill="#20375e" text-anchor="middle">线性一致 Linearizable</text>
  <text x="240" y="213" font-size="10" fill="#3a4a63" text-anchor="middle">etcd · ReadIndex</text>
  <text x="240" y="232" font-size="8.5" fill="#5a7099" text-anchor="middle">多数派心跳确认身份 + 等 applied 追平</text>

  <rect x="410" y="212" width="300" height="70" rx="10" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="560" y="234" font-size="12" font-weight="700" fill="#8a6417" text-anchor="middle">顺序一致 Sequential</text>
  <text x="560" y="252" font-size="10" fill="#7a5a1a" text-anchor="middle">ZooKeeper · ZAB</text>
  <text x="560" y="268" font-size="8.5" fill="#a98a3a" text-anchor="middle">zxid=⟨epoch,counter⟩ 全局定序</text>

  <rect x="730" y="246" width="300" height="36" rx="8" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="880" y="268" font-size="11.5" font-weight="700" fill="#2f6b4e" text-anchor="middle">最终一致 Eventual · ClickHouse</text>

  <!-- 基线 -->
  <line x1="70" y1="282" x2="1086" y2="282" stroke="#d7d7dd" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="1084" y="300" font-size="9" fill="#a1a1a6" text-anchor="end">一致性强度递减 / 可用性优先级递增 →</text>

  <!-- 连接线 -->
  <line x1="240" y1="282" x2="240" y2="316" stroke="#4a7fd0" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="560" y1="282" x2="560" y2="316" stroke="#c99a3a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="880" y1="282" x2="880" y2="316" stroke="#2f9e6e" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- 机制详情卡 -->
  <rect x="90" y="316" width="300" height="170" rx="10" fill="#ffffff" stroke="#c6d9f2"/>
  <text x="106" y="340" font-size="11.5" font-weight="700" fill="#20375e">etcd · 线性一致读</text>
  <line x1="106" y1="350" x2="374" y2="350" stroke="#eef0f3" stroke-width="1"/>
  <text x="106" y="368" font-size="9.5" fill="#3a4a63">sendReadIndex 向 Raft 请当前 commit index，</text>
  <text x="106" y="386" font-size="9.5" fill="#3a4a63">一次心跳确认自己仍是 leader（不复制这次读）</text>
  <text x="106" y="404" font-size="9.5" fill="#3a4a63">等本地 applied index 追上 → 读本地 MVCC</text>
  <text x="106" y="424" font-size="8.5" fill="#5a7099">Serializable flag 可退化为直接读本地：更快但可能读旧</text>
  <text x="106" y="452" font-size="9" font-weight="700" fill="#20375e">代价：默认读付一轮多数派心跳 RTT</text>

  <rect x="410" y="316" width="300" height="170" rx="10" fill="#ffffff" stroke="#ecd6a8"/>
  <text x="426" y="340" font-size="11.5" font-weight="700" fill="#8a6417">ZooKeeper · ZAB 广播</text>
  <line x1="426" y1="350" x2="694" y2="350" stroke="#eef0f3" stroke-width="1"/>
  <text x="426" y="368" font-size="9.5" fill="#7a5a1a">Proposal → Ack → Commit 两阶段广播</text>
  <text x="426" y="386" font-size="9.5" fill="#7a5a1a">zxid=⟨epoch,counter⟩ 给所有写操作定全局序</text>
  <text x="426" y="404" font-size="9.5" fill="#7a5a1a">写必须经 leader，follower 按 zxid 顺序应用</text>
  <text x="426" y="424" font-size="8.5" fill="#a98a3a">保证「同一操作顺序」，不是逐读线性一致</text>
  <text x="426" y="452" font-size="9" font-weight="700" fill="#8a6417">代价：leader 广播 + 过半 ack 才提交</text>

  <rect x="730" y="316" width="300" height="170" rx="10" fill="#ffffff" stroke="#bfe3d1"/>
  <text x="746" y="340" font-size="11.5" font-weight="700" fill="#2f6b4e">ClickHouse · 多主异步复制</text>
  <line x1="746" y1="350" x2="1014" y2="350" stroke="#eef0f3" stroke-width="1"/>
  <text x="746" y="368" font-size="9.5" fill="#3f8a63">INSERT / ALTER 可发给任意可用副本</text>
  <text x="746" y="386" font-size="9.5" fill="#3f8a63">该副本本地处理后，异步扩散给其余副本</text>
  <text x="746" y="404" font-size="9.5" fill="#3f8a63">无 leader 选举 / 无主节点指定 / 无写转发</text>
  <text x="746" y="424" font-size="8.5" fill="#5a9078">Keeper 只管协调元数据，不代理写流量、不参与 SELECT</text>
  <text x="746" y="452" font-size="9" font-weight="700" fill="#2f6b4e">代价：一致性窗口 = 副本同步延迟</text>

  <!-- CAP / PACELC 落点行 -->
  <rect x="30" y="516" width="340" height="120" rx="12" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="46" y="540" font-size="12" font-weight="700" fill="#20375e">etcd → CP · 线性一致</text>
  <text x="46" y="560" font-size="9.5" fill="#3a4a63">读必须先确认 leader 身份（一轮多数派心跳）；</text>
  <text x="46" y="578" font-size="9.5" fill="#3a4a63">心跳收不到多数派响应 → 读阻塞，不返回旧值。</text>
  <text x="46" y="600" font-size="8.5" fill="#5a7099">正确性优先于可用性——Raft/etcd 的默认取舍。</text>

  <rect x="400" y="516" width="340" height="120" rx="12" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="416" y="540" font-size="12" font-weight="700" fill="#8a6417">ZooKeeper → CP · 顺序一致</text>
  <text x="416" y="560" font-size="9.5" fill="#7a5a1a">所有写必须经 leader 广播、过半 ack 才 commit；</text>
  <text x="416" y="578" font-size="9.5" fill="#7a5a1a">保证的是全局操作顺序，不是逐读线性一致。</text>
  <text x="416" y="600" font-size="8.5" fill="#a98a3a">同样把正确性放在可用性之前，但保证粒度不同于 etcd。</text>

  <rect x="770" y="516" width="340" height="120" rx="12" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="786" y="540" font-size="12" font-weight="700" fill="#2f6b4e">ClickHouse → AP 倾向 · 最终一致</text>
  <text x="786" y="560" font-size="9.5" fill="#3f8a63">任意副本可写，无 leader 选举 / 写转发；</text>
  <text x="786" y="578" font-size="9.5" fill="#3f8a63">本地处理后异步扩散，不等其余副本确认。</text>
  <text x="786" y="600" font-size="8.5" fill="#5a9078">可用性与延迟优先，一致性窗口=副本同步延迟。</text>

  <!-- 底部一句话 -->
  <rect x="30" y="652" width="1080" height="100" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="678" font-size="10.5" font-weight="700" fill="#1d1d1f">一句话</text>
  <text x="110" y="678" font-size="10" fill="#4a4a4f">一致性不是有没有，是「多强」——从线性一致到最终一致是一条频谱，项目在频谱上的落点由它愿意为正确性支付多少延迟决定。</text>
  <text x="110" y="700" font-size="10" fill="#4a4a4f"><tspan font-weight="700" fill="#20375e">etcd</tspan> 用一次心跳换线性一致；<tspan font-weight="700" fill="#8a6417">ZooKeeper</tspan> 用全局广播序换顺序一致；<tspan font-weight="700" fill="#2f6b4e">ClickHouse</tspan> 放弃写路径协调换可用性与延迟。</text>
  <text x="110" y="721" font-size="9" fill="#8a97ab">三者都是「分布式存储」，但架构选择把它们放在频谱的三个不同位置——这正是 CAP / PACELC 权衡的具体体现。</text>
</svg>
