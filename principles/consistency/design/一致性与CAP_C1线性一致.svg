<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="650" viewBox="0 0 1150 650" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
  </defs>
  <rect width="1150" height="650" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">etcd ReadIndex 线性一致读 · 读不写日志，靠一次心跳确认「我仍是 leader」+ 等本地 apply 追平，即可安全返回</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">server/etcdserver/read/read.go：LinearizableReadLoop → sendReadIndex → 等 AppliedIndex() 追上 readIndex → 读本地 MVCC；这是 etcd 默认读语义</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">默认路径（线性一致）</text>
  <line x1="240" y1="80" x2="264" y2="80" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="270" y="84" font-size="10" fill="#3a3a3c">多数派心跳确认 leader 身份</text>
  <line x1="500" y1="80" x2="524" y2="80" stroke="#d1544a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aR)"/>
  <text x="530" y="84" font-size="10" fill="#3a3a3c">Serializable 退化路径（跳过确认）</text>
  <line x1="30" y1="98" x2="1120" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 左：默认线性一致读路径 -->
  <rect x="30" y="108" width="680" height="368" rx="14" fill="#eaf1fb" stroke="#c6d9f2" filter="url(#soft)"/>
  <text x="52" y="136" font-size="13" font-weight="700" fill="#20375e">默认路径 · LinearizableReadLoop（default，非 Serializable 请求）</text>

  <rect x="52" y="152" width="636" height="52" rx="9" fill="#fff" stroke="#c6d9f2"/>
  <text x="66" y="174" font-size="10.5" fill="#2f4a70"><tspan font-weight="700">① 读请求进入 LinearizableReadLoop</tspan></text>
  <text x="66" y="192" font-size="9" fill="#5a7099">客户端发起读，未带 Serializable flag → 走线性一致路径</text>

  <line x1="370" y1="204" x2="370" y2="220" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>

  <rect x="52" y="224" width="636" height="60" rx="9" fill="#fff" stroke="#c6d9f2"/>
  <text x="66" y="246" font-size="10.5" fill="#2f4a70"><tspan font-weight="700">② sendReadIndex</tspan> 向 Raft 请当前 commit index</text>
  <text x="66" y="264" font-size="9" fill="#5a7099">发起一轮心跳，目的只是确认自己仍是 leader —— 不复制这次读本身，读不进日志</text>

  <line x1="370" y1="284" x2="370" y2="300" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>

  <rect x="52" y="304" width="636" height="56" rx="9" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="66" y="326" font-size="10.5" fill="#2f6b4e"><tspan font-weight="700">③ 多数派响应心跳</tspan> → 确认「此刻我仍是 leader」，记录 readIndex = 当前 commit index</text>
  <text x="66" y="344" font-size="9" fill="#3f8a63">若心跳收不到多数派响应，说明可能已失去 leader 身份 → 读阻塞，不返回旧值</text>

  <line x1="370" y1="360" x2="370" y2="376" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>

  <rect x="52" y="380" width="636" height="52" rx="9" fill="#fff" stroke="#c6d9f2"/>
  <text x="66" y="402" font-size="10.5" fill="#2f4a70"><tspan font-weight="700">④ 等待本地 AppliedIndex() ≥ readIndex</tspan></text>
  <text x="66" y="420" font-size="9" fill="#5a7099">本地状态机可能还没回放到 readIndex 这一点，必须先追平</text>

  <line x1="370" y1="432" x2="370" y2="448" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>

  <rect x="52" y="452" width="636" height="0" fill="none"/>
  <text x="66" y="468" font-size="10.5" font-weight="700" fill="#2f6b4e">⑤ 读本地 MVCC store 返回 —— 无新日志、无落盘</text>

  <!-- 右：Serializable 退化路径 -->
  <rect x="726" y="108" width="394" height="368" rx="14" fill="#fbe6e3" stroke="#e8a79f" filter="url(#soft)"/>
  <text x="748" y="136" font-size="13" font-weight="700" fill="#8a4038">Serializable flag · 退化路径（可选，非默认）</text>

  <rect x="748" y="152" width="350" height="56" rx="9" fill="#fff" stroke="#e8a79f"/>
  <text x="762" y="174" font-size="10.5" fill="#8a4038"><tspan font-weight="700">① 请求显式带 Serializable flag</tspan></text>
  <text x="762" y="192" font-size="9" fill="#b06a60">客户端主动选择放弃线性一致保证</text>

  <line x1="923" y1="208" x2="923" y2="224" stroke="#d1544a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aR)"/>

  <rect x="748" y="228" width="350" height="56" rx="9" fill="#fff" stroke="#e8a79f"/>
  <text x="762" y="250" font-size="10.5" fill="#8a4038"><tspan font-weight="700">② 跳过 sendReadIndex 确认</tspan></text>
  <text x="762" y="268" font-size="9" fill="#b06a60">不发心跳、不等多数派响应</text>

  <line x1="923" y1="284" x2="923" y2="300" stroke="#d1544a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aR)"/>

  <rect x="748" y="304" width="350" height="56" rx="9" fill="#fff" stroke="#e8a79f"/>
  <text x="762" y="326" font-size="10.5" fill="#8a4038"><tspan font-weight="700">③ 直接读本地 MVCC</tspan></text>
  <text x="762" y="344" font-size="9" fill="#b06a60">更快，但本地 apply 进度可能落后于最新已提交写</text>

  <rect x="748" y="380" width="350" height="52" rx="9" fill="#fbeceb" stroke="#e8a79f"/>
  <text x="762" y="402" font-size="10" font-weight="700" fill="#8a4038">代价：可能读旧（stale read）</text>
  <text x="762" y="418" font-size="8.5" fill="#b06a60">用延迟换正确性，与默认路径正好相反</text>

  <!-- 底部总结 -->
  <rect x="30" y="494" width="1090" height="140" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="52" y="520" font-size="12" font-weight="700" fill="#1d1d1f">为什么这样就是「线性一致」</text>
  <line x1="52" y1="530" x2="1108" y2="530" stroke="#eef0f3" stroke-width="1"/>
  <text x="52" y="554" font-size="10.5" font-weight="700" fill="#20375e">正确性来源</text>
  <text x="160" y="554" font-size="10" fill="#4a4a4f">多数派心跳证明没有更高任期的新 leader 已提交更新的写 —— readIndex 之前的所有已提交写对本次读可见。</text>
  <text x="52" y="580" font-size="10.5" font-weight="700" fill="#2f6b4e">apply 屏障</text>
  <text x="160" y="580" font-size="10" fill="#4a4a4f">即便已确认 leader 身份，也必须等本地 AppliedIndex() 追平 readIndex —— 否则会读到「已提交但本机尚未回放」的旧值。</text>
  <text x="52" y="606" font-size="10.5" font-weight="700" fill="#8a4038">代价与退路</text>
  <text x="160" y="606" font-size="10" fill="#4a4a4f">默认路径每次读付一轮心跳 RTT 的延迟；Serializable flag 提供了一条更快但可能读旧的退化路径，由调用方显式选择。</text>
</svg>
