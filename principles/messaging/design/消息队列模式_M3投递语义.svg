<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="660" viewBox="0 0 1150 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a5cae"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#c99a3a"/></marker>
  </defs>
  <rect width="1150" height="660" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">Kafka 投递语义 · 幂等 Producer 靠 PID+序列号去重把网络重试变成"至多一次生效"，事务 Producer 加跨分区原子写 —— 两层叠加才是 exactly-once</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">幂等只解决"同一条消息的重复写"；事务解决"多个分区的写要么全生效要么全不生效"；两者是正交的两层，缺一都不是完整的 exactly-once</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">幂等去重路径</text>
  <line x1="220" y1="80" x2="244" y2="80" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="250" y="84" font-size="10" fill="#3a3a3c">事务提交路径</text>
  <line x1="410" y1="80" x2="434" y2="80" stroke="#d1544a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aR)"/>
  <text x="440" y="84" font-size="10" fill="#3a3a3c">拒绝 / 不可见</text>
  <text x="1120" y="86" font-size="10" fill="#a1a1a6" text-anchor="end">Kafka Producer 内核机制</text>
  <line x1="30" y1="98" x2="1120" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- Panel A: 幂等 Producer -->
  <rect x="30" y="112" width="530" height="418" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="52" y="138" font-size="13" font-weight="700" fill="#6f3ea8">① 幂等 Producer · PID + Sequence Number 去重</text>
  <text x="52" y="156" font-size="9" fill="#8a97ab">解决"网络重试导致同一条消息写两次"</text>

  <rect x="52" y="170" width="486" height="46" rx="9" fill="#f4eefb" stroke="#dcc9ef"/>
  <text x="66" y="188" font-size="9.5" font-weight="700" fill="#6f3ea8">初始化：broker 分配 PID=7042，本次会话 epoch=3</text>
  <text x="66" y="204" font-size="9" fill="#8a5cae">每个 partition 独立维护"下一个期望序列号"</text>

  <line x1="295" y1="216" x2="295" y2="238" stroke="#8a5cae" stroke-width="1.8" marker-end="url(#aP)"/>

  <rect x="52" y="242" width="486" height="60" rx="9" fill="#f4eefb" stroke="#dcc9ef"/>
  <text x="66" y="262" font-size="9.5" font-weight="700" fill="#6f3ea8">ProducerAppendInfo.checkSequence(partition P0)</text>
  <text x="66" y="280" font-size="9" fill="#5a3a7a">校验本批次 seq 是否 = lastSeq(P0) + 1（严格递增）</text>
  <text x="66" y="296" font-size="9" fill="#5a3a7a">同时核对 epoch 与已记录 epoch 一致</text>

  <line x1="150" y1="302" x2="150" y2="326" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <line x1="450" y1="302" x2="450" y2="326" stroke="#c99a3a" stroke-width="1.8" stroke-dasharray="4 3"/>

  <rect x="52" y="330" width="220" height="70" rx="9" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="162" y="350" font-size="10" font-weight="700" fill="#2f6b4e" text-anchor="middle">seq = lastSeq+1</text>
  <text x="162" y="368" font-size="9" fill="#3f8a63" text-anchor="middle">首次出现，正常 append</text>
  <text x="162" y="386" font-size="9" fill="#3f8a63" text-anchor="middle">lastSeq(P0) 前进 1</text>

  <rect x="308" y="330" width="230" height="70" rx="9" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="423" y="350" font-size="10" font-weight="700" fill="#8a6417" text-anchor="middle">seq ≤ lastSeq（重复批次）</text>
  <text x="423" y="368" font-size="9" fill="#7a5a1a" text-anchor="middle">ProducerStateEntry.findDuplicateBatch</text>
  <text x="423" y="386" font-size="9" fill="#7a5a1a" text-anchor="middle">命中缓存 → 直接回放原 ack，不重复写</text>

  <line x1="423" y1="400" x2="423" y2="422" stroke="#c99a3a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aA)"/>

  <rect x="52" y="412" width="486" height="50" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="66" y="432" font-size="9.5" font-weight="700" fill="#4a4a4f">效果：at-least-once 的网络重试 → 落地效果是 exactly-once append</text>
  <text x="66" y="448" font-size="8.5" fill="#8a97ab">这只保证"单条消息不重复"，不保证"多分区写的原子性"（那是②的职责）</text>

  <rect x="52" y="472" width="486" height="46" rx="9" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="66" y="492" font-size="9.5" font-weight="700" fill="#8a4038">Zombie fencing：producer 重启 → broker 对同一 PID 递增 epoch</text>
  <text x="66" y="508" font-size="9" fill="#8a4038">旧 epoch 的悬挂请求（zombie）到达时因 epoch 不符被拒绝</text>

  <text x="52" y="538" font-size="8.5" fill="#8a97ab">已核实：ProducerAppendInfo.checkSequence 校验严格递增序列号 + epoch；ProducerStateEntry.findDuplicateBatch 做 PID+序列号去重。</text>

  <!-- Panel B: 事务 Producer -->
  <rect x="580" y="112" width="540" height="418" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="602" y="138" font-size="13" font-weight="700" fill="#2f6b4e">② 事务 Producer · 跨分区原子写 + Consumer read_committed</text>
  <text x="602" y="156" font-size="9" fill="#8a97ab">解决"一次业务操作要写多个 partition，必须全生效或全不生效"</text>

  <rect x="602" y="170" width="220" height="70" rx="9" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="712" y="192" font-size="10" font-weight="700" fill="#2f6b4e" text-anchor="middle">beginTransaction()</text>
  <text x="712" y="210" font-size="9" fill="#3f8a63" text-anchor="middle">写 P_orders</text>
  <text x="712" y="226" font-size="9" fill="#3f8a63" text-anchor="middle">写 P_payments（同一事务）</text>

  <line x1="822" y1="205" x2="850" y2="205" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>

  <rect x="856" y="170" width="244" height="70" rx="9" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="978" y="192" font-size="10" font-weight="700" fill="#2f6b4e" text-anchor="middle">commitTransaction()</text>
  <text x="978" y="210" font-size="9" fill="#3f8a63" text-anchor="middle">向每个涉及的分区写入</text>
  <text x="978" y="226" font-size="9" fill="#3f8a63" text-anchor="middle">COMMIT 事务标记（marker）</text>

  <line x1="978" y1="240" x2="978" y2="264" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>

  <!-- 两个 partition 的日志 -->
  <rect x="602" y="268" width="480" height="90" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="616" y="288" font-size="9.5" font-weight="700" fill="#4a4a4f">P_orders 日志</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="616" y="298" width="90" height="26" rx="5" fill="#ffffff" stroke="#e4e7ec"/><text x="661" y="315" fill="#4a4a4f">order#1</text>
    <rect x="712" y="298" width="120" height="26" rx="5" fill="#f4eefb" stroke="#dcc9ef"/><text x="772" y="315" fill="#6f3ea8">order#2(未提交)</text>
    <rect x="838" y="298" width="90" height="26" rx="5" fill="#d7efe2" stroke="#9ed3b8"/><text x="883" y="315" fill="#2f6b4e">COMMIT✓</text>
  </g>
  <text x="616" y="344" font-size="8.5" fill="#8a97ab">order#2 写入后先是"未提交状态"，直到 COMMIT marker 落地才算数</text>

  <rect x="602" y="368" width="480" height="90" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="616" y="388" font-size="9.5" font-weight="700" fill="#4a4a4f">P_payments 日志</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="616" y="398" width="90" height="26" rx="5" fill="#ffffff" stroke="#e4e7ec"/><text x="661" y="415" fill="#4a4a4f">pay#1</text>
    <rect x="712" y="398" width="120" height="26" rx="5" fill="#f4eefb" stroke="#dcc9ef"/><text x="772" y="415" fill="#6f3ea8">pay#2(未提交)</text>
    <rect x="838" y="398" width="90" height="26" rx="5" fill="#d7efe2" stroke="#9ed3b8"/><text x="883" y="415" fill="#2f6b4e">COMMIT✓</text>
  </g>
  <text x="616" y="444" font-size="8.5" fill="#8a97ab">同一事务的两个分区各自独立落 COMMIT marker，但对 consumer 呈现为"同时生效"</text>

  <rect x="602" y="470" width="480" height="52" rx="9" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="616" y="490" font-size="9.5" font-weight="700" fill="#8a4038">Consumer 端：isolation.level=read_committed</text>
  <text x="616" y="507" font-size="9" fill="#8a4038">跳过尚未看到 COMMIT/ABORT marker 的记录，只暴露已提交事务的数据；默认值实际是 read_uncommitted，需显式配置</text>

  <text x="602" y="538" font-size="8.5" fill="#8a97ab">已核实：事务生产者实现跨分区原子写；isolation.level=read_committed 消费端配合实现 exactly-once。</text>

  <!-- 底部：两层叠加 -->
  <rect x="30" y="548" width="1090" height="96" rx="12" fill="#f2f0fa" stroke="#d3c6ee"/>
  <text x="48" y="574" font-size="10.5" font-weight="700" fill="#5a3a7a">两层叠加才是完整的 exactly-once</text>
  <text x="48" y="598" font-size="10" fill="#4a4a4f"><tspan font-weight="700" fill="#6f3ea8">幂等（①）</tspan>保证"同一条消息不因重试而重复"；<tspan font-weight="700" fill="#2f6b4e">事务（②）</tspan>保证"跨多个分区的一组写，读者要么全看到、要么全看不到"。</text>
  <text x="48" y="620" font-size="9" fill="#8a97ab">只开幂等 = at-least-once-with-dedup（够用于单分区无副作用写）；只开事务不开幂等在 Kafka 实现里不成立——事务本就建立在幂等 Producer 的 PID/序列号机制之上。</text>
</svg>
