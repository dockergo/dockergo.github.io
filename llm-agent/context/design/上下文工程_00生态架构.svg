<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/></marker>
  </defs>
  <rect width="960" height="600" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">上下文工程 · 生态架构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">上下文窗口是 Agent 唯一的「视野」——在有限 token 预算内决定塞什么、怎么排、何时压</text>

  <!-- 素材源 -->
  <text x="150" y="92" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">上下文素材源</text>
  <g filter="url(#soft)"><rect x="40" y="108" width="220" height="40" rx="10" fill="#f3ecff" stroke="#c084fc" stroke-width="1.4"/></g><text x="150" y="133" font-size="9.5" fill="#1d1d1f" text-anchor="middle">系统提示 / 角色设定</text>
  <g filter="url(#soft)"><rect x="40" y="158" width="220" height="40" rx="10" fill="#f3ecff" stroke="#c084fc" stroke-width="1.4"/></g><text x="150" y="183" font-size="9.5" fill="#1d1d1f" text-anchor="middle">工具定义 / Few-shot</text>
  <g filter="url(#soft)"><rect x="40" y="208" width="220" height="40" rx="10" fill="#f3ecff" stroke="#c084fc" stroke-width="1.4"/></g><text x="150" y="233" font-size="9.5" fill="#1d1d1f" text-anchor="middle">记忆 / RAG 检索片段</text>
  <g filter="url(#soft)"><rect x="40" y="258" width="220" height="40" rx="10" fill="#f3ecff" stroke="#c084fc" stroke-width="1.4"/></g><text x="150" y="283" font-size="9.5" fill="#1d1d1f" text-anchor="middle">对话历史 / 工具结果</text>

  <!-- C1 装配 -->
  <g filter="url(#soft)"><rect x="340" y="150" width="180" height="110" rx="13" fill="#f3ecff" stroke="#c084fc" stroke-width="1.7"/></g>
  <text x="430" y="182" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">C1 上下文装配</text>
  <text x="430" y="208" font-size="9.5" fill="#6e6e73" text-anchor="middle">分层拼装、排序</text>
  <text x="430" y="228" font-size="9.5" fill="#6e6e73" text-anchor="middle">按预算裁剪</text>
  <path d="M262 128 L338 175" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arv)"/>
  <path d="M262 178 L338 195" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arv)"/>
  <path d="M262 228 L338 212" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arv)"/>
  <path d="M262 278 L338 235" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arv)"/>

  <!-- 窗口 + LLM -->
  <g filter="url(#soft)"><rect x="600" y="150" width="180" height="110" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.7"/></g>
  <text x="690" y="182" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">上下文窗口</text>
  <text x="690" y="208" font-size="9.5" fill="#6e6e73" text-anchor="middle">固定 token 预算</text>
  <text x="690" y="228" font-size="9.5" fill="#6e6e73" text-anchor="middle">→ 送入 LLM 推理</text>
  <path d="M522 205 L598 205" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#arh)"/>

  <!-- C2 缓存 -->
  <g filter="url(#soft)"><rect x="600" y="300" width="180" height="56" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="690" y="325" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">C2 前缀缓存</text>
  <text x="690" y="344" font-size="9" fill="#6e6e73" text-anchor="middle">前缀稳定 → KV-Cache 命中</text>
  <path d="M690 300 L690 262" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#art)"/>

  <!-- C3 压缩卸载 -->
  <g filter="url(#soft)"><rect x="340" y="300" width="180" height="56" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="430" y="325" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">C3 压缩与卸载</text>
  <text x="430" y="344" font-size="9" fill="#6e6e73" text-anchor="middle">摘要压缩 + 外部卸载</text>
  <path d="M520 328 L598 250" stroke="#f5873a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arf)"/>
  <path d="M430 300 L430 262" stroke="#f5873a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arf)"/>

  <g filter="url(#soft)"><rect x="40" y="400" width="880" height="150" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="428" font-size="11.5" font-weight="600" fill="#1d1d1f">为什么需要上下文工程</text>
  <text x="60" y="454" font-size="10.5" fill="#6e6e73">• 窗口是稀缺资源:token 有限、价格线性、超长还会"迷失在中间"(lost-in-the-middle)——不是塞越多越好</text>
  <text x="60" y="478" font-size="10.5" fill="#6e6e73">• 装配决定质量:同样的素材,分层排序 + 精准裁剪能显著提升推理准确率并降低干扰噪声</text>
  <text x="60" y="502" font-size="10.5" fill="#6e6e73">• 前缀缓存决定成本:把稳定内容放前面,命中 KV-Cache 可省下大量重复计算与延迟</text>
  <text x="60" y="526" font-size="10" fill="#c084fc">• 压缩与卸载决定续航:长任务靠摘要压缩历史、把细节卸载到外部存储,让 Agent 跑得更久而不爆窗口</text>

  <line x1="40" y1="576" x2="60" y2="576" stroke="#c084fc" stroke-width="2"/><text x="66" y="580" font-size="9" fill="#6e6e73">装配</text>
  <line x1="140" y1="576" x2="160" y2="576" stroke="#0a84ff" stroke-width="2"/><text x="166" y="580" font-size="9" fill="#6e6e73">送入推理</text>
  <line x1="250" y1="576" x2="270" y2="576" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 3"/><text x="276" y="580" font-size="9" fill="#6e6e73">缓存复用</text>
  <line x1="370" y1="576" x2="390" y2="576" stroke="#f5873a" stroke-width="2" stroke-dasharray="3 3"/><text x="396" y="580" font-size="9" fill="#6e6e73">压缩/卸载</text>
</svg>