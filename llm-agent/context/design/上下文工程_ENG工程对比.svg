<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">ENG · 上下文工程的三条工程底线</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">预算即纪律 · 缓存即成本杠杆 · 压缩不失真</text>

  <!-- 支柱1 预算即纪律 -->
  <g filter="url(#soft)"><rect x="40" y="90" width="270" height="340" rx="13" fill="#f3ecff" stroke="#c084fc" stroke-width="1.4"/></g>
  <text x="175" y="130" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">预算即纪律</text>
  <text x="175" y="152" font-size="10" fill="#6e6e73" text-anchor="middle">token 是硬约束,不是无限空间</text>
  <line x1="70" y1="170" x2="280" y2="170" stroke="#e5e0f0" stroke-width="1"/>
  <text x="70" y="198" font-size="11" fill="#1d1d1f">· 先定预算再装配,而非塞满</text>
  <text x="70" y="228" font-size="11" fill="#1d1d1f">· 相关性排序,给关键信息留位</text>
  <text x="70" y="258" font-size="11" fill="#1d1d1f">· 对抗 lost-in-the-middle:</text>
  <text x="88" y="278" font-size="10" fill="#6e6e73">重要信息放首尾</text>
  <text x="70" y="308" font-size="11" fill="#1d1d1f">· 每一层可裁剪、可降级</text>
  <text x="70" y="352" font-size="10" fill="#c084fc">底线:窗口是稀缺资源,</text>
  <text x="70" y="372" font-size="10" fill="#c084fc">花在刀刃上</text>

  <!-- 支柱2 缓存即成本杠杆 -->
  <g filter="url(#soft)"><rect x="345" y="90" width="270" height="340" rx="13" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="480" y="130" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">缓存即成本杠杆</text>
  <text x="480" y="152" font-size="10" fill="#6e6e73" text-anchor="middle">前缀稳定,省下的是真金白银</text>
  <line x1="375" y1="170" x2="585" y2="170" stroke="#d5f2eb" stroke-width="1"/>
  <text x="375" y="198" font-size="11" fill="#1d1d1f">· 系统提示、工具定义前置</text>
  <text x="375" y="228" font-size="11" fill="#1d1d1f">· 前缀只增不改、逐字节稳定</text>
  <text x="375" y="258" font-size="11" fill="#1d1d1f">· 动态内容(时间戳)后置</text>
  <text x="375" y="288" font-size="11" fill="#1d1d1f">· 命中率是成本/延迟核心指标</text>
  <text x="375" y="352" font-size="10" fill="#2dd4bf">底线:一次前缀变动,</text>
  <text x="375" y="372" font-size="10" fill="#2dd4bf">缓存全线失效</text>

  <!-- 支柱3 压缩不失真 -->
  <g filter="url(#soft)"><rect x="650" y="90" width="270" height="340" rx="13" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="785" y="130" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">压缩不失真</text>
  <text x="785" y="152" font-size="10" fill="#6e6e73" text-anchor="middle">省空间不能省掉关键事实</text>
  <line x1="680" y1="170" x2="890" y2="170" stroke="#f7e4d3" stroke-width="1"/>
  <text x="680" y="198" font-size="11" fill="#1d1d1f">· 摘要保留决策、结论、约束</text>
  <text x="680" y="228" font-size="11" fill="#1d1d1f">· 细节卸载外部,留可回溯指针</text>
  <text x="680" y="258" font-size="11" fill="#1d1d1f">· 分级:热数据留窗,冷数据外置</text>
  <text x="680" y="288" font-size="11" fill="#1d1d1f">· 压缩前留原文备份可回滚</text>
  <text x="680" y="352" font-size="10" fill="#f5873a">底线:有损压缩要可控,</text>
  <text x="680" y="372" font-size="10" fill="#f5873a">关键信息零丢失</text>

  <text x="480" y="470" font-size="11" fill="#1d1d1f" text-anchor="middle" font-weight="600">工程主线:上下文窗口既是能力的边界,也是成本的账单——精打细算才能跑得又好又久又省</text>
</svg>