<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">CMP · 三大机理对比：装配 / 前缀缓存 / 压缩卸载</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">同一个上下文窗口,装配管"塞什么怎么排",缓存管"怎么省钱",压缩卸载管"怎么跑更久"</text>

  <g filter="url(#soft)"><rect x="30" y="80" width="900" height="40" rx="10" fill="#f3ecff" stroke="#c084fc" stroke-width="1.4"/></g>
  <text x="120" y="105" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">机理</text>
  <text x="330" y="105" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">解决什么问题</text>
  <text x="560" y="105" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">典型做法</text>
  <text x="820" y="105" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">主要代价</text>

  <!-- 行1 装配 -->
  <g filter="url(#soft)"><rect x="30" y="130" width="900" height="110" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="120" y="172" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">C1 上下文装配</text>
  <text x="120" y="192" font-size="9" fill="#6e6e73" text-anchor="middle">塞什么、怎么排</text>
  <text x="330" y="178" font-size="10" fill="#6e6e73" text-anchor="middle">素材噪声、顺序不当</text>
  <text x="330" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">导致推理质量下降</text>
  <text x="560" y="178" font-size="10" fill="#6e6e73" text-anchor="middle">分层拼装、相关性排序、</text>
  <text x="560" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">按预算裁剪</text>
  <text x="820" y="187" font-size="10" fill="#6e6e73" text-anchor="middle">需精心设计与调优</text>

  <!-- 行2 前缀缓存 -->
  <g filter="url(#soft)"><rect x="30" y="250" width="900" height="110" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="120" y="292" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle">C2 前缀缓存</text>
  <text x="120" y="312" font-size="9" fill="#6e6e73" text-anchor="middle">怎么省钱省时</text>
  <text x="330" y="298" font-size="10" fill="#6e6e73" text-anchor="middle">长前缀重复计算,</text>
  <text x="330" y="316" font-size="10" fill="#6e6e73" text-anchor="middle">成本与延迟高</text>
  <text x="560" y="298" font-size="10" fill="#6e6e73" text-anchor="middle">前缀逐字节稳定、</text>
  <text x="560" y="316" font-size="10" fill="#6e6e73" text-anchor="middle">只增不改、复用 KV</text>
  <text x="820" y="298" font-size="10" fill="#6e6e73" text-anchor="middle">前缀一变即失效,</text>
  <text x="820" y="316" font-size="10" fill="#6e6e73" text-anchor="middle">有 TTL/容量限制</text>

  <!-- 行3 压缩卸载 -->
  <g filter="url(#soft)"><rect x="30" y="370" width="900" height="110" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="120" y="412" font-size="11" font-weight="600" fill="#f5873a" text-anchor="middle">C3 压缩卸载</text>
  <text x="120" y="432" font-size="9" fill="#6e6e73" text-anchor="middle">怎么跑更久</text>
  <text x="330" y="418" font-size="10" fill="#6e6e73" text-anchor="middle">长任务历史撑爆</text>
  <text x="330" y="436" font-size="10" fill="#6e6e73" text-anchor="middle">有限窗口</text>
  <text x="560" y="418" font-size="10" fill="#6e6e73" text-anchor="middle">摘要压缩历史 /</text>
  <text x="560" y="436" font-size="10" fill="#6e6e73" text-anchor="middle">细节卸载到外部</text>
  <text x="820" y="418" font-size="10" fill="#6e6e73" text-anchor="middle">压缩有损 /</text>
  <text x="820" y="436" font-size="10" fill="#6e6e73" text-anchor="middle">卸载增 IO 延迟</text>

  <text x="480" y="505" font-size="10" fill="#c084fc" text-anchor="middle">主线:三者协同——装配决定质量下限,缓存决定成本效率,压缩卸载决定任务能跑多长,共同榨干每一个 token</text>
</svg>