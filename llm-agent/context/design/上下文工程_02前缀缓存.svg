<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">C2 · 前缀缓存：前缀稳定换 KV-Cache 命中</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">LLM 逐 token 计算注意力,相同前缀的 KV 可复用——把不变内容放前面,就能少算、更快、更便宜</text>

  <!-- 命中 -->
  <text x="240" y="92" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">✓ 前缀稳定 → 缓存命中</text>
  <g filter="url(#soft)"><rect x="60" y="110" width="180" height="40" rx="9" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g><text x="150" y="135" font-size="9.5" fill="#1d1d1f" text-anchor="middle">系统提示(不变)</text>
  <g filter="url(#soft)"><rect x="250" y="110" width="120" height="40" rx="9" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g><text x="310" y="135" font-size="9.5" fill="#1d1d1f" text-anchor="middle">工具定义(不变)</text>
  <g filter="url(#soft)"><rect x="380" y="110" width="110" height="40" rx="9" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g><text x="435" y="135" font-size="9.5" fill="#1d1d1f" text-anchor="middle">新输入(变)</text>
  <path d="M150 158 L150 190" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#art)"/>
  <path d="M310 158 L310 190" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#art)"/>
  <g filter="url(#soft)"><rect x="60" y="195" width="310" height="34" rx="8" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="215" y="217" font-size="9.5" fill="#2dd4bf" text-anchor="middle">前缀 KV 直接复用,仅算新增部分</text>

  <!-- 未命中 -->
  <text x="720" y="92" font-size="12" font-weight="600" fill="#f5873a" text-anchor="middle">✗ 前缀变动 → 缓存失效</text>
  <g filter="url(#soft)"><rect x="540" y="110" width="150" height="40" rx="9" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g><text x="615" y="135" font-size="9" fill="#1d1d1f" text-anchor="middle">时间戳/随机ID(变)</text>
  <g filter="url(#soft)"><rect x="700" y="110" width="180" height="40" rx="9" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.3"/></g><text x="790" y="135" font-size="9" fill="#1d1d1f" text-anchor="middle">系统提示(被迫重算)</text>
  <path d="M615 158 L615 190" stroke="#f5873a" stroke-width="1.5" marker-end="url(#arf)"/>
  <path d="M790 158 L790 190" stroke="#f5873a" stroke-width="1.5" marker-end="url(#arf)"/>
  <g filter="url(#soft)"><rect x="540" y="195" width="340" height="34" rx="8" fill="#fff3ea" stroke="#f5873a" stroke-width="1.3"/></g>
  <text x="710" y="217" font-size="9.5" fill="#f5873a" text-anchor="middle">前缀一变,后面全部重新计算</text>

  <g filter="url(#soft)"><rect x="40" y="270" width="880" height="200" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="298" font-size="11.5" font-weight="600" fill="#1d1d1f">用好前缀缓存的要点</text>
  <text x="60" y="324" font-size="10.5" fill="#6e6e73">• 前缀确定性:系统提示、工具定义保持逐字节稳定,别在开头塞时间戳、随机 ID、会变的用户信息</text>
  <text x="60" y="348" font-size="10.5" fill="#6e6e73">• 只增不改:对话推进时把新内容 append 到末尾,不要回头改动已有前缀,否则整段缓存作废</text>
  <text x="60" y="372" font-size="10.5" fill="#6e6e73">• 序列化稳定:JSON 键顺序、空格格式固定,避免语义相同但字节不同导致的意外未命中</text>
  <text x="60" y="396" font-size="10.5" fill="#6e6e73">• 收益:命中前缀缓存可大幅降低首 token 延迟(TTFT)与计算成本,长系统提示场景尤其明显</text>
  <text x="60" y="426" font-size="10" fill="#2dd4bf">这也解释了 C1 为何"稳定在前":装配顺序不只关乎质量,更直接决定缓存命中率与成本</text>
  <text x="60" y="452" font-size="10" fill="#f5873a">注意:缓存有 TTL 与容量上限,冷门前缀会被淘汰;高频复用的前缀才划算</text>
</svg>