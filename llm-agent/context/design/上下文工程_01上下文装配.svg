<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">C1 · 上下文装配：系统提示 / 工具 / 记忆的分层拼装</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">上下文不是随手拼接,而是像搭积木——分层、排序、按预算裁剪,稳定的放前面,相关的放显眼处</text>

  <!-- 窗口分层 -->
  <text x="230" y="92" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">一次请求的上下文分层(自上而下)</text>
  <g filter="url(#soft)"><rect x="60" y="108" width="340" height="42" rx="10" fill="#f3ecff" stroke="#c084fc" stroke-width="1.6"/></g>
  <text x="80" y="134" font-size="10" fill="#1d1d1f">① 系统提示 / 角色 / 全局约束（最稳定）</text>
  <g filter="url(#soft)"><rect x="60" y="158" width="340" height="42" rx="10" fill="#f3ecff" stroke="#c084fc" stroke-width="1.4"/></g>
  <text x="80" y="184" font-size="10" fill="#1d1d1f">② 工具定义 / Few-shot 示例（较稳定）</text>
  <g filter="url(#soft)"><rect x="60" y="208" width="340" height="42" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="80" y="234" font-size="10" fill="#1d1d1f">③ 检索片段 / 长期记忆（按相关性）</text>
  <g filter="url(#soft)"><rect x="60" y="258" width="340" height="42" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="80" y="284" font-size="10" fill="#1d1d1f">④ 对话历史 / 工具结果（动态变化）</text>
  <g filter="url(#soft)"><rect x="60" y="308" width="340" height="42" rx="10" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="80" y="334" font-size="10" fill="#1d1d1f">⑤ 当前用户输入 / 任务指令（最新,放末尾）</text>
  <path d="M420 129 L470 129" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arv)"/>
  <text x="600" y="133" font-size="10" fill="#6e6e73" text-anchor="middle">前缀稳定 → 利于 KV-Cache 命中</text>
  <path d="M420 329 L470 329" stroke="#f5873a" stroke-width="1.5" marker-end="url(#arv)"/>
  <text x="600" y="333" font-size="10" fill="#6e6e73" text-anchor="middle">近因效应 → 关键指令放最后</text>

  <g filter="url(#soft)"><rect x="40" y="380" width="880" height="120" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="408" font-size="11.5" font-weight="600" fill="#1d1d1f">装配的三条原则</text>
  <text x="60" y="434" font-size="10.5" fill="#6e6e73">• 稳定在前、动态在后:不变的系统提示/工具放最前,既符合缓存友好,又让模型先建立"人设"</text>
  <text x="60" y="458" font-size="10.5" fill="#6e6e73">• 相关性排序 + 预算裁剪:检索片段按相关度排,超预算时优先丢低分内容,而非无脑截断尾部</text>
  <text x="60" y="482" font-size="10" fill="#c084fc">• 对抗"迷失在中间":最关键的指令与证据放头尾,避免埋在长上下文中段被模型忽略</text>
</svg>