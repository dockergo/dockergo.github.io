<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/></marker>
  </defs>
  <rect width="960" height="600" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Multi-Agent · 多智能体协作 · 生态架构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">单个 Agent 上下文有限、能力单一——把复杂任务拆给多个各司其职的 Agent 分工协作，是规模化的必由之路</text>

  <!-- 监督者 -->
  <g filter="url(#soft)"><rect x="370" y="90" width="220" height="76" rx="13" fill="#fff3ea" stroke="#f5873a" stroke-width="1.6"/></g>
  <text x="480" y="120" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">监督者 / 编排者</text>
  <text x="480" y="144" font-size="10" fill="#6e6e73" text-anchor="middle">任务拆解 · 分派 · 汇总</text>

  <!-- 三个子 Agent -->
  <g filter="url(#soft)"><rect x="90" y="230" width="200" height="90" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="190" y="262" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">规划者 Agent</text>
  <text x="190" y="286" font-size="9.5" fill="#6e6e73" text-anchor="middle">拆解目标为子任务</text>
  <text x="190" y="306" font-size="9.5" fill="#6e6e73" text-anchor="middle">制定执行计划</text>

  <g filter="url(#soft)"><rect x="380" y="230" width="200" height="90" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="480" y="262" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">执行者 Agent</text>
  <text x="480" y="286" font-size="9.5" fill="#6e6e73" text-anchor="middle">调工具、写代码</text>
  <text x="480" y="306" font-size="9.5" fill="#6e6e73" text-anchor="middle">完成具体子任务</text>

  <g filter="url(#soft)"><rect x="670" y="230" width="200" height="90" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="770" y="262" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">评审者 Agent</text>
  <text x="770" y="286" font-size="9.5" fill="#6e6e73" text-anchor="middle">检查质量、挑错</text>
  <text x="770" y="306" font-size="9.5" fill="#6e6e73" text-anchor="middle">反馈返工建议</text>

  <path d="M440 166 L230 226" stroke="#f5873a" stroke-width="1.8" marker-end="url(#arf)"/>
  <path d="M480 166 L480 226" stroke="#f5873a" stroke-width="1.8" marker-end="url(#arf)"/>
  <path d="M520 166 L730 226" stroke="#f5873a" stroke-width="1.8" marker-end="url(#arf)"/>
  <path d="M290 275 L376 275" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#arh)"/>
  <path d="M580 275 L666 275" stroke="#0a84ff" stroke-width="1.6" marker-end="url(#arh)"/>

  <g filter="url(#soft)"><rect x="60" y="370" width="840" height="150" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="80" y="398" font-size="12" font-weight="600" fill="#1d1d1f">本模块的三条机理线</text>
  <text x="80" y="424" font-size="10.5" fill="#6e6e73">A1 编排拓扑：监督者集中调度 vs 去中心化网络自组织——决定谁指挥谁、信息如何流动</text>
  <text x="80" y="448" font-size="10.5" fill="#6e6e73">A2 角色分工：规划者/执行者/评审者各司其职，用角色专业化 + 相互制衡提升整体质量</text>
  <text x="80" y="472" font-size="10.5" fill="#6e6e73">A3 通信协作：黑板共享 vs 消息传递——多个 Agent 如何交换中间结果、达成一致</text>
  <text x="80" y="500" font-size="10" fill="#f5873a">核心张力：分工带来专业化收益，但通信与协调成本、错误传播风险随 Agent 数量非线性上升</text>

  <line x1="628" y1="588" x2="650" y2="588" stroke="#f5873a" stroke-width="1.8"/><text x="656" y="591" font-size="9" fill="#6e6e73">编排/分派</text>
  <line x1="738" y1="588" x2="760" y2="588" stroke="#0a84ff" stroke-width="1.8"/><text x="766" y="591" font-size="9" fill="#6e6e73">协作热路径</text>
</svg>