<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">A2 · 角色分工：规划者 / 执行者 / 评审者</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">把一个"全能 Agent"拆成各司其职的专家——分工降低单体上下文负担，制衡提升产出可靠性</text>

  <!-- 规划者 -->
  <g filter="url(#soft)"><rect x="60" y="120" width="200" height="110" rx="13" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.6"/></g>
  <text x="160" y="150" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">规划者 Planner</text>
  <text x="160" y="178" font-size="10" fill="#6e6e73" text-anchor="middle">拆解目标为子任务</text>
  <text x="160" y="198" font-size="10" fill="#6e6e73" text-anchor="middle">排定顺序与依赖</text>
  <text x="160" y="218" font-size="10" fill="#6e6e73" text-anchor="middle">只想"做什么"</text>

  <!-- 执行者 -->
  <g filter="url(#soft)"><rect x="380" y="120" width="200" height="110" rx="13" fill="#fff3ea" stroke="#f5873a" stroke-width="1.6"/></g>
  <text x="480" y="150" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">执行者 Executor</text>
  <text x="480" y="178" font-size="10" fill="#6e6e73" text-anchor="middle">调用工具/写代码</text>
  <text x="480" y="198" font-size="10" fill="#6e6e73" text-anchor="middle">落地单个子任务</text>
  <text x="480" y="218" font-size="10" fill="#6e6e73" text-anchor="middle">只管"怎么做"</text>

  <!-- 评审者 -->
  <g filter="url(#soft)"><rect x="700" y="120" width="200" height="110" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="800" y="150" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">评审者 Critic</text>
  <text x="800" y="178" font-size="10" fill="#6e6e73" text-anchor="middle">校验结果/质量</text>
  <text x="800" y="198" font-size="10" fill="#6e6e73" text-anchor="middle">打回或放行</text>
  <text x="800" y="218" font-size="10" fill="#6e6e73" text-anchor="middle">只问"对不对"</text>

  <path d="M262 175 L378 175" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arp)"/>
  <text x="320" y="167" font-size="9" fill="#a78bfa" text-anchor="middle">派发子任务</text>
  <path d="M582 175 L698 175" stroke="#f5873a" stroke-width="1.6" marker-end="url(#arf)"/>
  <text x="640" y="167" font-size="9" fill="#f5873a" text-anchor="middle">提交产出</text>
  <path d="M760 232 L200 232" stroke="#f5873a" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arf)"/>
  <text x="480" y="252" font-size="9.5" fill="#f5873a" text-anchor="middle">评审不通过 → 回退重规划（闭环制衡）</text>

  <g filter="url(#soft)"><rect x="40" y="300" width="880" height="170" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="328" font-size="11.5" font-weight="600" fill="#1d1d1f">为什么要分工</text>
  <text x="60" y="354" font-size="10.5" fill="#6e6e73">• 认知减负：每个角色只需一个窄职责的系统提示词，上下文更聚焦，幻觉与跑偏更少</text>
  <text x="60" y="378" font-size="10.5" fill="#6e6e73">• 制衡纠错：评审者独立于执行者，天然形成"生成—校验"对抗，比单体自查更可靠</text>
  <text x="60" y="402" font-size="10.5" fill="#6e6e73">• 可替换性：任一角色可单独升级模型或换实现，不影响其他角色，工程演进更灵活</text>
  <text x="60" y="426" font-size="10.5" fill="#6e6e73">• 可观测：每段职责边界清晰，日志/评估能定位是"规划错"还是"执行错"还是"漏检"</text>
  <text x="60" y="452" font-size="10" fill="#f5873a">代价：角色越多，通信轮次与 token 成本越高——分工粒度要匹配任务复杂度，避免过度设计</text>
</svg>