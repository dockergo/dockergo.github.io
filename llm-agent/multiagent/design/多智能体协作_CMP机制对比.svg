<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">CMP · 三大机理对比：编排拓扑 / 角色分工 / 通信协作</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">三者正交组合，共同定义一套多智能体系统——同一维度上都在"能力 ↔ 可控"之间权衡</text>

  <!-- 表头 -->
  <g filter="url(#soft)"><rect x="30" y="80" width="900" height="40" rx="10" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="120" y="105" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">机理</text>
  <text x="330" y="105" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">解决什么问题</text>
  <text x="560" y="105" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">典型做法</text>
  <text x="820" y="105" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">主要代价</text>

  <!-- 行1 编排拓扑 -->
  <g filter="url(#soft)"><rect x="30" y="130" width="900" height="110" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="120" y="172" font-size="11" font-weight="600" fill="#f5873a" text-anchor="middle">A1 编排拓扑</text>
  <text x="120" y="192" font-size="9" fill="#6e6e73" text-anchor="middle">谁指挥谁</text>
  <text x="330" y="178" font-size="10" fill="#6e6e73" text-anchor="middle">多 Agent 如何组织、</text>
  <text x="330" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">信息如何流动</text>
  <text x="560" y="178" font-size="10" fill="#6e6e73" text-anchor="middle">监督者集中调度 /</text>
  <text x="560" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">去中心化对等网络</text>
  <text x="820" y="178" font-size="10" fill="#6e6e73" text-anchor="middle">集中→单点瓶颈</text>
  <text x="820" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">去中心→难收敛</text>

  <!-- 行2 角色分工 -->
  <g filter="url(#soft)"><rect x="30" y="250" width="900" height="110" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="120" y="292" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">A2 角色分工</text>
  <text x="120" y="312" font-size="9" fill="#6e6e73" text-anchor="middle">各司其职</text>
  <text x="330" y="298" font-size="10" fill="#6e6e73" text-anchor="middle">单体上下文过载、</text>
  <text x="330" y="316" font-size="10" fill="#6e6e73" text-anchor="middle">缺乏自我纠错</text>
  <text x="560" y="298" font-size="10" fill="#6e6e73" text-anchor="middle">规划者/执行者/</text>
  <text x="560" y="316" font-size="10" fill="#6e6e73" text-anchor="middle">评审者闭环制衡</text>
  <text x="820" y="307" font-size="10" fill="#6e6e73" text-anchor="middle">通信轮次与 token 上升</text>

  <!-- 行3 通信协作 -->
  <g filter="url(#soft)"><rect x="30" y="370" width="900" height="110" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="120" y="412" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle">A3 通信协作</text>
  <text x="120" y="432" font-size="9" fill="#6e6e73" text-anchor="middle">如何交换信息</text>
  <text x="330" y="418" font-size="10" fill="#6e6e73" text-anchor="middle">状态共享 vs 耦合度、</text>
  <text x="330" y="436" font-size="10" fill="#6e6e73" text-anchor="middle">可追溯性权衡</text>
  <text x="560" y="418" font-size="10" fill="#6e6e73" text-anchor="middle">黑板共享状态 /</text>
  <text x="560" y="436" font-size="10" fill="#6e6e73" text-anchor="middle">显式消息传递</text>
  <text x="820" y="418" font-size="10" fill="#6e6e73" text-anchor="middle">黑板→并发冲突</text>
  <text x="820" y="436" font-size="10" fill="#6e6e73" text-anchor="middle">消息→路由复杂</text>

  <text x="480" y="505" font-size="10" fill="#f5873a" text-anchor="middle">主线：这三层选择叠加起来就是系统的"性格"——先定拓扑（可控边界），再定分工（能力拆解），最后定通信（信息契约）</text>
</svg>