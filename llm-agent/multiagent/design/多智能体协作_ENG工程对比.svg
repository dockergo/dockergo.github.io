<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">ENG · 工程落地：多智能体系统的三条铁律</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">多 Agent 不是银弹——先问"是否真需要多个"，再谈可控、成本与可观测</text>

  <!-- 支柱1 -->
  <g filter="url(#soft)"><rect x="40" y="90" width="280" height="360" rx="13" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="180" y="122" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">可控即底线</text>
  <text x="60" y="158" font-size="10.5" fill="#6e6e73">• 默认单 Agent，能用工具/</text>
  <text x="60" y="178" font-size="10.5" fill="#6e6e73">  子任务解决就别上多 Agent</text>
  <text x="60" y="204" font-size="10.5" fill="#6e6e73">• 每个 Agent 设最大轮数、</text>
  <text x="60" y="224" font-size="10.5" fill="#6e6e73">  预算与超时，防死循环</text>
  <text x="60" y="250" font-size="10.5" fill="#6e6e73">• 优先监督者拓扑，保留</text>
  <text x="60" y="270" font-size="10.5" fill="#6e6e73">  人工介入/中止的入口</text>
  <text x="60" y="296" font-size="10.5" fill="#6e6e73">• 关键决策要可回退，</text>
  <text x="60" y="316" font-size="10.5" fill="#6e6e73">  副作用操作需二次确认</text>
  <text x="60" y="360" font-size="10" fill="#f5873a">反例：放任 Agent 互相调用，</text>
  <text x="60" y="380" font-size="10" fill="#f5873a">最终陷入无限对话烧光预算</text>

  <!-- 支柱2 -->
  <g filter="url(#soft)"><rect x="340" y="90" width="280" height="360" rx="13" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="480" y="122" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">成本即约束</text>
  <text x="360" y="158" font-size="10.5" fill="#6e6e73">• 多 Agent = 多次 LLM 调用，</text>
  <text x="360" y="178" font-size="10.5" fill="#6e6e73">  成本与延迟成倍增长</text>
  <text x="360" y="204" font-size="10.5" fill="#6e6e73">• 用小模型跑执行/评审，</text>
  <text x="360" y="224" font-size="10.5" fill="#6e6e73">  大模型只做规划</text>
  <text x="360" y="250" font-size="10.5" fill="#6e6e73">• 能并行的子任务并行跑，</text>
  <text x="360" y="270" font-size="10.5" fill="#6e6e73">  缩短端到端时延</text>
  <text x="360" y="296" font-size="10.5" fill="#6e6e73">• 缓存中间结果，避免</text>
  <text x="360" y="316" font-size="10.5" fill="#6e6e73">  重复子任务反复求解</text>
  <text x="360" y="360" font-size="10" fill="#a78bfa">权衡：分工越细质量越稳，</text>
  <text x="360" y="380" font-size="10" fill="#a78bfa">但轮次成本随之攀升</text>

  <!-- 支柱3 -->
  <g filter="url(#soft)"><rect x="640" y="90" width="280" height="360" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="780" y="122" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">可观测即前提</text>
  <text x="660" y="158" font-size="10.5" fill="#6e6e73">• 全链路 trace：记录每个</text>
  <text x="660" y="178" font-size="10.5" fill="#6e6e73">  Agent 的输入/输出/工具</text>
  <text x="660" y="204" font-size="10.5" fill="#6e6e73">• 消息传递优于隐式黑板，</text>
  <text x="660" y="224" font-size="10.5" fill="#6e6e73">  天然可审计可重放</text>
  <text x="660" y="250" font-size="10.5" fill="#6e6e73">• 定位失败要能区分是</text>
  <text x="660" y="270" font-size="10.5" fill="#6e6e73">  规划/执行/评审哪一环</text>
  <text x="660" y="296" font-size="10.5" fill="#6e6e73">• 端到端评测：以最终产物</text>
  <text x="660" y="316" font-size="10.5" fill="#6e6e73">  质量为准，非单步准确率</text>
  <text x="660" y="360" font-size="10" fill="#0a84ff">底线：无法观测的多 Agent</text>
  <text x="660" y="380" font-size="10" fill="#0a84ff">系统等于黑盒，无法运维</text>
</svg>