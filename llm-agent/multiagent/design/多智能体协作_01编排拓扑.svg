<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">A1 · 编排拓扑：监督者 vs 去中心化网络</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">谁指挥谁、信息如何流动——拓扑结构决定了系统的可控性、扩展性与鲁棒性</text>

  <!-- 监督者模式 -->
  <text x="240" y="90" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">监督者模式 (Supervisor)</text>
  <g filter="url(#soft)"><rect x="180" y="105" width="120" height="52" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.6"/></g>
  <text x="240" y="136" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">监督者</text>
  <g filter="url(#soft)"><rect x="70" y="220" width="100" height="46" rx="11" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="120" y="248" font-size="9.5" fill="#1d1d1f" text-anchor="middle">Agent A</text>
  <g filter="url(#soft)"><rect x="190" y="220" width="100" height="46" rx="11" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="240" y="248" font-size="9.5" fill="#1d1d1f" text-anchor="middle">Agent B</text>
  <g filter="url(#soft)"><rect x="310" y="220" width="100" height="46" rx="11" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="360" y="248" font-size="9.5" fill="#1d1d1f" text-anchor="middle">Agent C</text>
  <path d="M225 157 L130 216" stroke="#f5873a" stroke-width="1.6" marker-end="url(#arf)"/>
  <path d="M240 157 L240 216" stroke="#f5873a" stroke-width="1.6" marker-end="url(#arf)"/>
  <path d="M255 157 L350 216" stroke="#f5873a" stroke-width="1.6" marker-end="url(#arf)"/>
  <text x="240" y="300" font-size="9.5" fill="#6e6e73" text-anchor="middle">中心调度：可控、易追责</text>
  <text x="240" y="320" font-size="9.5" fill="#f5873a" text-anchor="middle">风险：监督者是瓶颈与单点</text>

  <!-- 去中心化 -->
  <text x="700" y="90" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">去中心化网络 (Network)</text>
  <g filter="url(#soft)"><rect x="600" y="120" width="90" height="44" rx="11" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g><text x="645" y="147" font-size="9.5" fill="#1d1d1f" text-anchor="middle">Agent A</text>
  <g filter="url(#soft)"><rect x="760" y="120" width="90" height="44" rx="11" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g><text x="805" y="147" font-size="9.5" fill="#1d1d1f" text-anchor="middle">Agent B</text>
  <g filter="url(#soft)"><rect x="680" y="230" width="90" height="44" rx="11" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g><text x="725" y="257" font-size="9.5" fill="#1d1d1f" text-anchor="middle">Agent C</text>
  <path d="M690 145 L758 145" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#arh)"/>
  <path d="M660 164 L710 226" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#arh)"/>
  <path d="M790 164 L745 226" stroke="#0a84ff" stroke-width="1.5" marker-end="url(#arh)"/>
  <text x="725" y="305" font-size="9.5" fill="#6e6e73" text-anchor="middle">对等直连：灵活、抗单点</text>
  <text x="725" y="325" font-size="9.5" fill="#f5873a" text-anchor="middle">风险：易失控、难收敛、难调试</text>

  <g filter="url(#soft)"><rect x="40" y="360" width="880" height="110" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="388" font-size="11.5" font-weight="600" fill="#1d1d1f">如何选拓扑</text>
  <text x="60" y="412" font-size="10.5" fill="#6e6e73">• 任务边界清晰、需强控制与可追溯 → 监督者模式：中心化编排，流程可预测、便于调试与止损</text>
  <text x="60" y="436" font-size="10.5" fill="#6e6e73">• 任务开放探索、需并行涌现 → 去中心化：Agent 自主协商，但要设最大轮数/预算上限防死循环</text>
  <text x="60" y="460" font-size="10" fill="#f5873a">实践首选监督者：多数生产系统更需要可控与可观测，去中心化的"涌现智能"往往伴随不可控代价</text>
</svg>