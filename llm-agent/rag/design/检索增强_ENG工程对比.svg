<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">ENG · 工程落地三支柱</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">RAG 的工程难点不在"能不能检索"，而在"检得准、答得实、评得清"——三支柱撑起可信问答系统</text>

  <g filter="url(#soft)"><rect x="30" y="90" width="290" height="300" rx="13" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="175" y="120" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">① 数据即根基</text>
  <text x="50" y="150" font-size="10" fill="#6e6e73">• 分块策略贴合文档结构</text>
  <text x="50" y="174" font-size="10" fill="#6e6e73">• Embedding 模型匹配领域</text>
  <text x="50" y="198" font-size="10" fill="#6e6e73">• 元数据支撑过滤与溯源</text>
  <text x="50" y="222" font-size="10" fill="#6e6e73">• 增量更新，索引不陈旧</text>
  <text x="50" y="252" font-size="9.5" fill="#2dd4bf">检索质量的上限在建库阶段</text>
  <text x="50" y="276" font-size="9.5" fill="#2dd4bf">就已锁死，垃圾进垃圾出</text>
  <text x="50" y="320" font-size="9" fill="#86868b">失败信号：召回全是无关块</text>
  <text x="50" y="342" font-size="9" fill="#86868b">→ 回查分块与 Embedding</text>

  <g filter="url(#soft)"><rect x="335" y="90" width="290" height="300" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="480" y="120" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">② 抗幻觉即底线</text>
  <text x="355" y="150" font-size="10" fill="#6e6e73">• 生成仅依据召回证据</text>
  <text x="355" y="174" font-size="10" fill="#6e6e73">• 强制标注引用来源</text>
  <text x="355" y="198" font-size="10" fill="#6e6e73">• 无据可依则答"不知道"</text>
  <text x="355" y="222" font-size="10" fill="#6e6e73">• Rerank + 压缩降低噪声</text>
  <text x="355" y="252" font-size="9.5" fill="#0a84ff">证据充分却编造，是 RAG</text>
  <text x="355" y="276" font-size="9.5" fill="#0a84ff">最危险的失败——比不答更糟</text>
  <text x="355" y="320" font-size="9" fill="#86868b">失败信号：答案与引用不符</text>
  <text x="355" y="342" font-size="9" fill="#86868b">→ 加引用校验与拒答策略</text>

  <g filter="url(#soft)"><rect x="640" y="90" width="290" height="300" rx="13" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="785" y="120" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">③ 评测即闭环</text>
  <text x="660" y="150" font-size="10" fill="#6e6e73">• 检索侧：命中率 / 召回率</text>
  <text x="660" y="174" font-size="10" fill="#6e6e73">• 生成侧：忠实度 / 相关性</text>
  <text x="660" y="198" font-size="10" fill="#6e6e73">• 端到端：answer 是否可用</text>
  <text x="660" y="222" font-size="10" fill="#6e6e73">• 建评测集，回归防退化</text>
  <text x="660" y="252" font-size="9.5" fill="#f5873a">"检索错"还是"生成错"要能</text>
  <text x="660" y="276" font-size="9.5" fill="#f5873a">分层归因，否则无从优化</text>
  <text x="660" y="320" font-size="9" fill="#86868b">工具：RAGAS 等评测框架</text>
  <text x="660" y="342" font-size="9" fill="#86868b">分离检索与生成指标</text>

  <g filter="url(#soft)"><rect x="30" y="415" width="900" height="60" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="50" y="440" font-size="11" font-weight="600" fill="#1d1d1f">一句话总纲</text>
  <text x="50" y="462" font-size="10.5" fill="#6e6e73">RAG 不是"接个向量库"就完事——它是数据工程 + 检索工程 + 生成约束 + 评测体系的系统工程，任一环短板都会决定天花板。</text>
</svg>