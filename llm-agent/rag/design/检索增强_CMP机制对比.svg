<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">CMP · 四条机理线横向对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">索引构建 / 混合检索 / 重排生成 / 图谱检索——各自解决 RAG 流水线上不同环节的核心问题</text>

  <!-- 表头 -->
  <g filter="url(#soft)"><rect x="30" y="80" width="900" height="42" rx="10" fill="#1d1d1f"/></g>
  <text x="120" y="106" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">机理线</text>
  <text x="320" y="106" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">解决什么问题</text>
  <text x="560" y="106" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">核心做法</text>
  <text x="820" y="106" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">主要代价 / 风险</text>

  <!-- G1 -->
  <g filter="url(#soft)"><rect x="30" y="132" width="900" height="82" rx="10" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="120" y="166" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">G1 索引构建</text>
  <text x="120" y="188" font-size="9" fill="#6e6e73" text-anchor="middle">离线 · 建库</text>
  <text x="320" y="168" font-size="9.5" fill="#424245" text-anchor="middle">让知识可被检索，决定质量上限</text>
  <text x="560" y="168" font-size="9.5" fill="#424245" text-anchor="middle">分块 + Embedding + 建索引</text>
  <text x="820" y="168" font-size="9.5" fill="#424245" text-anchor="middle">切块不当则全盘皆输</text>

  <!-- G2 -->
  <g filter="url(#soft)"><rect x="30" y="224" width="900" height="82" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.3"/></g>
  <text x="120" y="258" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">G2 混合检索</text>
  <text x="120" y="280" font-size="9" fill="#6e6e73" text-anchor="middle">在线 · 召回</text>
  <text x="320" y="260" font-size="9.5" fill="#424245" text-anchor="middle">兼顾语义相关与字面精确</text>
  <text x="560" y="260" font-size="9.5" fill="#424245" text-anchor="middle">向量 + 关键词双路，融合排序</text>
  <text x="820" y="260" font-size="9.5" fill="#424245" text-anchor="middle">评分归一化与权重调参</text>

  <!-- G3 -->
  <g filter="url(#soft)"><rect x="30" y="316" width="900" height="82" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.3"/></g>
  <text x="120" y="350" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">G3 重排生成</text>
  <text x="120" y="372" font-size="9" fill="#6e6e73" text-anchor="middle">在线 · 精排+生成</text>
  <text x="320" y="352" font-size="9.5" fill="#424245" text-anchor="middle">从粗召回里精挑并生成可信答案</text>
  <text x="560" y="352" font-size="9.5" fill="#424245" text-anchor="middle">Rerank + 压缩 + 带引用生成</text>
  <text x="820" y="352" font-size="9.5" fill="#424245" text-anchor="middle">精排慢；生成仍可能幻觉</text>

  <!-- G4 -->
  <g filter="url(#soft)"><rect x="30" y="408" width="900" height="82" rx="10" fill="#fff3ea" stroke="#f5873a" stroke-width="1.3"/></g>
  <text x="120" y="442" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">G4 图谱检索</text>
  <text x="120" y="464" font-size="9" fill="#6e6e73" text-anchor="middle">进阶 · 关系/全局</text>
  <text x="320" y="444" font-size="9.5" fill="#424245" text-anchor="middle">多跳推理与全局归纳</text>
  <text x="560" y="444" font-size="9.5" fill="#424245" text-anchor="middle">实体关系图 + 社区摘要</text>
  <text x="820" y="444" font-size="9.5" fill="#424245" text-anchor="middle">建图成本高、消歧难</text>

  <text x="30" y="510" font-size="10" fill="#6e6e73">选型主线：先把 G1 建库做扎实 → G2/G3 是标准在线流水线 → 仅当有多跳/全局需求时才升级到 G4。</text>
</svg>