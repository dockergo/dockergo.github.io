<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="960" height="600" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">RAG · 检索增强生成 · 生态架构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">模型的知识封存在权重里、会过期也会幻觉——RAG 让模型在生成前先检索外部知识，把答案锚定在可溯源的证据上</text>

  <!-- 离线索引侧 -->
  <g filter="url(#soft)"><rect x="60" y="90" width="380" height="150" rx="13" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="250" y="118" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">离线 · 索引构建 (Indexing)</text>
  <text x="82" y="146" font-size="10" fill="#6e6e73">• 原始文档 → 清洗 → 分块 (Chunking)</text>
  <text x="82" y="170" font-size="10" fill="#6e6e73">• 每块经 Embedding 编码为向量</text>
  <text x="82" y="194" font-size="10" fill="#6e6e73">• 存入向量库 + 关键词倒排索引</text>
  <text x="82" y="220" font-size="9.5" fill="#2dd4bf">一次建库，多次复用</text>

  <!-- 在线检索生成侧 -->
  <g filter="url(#soft)"><rect x="520" y="90" width="380" height="150" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="710" y="118" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">在线 · 检索生成 (Retrieval+Gen)</text>
  <text x="542" y="146" font-size="10" fill="#6e6e73">• 用户 query → 检索 Top-k 候选</text>
  <text x="542" y="170" font-size="10" fill="#6e6e73">• Rerank 精排 → 上下文压缩</text>
  <text x="542" y="194" font-size="10" fill="#6e6e73">• 证据拼入 Prompt → LLM 生成带引用答案</text>
  <text x="542" y="220" font-size="9.5" fill="#0a84ff">每次 query 实时执行</text>

  <path d="M440 165 L516 165" stroke="#2dd4bf" stroke-width="2" marker-end="url(#art)"/>
  <text x="478" y="158" font-size="9" fill="#6e6e73" text-anchor="middle">共享索引</text>

  <!-- 四机制铺垫 -->
  <g filter="url(#soft)"><rect x="60" y="290" width="840" height="180" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="80" y="318" font-size="12" font-weight="600" fill="#1d1d1f">本模块的四条机理线</text>
  <text x="80" y="344" font-size="10.5" fill="#6e6e73">G1 索引构建：分块 + Embedding + 建索引——检索质量的上限由建库阶段决定，切得好坏定成败</text>
  <text x="80" y="370" font-size="10.5" fill="#6e6e73">G2 混合检索：向量语义召回 + 关键词精确召回，二者融合互补，兼顾"意思对"与"字面对"</text>
  <text x="80" y="396" font-size="10.5" fill="#6e6e73">G3 重排生成：Rerank 精排把最相关的证据顶上来，上下文压缩去冗，再交给 LLM 生成带引用的答案</text>
  <text x="80" y="422" font-size="10.5" fill="#6e6e73">G4 图谱检索：构建实体关系图 + 社区摘要，回答需要跨文档串联、全局归纳的复杂问题 (GraphRAG)</text>
  <text x="80" y="450" font-size="10" fill="#f5873a">核心张力：召回不足则答不全，召回过多则噪声淹没答案——精度与召回的平衡是 RAG 的永恒命题</text>

  <!-- 底部闭环 -->
  <g filter="url(#soft)"><rect x="60" y="500" width="840" height="70" rx="13" fill="#fff3ea" stroke="#f5873a" stroke-width="1.3"/></g>
  <text x="80" y="528" font-size="11.5" font-weight="600" fill="#1d1d1f">为什么需要 RAG</text>
  <text x="80" y="552" font-size="10" fill="#6e6e73">知识时效性 (权重会过期) + 领域私有数据 (模型没见过) + 可溯源抗幻觉 (答案有出处) —— 检索是"外挂知识库"</text>

  <line x1="678" y1="588" x2="700" y2="588" stroke="#0a84ff" stroke-width="2"/><text x="706" y="591" font-size="9" fill="#6e6e73">在线热路径</text>
  <line x1="778" y1="588" x2="800" y2="588" stroke="#2dd4bf" stroke-width="2"/><text x="806" y="591" font-size="9" fill="#6e6e73">离线数据流</text>
</svg>