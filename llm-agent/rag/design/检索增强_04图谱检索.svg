<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">G4 · 图谱检索：实体关系 + 社区摘要 (GraphRAG)</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">向量检索按"块"召回、答不了需要跨文档串联与全局归纳的问题——图谱把知识组织成实体与关系</text>

  <!-- 离线建图 -->
  <g filter="url(#soft)"><rect x="40" y="90" width="400" height="150" rx="13" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="240" y="118" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">离线 · 构建知识图谱</text>
  <text x="62" y="146" font-size="10" fill="#6e6e73">• LLM 从文档抽取实体 (人/组织/概念)</text>
  <text x="62" y="170" font-size="10" fill="#6e6e73">• 抽取实体间关系 → 构成图 (节点+边)</text>
  <text x="62" y="194" font-size="10" fill="#6e6e73">• 图聚类为社区 → 逐社区生成摘要</text>
  <text x="62" y="220" font-size="9.5" fill="#2dd4bf">得到多层次结构化知识，而非离散文本块</text>

  <!-- 在线查询 -->
  <g filter="url(#soft)"><rect x="520" y="90" width="400" height="150" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="720" y="118" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">在线 · 图谱增强检索</text>
  <text x="542" y="146" font-size="10" fill="#6e6e73">• 局部问题：定位实体 → 沿关系边多跳游走</text>
  <text x="542" y="170" font-size="10" fill="#6e6e73">• 全局问题：聚合相关社区摘要 → 归纳作答</text>
  <text x="542" y="194" font-size="10" fill="#6e6e73">• 图结构 + 向量检索互补组合使用</text>
  <text x="542" y="220" font-size="9.5" fill="#0a84ff">能回答"整个文档集讲了什么"这类总览题</text>

  <path d="M440 165 L516 165" stroke="#2dd4bf" stroke-width="2" marker-end="url(#art)"/>

  <g filter="url(#soft)"><rect x="40" y="270" width="880" height="230" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="62" y="298" font-size="12" font-weight="600" fill="#1d1d1f">普通 RAG 答不好、图谱 RAG 才能答的两类问题</text>
  <text x="62" y="324" font-size="10.5" fill="#6e6e73">• 多跳推理："A 的导师的另一个学生是谁" —— 需沿实体关系链游走，单块文本没有完整路径</text>
  <text x="62" y="348" font-size="10.5" fill="#6e6e73">• 全局归纳："这批报告反映的主要趋势是什么" —— 答案分散在成百上千块里，向量检索只能取回零星几块</text>
  <text x="62" y="376" font-size="10.5" fill="#0a84ff">图谱 RAG 的代价：建图依赖 LLM 抽取，成本高、耗时长；实体消歧与关系准确度直接影响质量</text>
  <text x="62" y="400" font-size="10.5" fill="#0a84ff">社区摘要是"分层归纳"：先摘要子社区，再摘要父社区，全局问题可逐层聚合而不必读全文</text>
  <text x="62" y="428" font-size="10.5" fill="#6e6e73">实践：图谱 RAG 与向量 RAG 并非替代关系——事实性精确问答用向量，关系/全局性问题用图谱，二者互补</text>
  <text x="62" y="456" font-size="10" fill="#f5873a">取舍：图谱构建与维护成本高，仅当业务确有多跳/全局需求时才值得引入，否则向量 RAG 更简单高效</text>
  <text x="62" y="484" font-size="10" fill="#6e6e73">代表方案：微软 GraphRAG——实体抽取 + Leiden 社区检测 + 分层社区摘要 + 局部/全局双查询模式</text>
</svg>