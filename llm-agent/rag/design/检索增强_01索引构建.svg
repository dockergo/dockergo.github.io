<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">G1 · 索引构建：分块 + 嵌入 + 建索引</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">离线阶段一次性完成——检索质量的天花板在这里就被决定，"切得好坏定成败"</text>

  <g filter="url(#soft)"><rect x="40" y="110" width="150" height="90" rx="12" fill="#f5f5f7" stroke="#86868b" stroke-width="1.4"/></g>
  <text x="115" y="150" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">原始文档</text>
  <text x="115" y="172" font-size="9.5" fill="#6e6e73" text-anchor="middle">PDF/网页/DB</text>

  <g filter="url(#soft)"><rect x="230" y="110" width="150" height="90" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="305" y="145" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">清洗 + 分块</text>
  <text x="305" y="167" font-size="9" fill="#6e6e73" text-anchor="middle">按语义/长度切 Chunk</text>
  <text x="305" y="184" font-size="9" fill="#6e6e73" text-anchor="middle">保留重叠防断裂</text>

  <g filter="url(#soft)"><rect x="420" y="110" width="150" height="90" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="495" y="145" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Embedding 编码</text>
  <text x="495" y="167" font-size="9" fill="#6e6e73" text-anchor="middle">每块 → 高维向量</text>
  <text x="495" y="184" font-size="9" fill="#6e6e73" text-anchor="middle">语义相近则距离近</text>

  <g filter="url(#soft)"><rect x="610" y="110" width="150" height="90" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="685" y="145" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">建索引入库</text>
  <text x="685" y="167" font-size="9" fill="#6e6e73" text-anchor="middle">向量库 (ANN 索引)</text>
  <text x="685" y="184" font-size="9" fill="#6e6e73" text-anchor="middle">+ 倒排关键词索引</text>

  <path d="M190 155 L226 155" stroke="#2dd4bf" stroke-width="2" marker-end="url(#art)"/>
  <path d="M380 155 L416 155" stroke="#2dd4bf" stroke-width="2" marker-end="url(#art)"/>
  <path d="M570 155 L606 155" stroke="#2dd4bf" stroke-width="2" marker-end="url(#art)"/>

  <g filter="url(#soft)"><rect x="40" y="250" width="720" height="200" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="278" font-size="12" font-weight="600" fill="#1d1d1f">分块 (Chunking) 是最关键也最被低估的一步</text>
  <text x="60" y="304" font-size="10.5" fill="#6e6e73">• 块太大：一块塞进多个主题，向量被"平均"稀释，检索时语义不聚焦</text>
  <text x="60" y="328" font-size="10.5" fill="#6e6e73">• 块太小：语义被切碎，单块信息不完整，答案要跨多块拼凑</text>
  <text x="60" y="352" font-size="10.5" fill="#6e6e73">• 相邻块保留重叠 (overlap)：避免关键句正好被切在边界上而丢失</text>
  <text x="60" y="376" font-size="10.5" fill="#6e6e73">• 附带元数据：标题、来源、时间戳——供检索过滤与答案溯源</text>
  <text x="60" y="404" font-size="10.5" fill="#0a84ff">• Embedding 模型的选择决定语义空间质量：领域数据宜选贴合领域的模型</text>
  <text x="60" y="432" font-size="10" fill="#f5873a">铁律：垃圾进，垃圾出——建库阶段的疏忽，后续任何检索技巧都补不回来</text>

  <line x1="778" y1="440" x2="800" y2="440" stroke="#2dd4bf" stroke-width="2"/><text x="806" y="443" font-size="9" fill="#6e6e73">离线数据流</text>
</svg>