<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">G2 · 混合检索：向量 + 关键词双路召回</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">向量懂"意思对"，关键词管"字面对"——两路互补，融合排序，覆盖单一检索的盲区</text>

  <g filter="url(#soft)"><rect x="40" y="200" width="150" height="80" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="115" y="235" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">用户 Query</text>
  <text x="115" y="257" font-size="9" fill="#6e6e73" text-anchor="middle">自然语言问题</text>

  <!-- 向量路 -->
  <g filter="url(#soft)"><rect x="260" y="110" width="230" height="90" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="375" y="140" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">向量检索 (语义)</text>
  <text x="280" y="164" font-size="9.5" fill="#6e6e73">query → Embedding → ANN 近邻</text>
  <text x="280" y="184" font-size="9.5" fill="#6e6e73">优势：懂同义、改写、意图</text>

  <!-- 关键词路 -->
  <g filter="url(#soft)"><rect x="260" y="290" width="230" height="90" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="375" y="320" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">关键词检索 (BM25)</text>
  <text x="280" y="344" font-size="9.5" fill="#6e6e73">倒排索引 → 精确词命中</text>
  <text x="280" y="364" font-size="9.5" fill="#6e6e73">优势：专有名词、编号、代码</text>

  <g filter="url(#soft)"><rect x="560" y="200" width="180" height="90" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="650" y="230" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">融合排序</text>
  <text x="650" y="253" font-size="9" fill="#6e6e73" text-anchor="middle">RRF / 加权分数合并</text>
  <text x="650" y="272" font-size="9" fill="#6e6e73" text-anchor="middle">→ 统一 Top-k 候选集</text>

  <path d="M190 232 L256 165" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#art)"/>
  <path d="M190 250 L256 328" stroke="#f5873a" stroke-width="1.8" marker-end="url(#art)"/>
  <path d="M490 155 L556 225" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#art)"/>
  <path d="M490 335 L556 268" stroke="#f5873a" stroke-width="1.8" marker-end="url(#art)"/>

  <g filter="url(#soft)"><rect x="40" y="410" width="880" height="60" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="435" font-size="11" fill="#6e6e73">为什么单路不够：纯向量会漏掉"零件号 A-7734"这类无语义的精确串；纯关键词答不了"怎么让它更快"这类语义改写。</text>
  <text x="60" y="457" font-size="10.5" fill="#0a84ff">融合关键在归一化不同评分体系 (RRF 用排名而非原始分)，让两路结果公平竞争，再交给下游 Rerank 精排。</text>
</svg>