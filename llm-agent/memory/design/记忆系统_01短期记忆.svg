<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">短期记忆 · 对话缓冲与滚动摘要</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">上下文窗口有限，塞不下全部历史——用「近期原文 + 早期摘要」的策略在预算内保住最相关信息</text>

  <!-- 完整历史 -->
  <g filter="url(#soft)"><rect x="60" y="100" width="200" height="320" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="160" y="126" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">完整对话历史</text>
  <text x="160" y="146" font-size="9" fill="#6e6e73" text-anchor="middle">不断增长，超出窗口</text>
  <g><rect x="80" y="160" width="160" height="30" rx="6" fill="#ffffff" stroke="#e0e0e5"/><text x="90" y="180" font-size="9" fill="#86868b">turn 1 ~ 早期</text></g>
  <g><rect x="80" y="196" width="160" height="30" rx="6" fill="#ffffff" stroke="#e0e0e5"/><text x="90" y="216" font-size="9" fill="#86868b">turn 2 ~ 早期</text></g>
  <g><rect x="80" y="232" width="160" height="30" rx="6" fill="#ffffff" stroke="#e0e0e5"/><text x="90" y="252" font-size="9" fill="#86868b">turn 3 ~ 中段</text></g>
  <g><rect x="80" y="300" width="160" height="30" rx="6" fill="#eef4ff" stroke="#0a84ff"/><text x="90" y="320" font-size="9" fill="#0a84ff">turn N-1 (近期)</text></g>
  <g><rect x="80" y="336" width="160" height="30" rx="6" fill="#eef4ff" stroke="#0a84ff"/><text x="90" y="356" font-size="9" fill="#0a84ff">turn N (近期)</text></g>

  <!-- 摘要器 -->
  <g filter="url(#soft)"><rect x="340" y="160" width="180" height="90" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="430" y="192" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">摘要器</text>
  <text x="430" y="214" font-size="9.5" fill="#6e6e73" text-anchor="middle">把早期原文</text>
  <text x="430" y="232" font-size="9.5" fill="#6e6e73" text-anchor="middle">压缩成滚动摘要</text>

  <!-- 组装的上下文 -->
  <g filter="url(#soft)"><rect x="600" y="100" width="300" height="320" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="750" y="126" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">送入模型的工作记忆</text>
  <text x="750" y="146" font-size="9" fill="#6e6e73" text-anchor="middle">= 摘要 + 近期原文，卡在窗口预算内</text>
  <g><rect x="624" y="164" width="252" height="70" rx="8" fill="#f3ecff" stroke="#a78bfa"/><text x="640" y="190" font-size="10" fill="#a78bfa">【早期对话摘要】</text><text x="640" y="212" font-size="9" fill="#6e6e73">用户目标 / 已确认事实 / 关键决策…</text></g>
  <g><rect x="624" y="248" width="252" height="34" rx="8" fill="#ffffff" stroke="#0a84ff"/><text x="640" y="270" font-size="9.5" fill="#0a84ff">turn N-1 原文（保真）</text></g>
  <g><rect x="624" y="290" width="252" height="34" rx="8" fill="#ffffff" stroke="#0a84ff"/><text x="640" y="312" font-size="9.5" fill="#0a84ff">turn N 原文（保真）</text></g>
  <text x="624" y="356" font-size="9.5" fill="#6e6e73">近期保原文避免信息损失，早期用摘要节省 token</text>
  <text x="624" y="378" font-size="9.5" fill="#f5873a">权衡：摘要越激进越省钱，但可能丢掉后来才用到的细节</text>

  <path d="M260 210 L336 205" stroke="#b8b8bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M520 200 L596 190" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M260 340 C420 420 470 400 620 290" stroke="#0a84ff" stroke-width="1.6" fill="none" marker-end="url(#arh)"/>
</svg>