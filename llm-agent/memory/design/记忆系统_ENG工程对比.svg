<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">记忆系统的工程铁律</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">记忆让 Agent 从「无状态问答」进化为「有连续性的助手」，但记忆本身需要被严肃治理</text>

  <g filter="url(#soft)"><rect x="30" y="80" width="290" height="180" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="175" y="108" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">① 写什么进记忆</text>
  <text x="52" y="138" font-size="10" fill="#6e6e73">• 只记长期有用：偏好/事实/结论</text>
  <text x="52" y="160" font-size="10" fill="#6e6e73">• 写入前去重、合并，避免膨胀</text>
  <text x="52" y="182" font-size="10" fill="#6e6e73">• 敏感信息（密钥/隐私）不入库</text>
  <text x="52" y="204" font-size="10" fill="#6e6e73">• 附时间戳与来源，便于消解冲突</text>
  <text x="52" y="230" font-size="9.5" fill="#0a84ff">写入判定是记忆质量的第一道闸</text>

  <g filter="url(#soft)"><rect x="335" y="80" width="290" height="180" rx="13" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="480" y="108" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">② 怎么读回来</text>
  <text x="357" y="138" font-size="10" fill="#6e6e73">• 语义检索 Top-k，控制注入量</text>
  <text x="357" y="160" font-size="10" fill="#6e6e73">• 相关性阈值过滤，宁缺毋滥</text>
  <text x="357" y="182" font-size="10" fill="#6e6e73">• 召回内容标注来源，防幻觉</text>
  <text x="357" y="204" font-size="10" fill="#6e6e73">• 与短期上下文合并去冗</text>
  <text x="357" y="230" font-size="9.5" fill="#2dd4bf">召回噪声会直接污染推理</text>

  <g filter="url(#soft)"><rect x="640" y="80" width="290" height="180" rx="13" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="785" y="108" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">③ 何时遗忘</text>
  <text x="662" y="138" font-size="10" fill="#6e6e73">• 时间衰减 + 冷数据淘汰</text>
  <text x="662" y="160" font-size="10" fill="#6e6e73">• 新事实覆盖过期旧事实</text>
  <text x="662" y="182" font-size="10" fill="#6e6e73">• 容量上限，防无限增长</text>
  <text x="662" y="204" font-size="10" fill="#6e6e73">• 支持用户主动「忘记」</text>
  <text x="662" y="230" font-size="9.5" fill="#f5873a">不遗忘 = 长期退化</text>

  <g filter="url(#soft)"><rect x="30" y="290" width="900" height="180" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="52" y="320" font-size="12.5" font-weight="600" fill="#1d1d1f">核心权衡：记忆越多 ≠ 越聪明</text>
  <text x="52" y="350" font-size="10.5" fill="#6e6e73">• 信噪比优先：一条精准记忆胜过十条冗余记忆，检索精度随库噪声上升而下降</text>
  <text x="52" y="374" font-size="10.5" fill="#6e6e73">• 成本平衡：短期记忆吃 token 成本，长期记忆吃存储与检索成本，需按场景分配</text>
  <text x="52" y="398" font-size="10.5" fill="#6e6e73">• 隐私合规：记忆持久化意味着数据留存，需明确保留策略、脱敏与用户删除权</text>
  <text x="52" y="422" font-size="10.5" fill="#6e6e73">• 可解释：记忆应可追溯来源，让「Agent 为何这么答」可审计，避免黑盒漂移</text>
  <text x="52" y="452" font-size="10" fill="#a78bfa">一句话：记忆系统的工程重心不在「存」，而在「治」——写入判定、召回过滤与遗忘策略三位一体</text>
</svg>