<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">长期记忆 · 向量化存储与语义检索</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">把值得留存的知识与经验编码为向量存入外部库，用时按语义相似度召回——突破上下文窗口的容量上限</text>

  <!-- 写入路径 -->
  <text x="60" y="94" font-size="11.5" font-weight="600" fill="#2dd4bf">写入 (Write)</text>
  <g filter="url(#soft)"><rect x="60" y="106" width="150" height="60" rx="10" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="135" y="134" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">记忆片段</text>
  <text x="135" y="153" font-size="9" fill="#6e6e73" text-anchor="middle">事实/经验/偏好</text>
  <g filter="url(#soft)"><rect x="260" y="106" width="150" height="60" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="335" y="134" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Embedding</text>
  <text x="335" y="153" font-size="9" fill="#6e6e73" text-anchor="middle">编码为向量</text>

  <!-- 向量库 -->
  <g filter="url(#soft)"><rect x="470" y="86" width="220" height="220" rx="14" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.6"/></g>
  <text x="580" y="114" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">向量数据库</text>
  <text x="580" y="134" font-size="9" fill="#6e6e73" text-anchor="middle">(vector, metadata, text)</text>
  <g><rect x="492" y="150" width="176" height="26" rx="6" fill="#ffffff" stroke="#c9efe7"/><text x="502" y="168" font-size="9" fill="#6e6e73">vec · 用户偏爱简洁回复</text></g>
  <g><rect x="492" y="182" width="176" height="26" rx="6" fill="#ffffff" stroke="#c9efe7"/><text x="502" y="200" font-size="9" fill="#6e6e73">vec · 项目部署在 K8s</text></g>
  <g><rect x="492" y="214" width="176" height="26" rx="6" fill="#ffffff" stroke="#c9efe7"/><text x="502" y="232" font-size="9" fill="#6e6e73">vec · 上次修复的 bug…</text></g>
  <text x="580" y="272" font-size="9" fill="#6e6e73" text-anchor="middle">ANN 索引，支持相似度检索</text>
  <text x="580" y="292" font-size="9" fill="#2dd4bf" text-anchor="middle">持久化 · 跨会话可用</text>

  <!-- 读取路径 -->
  <text x="60" y="360" font-size="11.5" font-weight="600" fill="#0a84ff">读取 (Recall)</text>
  <g filter="url(#soft)"><rect x="60" y="372" width="180" height="60" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="150" y="400" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">当前 query / 意图</text>
  <text x="150" y="419" font-size="9" fill="#6e6e73" text-anchor="middle">编码为查询向量</text>
  <g filter="url(#soft)"><rect x="740" y="372" width="160" height="60" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="820" y="400" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Top-k 记忆</text>
  <text x="820" y="419" font-size="9" fill="#6e6e73" text-anchor="middle">拼入上下文</text>

  <path d="M210 136 L256 136" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#art)"/>
  <path d="M410 136 L466 150" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#art)"/>
  <path d="M240 402 C400 402 420 250 470 220" stroke="#0a84ff" stroke-width="1.6" fill="none" marker-end="url(#arh)"/>
  <path d="M690 240 C760 300 780 340 800 368" stroke="#0a84ff" stroke-width="1.6" fill="none" marker-end="url(#arh)"/>
  <text x="360" y="470" font-size="10" fill="#f5873a">要点：召回质量 = 写入质量 × 检索质量；存了噪声记忆，检索只会更快地喂回噪声</text>
</svg>