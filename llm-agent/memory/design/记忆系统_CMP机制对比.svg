<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="480" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">短期 vs 长期记忆 · 机制对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">两者不是二选一，而是互补的两层——工作记忆保当下连贯，持久记忆保跨会话经验</text>

  <!-- 表头 -->
  <g filter="url(#soft)"><rect x="30" y="80" width="900" height="42" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.3"/></g>
  <text x="150" y="106" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">维度</text>
  <text x="420" y="106" font-size="11.5" font-weight="600" fill="#0a84ff" text-anchor="middle">短期记忆 (工作记忆)</text>
  <text x="720" y="106" font-size="11.5" font-weight="600" fill="#2dd4bf" text-anchor="middle">长期记忆 (持久记忆)</text>

  <g filter="url(#soft)"><rect x="30" y="132" width="900" height="52" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="150" y="163" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">载体</text>
  <text x="420" y="163" font-size="10" fill="#6e6e73" text-anchor="middle">上下文窗口内的对话缓冲/摘要</text>
  <text x="720" y="163" font-size="10" fill="#6e6e73" text-anchor="middle">外部向量库 / 数据库</text>

  <g filter="url(#soft)"><rect x="30" y="194" width="900" height="52" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="150" y="225" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">生命周期</text>
  <text x="420" y="225" font-size="10" fill="#6e6e73" text-anchor="middle">一次会话，随窗口滑动遗忘</text>
  <text x="720" y="225" font-size="10" fill="#6e6e73" text-anchor="middle">持久，跨会话/跨天可用</text>

  <g filter="url(#soft)"><rect x="30" y="256" width="900" height="52" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="150" y="287" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">访问方式</text>
  <text x="420" y="287" font-size="10" fill="#6e6e73" text-anchor="middle">全量在场，直接可见</text>
  <text x="720" y="287" font-size="10" fill="#6e6e73" text-anchor="middle">按需语义检索 Top-k 召回</text>

  <g filter="url(#soft)"><rect x="30" y="318" width="900" height="52" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="150" y="349" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">主要瓶颈</text>
  <text x="420" y="349" font-size="10" fill="#6e6e73" text-anchor="middle">窗口容量与 token 成本</text>
  <text x="720" y="349" font-size="10" fill="#6e6e73" text-anchor="middle">检索精度与记忆治理</text>

  <g filter="url(#soft)"><rect x="30" y="380" width="900" height="60" rx="10" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.2"/></g>
  <text x="150" y="415" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">典型协作</text>
  <text x="675" y="415" font-size="10" fill="#6e6e73" text-anchor="middle">短期记忆的重要内容经写入判定固化为长期记忆；长期记忆按需召回后注入短期工作记忆</text>
</svg>