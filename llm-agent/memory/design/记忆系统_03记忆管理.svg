<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">记忆管理 · 写入判定与遗忘衰减</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">记忆不是「越多越好」——治理层决定什么该被记住、什么该被遗忘，防止噪声污染检索</text>

  <!-- 写入判定 -->
  <g filter="url(#soft)"><rect x="60" y="100" width="200" height="90" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="160" y="130" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">新信息产生</text>
  <text x="160" y="152" font-size="9.5" fill="#6e6e73" text-anchor="middle">对话/工具结果/结论</text>
  <text x="160" y="172" font-size="9.5" fill="#6e6e73" text-anchor="middle">候选记忆片段</text>

  <g filter="url(#soft)"><rect x="340" y="90" width="220" height="110" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="450" y="118" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">写入判定</text>
  <text x="360" y="144" font-size="9.5" fill="#6e6e73">• 是否长期有用？(偏好/事实)</text>
  <text x="360" y="166" font-size="9.5" fill="#6e6e73">• 是否已存在？(去重/合并)</text>
  <text x="360" y="188" font-size="9.5" fill="#6e6e73">• 敏感信息不入库</text>

  <!-- 记忆库 -->
  <g filter="url(#soft)"><rect x="660" y="90" width="240" height="110" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="780" y="118" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">长期记忆库</text>
  <text x="680" y="144" font-size="9.5" fill="#6e6e73">存入的每条带时间戳/权重</text>
  <text x="680" y="166" font-size="9.5" fill="#6e6e73">短期记忆定期固化到这里</text>
  <text x="680" y="188" font-size="9.5" fill="#2dd4bf">质量 > 数量</text>

  <path d="M260 145 L336 145" stroke="#0a84ff" stroke-width="1.8" marker-end="url(#arh)"/>
  <path d="M560 145 L656 145" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arp)"/>

  <!-- 遗忘衰减 -->
  <g filter="url(#soft)"><rect x="340" y="250" width="220" height="120" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="450" y="278" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">遗忘 / 衰减</text>
  <text x="360" y="304" font-size="9.5" fill="#6e6e73">• 时间衰减：久未命中降权</text>
  <text x="360" y="326" font-size="9.5" fill="#6e6e73">• 容量淘汰：超限逐出最冷</text>
  <text x="360" y="348" font-size="9.5" fill="#6e6e73">• 冲突消解：新事实覆盖旧</text>

  <path d="M780 200 C780 250 620 300 562 310" stroke="#f5873a" stroke-width="1.6" stroke-dasharray="3 3" fill="none" marker-end="url(#arf)"/>
  <path d="M338 310 C260 310 240 220 258 195" stroke="#f5873a" stroke-width="1.6" stroke-dasharray="3 3" fill="none"/>
  <text x="150" y="290" font-size="9.5" fill="#f5873a">被遗忘的记忆</text>
  <text x="150" y="310" font-size="9.5" fill="#f5873a">不再参与检索</text>

  <!-- 底部要点 -->
  <g filter="url(#soft)"><rect x="60" y="410" width="840" height="90" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="80" y="438" font-size="12" font-weight="600" fill="#1d1d1f">为什么遗忘和记住同等重要</text>
  <text x="80" y="462" font-size="10.5" fill="#6e6e73">• 无限累积的记忆会让向量库充满陈旧、重复、矛盾的条目，检索精度反而下降</text>
  <text x="80" y="484" font-size="10.5" fill="#6e6e73">• 主动遗忘让记忆库保持「高信噪比」，是长期运行 Agent 不退化的关键治理手段</text>
</svg>