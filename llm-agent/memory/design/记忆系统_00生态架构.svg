<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="960" height="600" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Agent 记忆系统 · 生态架构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">模型的上下文窗口是有限且短暂的「工作记忆」——记忆系统的使命是让 Agent 跨越单轮与单次会话，记住该记住的</text>

  <!-- 推理内核 -->
  <g filter="url(#soft)"><rect x="360" y="90" width="240" height="80" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="480" y="122" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">推理内核 (LLM)</text>
  <text x="480" y="146" font-size="10" fill="#6e6e73" text-anchor="middle">上下文窗口 = 有限的工作记忆</text>

  <!-- 短期记忆 -->
  <g filter="url(#soft)"><rect x="60" y="230" width="250" height="150" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="185" y="260" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">短期记忆</text>
  <text x="82" y="288" font-size="10" fill="#6e6e73">• 当前会话的对话缓冲</text>
  <text x="82" y="310" font-size="10" fill="#6e6e73">• 滚动摘要压缩历史</text>
  <text x="82" y="332" font-size="10" fill="#6e6e73">• 随窗口滑动而遗忘</text>
  <text x="82" y="356" font-size="9.5" fill="#0a84ff">生命周期 = 一次会话</text>

  <!-- 长期记忆 -->
  <g filter="url(#soft)"><rect x="355" y="230" width="250" height="150" rx="13" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="480" y="260" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">长期记忆</text>
  <text x="377" y="288" font-size="10" fill="#6e6e73">• 向量库持久化存储</text>
  <text x="377" y="310" font-size="10" fill="#6e6e73">• 按需语义检索召回</text>
  <text x="377" y="332" font-size="10" fill="#6e6e73">• 跨会话、跨天可用</text>
  <text x="377" y="356" font-size="9.5" fill="#2dd4bf">生命周期 = 持久</text>

  <!-- 记忆管理 -->
  <g filter="url(#soft)"><rect x="650" y="230" width="250" height="150" rx="13" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="775" y="260" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">记忆管理</text>
  <text x="672" y="288" font-size="10" fill="#6e6e73">• 写入判定：什么值得记</text>
  <text x="672" y="310" font-size="10" fill="#6e6e73">• 遗忘衰减与去重</text>
  <text x="672" y="332" font-size="10" fill="#6e6e73">• 短期→长期的固化</text>
  <text x="672" y="356" font-size="9.5" fill="#a78bfa">控制面：治理记忆质量</text>

  <path d="M420 172 L250 226" stroke="#0a84ff" stroke-width="2" marker-end="url(#arh)"/>
  <path d="M480 172 L480 226" stroke="#2dd4bf" stroke-width="2" marker-end="url(#art)"/>
  <path d="M540 172 L710 226" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <path d="M310 300 L352 300" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <path d="M648 300 L608 300" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <!-- 三机制铺垫 -->
  <g filter="url(#soft)"><rect x="60" y="420" width="840" height="150" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="80" y="448" font-size="12" font-weight="600" fill="#1d1d1f">本模块的三条机理线</text>
  <text x="80" y="474" font-size="10.5" fill="#6e6e73">M1 短期记忆：对话缓冲 + 滚动摘要，在有限窗口内保住最相关的近期上下文</text>
  <text x="80" y="498" font-size="10.5" fill="#6e6e73">M2 长期记忆：把知识与经验向量化存入外部库，按需语义检索召回，突破窗口限制</text>
  <text x="80" y="522" font-size="10.5" fill="#6e6e73">M3 记忆管理：决定什么该写入、何时遗忘、如何去重与固化——记忆的质量取决于治理</text>
  <text x="80" y="550" font-size="10" fill="#f5873a">核心张力：记得越多越聪明，但噪声记忆会污染检索、拖累推理——写入与遗忘同等重要</text>

  <!-- 图例 -->
  <g filter="url(#soft)"><rect x="670" y="70" width="230" height="12" rx="0" fill="none"/></g>
  <line x1="678" y1="588" x2="700" y2="588" stroke="#0a84ff" stroke-width="2"/><text x="706" y="591" font-size="9" fill="#6e6e73">读写热路径</text>
  <line x1="778" y1="588" x2="800" y2="588" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/><text x="806" y="591" font-size="9" fill="#6e6e73">控制/管理</text>
</svg>