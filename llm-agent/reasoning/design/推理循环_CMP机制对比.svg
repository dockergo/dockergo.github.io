<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">四种推理范式 · 横向对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">从线性试探到树状搜索：探索广度、纠错能力、成本随复杂度递增</text>

  <!-- 表头 -->
  <g font-size="11" font-weight="600" fill="#1d1d1f">
    <text x="150" y="96" text-anchor="middle">范式</text>
    <text x="330" y="96" text-anchor="middle">推理结构</text>
    <text x="500" y="96" text-anchor="middle">纠错方式</text>
    <text x="660" y="96" text-anchor="middle">适用场景</text>
    <text x="850" y="96" text-anchor="middle">成本</text>
  </g>
  <line x1="30" y1="108" x2="930" y2="108" stroke="#d2d2d7" stroke-width="1.2"/>

  <!-- ReAct -->
  <g filter="url(#soft)"><rect x="40" y="122" width="200" height="76" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="140" y="152" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">ReAct</text>
  <text x="140" y="174" font-size="10" fill="#6e6e73" text-anchor="middle">思考→行动→观察</text>
  <text x="140" y="190" font-size="10" fill="#6e6e73" text-anchor="middle">线性循环</text>
  <text x="330" y="166" font-size="10.5" fill="#6e6e73" text-anchor="middle">线性单链</text>
  <text x="500" y="166" font-size="10.5" fill="#6e6e73" text-anchor="middle">靠观察即时修正</text>
  <text x="660" y="166" font-size="10.5" fill="#6e6e73" text-anchor="middle">工具型交互任务</text>
  <text x="850" y="166" font-size="10.5" fill="#2dd4bf" text-anchor="middle">低</text>

  <!-- Plan-Execute -->
<g filter="url(#soft)"><rect x="40" y="212" width="200" height="76" rx="10" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.4"/></g>
  <text x="140" y="242" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Plan-Execute</text>
  <text x="140" y="264" font-size="10" fill="#6e6e73" text-anchor="middle">先规划全局</text>
  <text x="140" y="280" font-size="10" fill="#6e6e73" text-anchor="middle">再逐步执行</text>
  <text x="330" y="256" font-size="10.5" fill="#6e6e73" text-anchor="middle">计划+执行两段</text>
  <text x="500" y="256" font-size="10.5" fill="#6e6e73" text-anchor="middle">偏差触发重规划</text>
  <text x="660" y="256" font-size="10.5" fill="#6e6e73" text-anchor="middle">多步长流程任务</text>
  <text x="850" y="256" font-size="10.5" fill="#2dd4bf" text-anchor="middle">中</text>

  <!-- Reflexion -->
  <g filter="url(#soft)"><rect x="40" y="302" width="200" height="76" rx="10" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="140" y="332" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Reflexion</text>
  <text x="140" y="354" font-size="10" fill="#6e6e73" text-anchor="middle">失败→语言反思</text>
  <text x="140" y="370" font-size="10" fill="#6e6e73" text-anchor="middle">带经验重试</text>
  <text x="330" y="346" font-size="10.5" fill="#6e6e73" text-anchor="middle">多轮迭代</text>
  <text x="500" y="346" font-size="10.5" fill="#6e6e73" text-anchor="middle">显式自我反思记忆</text>
  <text x="660" y="346" font-size="10.5" fill="#6e6e73" text-anchor="middle">可验证/可评分任务</text>
  <text x="850" y="346" font-size="10.5" fill="#f5873a" text-anchor="middle">中高</text>

  <!-- ToT -->
  <g filter="url(#soft)"><rect x="40" y="392" width="200" height="76" rx="10" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="140" y="422" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Tree of Thoughts</text>
  <text x="140" y="444" font-size="10" fill="#6e6e73" text-anchor="middle">多分支展开</text>
  <text x="140" y="460" font-size="10" fill="#6e6e73" text-anchor="middle">评估+剪枝+回溯</text>
  <text x="330" y="436" font-size="10.5" fill="#6e6e73" text-anchor="middle">树状搜索</text>
  <text x="500" y="436" font-size="10.5" fill="#6e6e73" text-anchor="middle">剪枝差路换优路</text>
  <text x="660" y="436" font-size="10.5" fill="#6e6e73" text-anchor="middle">高难度求解/规划</text>
  <text x="850" y="436" font-size="10.5" fill="#f5873a" text-anchor="middle">高</text>

  <text x="480" y="500" font-size="11" fill="#6e6e73" text-anchor="middle">选型原则：能用简单范式解决就不上复杂搜索 —— 复杂度换准确率，成本随之抬升</text>
</svg>