<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="960" height="540" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Tree of Thoughts · 多路径探索与回溯</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">不再线性一条路走到黑：把推理展开成树，评估每个分支，剪枝差路、保留优路</text>

  <!-- root -->
  <g filter="url(#soft)"><rect x="410" y="90" width="140" height="52" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="480" y="122" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">问题根节点</text>

  <!-- level1 三分支 -->
  <g filter="url(#soft)"><rect x="150" y="220" width="150" height="60" rx="11" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.4"/></g>
  <text x="225" y="246" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">思路 A</text>
  <text x="225" y="266" font-size="10" fill="#2dd4bf" text-anchor="middle">评分 0.8 ✓保留</text>

  <g filter="url(#soft)"><rect x="405" y="220" width="150" height="60" rx="11" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.4"/></g>
  <text x="480" y="246" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">思路 B</text>
  <text x="480" y="266" font-size="10" fill="#f5873a" text-anchor="middle">评分 0.3 ✗剪枝</text>

  <g filter="url(#soft)"><rect x="660" y="220" width="150" height="60" rx="11" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.4"/></g>
  <text x="735" y="246" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">思路 C</text>
  <text x="735" y="266" font-size="10" fill="#2dd4bf" text-anchor="middle">评分 0.6 ✓保留</text>

  <path d="M455 142 L250 218" stroke="#0a84ff" stroke-width="1.8" marker-end="url(#arh)"/>
  <path d="M480 142 L480 218" stroke="#f5873a" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#ar)"/>
  <path d="M505 142 L710 218" stroke="#0a84ff" stroke-width="1.8" marker-end="url(#arh)"/>

  <!-- level2 从A/C展开 -->
  <g filter="url(#soft)"><rect x="120" y="360" width="130" height="52" rx="10" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="185" y="391" font-size="11" fill="#1d1d1f" text-anchor="middle">A-1 深化</text>
  <g filter="url(#soft)"><rect x="270" y="360" width="130" height="52" rx="10" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="335" y="391" font-size="11" fill="#1d1d1f" text-anchor="middle">A-2 深化</text>
  <g filter="url(#soft)"><rect x="670" y="360" width="130" height="52" rx="10" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="735" y="391" font-size="11" fill="#1d1d1f" text-anchor="middle">C-1 深化</text>

  <path d="M210 280 L185 358" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M250 280 L335 358" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M735 280 L735 358" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 最优路径出口 -->
  <g filter="url(#soft)"><rect x="270" y="452" width="200" height="52" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.6"/></g>
  <text x="370" y="484" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">最优路径 A-2 → 最终解</text>
  <path d="M335 412 L360 450" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#arh)"/>

  <!-- 搜索策略铭牌 -->
  <g filter="url(#soft)"><rect x="520" y="430" width="290" height="90" rx="11" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="538" y="454" font-size="11.5" font-weight="600" fill="#1d1d1f">搜索控制</text>
  <text x="538" y="476" font-size="10.5" fill="#6e6e73">BFS/DFS 遍历 · LLM 自评每节点价值</text>
  <text x="538" y="496" font-size="10.5" fill="#6e6e73">保留 Top-k 分支，回溯换路，剪掉低分</text>
  <text x="538" y="514" font-size="10" fill="#f5873a">代价：分支越多，token 与时延成倍上升</text>

  <!-- 图例 -->
  <g filter="url(#soft)"><rect x="30" y="452" width="220" height="72" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <line x1="46" y1="476" x2="78" y2="476" stroke="#0a84ff" stroke-width="2.2"/><text x="86" y="480" font-size="10" fill="#6e6e73">Hot 展开/选优</text>
  <line x1="46" y1="496" x2="78" y2="496" stroke="#2dd4bf" stroke-width="1.6"/><text x="86" y="500" font-size="10" fill="#6e6e73">State 深化节点</text>
  <line x1="46" y1="516" x2="78" y2="516" stroke="#f5873a" stroke-width="1.6" stroke-dasharray="3 3"/><text x="86" y="520" font-size="10" fill="#6e6e73">Failure 低分剪枝</text>
</svg>