<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Reflexion · 自我反思与重试</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">失败不是终点：把错误转成语言反思，写入记忆，指导下一次尝试</text>

  <!-- Actor -->
  <g filter="url(#soft)"><rect x="60" y="120" width="180" height="90" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="150" y="152" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Actor · 执行者</text>
  <text x="150" y="174" font-size="10.5" fill="#6e6e73" text-anchor="middle">按当前策略产生</text>
  <text x="150" y="190" font-size="10.5" fill="#6e6e73" text-anchor="middle">一次完整尝试(trajectory)</text>

  <!-- Evaluator -->
  <g filter="url(#soft)"><rect x="390" y="120" width="180" height="90" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="480" y="152" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Evaluator · 评估者</text>
  <text x="480" y="174" font-size="10.5" fill="#6e6e73" text-anchor="middle">打分/单测/规则判定</text>
  <text x="480" y="190" font-size="10.5" fill="#6e6e73" text-anchor="middle">给出成功或失败信号</text>

  <!-- Self-Reflection -->
  <g filter="url(#soft)"><rect x="720" y="120" width="180" height="90" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="810" y="148" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Self-Reflection</text>
  <text x="810" y="170" font-size="10.5" fill="#6e6e73" text-anchor="middle">用语言总结</text>
  <text x="810" y="186" font-size="10.5" fill="#6e6e73" text-anchor="middle">「为何失败/如何改」</text>

  <path d="M240 165 L386 165" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#arh)"/>
  <text x="313" y="156" font-size="10" fill="#0a84ff" text-anchor="middle">轨迹</text>
  <path d="M570 165 L716 165" stroke="#f5873a" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#ar)"/>
  <text x="643" y="156" font-size="10" fill="#f5873a" text-anchor="middle">失败信号</text>

  <!-- 反思记忆库 -->
  <g filter="url(#soft)"><rect x="330" y="290" width="300" height="120" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.4"/></g>
  <text x="480" y="316" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">反思记忆 · Reflection Memory</text>
  <text x="348" y="342" font-size="10.5" fill="#6e6e73">「上次因未校验边界值报错」</text>
  <text x="348" y="362" font-size="10.5" fill="#6e6e73">「应先读文档再调 API」</text>
  <text x="348" y="386" font-size="10" fill="#a78bfa">经验以自然语言累积，注入下轮 prompt</text>

  <path d="M810 210 C 810 260 660 300 632 330" stroke="#a78bfa" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="770" y="270" font-size="10" fill="#a78bfa">写入反思</text>
  <!--重试回环 -->
  <path d="M330 350 C 120 380 150 240 150 214" stroke="#f5873a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="150" y="270" font-size="10.5" fill="#f5873a" text-anchor="middle">带经验重试</text>

  <!-- 成功出口 -->
  <g filter="url(#soft)"><rect x="390" y="440" width="180" height="56" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="480" y="474" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">评估通过 → 终止输出</text>
  <path d="M480 410 L480 438" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 图例 -->
  <g filter="url(#soft)"><rect x="640" y="424" width="280" height="76" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <line x1="656" y1="448" x2="688" y2="448" stroke="#0a84ff" stroke-width="2.2"/><text x="696" y="452" font-size="10" fill="#6e6e73">Hot 尝试轨迹</text>
  <line x1="656" y1="468" x2="688" y2="468" stroke="#a78bfa" stroke-width="1.8"/><text x="696" y="472" font-size="10" fill="#6e6e73">Control 反思写入记忆</text>
  <line x1="656" y1="488" x2="688" y2="488" stroke="#f5873a" stroke-width="1.7" stroke-dasharray="6 4"/><text x="696" y="492" font-size="10" fill="#6e6e73">Failure 失败→带经验重试</text>
</svg>