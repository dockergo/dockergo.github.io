<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Plan-and-Execute · 先规划全局，再逐步执行</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">与 ReAct 逐步试探不同：先由 Planner 产出完整计划，Executor 顺序执行；偏差时重规划</text>

  <!-- Planner -->
  <g filter="url(#soft)"><rect x="40" y="150" width="180" height="90" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="130" y="182" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Planner · 规划器</text>
  <text x="130" y="204" font-size="10.5" fill="#6e6e73" text-anchor="middle">一次性拆出</text>
  <text x="130" y="220" font-size="10.5" fill="#6e6e73" text-anchor="middle">有序子任务列表</text>

  <!-- 计划列表 -->
  <g filter="url(#soft)"><rect x="300" y="110" width="260" height="180" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.4"/></g>
  <text x="316" y="134" font-size="12" font-weight="600" fill="#1d1d1f">Plan · 静态计划</text>
  <g><rect x="316" y="146" width="228" height="30" rx="7" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.1"/><text x="326" y="166" font-size="11" fill="#1d1d1f">① 检索航班信息</text></g>
  <g><rect x="316" y="182" width="228" height="30" rx="7" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.1"/><text x="326" y="202" font-size="11" fill="#1d1d1f">② 比价并筛选</text></g>
  <g><rect x="316" y="218" width="228" height="30" rx="7" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.1"/><text x="326" y="238" font-size="11" fill="#1d1d1f">③ 生成预订摘要</text></g>
  <text x="316" y="272" font-size="10.5" fill="#6e6e73">子任务间可有依赖（DAG）</text>

  <!-- Executor -->
  <g filter="url(#soft)"><rect x="640" y="150" width="180" height="90" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="730" y="182" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Executor · 执行器</text>
  <text x="730" y="204" font-size="10.5" fill="#6e6e73" text-anchor="middle">逐个执行子任务</text>
  <text x="730" y="220" font-size="10.5" fill="#6e6e73" text-anchor="middle">（可调工具/子Agent）</text>

  <path d="M220 195 L296 195" stroke="#a78bfa" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M560 195 L636 195" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#arh)"/>

  <!-- Replan 回环 -->
  <g filter="url(#soft)"><rect x="640" y="320" width="180" height="70" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="730" y="350" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">结果偏离预期？</text>
  <text x="730" y="370" font-size="10.5" fill="#6e6e73" text-anchor="middle">触发 Replan 重规划</text>
  <path d="M730 240 L730 318" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="748" y="285" font-size="10" fill="#2dd4bf">执行结果</text>
  <path d="M640 355 C 300 420 130 340 130 244" stroke="#f5873a" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="400" y="440" font-size="10.5" fill="#f5873a" text-anchor="middle">偏差 → 回到 Planner 重新规划（Control 回路）</text>

  <!-- 优势铭牌 -->
  <g filter="url(#soft)"><rect x="40" y="300" width="520" height="120" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="58" y="326" font-size="12" font-weight="600" fill="#1d1d1f">为什么要先规划？</text>
  <text x="58" y="350" font-size="11" fill="#6e6e73">• 全局视野：先想清整体路径，减少走一步看一步的短视决策</text>
  <text x="58" y="372" font-size="11" fill="#6e6e73">• 省 token：规划由强模型做一次，执行可交给廉价模型/并行</text>
  <text x="58" y="394" font-size="11" fill="#6e6e73">• 可并行：无依赖的子任务可同时执行，缩短端到端时延</text>
  <text x="58" y="414" font-size="11" fill="#f5873a">代价：计划可能过时，需 Replan 机制兜底动态环境</text>

  <!-- 图例 -->
  <g filter="url(#soft)"><rect x="620" y="410" width="300" height="72" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <line x1="636" y1="432" x2="668" y2="432" stroke="#0a84ff" stroke-width="2.2"/><text x="676" y="436" font-size="10" fill="#6e6e73">Hot 规划→执行主流</text>
  <line x1="636" y1="452" x2="668" y2="452" stroke="#2dd4bf" stroke-width="1.8"/><text x="676" y="456" font-size="10" fill="#6e6e73">State 执行结果</text>
  <line x1="636" y1="472" x2="668" y2="472" stroke="#f5873a" stroke-width="1.7" stroke-dasharray="6 4"/><text x="676" y="476" font-size="10" fill="#6e6e73">Control 重规划回路</text>
</svg>