<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">工程落地 · 推理循环的生产要点</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">从 demo 到生产：控制步数、防死循环、可观测、可回滚</text>

  <!-- 三大工程支柱 -->
  <g filter="url(#soft)"><rect x="40" y="90" width="280" height="180" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="180" y="118" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">循环控制</text>
  <text x="58" y="146" font-size="10.5" fill="#6e6e73">• max_steps 硬上限，超限强制终止</text>
  <text x="58" y="170" font-size="10.5" fill="#6e6e73">• 重复动作检测：连续相同调用即熔断</text>
  <text x="58" y="194" font-size="10.5" fill="#6e6e73">• 预算护栏：token/成本/时延三重阈值</text>
  <text x="58" y="218" font-size="10.5" fill="#6e6e73">• 明确终止条件，避免无限 ReAct</text>
  <text x="58" y="242" font-size="10" fill="#f5873a">死循环是线上最常见故障</text>

  <g filter="url(#soft)"><rect x="340" y="90" width="280" height="180" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="480" y="118" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">可观测性</text>
  <text x="358" y="146" font-size="10.5" fill="#6e6e73">• 全轨迹落盘：每步 T/A/O 结构化日志</text>
  <text x="358" y="170" font-size="10.5" fill="#6e6e73">• Trace 打点：定位在哪一步跑偏</text>
  <text x="358" y="194" font-size="10.5" fill="#6e6e73">• 回放能力：用轨迹复现问题</text>
  <text x="358" y="218" font-size="10.5" fill="#6e6e73">• 步级指标：成功率/平均步数/工具错误率</text>
  <text x="358" y="242" font-size="10" fill="#2dd4bf">无可观测 = 无法调试黑盒</text>

  <g filter="url(#soft)"><rect x="640" y="90" width="280" height="180" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.4"/></g>
  <text x="780" y="118" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">鲁棒性</text>
  <text x="658" y="146" font-size="10.5" fill="#6e6e73">• 工具失败重试 + 指数退避</text>
  <text x="658" y="170" font-size="10.5" fill="#6e6e73">• 输出格式校验，解析失败即纠偏</text>
  <text x="658" y="194" font-size="10.5" fill="#6e6e73">• 人在环 (HITL)：高风险动作需审批</text>
  <text x="658" y="218" font-size="10.5" fill="#6e6e73">• 幂等与可回滚：副作用动作要能撤销</text>
  <text x="658" y="242" font-size="10" fill="#a78bfa">给 Agent 装刹车，而非只给油门</text>

  <!-- 成本/时延权衡带 -->
  <g filter="url(#soft)"><rect x="40" y="300" width="880" height="90" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="326" font-size="12" font-weight="600" fill="#1d1d1f">成本-质量权衡</text>
  <text x="60" y="350" font-size="10.5" fill="#6e6e73">强模型做规划/反思，廉价模型做执行 · 简单请求短路直答，复杂请求才开多步循环</text>
  <text x="60" y="372" font-size="10.5" fill="#6e6e73">缓存工具结果与前缀 · 并行无依赖子任务 · 用 ReAct 兜底、ToT 仅在高价值场景启用</text>

  <!-- 底部准则 -->
  <text x="480" y="430" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">工程铁律：先能停、能看、能回滚，再谈更聪明的推理</text>
  <g>
    <rect x="290" y="450" width="380" height="34" rx="9" fill="#fff3ea" stroke="#f5873a" stroke-width="1.2"/>
    <text x="480" y="472" font-size="10.5" fill="#6e6e73" text-anchor="middle">步数上限 · 全链路 Trace · HITL 审批 · 幂等回滚 —— 四件套缺一不可</text>
  </g>
</svg>