<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/>
    </marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Agent 推理循环 · 生态架构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">目标 → 感知 → 思考 → 行动 → 观察 → 回环，直到目标达成或预算耗尽</text>

  <!-- 输入：用户目标 -->
  <g filter="url(#soft)">
    <rect x="40" y="240" width="130" height="72" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/>
  </g>
  <text x="105" y="272" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">用户目标</text>
  <text x="105" y="292" font-size="11" fill="#6e6e73" text-anchor="middle">Task / Query</text>

  <!-- 核心：LLM 推理内核 -->
  <g filter="url(#soft)">
    <rect x="360" y="120" width="240" height="380" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/>
  </g>
  <text x="480" y="150" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">推理内核 Reasoning Kernel</text>

  <!-- 思考 -->
  <g filter="url(#soft)"><rect x="390" y="172" width="180" height="60" rx="10" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.4"/></g>
  <text x="480" y="198" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">Thought · 思考</text>
  <text x="480" y="217" font-size="10.5" fill="#6e6e73" text-anchor="middle">规划下一步 / 拆解子目标</text>

  <!-- 行动 -->
  <g filter="url(#soft)"><rect x="390" y="248" width="180" height="60" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="480" y="274" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">Action · 行动</text>
  <text x="480" y="293" font-size="10.5" fill="#6e6e73" text-anchor="middle">选工具 / 生成调用意图</text>

  <!-- 观察 -->
  <g filter="url(#soft)"><rect x="390" y="324" width="180" height="60" rx="10" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="480" y="350" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">Observation · 观察</text>
  <text x="480" y="369" font-size="10.5" fill="#6e6e73" text-anchor="middle">吸收结果 / 更新认知</text>

  <!-- 终止判定 -->
  <g filter="url(#soft)"><rect x="390" y="400" width="180" height="56" rx="10" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="480" y="424" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">Stop? · 终止判定</text>
  <text x="480" y="442" font-size="10.5" fill="#6e6e73" text-anchor="middle">达成 / 超预算 / 兜底</text>

  <!-- 内部循环箭头 思考->行动->观察->思考 -->
  <path d="M480 232 L480 246" stroke="#0a84ff" stroke-width="2" marker-end="url(#arh)"/>
  <path d="M480 308 L480 322" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M390 354 C 340 354 340 202 388 202" stroke="#a78bfa" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="330" y="280" font-size="10" fill="#a78bfa" text-anchor="middle" transform="rotate(-90 330 280)">循环回灌</text>
  <path d="M480 384 L480 398" stroke="#f5873a" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#ar)"/>

  <!-- 右侧：外部行动能力 -->
  <g filter="url(#soft)"><rect x="700" y="150" width="220" height="70" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.4"/></g>
  <text x="810" y="180" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">工具 / 环境</text>
  <text x="810" y="200" font-size="10.5" fill="#6e6e73" text-anchor="middle">API · 代码 · 检索 · 世界</text>

  <g filter="url(#soft)"><rect x="700" y="250" width="220" height="70" rx="12" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="810" y="280" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">记忆系统</text>
  <text x="810" y="300" font-size="10.5" fill="#6e6e73" text-anchor="middle">轨迹 · 反思 · 长期知识</text>

  <g filter="url(#soft)"><rect x="700" y="350" width="220" height="70" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="810" y="380" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">上下文窗口</text>
  <text x="810" y="400" font-size="10.5" fill="#6e6e73" text-anchor="middle">历史轨迹拼装为 prompt</text>

  <!-- 目标 -> 内核 -->
  <path d="M170 276 C 260 276 280 200 388 200" stroke="#0a84ff" stroke-width="2.4" fill="none" marker-end="url(#arh)"/>

  <!-- 行动 -> 工具 -->
  <path d="M570 278 C 640 278 640 190 698 188" stroke="#0a84ff" stroke-width="2" fill="none" marker-end="url(#arh)"/>
  <!-- 工具 -> 观察 (结果回灌) -->
  <path d="M810 220 C 810 340 640 350 572 352" stroke="#2dd4bf" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <!-- 观察/思考 <-> 记忆 -->
  <path d="M572 300 C 640 300 640 285 698 285" stroke="#2dd4bf" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <!-- 上下文 -> 思考 (每步注入) -->
  <path d="M700 385 C 640 420 610 240 572 205" stroke="#a78bfa" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <!-- 终止 -> 输出 -->
  <g filter="url(#soft)"><rect x="360" y="520" width="240" height="60" rx="12" fill="#ffffff" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="480" y="548" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">最终答案 / 交付物</text>
  <text x="480" y="567" font-size="10.5" fill="#6e6e73" text-anchor="middle">Final Answer</text>
  <path d="M480 456 L480 518" stroke="#f5873a" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#ar)"/>

  <!-- 图例铭牌 -->
  <g filter="url(#soft)"><rect x="620" y="470" width="300" height="118" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="636" y="492" font-size="11" font-weight="600" fill="#1d1d1f">路径图例</text>
  <line x1="636" y1="508" x2="668" y2="508" stroke="#0a84ff" stroke-width="2.4"/>
  <text x="676" y="512" font-size="10.5" fill="#6e6e73">Hot 主行动流（目标→思考→行动）</text>
  <line x1="636" y1="528" x2="668" y2="528" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="676" y="532" font-size="10.5" fill="#6e6e73">Control 决策/上下文注入</text>
  <line x1="636" y1="548" x2="668" y2="548" stroke="#2dd4bf" stroke-width="1.8"/>
  <text x="676" y="552" font-size="10.5" fill="#6e6e73">State 观察结果 / 记忆读写</text>
  <line x1="636" y1="568" x2="668" y2="568" stroke="#f5873a" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="676" y="572" font-size="10.5" fill="#6e6e73">Failure/Exit 终止与兜底</text>
</svg>