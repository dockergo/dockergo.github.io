<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">ReAct · 思考-行动-观察交织</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">推理(Reasoning)与行动(Acting)交错进行：每次思考产出一个动作，动作结果反哺下一次思考</text>

  <!-- 三步循环环形布局 -->
  <g filter="url(#soft)"><rect x="120" y="120" width="200" height="88" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="220" y="152" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Thought</text>
  <text x="220" y="174" font-size="11" fill="#6e6e73" text-anchor="middle">「我需要先查一下</text>
  <text x="220" y="190" font-size="11" fill="#6e6e73" text-anchor="middle">当前汇率」</text>

  <g filter="url(#soft)"><rect x="640" y="120" width="200" height="88" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="740" y="152" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Action</text>
  <text x="740" y="174" font-size="11" fill="#6e6e73" text-anchor="middle">search[USD to CNY]</text>
  <text x="740" y="190" font-size="11" fill="#6e6e73" text-anchor="middle">调用工具</text>

  <g filter="url(#soft)"><rect x="380" y="330" width="200" height="88" rx="12" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="480" y="362" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Observation</text>
  <text x="480" y="384" font-size="11" fill="#6e6e73" text-anchor="middle">「1 USD = 7.2 CNY」</text>
  <text x="480" y="400" font-size="11" fill="#6e6e73" text-anchor="middle">工具返回结果</text>

  <!-- 环形箭头 -->
  <path d="M320 160 L636 160" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#arh)"/>
  <text x="478" y="150" font-size="10.5" fill="#0a84ff" text-anchor="middle">思考决定动作</text>
  <path d="M740 208 C 740 300 600 360 582 372" stroke="#2dd4bf" stroke-width="1.9" fill="none" marker-end="url(#ar)"/>
  <text x="700" y="300" font-size="10.5" fill="#2dd4bf" text-anchor="middle">执行得观察</text>
  <path d="M378 372 C 200 360 220 260 220 210" stroke="#a78bfa" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="230" y="300" font-size="10.5" fill="#a78bfa" text-anchor="middle">观察反哺思考</text>

  <!-- 轨迹累积说明 -->
  <g filter="url(#soft)"><rect x="620" y="300" width="300" height="150" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="640" y="326" font-size="12" font-weight="600" fill="#1d1d1f">关键机理：轨迹即上下文</text>
  <text x="640" y="350" font-size="11" fill="#6e6e73">每轮的 Thought/Action/Observation</text>
  <text x="640" y="368" font-size="11" fill="#6e6e73">全部追加进上下文，成为下一轮</text>
  <text x="640" y="386" font-size="11" fill="#6e6e73">推理的依据 → 让模型「记得」</text>
  <text x="640" y="404" font-size="11" fill="#6e6e73">自己刚做过什么、看到了什么。</text>
  <text x="640" y="428" font-size="11" fill="#f5873a">风险：轨迹越长，token 成本越高，</text>
  <text x="640" y="444" font-size="11" fill="#f5873a">易积累错误 → 需截断/摘要。</text>

  <!-- 图例 -->
  <g filter="url(#soft)"><rect x="40" y="330" width="300" height="120" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="56" y="352" font-size="11" font-weight="600" fill="#1d1d1f">路径图例</text>
  <line x1="56" y1="370" x2="88" y2="370" stroke="#0a84ff" stroke-width="2.2"/><text x="96" y="374" font-size="10.5" fill="#6e6e73">Hot 思考→动作主流</text>
  <line x1="56" y1="392" x2="88" y2="392" stroke="#2dd4bf" stroke-width="1.9"/><text x="96" y="396" font-size="10.5" fill="#6e6e73">State 执行产生观察</text>
  <line x1="56" y1="414" x2="88" y2="414" stroke="#a78bfa" stroke-width="1.7" stroke-dasharray="6 4"/><text x="96" y="418" font-size="10.5" fill="#6e6e73">Control 观察反哺决策</text>
  <line x1="56" y1="436" x2="88" y2="436" stroke="#f5873a" stroke-width="1.7" stroke-dasharray="3 3"/><text x="96" y="440" font-size="10.5" fill="#6e6e73">Failure 长轨迹风险</text>
</svg>