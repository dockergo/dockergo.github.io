<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">结构化调用 · Schema 约束下的 Function Calling</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">给模型一份工具「说明书」(JSON Schema)，它就能吐出机器可直接执行的调用，而非自由文本</text>

  <!-- 工具定义 -->
  <g filter="url(#soft)"><rect x="40" y="90" width="270" height="180" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="58" y="116" font-size="12" font-weight="600" fill="#1d1d1f">① 工具定义 (Schema)</text>
  <text x="58" y="140" font-size="10.5" fill="#6e6e73">name: get_weather</text>
  <text x="58" y="160" font-size="10.5" fill="#6e6e73">desc: 查询某城市天气</text>
  <text x="58" y="180" font-size="10.5" fill="#6e6e73">params:</text>
  <text x="72" y="200" font-size="10.5" fill="#6e6e73">city: string (必填)</text>
  <text x="72" y="220" font-size="10.5" fill="#6e6e73">unit: enum[C,F]</text>
  <text x="58" y="248" font-size="10" fill="#a78bfa">描述质量直接决定选对率</text>

  <!-- 模型输出 -->
  <g filter="url(#soft)"><rect x="360" y="110" width="250" height="140" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="378" y="136" font-size="12" font-weight="600" fill="#1d1d1f">② 模型输出结构化调用</text>
  <text x="378" y="162" font-size="10.5" fill="#6e6e73">{ "tool": "get_weather",</text>
  <text x="392" y="182" font-size="10.5" fill="#6e6e73">"args": {</text>
  <text x="406" y="202" font-size="10.5" fill="#6e6e73">"city": "北京",</text>
  <text x="406" y="222" font-size="10.5" fill="#6e6e73">"unit": "C" } }</text>

  <!-- 校验/执行 -->
  <g filter="url(#soft)"><rect x="660" y="110" width="250" height="140" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="678" y="136" font-size="12" font-weight="600" fill="#1d1d1f">③ 校验 → 执行</text>
  <text x="678" y="162" font-size="10.5" fill="#6e6e73">按 Schema 校验参数类型</text>
  <text x="678" y="184" font-size="10.5" fill="#6e6e73">通过 → 调真实函数</text>
  <text x="678" y="206" font-size="10.5" fill="#f5873a">不通过 → 报错回喂模型纠偏</text>
  <text x="678" y="230" font-size="10.5" fill="#6e6e73">结果结构化返回</text>

  <path d="M310 180 L356 180" stroke="#a78bfa" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M610 180 L656 180" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#arh)"/>

  <!-- 结果回流 -->
  <path d="M785 250 C 785 330 480 340 300 300" stroke="#2dd4bf" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="540" y="330" font-size="10.5" fill="#2dd4bf" text-anchor="middle">结果 (Observation) 回流模型，进入下一轮推理</text>

  <!-- 要点铭牌 -->
  <g filter="url(#soft)"><rect x="40" y="370" width="870" height="110" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="396" font-size="12" font-weight="600" fill="#1d1d1f">为什么要结构化？</text>
  <text x="60" y="420" font-size="10.5" fill="#6e6e73">• 可执行：JSON 能被程序直接解析调用，无需正则去猜自由文本里的意图</text>
  <text x="60" y="442" font-size="10.5" fill="#6e6e73">• 可校验：类型/枚举/必填由 Schema 兜底，非法参数在执行前就被拦下</text>
  <text x="60" y="464" font-size="10.5" fill="#f5873a">• 工具描述即 prompt：名字与说明写得越清楚，模型选错、传错的概率越低</text>
</svg>