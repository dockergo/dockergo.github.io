<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Code-as-Action · 代码即动作</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">与其逐个调用离散工具，不如让模型直接生成代码，在沙箱中执行——一段代码即可编排循环、分支与多工具组合</text>

  <!-- 模型 -->
  <g filter="url(#soft)"><rect x="60" y="110" width="180" height="90" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="150" y="142" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">推理内核</text>
  <text x="150" y="164" font-size="9.5" fill="#6e6e73" text-anchor="middle">生成一段可执行代码</text>
  <text x="150" y="184" font-size="9.5" fill="#6e6e73" text-anchor="middle">而非单个工具 JSON</text>

  <!-- 沙箱 -->
  <g filter="url(#soft)"><rect x="330" y="90" width="300" height="230" rx="14" fill="#fff3ea" stroke="#f5873a" stroke-width="1.6"/></g>
  <text x="480" y="118" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">隔离沙箱 (Sandbox)</text>
  <g filter="url(#soft)"><rect x="352" y="136" width="256" height="60" rx="9" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="368" y="160" font-size="10" fill="#1d1d1f">result = search(q); df = load(result)</text>
  <text x="368" y="180" font-size="10" fill="#1d1d1f">return summarize(df.filter(...))</text>
  <text x="480" y="222" font-size="10.5" fill="#6e6e73" text-anchor="middle">解释器执行 · 资源/时间/网络受限</text>
  <text x="480" y="244" font-size="10.5" fill="#6e6e73" text-anchor="middle">无外泄权限 · 崩溃可回收</text>
  <text x="480" y="272" font-size="10" fill="#f5873a" text-anchor="middle">安全红线：绝不在主环境执行 LLM 生成代码</text>
  <text x="480" y="296" font-size="10" fill="#f5873a" text-anchor="middle">超时/内存/系统调用全部设限</text>

  <!-- 工具库 -->
  <g filter="url(#soft)"><rect x="720" y="110" width="180" height="90" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="810" y="142" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">工具作为函数库</text>
  <text x="810" y="164" font-size="9.5" fill="#6e6e73" text-anchor="middle">search / load / http</text>
  <text x="810" y="184" font-size="9.5" fill="#6e6e73" text-anchor="middle">以 API 形式注入沙箱</text>

  <path d="M240 155 L326 175" stroke="#0a84ff" stroke-width="2" marker-end="url(#arh)"/>
  <path d="M632 165 L716 155" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M480 320 L480 360" stroke="#f5873a" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arf)"/>
  <path d="M400 372 C300 400 220 300 150 205" stroke="#0a84ff" stroke-width="1.6" fill="none" marker-end="url(#arh)"/>

  <g filter="url(#soft)"><rect x="330" y="360" width="300" height="40" rx="9" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="480" y="385" font-size="10.5" fill="#6e6e73" text-anchor="middle">执行结果 / 异常栈 → 回流为观察</text>

  <!-- 权衡 -->
  <g filter="url(#soft)"><rect x="60" y="420" width="840" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="80" y="446" font-size="11.5" font-weight="600" fill="#1d1d1f">取舍</text>
  <text x="80" y="468" font-size="10.5" fill="#6e6e73">✓ 强表达力：一段代码内完成循环/条件/多工具编排，token 与轮次远少于逐个 function call</text>
  <text x="80" y="488" font-size="10.5" fill="#6e6e73">✗ 代价：必须投入沙箱与安全治理；调试观测更复杂，错误恢复需捕获异常栈并反馈重写</text>
</svg>