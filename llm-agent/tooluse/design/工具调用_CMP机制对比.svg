<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">四种工具调用机制横向对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">从「模型如何决定并发起动作」的角度对齐差异，据此按工具规模与安全预算取舍</text>

  <!-- 表头 -->
  <g filter="url(#soft)"><rect x="30" y="80" width="900" height="42" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.3"/></g>
  <text x="120" y="106" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">机制</text>
  <text x="320" y="106" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">核心做法</text>
  <text x="560" y="106" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">适用场景</text>
  <text x="800" y="106" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">主要风险</text>

  <!-- 行1 -->
  <g filter="url(#soft)"><rect x="30" y="132" width="900" height="84" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="120" y="164" font-size="11" font-weight="600" fill="#0a84ff" text-anchor="middle">结构化调用</text>
  <text x="120" y="184" font-size="9" fill="#6e6e73" text-anchor="middle">Function Calling</text>
  <text x="320" y="170" font-size="9.5" fill="#6e6e73" text-anchor="middle">按 Schema 输出 JSON，程序校验后执行</text>
  <text x="560" y="170" font-size="9.5" fill="#6e6e73" text-anchor="middle">工具数量少而明确</text>
  <text x="800" y="170" font-size="9.5" fill="#6e6e73" text-anchor="middle">工具多时 prompt 膨胀</text>

  <!-- 行2 -->
  <g filter="url(#soft)"><rect x="30" y="226" width="900" height="84" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="120" y="258" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">工具路由</text>
  <text x="120" y="278" font-size="9" fill="#6e6e73" text-anchor="middle">Tool Retrieval</text>
  <text x="320" y="264" font-size="9.5" fill="#6e6e73" text-anchor="middle">语义检索 Top-k 候选，再交模型定夺</text>
  <text x="560" y="264" font-size="9.5" fill="#6e6e73" text-anchor="middle">工具规模大（N≥百）</text>
  <text x="800" y="264" font-size="9.5" fill="#6e6e73" text-anchor="middle">召回不全则工具漏用</text>

  <!-- 行3 -->
  <g filter="url(#soft)"><rect x="30" y="320" width="900" height="84" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="120" y="352" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle">MCP 协议</text>
  <text x="120" y="372" font-size="9" fill="#6e6e73" text-anchor="middle">标准接入</text>
  <text x="320" y="358" font-size="9.5" fill="#6e6e73" text-anchor="middle">标准协议动态发现/调用外部 Server</text>
  <text x="560" y="358" font-size="9.5" fill="#6e6e73" text-anchor="middle">跨系统、生态复用</text>
  <text x="800" y="358" font-size="9.5" fill="#6e6e73" text-anchor="middle">第三方 Server 供应链风险</text>

  <!-- 行4 -->
  <g filter="url(#soft)"><rect x="30" y="414" width="900" height="84" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="120" y="446" font-size="11" font-weight="600" fill="#f5873a" text-anchor="middle">代码执行</text>
  <text x="120" y="466" font-size="9" fill="#6e6e73" text-anchor="middle">Code-as-Action</text>
  <text x="320" y="452" font-size="9.5" fill="#6e6e73" text-anchor="middle">生成代码在沙箱内编排多工具</text>
  <text x="560" y="452" font-size="9.5" fill="#6e6e73" text-anchor="middle">复杂编排、循环/分支</text>
  <text x="800" y="452" font-size="9.5" fill="#6e6e73" text-anchor="middle">须沙箱隔离，治理成本高</text>
</svg>