<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="960" height="600" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">工具调用 · 生态架构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">工具是 Agent 伸向外部世界的手：模型只负责「决定调什么、传什么参」，真正的执行交给外部系统</text>

  <!-- 推理内核 -->
  <g filter="url(#soft)"><rect x="60" y="120" width="200" height="120" rx="14" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="160" y="152" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">推理内核 (LLM)</text>
  <text x="160" y="178" font-size="10.5" fill="#6e6e73" text-anchor="middle">决定「调哪个工具」</text>
  <text x="160" y="196" font-size="10.5" fill="#6e6e73" text-anchor="middle">生成结构化参数</text>
  <text x="160" y="220" font-size="10" fill="#0a84ff" text-anchor="middle">自己不执行副作用</text>

  <!-- 工具选择/路由 -->
  <g filter="url(#soft)"><rect x="380" y="90" width="200" height="90" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="480" y="120" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">工具选择 / 路由</text>
  <text x="480" y="142" font-size="10.5" fill="#6e6e73" text-anchor="middle">工具多时先检索候选</text>
  <text x="480" y="160" font-size="10.5" fill="#6e6e73" text-anchor="middle">再让模型定夺</text>

  <!-- 协议接入层 -->
  <g filter="url(#soft)"><rect x="380" y="220" width="200" height="90" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="480" y="250" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">协议接入层 (MCP)</text>
  <text x="480" y="272" font-size="10.5" fill="#6e6e73" text-anchor="middle">标准化工具/资源发现</text>
  <text x="480" y="290" font-size="10.5" fill="#6e6e73" text-anchor="middle">一次对接，处处可用</text>

  <!-- 外部工具 -->
  <g filter="url(#soft)"><rect x="700" y="70" width="210" height="60" rx="11" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="805" y="105" font-size="11.5" fill="#1d1d1f" text-anchor="middle">API / 数据库 / 搜索</text>
  <g filter="url(#soft)"><rect x="700" y="150" width="210" height="60" rx="11" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="805" y="185" font-size="11.5" fill="#1d1d1f" text-anchor="middle">代码沙箱 (Code Interp)</text>
  <g filter="url(#soft)"><rect x="700" y="230" width="210" height="60" rx="11" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="805" y="265" font-size="11.5" fill="#1d1d1f" text-anchor="middle">文件系统 / 浏览器</text>

  <path d="M260 160 L376 130" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#arh)"/>
  <text x="318" y="132" font-size="10" fill="#0a84ff">选工具</text>
  <path d="M580 135 C 640 160 640 200 618 250" stroke="#a78bfa" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M580 255 L696 200" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M580 255 L696 100" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M580 265 L696 260" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 观察结果回流 -->
  <path d="M700 290 C 300 380 160 300 160 244" stroke="#2dd4bf" stroke-width="1.8" fill="none" stroke-dasharray="0" marker-end="url(#ar)"/>
  <text x="430" y="360" font-size="10.5" fill="#2dd4bf" text-anchor="middle">工具返回结果 (Observation) 回流推理内核，进入下一轮</text>

  <!-- 四大机制铺垫 -->
  <g filter="url(#soft)"><rect x="60" y="400" width="850" height="120" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="80" y="428" font-size="12" font-weight="600" fill="#1d1d1f">本模块四张机理图</text>
  <text x="80" y="454" font-size="10.5" fill="#6e6e73">T1 结构化调用：用 JSON Schema 约束模型「怎么传参」，把自由文本变成可执行调用</text>
  <text x="80" y="476" font-size="10.5" fill="#6e6e73">T2 工具路由：工具成百上千时，先向量检索出 Top-k 候选再交给模型，防上下文爆炸</text>
  <text x="80" y="498" font-size="10.5" fill="#6e6e73">T3 MCP 协议：工具接入的「USB-C」，统一发现与调用；T4 代码执行：让模型写代码当动作</text>

  <!-- 图例 -->
  <g filter="url(#soft)"><rect x="620" y="330" width="290" height="60" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <line x1="636" y1="352" x2="668" y2="352" stroke="#0a84ff" stroke-width="2.2"/><text x="676" y="356" font-size="10" fill="#6e6e73">Hot 调用主流</text>
  <line x1="636" y1="374" x2="668" y2="374" stroke="#2dd4bf" stroke-width="1.8"/><text x="676" y="378" font-size="10" fill="#6e6e73">State 结果回流</text>
  <line x1="790" y1="352" x2="822" y2="352" stroke="#a78bfa" stroke-width="1.8"/><text x="830" y="356" font-size="10" fill="#6e6e73">Control 路由</text>
</svg>