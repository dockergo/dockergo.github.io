<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">工具路由 · 海量工具下的检索式选择</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">工具成百上千时，全塞进 prompt 会撑爆上下文、拖慢选择——先检索再交给模型</text>

  <!-- 用户意图 -->
  <g filter="url(#soft)"><rect x="40" y="150" width="160" height="80" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="120" y="182" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">用户意图</text>
  <text x="120" y="204" font-size="10.5" fill="#6e6e73" text-anchor="middle">「帮我订张机票」</text>

  <!-- 工具库 -->
  <g filter="url(#soft)"><rect x="280" y="90" width="200" height="200" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.4"/></g>
  <text x="380" y="116" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">工具库 (N=1000+)</text>
  <text x="298" y="140" font-size="9.5" fill="#a1a1a6">每个工具的名称+描述</text>
  <text x="298" y="156" font-size="9.5" fill="#a1a1a6">预先向量化建索引</text>
  <g><rect x="298" y="168" width="164" height="24" rx="6" fill="#f3ecff"/><text x="308" y="184" font-size="9.5" fill="#1d1d1f">flight_search …</text></g>
  <g><rect x="298" y="198" width="164" height="24" rx="6" fill="#f3ecff"/><text x="308" y="214" font-size="9.5" fill="#1d1d1f">hotel_book …</text></g>
  <g><rect x="298" y="228" width="164" height="24" rx="6" fill="#f5f5f7"/><text x="308" y="244" font-size="9.5" fill="#a1a1a6">weather / stock / …</text></g>
  <text x="298" y="272" font-size="9.5" fill="#a1a1a6">全量塞进上下文 = 灾难</text>

  <!-- 语义检索 -->
  <g filter="url(#soft)"><rect x="560" y="120" width="170" height="80" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="645" y="150" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">语义检索</text>
  <text x="645" y="172" font-size="10" fill="#6e6e73" text-anchor="middle">意图向量 × 工具向量</text>
  <text x="645" y="188" font-size="10" fill="#6e6e73" text-anchor="middle">取 Top-k 候选</text>

  <!-- Top-k -->
  <g filter="url(#soft)"><rect x="560" y="230" width="170" height="90" rx="12" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="645" y="256" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">候选工具集 (k=5)</text>
  <text x="645" y="278" font-size="10" fill="#6e6e73" text-anchor="middle">flight_search</text>
  <text x="645" y="296" font-size="10" fill="#6e6e73" text-anchor="middle">hotel_book …</text>

  <!-- 模型决策 -->
  <g filter="url(#soft)"><rect x="790" y="170" width="140" height="100" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="860" y="204" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">模型定夺</text>
  <text x="860" y="226" font-size="10" fill="#6e6e73" text-anchor="middle">仅在 k 个候选中</text>
  <text x="860" y="244" font-size="10" fill="#6e6e73" text-anchor="middle">选择并传参</text>

  <path d="M200 190 L276 190" stroke="#0a84ff" stroke-width="2.2" marker-end="url(#arh)"/>
  <path d="M480 170 L556 165" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M645 200 L645 228" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M730 270 L788 235" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 要点 -->
  <g filter="url(#soft)"><rect x="40" y="360" width="890" height="120" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="60" y="386" font-size="12" font-weight="600" fill="#1d1d1f">路由的价值</text>
  <text x="60" y="410" font-size="10.5" fill="#6e6e73">• 省上下文：只把最相关的 k 个工具描述放进 prompt，token 与选择噪声双降</text>
  <text x="60" y="432" font-size="10.5" fill="#6e6e73">• 更准更快：候选变少，模型选对率上升、决策时延下降</text>
  <text x="60" y="454" font-size="10.5" fill="#6e6e73">• 可分层：先粗筛「工具类别」，再细选「具体工具」，适配超大工具生态</text>
  <text x="60" y="474" font-size="10" fill="#f5873a">风险：检索漏召会让正确工具进不了候选集——需兼顾召回率与 k 值</text>
</svg>