<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="960" height="500" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">工具调用的工程铁律</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">工具调用是 Agent 触达外部世界的唯一出口——它既是能力放大器，也是最大的风险面</text>

  <!-- 三支柱 -->
  <g filter="url(#soft)"><rect x="30" y="80" width="290" height="180" rx="13" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="175" y="108" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">① 契约即接口</text>
  <text x="52" y="138" font-size="10" fill="#6e6e73">• 工具描述/Schema 就是给模型的 prompt</text>
  <text x="52" y="160" font-size="10" fill="#6e6e73">• 命名、参数、示例决定调用成败</text>
  <text x="52" y="182" font-size="10" fill="#6e6e73">• 输出必须结构化并强校验</text>
  <text x="52" y="204" font-size="10" fill="#6e6e73">• 校验失败要给模型可读的报错重试</text>
  <text x="52" y="230" font-size="9.5" fill="#0a84ff">写好工具文档 = 一半的准确率</text>

  <g filter="url(#soft)"><rect x="335" y="80" width="290" height="180" rx="13" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="480" y="108" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">② 安全与权限</text>
  <text x="357" y="138" font-size="10" fill="#6e6e73">• 最小权限：只授必要的工具与范围</text>
  <text x="357" y="160" font-size="10" fill="#6e6e73">• 危险操作需人工确认 / 二次审批</text>
  <text x="357" y="182" font-size="10" fill="#6e6e73">• 代码执行强制沙箱隔离</text>
  <text x="357" y="204" font-size="10" fill="#6e6e73">• 警惕注入：工具返回内容可能是攻击</text>
  <text x="357" y="230" font-size="9.5" fill="#f5873a">越权与注入是头号事故来源</text>

  <g filter="url(#soft)"><rect x="640" y="80" width="290" height="180" rx="13" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="785" y="108" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">③ 可靠与观测</text>
  <text x="662" y="138" font-size="10" fill="#6e6e73">• 超时/重试/幂等：外部调用会失败</text>
  <text x="662" y="160" font-size="10" fill="#6e6e73">• 记录每次调用的入参/结果/耗时</text>
  <text x="662" y="182" font-size="10" fill="#6e6e73">• 限流与熔断，防止级联雪崩</text>
  <text x="662" y="204" font-size="10" fill="#6e6e73">• 结果回流为观察，闭合推理循环</text>
  <text x="662" y="230" font-size="9.5" fill="#2dd4bf">可观测性是调试 Agent 的地基</text>

  <!-- 底部权衡 -->
  <g filter="url(#soft)"><rect x="30" y="290" width="900" height="180" rx="13" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="52" y="320" font-size="12.5" font-weight="600" fill="#1d1d1f">规模决定机制选择</text>
  <text x="52" y="350" font-size="10.5" fill="#6e6e73">• 少量工具 → 直接 Function Calling，全量塞进 prompt 最简单可靠</text>
  <text x="52" y="374" font-size="10.5" fill="#6e6e73">• 数百上千工具 → 工具路由（语义检索 Top-k），控制上下文长度与干扰</text>
  <text x="52" y="398" font-size="10.5" fill="#6e6e73">• 跨系统 / 生态复用 → MCP 协议标准化接入，M×N 适配降为 M+N</text>
  <text x="52" y="422" font-size="10.5" fill="#6e6e73">• 复杂多步编排 → Code-as-Action，用沙箱换取表达力（附带治理成本）</text>
  <text x="52" y="452" font-size="10" fill="#a78bfa">没有银弹：按工具规模、安全预算与编排复杂度组合使用，而非二选一</text>
</svg>