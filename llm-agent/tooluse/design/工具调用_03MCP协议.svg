<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">MCP · 工具接入的「USB-C」标准协议</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">Model Context Protocol：把「模型如何发现并调用工具/资源」标准化，一次实现处处复用</text>

  <!-- Host -->
  <g filter="url(#soft)"><rect x="60" y="120" width="220" height="240" rx="14" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="170" y="150" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">MCP Host (Agent 应用)</text>
  <g filter="url(#soft)"><rect x="86" y="176" width="168" height="70" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="170" y="206" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">MCP Client A</text>
  <text x="170" y="226" font-size="9.5" fill="#6e6e73" text-anchor="middle">与一个 Server 1:1 连接</text>
  <g filter="url(#soft)"><rect x="86" y="262" width="168" height="70" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="170" y="292" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">MCP Client B</text>
  <text x="170" y="312" font-size="9.5" fill="#6e6e73" text-anchor="middle">多 Client 并存</text>

  <!-- 协议通道 -->
  <g filter="url(#soft)"><rect x="360" y="180" width="200" height="160" rx="12" fill="#f3ecff" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="460" y="208" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">标准协议 (JSON-RPC)</text>
  <text x="378" y="236" font-size="10.5" fill="#6e6e73">• tools/list 发现工具</text>
  <text x="378" y="258" font-size="10.5" fill="#6e6e73">• tools/call 调用工具</text>
  <text x="378" y="280" font-size="10.5" fill="#6e6e73">• resources 读取资源</text>
  <text x="378" y="302" font-size="10.5" fill="#6e6e73">• prompts 复用模板</text>
  <text x="378" y="326" font-size="10" fill="#a78bfa">统一语义，与传输层解耦</text>

  <!-- Servers -->
  <g filter="url(#soft)"><rect x="640" y="120" width="270" height="66" rx="11" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="775" y="148" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">MCP Server · GitHub</text>
  <text x="775" y="168" font-size="9.5" fill="#6e6e73" text-anchor="middle">暴露 repo/issue/PR 工具</text>
  <g filter="url(#soft)"><rect x="640" y="200" width="270" height="66" rx="11" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="775" y="228" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">MCP Server · 数据库</text>
  <text x="775" y="248" font-size="9.5" fill="#6e6e73" text-anchor="middle">暴露 query/schema 工具</text>
  <g filter="url(#soft)"><rect x="640" y="280" width="270" height="66" rx="11" fill="#e6fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="775" y="308" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">MCP Server · 文件系统</text>
  <text x="775" y="328" font-size="9.5" fill="#6e6e73" text-anchor="middle">暴露 read/write 工具</text>

  <path d="M280 210 L356 220" stroke="#0a84ff" stroke-width="2" marker-end="url(#arh)"/>
  <path d="M280 296 L356 290" stroke="#0a84ff" stroke-width="2" marker-end="url(#arh)"/>
  <path d="M560 230 L636 155" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M560 250 L636 233" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M560 270 L636 310" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 价值 -->
  <g filter="url(#soft)"><rect x="60" y="390" width="850" height="110" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.3"/></g>
  <text x="80" y="416" font-size="12" font-weight="600" fill="#1d1d1f">为什么需要一个协议？</text>
  <text x="80" y="440" font-size="10.5" fill="#6e6e73">• 解耦：Agent 不必为每个工具写专属适配，Server 端一次实现即可被任意 Host 复用（M×N → M+N）</text>
  <text x="80" y="462" font-size="10.5" fill="#6e6e73">• 可发现：Host 运行时动态 tools/list 拉取能力清单，工具热插拔无需改 Agent 代码</text>
  <text x="80" y="484" font-size="10" fill="#f5873a">• 安全边界：Server 侧统一鉴权与权限控制；引入第三方 Server 需评估供应链风险</text>
</svg>