<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">推理优化 · 机制对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">三类构件分别回答：怎样免重算、怎样降开销、怎样提吞吐</text>

  <g filter="url(#soft)"><rect x="30" y="82" width="900" height="44" rx="10" fill="#ffffff" stroke="#e2e2e6" stroke-width="1.2"/></g>
  <text x="60" y="110" font-size="12" font-weight="600" fill="#1d1d1f">构件</text>
  <text x="230" y="110" font-size="12" font-weight="600" fill="#1d1d1f">解决什么问题</text>
  <text x="500" y="110" font-size="12" font-weight="600" fill="#1d1d1f">核心做法</text>
  <text x="770" y="110" font-size="12" font-weight="600" fill="#1d1d1f">主要代价</text>

  <g filter="url(#soft)"><rect x="30" y="136" width="900" height="96" rx="10" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.4"/></g>
  <text x="60" y="190" font-size="12.5" font-weight="600" fill="#c084fc">KV 缓存</text>
  <text x="230" y="178" font-size="11" fill="#6e6e73">自回归每步重算全序列</text>
  <text x="230" y="198" font-size="11" fill="#6e6e73">算力大量浪费</text>
  <text x="500" y="178" font-size="11" fill="#6e6e73">缓存历史键值，只算</text>
  <text x="500" y="198" font-size="11" fill="#6e6e73">新 token 的注意力</text>
  <text x="770" y="178" font-size="11" fill="#6e6e73">显存随上下文</text>
  <text x="770" y="198" font-size="11" fill="#6e6e73">长度线性增长</text>

  <g filter="url(#soft)"><rect x="30" y="242" width="900" height="96" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.4"/></g>
  <text x="60" y="296" font-size="12.5" font-weight="600" fill="#c084fc">模型压缩</text>
  <text x="230" y="284" font-size="11" fill="#6e6e73">模型太大，显存与</text>
  <text x="230" y="304" font-size="11" fill="#6e6e73">算力开销高</text>
  <text x="500" y="284" font-size="11" fill="#6e6e73">量化降精度、蒸馏换</text>
  <text x="500" y="304" font-size="11" fill="#6e6e73">小模型、剪枝去冗余</text>
  <text x="770" y="284" font-size="11" fill="#6e6e73">可能损失少量</text>
  <text x="770" y="304" font-size="11" fill="#6e6e73">精度</text>

  <g filter="url(#soft)"><rect x="30" y="348" width="900" height="96" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.4"/></g>
  <text x="60" y="402" font-size="12.5" font-weight="600" fill="#c084fc">服务调度</text>
  <text x="230" y="390" font-size="11" fill="#6e6e73">静态批 GPU 空转，</text>
  <text x="230" y="410" font-size="11" fill="#6e6e73">吞吐与并发上不去</text>
  <text x="500" y="390" font-size="11" fill="#6e6e73">连续批处理动态拼批 +</text>
  <text x="500" y="410" font-size="11" fill="#6e6e73">PagedAttention 分页显存</text>
  <text x="770" y="390" font-size="11" fill="#6e6e73">调度与显存</text>
  <text x="770" y="410" font-size="11" fill="#6e6e73">管理更复杂</text>

  <text x="480" y="486" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">缓存免重算 · 压缩降开销 · 调度提吞吐</text>
</svg>