<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">推理优化 · 工程对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">上线一套高性能推理服务的落地路线：先压模型、再优解码、后扛并发</text>

  <g filter="url(#soft)"><rect x="30" y="86" width="288" height="360" rx="14" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="54" y="120" font-size="13" font-weight="600" fill="#c084fc">① 先压模型</text>
  <text x="54" y="152" font-size="10.5" fill="#6e6e73">按目标硬件选量化精度</text>
  <text x="54" y="176" font-size="10.5" fill="#6e6e73">INT8/INT4，权衡精度损失</text>
  <text x="54" y="200" font-size="10.5" fill="#6e6e73">资源紧可蒸馏出小模型</text>
  <text x="54" y="232" font-size="10.5" fill="#6e6e73">结构化剪枝获取真实加速</text>
  <text x="54" y="256" font-size="10.5" fill="#6e6e73">压后务必评测精度回归</text>
  <text x="54" y="300" font-size="11" font-weight="600" fill="#1d1d1f">要点</text>
  <text x="54" y="324" font-size="10.5" fill="#6e6e73">量化性价比最高，优先尝试</text>
  <text x="54" y="348" font-size="10.5" fill="#6e6e73">精度敏感场景保留高精度层</text>

  <g filter="url(#soft)"><rect x="336" y="86" width="288" height="360" rx="14" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="360" y="120" font-size="13" font-weight="600" fill="#c084fc">② 再优解码</text>
  <text x="360" y="152" font-size="10.5" fill="#6e6e73">默认开启 KV 缓存</text>
  <text x="360" y="176" font-size="10.5" fill="#6e6e73">长上下文用 MQA/GQA 省缓存</text>
  <text x="360" y="200" font-size="10.5" fill="#6e6e73">必要时量化 KV 缓存</text>
  <text x="360" y="232" font-size="10.5" fill="#6e6e73">用 FlashAttention 加速算子</text>
  <text x="360" y="256" font-size="10.5" fill="#6e6e73">可叠加投机解码提速</text>
  <text x="360" y="300" font-size="11" font-weight="600" fill="#1d1d1f">要点</text>
  <text x="360" y="324" font-size="10.5" fill="#6e6e73">盯紧首 token 延迟与吞吐</text>
  <text x="360" y="348" font-size="10.5" fill="#6e6e73">缓存显存是长文本瓶颈</text>

  <g filter="url(#soft)"><rect x="642" y="86" width="288" height="360" rx="14" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="666" y="120" font-size="13" font-weight="600" fill="#c084fc">③ 后扛并发</text>
  <text x="666" y="152" font-size="10.5" fill="#6e6e73">用 vLLM/TGI 等成熟框架</text>
  <text x="666" y="176" font-size="10.5" fill="#6e6e73">开启连续批处理拉满 GPU</text>
  <text x="666" y="200" font-size="10.5" fill="#6e6e73">PagedAttention 管好显存</text>
  <text x="666" y="232" font-size="10.5" fill="#6e6e73">相同前缀共享块，省显存</text>
  <text x="666" y="256" font-size="10.5" fill="#6e6e73">按 SLA 做多副本与负载均衡</text>
  <text x="666" y="300" font-size="11" font-weight="600" fill="#1d1d1f">要点</text>
  <text x="666" y="324" font-size="10.5" fill="#6e6e73">平衡吞吐与单请求延迟</text>
  <text x="666" y="348" font-size="10.5" fill="#6e6e73">监控显存利用率与排队</text>

  <g filter="url(#soft)"><rect x="30" y="466" width="900" height="66" rx="12" fill="#ffffff" stroke="#e2e2e6" stroke-width="1.2"/></g>
  <text x="54" y="496" font-size="11" font-weight="600" fill="#1d1d1f">权衡速查</text>
  <text x="54" y="518" font-size="10.5" fill="#6e6e73">边缘/端侧 → 压缩优先；在线高并发 → 连续批 + PagedAttention；长文本 → GQA + KV 量化 + 分页显存</text>
</svg>