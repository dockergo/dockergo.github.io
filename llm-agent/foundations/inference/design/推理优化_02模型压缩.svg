<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">推理优化 · 模型压缩</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">在尽量保住精度的前提下缩小模型，让它更快、更省、更能上小设备</text>

  <g filter="url(#soft)"><rect x="30" y="90" width="288" height="290" rx="14" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="54" y="122" font-size="13" font-weight="600" fill="#c084fc">① 量化</text>
  <text x="54" y="150" font-size="10.5" fill="#6e6e73">降低权重/激活的数值精度</text>
  <text x="54" y="176" font-size="11" fill="#1d1d1f">FP16 → INT8 → INT4</text>
  <text x="54" y="204" font-size="10.5" fill="#6e6e73">· 显存与带宽成倍下降</text>
  <text x="54" y="228" font-size="10.5" fill="#6e6e73">· 支持 PTQ 训练后量化</text>
  <text x="54" y="252" font-size="10.5" fill="#6e6e73">· 与 QAT 量化感知训练</text>
  <text x="54" y="288" font-size="11" font-weight="600" fill="#1d1d1f">最常用、性价比高</text>
  <text x="54" y="314" font-size="10.5" fill="#9aa0a6">代价：过低比特可能掉精度</text>

  <g filter="url(#soft)"><rect x="336" y="90" width="288" height="290" rx="14" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="360" y="122" font-size="13" font-weight="600" fill="#c084fc">② 蒸馏</text>
  <text x="360" y="150" font-size="10.5" fill="#6e6e73">大模型当老师教小模型</text>
  <g filter="url(#soft)"><rect x="360" y="166" width="110" height="42" rx="8" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.1"/></g>
  <text x="415" y="192" font-size="10.5" fill="#c084fc" text-anchor="middle">教师大模型</text>
  <path d="M470 187 L494 187" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arp)"/>
  <g filter="url(#soft)"><rect x="496" y="166" width="104" height="42" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.1"/></g>
  <text x="548" y="192" font-size="10.5" fill="#1d1d1f" text-anchor="middle">学生小模型</text>
  <text x="360" y="236" font-size="10.5" fill="#6e6e73">学生模仿教师的软标签/中间表示</text>
  <text x="360" y="260" font-size="10.5" fill="#6e6e73">小模型学到大模型的知识与泛化</text>
  <text x="360" y="296" font-size="11" font-weight="600" fill="#1d1d1f">体积小、可自主部署</text>
  <text x="360" y="322" font-size="10.5" fill="#9aa0a6">代价：需额外训练、上限受教师限</text>

  <g filter="url(#soft)"><rect x="642" y="90" width="288" height="290" rx="14" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="666" y="122" font-size="13" font-weight="600" fill="#c084fc">③ 剪枝</text>
  <text x="666" y="150" font-size="10.5" fill="#6e6e73">去掉冗余的权重或结构</text>
  <text x="666" y="178" font-size="10.5" fill="#6e6e73">· 非结构化：剪单个权重</text>
  <text x="666" y="202" font-size="10.5" fill="#6e6e73">· 结构化：剪整头/整层</text>
  <text x="666" y="226" font-size="10.5" fill="#6e6e73">· 剪后再微调恢复精度</text>
  <text x="666" y="262" font-size="10.5" fill="#6e6e73">结构化剪枝更易获得实际加速</text>
  <text x="666" y="296" font-size="11" font-weight="600" fill="#1d1d1f">减参降算力</text>
  <text x="666" y="322" font-size="10.5" fill="#9aa0a6">代价：非结构化难落地为真实提速</text>

  <text x="480" y="440" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">量化降精度 · 蒸馏换小模型 · 剪枝去冗余——常组合使用，精度与效率的权衡</text>
</svg>