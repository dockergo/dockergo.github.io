<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">推理优化 · 生态架构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">让训练好的模型跑得更快、更省、更能扛并发——从请求到高吞吐服务的全链路</text>

  <g filter="url(#soft)"><rect x="30" y="96" width="150" height="70" rx="12" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="105" y="127" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">用户请求</text>
  <text x="105" y="147" font-size="10" fill="#6e6e73" text-anchor="middle">prompt 输入</text>
  <path d="M180 131 L214 131" stroke="#c084fc" stroke-width="2.2" fill="none" marker-end="url(#arp)"/>

  <g filter="url(#soft)"><rect x="216" y="96" width="150" height="70" rx="12" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="291" y="127" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">模型压缩</text>
  <text x="291" y="147" font-size="10" fill="#6e6e73" text-anchor="middle">量化 / 蒸馏 / 剪枝</text>
  <path d="M366 131 L400 131" stroke="#c084fc" stroke-width="2.2" fill="none" marker-end="url(#arp)"/>

  <g filter="url(#soft)"><rect x="402" y="96" width="150" height="70" rx="12" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="477" y="127" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">KV 缓存</text>
  <text x="477" y="147" font-size="10" fill="#6e6e73" text-anchor="middle">历史键值免重算</text>
  <path d="M552 131 L586 131" stroke="#c084fc" stroke-width="2.2" fill="none" marker-end="url(#arp)"/>

  <g filter="url(#soft)"><rect x="588" y="96" width="150" height="70" rx="12" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="663" y="127" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">服务调度</text>
  <text x="663" y="147" font-size="10" fill="#6e6e73" text-anchor="middle">连续批处理</text>
  <path d="M738 131 L772 131" stroke="#c084fc" stroke-width="2.2" fill="none" marker-end="url(#arp)"/>

  <g filter="url(#soft)"><rect x="774" y="96" width="156" height="70" rx="12" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="852" y="127" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">高吞吐服务</text>
  <text x="852" y="147" font-size="10" fill="#6e6e73" text-anchor="middle">低延迟 · 高并发</text>

  <text x="30" y="210" font-size="13" font-weight="600" fill="#1d1d1f">三层机理</text>

  <g filter="url(#soft)"><rect x="30" y="226" width="290" height="180" rx="14" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="54" y="258" font-size="13" font-weight="600" fill="#c084fc">① KV 缓存</text>
  <text x="54" y="288" font-size="11" fill="#6e6e73">自回归逐 token 生成时，</text>
  <text x="54" y="308" font-size="11" fill="#6e6e73">缓存历史键值避免重复计算</text>
  <text x="54" y="336" font-size="11" fill="#6e6e73">把 O(n²) 重算降为增量计算，</text>
  <text x="54" y="356" font-size="11" fill="#6e6e73">是解码提速的基石</text>
  <text x="54" y="386" font-size="10.5" fill="#9aa0a6">代价：显存随上下文线性增长</text>

  <g filter="url(#soft)"><rect x="336" y="226" width="290" height="180" rx="14" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="360" y="258" font-size="13" font-weight="600" fill="#c084fc">② 模型压缩</text>
  <text x="360" y="288" font-size="11" fill="#6e6e73">量化降精度、蒸馏教小模型、</text>
  <text x="360" y="308" font-size="11" fill="#6e6e73">剪枝去冗余</text>
  <text x="360" y="336" font-size="11" fill="#6e6e73">缩小模型体积与算力开销，</text>
  <text x="360" y="356" font-size="11" fill="#6e6e73">让大模型能上小设备</text>
  <text x="360" y="386" font-size="10.5" fill="#9aa0a6">代价：可能损失少量精度</text>

  <g filter="url(#soft)"><rect x="642" y="226" width="288" height="180" rx="14" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/></g>
  <text x="666" y="258" font-size="13" font-weight="600" fill="#c084fc">③ 服务调度</text>
  <text x="666" y="288" font-size="11" fill="#6e6e73">连续批处理动态拼批、</text>
  <text x="666" y="308" font-size="11" fill="#6e6e73">PagedAttention 分页管理显存</text>
  <text x="666" y="336" font-size="11" fill="#6e6e73">把 GPU 吃满，</text>
  <text x="666" y="356" font-size="11" fill="#6e6e73">大幅提升吞吐与并发</text>
  <text x="666" y="386" font-size="10.5" fill="#9aa0a6">代价：调度与显存管理更复杂</text>

  <text x="480" y="444" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">缓存免重算 · 压缩降开销 · 调度提吞吐——三管齐下把模型跑到极致</text>
</svg>