<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8b8bf"/>
    </marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/>
    </marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Transformer · 生态架构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">Token 嵌入 + 位置编码 → N × [ 自注意力 + 前馈，各带残差与归一化 ] → 输出分布</text>

  <!-- 输入 -->
  <g filter="url(#soft)"><rect x="40" y="270" width="150" height="76" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="115" y="302" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Token 序列</text>
  <text x="115" y="322" font-size="10.5" fill="#6e6e73" text-anchor="middle">分词后的 id 序列</text>

  <!-- 嵌入 + 位置编码 -->
  <g filter="url(#soft)"><rect x="230" y="256" width="150" height="104" rx="12" fill="#f3ecff" stroke="#5e5ce6" stroke-width="1.4"/></g>
  <text x="305" y="286" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">嵌入 + 位置编码</text>
  <text x="305" y="308" font-size="10.5" fill="#6e6e73" text-anchor="middle">词向量 ⊕ 位置信息</text>
  <text x="305" y="326" font-size="10.5" fill="#6e6e73" text-anchor="middle">得到含序的表征</text>
  <text x="305" y="346" font-size="10" fill="#5e5ce6" text-anchor="middle">注意力本身无序，需注入</text>

  <!-- 堆叠层 大框 -->
  <g filter="url(#soft)"><rect x="420" y="120" width="290" height="400" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/></g>
  <text x="565" y="148" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">N × Transformer Block</text>

  <!-- 多头注意力 子层 -->
  <g filter="url(#soft)"><rect x="450" y="172" width="230" height="86" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="565" y="200" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">多头自注意力</text>
  <text x="565" y="220" font-size="10.5" fill="#6e6e73" text-anchor="middle">token 之间互相看</text>
  <text x="565" y="244" font-size="10" fill="#0a84ff" text-anchor="middle">Add and Norm 残差 + 归一化</text>

  <!-- 前馈 子层 -->
  <g filter="url(#soft)"><rect x="450" y="290" width="230" height="86" rx="10" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="565" y="318" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">前馈网络 FFN</text>
  <text x="565" y="338" font-size="10.5" fill="#6e6e73" text-anchor="middle">逐位置非线性变换</text>
  <text x="565" y="362" font-size="10" fill="#2dd4bf" text-anchor="middle">Add and Norm 残差 + 归一化</text>

  <!-- 堆叠提示 -->
  <g filter="url(#soft)"><rect x="450" y="408" width="230" height="86" rx="10" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="565" y="436" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">堆叠 L 层</text>
  <text x="565" y="456" font-size="10.5" fill="#6e6e73" text-anchor="middle">逐层抽象：词法 → 句法 → 语义</text>
  <text x="565" y="478" font-size="10" fill="#f5873a" text-anchor="middle">深度 × 宽度 = 容量</text>

  <!-- 内部纵向流 -->
  <path d="M565 258 L565 288" stroke="#0a84ff" stroke-width="2" marker-end="url(#arh)"/>
  <path d="M565 376 L565 406" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arv)"/>

  <!-- 输出 -->
  <g filter="url(#soft)"><rect x="770" y="256" width="150" height="104" rx="12" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="845" y="286" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">输出投影</text>
  <text x="845" y="308" font-size="10.5" fill="#6e6e73" text-anchor="middle">线性映射到词表</text>
  <text x="845" y="326" font-size="10.5" fill="#6e6e73" text-anchor="middle">softmax → 概率</text>
  <text x="845" y="346" font-size="10" fill="#0a84ff" text-anchor="middle">预测下一个 token</text>

  <!-- 主流箭头 -->
  <path d="M190 308 L228 308" stroke="#0a84ff" stroke-width="2.4" marker-end="url(#arh)"/>
  <path d="M380 308 L418 308" stroke="#0a84ff" stroke-width="2.4" marker-end="url(#arh)"/>
  <path d="M710 308 L768 308" stroke="#0a84ff" stroke-width="2.4" marker-end="url(#arh)"/>

  <!-- 图例铭牌 -->
  <g filter="url(#soft)"><rect x="40" y="470" width="360" height="118" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="56" y="492" font-size="11" font-weight="600" fill="#1d1d1f">路径图例</text>
  <line x1="56" y1="508" x2="88" y2="508" stroke="#0a84ff" stroke-width="2.4"/>
  <text x="96" y="512" font-size="10.5" fill="#6e6e73">Hot 主前向流（嵌入 → 堆叠 → 输出）</text>
  <line x1="56" y1="528" x2="88" y2="528" stroke="#5e5ce6" stroke-width="1.6"/>
  <text x="96" y="532" font-size="10.5" fill="#6e6e73">位置信息注入（顺序感）</text>
  <line x1="56" y1="548" x2="88" y2="548" stroke="#2dd4bf" stroke-width="1.8"/>
  <text x="96" y="552" font-size="10.5" fill="#6e6e73">State 子层间残差直连</text>
  <line x1="56" y1="568" x2="88" y2="568" stroke="#f5873a" stroke-width="1.6"/>
  <text x="96" y="572" font-size="10.5" fill="#6e6e73">堆叠深度带来的表达容量</text>
</svg>