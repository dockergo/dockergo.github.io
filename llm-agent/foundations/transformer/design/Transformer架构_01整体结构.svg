<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a84ff"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5e5ce6"/>
    </marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Transformer · 整体结构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">编码器读全序列建立上下文，解码器带掩码自回归生成，交叉注意力把两侧连起来</text>

  <!-- 编码器栈 -->
  <g filter="url(#soft)"><rect x="60" y="110" width="360" height="470" rx="16" fill="#ffffff" stroke="#0a84ff" stroke-width="1.6"/></g>
  <text x="240" y="138" font-size="13" font-weight="600" fill="#0a84ff" text-anchor="middle">编码器 Encoder × N</text>

  <g filter="url(#soft)"><rect x="100" y="160" width="280" height="72" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.3"/></g>
  <text x="240" y="188" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">多头自注意力（双向）</text>
  <text x="240" y="212" font-size="10" fill="#6e6e73" text-anchor="middle">每个 token 可看全序列 + Add and Norm</text>

  <g filter="url(#soft)"><rect x="100" y="256" width="280" height="72" rx="10" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="240" y="284" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">前馈网络 FFN</text>
  <text x="240" y="308" font-size="10" fill="#6e6e73" text-anchor="middle">逐位置变换 + Add and Norm</text>

  <text x="240" y="360" font-size="10.5" fill="#6e6e73" text-anchor="middle">↑ 上述两子层重复 N 次 ↑</text>

  <g filter="url(#soft)"><rect x="100" y="392" width="280" height="60" rx="10" fill="#f3ecff" stroke="#5e5ce6" stroke-width="1.3"/></g>
  <text x="240" y="418" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">输入嵌入 + 位置编码</text>
  <text x="240" y="438" font-size="10" fill="#6e6e73" text-anchor="middle">源序列</text>

  <g filter="url(#soft)"><rect x="130" y="500" width="220" height="52" rx="10" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="240" y="531" font-size="11" fill="#1d1d1f" text-anchor="middle">源 Token（如原文）</text>

  <!-- 解码器栈 -->
  <g filter="url(#soft)"><rect x="540" y="110" width="360" height="470" rx="16" fill="#ffffff" stroke="#f5873a" stroke-width="1.6"/></g>
  <text x="720" y="138" font-size="13" font-weight="600" fill="#f5873a" text-anchor="middle">解码器 Decoder × N</text>

  <g filter="url(#soft)"><rect x="580" y="160" width="280" height="66" rx="10" fill="#fff3ea" stroke="#f5873a" stroke-width="1.3"/></g>
  <text x="720" y="186" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">掩码多头自注意力</text>
  <text x="720" y="208" font-size="10" fill="#6e6e73" text-anchor="middle">只能看已生成的左侧 token</text>

  <g filter="url(#soft)"><rect x="580" y="244" width="280" height="66" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.3"/></g>
  <text x="720" y="270" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">交叉注意力</text>
  <text x="720" y="292" font-size="10" fill="#6e6e73" text-anchor="middle">Query 来自解码器，K/V 来自编码器</text>

  <g filter="url(#soft)"><rect x="580" y="328" width="280" height="60" rx="10" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="720" y="354" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">前馈网络 FFN</text>
  <text x="720" y="374" font-size="10" fill="#6e6e73" text-anchor="middle">+ Add and Norm</text>

  <g filter="url(#soft)"><rect x="580" y="404" width="280" height="56" rx="10" fill="#f3ecff" stroke="#5e5ce6" stroke-width="1.3"/></g>
  <text x="720" y="428" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">输出嵌入 + 位置编码</text>
  <text x="720" y="448" font-size="10" fill="#6e6e73" text-anchor="middle">已生成序列（右移一位）</text>

  <g filter="url(#soft)"><rect x="610" y="500" width="220" height="52" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.3"/></g>
  <text x="720" y="524" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">输出投影 → softmax</text>
  <text x="720" y="542" font-size="9.5" fill="#6e6e73" text-anchor="middle">预测下一个 token</text>

  <!-- 内部流 -->
  <path d="M240 392 L240 330" stroke="#0a84ff" stroke-width="2" marker-end="url(#arh)"/>
  <path d="M240 256 L240 234" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arv)"/>
  <path d="M240 500 L240 454" stroke="#5e5ce6" stroke-width="2" marker-end="url(#arp)"/>
  <path d="M720 404 L720 390" stroke="#5e5ce6" stroke-width="2" marker-end="url(#arp)"/>
  <path d="M720 328 L720 312" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arv)"/>
  <path d="M720 244 L720 228" stroke="#0a84ff" stroke-width="2" marker-end="url(#arh)"/>
  <path d="M720 500 L720 462" stroke="#0a84ff" stroke-width="2" marker-end="url(#arh)"/>

  <!-- 交叉连接：编码器输出 → 解码器交叉注意力 -->
  <path d="M380 196 C470 196 470 277 578 277" fill="none" stroke="#0a84ff" stroke-width="2.2" stroke-dasharray="1 0" marker-end="url(#arh)"/>
  <text x="480" y="232" font-size="10" fill="#0a84ff" text-anchor="middle">编码器上下文 K/V</text>

  <!-- 图例 -->
  <g filter="url(#soft)"><rect x="60" y="600" width="840" height="60" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="76" y="622" font-size="11" font-weight="600" fill="#1d1d1f">路径图例</text>
  <line x1="76" y1="640" x2="108" y2="640" stroke="#0a84ff" stroke-width="2.2"/>
  <text x="116" y="644" font-size="10.5" fill="#6e6e73">注意力信息流</text>
  <line x1="300" y1="640" x2="332" y2="640" stroke="#2dd4bf" stroke-width="2"/>
  <text x="340" y="644" font-size="10.5" fill="#6e6e73">FFN 逐位置变换</text>
  <line x1="520" y1="640" x2="552" y2="640" stroke="#5e5ce6" stroke-width="2"/>
  <text x="560" y="644" font-size="10.5" fill="#6e6e73">嵌入与位置编码注入</text>
</svg>