<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Transformer · 机制对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">三大构件各司其职：结构定骨架、残差归一保训练、FFN 供容量</text>

  <!-- 表头 -->
  <g filter="url(#soft)"><rect x="30" y="76" width="900" height="44" rx="8" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.3"/></g>
  <text x="120" y="103" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">构件</text>
  <text x="360" y="103" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">解决什么问题</text>
  <text x="600" y="103" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">核心做法</text>
  <text x="830" y="103" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">主要代价</text>

  <!-- 行1 整体结构 -->
  <g filter="url(#soft)"><rect x="30" y="128" width="900" height="112" rx="8" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="120" y="176" font-size="12" font-weight="600" fill="#0a84ff" text-anchor="middle">整体结构</text>
  <text x="120" y="196" font-size="9.5" fill="#6e6e73" text-anchor="middle">Encoder/Decoder</text>
  <text x="360" y="170" font-size="10.5" fill="#6e6e73" text-anchor="middle">如何并行处理整段序列</text>
  <text x="360" y="190" font-size="10.5" fill="#6e6e73" text-anchor="middle">又保留 token 间依赖</text>
  <text x="600" y="170" font-size="10.5" fill="#6e6e73" text-anchor="middle">堆叠 N 个相同 Block</text>
  <text x="600" y="190" font-size="10.5" fill="#6e6e73" text-anchor="middle">注意力 + FFN 交替</text>
  <text x="830" y="170" font-size="10.5" fill="#6e6e73" text-anchor="middle">深度堆叠训练难</text>
  <text x="830" y="190" font-size="10.5" fill="#6e6e73" text-anchor="middle">显存与算力大</text>

  <!-- 行2 残差归一 -->
  <g filter="url(#soft)"><rect x="30" y="248" width="900" height="112" rx="8" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="120" y="296" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">残差与归一</text>
  <text x="120" y="316" font-size="9.5" fill="#6e6e73" text-anchor="middle">Add and Norm</text>
  <text x="360" y="290" font-size="10.5" fill="#6e6e73" text-anchor="middle">深层梯度消失</text>
  <text x="360" y="310" font-size="10.5" fill="#6e6e73" text-anchor="middle">激活分布漂移</text>
  <text x="600" y="290" font-size="10.5" fill="#6e6e73" text-anchor="middle">残差恒等直连</text>
  <text x="600" y="310" font-size="10.5" fill="#6e6e73" text-anchor="middle">LayerNorm 稳分布</text>
  <text x="830" y="290" font-size="10.5" fill="#6e6e73" text-anchor="middle">额外归一开销</text>
  <text x="830" y="310" font-size="10.5" fill="#6e6e73" text-anchor="middle">LN 位置需权衡</text>

  <!-- 行3 前馈 -->
  <g filter="url(#soft)"><rect x="30" y="368" width="900" height="112" rx="8" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="120" y="416" font-size="12" font-weight="600" fill="#f5873a" text-anchor="middle">前馈网络</text>
  <text x="120" y="436" font-size="9.5" fill="#6e6e73" text-anchor="middle">FFN</text>
  <text x="360" y="410" font-size="10.5" fill="#6e6e73" text-anchor="middle">注意力只做加权聚合</text>
  <text x="360" y="430" font-size="10.5" fill="#6e6e73" text-anchor="middle">缺非线性与容量</text>
  <text x="600" y="410" font-size="10.5" fill="#6e6e73" text-anchor="middle">升维→激活→降维</text>
  <text x="600" y="430" font-size="10.5" fill="#6e6e73" text-anchor="middle">逐位置独立变换</text>
  <text x="830" y="410" font-size="10.5" fill="#6e6e73" text-anchor="middle">占 2/3 参数量</text>
  <text x="830" y="430" font-size="10.5" fill="#6e6e73" text-anchor="middle">推理算力主要来源</text>

  <text x="480" y="504" font-size="11" fill="#0a84ff" text-anchor="middle">主线：结构给骨架，残差归一让它训得动，FFN 让它记得住 —— 三者缺一不可</text>
</svg>