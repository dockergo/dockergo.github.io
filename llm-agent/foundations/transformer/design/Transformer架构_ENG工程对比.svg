<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">Transformer · 工程实践</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">从论文到工业落地：架构选型、稳定训练、算力优化三条主线</text>

  <!-- 支柱1 架构选型 -->
  <g filter="url(#soft)"><rect x="30" y="90" width="290" height="200" rx="14" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.5"/></g>
  <text x="175" y="120" font-size="13" font-weight="600" fill="#0a84ff" text-anchor="middle">① 架构选型</text>
  <text x="50" y="152" font-size="10.5" fill="#6e6e73">· Encoder-only（BERT）：理解类任务</text>
  <text x="50" y="176" font-size="10.5" fill="#6e6e73">· Decoder-only（GPT）：生成/主流 LLM</text>
  <text x="50" y="200" font-size="10.5" fill="#6e6e73">· Encoder-Decoder（T5）：翻译/摘要</text>
  <text x="50" y="228" font-size="10.5" fill="#6e6e73">· 现代大模型几乎都走 Decoder-only</text>
  <text x="50" y="256" font-size="10.5" fill="#6e6e73">· 层数 × 隐维 × 头数 决定规模</text>
  <text x="50" y="280" font-size="10.5" fill="#0a84ff">选型即定位任务边界</text>

  <!-- 支柱2 稳定训练 -->
  <g filter="url(#soft)"><rect x="335" y="90" width="290" height="200" rx="14" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="480" y="120" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="middle">② 稳定训练</text>
  <text x="355" y="152" font-size="10.5" fill="#6e6e73">· Pre-LN 结构，深层不易发散</text>
  <text x="355" y="176" font-size="10.5" fill="#6e6e73">· RMSNorm 替代 LayerNorm 更省算力</text>
  <text x="355" y="200" font-size="10.5" fill="#6e6e73">· 残差缩放、warmup、梯度裁剪</text>
  <text x="355" y="228" font-size="10.5" fill="#6e6e73">· 混合精度 bf16 + 梯度累积</text>
  <text x="355" y="256" font-size="10.5" fill="#6e6e73">· 权重初始化随深度缩放</text>
  <text x="355" y="280" font-size="10.5" fill="#2dd4bf">让千亿参数收敛不崩</text>

  <!-- 支柱3 算力优化 -->
  <g filter="url(#soft)"><rect x="640" y="90" width="290" height="200" rx="14" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="785" y="120" font-size="13" font-weight="600" fill="#f5873a" text-anchor="middle">③ 算力优化</text>
  <text x="660" y="152" font-size="10.5" fill="#6e6e73">· FlashAttention 融合核，省显存</text>
  <text x="660" y="176" font-size="10.5" fill="#6e6e73">· 张量/流水/序列并行拆分模型</text>
  <text x="660" y="200" font-size="10.5" fill="#6e6e73">· 激活重计算，用算力换显存</text>
  <text x="660" y="228" font-size="10.5" fill="#6e6e73">· KV-Cache 加速自回归推理</text>
  <text x="660" y="256" font-size="10.5" fill="#6e6e73">· 量化 / MoE 降本增效</text>
  <text x="660" y="280" font-size="10.5" fill="#f5873a">把理论算力落成吞吐</text>

  <!-- 决策带 -->
  <g filter="url(#soft)"><rect x="30" y="320" width="900" height="200" rx="14" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.2"/></g>
  <text x="50" y="350" font-size="12" font-weight="600" fill="#1d1d1f">工程权衡速查</text>
  <text x="50" y="380" font-size="10.5" fill="#6e6e73">· 训练稳定性 vs 极致性能：优先 Pre-LN / RMSNorm 保住训练，再谈调优</text>
  <text x="50" y="404" font-size="10.5" fill="#6e6e73">· 模型容量 vs 推理成本：加深加宽提效果，但推理显存与延迟同步上涨</text>
  <text x="50" y="428" font-size="10.5" fill="#6e6e73">· 稠密 vs MoE：MoE 同等激活参数下总容量更大，但路由与通信更复杂</text>
  <text x="50" y="452" font-size="10.5" fill="#6e6e73">· 长上下文 vs 显存：注意力随序列平方增长，需高效注意力 + KV 优化</text>
  <text x="50" y="480" font-size="11" font-weight="600" fill="#0a84ff">主线：先能训得动、再算得快、最后追效果 —— 三支柱协同才能规模化</text>
  <text x="50" y="504" font-size="10" fill="#6e6e73">任何单点激进优化都可能牺牲另外两条，工业落地讲究整体平衡</text>
</svg>