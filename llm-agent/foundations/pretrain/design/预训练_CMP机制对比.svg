<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">预训练 · 三种机理对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">目标定「学什么」，数据定「学得好不好」，规模定「能到多强」</text>

  <g filter="url(#soft)"><rect x="30" y="80" width="900" height="44" rx="8" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/></g>
  <text x="120" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">构件</text>
  <text x="360" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">解决什么问题</text>
  <text x="600" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">核心做法</text>
  <text x="830" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">主要代价</text>

  <g filter="url(#soft)"><rect x="30" y="134" width="900" height="96" rx="8" fill="#ffffff" stroke="#4a9eff" stroke-width="1.3"/></g>
  <text x="120" y="188" font-size="12" font-weight="600" fill="#4a9eff" text-anchor="middle">训练目标</text>
  <text x="360" y="176" font-size="10" fill="#6e6e73" text-anchor="middle">如何无标注学语言</text>
  <text x="360" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">监督信号从哪来</text>
  <text x="600" y="176" font-size="10" fill="#6e6e73" text-anchor="middle">自回归/掩码</text>
  <text x="600" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">从文本自造标签</text>
  <text x="830" y="188" font-size="10" fill="#6e6e73" text-anchor="middle">目标决定能力偏向</text>

  <g filter="url(#soft)"><rect x="30" y="240" width="900" height="96" rx="8" fill="#ffffff" stroke="#4a9eff" stroke-width="1.3"/></g>
  <text x="120" y="294" font-size="12" font-weight="600" fill="#4a9eff" text-anchor="middle">数据分词</text>
  <text x="360" y="282" font-size="10" fill="#6e6e73" text-anchor="middle">脏数据拖垮上限</text>
  <text x="360" y="302" font-size="10" fill="#6e6e73" text-anchor="middle">如何表示文本</text>
  <text x="600" y="282" font-size="10" fill="#6e6e73" text-anchor="middle">清洗去重配比</text>
  <text x="600" y="302" font-size="10" fill="#6e6e73" text-anchor="middle">BPE 子词切分</text>
  <text x="830" y="294" font-size="10" fill="#6e6e73" text-anchor="middle">清洗成本高</text>

  <g filter="url(#soft)"><rect x="30" y="346" width="900" height="96" rx="8" fill="#ffffff" stroke="#4a9eff" stroke-width="1.3"/></g>
  <text x="120" y="400" font-size="12" font-weight="600" fill="#4a9eff" text-anchor="middle">规模法则</text>
  <text x="360" y="388" font-size="10" fill="#6e6e73" text-anchor="middle">预算如何分配</text>
  <text x="360" y="408" font-size="10" fill="#6e6e73" text-anchor="middle">性能能到多高</text>
  <text x="600" y="388" font-size="10" fill="#6e6e73" text-anchor="middle">参数/数据/算力配比</text>
  <text x="600" y="408" font-size="10" fill="#6e6e73" text-anchor="middle">幂律外推</text>
  <text x="830" y="400" font-size="10" fill="#6e6e73" text-anchor="middle">算力昂贵</text>

  <text x="480" y="486" font-size="12" font-weight="600" fill="#4a9eff" text-anchor="middle">一句话：目标给方向，数据给养分，规模给上限——三者共同锻造基座能力</text>
</svg>