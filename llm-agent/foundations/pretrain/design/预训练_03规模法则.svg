<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">预训练 · 规模法则</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">损失随参数、数据、算力以幂律下降，给定预算下三者存在最优配比</text>

  <g filter="url(#soft)"><rect x="30" y="86" width="435" height="330" rx="14" fill="#ffffff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="56" y="116" font-size="12.5" font-weight="600" fill="#4a9eff">损失 - 算力：幂律曲线</text>
  <line x1="80" y1="370" x2="440" y2="370" stroke="#d2d2d7" stroke-width="1.5"/>
  <line x1="80" y1="150" x2="80" y2="370" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="260" y="398" font-size="10" fill="#6e6e73" text-anchor="middle">算力 (对数)</text>
  <text x="60" y="260" font-size="10" fill="#6e6e73" text-anchor="middle" transform="rotate(-90 60 260)">损失</text>
  <path d="M96 172 C170 250 280 320 428 352" stroke="#4a9eff" stroke-width="2.6" fill="none"/>
  <circle cx="130" cy="216" r="4" fill="#4a9eff"/>
  <circle cx="240" cy="300" r="4" fill="#4a9eff"/>
  <circle cx="360" cy="342" r="4" fill="#4a9eff"/>
  <text x="150" y="210" font-size="9.5" fill="#6e6e73">小模型</text>
  <text x="378" y="336" font-size="9.5" fill="#6e6e73">大模型</text>
  <text x="56" y="352" font-size="10" fill="#6e6e73">规律平滑可预测：小规模实验外推大模型</text>

  <g filter="url(#soft)"><rect x="495" y="86" width="435" height="160" rx="14" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="521" y="116" font-size="12.5" font-weight="600" fill="#4a9eff">三要素配比</text>
  <text x="521" y="144" font-size="10.5" fill="#6e6e73">· 参数量 N：模型容量</text>
  <text x="521" y="168" font-size="10.5" fill="#6e6e73">· 数据量 D：训练 token 数</text>
  <text x="521" y="192" font-size="10.5" fill="#6e6e73">· 算力 C ≈ 6 · N · D</text>
  <text x="521" y="220" font-size="10.5" font-weight="600" fill="#1d1d1f">给定 C，需在 N 与 D 间取平衡</text>

  <g filter="url(#soft)"><rect x="495" y="262" width="435" height="154" rx="14" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="521" y="292" font-size="12.5" font-weight="600" fill="#4a9eff">Chinchilla 最优</text>
  <text x="521" y="320" font-size="10.5" fill="#6e6e73">· 早期模型「参数过大、数据不足」</text>
  <text x="521" y="344" font-size="10.5" fill="#6e6e73">· 最优比例约 20 token / 参数</text>
  <text x="521" y="368" font-size="10.5" fill="#6e6e73">· 同算力下更小但喂更多数据更强</text>
  <text x="521" y="394" font-size="10.5" fill="#6e6e73">· 推理成本还会进一步压小模型</text>

  <text x="480" y="452" font-size="12" font-weight="600" fill="#4a9eff" text-anchor="middle">主线：规模法则把「加多少算力换多少性能」变成可计算、可规划的工程问题</text>
</svg>