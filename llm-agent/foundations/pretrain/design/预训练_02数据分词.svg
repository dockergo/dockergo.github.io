<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a9eff"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">预训练 · 数据与分词</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">脏数据经多级清洗与配比，再由 BPE 切成子词，喂给模型的质量决定能力</text>

  <text x="30" y="92" font-size="12.5" font-weight="600" fill="#4a9eff">数据清洗流水线</text>
  <g filter="url(#soft)"><rect x="30" y="104" width="150" height="60" rx="10" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="105" y="130" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">原始爬取</text>
  <text x="105" y="150" font-size="9.5" fill="#6e6e73" text-anchor="middle">网页/PDF/代码</text>
  <g filter="url(#soft)"><rect x="212" y="104" width="150" height="60" rx="10" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="287" y="130" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">质量过滤</text>
  <text x="287" y="150" font-size="9.5" fill="#6e6e73" text-anchor="middle">语言/困惑度/规则</text>
  <g filter="url(#soft)"><rect x="394" y="104" width="150" height="60" rx="10" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="469" y="130" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">去重</text>
  <text x="469" y="150" font-size="9.5" fill="#6e6e73" text-anchor="middle">MinHash/精确</text>
  <g filter="url(#soft)"><rect x="576" y="104" width="150" height="60" rx="10" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="651" y="130" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">去毒去隐私</text>
  <text x="651" y="150" font-size="9.5" fill="#6e6e73" text-anchor="middle">有害/PII 过滤</text>
  <g filter="url(#soft)"><rect x="758" y="104" width="150" height="60" rx="10" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="833" y="130" font-size="11" font-weight="600" fill="#1d1d1f" text-anchor="middle">配比混合</text>
  <text x="833" y="150" font-size="9.5" fill="#6e6e73" text-anchor="middle">领域权重采样</text>
  <path d="M180 134 L212 134" stroke="#4a9eff" stroke-width="2" fill="none" marker-end="url(#arb)"/>
  <path d="M362 134 L394 134" stroke="#4a9eff" stroke-width="2" fill="none" marker-end="url(#arb)"/>
  <path d="M544 134 L576 134" stroke="#4a9eff" stroke-width="2" fill="none" marker-end="url(#arb)"/>
  <path d="M726 134 L758 134" stroke="#4a9eff" stroke-width="2" fill="none" marker-end="url(#arb)"/>

  <g filter="url(#soft)"><rect x="30" y="200" width="435" height="216" rx="14" fill="#ffffff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="56" y="232" font-size="12.5" font-weight="600" fill="#4a9eff">BPE 子词分词</text>
  <text x="56" y="258" font-size="10.5" fill="#6e6e73">从字符起步，反复合并高频相邻对</text>
  <text x="56" y="288" font-size="11" fill="#1d1d1f">"lower" → l o w e r</text>
  <text x="56" y="312" font-size="11" fill="#1d1d1f">合并 (e,r) → l o w er</text>
  <text x="56" y="336" font-size="11" fill="#1d1d1f">合并 (low) → low er</text>
  <text x="56" y="368" font-size="10.5" fill="#6e6e73">兼顾词表大小与未登录词覆盖</text>
  <text x="56" y="392" font-size="10.5" fill="#6e6e73">BBPE 在字节级操作，天然跨语言</text>

  <g filter="url(#soft)"><rect x="495" y="200" width="435" height="216" rx="14" fill="#ffffff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="521" y="232" font-size="12.5" font-weight="600" fill="#4a9eff">为何数据是第一生产力</text>
  <text x="521" y="260" font-size="10.5" fill="#6e6e73">· 质量 > 数量：脏数据拖垮上限</text>
  <text x="521" y="286" font-size="10.5" fill="#6e6e73">· 去重防止记忆与过拟合</text>
  <text x="521" y="312" font-size="10.5" fill="#6e6e73">· 配比决定领域与语言能力</text>
  <text x="521" y="338" font-size="10.5" fill="#6e6e73">· 代码/数学数据提升推理</text>
  <text x="521" y="368" font-size="11" font-weight="600" fill="#1d1d1f">语料即模型所见的整个世界</text>

  <text x="480" y="452" font-size="12" font-weight="600" fill="#4a9eff" text-anchor="middle">清洗决定「学到什么」，分词决定「怎么表示」，二者共同框定能力边界</text>
</svg>