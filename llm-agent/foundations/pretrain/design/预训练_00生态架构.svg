<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a9eff"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">预训练 · 生态架构</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">海量语料经清洗分词，在自监督目标下反复训练，规模决定能力上限</text>

  <g filter="url(#soft)"><rect x="30" y="96" width="150" height="72" rx="12" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="105" y="128" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">原始语料</text>
  <text x="105" y="148" font-size="10" fill="#6e6e73" text-anchor="middle">网页/书籍/代码</text>

  <g filter="url(#soft)"><rect x="212" y="96" width="150" height="72" rx="12" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="287" y="128" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">清洗与分词</text>
  <text x="287" y="148" font-size="10" fill="#6e6e73" text-anchor="middle">去重/过滤/BPE</text>

  <g filter="url(#soft)"><rect x="394" y="96" width="150" height="72" rx="12" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="469" y="128" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">自监督目标</text>
  <text x="469" y="148" font-size="10" fill="#6e6e73" text-anchor="middle">预测下一个 token</text>

  <g filter="url(#soft)"><rect x="576" y="96" width="150" height="72" rx="12" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="651" y="128" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">大规模训练</text>
  <text x="651" y="148" font-size="10" fill="#6e6e73" text-anchor="middle">算力/数据/参数</text>

  <g filter="url(#soft)"><rect x="758" y="96" width="150" height="72" rx="12" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="833" y="128" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">基座模型</text>
  <text x="833" y="148" font-size="10" fill="#6e6e73" text-anchor="middle">通用语言能力</text>

  <path d="M180 132 L212 132" stroke="#4a9eff" stroke-width="2.2" fill="none" marker-end="url(#arb)"/>
  <path d="M362 132 L394 132" stroke="#4a9eff" stroke-width="2.2" fill="none" marker-end="url(#arb)"/>
  <path d="M544 132 L576 132" stroke="#4a9eff" stroke-width="2.2" fill="none" marker-end="url(#arb)"/>
  <path d="M726 132 L758 132" stroke="#4a9eff" stroke-width="2.2" fill="none" marker-end="url(#arb)"/>

  <g filter="url(#soft)"><rect x="30" y="212" width="288" height="150" rx="14" fill="#ffffff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="54" y="244" font-size="12.5" font-weight="600" fill="#4a9eff">训练目标</text>
  <text x="54" y="272" font-size="10.5" fill="#6e6e73">自回归 (GPT) vs 掩码 (BERT)</text>
  <text x="54" y="294" font-size="10.5" fill="#6e6e73">生成式主导当代大模型</text>
  <text x="54" y="316" font-size="10.5" fill="#6e6e73">逐 token 最大化似然</text>
  <text x="54" y="338" font-size="10.5" fill="#6e6e73">无需人工标注</text>

  <g filter="url(#soft)"><rect x="336" y="212" width="288" height="150" rx="14" fill="#ffffff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="360" y="244" font-size="12.5" font-weight="600" fill="#4a9eff">数据分词</text>
  <text x="360" y="272" font-size="10.5" fill="#6e6e73">质量重于数量：去重去毒</text>
  <text x="360" y="294" font-size="10.5" fill="#6e6e73">BPE/BBPE 子词切分</text>
  <text x="360" y="316" font-size="10.5" fill="#6e6e73">配比决定领域能力</text>
  <text x="360" y="338" font-size="10.5" fill="#6e6e73">语料即模型的世界</text>

  <g filter="url(#soft)"><rect x="642" y="212" width="288" height="150" rx="14" fill="#ffffff" stroke="#4a9eff" stroke-width="1.4"/></g>
  <text x="666" y="244" font-size="12.5" font-weight="600" fill="#4a9eff">规模法则</text>
  <text x="666" y="272" font-size="10.5" fill="#6e6e73">损失随规模幂律下降</text>
  <text x="666" y="294" font-size="10.5" fill="#6e6e73">参数/数据/算力三者配比</text>
  <text x="666" y="316" font-size="10.5" fill="#6e6e73">Chinchilla 最优比例</text>
  <text x="666" y="338" font-size="10.5" fill="#6e6e73">可预测的性能外推</text>

  <text x="480" y="416" font-size="12" font-weight="600" fill="#4a9eff" text-anchor="middle">主线：目标定「学什么」，数据定「学得好不好」，规模定「能到多强」</text>
</svg>