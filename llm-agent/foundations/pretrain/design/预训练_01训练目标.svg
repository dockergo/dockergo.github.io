<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">预训练 · 训练目标</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">自回归预测「下一个词」与掩码还原「被遮词」，都是从文本中自造监督信号</text>

  <g filter="url(#soft)"><rect x="30" y="86" width="435" height="330" rx="14" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="56" y="118" font-size="13" font-weight="600" fill="#4a9eff">自回归 · Causal LM (GPT)</text>
  <text x="56" y="146" font-size="11" fill="#1d1d1f">给定前文，预测下一个 token</text>

  <g><rect x="56" y="170" width="60" height="34" rx="6" fill="#ffffff" stroke="#4a9eff" stroke-width="1.2"/><text x="86" y="192" font-size="11" fill="#1d1d1f" text-anchor="middle">猫</text></g>
  <g><rect x="126" y="170" width="60" height="34" rx="6" fill="#ffffff" stroke="#4a9eff" stroke-width="1.2"/><text x="156" y="192" font-size="11" fill="#1d1d1f" text-anchor="middle">坐</text></g>
  <g><rect x="196" y="170" width="60" height="34" rx="6" fill="#ffffff" stroke="#4a9eff" stroke-width="1.2"/><text x="226" y="192" font-size="11" fill="#1d1d1f" text-anchor="middle">在</text></g>
  <g><rect x="266" y="170" width="60" height="34" rx="6" fill="#dbeafe" stroke="#4a9eff" stroke-width="1.4" stroke-dasharray="4 3"/><text x="296" y="192" font-size="11" font-weight="600" fill="#4a9eff" text-anchor="middle">?</text></g>
  <text x="56" y="236" font-size="10.5" fill="#6e6e73">只能看左侧上下文（单向）</text>
  <text x="56" y="258" font-size="10.5" fill="#6e6e73">目标：最大化 P(词ₜ | 词₁..ₜ₋₁)</text>
  <text x="56" y="286" font-size="11" font-weight="600" fill="#1d1d1f">优势</text>
  <text x="56" y="308" font-size="10.5" fill="#6e6e73">· 天生适配文本生成</text>
  <text x="56" y="330" font-size="10.5" fill="#6e6e73">· 训练即推理，范式统一</text>
  <text x="56" y="352" font-size="10.5" fill="#6e6e73">· 主流大模型 (GPT/LLaMA) 采用</text>
  <text x="56" y="386" font-size="10.5" fill="#6e6e73">局限：不能利用右侧上下文</text>

  <g filter="url(#soft)"><rect x="495" y="86" width="435" height="330" rx="14" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="521" y="118" font-size="13" font-weight="600" fill="#4a9eff">掩码 · Masked LM (BERT)</text>
  <text x="521" y="146" font-size="11" fill="#1d1d1f">遮住部分 token，双向还原</text>

  <g><rect x="521" y="170" width="60" height="34" rx="6" fill="#ffffff" stroke="#4a9eff" stroke-width="1.2"/><text x="551" y="192" font-size="11" fill="#1d1d1f" text-anchor="middle">猫</text></g>
  <g><rect x="591" y="170" width="60" height="34" rx="6" fill="#dbeafe" stroke="#4a9eff" stroke-width="1.4" stroke-dasharray="4 3"/><text x="621" y="192" font-size="10" font-weight="600" fill="#4a9eff" text-anchor="middle">MASK</text></g>
  <g><rect x="661" y="170" width="60" height="34" rx="6" fill="#ffffff" stroke="#4a9eff" stroke-width="1.2"/><text x="691" y="192" font-size="11" fill="#1d1d1f" text-anchor="middle">在</text></g>
  <g><rect x="731" y="170" width="60" height="34" rx="6" fill="#ffffff" stroke="#4a9eff" stroke-width="1.2"/><text x="761" y="192" font-size="11" fill="#1d1d1f" text-anchor="middle">垫</text></g>
  <text x="521" y="236" font-size="10.5" fill="#6e6e73">左右上下文都可见（双向）</text>
  <text x="521" y="258" font-size="10.5" fill="#6e6e73">目标：还原被 MASK 的 token</text>
  <text x="521" y="286" font-size="11" font-weight="600" fill="#1d1d1f">优势</text>
  <text x="521" y="308" font-size="10.5" fill="#6e6e73">· 双向语境，理解任务强</text>
  <text x="521" y="330" font-size="10.5" fill="#6e6e73">· 适合分类/抽取等判别任务</text>
  <text x="521" y="352" font-size="10.5" fill="#6e6e73">· 编码器架构代表</text>
  <text x="521" y="386" font-size="10.5" fill="#6e6e73">局限：不直接支持自由生成</text>

  <text x="480" y="452" font-size="12" font-weight="600" fill="#4a9eff" text-anchor="middle">共同点：都从原始文本自造标签，无需人工标注即可学习语言规律</text>
</svg>