<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">预训练 · 工程三支柱</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">先算好规模配比，再堆数据流水线，最后靠分布式与稳定性把训练跑完</text>

  <g filter="url(#soft)"><rect x="30" y="86" width="288" height="360" rx="14" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="56" y="122" font-size="13" font-weight="600" fill="#4a9eff">① 规模规划</text>
  <text x="56" y="150" font-size="11" fill="#1d1d1f">先用小实验定配比</text>
  <text x="56" y="178" font-size="10.5" fill="#6e6e73">· 按算力预算反推 N/D</text>
  <text x="56" y="200" font-size="10.5" fill="#6e6e73">· Chinchilla 约 20 token/参数</text>
  <text x="56" y="222" font-size="10.5" fill="#6e6e73">· 小规模拟合幂律再外推</text>
  <text x="56" y="244" font-size="10.5" fill="#6e6e73">· 兼顾推理成本压模型</text>
  <text x="56" y="278" font-size="10.5" font-weight="600" fill="#1d1d1f">目标：省算力买最多能力</text>

  <g filter="url(#soft)"><rect x="336" y="86" width="288" height="360" rx="14" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="362" y="122" font-size="13" font-weight="600" fill="#4a9eff">② 数据工程</text>
  <text x="362" y="150" font-size="11" fill="#1d1d1f">质量与配比决定上限</text>
  <text x="362" y="178" font-size="10.5" fill="#6e6e73">· 大规模去重与质量过滤</text>
  <text x="362" y="200" font-size="10.5" fill="#6e6e73">· 领域配比与课程采样</text>
  <text x="362" y="222" font-size="10.5" fill="#6e6e73">· 代码/数学增强推理</text>
  <text x="362" y="244" font-size="10.5" fill="#6e6e73">· 训练前充分预处理落盘</text>
  <text x="362" y="278" font-size="10.5" font-weight="600" fill="#1d1d1f">目标：喂对、喂干净、喂够量</text>

  <g filter="url(#soft)"><rect x="642" y="86" width="288" height="360" rx="14" fill="#eaf3ff" stroke="#4a9eff" stroke-width="1.5"/></g>
  <text x="668" y="122" font-size="13" font-weight="600" fill="#4a9eff">③ 分布式训练</text>
  <text x="668" y="150" font-size="11" fill="#1d1d1f">把大模型跑起来跑稳</text>
  <text x="668" y="178" font-size="10.5" fill="#6e6e73">· 数据/张量/流水线并行</text>
  <text x="668" y="200" font-size="10.5" fill="#6e6e73">· 混合精度与 ZeRO 省显存</text>
  <text x="668" y="222" font-size="10.5" fill="#6e6e73">· checkpoint 容错续训</text>
  <text x="668" y="244" font-size="10.5" fill="#6e6e73">· 监控 loss 尖峰与发散</text>
  <text x="668" y="278" font-size="10.5" font-weight="600" fill="#1d1d1f">目标：数月训练不中断</text>

  <g filter="url(#soft)"><rect x="30" y="466" width="900" height="66" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/></g>
  <text x="52" y="494" font-size="11.5" font-weight="600" fill="#1d1d1f">权衡速查</text>
  <text x="52" y="516" font-size="10.5" fill="#6e6e73">算力有限先保数据质量 · 数据够了再放大参数 · 集群越大越要押注容错与稳定性</text>
  <text x="480" y="552" font-size="12" font-weight="600" fill="#4a9eff" text-anchor="middle">主线：规划给方向，数据给养分，分布式把两者在真实集群上兑现</text>
</svg>