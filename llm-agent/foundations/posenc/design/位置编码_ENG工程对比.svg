<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">位置编码 · 工程选型三支柱</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">默认用 RoPE，扩窗优先 NTK/YaRN，超长文本再叠系统级工程</text>

  <g filter="url(#soft)"><rect x="30" y="86" width="288" height="360" rx="14" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="56" y="122" font-size="13" font-weight="600" fill="#2dd4bf">① 编码选型</text>
  <text x="56" y="150" font-size="11" fill="#1d1d1f">RoPE 已成事实标准</text>
  <text x="56" y="178" font-size="10.5" fill="#6e6e73">· 相对性 + 无额外参数</text>
  <text x="56" y="200" font-size="10.5" fill="#6e6e73">· LLaMA / Qwen / GLM 通用</text>
  <text x="56" y="222" font-size="10.5" fill="#6e6e73">· 正弦编码仅少数场景</text>
  <text x="56" y="244" font-size="10.5" fill="#6e6e73">· 可学习编码难外推</text>
  <text x="56" y="278" font-size="10.5" font-weight="600" fill="#1d1d1f">选型：新模型直接 RoPE</text>

  <g filter="url(#soft)"><rect x="336" y="86" width="288" height="360" rx="14" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="362" y="122" font-size="13" font-weight="600" fill="#2dd4bf">② 扩窗策略</text>
  <text x="362" y="150" font-size="11" fill="#1d1d1f">免训练/微调扩上下文</text>
  <text x="362" y="178" font-size="10.5" fill="#6e6e73">· PI 线性插值最简单</text>
  <text x="362" y="200" font-size="10.5" fill="#6e6e73">· NTK-aware 保高频分辨率</text>
  <text x="362" y="222" font-size="10.5" fill="#6e6e73">· YaRN 分频段更稳</text>
  <text x="362" y="244" font-size="10.5" fill="#6e6e73">· 少量长文本微调固化</text>
  <text x="362" y="278" font-size="10.5" font-weight="600" fill="#1d1d1f">选型：NTK/YaRN + 微调</text>

  <g filter="url(#soft)"><rect x="642" y="86" width="288" height="360" rx="14" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="668" y="122" font-size="13" font-weight="600" fill="#f5873a">③ 长文本工程</text>
  <text x="668" y="150" font-size="11" fill="#1d1d1f">编码之外的系统手段</text>
  <text x="668" y="178" font-size="10.5" fill="#6e6e73">· 滑窗/局部注意力降复杂度</text>
  <text x="668" y="200" font-size="10.5" fill="#6e6e73">· KV 缓存分页管理显存</text>
  <text x="668" y="222" font-size="10.5" fill="#6e6e73">· 检索/摘要压缩上下文</text>
  <text x="668" y="244" font-size="10.5" fill="#6e6e73">· ALiBi 天然线性外推</text>
  <text x="668" y="278" font-size="10.5" font-weight="600" fill="#1d1d1f">选型：编码扩窗 + 系统压缩</text>

  <g filter="url(#soft)"><rect x="30" y="466" width="900" height="66" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/></g>
  <text x="52" y="494" font-size="11.5" font-weight="600" fill="#1d1d1f">权衡速查</text>
  <text x="52" y="516" font-size="10.5" fill="#6e6e73">短上下文：RoPE 原生即可 · 中等扩窗：NTK/YaRN 免大改 · 超长文本：扩窗与系统级压缩双管齐下</text>
  <text x="480" y="552" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">主线：编码给相对位置，扩窗给更远视野，工程给可落地的显存与延迟</text>
</svg>