<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
 <rect width="960" height="560" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">旋转位置编码 RoPE · 用旋转角表达相对距离</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">按位置把 Q/K 向量成对旋转，点积后自动只依赖两者的相对位置差</text>

  <!-- 左：旋转示意 -->
  <g filter="url(#soft)"><rect x="40" y="90" width="430" height="360" rx="12" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.4"/></g>
  <text x="60" y="118" font-size="12" font-weight="600" fill="#2dd4bf">位置 = 旋转角度</text>
  <!-- 坐标轴 -->
  <line x1="255" y1="160" x2="255" y2="340" stroke="#d2d2d7" stroke-width="1"/>
  <line x1="150" y1="250" x2="360" y2="250" stroke="#d2d2d7" stroke-width="1"/>
  <circle cx="255" cy="250" r="80" fill="none" stroke="#e5e5ea" stroke-width="1"/>
  <!-- 向量 pos0 -->
  <line x1="255" y1="250" x2="335" y2="250" stroke="#5e5ce6" stroke-width="2.4" marker-end="url(#arv)"/>
  <text x="342" y="248" font-size="10" fill="#5e5ce6">pos m</text>
  <!-- 向量 pos1 旋转 -->
  <line x1="255" y1="250" x2="311" y2="194" stroke="#2dd4bf" stroke-width="2.4" marker-end="url(#arv)"/>
  <text x="316" y="188" font-size="10" fill="#2dd4bf">pos n</text>
  <path d="M305 250 A50 50 0 0 0 290 215" stroke="#f5873a" stroke-width="1.6" fill="none"/>
  <text x="330" y="230" font-size="10" fill="#f5873a">θ∝(n−m)</text>
  <text x="60" y="380" font-size="10" fill="#6e6e73">向量按位置旋转固定角度</text>
  <text x="60" y="402" font-size="10" fill="#6e6e73">不同维度对用不同旋转频率</text>
  <text x="60" y="424" font-size="10" fill="#6e6e73">旋转不改变模长，只改相位</text>

  <!-- 右：性质 -->
  <g filter="url(#soft)"><rect x="490" y="90" width="430" height="360" rx="12" fill="#ffffff" stroke="#5e5ce6" stroke-width="1.4"/></g>
  <text x="510" y="118" font-size="12" font-weight="600" fill="#5e5ce6">为何点积只看相对位置</text>
  <text x="510" y="146" font-size="10" fill="#6e6e73">旋转后 qₘ·kₙ 仅依赖角度差 (m−n)</text>
  <text x="510" y="170" font-size="10" fill="#6e6e73">即注意力分数天然编码相对距离</text>
  <text x="510" y="200" font-size="11" font-weight="600" fill="#5e5ce6">相比绝对编码的优势</text>
  <text x="510" y="226" font-size="10" fill="#6e6e73">· 相对性：平移整段文本分数不变</text>
  <text x="510" y="250" font-size="10" fill="#6e6e73">· 无额外参数，作用在 Q/K 而非嵌入</text>
  <text x="510" y="274" font-size="10" fill="#6e6e73">· 远距离衰减，符合语言局部性直觉</text>
  <text x="510" y="298" font-size="10" fill="#6e6e73">· 可通过缩放旋转频率做长度外推</text>
  <text x="510" y="330" font-size="11" font-weight="600" fill="#5e5ce6">应用</text>
  <text x="510" y="356" font-size="10" fill="#6e6e73">LLaMA、Qwen、GLM 等主流模型标配</text>
  <text x="510" y="380" font-size="10" fill="#6e6e73">已成为开源大模型事实上的默认方案</text>

  <!-- 底部 -->
  <g filter="url(#soft)"><rect x="40" y="470" width="880" height="72" rx="12" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="60" y="498" font-size="11" font-weight="600" fill="#2dd4bf">一句话</text>
  <text x="60" y="522" font-size="10.2" fill="#6e6e73">RoPE 把「绝对位置加到嵌入」升级为「相对位置旋转 QK」，既保留位置信息，又天然具备相对性与外推潜力</text>
</svg>