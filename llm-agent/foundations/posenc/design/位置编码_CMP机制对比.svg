<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">位置编码 · 三种机理对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">绝对编码给「起点坐标」，RoPE 给「相对关系」，外推给「更长可用窗口」</text>

  <g filter="url(#soft)"><rect x="30" y="80" width="900" height="44" rx="8" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/></g>
  <text x="120" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">构件</text>
  <text x="360" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">解决什么问题</text>
  <text x="600" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">核心做法</text>
  <text x="830" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">主要代价</text>

  <g filter="url(#soft)"><rect x="30" y="134" width="900" height="96" rx="8" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="120" y="188" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">绝对位置</text>
  <text x="360" y="176" font-size="10" fill="#6e6e73" text-anchor="middle">注意力对顺序无感</text>
  <text x="360" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">需注入位置信息</text>
  <text x="600" y="176" font-size="10" fill="#6e6e73" text-anchor="middle">正弦/可学习向量</text>
  <text x="600" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">加到 token 嵌入</text>
  <text x="830" y="188" font-size="10" fill="#6e6e73" text-anchor="middle">可学习式难外推</text>

  <g filter="url(#soft)"><rect x="30" y="240" width="900" height="96" rx="8" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="120" y="294" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">旋转编码 RoPE</text>
  <text x="360" y="282" font-size="10" fill="#6e6e73" text-anchor="middle">绝对编码缺乏相对性</text>
  <text x="360" y="302" font-size="10" fill="#6e6e73" text-anchor="middle">平移不变性差</text>
  <text x="600" y="282" font-size="10" fill="#6e6e73" text-anchor="middle">按位置旋转 Q/K</text>
  <text x="600" y="302" font-size="10" fill="#6e6e73" text-anchor="middle">点积只看相对距离</text>
  <text x="830" y="294" font-size="10" fill="#6e6e73" text-anchor="middle">超长仍需配合外推</text>

  <g filter="url(#soft)"><rect x="30" y="346" width="900" height="96" rx="8" fill="#ffffff" stroke="#f5873a" stroke-width="1.3"/></g>
  <text x="120" y="400" font-size="12" font-weight="600" fill="#f5873a" text-anchor="middle">长度外推</text>
  <text x="360" y="388" font-size="10" fill="#6e6e73" text-anchor="middle">训练窗口短</text>
  <text x="360" y="408" font-size="10" fill="#6e6e73" text-anchor="middle">推理要处理更长文本</text>
  <text x="600" y="388" font-size="10" fill="#6e6e73" text-anchor="middle">位置插值/NTK 缩放</text>
  <text x="600" y="408" font-size="10" fill="#6e6e73" text-anchor="middle">或 ALiBi 距离偏置</text>
  <text x="830" y="400" font-size="10" fill="#6e6e73" text-anchor="middle">分辨率或长程受损</text>

  <text x="480" y="486" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">一句话：绝对定「坐标」，RoPE 定「相对」，外推定「能走多远」</text>
</svg>