<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">微调对齐 · 偏好对齐</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">用「人更喜欢哪个回答」的偏好信号，把模型行为拉向有用、诚实、无害</text>

  <g filter="url(#soft)"><rect x="30" y="86" width="435" height="330" rx="14" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="56" y="118" font-size="13" font-weight="600" fill="#f5873a">RLHF · 强化学习对齐</text>
  <g filter="url(#soft)"><rect x="56" y="140" width="170" height="48" rx="8" fill="#ffffff" stroke="#f5873a" stroke-width="1.2"/></g>
  <text x="141" y="169" font-size="10.5" fill="#1d1d1f" text-anchor="middle">① 收集人类偏好排序</text>
  <path d="M141 188 L141 208" stroke="#f5873a" stroke-width="2" fill="none" marker-end="url(#aro)"/>
  <g filter="url(#soft)"><rect x="56" y="210" width="170" height="48" rx="8" fill="#ffffff" stroke="#f5873a" stroke-width="1.2"/></g>
  <text x="141" y="239" font-size="10.5" fill="#1d1d1f" text-anchor="middle">② 训练奖励模型 RM</text>
  <path d="M141 258 L141 278" stroke="#f5873a" stroke-width="2" fill="none" marker-end="url(#aro)"/>
  <g filter="url(#soft)"><rect x="56" y="280" width="170" height="48" rx="8" fill="#ffffff" stroke="#f5873a" stroke-width="1.2"/></g>
  <text x="141" y="309" font-size="10.5" fill="#1d1d1f" text-anchor="middle">③ PPO 优化策略</text>
  <text x="248" y="170" font-size="10" fill="#6e6e73">对同一问题的多个回答</text>
  <text x="248" y="188" font-size="10" fill="#6e6e73">让人标注优劣顺序</text>
  <text x="248" y="240" font-size="10" fill="#6e6e73">RM 学会给回答打分</text>
  <text x="248" y="258" font-size="10" fill="#6e6e73">充当人类偏好的代理</text>
  <text x="248" y="310" font-size="10" fill="#6e6e73">最大化奖励 + KL 约束</text>
  <text x="248" y="328" font-size="10" fill="#6e6e73">防止偏离原模型太远</text>
  <text x="56" y="360" font-size="10.5" fill="#6e6e73">效果强但流程复杂、训练不稳</text>
  <text x="56" y="384" font-size="10.5" fill="#6e6e73">需维护 RM、策略、参考三套模型</text>

  <g filter="url(#soft)"><rect x="495" y="86" width="435" height="330" rx="14" fill="#ffffff" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="521" y="118" font-size="13" font-weight="600" fill="#f5873a">DPO · 直接偏好优化</text>
  <text x="521" y="148" font-size="11" fill="#1d1d1f">跳过奖励模型与强化学习</text>
  <text x="521" y="176" font-size="10.5" fill="#6e6e73">· 直接在「优选 vs 劣选」对上优化</text>
  <text x="521" y="200" font-size="10.5" fill="#6e6e73">· 用一个分类式损失拉高优选概率</text>
  <text x="521" y="224" font-size="10.5" fill="#6e6e73">· 隐式等价于 RLHF 目标</text>
  <text x="521" y="248" font-size="10.5" fill="#6e6e73">· 只需策略与参考两套模型</text>
  <text x="521" y="286" font-size="11" font-weight="600" fill="#1d1d1f">优势</text>
  <text x="521" y="310" font-size="10.5" fill="#6e6e73">· 实现简单、训练稳定</text>
  <text x="521" y="334" font-size="10.5" fill="#6e6e73">· 计算成本更低</text>
  <text x="521" y="358" font-size="10.5" fill="#6e6e73">· 已成开源社区主流选择</text>
  <text x="521" y="390" font-size="10.5" fill="#6e6e73">代价：极致效果上限或略逊于精调 RLHF</text>

  <text x="480" y="452" font-size="12" font-weight="600" fill="#f5873a" text-anchor="middle">共同目标：把「人类更偏好」的行为固化进模型，实现价值观与安全对齐</text>
</svg>