<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">微调对齐 · 工程对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">从基座到可用助手的落地路线：先打底、再对齐、后省卡</text>

  <g filter="url(#soft)"><rect x="30" y="86" width="288" height="360" rx="14" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="54" y="120" font-size="13" font-weight="600" fill="#f5873a">① 先 SFT 打底</text>
  <text x="54" y="152" font-size="10.5" fill="#6e6e73">精选高质量指令数据</text>
  <text x="54" y="176" font-size="10.5" fill="#6e6e73">覆盖任务、格式、多轮对话</text>
  <text x="54" y="200" font-size="10.5" fill="#6e6e73">宁缺毋滥，重清洗去重</text>
  <text x="54" y="232" font-size="10.5" fill="#6e6e73">让模型先学会「听懂并照做」</text>
  <text x="54" y="256" font-size="10.5" fill="#6e6e73">建立指令遵循与统一模板</text>
  <text x="54" y="300" font-size="11" font-weight="600" fill="#1d1d1f">要点</text>
  <text x="54" y="324" font-size="10.5" fill="#6e6e73">数据质量决定 SFT 上限</text>
  <text x="54" y="348" font-size="10.5" fill="#6e6e73">先小规模验证再扩量</text>

  <g filter="url(#soft)"><rect x="336" y="86" width="288" height="360" rx="14" fill="#ffffff" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="360" y="120" font-size="13" font-weight="600" fill="#f5873a">② 再对齐（轻量优先）</text>
  <text x="360" y="152" font-size="10.5" fill="#6e6e73">优先选 DPO：实现简单稳定</text>
  <text x="360" y="176" font-size="10.5" fill="#6e6e73">资源充足再考虑 RLHF-PPO</text>
  <text x="360" y="200" font-size="10.5" fill="#6e6e73">偏好数据同样重质量与多样</text>
  <text x="360" y="232" font-size="10.5" fill="#6e6e73">对齐有用性、诚实性、无害性</text>
  <text x="360" y="256" font-size="10.5" fill="#6e6e73">用 KL 约束防止能力退化</text>
  <text x="360" y="300" font-size="11" font-weight="600" fill="#1d1d1f">要点</text>
  <text x="360" y="324" font-size="10.5" fill="#6e6e73">监控是否「对齐税」掉能力</text>
  <text x="360" y="348" font-size="10.5" fill="#6e6e73">安全红队评测不可少</text>

  <g filter="url(#soft)"><rect x="642" y="86" width="288" height="360" rx="14" fill="#ffffff" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="666" y="120" font-size="13" font-weight="600" fill="#f5873a">③ LoRA 落地省卡</text>
  <text x="666" y="152" font-size="10.5" fill="#6e6e73">全流程用 LoRA / QLoRA</text>
  <text x="666" y="176" font-size="10.5" fill="#6e6e73">单卡或少卡即可微调大模型</text>
  <text x="666" y="200" font-size="10.5" fill="#6e6e73">一底座挂多套业务适配器</text>
  <text x="666" y="232" font-size="10.5" fill="#6e6e73">推理可合并权重，零额外延迟</text>
  <text x="666" y="256" font-size="10.5" fill="#6e6e73">存储只需保存小适配器</text>
  <text x="666" y="300" font-size="11" font-weight="600" fill="#1d1d1f">要点</text>
  <text x="666" y="324" font-size="10.5" fill="#6e6e73">选好秩 r 与目标层</text>
  <text x="666" y="348" font-size="10.5" fill="#6e6e73">极致效果场景再评估全参</text>

  <g filter="url(#soft)"><rect x="30" y="466" width="900" height="66" rx="12" fill="#ffffff" stroke="#e2e2e6" stroke-width="1.2"/></g>
  <text x="54" y="496" font-size="11" font-weight="600" fill="#1d1d1f">权衡速查</text>
  <text x="54" y="518" font-size="10.5" fill="#6e6e73">资源紧 → SFT + DPO + LoRA 轻量三件套；追极致效果 → 全参 + RLHF；多业务 → 共享底座挂多适配器</text>
  <text x="480" y="556" font-size="12" font-weight="600" fill="#f5873a" text-anchor="middle" opacity="0">占位</text>
</svg>