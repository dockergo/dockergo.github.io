<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">微调对齐 · 监督微调 SFT</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">用「指令 - 优质回答」样本继续训练，把补全模型改造成会听话的助手</text>

  <g filter="url(#soft)"><rect x="30" y="92" width="240" height="120" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="54" y="120" font-size="12" font-weight="600" fill="#f5873a">训练样本格式</text>
  <text x="54" y="146" font-size="10.5" fill="#1d1d1f">指令：翻译成英文「你好」</text>
  <text x="54" y="170" font-size="10.5" fill="#1d1d1f">回答：Hello</text>
  <text x="54" y="196" font-size="10" fill="#6e6e73">仅对「回答」部分算损失</text>

  <path d="M270 152 L322 152" stroke="#f5873a" stroke-width="2.2" fill="none" marker-end="url(#aro)"/>

  <g filter="url(#soft)"><rect x="322" y="92" width="240" height="120" rx="12" fill="#ffffff" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="346" y="120" font-size="12" font-weight="600" fill="#f5873a">基座 → 监督训练</text>
  <text x="346" y="146" font-size="10.5" fill="#6e6e73">在基座权重上继续训练</text>
  <text x="346" y="170" font-size="10.5" fill="#6e6e73">学习指令到回答的映射</text>
  <text x="346" y="196" font-size="10.5" fill="#6e6e73">小学习率、少量 epoch</text>

  <path d="M562 152 L614 152" stroke="#f5873a" stroke-width="2.2" fill="none" marker-end="url(#aro)"/>

  <g filter="url(#soft)"><rect x="614" y="92" width="294" height="120" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="638" y="120" font-size="12" font-weight="600" fill="#f5873a">得到指令模型</text>
  <text x="638" y="146" font-size="10.5" fill="#6e6e73">能理解并遵循自然语言指令</text>
  <text x="638" y="170" font-size="10.5" fill="#6e6e73">具备多任务泛化能力</text>
  <text x="638" y="196" font-size="10.5" fill="#6e6e73">是后续偏好对齐的起点</text>

  <g filter="url(#soft)"><rect x="30" y="248" width="435" height="150" rx="14" fill="#ffffff" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="54" y="280" font-size="12.5" font-weight="600" fill="#f5873a">为何数据质量是关键</text>
  <text x="54" y="308" font-size="10.5" fill="#6e6e73">· 少量高质量样本胜过海量噪声</text>
  <text x="54" y="332" font-size="10.5" fill="#6e6e73">· 多样性覆盖任务与风格分布</text>
  <text x="54" y="356" font-size="10.5" fill="#6e6e73">· 回答需体现期望的格式与语气</text>
  <text x="54" y="380" font-size="10.5" fill="#6e6e73">· 错误样本会被模型忠实模仿</text>

  <g filter="url(#soft)"><rect x="495" y="248" width="435" height="150" rx="14" fill="#ffffff" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="519" y="280" font-size="12.5" font-weight="600" fill="#f5873a">SFT 能与不能</text>
  <text x="519" y="308" font-size="10.5" fill="#6e6e73">· 能：激发基座已有的能力</text>
  <text x="519" y="332" font-size="10.5" fill="#6e6e73">· 能：定型输出格式与行为</text>
  <text x="519" y="356" font-size="10.5" fill="#6e6e73">· 难：注入大量全新知识</text>
  <text x="519" y="380" font-size="10.5" fill="#6e6e73">· 难：精细权衡「好 vs 更好」</text>

  <text x="480" y="440" font-size="12" font-weight="600" fill="#f5873a" text-anchor="middle">SFT 教会模型「怎么答」，但「答得多好」还要靠偏好对齐进一步打磨</text>
</svg>