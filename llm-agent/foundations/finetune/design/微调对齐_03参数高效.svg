<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5873a"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">微调对齐 · 参数高效 PEFT</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">冻结绝大部分权重，只训练少量新增参数，用几张卡完成大模型定制</text>

  <g filter="url(#soft)"><rect x="30" y="86" width="435" height="330" rx="14" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="56" y="118" font-size="13" font-weight="600" fill="#f5873a">LoRA · 低秩旁路</text>
  <g filter="url(#soft)"><rect x="120" y="150" width="130" height="150" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="185" y="228" font-size="13" fill="#9aa0a6" text-anchor="middle">W（冻结）</text>
  <text x="185" y="248" font-size="10" fill="#9aa0a6" text-anchor="middle">原始权重不更新</text>
  <g filter="url(#soft)"><rect x="300" y="160" width="120" height="52" rx="8" fill="#ffffff" stroke="#f5873a" stroke-width="1.3"/></g>
  <text x="360" y="191" font-size="11" fill="#f5873a" text-anchor="middle">B（d×r）</text>
  <path d="M360 212 L360 234" stroke="#f5873a" stroke-width="2" fill="none" marker-end="url(#aro)"/>
  <g filter="url(#soft)"><rect x="300" y="236" width="120" height="52" rx="8" fill="#ffffff" stroke="#f5873a" stroke-width="1.3"/></g>
  <text x="360" y="267" font-size="11" fill="#f5873a" text-anchor="middle">A（r×k）</text>
  <text x="56" y="336" font-size="12" font-weight="600" fill="#1d1d1f">ΔW = B · A ，秩 r 远小于原维度</text>
  <text x="56" y="362" font-size="10.5" fill="#6e6e73">只训练 A、B 两个小矩阵，参数量降到千分之几</text>
  <text x="56" y="386" font-size="10.5" fill="#6e6e73">推理时可合并回 W，零额外延迟</text>

  <g filter="url(#soft)"><rect x="495" y="86" width="435" height="330" rx="14" fill="#ffffff" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="521" y="118" font-size="13" font-weight="600" fill="#f5873a">方法谱系</text>
  <text x="521" y="150" font-size="11" font-weight="600" fill="#1d1d1f">· Adapter</text>
  <text x="540" y="170" font-size="10.5" fill="#6e6e73">层间插入小瓶颈模块</text>
  <text x="521" y="198" font-size="11" font-weight="600" fill="#1d1d1f">· Prefix / Prompt Tuning</text>
  <text x="540" y="218" font-size="10.5" fill="#6e6e73">只学少量可训练前缀向量</text>
  <text x="521" y="246" font-size="11" font-weight="600" fill="#1d1d1f">· LoRA</text>
  <text x="540" y="266" font-size="10.5" fill="#6e6e73">低秩旁路，可插拔可合并</text>
  <text x="521" y="294" font-size="11" font-weight="600" fill="#1d1d1f">· QLoRA</text>
  <text x="540" y="314" font-size="10.5" fill="#6e6e73">4bit 量化底座 + LoRA，单卡微调 65B</text>
  <text x="521" y="352" font-size="11" font-weight="600" fill="#f5873a">收益</text>
  <text x="521" y="374" font-size="10.5" fill="#6e6e73">显存与存储大降，一底座挂多套适配器</text>
  <text x="521" y="396" font-size="10.5" fill="#6e6e73">代价：极端任务上限或略逊全参微调</text>

  <text x="480" y="452" font-size="12" font-weight="600" fill="#f5873a" text-anchor="middle">核心思想：少量可训练参数撬动大模型，省显存、可插拔、易落地</text>
</svg>