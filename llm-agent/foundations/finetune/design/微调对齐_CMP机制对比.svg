<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">微调对齐 · 机制对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">三类构件分别回答：教它怎么答、调它答得好不好、怎样低成本落地</text>

  <g filter="url(#soft)"><rect x="30" y="82" width="900" height="44" rx="10" fill="#ffffff" stroke="#e2e2e6" stroke-width="1.2"/></g>
  <text x="60" y="110" font-size="12" font-weight="600" fill="#1d1d1f">构件</text>
  <text x="230" y="110" font-size="12" font-weight="600" fill="#1d1d1f">解决什么问题</text>
  <text x="500" y="110" font-size="12" font-weight="600" fill="#1d1d1f">核心做法</text>
  <text x="770" y="110" font-size="12" font-weight="600" fill="#1d1d1f">主要代价</text>

  <g filter="url(#soft)"><rect x="30" y="136" width="900" height="96" rx="10" fill="#fff3ea" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="60" y="190" font-size="12.5" font-weight="600" fill="#f5873a">监督微调 SFT</text>
  <text x="230" y="178" font-size="11" fill="#6e6e73">基座只会续写，不会</text>
  <text x="230" y="198" font-size="11" fill="#6e6e73">遵循指令、按格式回答</text>
  <text x="500" y="178" font-size="11" fill="#6e6e73">用「指令-回答」样本</text>
  <text x="500" y="198" font-size="11" fill="#6e6e73">做有监督续训</text>
  <text x="770" y="178" font-size="11" fill="#6e6e73">依赖高质量标注</text>
  <text x="770" y="198" font-size="11" fill="#6e6e73">数据质量 > 数量</text>

  <g filter="url(#soft)"><rect x="30" y="242" width="900" height="96" rx="10" fill="#ffffff" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="60" y="296" font-size="12.5" font-weight="600" fill="#f5873a">偏好对齐</text>
  <text x="230" y="284" font-size="11" fill="#6e6e73">会答但不一定有用、</text>
  <text x="230" y="304" font-size="11" fill="#6e6e73">诚实、无害</text>
  <text x="500" y="284" font-size="11" fill="#6e6e73">用人类偏好排序，经</text>
  <text x="500" y="304" font-size="11" fill="#6e6e73">RLHF 或 DPO 优化</text>
  <text x="770" y="284" font-size="11" fill="#6e6e73">偏好数据贵、RLHF</text>
  <text x="770" y="304" font-size="11" fill="#6e6e73">训练复杂不稳</text>

  <g filter="url(#soft)"><rect x="30" y="348" width="900" height="96" rx="10" fill="#ffffff" stroke="#f5873a" stroke-width="1.4"/></g>
  <text x="60" y="402" font-size="12.5" font-weight="600" fill="#f5873a">参数高效 PEFT</text>
  <text x="230" y="390" font-size="11" fill="#6e6e73">全参微调太吃显存、</text>
  <text x="230" y="410" font-size="11" fill="#6e6e73">存储成本高</text>
  <text x="500" y="390" font-size="11" fill="#6e6e73">冻结底座，只训 LoRA</text>
  <text x="500" y="410" font-size="11" fill="#6e6e73">等少量新增参数</text>
  <text x="770" y="390" font-size="11" fill="#6e6e73">极端任务上限或</text>
  <text x="770" y="410" font-size="11" fill="#6e6e73">略逊全参微调</text>

  <text x="480" y="486" font-size="13" font-weight="600" fill="#f5873a" text-anchor="middle">SFT 教怎么答 · 对齐调好不好 · PEFT 省成本</text>
</svg>