<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5e5ce6"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">缩放点积注意力 · QKV 与 softmax 加权</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">Attention(Q,K,V) = softmax(Q·Kᵀ / √dₖ) · V —— 用点积相似度决定每个 Value 的权重</text>

  <!-- Q K V -->
  <g filter="url(#soft)"><rect x="50" y="120" width="120" height="60" rx="10" fill="#f3ecff" stroke="#5e5ce6" stroke-width="1.5"/></g>
  <text x="110" y="150" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">Query Q</text>
  <text x="110" y="168" font-size="9.5" fill="#6e6e73" text-anchor="middle">我想找什么</text>
  <g filter="url(#soft)"><rect x="50" y="270" width="120" height="60" rx="10" fill="#f3ecff" stroke="#5e5ce6" stroke-width="1.5"/></g>
  <text x="110" y="300" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">Key K</text>
  <text x="110" y="318" font-size="9.5" fill="#6e6e73" text-anchor="middle">我是什么</text>
  <g filter="url(#soft)"><rect x="50" y="420" width="120" height="60" rx="10" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.5"/></g>
  <text x="110" y="450" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">Value V</text>
  <text x="110" y="468" font-size="9.5" fill="#6e6e73" text-anchor="middle">我携带什么信息</text>

  <!-- 点积打分 -->
  <g filter="url(#soft)"><rect x="250" y="180" width="160" height="90" rx="12" fill="#ffffff" stroke="#5e5ce6" stroke-width="1.5"/></g>
  <text x="330" y="212" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">Q·Kᵀ 点积</text>
  <text x="330" y="234" font-size="10" fill="#6e6e73" text-anchor="middle">相似度分数矩阵</text>
  <text x="330" y="254" font-size="10" fill="#6e6e73" text-anchor="middle">n×n 打分</text>

  <!-- 缩放 -->
  <g filter="url(#soft)"><rect x="460" y="180" width="150" height="90" rx="12" fill="#ffffff" stroke="#5e5ce6" stroke-width="1.5"/></g>
  <text x="535" y="212" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">÷ √dₖ 缩放</text>
  <text x="535" y="234" font-size="10" fill="#6e6e73" text-anchor="middle">抑制大维度下</text>
  <text x="535" y="254" font-size="10" fill="#6e6e73" text-anchor="middle">点积过大</text>

  <!-- softmax -->
  <g filter="url(#soft)"><rect x="660" y="180" width="150" height="90" rx="12" fill="#fff3ea" stroke="#f5873a" stroke-width="1.5"/></g>
  <text x="735" y="212" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">softmax</text>
  <text x="735" y="234" font-size="10" fill="#6e6e73" text-anchor="middle">归一成概率权重</text>
  <text x="735" y="254" font-size="10" fill="#6e6e73" text-anchor="middle">行和为 1</text>

  <!-- 加权聚合 -->
  <g filter="url(#soft)"><rect x="560" y="410" width="250" height="80" rx="12" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.6"/></g>
  <text x="685" y="442" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">权重 · V 加权求和</text>
  <text x="685" y="464" font-size="10" fill="#6e6e73" text-anchor="middle">得到每个位置的上下文向量</text>

  <!-- 连线 -->
  <path d="M170 150 L248 210" stroke="#5e5ce6" stroke-width="2" marker-end="url(#arp)"/>
  <path d="M170 300 L248 240" stroke="#5e5ce6" stroke-width="2" marker-end="url(#arp)"/>
  <path d="M410 225 L458 225" stroke="#5e5ce6" stroke-width="2.2" marker-end="url(#arp)"/>
  <path d="M610 225 L658 225" stroke="#5e5ce6" stroke-width="2.2" marker-end="url(#arp)"/>
  <path d="M735 270 C735 360 685 360 685 408" stroke="#f5873a" stroke-width="2.2" fill="none" marker-end="url(#arp)"/>
  <path d="M170 450 C400 450 430 450 558 450" stroke="#2dd4bf" stroke-width="2.2" fill="none" marker-end="url(#arp)"/>

  <!-- 说明卡 -->
  <g filter="url(#soft)"><rect x="40" y="520" width="430" height="60" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="58" y="544" font-size="11" font-weight="600" fill="#5e5ce6">为何要缩放</text>
  <text x="58" y="565" font-size="9.8" fill="#6e6e73">dₖ 增大时点积方差随之增大，softmax 会趋于饱和、梯度消失，除 √dₖ 稳住分布</text>
  <g filter="url(#soft)"><rect x="490" y="520" width="430" height="60" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="508" y="544" font-size="11" font-weight="600" fill="#2dd4bf">QKV 的分工</text>
  <text x="508" y="565" font-size="9.8" fill="#6e6e73">Q 提问、K 应答匹配、V 承载信息；同一输入经三套权重投影得来</text>
</svg>