<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5e5ce6"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">多头注意力 · 多子空间并行与拼接投影</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">把 d 维切成 h 个头，各头在独立子空间学不同关系，再 concat 后线性投影融合</text>

  <!-- 输入 -->
  <g filter="url(#soft)"><rect x="380" y="90" width="200" height="56" rx="10" fill="#eef4ff" stroke="#0a84ff" stroke-width="1.4"/></g>
  <text x="480" y="122" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">输入表征 (d 维)</text>

  <!-- 三个头 -->
  <g filter="url(#soft)"><rect x="70" y="220" width="240" height="120" rx="12" fill="#f3ecff" stroke="#5e5ce6" stroke-width="1.5"/></g>
  <text x="190" y="250" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">头 1</text>
  <text x="190" y="274" font-size="10" fill="#6e6e73" text-anchor="middle">独立 Wq/Wk/Wv</text>
  <text x="190" y="296" font-size="10" fill="#6e6e73" text-anchor="middle">缩放点积注意力</text>
  <text x="190" y="322" font-size="10" fill="#5e5ce6" text-anchor="middle">关注语法邻接</text>

  <g filter="url(#soft)"><rect x="360" y="220" width="240" height="120" rx="12" fill="#f3ecff" stroke="#5e5ce6" stroke-width="1.5"/></g>
  <text x="480" y="250" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">头 2</text>
  <text x="480" y="274" font-size="10" fill="#6e6e73" text-anchor="middle">独立 Wq/Wk/Wv</text>
  <text x="480" y="296" font-size="10" fill="#6e6e73" text-anchor="middle">缩放点积注意力</text>
  <text x="480" y="322" font-size="10" fill="#5e5ce6" text-anchor="middle">关注指代共现</text>

  <g filter="url(#soft)"><rect x="650" y="220" width="240" height="120" rx="12" fill="#f3ecff" stroke="#5e5ce6" stroke-width="1.5"/></g>
  <text x="770" y="250" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">头 h …</text>
  <text x="770" y="274" font-size="10" fill="#6e6e73" text-anchor="middle">独立 Wq/Wk/Wv</text>
  <text x="770" y="296" font-size="10" fill="#6e6e73" text-anchor="middle">缩放点积注意力</text>
  <text x="770" y="322" font-size="10" fill="#5e5ce6" text-anchor="middle">关注长程语义</text>

  <!-- 拼接投影 -->
  <g filter="url(#soft)"><rect x="330" y="410" width="300" height="72" rx="12" fill="#e9fbf6" stroke="#2dd4bf" stroke-width="1.6"/></g>
  <text x="480" y="440" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">Concat + 输出投影 Wo</text>
  <text x="480" y="462" font-size="10" fill="#6e6e73" text-anchor="middle">拼回 d 维并混合各头信息</text>

  <!-- 连线 -->
  <path d="M420 146 C300 170 200 190 190 218" stroke="#5e5ce6" stroke-width="2" fill="none" marker-end="url(#arp)"/>
  <path d="M480 146 L480 218" stroke="#5e5ce6" stroke-width="2" marker-end="url(#arp)"/>
  <path d="M540 146 C660 170 760 190 770 218" stroke="#5e5ce6" stroke-width="2" fill="none" marker-end="url(#arp)"/>
  <path d="M190 340 C200 380 320 400 380 410" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arp)"/>
  <path d="M480 340 L480 408" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arp)"/>
  <path d="M770 340 C760 380 640 400 580 410" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arp)"/>

  <!-- 说明卡 -->
  <g filter="url(#soft)"><rect x="40" y="510" width="430" height="58" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="58" y="534" font-size="11" font-weight="600" fill="#5e5ce6">为何要多头</text>
  <text x="58" y="555" font-size="9.8" fill="#6e6e73">单头只能表达一种关系；多头让模型在不同子空间并行捕捉多类依赖</text>
  <g filter="url(#soft)"><rect x="490" y="510" width="430" height="58" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.1"/></g>
  <text x="508" y="534" font-size="11" font-weight="600" fill="#2dd4bf">总维度不变</text>
  <text x="508" y="555" font-size="9.8" fill="#6e6e73">每头维度 d/h，h 头拼接仍为 d，算力与单头相当却更具表达力</text>
</svg>