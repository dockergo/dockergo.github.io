<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#fbfbfd"/>
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1d1d1f">注意力机制 · 三层机理对比</text>
  <text x="30" y="54" font-size="12" fill="#6e6e73">缩放点积搭「计算内核」，多头拓「表达广度」，高效实现破「规模瓶颈」</text>

  <!-- 表头 -->
  <g filter="url(#soft)"><rect x="30" y="80" width="900" height="44" rx="8" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/></g>
  <text x="120" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">构件</text>
  <text x="360" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">解决什么问题</text>
  <text x="600" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">核心做法</text>
  <text x="830" y="108" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">主要代价</text>

  <!-- 行1 缩放点积 -->
  <g filter="url(#soft)"><rect x="30" y="134" width="900" height="96" rx="8" fill="#ffffff" stroke="#5e5ce6" stroke-width="1.3"/></g>
  <text x="120" y="188" font-size="12" font-weight="600" fill="#5e5ce6" text-anchor="middle">缩放点积</text>
  <text x="360" y="176" font-size="10" fill="#6e6e73" text-anchor="middle">如何量化「谁该关注谁」</text>
  <text x="360" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">并稳定训练梯度</text>
  <text x="600" y="176" font-size="10" fill="#6e6e73" text-anchor="middle">Q·Kᵀ/√dₖ 打分</text>
  <text x="600" y="196" font-size="10" fill="#6e6e73" text-anchor="middle">softmax 后加权 V</text>
  <text x="830" y="188" font-size="10" fill="#6e6e73" text-anchor="middle">n² 复杂度</text>

  <!-- 行2 多头 -->
  <g filter="url(#soft)"><rect x="30" y="240" width="900" height="96" rx="8" fill="#ffffff" stroke="#5e5ce6" stroke-width="1.3"/></g>
  <text x="120" y="294" font-size="12" font-weight="600" fill="#5e5ce6" text-anchor="middle">多头注意力</text>
  <text x="360" y="282" font-size="10" fill="#6e6e73" text-anchor="middle">单一打分难以同时</text>
  <text x="360" y="302" font-size="10" fill="#6e6e73" text-anchor="middle">表达多类关系</text>
  <text x="600" y="282" font-size="10" fill="#6e6e73" text-anchor="middle">切 h 个子空间并行</text>
  <text x="600" y="302" font-size="10" fill="#6e6e73" text-anchor="middle">concat 后投影融合</text>
  <text x="830" y="294" font-size="10" fill="#6e6e73" text-anchor="middle">头间可能冗余</text>

  <!-- 行3 高效 -->
  <g filter="url(#soft)"><rect x="30" y="346" width="900" height="96" rx="8" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.3"/></g>
  <text x="120" y="400" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">高效注意力</text>
  <text x="360" y="388" font-size="10" fill="#6e6e73" text-anchor="middle">长序列下 n² 显存</text>
  <text x="360" y="408" font-size="10" fill="#6e6e73" text-anchor="middle">与算力吃不消</text>
  <text x="600" y="388" font-size="10" fill="#6e6e73" text-anchor="middle">掩码约束可见性</text>
  <text x="600" y="408" font-size="10" fill="#6e6e73" text-anchor="middle">分块/稀疏/GQA 提效</text>
  <text x="830" y="400" font-size="10" fill="#6e6e73" text-anchor="middle">实现复杂或损精度</text>

  <text x="480" y="486" font-size="12" font-weight="600" fill="#5e5ce6" text-anchor="middle">一句话：点积管「怎么算」，多头管「看几种」，高效实现管「能否放大」</text>
</svg>