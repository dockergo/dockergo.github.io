<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1120" height="660" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">O1 冒泡排序 · 相邻两两比较交换，每趟把最大值「冒泡」到末尾</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">外循环未排区 [0, i]；内循环 j 从 0 扫到 i-1，nums[j] &gt; nums[j+1] 则交换。flag 记录本趟是否交换，无交换即提前终止</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">指针 j 扫描</text>
  <rect x="150" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="168" y="82" font-size="10.5" fill="#3a3a3c">逆序 → 交换</text>
  <rect x="280" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="298" y="82" font-size="10.5" fill="#3a3a3c">已排定末尾</text>
  <rect x="400" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="418" y="82" font-size="10.5" fill="#3a3a3c">未排区元素</text>

  <!-- ① 一趟内部 -->
  <text x="30" y="116" font-size="12.5" font-weight="700" fill="#20375e">① 一趟内部：j 逐格右移，相邻逆序即交换（示例首趟，最大值 9 一路冒到末尾）</text>

  <text x="40" y="150" font-size="11" fill="#6e6e73">起始</text>
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="134" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="125" y="156" fill="#8a5a12">5</text>
    <rect x="156" y="134" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="181" y="156" fill="#8a5a12">2</text>
    <rect x="212" y="134" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="237" y="156" fill="#8a5a12">9</text>
    <rect x="268" y="134" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="293" y="156" fill="#8a5a12">1</text>
    <rect x="324" y="134" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="349" y="156" fill="#8a5a12">6</text>
    <rect x="380" y="134" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="405" y="156" fill="#8a5a12">3</text>
  </g>
  <!-- 相邻比较标记 -->
  <text x="153" y="192" font-size="9.5" fill="#8a4038" text-anchor="middle">5&gt;2 ✚</text>
  <text x="209" y="192" font-size="9.5" fill="#6e6e73" text-anchor="middle">5&lt;9 ✓</text>
  <text x="265" y="192" font-size="9.5" fill="#8a4038" text-anchor="middle">9&gt;1 ✚</text>
  <text x="321" y="192" font-size="9.5" fill="#8a4038" text-anchor="middle">9&gt;6 ✚</text>
  <text x="377" y="192" font-size="9.5" fill="#8a4038" text-anchor="middle">9&gt;3 ✚</text>
  <line x1="100" y1="178" x2="405" y2="178" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  <text x="450" y="156" font-size="10.5" fill="#6e6e73">j：0 → i-1（本趟 4 次交换）</text>

  <line x1="260" y1="200" x2="260" y2="224" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>

  <text x="40" y="256" font-size="11" fill="#6e6e73">第1趟后</text>
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="240" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="125" y="262" fill="#8a5a12">2</text>
    <rect x="156" y="240" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="181" y="262" fill="#8a5a12">5</text>
    <rect x="212" y="240" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="237" y="262" fill="#8a5a12">1</text>
    <rect x="268" y="240" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="293" y="262" fill="#8a5a12">6</text>
    <rect x="324" y="240" width="50" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="349" y="262" fill="#8a5a12">3</text>
    <rect x="380" y="240" width="50" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="405" y="262" fill="#2f6b4e">9</text>
  </g>
  <text x="450" y="262" font-size="10.5" fill="#2f6b4e">最大值 9 已排定于末尾</text>

  <!-- ② 每趟快照 -->
  <text x="30" y="316" font-size="12.5" font-weight="700" fill="#20375e">② 每趟快照：有序尾区（绿）逐格增长；第 4 趟一次交换都没有 → flag=false → 提前终止</text>

  <!-- 快照表 -->
  <g font-size="12.5" text-anchor="middle">
    <!-- 初始 -->
    <text x="90" y="360" font-size="10.5" fill="#6e6e73" text-anchor="start">初始</text>
    <rect x="150" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="173" y="365" fill="#8a5a12">5</text>
    <rect x="202" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="225" y="365" fill="#8a5a12">2</text>
    <rect x="254" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="277" y="365" fill="#8a5a12">9</text>
    <rect x="306" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="329" y="365" fill="#8a5a12">1</text>
    <rect x="358" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="381" y="365" fill="#8a5a12">6</text>
    <rect x="410" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="433" y="365" fill="#8a5a12">3</text>
    <!-- 第1趟 -->
    <text x="90" y="400" font-size="10.5" fill="#6e6e73" text-anchor="start">第1趟</text>
    <rect x="150" y="384" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="173" y="405" fill="#8a5a12">2</text>
    <rect x="202" y="384" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="225" y="405" fill="#8a5a12">5</text>
    <rect x="254" y="384" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="277" y="405" fill="#8a5a12">1</text>
    <rect x="306" y="384" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="329" y="405" fill="#8a5a12">6</text>
    <rect x="358" y="384" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="381" y="405" fill="#8a5a12">3</text>
    <rect x="410" y="384" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="433" y="405" fill="#2f6b4e">9</text>
    <!-- 第2趟 -->
    <text x="90" y="440" font-size="10.5" fill="#6e6e73" text-anchor="start">第2趟</text>
    <rect x="150" y="424" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="173" y="445" fill="#8a5a12">2</text>
    <rect x="202" y="424" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="225" y="445" fill="#8a5a12">1</text>
    <rect x="254" y="424" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="277" y="445" fill="#8a5a12">5</text>
    <rect x="306" y="424" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="329" y="445" fill="#8a5a12">3</text>
    <rect x="358" y="424" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="381" y="445" fill="#2f6b4e">6</text>
    <rect x="410" y="424" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="433" y="445" fill="#2f6b4e">9</text>
    <!-- 第3趟 -->
    <text x="90" y="480" font-size="10.5" fill="#6e6e73" text-anchor="start">第3趟</text>
    <rect x="150" y="464" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="173" y="485" fill="#8a5a12">1</text>
    <rect x="202" y="464" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="225" y="485" fill="#8a5a12">2</text>
    <rect x="254" y="464" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="277" y="485" fill="#8a5a12">3</text>
    <rect x="306" y="464" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="329" y="485" fill="#2f6b4e">5</text>
    <rect x="358" y="464" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="381" y="485" fill="#2f6b4e">6</text>
    <rect x="410" y="464" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="433" y="485" fill="#2f6b4e">9</text>
    <!-- 第4趟 -->
    <text x="90" y="520" font-size="10.5" fill="#6e6e73" text-anchor="start">第4趟</text>
    <rect x="150" y="504" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="173" y="525" fill="#2f6b4e">1</text>
    <rect x="202" y="504" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="225" y="525" fill="#2f6b4e">2</text>
    <rect x="254" y="504" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="277" y="525" fill="#2f6b4e">3</text>
    <rect x="306" y="504" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="329" y="525" fill="#2f6b4e">5</text>
    <rect x="358" y="504" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="381" y="525" fill="#2f6b4e">6</text>
    <rect x="410" y="504" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="433" y="525" fill="#2f6b4e">9</text>
  </g>
  <!-- 右侧注解 -->
  <text x="490" y="365" font-size="10.5" fill="#8a8a8f">乱序输入</text>
  <text x="490" y="405" font-size="10.5" fill="#2f6b4e">9 冒到末尾（4 次交换）</text>
  <text x="490" y="445" font-size="10.5" fill="#2f6b4e">6 归位（2 次交换）</text>
  <text x="490" y="485" font-size="10.5" fill="#2f6b4e">5 归位，前缀恰好已有序</text>
  <rect x="486" y="505" width="330" height="30" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/>
  <text x="500" y="524" font-size="10.5" fill="#2f6b4e">扫描 0 次交换 → flag=false → break 提前终止</text>

  <!-- 底部性质 -->
  <rect x="850" y="120" width="240" height="414" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="870" y="146" font-size="12" font-weight="700" fill="#20375e">复杂度与性质</text>
  <text x="870" y="176" font-size="10.5" fill="#4a4a4f">平均 / 最坏</text>
  <text x="870" y="194" font-size="13" font-weight="700" fill="#8a4038">O(n²)</text>
  <text x="870" y="212" font-size="9.5" fill="#8a8a8f">约 n²/2 次比较</text>
  <text x="870" y="244" font-size="10.5" fill="#4a4a4f">最好（已有序）</text>
  <text x="870" y="262" font-size="13" font-weight="700" fill="#2f6b4e">O(n)</text>
  <text x="870" y="280" font-size="9.5" fill="#8a8a8f">首趟无交换即止（靠 flag）</text>
  <text x="870" y="312" font-size="10.5" fill="#4a4a4f">空间</text>
  <text x="870" y="330" font-size="13" font-weight="700" fill="#20375e">O(1) · 原地</text>
  <text x="870" y="362" font-size="10.5" fill="#4a4a4f">稳定性</text>
  <text x="870" y="380" font-size="13" font-weight="700" fill="#2f6b4e">稳定</text>
  <text x="870" y="400" font-size="9.5" fill="#8a8a8f">相等元素用 &gt; 不 &lt;=</text>
  <text x="870" y="414" font-size="9.5" fill="#8a8a8f">判交换，故不越位</text>
  <text x="870" y="448" font-size="10" fill="#6e6e73">直观易懂，但交换次数多；</text>
  <text x="870" y="466" font-size="10" fill="#6e6e73">工程中极少采用，多作</text>
  <text x="870" y="484" font-size="10" fill="#6e6e73">教学与「稳定 + 原地」示例。</text>
</svg>
