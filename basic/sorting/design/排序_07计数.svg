<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a6fd0"/></marker>
  </defs>
  <rect width="1120" height="680" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">O7 计数排序 · 统计各值出现次数 → 前缀和定位 → 倒序回填</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">不比较元素，用「值本身」当下标。适用整数键且值域 m 有限；本图示例 nums=[2,0,3,1,2,3]，最大值 m=3</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">输入 nums</text>
  <rect x="160" y="72" width="12" height="12" rx="2" fill="#8a6fd0"/><text x="178" y="82" font-size="10.5" fill="#3a3a3c">counter（辅助）</text>
  <rect x="320" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="338" y="82" font-size="10.5" fill="#3a3a3c">结果 res</text>
  <rect x="430" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="448" y="82" font-size="10.5" fill="#3a3a3c">下标 / 指针</text>

  <!-- ① 统计次数 -->
  <text x="30" y="112" font-size="12.5" font-weight="700" fill="#20375e">① 统计次数：遍历 nums，counter[值]++（counter 长度 = m+1）</text>
  <text x="40" y="150" font-size="10.5" fill="#6e6e73">nums</text>
  <g font-size="13" text-anchor="middle">
    <rect x="120" y="134" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="143" y="155" fill="#8a5a12">2</text>
    <rect x="170" y="134" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="193" y="155" fill="#8a5a12">0</text>
    <rect x="220" y="134" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="243" y="155" fill="#8a5a12">3</text>
    <rect x="270" y="134" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="293" y="155" fill="#8a5a12">1</text>
    <rect x="320" y="134" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="343" y="155" fill="#8a5a12">2</text>
    <rect x="370" y="134" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="393" y="155" fill="#8a5a12">3</text>
  </g>
  <line x1="440" y1="149" x2="560" y2="149" stroke="#8a6fd0" stroke-width="1.8" marker-end="url(#aP)"/>
  <text x="500" y="139" font-size="9.5" fill="#4b3a80" text-anchor="middle">计数</text>

  <text x="590" y="128" font-size="10" fill="#4b3a80">counter[值] = 出现次数</text>
  <g font-size="13" text-anchor="middle">
    <rect x="600" y="134" width="52" height="30" rx="5" fill="#efeafb" stroke="#ccbef0"/><text x="626" y="155" fill="#4b3a80">1</text>
    <rect x="654" y="134" width="52" height="30" rx="5" fill="#efeafb" stroke="#ccbef0"/><text x="680" y="155" fill="#4b3a80">1</text>
    <rect x="708" y="134" width="52" height="30" rx="5" fill="#efeafb" stroke="#ccbef0"/><text x="734" y="155" fill="#4b3a80">2</text>
    <rect x="762" y="134" width="52" height="30" rx="5" fill="#efeafb" stroke="#ccbef0"/><text x="788" y="155" fill="#4b3a80">2</text>
  </g>
  <text x="626" y="180" font-size="9" fill="#a1a1a6" text-anchor="middle">值0</text>
  <text x="680" y="180" font-size="9" fill="#a1a1a6" text-anchor="middle">值1</text>
  <text x="734" y="180" font-size="9" fill="#a1a1a6" text-anchor="middle">值2</text>
  <text x="788" y="180" font-size="9" fill="#a1a1a6" text-anchor="middle">值3</text>
  <text x="840" y="145" font-size="10" fill="#6e6e73">0×1、1×1、</text>
  <text x="840" y="161" font-size="10" fill="#6e6e73">2×2、3×2</text>

  <!-- ② 前缀和 -->
  <text x="30" y="222" font-size="12.5" font-weight="700" fill="#20375e">② 前缀和：counter[i+1] += counter[i]，把「出现次数」变为「末位下标+1」</text>
  <g font-size="13" text-anchor="middle">
    <rect x="600" y="238" width="52" height="30" rx="5" fill="#efeafb" stroke="#ccbef0"/><text x="626" y="259" fill="#4b3a80">1</text>
    <rect x="654" y="238" width="52" height="30" rx="5" fill="#efeafb" stroke="#ccbef0"/><text x="680" y="259" fill="#4b3a80">2</text>
    <rect x="708" y="238" width="52" height="30" rx="5" fill="#efeafb" stroke="#ccbef0"/><text x="734" y="259" fill="#4b3a80">4</text>
    <rect x="762" y="238" width="52" height="30" rx="5" fill="#efeafb" stroke="#ccbef0"/><text x="788" y="259" fill="#4b3a80">6</text>
  </g>
  <text x="450" y="248" font-size="10.5" fill="#4b3a80">累加 →</text>
  <text x="450" y="266" font-size="10" fill="#6e6e73">得 [1,2,4,6]</text>
  <text x="840" y="250" font-size="10" fill="#4a4a4f">含义：值 v 的元素应放在</text>
  <text x="840" y="266" font-size="10" fill="#4a4a4f">res 下标 [counter[v]-1] 及之前</text>

  <!-- ③ 倒序回填 -->
  <text x="30" y="318" font-size="12.5" font-weight="700" fill="#20375e">③ 倒序遍历 nums，将各元素放入 res[counter[值]-1]，随后 counter[值]--（保证稳定）</text>

  <text x="40" y="360" font-size="10.5" fill="#6e6e73">nums</text>
  <g font-size="13" text-anchor="middle">
    <rect x="120" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="143" y="365" fill="#8a5a12">2</text>
    <rect x="170" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="193" y="365" fill="#8a5a12">0</text>
    <rect x="220" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="243" y="365" fill="#8a5a12">3</text>
    <rect x="270" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="293" y="365" fill="#8a5a12">1</text>
    <rect x="320" y="344" width="46" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="343" y="365" fill="#8a5a12">2</text>
    <rect x="370" y="344" width="46" height="30" rx="5" fill="#fbe6e3" stroke="#e8a79f" stroke-width="1.5"/><text x="393" y="365" fill="#8a4038">3</text>
  </g>
  <line x1="416" y1="390" x2="120" y2="390" stroke="#4a7fd0" stroke-width="1.5" marker-end="url(#aB)"/>
  <text x="270" y="404" font-size="9.5" fill="#20375e" text-anchor="middle">从右往左扫描</text>

  <text x="40" y="452" font-size="10.5" fill="#2f6b4e">res</text>
  <g font-size="13" text-anchor="middle">
    <rect x="120" y="436" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="143" y="457" fill="#2f6b4e">0</text>
    <rect x="170" y="436" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="193" y="457" fill="#2f6b4e">1</text>
    <rect x="220" y="436" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="243" y="457" fill="#2f6b4e">2</text>
    <rect x="270" y="436" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="293" y="457" fill="#2f6b4e">2</text>
    <rect x="320" y="436" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="343" y="457" fill="#2f6b4e">3</text>
    <rect x="370" y="436" width="46" height="30" rx="5" fill="#fbe6e3" stroke="#e8a79f" stroke-width="1.5"/><text x="393" y="457" fill="#8a4038">3</text>
  </g>
  <text x="143" y="484" font-size="9" fill="#a1a1a6" text-anchor="middle">0</text>
  <text x="393" y="484" font-size="9" fill="#a1a1a6" text-anchor="middle">5</text>
  <!-- 放置示意：最后的 3 放到 res[5] -->
  <path d="M393 374 L393 400 L440 400 L440 420 L393 420 L393 434" fill="none" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="470" y="452" font-size="10.5" fill="#2f6b4e">末尾的 3 → res[counter[3]-1 = 5]，counter[3] 减到 5</text>

  <!-- 步骤说明 -->
  <rect x="480" y="330" width="610" height="94" rx="12" fill="#f6f4fb" stroke="#ccbef0"/>
  <text x="500" y="354" font-size="11" font-weight="700" fill="#4b3a80">为什么倒序 + 前缀和 = 稳定</text>
  <text x="500" y="378" font-size="10.5" fill="#4a4a4f">counter[v]-1 是值 v 的「最后一个空位」。从右往左取 nums，相同值中原本靠后的</text>
  <text x="500" y="398" font-size="10.5" fill="#4a4a4f">先被放到更靠后的位置；每放一个就 counter[v]--，下一个同值元素落到它左边。</text>
  <text x="500" y="416" font-size="10" fill="#2f6b4e">→ 相等元素相对次序不变（这正是基数排序把它当作稳定子过程的前提）。</text>

  <!-- 最终结果 -->
  <text x="40" y="530" font-size="10.5" fill="#2f6b4e">最终 res</text>
  <g font-size="13" text-anchor="middle">
    <rect x="140" y="514" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="163" y="535" fill="#2f6b4e">0</text>
    <rect x="190" y="514" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="213" y="535" fill="#2f6b4e">1</text>
    <rect x="240" y="514" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="263" y="535" fill="#2f6b4e">2</text>
    <rect x="290" y="514" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="313" y="535" fill="#2f6b4e">2</text>
    <rect x="340" y="514" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="363" y="535" fill="#2f6b4e">3</text>
    <rect x="390" y="514" width="46" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="413" y="535" fill="#2f6b4e">3</text>
  </g>
  <text x="470" y="533" font-size="10.5" fill="#2f6b4e">copy 回 nums，排序完成（全程无一次元素间比较）</text>

  <!-- 复杂度 -->
  <rect x="40" y="566" width="1050" height="94" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="60" y="592" font-size="11" font-weight="700" fill="#20375e">复杂度与约束</text>
  <text x="60" y="616" font-size="10.5" fill="#4a4a4f">时间 <tspan font-weight="700" fill="#2f6b4e">O(n + m)</tspan>（m 为值域大小）· 空间 <tspan font-weight="700" fill="#8a6fd0">O(n + m)</tspan> · <tspan font-weight="700" fill="#2f6b4e">稳定</tspan></text>
  <text x="60" y="638" font-size="10.5" fill="#8a4038">约束：只能排非负整数键（或可映射为其的键）；当 m ≫ n（值域稀疏）时空间与时间都会爆炸，此时应改用比较排序。</text>
</svg>
