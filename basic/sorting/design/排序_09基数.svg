<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1120" height="620" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">O9 基数排序（LSD）· 从低位到高位，每轮用稳定的计数排序按该位排</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">digit(num,exp)=(num/exp)%10 取某一位；对定长键（这里 2 位十进制）逐位排序，每轮都必须稳定，否则前轮成果被打乱</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">本轮关键位</text>
  <rect x="160" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="178" y="82" font-size="10.5" fill="#3a3a3c">元素（键）</text>
  <rect x="290" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="308" y="82" font-size="10.5" fill="#3a3a3c">最终有序</text>

  <!-- Row A 初始 -->
  <text x="30" y="120" font-size="12.5" font-weight="700" fill="#20375e">第 1 轮 · 按个位（exp=1）做稳定计数排序</text>
  <text x="40" y="160" font-size="10.5" fill="#6e6e73">初始</text>
  <g font-size="15" text-anchor="middle">
    <rect x="110" y="140" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="140" y="165" fill="#8a5a12">5<tspan fill="#4a7fd0" font-weight="700">3</tspan></text>
    <rect x="182" y="140" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="212" y="165" fill="#8a5a12">8<tspan fill="#4a7fd0" font-weight="700">9</tspan></text>
    <rect x="254" y="140" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="284" y="165" fill="#8a5a12">1<tspan fill="#4a7fd0" font-weight="700">5</tspan></text>
    <rect x="326" y="140" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="356" y="165" fill="#8a5a12">5<tspan fill="#4a7fd0" font-weight="700">5</tspan></text>
    <rect x="398" y="140" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="428" y="165" fill="#8a5a12">2<tspan fill="#4a7fd0" font-weight="700">7</tspan></text>
    <rect x="470" y="140" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="500" y="165" fill="#8a5a12">4<tspan fill="#4a7fd0" font-weight="700">2</tspan></text>
  </g>
  <text x="545" y="163" font-size="10.5" fill="#6e6e73">关键=个位</text>

  <line x1="320" y1="184" x2="320" y2="208" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="350" y="200" font-size="10" fill="#20375e">按个位升序（稳定：15 在 55 前，保留原序）</text>

  <!-- Row B 个位排序后 -->
  <text x="40" y="240" font-size="10.5" fill="#6e6e73">个位序</text>
  <g font-size="15" text-anchor="middle">
    <rect x="110" y="220" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="140" y="245" fill="#8a5a12"><tspan fill="#4a7fd0" font-weight="700">4</tspan>2</text>
    <rect x="182" y="220" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="212" y="245" fill="#8a5a12"><tspan fill="#4a7fd0" font-weight="700">5</tspan>3</text>
    <rect x="254" y="220" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="284" y="245" fill="#8a5a12"><tspan fill="#4a7fd0" font-weight="700">1</tspan>5</text>
    <rect x="326" y="220" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="356" y="245" fill="#8a5a12"><tspan fill="#4a7fd0" font-weight="700">5</tspan>5</text>
    <rect x="398" y="220" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="428" y="245" fill="#8a5a12"><tspan fill="#4a7fd0" font-weight="700">2</tspan>7</text>
    <rect x="470" y="220" width="60" height="36" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="500" y="245" fill="#8a5a12"><tspan fill="#4a7fd0" font-weight="700">8</tspan>9</text>
  </g>
  <text x="545" y="243" font-size="10.5" fill="#6e6e73">关键=十位</text>

  <text x="30" y="292" font-size="12.5" font-weight="700" fill="#20375e">第 2 轮 · 按十位（exp=10）做稳定计数排序</text>
  <line x1="320" y1="300" x2="320" y2="324" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="350" y="316" font-size="10" fill="#20375e">按十位升序（稳定：53 在 55 前，个位序被保留）</text>

  <!-- Row C 最终 -->
  <text x="40" y="356" font-size="10.5" fill="#2f6b4e">十位序</text>
  <g font-size="15" text-anchor="middle">
    <rect x="110" y="336" width="60" height="36" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="140" y="361" fill="#2f6b4e">15</text>
    <rect x="182" y="336" width="60" height="36" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="212" y="361" fill="#2f6b4e">27</text>
    <rect x="254" y="336" width="60" height="36" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="284" y="361" fill="#2f6b4e">42</text>
    <rect x="326" y="336" width="60" height="36" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="356" y="361" fill="#2f6b4e">53</text>
    <rect x="398" y="336" width="60" height="36" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="428" y="361" fill="#2f6b4e">55</text>
    <rect x="470" y="336" width="60" height="36" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="500" y="361" fill="#2f6b4e">89</text>
  </g>
  <text x="545" y="359" font-size="10.5" fill="#2f6b4e">全局有序</text>

  <!-- 稳定性 callout -->
  <rect x="620" y="130" width="470" height="150" rx="12" fill="#f6f4fb" stroke="#ccbef0"/>
  <text x="640" y="156" font-size="12" font-weight="700" fill="#4b3a80">为什么每轮必须「稳定」</text>
  <text x="640" y="182" font-size="10.5" fill="#4a4a4f">高位排序时，若两数十位相同（53 与 55），稳定排序会</text>
  <text x="640" y="200" font-size="10.5" fill="#4a4a4f">保留它们在「上一轮（个位）」中的相对次序 —— 于是</text>
  <text x="640" y="218" font-size="10.5" fill="#4a4a4f">低位信息不被覆盖，逐位累积成完整的大小关系。</text>
  <text x="640" y="244" font-size="10.5" fill="#8a4038">若用不稳定排序，前几轮的排序成果会被后一轮打乱。</text>
  <text x="640" y="268" font-size="10" fill="#6e6e73">每轮的稳定子过程正是「计数排序」（见 O7）。</text>

  <!-- LSD vs MSD -->
  <rect x="620" y="296" width="470" height="120" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="640" y="322" font-size="12" font-weight="700" fill="#20375e">LSD（低位优先）的好处</text>
  <text x="640" y="348" font-size="10.5" fill="#4a4a4f">从最低位排到最高位，全程无需递归、无需分组，</text>
  <text x="640" y="366" font-size="10.5" fill="#4a4a4f">每轮对整个数组做一次稳定计数排序即可。</text>
  <text x="640" y="390" font-size="10" fill="#6e6e73">MSD（高位优先）需按高位分组后对各组递归，逻辑更复杂，</text>
  <text x="640" y="406" font-size="10" fill="#6e6e73">但可提前终止（变长键、字符串前缀区分时）。</text>

  <!-- 复杂度 -->
  <rect x="40" y="430" width="1050" height="160" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="60" y="456" font-size="12" font-weight="700" fill="#20375e">复杂度与约束</text>
  <text x="60" y="484" font-size="10.5" fill="#4a4a4f">时间 <tspan font-weight="700" fill="#2f6b4e">O(n·k)</tspan>（k=位数/轮数，每轮计数排序 O(n + 基数)，基数=10）· 空间 O(n + 基数) · <tspan font-weight="700" fill="#2f6b4e">稳定</tspan></text>
  <text x="60" y="510" font-size="10.5" fill="#4a4a4f">当键长 k 为常数、值又极大（如 32 位整数）时，基数排序可在近似 O(n) 完成 —— 计数排序无法直接处理的大值域，</text>
  <text x="60" y="530" font-size="10.5" fill="#4a4a4f">被「拆成 k 位、每位只 10 个桶」化解：把「一个大值域」换成「k 个小值域」，这是它相对计数排序的关键突破。</text>
  <text x="60" y="558" font-size="10.5" fill="#8a4038">约束：键需定长且可按位拆解（整数、定长字符串、日期等）；键长过大时 k 会主导，未必优于 O(n log n) 比较排序。</text>
  <text x="60" y="578" font-size="10" fill="#6e6e73">典型场景：大量定长整数 / 字符串主键排序、外部排序的桶划分。</text>
</svg>
