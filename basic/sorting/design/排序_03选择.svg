<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1120" height="620" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">O3 选择排序 · 每趟从未排区选出最小值，与未排区首元素交换</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">外循环 i 从 0 到 n-2；内循环在 [i, n-1] 记录最小值下标 k，一趟只做一次 nums[i] ↔ nums[k] 交换</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">扫描指针 j / 最小下标 k</text>
  <rect x="240" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="258" y="82" font-size="10.5" fill="#3a3a3c">已排定前缀</text>
  <rect x="360" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="378" y="82" font-size="10.5" fill="#3a3a3c">交换的两端</text>
  <rect x="490" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="508" y="82" font-size="10.5" fill="#3a3a3c">未排区元素</text>

  <!-- ① 一趟动作 -->
  <text x="30" y="116" font-size="12.5" font-weight="700" fill="#20375e">① 一趟动作（示例 i=2）：扫描未排区找最小值 5（下标 k=3），与未排区首元素 nums[2]=9 交换</text>

  <text x="40" y="168" font-size="11" fill="#6e6e73">扫描</text>
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="152" width="52" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="126" y="174" fill="#2f6b4e">1</text>
    <rect x="158" y="152" width="52" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="184" y="174" fill="#2f6b4e">2</text>
    <rect x="216" y="152" width="52" height="34" rx="6" fill="#fbe6e3" stroke="#e8a79f" stroke-width="1.5"/><text x="242" y="174" fill="#8a4038">9</text>
    <rect x="274" y="152" width="52" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="300" y="174" fill="#8a5a12">5</text>
    <rect x="332" y="152" width="52" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="358" y="174" fill="#8a5a12">6</text>
  </g>
  <text x="242" y="146" font-size="9.5" fill="#20375e" text-anchor="middle">i=2 首</text>
  <line x1="274" y1="200" x2="384" y2="200" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  <text x="330" y="214" font-size="9.5" fill="#20375e" text-anchor="middle">j 扫 [i+1, n-1]</text>
  <text x="300" y="146" font-size="9.5" fill="#2f6b4e" text-anchor="middle">↓ 最小 k=3</text>
  <!-- swap 弧 -->
  <path d="M242 190 L242 232 L300 232 L300 190" fill="none" stroke="#d1544a" stroke-width="1.8" marker-end="url(#aR)"/>
  <text x="271" y="248" font-size="10" fill="#8a4038" text-anchor="middle">交换 nums[2] ↔ nums[3]</text>

  <text x="40" y="298" font-size="11" fill="#6e6e73">交换后</text>
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="282" width="52" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="126" y="304" fill="#2f6b4e">1</text>
    <rect x="158" y="282" width="52" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="184" y="304" fill="#2f6b4e">2</text>
    <rect x="216" y="282" width="52" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="242" y="304" fill="#2f6b4e">5</text>
    <rect x="274" y="282" width="52" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="300" y="304" fill="#8a5a12">9</text>
    <rect x="332" y="282" width="52" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="358" y="304" fill="#8a5a12">6</text>
  </g>
  <text x="100" y="336" font-size="10.5" fill="#2f6b4e">5 归位，有序前缀 [1,2,5]</text>

  <!-- 不稳定反例 -->
  <rect x="470" y="128" width="290" height="190" rx="12" fill="#fdecea" stroke="#e8a79f"/>
  <text x="490" y="154" font-size="12" font-weight="700" fill="#8a4038">为何「不稳定」</text>
  <text x="490" y="176" font-size="10.5" fill="#4a4a4f">远距离交换会跨过相等元素。示例 [5ₐ, 5_b, 2]：</text>
  <g font-size="12" text-anchor="middle">
    <rect x="490" y="188" width="46" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="513" y="207" fill="#8a5a12">5ₐ</text>
    <rect x="540" y="188" width="46" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="563" y="207" fill="#8a5a12">5_b</text>
    <rect x="590" y="188" width="46" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="613" y="207" fill="#8a5a12">2</text>
  </g>
  <path d="M513 218 L513 234 L613 234 L613 218" fill="none" stroke="#d1544a" stroke-width="1.6" marker-end="url(#aR)"/>
  <text x="563" y="250" font-size="9.5" fill="#8a4038" text-anchor="middle">i=0：min=2 与 5ₐ 交换</text>
  <g font-size="12" text-anchor="middle">
    <rect x="490" y="258" width="46" height="28" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="513" y="277" fill="#2f6b4e">2</text>
    <rect x="540" y="258" width="46" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="563" y="277" fill="#8a5a12">5_b</text>
    <rect x="590" y="258" width="46" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="613" y="277" fill="#8a5a12">5ₐ</text>
  </g>
  <text x="490" y="306" font-size="10" fill="#8a4038">5ₐ 与 5_b 相对次序被打乱 → 不稳定</text>

  <!-- 说明栏 -->
  <rect x="780" y="128" width="310" height="190" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="800" y="154" font-size="12" font-weight="700" fill="#20375e">与冒泡的关键差异</text>
  <text x="800" y="180" font-size="10.5" fill="#4a4a4f">比较次数一样是 ~n²/2，但交换次数</text>
  <text x="800" y="198" font-size="10.5" fill="#4a4a4f">从 O(n²) 降到 <tspan font-weight="700" fill="#2f6b4e">至多 n-1 次</tspan>。</text>
  <text x="800" y="224" font-size="10.5" fill="#4a4a4f">当「写/交换」代价远高于「读/比较」</text>
  <text x="800" y="242" font-size="10.5" fill="#4a4a4f">时（如大对象移动），选择排序占优。</text>
  <text x="800" y="272" font-size="10.5" fill="#4a4a4f">代价：无论是否已有序，都要完整扫</text>
  <text x="800" y="290" font-size="10.5" fill="#4a4a4f">描未排区 → 无「最好情形」，恒 O(n²)。</text>

  <!-- ② 每趟快照 -->
  <text x="30" y="356" font-size="12.5" font-weight="700" fill="#20375e">② 每趟快照：每趟把当前最小值放到未排区最前，绿色有序前缀从左增长</text>
  <g font-size="12.5" text-anchor="middle">
    <text x="90" y="396" font-size="10.5" fill="#6e6e73" text-anchor="start">初始</text>
    <rect x="150" y="380" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="175" y="401" fill="#8a5a12">5</text>
    <rect x="206" y="380" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="231" y="401" fill="#8a5a12">2</text>
    <rect x="262" y="380" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="287" y="401" fill="#8a5a12">9</text>
    <rect x="318" y="380" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="343" y="401" fill="#8a5a12">1</text>
    <rect x="374" y="380" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="399" y="401" fill="#8a5a12">6</text>

    <text x="90" y="436" font-size="10.5" fill="#6e6e73" text-anchor="start">i=0</text>
    <rect x="150" y="420" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="175" y="441" fill="#2f6b4e">1</text>
    <rect x="206" y="420" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="231" y="441" fill="#8a5a12">2</text>
    <rect x="262" y="420" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="287" y="441" fill="#8a5a12">9</text>
    <rect x="318" y="420" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="343" y="441" fill="#8a5a12">5</text>
    <rect x="374" y="420" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="399" y="441" fill="#8a5a12">6</text>

    <text x="90" y="476" font-size="10.5" fill="#6e6e73" text-anchor="start">i=1</text>
    <rect x="150" y="460" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="175" y="481" fill="#2f6b4e">1</text>
    <rect x="206" y="460" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="231" y="481" fill="#2f6b4e">2</text>
    <rect x="262" y="460" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="287" y="481" fill="#8a5a12">9</text>
    <rect x="318" y="460" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="343" y="481" fill="#8a5a12">5</text>
    <rect x="374" y="460" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="399" y="481" fill="#8a5a12">6</text>

    <text x="90" y="516" font-size="10.5" fill="#6e6e73" text-anchor="start">i=2</text>
    <rect x="150" y="500" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="175" y="521" fill="#2f6b4e">1</text>
    <rect x="206" y="500" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="231" y="521" fill="#2f6b4e">2</text>
    <rect x="262" y="500" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="287" y="521" fill="#2f6b4e">5</text>
    <rect x="318" y="500" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="343" y="521" fill="#8a5a12">9</text>
    <rect x="374" y="500" width="50" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="399" y="521" fill="#8a5a12">6</text>

    <text x="90" y="556" font-size="10.5" fill="#6e6e73" text-anchor="start">i=3</text>
    <rect x="150" y="540" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="175" y="561" fill="#2f6b4e">1</text>
    <rect x="206" y="540" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="231" y="561" fill="#2f6b4e">2</text>
    <rect x="262" y="540" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="287" y="561" fill="#2f6b4e">5</text>
    <rect x="318" y="540" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="343" y="561" fill="#2f6b4e">6</text>
    <rect x="374" y="540" width="50" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="399" y="561" fill="#2f6b4e">9</text>
  </g>
  <text x="450" y="441" font-size="10.5" fill="#4a4a4f">min=1 与首位交换</text>
  <text x="450" y="481" font-size="10.5" fill="#4a4a4f">min=2 已在位（自交换）</text>
  <text x="450" y="521" font-size="10.5" fill="#4a4a4f">min=5 与 9 交换</text>
  <text x="450" y="561" font-size="10.5" fill="#4a4a4f">min=6 归位，末位 9 自然有序</text>

  <!-- 底部性质 -->
  <rect x="680" y="372" width="410" height="198" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="700" y="398" font-size="12" font-weight="700" fill="#20375e">复杂度与性质</text>
  <text x="700" y="426" font-size="10.5" fill="#4a4a4f">平均 / 最坏 / 最好　<tspan font-weight="700" fill="#8a4038">O(n²)</tspan>（恒定，无捷径）</text>
  <text x="700" y="450" font-size="10.5" fill="#4a4a4f">交换次数　　　　　<tspan font-weight="700" fill="#2f6b4e">≤ n-1 次（最少）</tspan></text>
  <text x="700" y="474" font-size="10.5" fill="#4a4a4f">空间　　　　　　　<tspan font-weight="700" fill="#20375e">O(1) · 原地</tspan></text>
  <text x="700" y="498" font-size="10.5" fill="#4a4a4f">稳定性　　　　　　<tspan font-weight="700" fill="#8a4038">不稳定</tspan>（远距离交换跨越相等元素）</text>
  <text x="700" y="530" font-size="10" fill="#6e6e73">选它的唯一理由：交换/写入成本极高的场景，用最少</text>
  <text x="700" y="548" font-size="10" fill="#6e6e73">的搬动次数完成排序；否则通常不如插入排序。</text>
</svg>
