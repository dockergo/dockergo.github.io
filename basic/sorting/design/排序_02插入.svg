<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1120" height="640" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">O2 插入排序 · 维护前缀有序区，取下一个元素向前找位、后移插入</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">外循环 i 从 1 到 n-1，已排序区为 [0, i-1]；base=nums[i]，内循环把比 base 大的元素逐个右移，直到空位处放入 base</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">base = 待插入元素</text>
  <rect x="200" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="218" y="82" font-size="10.5" fill="#3a3a3c">前缀有序区</text>
  <rect x="330" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="348" y="82" font-size="10.5" fill="#3a3a3c">比 base 大 → 右移一位</text>
  <rect x="510" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="528" y="82" font-size="10.5" fill="#3a3a3c">未处理元素</text>

  <!-- ① 核心动作 -->
  <text x="30" y="116" font-size="12.5" font-weight="700" fill="#20375e">① 核心动作（示例 i=4，base=1）：前缀 [2,4,5,6] 全比 1 大 → 逐个右移，空出最前端，插入 1</text>

  <!-- base 提出 -->
  <rect x="100" y="132" width="50" height="34" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.5"/><text x="125" y="154" font-size="13" fill="#20375e" text-anchor="middle">1</text>
  <text x="160" y="154" font-size="10.5" fill="#20375e">base ← nums[4]（先暂存，腾出该格）</text>

  <!-- before 行 -->
  <text x="40" y="212" font-size="11" fill="#6e6e73">移动前</text>
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="196" width="50" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="125" y="218" fill="#2f6b4e">2</text>
    <rect x="156" y="196" width="50" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="181" y="218" fill="#2f6b4e">4</text>
    <rect x="212" y="196" width="50" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="237" y="218" fill="#2f6b4e">5</text>
    <rect x="268" y="196" width="50" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="293" y="218" fill="#2f6b4e">6</text>
    <rect x="324" y="196" width="50" height="34" rx="6" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="349" y="218" fill="#a1a1a6">□</text>
  </g>
  <!-- 右移箭头 -->
  <path d="M125 240 L125 256 L181 256 L181 240" fill="none" stroke="#d1544a" stroke-width="1.6" marker-end="url(#aR)"/>
  <path d="M181 264 L181 278 L237 278 L237 264" fill="none" stroke="#d1544a" stroke-width="1.6" marker-end="url(#aR)"/>
  <path d="M237 240 L237 250 L293 250 L293 240" fill="none" stroke="#d1544a" stroke-width="1.6" marker-end="url(#aR)"/>
  <path d="M293 264 L293 272 L349 272 L349 264" fill="none" stroke="#d1544a" stroke-width="1.6" marker-end="url(#aR)"/>
  <text x="420" y="255" font-size="10.5" fill="#8a4038">2,4,5,6 均 &gt; 1，各右移一位</text>

  <!-- after 行 -->
  <text x="40" y="318" font-size="11" fill="#6e6e73">插入后</text>
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="302" width="50" height="34" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.5"/><text x="125" y="324" fill="#20375e">1</text>
    <rect x="156" y="302" width="50" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="181" y="324" fill="#2f6b4e">2</text>
    <rect x="212" y="302" width="50" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="237" y="324" fill="#2f6b4e">4</text>
    <rect x="268" y="302" width="50" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="293" y="324" fill="#2f6b4e">5</text>
    <rect x="324" y="302" width="50" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0"/><text x="349" y="324" fill="#2f6b4e">6</text>
  </g>
  <text x="420" y="323" font-size="10.5" fill="#2f6b4e">base 落入空出的最前端，前缀重新有序</text>

  <!-- 侧栏说明 -->
  <rect x="620" y="128" width="470" height="210" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="640" y="154" font-size="12" font-weight="700" fill="#20375e">为什么是「移位」而非「交换」</text>
  <text x="640" y="180" font-size="10.5" fill="#4a4a4f">冒泡靠反复交换（每次 3 次赋值）把元素挪位；插入把 base</text>
  <text x="640" y="198" font-size="10.5" fill="#4a4a4f">暂存一份，其余元素整体后移（每次 1 次赋值），最后落位。</text>
  <text x="640" y="222" font-size="10.5" fill="#2f6b4e">→ 常数更小，写操作更少。</text>
  <text x="640" y="254" font-size="12" font-weight="700" fill="#20375e">对「近乎有序」数据极快</text>
  <text x="640" y="280" font-size="10.5" fill="#4a4a4f">若前缀末尾已 ≤ base，内循环一次都不进（nums[j] ≤ base</text>
  <text x="640" y="298" font-size="10.5" fill="#4a4a4f">立即停）。完全有序时每趟 O(1)，整体退化为 O(n)。</text>
  <text x="640" y="322" font-size="10" fill="#8a8a8f">故小规模 / 近序数据常用插入排序，也是快排递归底部的收尾。</text>

  <!-- ② 每趟快照 -->
  <text x="30" y="384" font-size="12.5" font-weight="700" fill="#20375e">② 每趟快照：绿色前缀有序区从左侧逐格扩张，每趟把一个新元素纳入其中</text>
  <g font-size="12.5" text-anchor="middle">
    <text x="90" y="424" font-size="10.5" fill="#6e6e73" text-anchor="start">初始</text>
    <rect x="150" y="408" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="174" y="429" fill="#8a5a12">5</text>
    <rect x="204" y="408" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="228" y="429" fill="#8a5a12">2</text>
    <rect x="258" y="408" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="282" y="429" fill="#8a5a12">4</text>
    <rect x="312" y="408" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="336" y="429" fill="#8a5a12">6</text>
    <rect x="366" y="408" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="390" y="429" fill="#8a5a12">1</text>

    <text x="90" y="464" font-size="10.5" fill="#6e6e73" text-anchor="start">i=1</text>
    <rect x="150" y="448" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="174" y="469" fill="#2f6b4e">2</text>
    <rect x="204" y="448" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="228" y="469" fill="#2f6b4e">5</text>
    <rect x="258" y="448" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="282" y="469" fill="#8a5a12">4</text>
    <rect x="312" y="448" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="336" y="469" fill="#8a5a12">6</text>
    <rect x="366" y="448" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="390" y="469" fill="#8a5a12">1</text>

    <text x="90" y="504" font-size="10.5" fill="#6e6e73" text-anchor="start">i=2</text>
    <rect x="150" y="488" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="174" y="509" fill="#2f6b4e">2</text>
    <rect x="204" y="488" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="228" y="509" fill="#2f6b4e">4</text>
    <rect x="258" y="488" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="282" y="509" fill="#2f6b4e">5</text>
    <rect x="312" y="488" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="336" y="509" fill="#8a5a12">6</text>
    <rect x="366" y="488" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="390" y="509" fill="#8a5a12">1</text>

    <text x="90" y="544" font-size="10.5" fill="#6e6e73" text-anchor="start">i=3</text>
    <rect x="150" y="528" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="174" y="549" fill="#2f6b4e">2</text>
    <rect x="204" y="528" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="228" y="549" fill="#2f6b4e">4</text>
    <rect x="258" y="528" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="282" y="549" fill="#2f6b4e">5</text>
    <rect x="312" y="528" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="336" y="549" fill="#2f6b4e">6</text>
    <rect x="366" y="528" width="48" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="390" y="549" fill="#8a5a12">1</text>

    <text x="90" y="584" font-size="10.5" fill="#6e6e73" text-anchor="start">i=4</text>
    <rect x="150" y="568" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="174" y="589" fill="#2f6b4e">1</text>
    <rect x="204" y="568" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="228" y="589" fill="#2f6b4e">2</text>
    <rect x="258" y="568" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="282" y="589" fill="#2f6b4e">4</text>
    <rect x="312" y="568" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="336" y="589" fill="#2f6b4e">5</text>
    <rect x="366" y="568" width="48" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="390" y="589" fill="#2f6b4e">6</text>
  </g>
  <text x="440" y="469" font-size="10.5" fill="#4a4a4f">base=2 越过 5，插到最前</text>
  <text x="440" y="509" font-size="10.5" fill="#4a4a4f">base=4 插到 5 前</text>
  <text x="440" y="549" font-size="10.5" fill="#4a4a4f">base=6 已在位，内循环 0 次移动</text>
  <text x="440" y="589" font-size="10.5" fill="#4a4a4f">base=1 一路移到最前（最坏情形）</text>

  <!-- 底部性质 -->
  <rect x="700" y="408" width="390" height="190" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="720" y="434" font-size="12" font-weight="700" fill="#20375e">复杂度与性质</text>
  <text x="720" y="462" font-size="10.5" fill="#4a4a4f">平均 / 最坏（逆序）　<tspan font-weight="700" fill="#8a4038">O(n²)</tspan></text>
  <text x="720" y="486" font-size="10.5" fill="#4a4a4f">最好（近乎有序）　　<tspan font-weight="700" fill="#2f6b4e">O(n)</tspan></text>
  <text x="720" y="510" font-size="10.5" fill="#4a4a4f">空间　　　　　　　　<tspan font-weight="700" fill="#20375e">O(1) · 原地</tspan></text>
  <text x="720" y="534" font-size="10.5" fill="#4a4a4f">稳定性　　　　　　　<tspan font-weight="700" fill="#2f6b4e">稳定</tspan>（相等不越位）</text>
  <text x="720" y="566" font-size="10" fill="#6e6e73">工程价值高：小数组直接用它；作为快排/归并</text>
  <text x="720" y="584" font-size="10" fill="#6e6e73">在小区间的收尾（如 introsort 阈值切换）。</text>
</svg>
