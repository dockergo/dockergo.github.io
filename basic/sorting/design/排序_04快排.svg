<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">O4 快速排序 · 以基准划分（左小右大），再递归左右子数组</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">partition：取 nums[left] 为基准，i、j 从两端相向扫描 —— j 找 &lt;基准、i 找 &gt;基准并交换，相遇后把基准换到分界点</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">指针 i / j</text>
  <rect x="140" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="158" y="82" font-size="10.5" fill="#3a3a3c">待交换 / 逆序对</text>
  <rect x="290" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="308" y="82" font-size="10.5" fill="#3a3a3c">基准已归位</text>
  <rect x="410" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="428" y="82" font-size="10.5" fill="#3a3a3c">数组元素（基准=蓝框）</text>

  <!-- ① 一次 partition -->
  <text x="30" y="116" font-size="12.5" font-weight="700" fill="#20375e">① 一次哨兵划分（基准 = nums[left] = 3）</text>

  <!-- Row A -->
  <text x="40" y="156" font-size="10.5" fill="#6e6e73">扫描①</text>
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="140" width="54" height="34" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="2"/><text x="127" y="162" fill="#20375e">3</text>
    <rect x="160" y="140" width="54" height="34" rx="6" fill="#fbe6e3" stroke="#e8a79f" stroke-width="1.5"/><text x="187" y="162" fill="#8a4038">5</text>
    <rect x="220" y="140" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="247" y="162" fill="#8a5a12">1</text>
    <rect x="280" y="140" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="307" y="162" fill="#8a5a12">6</text>
    <rect x="340" y="140" width="54" height="34" rx="6" fill="#fbe6e3" stroke="#e8a79f" stroke-width="1.5"/><text x="367" y="162" fill="#8a4038">2</text>
    <rect x="400" y="140" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="427" y="162" fill="#8a5a12">4</text>
  </g>
  <text x="127" y="132" font-size="9" fill="#20375e" text-anchor="middle">基准</text>
  <text x="187" y="192" font-size="9.5" fill="#20375e" text-anchor="middle">i↑ 遇 5&gt;3</text>
  <text x="367" y="192" font-size="9.5" fill="#20375e" text-anchor="middle">j↓ 遇 2&lt;3</text>
  <path d="M187 178 L187 200 L367 200 L367 178" fill="none" stroke="#d1544a" stroke-width="1.6" marker-end="url(#aR)"/>
  <text x="480" y="162" font-size="10.5" fill="#8a4038">交换 5 ↔ 2</text>

  <!-- Row B -->
  <text x="40" y="248" font-size="10.5" fill="#6e6e73">扫描②</text>
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="232" width="54" height="34" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="2"/><text x="127" y="254" fill="#20375e">3</text>
    <rect x="160" y="232" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="187" y="254" fill="#8a5a12">2</text>
    <rect x="220" y="232" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="247" y="254" fill="#8a5a12">1</text>
    <rect x="280" y="232" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="307" y="254" fill="#8a5a12">6</text>
    <rect x="340" y="232" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="367" y="254" fill="#8a5a12">5</text>
    <rect x="400" y="232" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="427" y="254" fill="#8a5a12">4</text>
  </g>
  <text x="247" y="284" font-size="9.5" fill="#20375e" text-anchor="middle">i 与 j 在此相遇（idx=2，值 1）</text>
  <line x1="247" y1="270" x2="247" y2="290" stroke="#4a7fd0" stroke-width="1.5" marker-end="url(#aB)"/>
  <text x="480" y="254" font-size="10.5" fill="#20375e">相遇 → 把基准换到相遇点</text>

  <!-- Row C -->
  <text x="40" y="340" font-size="10.5" fill="#6e6e73">划分毕</text>
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="324" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="127" y="346" fill="#8a5a12">1</text>
    <rect x="160" y="324" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="187" y="346" fill="#8a5a12">2</text>
    <rect x="220" y="324" width="54" height="34" rx="6" fill="#e5f3ec" stroke="#a9d8c0" stroke-width="1.5"/><text x="247" y="346" fill="#2f6b4e">3</text>
    <rect x="280" y="324" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="307" y="346" fill="#8a5a12">6</text>
    <rect x="340" y="324" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="367" y="346" fill="#8a5a12">5</text>
    <rect x="400" y="324" width="54" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="427" y="346" fill="#8a5a12">4</text>
  </g>
  <path d="M100 366 L214 366" stroke="#4a7fd0" stroke-width="1.4"/><text x="157" y="380" font-size="9.5" fill="#20375e" text-anchor="middle">左子数组 &lt; 3</text>
  <path d="M280 366 L454 366" stroke="#4a7fd0" stroke-width="1.4"/><text x="367" y="380" font-size="9.5" fill="#20375e" text-anchor="middle">右子数组 &gt; 3</text>
  <text x="247" y="380" font-size="9.5" fill="#2f6b4e" text-anchor="middle">基准归位</text>

  <!-- 不变式说明 -->
  <rect x="540" y="128" width="550" height="232" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="560" y="154" font-size="12" font-weight="700" fill="#20375e">划分的核心不变式</text>
  <text x="560" y="180" font-size="10.5" fill="#4a4a4f">• j 先动：从右往左跳过所有 ≥ 基准的元素，找到首个 &lt; 基准。</text>
  <text x="560" y="200" font-size="10.5" fill="#4a4a4f">• i 后动：从左往右跳过所有 ≤ 基准的元素，找到首个 &gt; 基准。</text>
  <text x="560" y="220" font-size="10.5" fill="#4a4a4f">• 交换二者，使「左侧 ≤ 基准、右侧 ≥ 基准」的边界持续内推。</text>
  <text x="560" y="240" font-size="10.5" fill="#4a4a4f">• i、j 相遇即停；相遇点左侧都 &lt; 基准，把基准与其交换即归位。</text>
  <text x="560" y="268" font-size="11" font-weight="700" fill="#2f6b4e">一次划分后：基准落到最终位置，且此后永不移动。</text>
  <text x="560" y="292" font-size="10" fill="#6e6e73">与归并相反 —— 快排「先分好再无需合并」，划分即是全部工作，</text>
  <text x="560" y="310" font-size="10" fill="#6e6e73">故原地、无额外数组；但划分不均匀时会退化。</text>
  <text x="560" y="338" font-size="10" fill="#8a8a8f">为什么 j 先动：保证相遇点的值 ≤ 基准，换到 left 后左半都不大于它。</text>

  <!-- ② 递归树 -->
  <text x="30" y="404" font-size="12.5" font-weight="700" fill="#20375e">② 分治递归：对左右子数组重复 partition，直到子数组长度 ≤ 1</text>

  <rect x="440" y="418" width="240" height="34" rx="7" fill="#f2f7ff" stroke="#c6d9f2"/><text x="560" y="440" font-size="12" fill="#20375e" text-anchor="middle">[3, 5, 1, 6, 2, 4]</text>
  <!-- 分叉到三部分 -->
  <line x1="560" y1="452" x2="560" y2="466" stroke="#4a7fd0" stroke-width="1.4"/>
  <line x1="300" y1="466" x2="820" y2="466" stroke="#4a7fd0" stroke-width="1.4"/>
  <line x1="300" y1="466" x2="300" y2="482" stroke="#4a7fd0" stroke-width="1.4" marker-end="url(#aB)"/>
  <line x1="560" y1="466" x2="560" y2="482" stroke="#2f9e6e" stroke-width="1.4" marker-end="url(#aG)"/>
  <line x1="820" y1="466" x2="820" y2="482" stroke="#4a7fd0" stroke-width="1.4" marker-end="url(#aB)"/>

  <rect x="230" y="484" width="140" height="34" rx="7" fill="#f2f7ff" stroke="#c6d9f2"/><text x="300" y="506" font-size="12" fill="#20375e" text-anchor="middle">[1, 2]　&lt; 3</text>
  <rect x="518" y="484" width="84" height="34" rx="7" fill="#e5f3ec" stroke="#a9d8c0"/><text x="560" y="506" font-size="12" font-weight="700" fill="#2f6b4e" text-anchor="middle">3 归位</text>
  <rect x="710" y="484" width="180" height="34" rx="7" fill="#f2f7ff" stroke="#c6d9f2"/><text x="800" y="506" font-size="12" fill="#20375e" text-anchor="middle">[6, 5, 4]　&gt; 3</text>

  <!-- 二级 -->
  <line x1="300" y1="518" x2="300" y2="534" stroke="#4a7fd0" stroke-width="1.4" marker-end="url(#aB)"/>
  <rect x="220" y="536" width="160" height="30" rx="7" fill="#eef7f2" stroke="#a9d8c0"/><text x="300" y="556" font-size="11" fill="#2f6b4e" text-anchor="middle">1 归位 → [2]</text>
  <line x1="800" y1="518" x2="800" y2="534" stroke="#4a7fd0" stroke-width="1.4" marker-end="url(#aB)"/>
  <rect x="700" y="536" width="200" height="30" rx="7" fill="#eef7f2" stroke="#a9d8c0"/><text x="800" y="556" font-size="11" fill="#2f6b4e" text-anchor="middle">6 归位 → [4,5] 再划分</text>

  <!-- 最终 -->
  <text x="40" y="556" font-size="10.5" fill="#6e6e73">合并无需</text>
  <text x="40" y="572" font-size="10.5" fill="#6e6e73">额外操作</text>

  <!-- ③ 复杂度 -->
  <text x="30" y="600" font-size="12.5" font-weight="700" fill="#20375e">③ 复杂度与退化</text>
  <rect x="30" y="612" width="350" height="96" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="50" y="638" font-size="11" font-weight="700" fill="#2f6b4e">平均 O(n log n) · 原地 · 不稳定</text>
  <text x="50" y="660" font-size="10" fill="#4a4a4f">每次划分约把数组均分为二，递归深度 log n，</text>
  <text x="50" y="678" font-size="10" fill="#4a4a4f">每层总扫描 O(n)。实践常数极小，最常用。</text>
  <text x="50" y="698" font-size="9.5" fill="#8a8a8f">不稳定：划分中的远距离交换会跨越相等元素。</text>

  <rect x="396" y="612" width="350" height="96" rx="12" fill="#fdecea" stroke="#e8a79f"/>
  <text x="416" y="638" font-size="11" font-weight="700" fill="#8a4038">最坏 O(n²)：划分极度不均</text>
  <text x="416" y="660" font-size="10" fill="#4a4a4f">若基准恒为最大/最小（如对已有序数组取</text>
  <text x="416" y="678" font-size="10" fill="#4a4a4f">首元素），每次只剥离 1 个，退化为 O(n²)。</text>
  <text x="416" y="698" font-size="9.5" fill="#8a4038">最坏时递归深度达 n，栈可能溢出。</text>

  <rect x="762" y="612" width="328" height="96" rx="12" fill="#f2f7ff" stroke="#c6d9f2"/>
  <text x="782" y="638" font-size="11" font-weight="700" fill="#20375e">工程优化</text>
  <text x="782" y="660" font-size="10" fill="#4a4a4f">• 三数取中选基准，避开有序退化。</text>
  <text x="782" y="678" font-size="10" fill="#4a4a4f">• 尾递归 / 先递归较短侧，栈深压到 O(log n)。</text>
  <text x="782" y="696" font-size="10" fill="#4a4a4f">• 小区间切插入排序（introsort 阈值）。</text>
</svg>
