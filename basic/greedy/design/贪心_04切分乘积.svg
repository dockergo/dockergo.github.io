<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="700" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">GD4 · 切分乘积：正整数 n 拆成若干正整数使乘积最大 —— 尽量都拆成 3</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">因子 3 的「单位效率」最高；除不尽时按余数微调：余 2 保留一个 2，余 1 则退掉一个 3、与这个 1 合成 2×2</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">因子 3（首选）</text>
  <rect x="170" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="188" y="82" font-size="10.5" fill="#3a3a3c">因子 2（补位）</text>
  <rect x="300" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="318" y="82" font-size="10.5" fill="#3a3a3c">最大乘积结果</text>

  <!-- ===== ① 策略分支 ===== -->
  <text x="30" y="118" font-size="12" font-weight="700" fill="#8a5a12">① 策略：a = n/3（3 的个数），b = n%3（余数），按 b 分三种情形</text>

  <rect x="40" y="132" width="200" height="56" rx="10" fill="#fdf3e0" stroke="#e7c07a" filter="url(#soft)"/>
  <text x="140" y="156" font-size="13" font-weight="700" fill="#8a5a12" text-anchor="middle">n（n &gt; 3）</text>
  <text x="140" y="176" font-size="10.5" fill="#5a4a2a" text-anchor="middle">a = n/3, b = n%3</text>

  <line x1="240" y1="160" x2="300" y2="160" stroke="#d99a2b" stroke-width="2" marker-end="url(#aA)"/>

  <rect x="300" y="126" width="250" height="68" rx="10" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.3"/>
  <text x="425" y="148" font-size="12" font-weight="700" fill="#1f6b47" text-anchor="middle">b = 0</text>
  <text x="425" y="168" font-size="10.5" fill="#2a5a43" text-anchor="middle">整除，全是 3</text>
  <text x="425" y="185" font-size="11" fill="#1f6b47" text-anchor="middle">乘积 = 3ᵃ</text>

  <rect x="562" y="126" width="250" height="68" rx="10" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/>
  <text x="687" y="148" font-size="12" font-weight="700" fill="#20375e" text-anchor="middle">b = 2</text>
  <text x="687" y="168" font-size="10.5" fill="#3a4a63" text-anchor="middle">留一个 2 即可</text>
  <text x="687" y="185" font-size="11" fill="#20375e" text-anchor="middle">乘积 = 3ᵃ × 2</text>

  <rect x="824" y="126" width="256" height="68" rx="10" fill="#fdf3e0" stroke="#d99a2b" stroke-width="1.4"/>
  <text x="952" y="148" font-size="12" font-weight="700" fill="#8a5a12" text-anchor="middle">b = 1（关键）</text>
  <text x="952" y="168" font-size="10.5" fill="#5a4a2a" text-anchor="middle">退一个 3，与 1 合成 2×2</text>
  <text x="952" y="185" font-size="11" fill="#8a5a12" text-anchor="middle">乘积 = 3ᵃ⁻¹ × 2 × 2</text>

  <text x="30" y="216" font-size="10.5" fill="#8a4038">注：n ≤ 3 时无法真正拆分获益，必须切出一个 1，直接返回 1 × (n−1)。</text>

  <!-- ===== ② 三例对照 ===== -->
  <text x="30" y="252" font-size="12" font-weight="700" fill="#8a5a12">② 三例对照（方块 = 一个因子，块内数字为其值）</text>

  <!-- 例1 n=9 b=0 -->
  <text x="40" y="278" font-size="11" font-weight="700" fill="#1f6b47">n = 9　a=3 b=0</text>
  <g text-anchor="middle" font-size="13" font-weight="700">
    <rect x="40" y="288" width="52" height="40" rx="8" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="66" y="314" fill="#1f6b47">3</text>
    <rect x="100" y="288" width="52" height="40" rx="8" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="126" y="314" fill="#1f6b47">3</text>
    <rect x="160" y="288" width="52" height="40" rx="8" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="186" y="314" fill="#1f6b47">3</text>
  </g>
  <text x="126" y="348" font-size="11" fill="#1f6b47" text-anchor="middle">乘积 = 27</text>

  <!-- 例2 n=8 b=2 -->
  <text x="300" y="278" font-size="11" font-weight="700" fill="#20375e">n = 8　a=2 b=2</text>
  <g text-anchor="middle" font-size="13" font-weight="700">
    <rect x="300" y="288" width="52" height="40" rx="8" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="326" y="314" fill="#1f6b47">3</text>
    <rect x="360" y="288" width="52" height="40" rx="8" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="386" y="314" fill="#1f6b47">3</text>
    <rect x="420" y="288" width="52" height="40" rx="8" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="446" y="314" fill="#20375e">2</text>
  </g>
  <text x="386" y="348" font-size="11" fill="#20375e" text-anchor="middle">乘积 = 3×3×2 = 18</text>

  <!-- 例3 n=10 b=1 -->
  <text x="560" y="278" font-size="11" font-weight="700" fill="#8a5a12">n = 10　a=3 b=1（退 3 换 2×2）</text>
  <g text-anchor="middle" font-size="13" font-weight="700">
    <rect x="560" y="288" width="52" height="40" rx="8" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="586" y="314" fill="#1f6b47">3</text>
    <rect x="620" y="288" width="52" height="40" rx="8" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="646" y="314" fill="#1f6b47">3</text>
    <rect x="680" y="288" width="52" height="40" rx="8" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="706" y="314" fill="#20375e">2</text>
    <rect x="740" y="288" width="52" height="40" rx="8" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="766" y="314" fill="#20375e">2</text>
  </g>
  <text x="676" y="348" font-size="11" fill="#8a5a12" text-anchor="middle">乘积 = 3×3×2×2 = 36</text>

  <!-- 反例对照 3+3+3+1 -->
  <rect x="820" y="272" width="260" height="80" rx="10" fill="#fff6f5" stroke="#e8a79f"/>
  <text x="950" y="294" font-size="10.5" font-weight="700" fill="#8a4038" text-anchor="middle">若 n=10 硬拆 3+3+3+1</text>
  <text x="950" y="314" font-size="10.5" fill="#8a4038" text-anchor="middle">乘积 = 3×3×3×1 = 27 ✗</text>
  <text x="950" y="336" font-size="10" fill="#8a4038" text-anchor="middle">留 1 是纯浪费 → 必须消掉它</text>

  <!-- ===== ③ 为何 3 最优 ===== -->
  <text x="30" y="392" font-size="12" font-weight="700" fill="#1f6b47">③ 为何首选 3：把「和固定、求积最大」化为「哪个因子单位效率最高」的问题</text>

  <rect x="40" y="406" width="510" height="180" rx="14" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.3" filter="url(#soft)"/>
  <text x="62" y="432" font-size="12.5" font-weight="700" fill="#1f6b47">连续最优在 e ≈ 2.718，整数取 3</text>
  <text x="62" y="456" font-size="10.5" fill="#4a4a4f">若把 n 均分成若干个 x，乘积 = x^(n/x)，</text>
  <text x="62" y="475" font-size="10.5" fill="#4a4a4f">最大化 x^(1/x) 的连续极值点在 x = e ≈ 2.718。</text>
  <text x="62" y="499" font-size="10.5" fill="#4a4a4f">最接近的整数是 3（比 2 更靠近 e），故因子首选 3。</text>
  <rect x="62" y="512" width="466" height="60" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="78" y="533" font-size="10.5" fill="#4a4a4f">单位效率比较（每 1 数值贡献多少积）：</text>
  <text x="78" y="553" font-size="10.5" fill="#1f6b47">3^(1/3) ≈ 1.442　&gt;　2^(1/2) ≈ 1.414</text>
  <text x="290" y="553" font-size="10.5" fill="#6e6e73">→ 同样的「和」，用 3 比用 2 更划算</text>

  <rect x="570" y="406" width="510" height="180" rx="14" fill="#ffffff" stroke="#4a7fd0" stroke-width="1.3" filter="url(#soft)"/>
  <text x="592" y="432" font-size="12.5" font-weight="700" fill="#20375e">三条推论：不留 1、少用 2、不留 ≥4</text>
  <text x="592" y="456" font-size="10.5" fill="#4a4a4f"><tspan font-weight="700" fill="#8a4038">不留 1：</tspan>因子 1 不增积；把 1 并入邻因子（1+2→3）反更大。</text>
  <text x="592" y="480" font-size="10.5" fill="#4a4a4f"><tspan font-weight="700" fill="#20375e">最多两个 2：</tspan>三个 2 之和 6 → 积 8，两个 3 → 积 9，故余数≤2。</text>
  <text x="592" y="504" font-size="10.5" fill="#4a4a4f"><tspan font-weight="700" fill="#1f6b47">不留 ≥4：</tspan>4=2+2 积不变仍可拆；5=2+3 积 6&gt;5，故都应再拆。</text>
  <rect x="592" y="518" width="466" height="54" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="608" y="539" font-size="10.5" fill="#20375e">于是最优解只由 3 与 2 组成，且 2 至多两个 ——</text>
  <text x="608" y="558" font-size="10.5" fill="#20375e">正对应代码里 b∈{0,1,2} 三分支，O(1) 直接算出。</text>

  <!-- 底部结论 -->
  <rect x="40" y="602" width="1040" height="72" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="58" y="626" font-size="11" font-weight="700" fill="#8a5a12">贪心本质</text>
  <text x="140" y="626" font-size="10.5" fill="#4a4a4f">「每步切一个 3」是局部最优；因子间相互独立、拆法可组合（最优子结构），且以 3 开头存在最优解（贪心选择性质）。</text>
  <text x="58" y="650" font-size="11" font-weight="700" fill="#1f6b47">复杂度</text>
  <text x="140" y="650" font-size="10.5" fill="#4a4a4f">无需逐段循环，直接由 a、b 用幂运算得结果：时间 O(1)（幂）/ 空间 O(1)，是「数学型贪心」的典型 —— 规律证明后一步到位。</text>
</svg>
