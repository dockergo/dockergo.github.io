<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
  </defs>
  <rect width="1120" height="660" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">GD1 · 零钱贪心：每步选「不超过剩余额的最大面额」 —— 常对，却有反例</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">coins 升序，指针 i 从末尾（最大面额）起；while coins[i] &gt; amt 则 i--，选中后 amt -= coins[i]、count++，直到 amt=0</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">贪心当前选择</text>
  <rect x="160" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="178" y="82" font-size="10.5" fill="#3a3a3c">全局最优路径</text>
  <rect x="300" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="318" y="82" font-size="10.5" fill="#3a3a3c">贪心失败（枚数偏多）</text>

  <!-- ===== ① 有效例 ===== -->
  <text x="30" y="118" font-size="12" font-weight="700" fill="#1f6b47">① 有效例：coins {1,5,10,25} 凑 amt=36 —— 面额构成「整除链」，贪心即最优</text>

  <text x="40" y="150" font-size="10.5" fill="#6e6e73">从大到小依次取：</text>
  <g text-anchor="middle" font-size="12">
    <rect x="150" y="136" width="60" height="34" rx="8" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="180" y="158" fill="#20375e" font-weight="700">25</text>
    <rect x="250" y="136" width="60" height="34" rx="8" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="280" y="158" fill="#20375e" font-weight="700">10</text>
    <rect x="350" y="136" width="60" height="34" rx="8" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="380" y="158" fill="#20375e" font-weight="700">1</text>
  </g>
  <line x1="210" y1="153" x2="250" y2="153" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <line x1="310" y1="153" x2="350" y2="153" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="430" y="150" font-size="10.5" fill="#5a4a2a">36 → 11 → 1 → 0</text>
  <rect x="560" y="134" width="280" height="38" rx="9" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.3"/>
  <text x="576" y="158" font-size="11" fill="#1f6b47" font-weight="700">贪心 3 枚 ＝ 最优 3 枚 ✓</text>
  <text x="860" y="158" font-size="10" fill="#6e6e73">大面额是小面额倍数，贪心步永远无损</text>

  <!-- 分割线 -->
  <line x1="30" y1="196" x2="1090" y2="196" stroke="#e4e7ec" stroke-width="1"/>

  <!-- ===== ② 反例 ===== -->
  <text x="30" y="224" font-size="12" font-weight="700" fill="#8a4038">② 反例：coins {1,3,4} 凑 amt=6 —— 面额非整除链，贪心先吞大面额 4 反而更差</text>

  <!-- 贪心路径 -->
  <rect x="40" y="240" width="1040" height="150" rx="14" fill="#fff6f5" stroke="#e8a79f" filter="url(#soft)"/>
  <text x="60" y="266" font-size="12.5" font-weight="700" fill="#8a4038">贪心路径：先选最大面额 4</text>

  <g text-anchor="middle" font-size="13">
    <rect x="70" y="288" width="70" height="46" rx="9" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="105" y="316" fill="#20375e" font-weight="700">选 4</text>
    <rect x="250" y="288" width="70" height="46" rx="9" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="285" y="316" fill="#20375e" font-weight="700">选 1</text>
    <rect x="430" y="288" width="70" height="46" rx="9" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="465" y="316" fill="#20375e" font-weight="700">选 1</text>
  </g>
  <line x1="140" y1="311" x2="250" y2="311" stroke="#d1544a" stroke-width="2" marker-end="url(#aR)"/>
  <line x1="320" y1="311" x2="430" y2="311" stroke="#d1544a" stroke-width="2" marker-end="url(#aR)"/>
  <text x="195" y="304" font-size="10" fill="#8a4038" text-anchor="middle">4&gt;剩2, 3&gt;剩2</text>
  <text x="195" y="330" font-size="9.5" fill="#8a4038" text-anchor="middle">只能退到 1</text>
  <text x="105" y="356" font-size="10" fill="#6e6e73" text-anchor="middle">amt 6 → 2</text>
  <text x="285" y="356" font-size="10" fill="#6e6e73" text-anchor="middle">amt 2 → 1</text>
  <text x="465" y="356" font-size="10" fill="#6e6e73" text-anchor="middle">amt 1 → 0</text>

  <rect x="600" y="288" width="450" height="80" rx="10" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.4"/>
  <text x="620" y="314" font-size="13" font-weight="700" fill="#8a4038">结果：4 + 1 + 1 = 3 枚　✗ 次优</text>
  <text x="620" y="340" font-size="10.5" fill="#8a4038">吞下 4 后剩 2，只能用两枚 1 补齐——大面额挤占了本可用 3 的空间</text>
  <text x="620" y="358" font-size="10.5" fill="#8a4038">贪心「不回头」，无从发现放弃 4 会更好</text>

  <!-- 最优路径 -->
  <rect x="40" y="404" width="1040" height="150" rx="14" fill="#f2faf6" stroke="#a8ddc3" filter="url(#soft)"/>
  <text x="60" y="430" font-size="12.5" font-weight="700" fill="#1f6b47">最优路径：跳过 4，两枚 3 平分</text>

  <g text-anchor="middle" font-size="13">
    <rect x="70" y="452" width="70" height="46" rx="9" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.6"/><text x="105" y="480" fill="#1f6b47" font-weight="700">选 3</text>
    <rect x="250" y="452" width="70" height="46" rx="9" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.6"/><text x="285" y="480" fill="#1f6b47" font-weight="700">选 3</text>
  </g>
  <line x1="140" y1="475" x2="250" y2="475" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="105" y="518" font-size="10" fill="#6e6e73" text-anchor="middle">amt 6 → 3</text>
  <text x="285" y="518" font-size="10" fill="#6e6e73" text-anchor="middle">amt 3 → 0</text>

  <rect x="600" y="452" width="450" height="80" rx="10" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/>
  <text x="620" y="478" font-size="13" font-weight="700" fill="#1f6b47">结果：3 + 3 = 2 枚　✓ 最优</text>
  <text x="620" y="504" font-size="10.5" fill="#2a5a43">主动放弃「当下最大」的 4，全局才最省——这一步贪心永远做不到</text>
  <text x="620" y="522" font-size="10.5" fill="#2a5a43">动规会枚举「用/不用 4」两分支，故能选出 2 枚</text>

  <!-- 底部结论 -->
  <rect x="40" y="572" width="1040" height="66" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="58" y="596" font-size="11" font-weight="700" fill="#8a4038">失效根因</text>
  <text x="130" y="596" font-size="10.5" fill="#4a4a4f">零钱问题不满足「贪心选择性质」：并非每个最优解都以最大面额开头。面额一般时须改用动规 O(n·amt)。</text>
  <text x="58" y="620" font-size="11" font-weight="700" fill="#1f6b47">何时安全</text>
  <text x="130" y="620" font-size="10.5" fill="#4a4a4f">当面额构成「整除链」（如 1,5,10,25，后者是前者整数倍）时贪心即最优；这也是真实货币系统普遍采用整除链的原因。</text>
</svg>
