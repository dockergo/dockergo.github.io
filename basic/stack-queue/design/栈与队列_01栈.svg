<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="700" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="17" font-weight="700" fill="#1d1d1f">栈 Stack · LIFO：push / pop 都发生在同一端（栈顶 top）</text>
  <text x="30" y="53" font-size="11" fill="#6e6e73">最后压入的元素最先弹出。数组实现以「尾部」为栈顶，链表实现以「Back 结点」为栈顶——两者操作端唯一，均 O(1)。</text>

  <!-- 图例 -->
  <line x1="30" y1="74" x2="54" y2="74" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="60" y="78" font-size="10.5" fill="#3a3a3c">push 压入（栈顶）</text>
  <line x1="190" y1="74" x2="214" y2="74" stroke="#d99a2b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aA)"/>
  <text x="220" y="78" font-size="10.5" fill="#3a3a3c">pop 弹出（栈顶）</text>
  <rect x="345" y="67" width="13" height="13" rx="3" fill="#dbe8fa" stroke="#9dbdea"/>
  <text x="364" y="78" font-size="10.5" fill="#3a3a3c">当前栈顶元素</text>

  <!-- ===== 数组实现 ===== -->
  <text x="30" y="112" font-size="13" font-weight="700" fill="#8a6a1f">数组实现 arrayStack · 栈顶 = 切片尾部 data[len-1]；push = append，pop = data[:len-1]</text>

  <!-- 快照 1 -->
  <text x="60" y="150" font-size="11" font-weight="700" fill="#4a4a4f">① push 1</text>
  <g text-anchor="middle" font-size="11">
    <rect x="60" y="196" width="44" height="36" rx="5" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="82" y="219" fill="#20375e">1</text>
  </g>
  <text x="82" y="248" font-size="9" fill="#8a6a1f" text-anchor="middle">[0]</text>
  <text x="82" y="182" font-size="9" fill="#20375e" text-anchor="middle">top</text>

  <!-- 快照 2 -->
  <text x="300" y="150" font-size="11" font-weight="700" fill="#4a4a4f">② push 2</text>
  <g text-anchor="middle" font-size="11">
    <rect x="300" y="196" width="44" height="36" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="322" y="219" fill="#20375e">1</text>
    <rect x="344" y="196" width="44" height="36" rx="5" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="366" y="219" fill="#20375e">2</text>
  </g>
  <text x="322" y="248" font-size="9" fill="#8a6a1f" text-anchor="middle">[0]</text>
  <text x="366" y="248" font-size="9" fill="#8a6a1f" text-anchor="middle">[1]</text>
  <text x="366" y="182" font-size="9" fill="#20375e" text-anchor="middle">top</text>

  <!-- 快照 3 -->
  <text x="560" y="150" font-size="11" font-weight="700" fill="#4a4a4f">③ push 3</text>
  <g text-anchor="middle" font-size="11">
    <rect x="560" y="196" width="44" height="36" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="582" y="219" fill="#20375e">1</text>
    <rect x="604" y="196" width="44" height="36" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="626" y="219" fill="#20375e">2</text>
    <rect x="648" y="196" width="44" height="36" rx="5" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="670" y="219" fill="#20375e">3</text>
  </g>
  <text x="582" y="248" font-size="9" fill="#8a6a1f" text-anchor="middle">[0]</text>
  <text x="626" y="248" font-size="9" fill="#8a6a1f" text-anchor="middle">[1]</text>
  <text x="670" y="248" font-size="9" fill="#8a6a1f" text-anchor="middle">[2]</text>
  <text x="670" y="182" font-size="9" fill="#20375e" text-anchor="middle">top</text>

  <!-- 快照 4 -->
  <text x="860" y="150" font-size="11" font-weight="700" fill="#4a4a4f">④ pop → 弹出 3</text>
  <g text-anchor="middle" font-size="11">
    <rect x="860" y="196" width="44" height="36" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="882" y="219" fill="#20375e">1</text>
    <rect x="904" y="196" width="44" height="36" rx="5" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="926" y="219" fill="#20375e">2</text>
    <rect x="948" y="196" width="44" height="36" rx="5" fill="#f7f0e2" stroke="#e4cf95" stroke-dasharray="3 2"/><text x="970" y="219" fill="#b79445">3</text>
  </g>
  <text x="882" y="248" font-size="9" fill="#8a6a1f" text-anchor="middle">[0]</text>
  <text x="926" y="248" font-size="9" fill="#8a6a1f" text-anchor="middle">[1]</text>
  <text x="926" y="182" font-size="9" fill="#20375e" text-anchor="middle">top</text>
  <text x="970" y="266" font-size="8.5" fill="#b79445" text-anchor="middle">len-- 逻辑移除</text>

  <!-- 数组过程箭头 -->
  <line x1="150" y1="214" x2="290" y2="214" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="220" y="208" font-size="9.5" fill="#1f6b4b" text-anchor="middle">append 2</text>
  <line x1="410" y1="214" x2="550" y2="214" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="480" y="208" font-size="9.5" fill="#1f6b4b" text-anchor="middle">append 3</text>
  <line x1="716" y1="214" x2="850" y2="214" stroke="#d99a2b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aA)"/>
  <text x="783" y="208" font-size="9.5" fill="#8a6a1f" text-anchor="middle">取尾并 len--</text>

  <!-- ===== 链表实现 ===== -->
  <line x1="30" y1="300" x2="1090" y2="300" stroke="#e4e7ec" stroke-width="1.2"/>
  <text x="30" y="336" font-size="13" font-weight="700" fill="#20375e">链表实现 linkedListStack（container/list 双向链表）· 栈顶 = Back 结点；push = PushBack，pop = Remove(Back)</text>

  <!-- 快照 1 -->
  <text x="60" y="376" font-size="11" font-weight="700" fill="#4a4a4f">① push 1</text>
  <g text-anchor="middle" font-size="11">
    <rect x="60" y="430" width="52" height="38" rx="8" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="86" y="454" fill="#20375e">1</text>
  </g>
  <text x="86" y="416" font-size="9" fill="#20375e" text-anchor="middle">Front = Back = top</text>

  <!-- 快照 2 -->
  <text x="300" y="376" font-size="11" font-weight="700" fill="#4a4a4f">② push 2 (PushBack)</text>
  <g text-anchor="middle" font-size="11">
    <rect x="300" y="430" width="52" height="38" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/><text x="326" y="454" fill="#20375e">1</text>
    <rect x="384" y="430" width="52" height="38" rx="8" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="410" y="454" fill="#20375e">2</text>
  </g>
  <line x1="352" y1="449" x2="380" y2="449" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <line x1="380" y1="443" x2="352" y2="443" stroke="#4a7fd0" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="410" y="416" font-size="9" fill="#20375e" text-anchor="middle">Back = top</text>

  <!-- 快照 3 -->
  <text x="560" y="376" font-size="11" font-weight="700" fill="#4a4a4f">③ push 3 (PushBack)</text>
  <g text-anchor="middle" font-size="11">
    <rect x="560" y="430" width="52" height="38" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/><text x="586" y="454" fill="#20375e">1</text>
    <rect x="644" y="430" width="52" height="38" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/><text x="670" y="454" fill="#20375e">2</text>
    <rect x="728" y="430" width="52" height="38" rx="8" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="754" y="454" fill="#20375e">3</text>
  </g>
  <line x1="612" y1="449" x2="640" y2="449" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <line x1="640" y1="443" x2="612" y2="443" stroke="#4a7fd0" stroke-width="1.4" marker-end="url(#aB)"/>
  <line x1="696" y1="449" x2="724" y2="449" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <line x1="724" y1="443" x2="696" y2="443" stroke="#4a7fd0" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="754" y="416" font-size="9" fill="#20375e" text-anchor="middle">Back = top</text>

  <!-- 快照 4 -->
  <text x="860" y="376" font-size="11" font-weight="700" fill="#4a4a4f">④ pop → 弹出 3</text>
  <g text-anchor="middle" font-size="11">
    <rect x="860" y="430" width="52" height="38" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/><text x="886" y="454" fill="#20375e">1</text>
    <rect x="944" y="430" width="52" height="38" rx="8" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="970" y="454" fill="#20375e">2</text>
    <rect x="1028" y="430" width="52" height="38" rx="8" fill="#f7f0e2" stroke="#e4cf95" stroke-dasharray="3 2"/><text x="1054" y="454" fill="#b79445">3</text>
  </g>
  <line x1="912" y1="449" x2="940" y2="449" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <line x1="940" y1="443" x2="912" y2="443" stroke="#4a7fd0" stroke-width="1.4" marker-end="url(#aB)"/>
  <text x="970" y="416" font-size="9" fill="#20375e" text-anchor="middle">Back = top</text>
  <text x="1054" y="488" font-size="8.5" fill="#b79445" text-anchor="middle">Remove(Back)</text>

  <!-- 链表过程箭头 -->
  <line x1="150" y1="449" x2="290" y2="449" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <line x1="470" y1="449" x2="550" y2="449" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <line x1="796" y1="449" x2="850" y2="449" stroke="#d99a2b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aA)"/>

  <!-- 结论条 -->
  <rect x="40" y="540" width="1040" height="120" rx="14" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="60" y="568" font-size="12" font-weight="700" fill="#2f6b4e">LIFO 不变式</text>
  <text x="60" y="592" font-size="10.5" fill="#4a4a4f">压入顺序 1 → 2 → 3，弹出顺序 3 → 2 → 1：任何时刻只有栈顶暴露，"最后进的最先出"。</text>
  <text x="60" y="614" font-size="10.5" fill="#4a4a4f">两种实现的差别只在「栈顶落在哪里」：数组落在尾部下标、链表落在 Back 结点；对外行为完全一致。</text>
  <text x="60" y="640" font-size="10" fill="#8a6a1f">代价对照：数组尾部 append 均摊 O(1)，偶发扩容整体搬移；链表恒定 O(1)，但每结点多一份指针内存。</text>
</svg>
