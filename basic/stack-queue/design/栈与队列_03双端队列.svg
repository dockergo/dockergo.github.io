<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="660" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="17" font-weight="700" fill="#1d1d1f">双端队列 Deque · 两端皆可增删，环形数组用 index() 双向回绕</text>
  <text x="30" y="53" font-size="11" fill="#6e6e73">front / back 两端都能 push / pop。统一用 index(i)=(i+cap)%cap：越过尾部回到头部，越过头部回到尾部。</text>

  <!-- 图例 -->
  <line x1="30" y1="74" x2="54" y2="74" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="60" y="78" font-size="10.5" fill="#3a3a3c">front 队首端</text>
  <line x1="160" y1="74" x2="184" y2="74" stroke="#d99a2b" stroke-width="2" marker-end="url(#aA)"/>
  <text x="190" y="78" font-size="10.5" fill="#3a3a3c">back 队尾端</text>
  <rect x="280" y="67" width="13" height="13" rx="3" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/>
  <text x="299" y="78" font-size="10.5" fill="#3a3a3c">空闲格</text>
  <text x="390" y="78" font-size="10.5" fill="#8a6a1f">容量 cap=5，索引 [0..4]</text>

  <!-- S1 -->
  <text x="40" y="152" font-size="11" font-weight="700" fill="#4a4a4f">① pushLast a,b</text>
  <text x="40" y="169" font-size="9" fill="#6e6e73">front=0 size=2</text>
  <line x1="257" y1="130" x2="257" y2="148" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="257" y="126" font-size="9" fill="#1f6b4b" text-anchor="middle">front</text>
  <line x1="311" y1="130" x2="311" y2="148" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="311" y="126" font-size="9" fill="#8a6a1f" text-anchor="middle">back</text>
  <g text-anchor="middle" font-size="12">
    <rect x="230" y="150" width="54" height="38" rx="5" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="257" y="175" fill="#1f6b4b">a</text>
    <rect x="284" y="150" width="54" height="38" rx="5" fill="#fbf1dc" stroke="#d99a2b" stroke-width="1.4"/><text x="311" y="175" fill="#8a6a1f">b</text>
    <rect x="338" y="150" width="54" height="38" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="365" y="175" fill="#a1a1a6"></text>
    <rect x="392" y="150" width="54" height="38" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="419" y="175" fill="#a1a1a6"></text>
    <rect x="446" y="150" width="54" height="38" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="473" y="175" fill="#a1a1a6"></text>
  </g>

  <!-- S2 -->
  <text x="40" y="250" font-size="11" font-weight="700" fill="#4a4a4f">② pushFirst c</text>
  <text x="40" y="267" font-size="9" fill="#8a6a1f">front:0→4 回绕</text>
  <line x1="473" y1="228" x2="473" y2="246" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="473" y="224" font-size="9" fill="#1f6b4b" text-anchor="middle">front</text>
  <line x1="311" y1="228" x2="311" y2="246" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="311" y="224" font-size="9" fill="#8a6a1f" text-anchor="middle">back</text>
  <g text-anchor="middle" font-size="12">
    <rect x="230" y="248" width="54" height="38" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="257" y="273" fill="#20375e">a</text>
    <rect x="284" y="248" width="54" height="38" rx="5" fill="#fbf1dc" stroke="#d99a2b" stroke-width="1.4"/><text x="311" y="273" fill="#8a6a1f">b</text>
    <rect x="338" y="248" width="54" height="38" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="365" y="273" fill="#a1a1a6"></text>
    <rect x="392" y="248" width="54" height="38" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="419" y="273" fill="#a1a1a6"></text>
    <rect x="446" y="248" width="54" height="38" rx="5" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="473" y="273" fill="#1f6b4b">c</text>
  </g>
  <!-- 回绕连接：front 从 [0] 越过头部到 [4] -->
  <path d="M230 298 L230 312 L500 312 L500 290" fill="none" stroke="#2f9e6e" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aG)"/>
  <text x="365" y="308" font-size="9" fill="#1f6b4b" text-anchor="middle">front = index(0-1) = (−1+5)%5 = 4，越过头部回到尾部 [4]</text>

  <!-- S3 -->
  <text x="40" y="360" font-size="11" font-weight="700" fill="#4a4a4f">③ pushFirst d</text>
  <text x="40" y="377" font-size="9" fill="#6e6e73">front=3 size=4</text>
  <line x1="419" y1="338" x2="419" y2="356" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="419" y="334" font-size="9" fill="#1f6b4b" text-anchor="middle">front</text>
  <line x1="311" y1="338" x2="311" y2="356" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="311" y="334" font-size="9" fill="#8a6a1f" text-anchor="middle">back</text>
  <g text-anchor="middle" font-size="12">
    <rect x="230" y="358" width="54" height="38" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="257" y="383" fill="#20375e">a</text>
    <rect x="284" y="358" width="54" height="38" rx="5" fill="#fbf1dc" stroke="#d99a2b" stroke-width="1.4"/><text x="311" y="383" fill="#8a6a1f">b</text>
    <rect x="338" y="358" width="54" height="38" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="365" y="383" fill="#a1a1a6"></text>
    <rect x="392" y="358" width="54" height="38" rx="5" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="419" y="383" fill="#1f6b4b">d</text>
    <rect x="446" y="358" width="54" height="38" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="473" y="383" fill="#20375e">c</text>
  </g>

  <!-- S4 -->
  <text x="40" y="470" font-size="11" font-weight="700" fill="#4a4a4f">④ popLast → b</text>
  <text x="40" y="487" font-size="9" fill="#6e6e73">front=3 size=3</text>
  <text x="40" y="503" font-size="9" fill="#8a6a1f">仅 size--</text>
  <line x1="419" y1="448" x2="419" y2="466" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="419" y="444" font-size="9" fill="#1f6b4b" text-anchor="middle">front</text>
  <line x1="257" y1="448" x2="257" y2="466" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="257" y="444" font-size="9" fill="#8a6a1f" text-anchor="middle">back</text>
  <g text-anchor="middle" font-size="12">
    <rect x="230" y="468" width="54" height="38" rx="5" fill="#fbf1dc" stroke="#d99a2b" stroke-width="1.4"/><text x="257" y="493" fill="#8a6a1f">a</text>
    <rect x="284" y="468" width="54" height="38" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="311" y="493" fill="#a1a1a6"></text>
    <rect x="338" y="468" width="54" height="38" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="365" y="493" fill="#a1a1a6"></text>
    <rect x="392" y="468" width="54" height="38" rx="5" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="419" y="493" fill="#1f6b4b">d</text>
    <rect x="446" y="468" width="54" height="38" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="473" y="493" fill="#20375e">c</text>
  </g>
  <g font-size="9" fill="#8a6a1f" text-anchor="middle">
    <text x="257" y="522">[0]</text><text x="311" y="522">[1]</text><text x="365" y="522">[2]</text><text x="419" y="522">[3]</text><text x="473" y="522">[4]</text>
  </g>
  <text x="365" y="540" font-size="9.5" fill="#1f6b4b" text-anchor="middle">逻辑 front→back：d[3] → c[4] → a[0]（两端都可能回绕）</text>

  <!-- 右侧：四个操作 -->
  <rect x="560" y="120" width="520" height="176" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="582" y="146" font-size="12" font-weight="700" fill="#1d1d1f">四个对称操作（环形数组版）</text>
  <text x="582" y="172" font-size="10.5" fill="#1f6b4b">pushFirst：front = index(front − 1)；写 nums[front]</text>
  <text x="582" y="194" font-size="10.5" fill="#8a6a1f">pushLast ：rear = index(front + size)；写 nums[rear]</text>
  <text x="582" y="216" font-size="10.5" fill="#1f6b4b">popFirst ：front = index(front + 1)；size--</text>
  <text x="582" y="238" font-size="10.5" fill="#8a6a1f">popLast  ：size--（尾元素在 index(front+size−1)，逻辑删除即可）</text>
  <text x="582" y="264" font-size="10" fill="#4a4a4f">四操作均 O(1)。front 向左走靠 index(-1) 回绕，rear 向右走靠 index(+1) 回绕。</text>
  <text x="582" y="286" font-size="9.5" fill="#8a97ab">队满判定同队列：size == cap 时拒绝入队。</text>

  <!-- 右侧：链表版 -->
  <rect x="560" y="312" width="520" height="112" rx="14" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="582" y="338" font-size="12" font-weight="700" fill="#20375e">链表实现 linkedListDeque（双向链表）</text>
  <text x="582" y="362" font-size="10.5" fill="#4a4a4f">container/list 本就双向：pushFirst=PushFront、pushLast=PushBack、</text>
  <text x="582" y="384" font-size="10.5" fill="#4a4a4f">popFirst=Remove(Front)、popLast=Remove(Back)，四端操作天然 O(1)。</text>
  <text x="582" y="408" font-size="10" fill="#8a97ab">无需取模与容量管理，代价是每结点两个指针（prev/next）的内存开销。</text>

  <!-- 底部要点 -->
  <rect x="560" y="440" width="520" height="100" rx="14" fill="#eef3fb" stroke="#c6d9f2"/>
  <text x="582" y="466" font-size="12" font-weight="700" fill="#20375e">双端队列是栈与队列的超集</text>
  <text x="582" y="490" font-size="10.5" fill="#20375e">只用 pushLast + popLast → 退化成栈（LIFO）。</text>
  <text x="582" y="512" font-size="10.5" fill="#20375e">只用 pushLast + popFirst → 退化成队列（FIFO）。</text>
  <text x="582" y="532" font-size="10" fill="#5a7099">故很多语言直接用 deque 同时充当栈与队列的底层容器。</text>
</svg>
