<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="17" font-weight="700" fill="#1d1d1f">对比 · 操作端（栈/队列/双端）× 承载方式（数组 vs 链表）</text>
  <text x="30" y="53" font-size="11" fill="#6e6e73">两个正交维度：结构定义"在哪些端操作"，载体决定"用什么内存布局实现"。</text>

  <!-- 图例 -->
  <rect x="30" y="68" width="13" height="13" rx="3" fill="#2f9e6e"/><text x="49" y="79" font-size="10.5" fill="#3a3a3c">优势</text>
  <rect x="110" y="68" width="13" height="13" rx="3" fill="#d99a2b"/><text x="129" y="79" font-size="10.5" fill="#3a3a3c">代价 / 约束</text>

  <!-- ===== 表1：操作端 ===== -->
  <text x="40" y="106" font-size="13" font-weight="700" fill="#20375e">① 三种结构的操作端与语义</text>

  <!-- 表头 -->
  <rect x="40" y="114" width="1040" height="34" rx="6" fill="#4a7fd0"/>
  <g fill="#ffffff" font-size="11.5" font-weight="700">
    <text x="52" y="136">结构</text>
    <text x="192" y="136">进入端 push</text>
    <text x="412" y="136">离开端 pop</text>
    <text x="632" y="136">语义</text>
    <text x="832" y="136">典型用途</text>
  </g>
  <!-- 行分隔与列分隔 -->
  <g stroke="#e4e7ec" stroke-width="1">
    <line x1="40" y1="200" x2="1080" y2="200"/>
    <line x1="40" y1="252" x2="1080" y2="252"/>
    <line x1="180" y1="148" x2="180" y2="304"/>
    <line x1="400" y1="148" x2="400" y2="304"/>
    <line x1="620" y1="148" x2="620" y2="304"/>
    <line x1="820" y1="148" x2="820" y2="304"/>
  </g>
  <rect x="40" y="148" width="1040" height="156" rx="6" fill="none" stroke="#e4e7ec"/>

  <!-- 栈 -->
  <rect x="40" y="148" width="140" height="52" fill="#eef3fb"/>
  <text x="52" y="178" font-size="12" font-weight="700" fill="#20375e">栈 Stack</text>
  <text x="192" y="172" font-size="10.5" fill="#4a4a4f">栈顶 top（一端）</text>
  <text x="192" y="190" font-size="9.5" fill="#8a97ab">数组尾部 / 链表 Back</text>
  <text x="412" y="172" font-size="10.5" fill="#4a4a4f">栈顶 top（同一端）</text>
  <text x="412" y="190" font-size="9.5" fill="#8a97ab">进出共用一个开口</text>
  <text x="632" y="178" font-size="11" font-weight="700" fill="#1f6b4b">LIFO 后进先出</text>
  <text x="832" y="172" font-size="10" fill="#4a4a4f">函数调用栈、表达式求值</text>
  <text x="832" y="190" font-size="10" fill="#4a4a4f">括号匹配、DFS、撤销/回退</text>

  <!-- 队列 -->
  <rect x="40" y="200" width="140" height="52" fill="#eef3fb"/>
  <text x="52" y="230" font-size="12" font-weight="700" fill="#20375e">队列 Queue</text>
  <text x="192" y="224" font-size="10.5" fill="#4a4a4f">队尾 rear</text>
  <text x="192" y="242" font-size="9.5" fill="#8a97ab">数组尾部 / 链表 Back</text>
  <text x="412" y="224" font-size="10.5" fill="#4a4a4f">队首 front</text>
  <text x="412" y="242" font-size="9.5" fill="#8a97ab">数组头部 / 链表 Front</text>
  <text x="632" y="230" font-size="11" font-weight="700" fill="#1f6b4b">FIFO 先进先出</text>
  <text x="832" y="224" font-size="10" fill="#4a4a4f">消息/请求缓冲、BFS</text>
  <text x="832" y="242" font-size="10" fill="#4a4a4f">生产者-消费者、任务调度</text>

  <!-- 双端 -->
  <rect x="40" y="252" width="140" height="52" fill="#eef3fb"/>
  <text x="52" y="282" font-size="12" font-weight="700" fill="#20375e">双端 Deque</text>
  <text x="192" y="276" font-size="10.5" fill="#4a4a4f">front 与 back 两端</text>
  <text x="192" y="294" font-size="9.5" fill="#8a97ab">pushFirst / pushLast</text>
  <text x="412" y="276" font-size="10.5" fill="#4a4a4f">front 与 back 两端</text>
  <text x="412" y="294" font-size="9.5" fill="#8a97ab">popFirst / popLast</text>
  <text x="632" y="282" font-size="11" font-weight="700" fill="#1f6b4b">两端皆可（超集）</text>
  <text x="832" y="276" font-size="10" fill="#4a4a4f">滑动窗口最值、双向工作队列</text>
  <text x="832" y="294" font-size="10" fill="#4a4a4f">可退化为栈或队列</text>

  <!-- ===== 表2：数组 vs 链表 ===== -->
  <text x="40" y="352" font-size="13" font-weight="700" fill="#20375e">② 承载方式：数组实现 vs 链表实现</text>

  <rect x="40" y="360" width="1040" height="34" rx="6" fill="#4a7fd0"/>
  <g fill="#ffffff" font-size="11.5" font-weight="700">
    <text x="52" y="382">对比维度</text>
    <text x="272" y="382">数组承载（连续 slice / 环形）</text>
    <text x="682" y="382">链表承载（container/list 双向）</text>
  </g>
  <rect x="40" y="394" width="1040" height="276" rx="6" fill="none" stroke="#e4e7ec"/>
  <g stroke="#e4e7ec" stroke-width="1">
    <line x1="260" y1="394" x2="260" y2="670"/>
    <line x1="670" y1="394" x2="670" y2="670"/>
    <line x1="40" y1="440" x2="1080" y2="440"/>
    <line x1="40" y1="486" x2="1080" y2="486"/>
    <line x1="40" y1="532" x2="1080" y2="532"/>
    <line x1="40" y1="578" x2="1080" y2="578"/>
    <line x1="40" y1="624" x2="1080" y2="624"/>
  </g>

  <g font-size="10.5">
    <!-- 内存布局 -->
    <text x="52" y="421" font-weight="700" fill="#20375e">内存布局</text>
    <text x="272" y="421" fill="#4a4a4f">一整块连续内存，靠下标定位</text>
    <text x="682" y="421" fill="#4a4a4f">离散结点，靠 prev/next 指针串联</text>
    <!-- 端点增删 -->
    <text x="52" y="467" font-weight="700" fill="#20375e">端点增删</text>
    <text x="272" y="461" fill="#2f9e6e">栈顶尾部均摊 O(1)</text>
    <text x="272" y="478" fill="#4a4a4f">队列/双端靠取模，端点 O(1)</text>
    <text x="682" y="467" fill="#2f9e6e">任一端恒定 O(1)，无取模</text>
    <!-- 扩容/容量 -->
    <text x="52" y="513" font-weight="700" fill="#20375e">扩容 / 容量</text>
    <text x="272" y="507" fill="#d99a2b">满则扩容 → 整体搬移 O(n)</text>
    <text x="272" y="524" fill="#4a4a4f">或固定 cap，越界拒绝（本实现）</text>
    <text x="682" y="513" fill="#2f9e6e">按需分配，无上限，无搬移</text>
    <!-- 随机访问 -->
    <text x="52" y="559" font-weight="700" fill="#20375e">随机访问 [i]</text>
    <text x="272" y="559" fill="#2f9e6e">O(1) 下标直达</text>
    <text x="682" y="559" fill="#d99a2b">O(n) 需顺链遍历（受限结构少用）</text>
    <!-- 每元素开销 -->
    <text x="52" y="605" font-weight="700" fill="#20375e">每元素额外开销</text>
    <text x="272" y="605" fill="#2f9e6e">几乎为 0（仅预留冗余容量）</text>
    <text x="682" y="605" fill="#d99a2b">每结点多 1~2 个指针的内存</text>
    <!-- 缓存局部性 -->
    <text x="52" y="651" font-weight="700" fill="#20375e">缓存局部性</text>
    <text x="272" y="651" fill="#2f9e6e">好：顺序存放，预取友好</text>
    <text x="682" y="651" fill="#d99a2b">差：结点分散，跳指针易 miss</text>
  </g>

  <!-- 底部结论 -->
  <text x="40" y="698" font-size="10.5" fill="#6e6e73">选型经验：容量可预估、追求吞吐与缓存友好 → 数组（环形）；元素数波动大、要恒定 O(1) 且不在意随机访问 → 链表。</text>
  <text x="40" y="714" font-size="10" fill="#8a97ab">两条维度独立组合：任一结构都能选任一载体，本条目对每个结构各给数组版与链表版两种实现。</text>
</svg>
