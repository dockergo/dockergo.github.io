<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">BT3 · 子集和：选若干数使和为 target —— start 起点避免组合重排，排序后跳过同层重复，越界即剪</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">示例 nums=[1,1,2,3]（已排序），target=4，元素不可复用。每层从 start 起向后取，剩余 target 减到 0 即得一个子集</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">子集前缀（状态）</text>
  <rect x="200" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="218" y="82" font-size="10.5" fill="#3a3a3c">尝试 · 取一个元素</text>
  <rect x="360" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="378" y="82" font-size="10.5" fill="#3a3a3c">剩余=0 → 记录子集</text>
  <rect x="530" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="548" y="82" font-size="10.5" fill="#3a3a3c">剪枝：越界 break / 同层跳过</text>

  <text x="30" y="110" font-size="12" font-weight="700" fill="#8a5a12">① 解空间树（边上标 选值 与 剩余target；红为被剪分支）</text>

  <!-- 层标签 -->
  <text x="30" y="140" font-size="10" fill="#6e6e73">起点约束：每层只从 start=i+1 向后取，天然排除同一组合的不同顺序</text>

  <!-- root -->
  <rect x="515" y="150" width="90" height="32" rx="7" fill="#fdf3e0" stroke="#d99a2b" stroke-width="1.5"/><text x="560" y="171" font-size="12" font-weight="700" fill="#8a5a12" text-anchor="middle">[ ]  t=4</text>

  <!-- edges root -> L1 -->
  <path d="M560 182 V210 H200 V244" fill="none" stroke="#4a7fd0" stroke-width="1.4"/>
  <path d="M560 182 V244" fill="none" stroke="#d1544a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M560 182 V210 H640 V244" fill="none" stroke="#4a7fd0" stroke-width="1.4"/>
  <path d="M560 182 V210 H830 V244" fill="none" stroke="#4a7fd0" stroke-width="1.4"/>
  <text x="300" y="204" font-size="9" fill="#20375e">取 1 → t=3</text>
  <text x="648" y="204" font-size="9" fill="#20375e">取 2 → t=2</text>
  <text x="838" y="204" font-size="9" fill="#20375e">取 3 → t=1</text>
  <line x1="552" y1="208" x2="568" y2="224" stroke="#d1544a" stroke-width="2"/><line x1="568" y1="208" x2="552" y2="224" stroke="#d1544a" stroke-width="2"/>
  <text x="450" y="216" font-size="8.5" fill="#8a4038">i=1 与左邻相等</text>

  <!-- L1 nodes -->
  <rect x="168" y="244" width="64" height="30" rx="7" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/><text x="200" y="264" font-size="12" fill="#20375e" text-anchor="middle">[1]</text>
  <rect x="530" y="244" width="60" height="30" rx="7" fill="#fbe6e3" stroke="#e8a79f" stroke-dasharray="4 3"/><text x="560" y="259" font-size="9" fill="#8a4038" text-anchor="middle">取 1 ✗</text><text x="560" y="270" font-size="8" fill="#8a4038" text-anchor="middle">同层重复</text>
  <rect x="608" y="244" width="64" height="30" rx="7" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/><text x="640" y="264" font-size="12" fill="#20375e" text-anchor="middle">[2]</text>
  <rect x="798" y="244" width="64" height="30" rx="7" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/><text x="830" y="264" font-size="12" fill="#20375e" text-anchor="middle">[3]</text>

  <!-- [2] dead & [3] dead notes -->
  <text x="640" y="292" font-size="9" fill="#8a4038" text-anchor="middle">下一元素 3：2−3&lt;0</text>
  <text x="640" y="304" font-size="9" fill="#8a4038" text-anchor="middle">break → 无解</text>
  <text x="830" y="292" font-size="9" fill="#8a4038" text-anchor="middle">start=4 越界</text>
  <text x="830" y="304" font-size="9" fill="#8a4038" text-anchor="middle">无更多元素 → 无解</text>

  <!-- edges [1] -> L2 -->
  <path d="M200 274 V300 H120 V330" fill="none" stroke="#4a7fd0" stroke-width="1.3"/>
  <path d="M200 274 V300 H270 V330" fill="none" stroke="#4a7fd0" stroke-width="1.3"/>
  <path d="M200 274 V300 H400 V330" fill="none" stroke="#2f9e6e" stroke-width="1.4"/>
  <text x="60" y="322" font-size="9" fill="#20375e">取1→t=2</text>
  <text x="278" y="322" font-size="9" fill="#20375e">取2→t=1</text>
  <text x="408" y="322" font-size="9" fill="#1f6b47">取3→t=0 ✓</text>

  <!-- L2 nodes -->
  <rect x="88" y="330" width="64" height="30" rx="7" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/><text x="120" y="350" font-size="12" fill="#20375e" text-anchor="middle">[1,1]</text>
  <rect x="238" y="330" width="64" height="30" rx="7" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/><text x="270" y="350" font-size="12" fill="#20375e" text-anchor="middle">[1,2]</text>
  <rect x="363" y="330" width="74" height="30" rx="7" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.5"/><text x="400" y="350" font-size="12" font-weight="700" fill="#1f6b47" text-anchor="middle">[1,3] ✓</text>

  <!-- [1,2] dead -->
  <text x="270" y="378" font-size="9" fill="#8a4038" text-anchor="middle">下一元素 3：1−3&lt;0</text>
  <text x="270" y="390" font-size="9" fill="#8a4038" text-anchor="middle">break → 无解</text>

  <!-- edges [1,1]->L3 -->
  <path d="M120 360 V430" fill="none" stroke="#2f9e6e" stroke-width="1.4"/>
  <text x="128" y="398" font-size="9" fill="#1f6b47">取2→t=0 ✓</text>

  <rect x="83" y="430" width="80" height="30" rx="7" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.5"/><text x="123" y="450" font-size="12" font-weight="700" fill="#1f6b47" text-anchor="middle">[1,1,2] ✓</text>

  <!-- 结果框 -->
  <rect x="900" y="330" width="190" height="120" rx="12" fill="#e6f4ec" stroke="#a8ddc3"/>
  <text x="920" y="356" font-size="12" font-weight="700" fill="#1f6b47">找到 2 个子集</text>
  <text x="920" y="382" font-size="11" fill="#2a5a43">{1, 1, 2} = 4</text>
  <text x="920" y="404" font-size="11" fill="#2a5a43">{1, 3} = 4</text>
  <text x="920" y="430" font-size="9.5" fill="#6e6e73">另一个 1 的分支被</text>
  <text x="920" y="444" font-size="9.5" fill="#6e6e73">同层去重剪掉</text>

  <!-- ===== ② 三道剪枝 ===== -->
  <rect x="40" y="486" width="516" height="206" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="62" y="512" font-size="13" font-weight="700" fill="#8a5a12">② 三道剪枝各司其职</text>

  <text x="62" y="540" font-size="11" font-weight="700" fill="#2f6b4e">start 起点约束（避免顺序重排）</text>
  <text x="62" y="560" font-size="10.5" fill="#4a4a4f">递归传 i+1，每层只向后取；组合无序，{1,3} 与 {3,1}</text>
  <text x="62" y="578" font-size="10.5" fill="#4a4a4f">只保留一次。这是组合与排列的根本区别。</text>

  <text x="62" y="604" font-size="11" font-weight="700" fill="#d1544a">越界 break（剪枝一）</text>
  <text x="62" y="624" font-size="10.5" fill="#4a4a4f">数组已排序，若 t−nums[i]&lt;0，后面只会更大 → 直接</text>
  <text x="62" y="642" font-size="10.5" fill="#4a4a4f">break 结束整个循环，不是 continue。</text>

  <text x="62" y="668" font-size="11" font-weight="700" fill="#d1544a">同层去重 continue（剪枝四）</text>
  <text x="62" y="686" font-size="10.5" fill="#4a4a4f">i&gt;start 且 nums[i]==nums[i−1] 跳过：同层相同值只取一次。</text>

  <!-- ===== ③ 排序 + 指针图 ===== -->
  <rect x="568" y="486" width="516" height="206" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="590" y="512" font-size="13" font-weight="700" fill="#20375e">③ 排序后数组 + start 指针</text>

  <g font-size="12" text-anchor="middle">
    <rect x="600" y="530" width="60" height="40" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="630" y="555" fill="#8a5a12">1</text>
    <rect x="662" y="530" width="60" height="40" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="692" y="555" fill="#8a4038">1</text>
    <rect x="724" y="530" width="60" height="40" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="754" y="555" fill="#20375e">2</text>
    <rect x="786" y="530" width="60" height="40" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="816" y="555" fill="#20375e">3</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#6e6e73">
    <text x="630" y="584">i=0</text><text x="692" y="584">i=1</text><text x="754" y="584">i=2</text><text x="816" y="584">i=3</text>
  </g>
  <text x="692" y="602" font-size="9" fill="#8a4038" text-anchor="middle">↑ 与左邻相等，同层跳过</text>

  <text x="590" y="632" font-size="11" font-weight="700" fill="#8a5a12">与全排列去重的呼应</text>
  <text x="590" y="654" font-size="10.5" fill="#4a4a4f">两者都靠「排序 + 同层相同值只用一次」去重；差别是</text>
  <text x="590" y="672" font-size="10.5" fill="#4a4a4f">组合还多一层 start 约束来消除顺序，排列则要保留顺序。</text>
</svg>
