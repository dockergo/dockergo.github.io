<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">BT4 · N 皇后：逐行放一个皇后，检查列 / 主对角线 / 副对角线，冲突则剪枝回退（示例 n=4）</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">主对角线 row−col 恒定（↘），副对角线 row+col 恒定（↗）；用 cols / diags1 / diags2 三个布尔数组 O(1) 判冲突</text>

  <!-- 图例 -->
  <circle cx="38" cy="78" r="7" fill="#2f9e6e"/><text x="52" y="82" font-size="10.5" fill="#3a3a3c">已放置皇后（合法）</text>
  <circle cx="230" cy="78" r="7" fill="#d1544a"/><text x="244" y="82" font-size="10.5" fill="#3a3a3c">冲突候选 → 剪枝回退</text>
  <line x1="440" y1="78" x2="466" y2="78" stroke="#d1544a" stroke-width="2"/><text x="472" y="82" font-size="10.5" fill="#3a3a3c">冲突线（同列/对角线）</text>
  <rect x="660" y="72" width="12" height="12" rx="2" fill="#fdf3e0" stroke="#e7c07a"/><text x="678" y="82" font-size="10.5" fill="#3a3a3c">diags 索引（状态标记）</text>

  <!-- ===== ① 解棋盘 ===== -->
  <text x="60" y="112" font-size="12" font-weight="700" fill="#1f6b47">① 一个合法解</text>
  <text x="60" y="128" font-size="9.5" fill="#6e6e73">列 {1,3,0,2} 互异，两条对角线也互异</text>
  <!-- board A -->
  <rect x="60" y="138" width="208" height="208" rx="4" fill="#ffffff" stroke="#c9cdd4"/>
  <line x1="112" y1="138" x2="112" y2="346" stroke="#e4e7ec"/><line x1="164" y1="138" x2="164" y2="346" stroke="#e4e7ec"/><line x1="216" y1="138" x2="216" y2="346" stroke="#e4e7ec"/>
  <line x1="60" y1="190" x2="268" y2="190" stroke="#e4e7ec"/><line x1="60" y1="242" x2="268" y2="242" stroke="#e4e7ec"/><line x1="60" y1="294" x2="268" y2="294" stroke="#e4e7ec"/>
  <!-- queens (0,1)(1,3)(2,0)(3,2) -->
  <circle cx="138" cy="164" r="16" fill="#2f9e6e"/><text x="138" y="169" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Q</text>
  <circle cx="242" cy="216" r="16" fill="#2f9e6e"/><text x="242" y="221" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Q</text>
  <circle cx="86" cy="268" r="16" fill="#2f9e6e"/><text x="86" y="273" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Q</text>
  <circle cx="190" cy="320" r="16" fill="#2f9e6e"/><text x="190" y="325" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Q</text>
  <!-- row labels -->
  <text x="48" y="168" font-size="9" fill="#6e6e73" text-anchor="end">r0</text><text x="48" y="220" font-size="9" fill="#6e6e73" text-anchor="end">r1</text><text x="48" y="272" font-size="9" fill="#6e6e73" text-anchor="end">r2</text><text x="48" y="324" font-size="9" fill="#6e6e73" text-anchor="end">r3</text>
  <text x="86" y="360" font-size="9" fill="#6e6e73" text-anchor="middle">c0</text><text x="138" y="360" font-size="9" fill="#6e6e73" text-anchor="middle">c1</text><text x="190" y="360" font-size="9" fill="#6e6e73" text-anchor="middle">c2</text><text x="242" y="360" font-size="9" fill="#6e6e73" text-anchor="middle">c3</text>

  <!-- ===== ② 冲突棋盘 ===== -->
  <text x="330" y="112" font-size="12" font-weight="700" fill="#8a4038">② 冲突 → 回退</text>
  <text x="330" y="128" font-size="9.5" fill="#6e6e73">r0 放 c0 后，r1 试 c1：row−col 都为 0</text>
  <rect x="330" y="138" width="208" height="208" rx="4" fill="#ffffff" stroke="#c9cdd4"/>
  <line x1="382" y1="138" x2="382" y2="346" stroke="#e4e7ec"/><line x1="434" y1="138" x2="434" y2="346" stroke="#e4e7ec"/><line x1="486" y1="138" x2="486" y2="346" stroke="#e4e7ec"/>
  <line x1="330" y1="190" x2="538" y2="190" stroke="#e4e7ec"/><line x1="330" y1="242" x2="538" y2="242" stroke="#e4e7ec"/><line x1="330" y1="294" x2="538" y2="294" stroke="#e4e7ec"/>
  <!-- conflict diagonal line -->
  <line x1="356" y1="164" x2="512" y2="320" stroke="#d1544a" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- placed Q(0,0) -->
  <circle cx="356" cy="164" r="16" fill="#2f9e6e"/><text x="356" y="169" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Q</text>
  <!-- candidate (1,1) red -->
  <circle cx="408" cy="216" r="16" fill="#d1544a"/><text x="408" y="221" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✗</text>
  <text x="330" y="368" font-size="9.5" fill="#8a4038">diags1 命中 → 跳过 c1，试 c2 / c3；整行无位则回退上一行</text>

  <!-- ===== ③ 对角线编号 ===== -->
  <text x="610" y="112" font-size="12" font-weight="700" fill="#8a5a12">③ 两条对角线如何编号（同色值 = 同一对角线）</text>

  <text x="610" y="136" font-size="10" fill="#20375e">主对角线 ↘  diags1 = row − col + n−1</text>
  <rect x="610" y="144" width="160" height="160" rx="4" fill="#ffffff" stroke="#c9cdd4"/>
  <g font-size="11" text-anchor="middle" fill="#8a5a12">
    <text x="630" y="169">3</text><text x="670" y="169">2</text><text x="710" y="169">1</text><text x="750" y="169">0</text>
    <text x="630" y="209">4</text><text x="670" y="209">3</text><text x="710" y="209">2</text><text x="750" y="209">1</text>
    <text x="630" y="249">5</text><text x="670" y="249">4</text><text x="710" y="249">3</text><text x="750" y="249">2</text>
    <text x="630" y="289">6</text><text x="670" y="289">5</text><text x="710" y="289">4</text><text x="750" y="289">3</text>
  </g>
  <line x1="650" y1="144" x2="650" y2="304" stroke="#eee"/><line x1="690" y1="144" x2="690" y2="304" stroke="#eee"/><line x1="730" y1="144" x2="730" y2="304" stroke="#eee"/>
  <line x1="610" y1="184" x2="770" y2="184" stroke="#eee"/><line x1="610" y1="224" x2="770" y2="224" stroke="#eee"/><line x1="610" y1="264" x2="770" y2="264" stroke="#eee"/>

  <text x="850" y="136" font-size="10" fill="#20375e">副对角线 ↗  diags2 = row + col</text>
  <rect x="850" y="144" width="160" height="160" rx="4" fill="#ffffff" stroke="#c9cdd4"/>
  <g font-size="11" text-anchor="middle" fill="#8a5a12">
    <text x="870" y="169">0</text><text x="910" y="169">1</text><text x="950" y="169">2</text><text x="990" y="169">3</text>
    <text x="870" y="209">1</text><text x="910" y="209">2</text><text x="950" y="209">3</text><text x="990" y="209">4</text>
    <text x="870" y="249">2</text><text x="910" y="249">3</text><text x="950" y="249">4</text><text x="990" y="249">5</text>
    <text x="870" y="289">3</text><text x="910" y="289">4</text><text x="950" y="289">5</text><text x="990" y="289">6</text>
  </g>
  <line x1="890" y1="144" x2="890" y2="304" stroke="#eee"/><line x1="930" y1="144" x2="930" y2="304" stroke="#eee"/><line x1="970" y1="144" x2="970" y2="304" stroke="#eee"/>
  <line x1="850" y1="184" x2="1010" y2="184" stroke="#eee"/><line x1="850" y1="224" x2="1010" y2="224" stroke="#eee"/><line x1="850" y1="264" x2="1010" y2="264" stroke="#eee"/>
  <text x="610" y="326" font-size="9.5" fill="#6e6e73">同一 ↘ 上所有格 row−col 相等；同一 ↗ 上 row+col 相等 —— 故各用一个布尔数组（长 2n−1）即可 O(1) 判重</text>

  <!-- ===== ④ marker 数组 ===== -->
  <rect x="40" y="392" width="516" height="300" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="62" y="418" font-size="13" font-weight="700" fill="#20375e">④ 三个布尔标记：放置时置 true，回退时置 false</text>

  <text x="62" y="446" font-size="10.5" fill="#4a4a4f">cols[n]（列是否被占），对应上方解：</text>
  <g font-size="10" text-anchor="middle">
    <rect x="62" y="454" width="46" height="26" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="85" y="471" fill="#2f6b4e">c0·T</text>
    <rect x="110" y="454" width="46" height="26" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="133" y="471" fill="#2f6b4e">c1·T</text>
    <rect x="158" y="454" width="46" height="26" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="181" y="471" fill="#2f6b4e">c2·T</text>
    <rect x="206" y="454" width="46" height="26" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="229" y="471" fill="#2f6b4e">c3·T</text>
  </g>

  <text x="62" y="504" font-size="10.5" fill="#4a4a4f">diags1[2n−1] 主对角线占用（本解占 {1,2,4,5}）：</text>
  <g font-size="9" text-anchor="middle">
    <rect x="62" y="512" width="30" height="24" rx="3" fill="#f6f7f9" stroke="#e4e7ec"/><text x="77" y="527" fill="#a1a1a6">0</text>
    <rect x="94" y="512" width="30" height="24" rx="3" fill="#fdf3e0" stroke="#e7c07a"/><text x="109" y="527" fill="#8a5a12">1</text>
    <rect x="126" y="512" width="30" height="24" rx="3" fill="#fdf3e0" stroke="#e7c07a"/><text x="141" y="527" fill="#8a5a12">2</text>
    <rect x="158" y="512" width="30" height="24" rx="3" fill="#f6f7f9" stroke="#e4e7ec"/><text x="173" y="527" fill="#a1a1a6">3</text>
    <rect x="190" y="512" width="30" height="24" rx="3" fill="#fdf3e0" stroke="#e7c07a"/><text x="205" y="527" fill="#8a5a12">4</text>
    <rect x="222" y="512" width="30" height="24" rx="3" fill="#fdf3e0" stroke="#e7c07a"/><text x="237" y="527" fill="#8a5a12">5</text>
    <rect x="254" y="512" width="30" height="24" rx="3" fill="#f6f7f9" stroke="#e4e7ec"/><text x="269" y="527" fill="#a1a1a6">6</text>
  </g>

  <text x="62" y="560" font-size="10.5" fill="#4a4a4f">diags2[2n−1] 副对角线占用（本解占 {1,2,4,5}）：</text>
  <g font-size="9" text-anchor="middle">
    <rect x="62" y="568" width="30" height="24" rx="3" fill="#f6f7f9" stroke="#e4e7ec"/><text x="77" y="583" fill="#a1a1a6">0</text>
    <rect x="94" y="568" width="30" height="24" rx="3" fill="#fdf3e0" stroke="#e7c07a"/><text x="109" y="583" fill="#8a5a12">1</text>
    <rect x="126" y="568" width="30" height="24" rx="3" fill="#fdf3e0" stroke="#e7c07a"/><text x="141" y="583" fill="#8a5a12">2</text>
    <rect x="158" y="568" width="30" height="24" rx="3" fill="#f6f7f9" stroke="#e4e7ec"/><text x="173" y="583" fill="#a1a1a6">3</text>
    <rect x="190" y="568" width="30" height="24" rx="3" fill="#fdf3e0" stroke="#e7c07a"/><text x="205" y="583" fill="#8a5a12">4</text>
    <rect x="222" y="568" width="30" height="24" rx="3" fill="#fdf3e0" stroke="#e7c07a"/><text x="237" y="583" fill="#8a5a12">5</text>
    <rect x="254" y="568" width="30" height="24" rx="3" fill="#f6f7f9" stroke="#e4e7ec"/><text x="269" y="583" fill="#a1a1a6">6</text>
  </g>

  <text x="62" y="622" font-size="10.5" fill="#8a4038">放置 (row,col)：三数组同时置 true；回退时同时置回 false —— 与撤销选择严格对称。</text>
  <text x="62" y="646" font-size="10.5" fill="#4a4a4f">因每行必放且只放一个，行天然不冲突，无需 rows 数组。</text>
  <text x="62" y="670" font-size="10.5" fill="#2f6b4e">row 到达 n → 棋盘填满，记录当前布局的一份深拷贝。</text>

  <!-- ===== ⑤ 判冲突 + 复杂度 ===== -->
  <rect x="568" y="392" width="516" height="300" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="590" y="418" font-size="13" font-weight="700" fill="#8a5a12">⑤ 判冲突公式与回退</text>
  <g font-family="'SF Mono','Menlo',monospace" font-size="11">
    <text x="590" y="446" fill="#20375e">diag1 = row − col + n − 1</text>
    <text x="590" y="466" fill="#20375e">diag2 = row + col</text>
    <text x="590" y="490" fill="#2f6b4e">可放 ⇔ !cols[col] 且 !diags1[diag1]</text>
    <text x="608" y="508" fill="#2f6b4e">        且 !diags2[diag2]</text>
  </g>
  <text x="590" y="540" font-size="10.5" fill="#4a4a4f">逐列尝试；三者全空才落子并深入下一行。整行无</text>
  <text x="590" y="558" font-size="10.5" fill="#4a4a4f">合法列，则本行 for 结束、回退到上一行换列。</text>

  <text x="590" y="590" font-size="11.5" font-weight="700" fill="#8a5a12">复杂度</text>
  <text x="590" y="612" font-size="10.5" fill="#4a4a4f">最坏 O(n!)：第 1 行 n 种、第 2 行至多 n−1 种…</text>
  <text x="590" y="630" font-size="10.5" fill="#4a4a4f">对角线剪枝大幅裁掉分支，实测远小于 n!。</text>
  <text x="590" y="648" font-size="10.5" fill="#4a4a4f">空间 O(n)：棋盘 + 三个标记数组 + 递归深度。</text>
  <text x="590" y="676" font-size="10.5" fill="#d1544a">冲突越早发现（列/对角线是 O(1) 判定），剪得越狠。</text>
</svg>
