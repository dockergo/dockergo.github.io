<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
  </defs>
  <rect width="1120" height="700" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">完全背包 · 物品可重复选 → 一维正序；零钱兑换是它的「求最少」变体</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">与 0-1 唯一差别：转移的「选」项引用本行 dp[i][c-w]（含物品 i 自己）而非上一行，等价于一维正序遍历容量，允许同一物品被再次选中</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">转移来源</text>
  <rect x="140" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="158" y="82" font-size="10.5" fill="#3a3a3c">完全背包（正序）</text>
  <rect x="300" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="318" y="82" font-size="10.5" fill="#3a3a3c">最终结果</text>
  <rect x="410" y="72" width="12" height="12" rx="2" fill="#8a6fd0"/><text x="428" y="82" font-size="10.5" fill="#3a3a3c">初始 ∞ / 边界</text>

  <!-- ① 转移区别 -->
  <text x="30" y="112" font-size="12" font-weight="700" fill="#8a5a12">① 与 0-1 背包的唯一区别：「选物品 i」后能否再次选它</text>

  <rect x="40" y="126" width="510" height="150" rx="12" fill="#ffffff" stroke="#4a7fd0" stroke-width="1.3" filter="url(#soft)"/>
  <text x="58" y="150" font-size="13" font-weight="700" fill="#20375e">0-1 背包（每件至多一次）</text>
  <text x="58" y="176" font-size="11" fill="#3a4a63">dp[i][c] = max( dp[i-1][c], <tspan font-weight="700">dp[i-1]</tspan>[c-w] + v )</text>
  <text x="58" y="200" font-size="10.5" fill="#4a4a4f">「选」也回到上一行 → 物品 i 在此列只出现一次</text>
  <rect x="58" y="216" width="200" height="44" rx="8" fill="#eaf1fb" stroke="#9dbdea"/>
  <text x="158" y="234" font-size="10.5" fill="#20375e" text-anchor="middle">一维压缩</text>
  <text x="158" y="251" font-size="11" font-weight="700" fill="#20375e" text-anchor="middle">容量逆序 c: cap → 1</text>
  <text x="280" y="240" font-size="9.5" fill="#6e6e73">保证 dp[c-w] 是</text>
  <text x="280" y="256" font-size="9.5" fill="#6e6e73">「不含 i」的旧值</text>

  <rect x="570" y="126" width="510" height="150" rx="12" fill="#ffffff" stroke="#d99a2b" stroke-width="1.4" filter="url(#soft)"/>
  <text x="588" y="150" font-size="13" font-weight="700" fill="#8a5a12">完全背包（每件可无限次）</text>
  <text x="588" y="176" font-size="11" fill="#5a4a2a">dp[i][c] = max( dp[i-1][c], <tspan font-weight="700">dp[i]</tspan>[c-w] + v )</text>
  <text x="588" y="200" font-size="10.5" fill="#4a4a4f">「选」引用本行 → 腾出 w 后可再选一次物品 i</text>
  <rect x="588" y="216" width="200" height="44" rx="8" fill="#fdf3e0" stroke="#e7c07a"/>
  <text x="688" y="234" font-size="10.5" fill="#8a5a12" text-anchor="middle">一维压缩</text>
  <text x="688" y="251" font-size="11" font-weight="700" fill="#8a5a12" text-anchor="middle">容量正序 c: 1 → cap</text>
  <text x="810" y="240" font-size="9.5" fill="#6e6e73">dp[c-w] 已在本轮更新</text>
  <text x="810" y="256" font-size="9.5" fill="#6e6e73">（含 i）→ 允许复选</text>

  <!-- ② 为何正序=复选 -->
  <text x="30" y="312" font-size="12" font-weight="700" fill="#8a5a12">② 正序遍历时，dp[c-w] 是本轮刚更新的值（已含物品 i），故物品 i 能被叠加多次</text>
  <rect x="40" y="326" width="1040" height="96" rx="12" fill="#fdf9f0" stroke="#e7c07a" filter="url(#soft)"/>
  <g font-size="11.5" text-anchor="middle" font-weight="700">
    <rect x="120" y="346" width="70" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="155" y="371" fill="#4a4a4f">dp[c-w]</text>
    <rect x="440" y="346" width="90" height="40" fill="#fdf3e0" stroke="#d99a2b" stroke-width="1.4"/><text x="485" y="371" fill="#8a5a12">dp[c]</text>
  </g>
  <line x1="192" y1="366" x2="436" y2="366" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="314" y="358" font-size="10" fill="#8a5a12" text-anchor="middle">dp[c] = max(dp[c], dp[c-w] + v)</text>
  <text x="560" y="356" font-size="10.5" fill="#4a4a4f">正序推进到 c 时，左边 dp[c-w] 已在同一轮（同一物品 i）被写过，</text>
  <text x="560" y="374" font-size="10.5" fill="#4a4a4f">其中可能已包含一个物品 i；再 +v 就相当于第二次放入同一物品。</text>
  <text x="560" y="400" font-size="10" font-weight="700" fill="#8a5a12">这正是完全背包想要的「可重复」，也解释了为何 0-1 必须反过来逆序。</text>

  <!-- ③ 零钱兑换 -->
  <text x="30" y="458" font-size="12" font-weight="700" fill="#8a5a12">③ 零钱兑换（求凑成金额 amt 的最少硬币数）：完全背包 + min 变体，dp[a]=min(dp[a], dp[a-coin]+1)</text>
  <text x="30" y="478" font-size="10" fill="#6e6e73">coins=[1,2,5]，amt=11；初始 dp[0]=0，其余置 ∞（代码用 amt+1 表示不可达）；硬币可重复用 → 正序遍历金额</text>

  <!-- 初始 -->
  <text x="40" y="504" font-size="10.5" font-weight="700" fill="#5b45a0">初始 dp[]（∞＝暂不可达）</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="40" y="512" width="46" height="34" fill="#d7efe1" stroke="#2f9e6e"/><text x="63" y="534" fill="#1f6b47" font-weight="700">0</text>
    <rect x="86" y="512" width="46" height="34" fill="#f0ebfb" stroke="#c9b8ec"/><text x="109" y="534" fill="#8a6fd0">∞</text>
    <rect x="132" y="512" width="46" height="34" fill="#f0ebfb" stroke="#c9b8ec"/><text x="155" y="534" fill="#8a6fd0">∞</text>
    <rect x="178" y="512" width="46" height="34" fill="#f0ebfb" stroke="#c9b8ec"/><text x="201" y="534" fill="#8a6fd0">∞</text>
    <rect x="224" y="512" width="46" height="34" fill="#f0ebfb" stroke="#c9b8ec"/><text x="247" y="534" fill="#8a6fd0">…</text>
  </g>
  <text x="63" y="558" font-size="8.5" fill="#6e6e73" text-anchor="middle">a=0</text>

  <!-- 处理 coin=1,2 后 -->
  <text x="330" y="504" font-size="10.5" font-weight="700" fill="#4a4a4f">处理 coin=1、coin=2 后</text>
  <g font-size="10" text-anchor="middle">
    <rect x="330" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="352" y="534" fill="#4a4a4f">0</text>
    <rect x="374" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="396" y="534" fill="#4a4a4f">1</text>
    <rect x="418" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="440" y="534" fill="#4a4a4f">1</text>
    <rect x="462" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="484" y="534" fill="#4a4a4f">2</text>
    <rect x="506" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="528" y="534" fill="#4a4a4f">2</text>
    <rect x="550" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="572" y="534" fill="#4a4a4f">3</text>
    <rect x="594" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="616" y="534" fill="#4a4a4f">3</text>
    <rect x="638" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="660" y="534" fill="#4a4a4f">4</text>
    <rect x="682" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="704" y="534" fill="#4a4a4f">4</text>
    <rect x="726" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="748" y="534" fill="#4a4a4f">5</text>
    <rect x="770" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="792" y="534" fill="#4a4a4f">5</text>
    <rect x="814" y="512" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="836" y="534" fill="#4a4a4f">6</text>
  </g>

  <!-- 最终 coin=5 后 -->
  <text x="330" y="580" font-size="10.5" font-weight="700" fill="#1f6b47">再处理 coin=5（正序），min 更新受益金额</text>
  <g font-size="10" text-anchor="middle">
    <rect x="330" y="588" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="352" y="610" fill="#4a4a4f">0</text>
    <rect x="374" y="588" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="396" y="610" fill="#4a4a4f">1</text>
    <rect x="418" y="588" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="440" y="610" fill="#4a4a4f">1</text>
    <rect x="462" y="588" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="484" y="610" fill="#4a4a4f">2</text>
    <rect x="506" y="588" width="44" height="34" fill="#ffffff" stroke="#e4e7ec"/><text x="528" y="610" fill="#4a4a4f">2</text>
    <rect x="550" y="588" width="44" height="34" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.4"/><text x="572" y="610" fill="#1f6b47" font-weight="700">1</text>
    <rect x="594" y="588" width="44" height="34" fill="#e6f4ec" stroke="#a8ddc3"/><text x="616" y="610" fill="#1f6b47">2</text>
    <rect x="638" y="588" width="44" height="34" fill="#e6f4ec" stroke="#a8ddc3"/><text x="660" y="610" fill="#1f6b47">2</text>
    <rect x="682" y="588" width="44" height="34" fill="#e6f4ec" stroke="#a8ddc3"/><text x="704" y="610" fill="#1f6b47">3</text>
    <rect x="726" y="588" width="44" height="34" fill="#e6f4ec" stroke="#a8ddc3"/><text x="748" y="610" fill="#1f6b47">3</text>
    <rect x="770" y="588" width="44" height="34" fill="#e6f4ec" stroke="#a8ddc3"/><text x="792" y="610" fill="#1f6b47">2</text>
    <rect x="814" y="588" width="44" height="34" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.8"/><text x="836" y="610" fill="#1f6b47" font-weight="700">3</text>
  </g>
  <g font-size="8.5" fill="#6e6e73" text-anchor="middle">
    <text x="352" y="636">0</text><text x="396" y="636">1</text><text x="440" y="636">2</text><text x="484" y="636">3</text><text x="528" y="636">4</text><text x="572" y="636">5</text><text x="616" y="636">6</text><text x="660" y="636">7</text><text x="704" y="636">8</text><text x="748" y="636">9</text><text x="792" y="636">10</text><text x="836" y="636">11</text>
  </g>
  <path d="M572 588 V566 H836 V588" fill="none" stroke="#2f9e6e" stroke-width="1.4" marker-end="url(#aG)"/>
  <text x="704" y="562" font-size="9" fill="#1f6b47" text-anchor="middle">dp[11]=min(6, dp[6]+1)=3　（5+5+1）</text>

  <!-- 右侧说明 -->
  <rect x="884" y="500" width="196" height="122" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="900" y="522" font-size="11" font-weight="700" fill="#1f6b47">读法</text>
  <text x="900" y="542" font-size="9.5" fill="#4a4a4f">dp[a]=凑成 a 的最少硬币数</text>
  <text x="900" y="560" font-size="9.5" fill="#4a4a4f">答案 dp[11]=3</text>
  <text x="900" y="582" font-size="9.5" fill="#8a4038">若 dp[amt] 仍为 ∞</text>
  <text x="900" y="598" font-size="9.5" fill="#8a4038">→ 无解，返回 -1</text>
  <text x="900" y="616" font-size="9" fill="#6e6e73">求最值：max→min，计数→步数</text>

  <text x="40" y="662" font-size="10.5" fill="#6e6e73">与「求方案数」区别：方案数用累加（dp[a]+=dp[a-coin]），求最少硬币用 min(…)+1；两者都是完全背包骨架，只换「合并算子」。</text>
  <text x="40" y="684" font-size="10" fill="#8a5a12">遍历方向由「是否可重复」决定，与求 max / min / 计数无关 —— 方向管「复选」，算子管「目标」。</text>
</svg>
