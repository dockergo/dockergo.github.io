<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">0-1 背包 · 二维 dp[i][c] 与一维逆序：dp[i][c] = max(dp[i-1][c], dp[i-1][c-w] + v)</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">每件物品「选或不选」二选一。示例 wgt=[1,2,3] val=[15,20,30] 容量 cap=5；一维压缩时容量必须逆序遍历，否则一件物品会被重复选入</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">来自上一行（不选 / 选）</text>
  <rect x="230" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="248" y="82" font-size="10.5" fill="#3a3a3c">当前格 dp[i][c]</text>
  <rect x="380" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="398" y="82" font-size="10.5" fill="#3a3a3c">逆序（正确）</text>
  <rect x="500" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="518" y="82" font-size="10.5" fill="#3a3a3c">正序（错：重复选）</text>

  <!-- ① 二维表 -->
  <text x="30" y="112" font-size="12" font-weight="700" fill="#8a5a12">① 二维 dp 表：行＝考虑前 i 件物品，列＝背包容量 c；答案 dp[3][5]</text>
  <!-- capacity header -->
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="124" width="120" height="32" fill="#eef1f5" stroke="#e4e7ec"/><text x="100" y="145" font-weight="700" fill="#3a3a3c">物品 \ 容量</text>
    <rect x="160" y="124" width="56" height="32" fill="#eef1f5" stroke="#e4e7ec"/><text x="188" y="145" fill="#3a3a3c">0</text>
    <rect x="216" y="124" width="56" height="32" fill="#eef1f5" stroke="#e4e7ec"/><text x="244" y="145" fill="#3a3a3c">1</text>
    <rect x="272" y="124" width="56" height="32" fill="#eef1f5" stroke="#e4e7ec"/><text x="300" y="145" fill="#3a3a3c">2</text>
    <rect x="328" y="124" width="56" height="32" fill="#eef1f5" stroke="#e4e7ec"/><text x="356" y="145" fill="#3a3a3c">3</text>
    <rect x="384" y="124" width="56" height="32" fill="#eef1f5" stroke="#e4e7ec"/><text x="412" y="145" fill="#3a3a3c">4</text>
    <rect x="440" y="124" width="56" height="32" fill="#eef1f5" stroke="#e4e7ec"/><text x="468" y="145" fill="#3a3a3c">5</text>
  </g>
  <!-- rows -->
  <g font-size="12" text-anchor="middle">
    <!-- i=0 无物品 -->
    <rect x="40" y="156" width="120" height="40" fill="#f7f8fa" stroke="#e4e7ec"/><text x="100" y="181" font-size="10" fill="#6e6e73">i=0（无物品）</text>
    <rect x="160" y="156" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="188" y="181" fill="#a1a1a6">0</text>
    <rect x="216" y="156" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="244" y="181" fill="#a1a1a6">0</text>
    <rect x="272" y="156" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="300" y="181" fill="#a1a1a6">0</text>
    <rect x="328" y="156" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="356" y="181" fill="#a1a1a6">0</text>
    <rect x="384" y="156" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="412" y="181" fill="#a1a1a6">0</text>
    <rect x="440" y="156" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="468" y="181" fill="#a1a1a6">0</text>
    <!-- i=1 w1 v15 -->
    <rect x="40" y="196" width="120" height="40" fill="#f7f8fa" stroke="#e4e7ec"/><text x="100" y="221" font-size="10" fill="#4a4a4f">i=1 (w1,v15)</text>
    <rect x="160" y="196" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="188" y="221" fill="#4a4a4f">0</text>
    <rect x="216" y="196" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="244" y="221" fill="#4a4a4f">15</text>
    <rect x="272" y="196" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="300" y="221" fill="#4a4a4f">15</text>
    <rect x="328" y="196" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="356" y="221" fill="#4a4a4f">15</text>
    <rect x="384" y="196" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="412" y="221" fill="#4a4a4f">15</text>
    <rect x="440" y="196" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="468" y="221" fill="#4a4a4f">15</text>
    <!-- i=2 w2 v20 -->
    <rect x="40" y="236" width="120" height="40" fill="#f7f8fa" stroke="#e4e7ec"/><text x="100" y="261" font-size="10" fill="#4a4a4f">i=2 (w2,v20)</text>
    <rect x="160" y="236" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="188" y="261" fill="#4a4a4f">0</text>
    <rect x="216" y="236" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="244" y="261" fill="#4a4a4f">15</text>
    <rect x="272" y="236" width="56" height="40" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.4"/><text x="300" y="261" fill="#20375e" font-weight="700">20</text>
    <rect x="328" y="236" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="356" y="261" fill="#4a4a4f">35</text>
    <rect x="384" y="236" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="412" y="261" fill="#4a4a4f">35</text>
    <rect x="440" y="236" width="56" height="40" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.4"/><text x="468" y="261" fill="#20375e" font-weight="700">35</text>
    <!-- i=3 w3 v30 -->
    <rect x="40" y="276" width="120" height="40" fill="#f7f8fa" stroke="#e4e7ec"/><text x="100" y="301" font-size="10" fill="#4a4a4f">i=3 (w3,v30)</text>
    <rect x="160" y="276" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="188" y="301" fill="#4a4a4f">0</text>
    <rect x="216" y="276" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="244" y="301" fill="#4a4a4f">15</text>
    <rect x="272" y="276" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="300" y="301" fill="#4a4a4f">20</text>
    <rect x="328" y="276" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="356" y="301" fill="#4a4a4f">35</text>
    <rect x="384" y="276" width="56" height="40" fill="#ffffff" stroke="#e4e7ec"/><text x="412" y="301" fill="#4a4a4f">45</text>
    <rect x="440" y="276" width="56" height="40" fill="#fdf3e0" stroke="#d99a2b" stroke-width="1.8"/><text x="468" y="301" fill="#8a5a12" font-weight="700">50</text>
  </g>
  <!-- transition arrows into dp[3][5] -->
  <path d="M468 276 V264 H468 V236" fill="none" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  <path d="M300 236 V266 H452 V284" fill="none" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aA)"/>
  <text x="512" y="256" font-size="9.5" fill="#20375e">不选③：dp[2][5]=35</text>
  <text x="512" y="272" font-size="9.5" fill="#8a5a12">选③：dp[2][5-3]+30=20+30=50</text>
  <text x="512" y="304" font-size="10" font-weight="700" fill="#8a5a12">dp[3][5]=max(35,50)=50</text>
  <text x="512" y="320" font-size="9.5" fill="#6e6e73">最优＝物品②+③（重 2+3=5，值 50）</text>

  <!-- 关键点 -->
  <rect x="512" y="130" width="568" height="98" rx="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3" filter="url(#soft)"/>
  <text x="530" y="154" font-size="12" font-weight="700" fill="#20375e">转移的两项都来自「上一行 i-1」</text>
  <text x="530" y="176" font-size="10.5" fill="#3a4a63">不选物品 i：继承 dp[i-1][c]</text>
  <text x="530" y="196" font-size="10.5" fill="#3a4a63">选物品 i：dp[i-1][c-w] + v（腾出 w 容量后的上一行状态）</text>
  <text x="530" y="216" font-size="9.5" fill="#6e6e73">因为「选」也引用 i-1 行，故每件物品在同一列决策里最多贡献一次 → 0-1 语义。</text>

  <!-- ② 一维逆序 -->
  <text x="30" y="360" font-size="12" font-weight="700" fill="#8a5a12">② 一维压缩：dp[c]=max(dp[c], dp[c-w]+v)，容量 c 必须从大到小遍历</text>
  <rect x="40" y="374" width="1040" height="150" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.3" filter="url(#soft)"/>
  <text x="60" y="398" font-size="12" font-weight="700" fill="#1f6b47">逆序 c: 5 → 1（正确）</text>
  <text x="60" y="418" font-size="10" fill="#4a4a4f">更新 dp[c] 时用到的 dp[c-w] 尚未在本轮被改写，仍是「上一行 i-1」的旧值 → 相当于二维的 dp[i-1][c-w]</text>
  <!-- 1D array, processing item i=3 (w3 v30) reverse -->
  <g font-size="12" text-anchor="middle">
    <rect x="160" y="432" width="70" height="40" fill="#e6f4ec" stroke="#a8ddc3"/><text x="195" y="457" fill="#1f6b47">0</text>
    <rect x="230" y="432" width="70" height="40" fill="#e6f4ec" stroke="#a8ddc3"/><text x="265" y="457" fill="#1f6b47">15</text>
    <rect x="300" y="432" width="70" height="40" fill="#e6f4ec" stroke="#a8ddc3"/><text x="335" y="457" fill="#1f6b47">20</text>
    <rect x="370" y="432" width="70" height="40" fill="#e6f4ec" stroke="#a8ddc3"/><text x="405" y="457" fill="#1f6b47">35</text>
    <rect x="440" y="432" width="70" height="40" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.5"/><text x="475" y="457" fill="#1f6b47" font-weight="700">45</text>
    <rect x="510" y="432" width="70" height="40" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.5"/><text x="545" y="457" fill="#1f6b47" font-weight="700">50</text>
  </g>
  <g font-size="9" fill="#6e6e73" text-anchor="middle">
    <text x="195" y="486">c=0</text><text x="265" y="486">c=1</text><text x="335" y="486">c=2</text><text x="405" y="486">c=3</text><text x="475" y="486">c=4</text><text x="545" y="486">c=5</text>
  </g>
  <line x1="560" y1="500" x2="180" y2="500" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="600" y="450" font-size="10" fill="#1f6b47">dp[5]=max(35, dp[2]+30)</text>
  <text x="600" y="466" font-size="10" fill="#1f6b47">　　 =max(35, 20+30)=50 ✓</text>
  <text x="600" y="504" font-size="10" fill="#4a4a4f">dp[2]=20 仍是旧值（本轮从 c=5 起，还没轮到 c=2）</text>
  <text x="600" y="486" font-size="9.5" fill="#6e6e73">先更新大容量，引用的小容量保持「未含物品③」的状态</text>

  <!-- ③ 为何不能正序 -->
  <text x="30" y="558" font-size="12" font-weight="700" fill="#8a5a12">③ 反例：若正序 c: 1 → 5，dp[c-w] 已被本轮更新过（含了物品③），等于物品③被重复放入</text>
  <rect x="40" y="572" width="1040" height="128" rx="12" fill="#ffffff" stroke="#d1544a" stroke-width="1.3" filter="url(#soft)"/>
  <text x="60" y="596" font-size="12" font-weight="700" fill="#8a4038">正序 c: 1 → 5（错误）</text>
  <text x="60" y="616" font-size="10.5" fill="#4a4a4f">c=3 时先把 dp[3] 更新为含物品③的 30；轮到 c=5 时 dp[5]=max(35, dp[2]+30) 本应引用旧 dp[2]，</text>
  <text x="60" y="634" font-size="10.5" fill="#4a4a4f">但如果 w 较小，dp[c-w] 会命中「本轮已放过③」的格子，导致同一件物品被计入两次。</text>
  <rect x="60" y="648" width="640" height="40" rx="8" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="76" y="672" font-size="10" fill="#8a4038">正序 = 允许同一物品被重复选 → 这恰好是「完全背包」的语义（见 DP4），而非 0-1。</text>
  <text x="720" y="628" font-size="10.5" font-weight="700" fill="#1f6b47">记忆口诀</text>
  <text x="720" y="648" font-size="10" fill="#4a4a4f">0-1 背包：一维 <tspan font-weight="700" fill="#2f9e6e">逆序</tspan> 容量</text>
  <text x="720" y="668" font-size="10" fill="#4a4a4f">完全背包：一维 <tspan font-weight="700" fill="#d99a2b">正序</tspan> 容量</text>
</svg>
