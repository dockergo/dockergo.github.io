<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a6fd0"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">动态规划 · 原理总览：两个前提 → 三件套（状态·转移·边界）→ 记忆化 / 递推 两条路线 → 滚动数组压缩</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">当递归出现「重叠子问题」且具备「最优子结构」时，把每个子问题只算一次并存表，指数级暴力递归即降为多项式</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">状态 / 转移</text>
  <rect x="150" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="168" y="82" font-size="10.5" fill="#3a3a3c">最优解路径</text>
  <rect x="270" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="288" y="82" font-size="10.5" fill="#3a3a3c">重复子问题</text>
  <rect x="390" y="72" width="12" height="12" rx="2" fill="#8a6fd0"/><text x="408" y="82" font-size="10.5" fill="#3a3a3c">dp 表 / 边界</text>
  <rect x="500" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="518" y="82" font-size="10.5" fill="#3a3a3c">DP 核心步骤</text>

  <!-- ===== ① 两个前提 ===== -->
  <text x="30" y="112" font-size="12" font-weight="700" fill="#8a5a12">① 何时能用 DP：必须同时满足两个前提</text>

  <!-- 重叠子问题 -->
  <rect x="40" y="126" width="520" height="128" rx="12" fill="#ffffff" stroke="#d1544a" stroke-width="1.4" filter="url(#soft)"/>
  <text x="58" y="150" font-size="13" font-weight="700" fill="#8a4038">重叠子问题 Overlapping</text>
  <text x="58" y="170" font-size="10.5" fill="#4a4a4f">同一子问题在递归树中被反复求解 → 有复用价值</text>
  <!-- mini tree -->
  <rect x="250" y="132" width="40" height="22" rx="5" fill="#eaf1fb" stroke="#4a7fd0"/><text x="270" y="147" font-size="10" fill="#20375e" text-anchor="middle">f(5)</text>
  <rect x="330" y="176" width="40" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="350" y="191" font-size="10" fill="#20375e" text-anchor="middle">f(4)</text>
  <rect x="470" y="176" width="40" height="22" rx="5" fill="#fbe6e3" stroke="#d1544a"/><text x="490" y="191" font-size="10" fill="#8a4038" text-anchor="middle">f(3)</text>
  <rect x="300" y="220" width="40" height="22" rx="5" fill="#fbe6e3" stroke="#d1544a"/><text x="320" y="235" font-size="10" fill="#8a4038" text-anchor="middle">f(3)</text>
  <rect x="380" y="220" width="40" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="400" y="235" font-size="10" fill="#20375e" text-anchor="middle">f(2)</text>
  <path d="M270 154 V165 H350 V176" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M270 154 V165 H490 V176" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M350 198 V209 H320 V220" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M350 198 V209 H400 V220" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <text x="416" y="235" font-size="9" fill="#8a4038">← f(3) 被算两次</text>

  <!-- 最优子结构 -->
  <rect x="580" y="126" width="500" height="128" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.4" filter="url(#soft)"/>
  <text x="598" y="150" font-size="13" font-weight="700" fill="#1f6b47">最优子结构 Optimal Substructure</text>
  <text x="598" y="170" font-size="10.5" fill="#4a4a4f">原问题的最优解，可由子问题的最优解组合而成</text>
  <rect x="598" y="184" width="150" height="30" rx="6" fill="#e6f4ec" stroke="#a8ddc3"/><text x="673" y="204" font-size="10.5" fill="#1f6b47" text-anchor="middle">子问题最优</text>
  <rect x="770" y="184" width="150" height="30" rx="6" fill="#e6f4ec" stroke="#a8ddc3"/><text x="845" y="204" font-size="10.5" fill="#1f6b47" text-anchor="middle">子问题最优</text>
  <rect x="942" y="184" width="120" height="30" rx="6" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.3"/><text x="1002" y="204" font-size="10.5" font-weight="700" fill="#1f6b47" text-anchor="middle">原问题最优</text>
  <line x1="748" y1="199" x2="768" y2="199" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#aG)"/>
  <line x1="920" y1="199" x2="940" y2="199" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="598" y="236" font-size="9.5" fill="#6e6e73">反例：含「不能拆分独立」的约束（如最长非降子序列的连锁依赖）需重设状态</text>

  <!-- ===== ② 三件套 ===== -->
  <text x="30" y="288" font-size="12" font-weight="700" fill="#8a5a12">② DP 三件套：把「怎么递归」翻译成「怎么填表」</text>

  <rect x="40" y="302" width="336" height="96" rx="12" fill="#fdf3e0" stroke="#e7c07a" filter="url(#soft)"/>
  <text x="58" y="326" font-size="13" font-weight="700" fill="#8a5a12">状态定义　dp[i]</text>
  <text x="58" y="348" font-size="10.5" fill="#5a4a2a">用几维下标唯一刻画一个子问题，</text>
  <text x="58" y="365" font-size="10.5" fill="#5a4a2a">dp[i] = 到达状态 i 的最优值 / 方案数</text>
  <text x="58" y="386" font-size="9.5" fill="#8a5a12">选对状态是全题关键，维度越少越省</text>

  <rect x="392" y="302" width="336" height="96" rx="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3" filter="url(#soft)"/>
  <text x="410" y="326" font-size="13" font-weight="700" fill="#20375e">转移方程　dp[i] ← dp[…]</text>
  <text x="410" y="348" font-size="10.5" fill="#3a4a63">当前状态如何由更小的已知状态推出，</text>
  <text x="410" y="365" font-size="10.5" fill="#3a4a63">如 dp[i]=dp[i-1]+dp[i-2]（累加 / min / max）</text>
  <text x="410" y="386" font-size="9.5" fill="#20375e">递推关系即原递归式，去掉重复计算</text>

  <rect x="744" y="302" width="336" height="96" rx="12" fill="#f0ebfb" stroke="#8a6fd0" stroke-width="1.3" filter="url(#soft)"/>
  <text x="762" y="326" font-size="13" font-weight="700" fill="#5b45a0">边界 / 初始状态</text>
  <text x="762" y="348" font-size="10.5" fill="#4a4258">最小子问题的解直接给定，如 dp[1]、</text>
  <text x="762" y="365" font-size="10.5" fill="#4a4258">首行首列；对应递归的 base case</text>
  <text x="762" y="386" font-size="9.5" fill="#5b45a0">边界错一格，全表皆错</text>

  <!-- ===== ③ 两条路线 ===== -->
  <text x="30" y="432" font-size="12" font-weight="700" fill="#8a5a12">③ 两条实现路线：算的是同一张 dp 表，方向相反</text>

  <!-- 记忆化 自顶向下 -->
  <rect x="40" y="446" width="520" height="184" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="58" y="470" font-size="13" font-weight="700" fill="#20375e">记忆化搜索 · 自顶向下</text>
  <text x="58" y="490" font-size="10.5" fill="#4a4a4f">保留递归写法，首次算出子问题后存入 mem[]，</text>
  <text x="58" y="507" font-size="10.5" fill="#4a4a4f">再遇到直接返回 → 剪掉重复子树</text>
  <!-- direction -->
  <rect x="58" y="524" width="130" height="30" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/><text x="123" y="544" font-size="11" font-weight="700" fill="#20375e" text-anchor="middle">dp[n] 大问题</text>
  <rect x="358" y="524" width="130" height="30" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="423" y="544" font-size="11" fill="#20375e" text-anchor="middle">dp[1] 边界</text>
  <line x1="192" y1="539" x2="354" y2="539" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="273" y="533" font-size="9.5" fill="#20375e" text-anchor="middle">按需递归下探</text>
  <line x1="354" y1="574" x2="192" y2="574" stroke="#8a6fd0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aP)"/>
  <text x="273" y="592" font-size="9.5" fill="#5b45a0" text-anchor="middle">触底后回填 mem[] 逐层返回</text>
  <text x="58" y="616" font-size="9.5" fill="#6e6e73">优点：只算真正用到的状态；缺点：递归栈开销、可能栈溢出</text>

  <!-- 递推 自底向上 -->
  <rect x="580" y="446" width="500" height="184" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="598" y="470" font-size="13" font-weight="700" fill="#1f6b47">递推填表 · 自底向上</text>
  <text x="598" y="490" font-size="10.5" fill="#4a4a4f">从边界出发，按下标顺序循环填满 dp[]，</text>
  <text x="598" y="507" font-size="10.5" fill="#4a4a4f">求 dp[i] 时其依赖项都已算好 → 无递归</text>
  <rect x="598" y="524" width="120" height="30" rx="6" fill="#e6f4ec" stroke="#a8ddc3"/><text x="658" y="544" font-size="11" fill="#1f6b47" text-anchor="middle">dp[1] 边界</text>
  <rect x="878" y="524" width="120" height="30" rx="6" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.3"/><text x="938" y="544" font-size="11" font-weight="700" fill="#1f6b47" text-anchor="middle">dp[n] 答案</text>
  <line x1="722" y1="539" x2="874" y2="539" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="798" y="533" font-size="9.5" fill="#1f6b47" text-anchor="middle">for i：小 → 大 顺序推进</text>
  <text x="598" y="592" font-size="9.5" fill="#6e6e73">优点：无栈开销、常数更小、可就地压缩空间；缺点：会算全部状态</text>
  <text x="598" y="616" font-size="9.5" fill="#6e6e73">多数题目首选递推：结构清晰，且便于下一步做滚动数组</text>

  <!-- ===== ④ 空间压缩 ===== -->
  <text x="30" y="662" font-size="12" font-weight="700" fill="#8a5a12">④ 空间压缩：转移只依赖最近几个状态时，用滚动数组 / 少数变量把 O(n) 或 O(nm) 降到 O(1) / O(m)</text>
  <rect x="40" y="674" width="150" height="28" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="115" y="693" font-size="10.5" fill="#8a5a12" text-anchor="middle">dp[] 整表</text>
  <line x1="196" y1="688" x2="236" y2="688" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <rect x="242" y="674" width="230" height="28" rx="6" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.3"/><text x="357" y="693" font-size="10.5" fill="#1f6b47" text-anchor="middle">两个变量 a,b（爬楼梯）</text>
  <text x="492" y="693" font-size="10" fill="#6e6e73">二维表按行滚动 → 一维（背包 / 编辑距离）；代价是丢失回溯路径所需的历史。</text>
</svg>
