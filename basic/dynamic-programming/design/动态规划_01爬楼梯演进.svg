<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">爬楼梯 · 四步演进：暴力回溯 → 记忆化 → DP 递推 → 状态压缩（n 阶，每步跨 1 或 2 阶）</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">同一递推式 dp[i]=dp[i-1]+dp[i-2]（边界 dp[1]=1, dp[2]=2）；重叠子问题让暴力递归指数爆炸，逐步剪掉重复、去掉递归、压缩空间</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">子问题 / 状态</text>
  <rect x="160" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="178" y="82" font-size="10.5" fill="#3a3a3c">重复子树（被剪）</text>
  <rect x="300" y="72" width="12" height="12" rx="2" fill="#8a6fd0"/><text x="318" y="82" font-size="10.5" fill="#3a3a3c">边界 dp[1],dp[2]</text>
  <rect x="430" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="448" y="82" font-size="10.5" fill="#3a3a3c">推进方向 / 结果</text>

  <!-- ===== Step 1 暴力回溯 ===== -->
  <rect x="30" y="98" width="530" height="296" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="122" font-size="13" font-weight="700" fill="#8a4038">① 暴力回溯：递归树重复展开　O(2ⁿ)</text>
  <text x="48" y="141" font-size="10" fill="#6e6e73">climb(i)=climb(i-1)+climb(i-2)，同一 climb(3) 子树被整块重算</text>
  <!-- tree n=5 -->
  <g font-size="10" text-anchor="middle">
    <rect x="255" y="152" width="46" height="22" rx="5" fill="#eaf1fb" stroke="#4a7fd0"/><text x="278" y="167" fill="#20375e">c(5)</text>
    <rect x="150" y="200" width="46" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="173" y="215" fill="#20375e">c(4)</text>
    <rect x="380" y="200" width="46" height="22" rx="5" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.4"/><text x="403" y="215" fill="#8a4038">c(3)</text>
    <rect x="95" y="248" width="46" height="22" rx="5" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.4"/><text x="118" y="263" fill="#8a4038">c(3)</text>
    <rect x="205" y="248" width="46" height="22" rx="5" fill="#f0ebfb" stroke="#8a6fd0"/><text x="228" y="263" fill="#5b45a0">c(2)</text>
    <rect x="325" y="248" width="46" height="22" rx="5" fill="#f0ebfb" stroke="#8a6fd0"/><text x="348" y="263" fill="#5b45a0">c(2)</text>
    <rect x="435" y="248" width="46" height="22" rx="5" fill="#f0ebfb" stroke="#8a6fd0"/><text x="458" y="263" fill="#5b45a0">c(1)</text>
    <rect x="55" y="296" width="46" height="22" rx="5" fill="#f0ebfb" stroke="#8a6fd0"/><text x="78" y="311" fill="#5b45a0">c(2)</text>
    <rect x="135" y="296" width="46" height="22" rx="5" fill="#f0ebfb" stroke="#8a6fd0"/><text x="158" y="311" fill="#5b45a0">c(1)</text>
  </g>
  <path d="M278 174 V187 H173 V200" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M278 174 V187 H403 V200" fill="none" stroke="#d1544a" stroke-width="1.3"/>
  <path d="M173 222 V235 H118 V248" fill="none" stroke="#d1544a" stroke-width="1.3"/>
  <path d="M173 222 V235 H228 V248" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M403 222 V235 H348 V248" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M403 222 V235 H458 V248" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M118 270 V283 H78 V296" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M118 270 V283 H158 V296" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <rect x="360" y="288" width="180" height="46" rx="8" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="450" y="308" font-size="10" fill="#8a4038" text-anchor="middle">两个 c(3) 子树完全相同</text>
  <text x="450" y="324" font-size="10" font-weight="700" fill="#d1544a" text-anchor="middle">→ 指数级重复计算</text>

  <!-- ===== Step 2 记忆化 ===== -->
  <rect x="580" y="98" width="510" height="296" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="598" y="122" font-size="13" font-weight="700" fill="#20375e">② 记忆化搜索：mem[] 缓存，重复即返回　O(n)</text>
  <text x="598" y="141" font-size="10" fill="#6e6e73">首次算出 dp[i] 存入 mem[i]；再遇到直接读表，剪掉整棵重复子树</text>
  <g font-size="10" text-anchor="middle">
    <rect x="790" y="152" width="46" height="22" rx="5" fill="#eaf1fb" stroke="#4a7fd0"/><text x="813" y="167" fill="#20375e">c(5)</text>
    <rect x="690" y="200" width="46" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="713" y="215" fill="#20375e">c(4)</text>
    <rect x="900" y="200" width="90" height="22" rx="5" fill="#e6f4ec" stroke="#2f9e6e"/><text x="945" y="215" fill="#1f6b47">c(3) 读 mem</text>
    <rect x="635" y="248" width="46" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="658" y="263" fill="#20375e">c(3)</text>
    <rect x="745" y="248" width="90" height="22" rx="5" fill="#e6f4ec" stroke="#2f9e6e"/><text x="790" y="263" fill="#1f6b47">c(2) 读 mem</text>
  </g>
  <path d="M813 174 V187 H713 V200" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M813 174 V187 H945 V200" fill="none" stroke="#2f9e6e" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M713 222 V235 H658 V248" fill="none" stroke="#b7c6dc" stroke-width="1.2"/>
  <path d="M713 222 V235 H790 V248" fill="none" stroke="#2f9e6e" stroke-width="1.3" stroke-dasharray="4 3"/>
  <!-- mem array -->
  <text x="598" y="300" font-size="10.5" font-weight="700" fill="#8a5a12">mem[] 缓存表</text>
  <g font-size="10" text-anchor="middle">
    <rect x="598" y="310" width="54" height="30" fill="#f0ebfb" stroke="#8a6fd0"/><text x="625" y="329" fill="#5b45a0">1</text>
    <rect x="652" y="310" width="54" height="30" fill="#f0ebfb" stroke="#8a6fd0"/><text x="679" y="329" fill="#5b45a0">2</text>
    <rect x="706" y="310" width="54" height="30" fill="#fdf3e0" stroke="#e7c07a"/><text x="733" y="329" fill="#8a5a12">3</text>
    <rect x="760" y="310" width="54" height="30" fill="#fdf3e0" stroke="#e7c07a"/><text x="787" y="329" fill="#8a5a12">5</text>
    <rect x="814" y="310" width="54" height="30" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.3"/><text x="841" y="329" fill="#1f6b47" font-weight="700">8</text>
  </g>
  <g font-size="9" fill="#6e6e73" text-anchor="middle">
    <text x="625" y="354">i=1</text><text x="679" y="354">i=2</text><text x="733" y="354">i=3</text><text x="787" y="354">i=4</text><text x="841" y="354">i=5</text>
  </g>
  <text x="884" y="323" font-size="10" fill="#1f6b47">← 每个子问题只算一次</text>
  <text x="884" y="337" font-size="9.5" fill="#6e6e73">递归数从 O(2ⁿ) 降到 O(n)</text>

  <!-- ===== Step 3 DP 递推 ===== -->
  <rect x="30" y="410" width="530" height="286" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="434" font-size="13" font-weight="700" fill="#8a5a12">③ DP 递推：去掉递归，自底向上填 dp[]　O(n) 时间 / O(n) 空间</text>
  <text x="48" y="453" font-size="10" fill="#6e6e73">初始 dp[1]=1, dp[2]=2；for i=3..n：dp[i]=dp[i-1]+dp[i-2]，返回 dp[n]</text>
  <g font-size="13" text-anchor="middle" font-weight="700">
    <rect x="50" y="470" width="90" height="46" rx="6" fill="#f0ebfb" stroke="#8a6fd0" stroke-width="1.3"/><text x="95" y="499" fill="#5b45a0">1</text>
    <rect x="150" y="470" width="90" height="46" rx="6" fill="#f0ebfb" stroke="#8a6fd0" stroke-width="1.3"/><text x="195" y="499" fill="#5b45a0">2</text>
    <rect x="250" y="470" width="90" height="46" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="295" y="499" fill="#8a5a12">3</text>
    <rect x="350" y="470" width="90" height="46" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="395" y="499" fill="#8a5a12">5</text>
    <rect x="450" y="470" width="90" height="46" rx="6" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.4"/><text x="495" y="499" fill="#1f6b47">8</text>
  </g>
  <g font-size="9.5" fill="#6e6e73" text-anchor="middle">
    <text x="95" y="532">dp[1] 边界</text><text x="195" y="532">dp[2] 边界</text><text x="295" y="532">dp[3]</text><text x="395" y="532">dp[4]</text><text x="495" y="532">dp[5]=答案</text>
  </g>
  <!-- transition arcs -->
  <path d="M195 470 V456 H295 V470" fill="none" stroke="#4a7fd0" stroke-width="1.5" marker-end="url(#aB)"/>
  <path d="M95 462 V450 H295 V470" fill="none" stroke="#4a7fd0" stroke-width="1.5" marker-end="url(#aB)"/>
  <text x="200" y="446" font-size="9" fill="#20375e">dp[3]=dp[2]+dp[1]</text>
  <path d="M395 470 V456 H495 V470" fill="none" stroke="#4a7fd0" stroke-width="1.5" marker-end="url(#aB)"/>
  <path d="M295 462 V450 H495 V470" fill="none" stroke="#4a7fd0" stroke-width="1.5" marker-end="url(#aB)"/>
  <text x="400" y="446" font-size="9" fill="#20375e">dp[5]=dp[4]+dp[3]</text>
  <line x1="60" y1="560" x2="530" y2="560" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="60" y="554" font-size="9.5" fill="#1f6b47">填表方向：下标从小到大，求 dp[i] 时依赖项已就绪</text>
  <text x="48" y="590" font-size="10" fill="#4a4a4f">每格恰好算一次、每次 O(1)；对比暴力，重复计算被彻底消除。</text>
  <text x="48" y="614" font-size="10" fill="#6e6e73">此形态最通用：状态一目了然，且是做「空间压缩」的起点。</text>
  <rect x="48" y="632" width="490" height="48" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="64" y="653" font-size="9.5" fill="#4a4a4f">观察：dp[i] 只用到前两格 dp[i-1]、dp[i-2] —— 整张表其实不必全留，</text>
  <text x="64" y="670" font-size="9.5" fill="#8a5a12" font-weight="700">只需滚动保存最近两个值即可 → 见 ④ 状态压缩</text>

  <!-- ===== Step 4 状态压缩 ===== -->
  <rect x="580" y="410" width="510" height="286" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="598" y="434" font-size="13" font-weight="700" fill="#8a5a12">④ 状态压缩：两个变量滚动　O(n) 时间 / O(1) 空间</text>
  <text x="598" y="453" font-size="10" fill="#6e6e73">a,b := 1,2；for i=3..n：a,b = b, a+b，返回 b（不再需要整张表）</text>
  <!-- rolling table -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="600" y="470" width="90" height="30" fill="#eef1f5" stroke="#e4e7ec"/><text x="645" y="490" font-weight="700" fill="#3a3a3c">步骤</text>
    <rect x="690" y="470" width="130" height="30" fill="#eef1f5" stroke="#e4e7ec"/><text x="755" y="490" font-weight="700" fill="#3a3a3c">a = dp[i-2]</text>
    <rect x="820" y="470" width="130" height="30" fill="#eef1f5" stroke="#e4e7ec"/><text x="885" y="490" font-weight="700" fill="#3a3a3c">b = dp[i-1]</text>
    <rect x="950" y="470" width="130" height="30" fill="#eef1f5" stroke="#e4e7ec"/><text x="1015" y="490" font-weight="700" fill="#3a3a3c">b' = a+b</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <rect x="600" y="500" width="90" height="30" fill="#f0ebfb" stroke="#d8cef0"/><text x="645" y="520" fill="#5b45a0">初始</text>
    <rect x="690" y="500" width="130" height="30" fill="#ffffff" stroke="#e4e7ec"/><text x="755" y="520" fill="#5b45a0">1</text>
    <rect x="820" y="500" width="130" height="30" fill="#ffffff" stroke="#e4e7ec"/><text x="885" y="520" fill="#5b45a0">2</text>
    <rect x="950" y="500" width="130" height="30" fill="#ffffff" stroke="#e4e7ec"/><text x="1015" y="520" fill="#a1a1a6">—</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <rect x="600" y="530" width="90" height="30" fill="#fafbfc" stroke="#e4e7ec"/><text x="645" y="550" fill="#8a5a12">i=3</text>
    <rect x="690" y="530" width="130" height="30" fill="#ffffff" stroke="#e4e7ec"/><text x="755" y="550" fill="#4a4a4f">1</text>
    <rect x="820" y="530" width="130" height="30" fill="#ffffff" stroke="#e4e7ec"/><text x="885" y="550" fill="#4a4a4f">2</text>
    <rect x="950" y="530" width="130" height="30" fill="#fdf3e0" stroke="#e7c07a"/><text x="1015" y="550" font-weight="700" fill="#8a5a12">3</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <rect x="600" y="560" width="90" height="30" fill="#fafbfc" stroke="#e4e7ec"/><text x="645" y="580" fill="#8a5a12">i=4</text>
    <rect x="690" y="560" width="130" height="30" fill="#ffffff" stroke="#e4e7ec"/><text x="755" y="580" fill="#4a4a4f">2</text>
    <rect x="820" y="560" width="130" height="30" fill="#ffffff" stroke="#e4e7ec"/><text x="885" y="580" fill="#4a4a4f">3</text>
    <rect x="950" y="560" width="130" height="30" fill="#fdf3e0" stroke="#e7c07a"/><text x="1015" y="580" font-weight="700" fill="#8a5a12">5</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <rect x="600" y="590" width="90" height="30" fill="#fafbfc" stroke="#e4e7ec"/><text x="645" y="610" fill="#8a5a12">i=5</text>
    <rect x="690" y="590" width="130" height="30" fill="#ffffff" stroke="#e4e7ec"/><text x="755" y="610" fill="#4a4a4f">3</text>
    <rect x="820" y="590" width="130" height="30" fill="#ffffff" stroke="#e4e7ec"/><text x="885" y="610" fill="#4a4a4f">5</text>
    <rect x="950" y="590" width="130" height="30" fill="#d7efe1" stroke="#2f9e6e" stroke-width="1.3"/><text x="1015" y="610" font-weight="700" fill="#1f6b47">8</text>
  </g>
  <path d="M885 545 H960 V500 L940 500" fill="none" stroke="#4a7fd0" stroke-width="1.3"/>
  <text x="598" y="646" font-size="10" fill="#4a4a4f">每轮 b 前移成 a、新和成 b，只保留窗口内两个值。</text>
  <text x="598" y="668" font-size="10" font-weight="700" fill="#1f6b47">结果 b=8，与整表 dp[5] 一致，空间由 O(n) 降到 O(1)。</text>
  <text x="598" y="686" font-size="9.5" fill="#6e6e73">代价：丢弃了历史，无法再回溯「具体走法」，只保留计数结果。</text>
</svg>
