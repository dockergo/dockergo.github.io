<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1120" height="620" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="16" font-weight="700" fill="#1d1d1f">对比 · 数组 / 链表 / 动态数组：五维取舍矩阵</text>
  <text x="30" y="55" font-size="10.5" fill="#6e6e73">同一份代价，换个维度看就此消彼长 —— 数组以搬移换直达，链表以遍历换灵活增删，动态数组在数组上补齐弹性</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="48" y="82" font-size="10" fill="#3a3a3c">优 / O(1)</text>
  <rect x="150" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="168" y="82" font-size="10" fill="#3a3a3c">有条件 / 折中</text>
  <rect x="300" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="318" y="82" font-size="10" fill="#3a3a3c">差 / O(n)</text>

  <!-- 列头 -->
  <rect x="248" y="104" width="264" height="40" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/><text x="380" y="129" font-size="13" font-weight="700" text-anchor="middle" fill="#20375e">数组（定长）</text>
  <rect x="528" y="104" width="264" height="40" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/><text x="660" y="129" font-size="13" font-weight="700" text-anchor="middle" fill="#20375e">链表（单向）</text>
  <rect x="808" y="104" width="264" height="40" rx="8" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="940" y="129" font-size="13" font-weight="700" text-anchor="middle" fill="#20375e">动态数组</text>

  <!-- 维度标签 -->
  <g font-size="11.5" font-weight="700" fill="#20375e">
    <text x="45" y="184">随机访问</text><text x="45" y="256">头部插入</text><text x="45" y="328">中间插入 / 删除</text><text x="45" y="400">内存布局</text><text x="45" y="472">缓存友好度</text>
  </g>
  <g font-size="8.5" fill="#8a97ab">
    <text x="45" y="200">按下标定位</text><text x="45" y="272">在位置 0 插入</text><text x="45" y="344">任意中间位置</text><text x="45" y="416">物理排布方式</text><text x="45" y="488">局部性 / 命中率</text>
  </g>

  <!-- ===== Row1 随机访问 ===== -->
  <rect x="248" y="158" width="264" height="56" rx="8" fill="#eafaf2" stroke="#bfe6d3"/><text x="380" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#2f6b4e">O(1)</text><text x="380" y="203" font-size="9.5" text-anchor="middle" fill="#2f6b4e">地址公式直达</text>
  <rect x="528" y="158" width="264" height="56" rx="8" fill="#fbecea" stroke="#eec5c0"/><text x="660" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#8a4038">O(n)</text><text x="660" y="203" font-size="9.5" text-anchor="middle" fill="#8a4038">从头逐跳遍历</text>
  <rect x="808" y="158" width="264" height="56" rx="8" fill="#eafaf2" stroke="#bfe6d3"/><text x="940" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#2f6b4e">O(1)</text><text x="940" y="203" font-size="9.5" text-anchor="middle" fill="#2f6b4e">底层仍是数组</text>

  <!-- ===== Row2 头部插入 ===== -->
  <rect x="248" y="230" width="264" height="56" rx="8" fill="#fbecea" stroke="#eec5c0"/><text x="380" y="256" font-size="15" font-weight="700" text-anchor="middle" fill="#8a4038">O(n)</text><text x="380" y="275" font-size="9.5" text-anchor="middle" fill="#8a4038">后续元素全体右移</text>
  <rect x="528" y="230" width="264" height="56" rx="8" fill="#eafaf2" stroke="#bfe6d3"/><text x="660" y="256" font-size="15" font-weight="700" text-anchor="middle" fill="#2f6b4e">O(1)</text><text x="660" y="275" font-size="9.5" text-anchor="middle" fill="#2f6b4e">只改头指针</text>
  <rect x="808" y="230" width="264" height="56" rx="8" fill="#fbecea" stroke="#eec5c0"/><text x="940" y="256" font-size="15" font-weight="700" text-anchor="middle" fill="#8a4038">O(n)</text><text x="940" y="275" font-size="9.5" text-anchor="middle" fill="#8a4038">同数组需右移</text>

  <!-- ===== Row3 中间插入/删除 ===== -->
  <rect x="248" y="302" width="264" height="56" rx="8" fill="#fbecea" stroke="#eec5c0"/><text x="380" y="328" font-size="15" font-weight="700" text-anchor="middle" fill="#8a4038">O(n)</text><text x="380" y="347" font-size="9.5" text-anchor="middle" fill="#8a4038">搬移后续元素</text>
  <rect x="528" y="302" width="264" height="56" rx="8" fill="#fdf4ea" stroke="#eecfa0"/><text x="660" y="328" font-size="15" font-weight="700" text-anchor="middle" fill="#9a7420">O(1)*</text><text x="660" y="347" font-size="9.5" text-anchor="middle" fill="#9a7420">改指针 O(1)·定位 O(n)</text>
  <rect x="808" y="302" width="264" height="56" rx="8" fill="#fbecea" stroke="#eec5c0"/><text x="940" y="328" font-size="15" font-weight="700" text-anchor="middle" fill="#8a4038">O(n)</text><text x="940" y="347" font-size="9.5" text-anchor="middle" fill="#8a4038">搬移 / 或触发扩容</text>

  <!-- ===== Row4 内存布局 ===== -->
  <rect x="248" y="374" width="264" height="56" rx="8" fill="#eafaf2" stroke="#bfe6d3"/><text x="380" y="400" font-size="14" font-weight="700" text-anchor="middle" fill="#2f6b4e">连续</text><text x="380" y="419" font-size="9.5" text-anchor="middle" fill="#2f6b4e">紧凑，无额外开销</text>
  <rect x="528" y="374" width="264" height="56" rx="8" fill="#fbecea" stroke="#eec5c0"/><text x="660" y="400" font-size="14" font-weight="700" text-anchor="middle" fill="#8a4038">离散</text><text x="660" y="419" font-size="9.5" text-anchor="middle" fill="#8a4038">每结点额外存指针</text>
  <rect x="808" y="374" width="264" height="56" rx="8" fill="#fdf4ea" stroke="#eecfa0"/><text x="940" y="400" font-size="14" font-weight="700" text-anchor="middle" fill="#9a7420">连续</text><text x="940" y="419" font-size="9.5" text-anchor="middle" fill="#9a7420">含预留冗余容量</text>

  <!-- ===== Row5 缓存友好 ===== -->
  <rect x="248" y="446" width="264" height="56" rx="8" fill="#eafaf2" stroke="#bfe6d3"/><text x="380" y="472" font-size="14" font-weight="700" text-anchor="middle" fill="#2f6b4e">高</text><text x="380" y="491" font-size="9.5" text-anchor="middle" fill="#2f6b4e">顺序访问命中率高</text>
  <rect x="528" y="446" width="264" height="56" rx="8" fill="#fbecea" stroke="#eec5c0"/><text x="660" y="472" font-size="14" font-weight="700" text-anchor="middle" fill="#8a4038">低</text><text x="660" y="491" font-size="9.5" text-anchor="middle" fill="#8a4038">地址跳跃，频繁未命中</text>
  <rect x="808" y="446" width="264" height="56" rx="8" fill="#eafaf2" stroke="#bfe6d3"/><text x="940" y="472" font-size="14" font-weight="700" text-anchor="middle" fill="#2f6b4e">高</text><text x="940" y="491" font-size="9.5" text-anchor="middle" fill="#2f6b4e">连续布局同样受益</text>

  <!-- 底部选型 -->
  <rect x="30" y="522" width="1042" height="76" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="48" y="548" font-size="11" font-weight="700" fill="#20375e">选型一句话</text>
  <text x="48" y="570" font-size="10.5" fill="#4a4a4f">读多写少、需随机访问 → 数组 / 动态数组；两端频繁增删、长度多变且不靠下标定位 → 链表。</text>
  <text x="48" y="590" font-size="10.5" fill="#4a4a4f">拿不准就用动态数组：绝大多数场景下缓存友好 + 尾插均摊 O(1)，是工程默认（Go slice、C++ vector、Java ArrayList）。</text>
</svg>
