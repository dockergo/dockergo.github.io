<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">堆 · 原理总览：用数组隐式存储的完全二叉树，堆顶恒为极值</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">只保证父子偏序（兄弟间无序）；结点在层序中的序号 = 数组下标，故父子索引可直接算出，无需指针。本图以大顶堆 [9,7,6,5,2,4] 贯穿</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">树形视图 / 父子关系</text>
  <rect x="210" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="228" y="82" font-size="10.5" fill="#3a3a3c">数组视图 / 隐式存储</text>
  <rect x="390" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="408" y="82" font-size="10.5" fill="#3a3a3c">堆顶 = 极值出口</text>

  <!-- ===== 树形视图 ===== -->
  <text x="40" y="118" font-size="12" font-weight="700" fill="#20375e">① 逻辑：完全二叉树（层序从上到下、从左到右填满）</text>

  <!-- 边 -->
  <g stroke="#9dbdea" stroke-width="1.6">
    <line x1="230" y1="168" x2="150" y2="238"/>
    <line x1="230" y1="168" x2="330" y2="238"/>
    <line x1="150" y1="258" x2="100" y2="320"/>
    <line x1="150" y1="258" x2="210" y2="320"/>
    <line x1="330" y1="258" x2="300" y2="320"/>
  </g>
  <!-- 结点：value(大)+index(小) -->
  <g text-anchor="middle">
    <circle cx="230" cy="150" r="24" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="230" y="150" font-size="15" font-weight="700" fill="#20375e">9</text><text x="230" y="164" font-size="8.5" fill="#5a7099">i=0</text>
    <circle cx="150" cy="238" r="24" fill="#eaf1fb" stroke="#9dbdea"/><text x="150" y="238" font-size="15" font-weight="700" fill="#20375e">7</text><text x="150" y="252" font-size="8.5" fill="#5a7099">i=1</text>
    <circle cx="330" cy="238" r="24" fill="#eaf1fb" stroke="#9dbdea"/><text x="330" y="238" font-size="15" font-weight="700" fill="#20375e">6</text><text x="330" y="252" font-size="8.5" fill="#5a7099">i=2</text>
    <circle cx="100" cy="340" r="22" fill="#f2f7ff" stroke="#c6d9f2"/><text x="100" y="340" font-size="14" font-weight="700" fill="#20375e">5</text><text x="100" y="353" font-size="8.5" fill="#5a7099">i=3</text>
    <circle cx="210" cy="340" r="22" fill="#f2f7ff" stroke="#c6d9f2"/><text x="210" y="340" font-size="14" font-weight="700" fill="#20375e">2</text><text x="210" y="353" font-size="8.5" fill="#5a7099">i=4</text>
    <circle cx="300" cy="340" r="22" fill="#f2f7ff" stroke="#c6d9f2"/><text x="300" y="340" font-size="14" font-weight="700" fill="#20375e">4</text><text x="300" y="353" font-size="8.5" fill="#5a7099">i=5</text>
  </g>
  <text x="230" y="126" font-size="9.5" fill="#2f6b4e" text-anchor="middle">↓ 堆顶 = 最大值</text>
  <text x="40" y="392" font-size="10" fill="#6e6e73">偏序：每个父 ≥ 两个子（大顶堆）。兄弟 7 与 6 谁大不关心 —— 这份「松」正是 O(log n) 维护的来由。</text>

  <!-- ===== 数组视图 ===== -->
  <text x="560" y="118" font-size="12" font-weight="700" fill="#8a5a12">② 存储：层序拍平进数组 data[]（无指针、无空洞）</text>
  <g font-size="15" text-anchor="middle">
    <rect x="560" y="150" width="80" height="46" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="600" y="180" fill="#5a4a2a" font-weight="700">9</text>
    <rect x="640" y="150" width="80" height="46" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="680" y="180" fill="#5a4a2a" font-weight="700">7</text>
    <rect x="720" y="150" width="80" height="46" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="760" y="180" fill="#5a4a2a" font-weight="700">6</text>
    <rect x="800" y="150" width="80" height="46" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="840" y="180" fill="#5a4a2a" font-weight="700">5</text>
    <rect x="880" y="150" width="80" height="46" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="920" y="180" fill="#5a4a2a" font-weight="700">2</text>
    <rect x="960" y="150" width="80" height="46" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="1000" y="180" fill="#5a4a2a" font-weight="700">4</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#8a5a12">
    <text x="600" y="212">[0]</text><text x="680" y="212">[1]</text><text x="760" y="212">[2]</text><text x="840" y="212">[3]</text><text x="920" y="212">[4]</text><text x="1000" y="212">[5]</text>
  </g>

  <!-- 索引换算盒 -->
  <rect x="560" y="240" width="480" height="150" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="582" y="266" font-size="12" font-weight="700" fill="#1d1d1f">③ 父子索引直接由下标算出</text>
  <text x="582" y="294" font-size="12" fill="#20375e">左子 = <tspan font-weight="700">2i + 1</tspan></text>
  <text x="762" y="294" font-size="12" fill="#20375e">右子 = <tspan font-weight="700">2i + 2</tspan></text>
  <text x="582" y="320" font-size="12" fill="#20375e">父 = <tspan font-weight="700">(i − 1) / 2</tspan>（向下整除）</text>
  <line x1="582" y1="332" x2="1018" y2="332" stroke="#eef0f3"/>
  <text x="582" y="354" font-size="10.5" fill="#8a5a12">例 i=1(值7)：左子 = 3 → data[3]=5，右子 = 4 → data[4]=2</text>
  <text x="582" y="374" font-size="10.5" fill="#8a5a12">　　　　　　父 = (1−1)/2 = 0 → data[0]=9　✓ 与树完全一致</text>

  <!-- 树↔数组：一条高亮对应线（正交） -->
  <path d="M150 262 L150 300 L520 300 L520 173 L560 173" fill="none" stroke="#d99a2b" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="360" y="294" font-size="9" fill="#8a5a12" text-anchor="middle">结点 i=1 ↔ 数组 [1]（层序序号即下标）</text>

  <!-- ===== 底部：大/小顶堆 + 应用 ===== -->
  <text x="40" y="446" font-size="12" font-weight="700" fill="#20375e">④ 两种偏序方向</text>
  <rect x="40" y="460" width="500" height="120" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="62" y="486" font-size="11.5" font-weight="700" fill="#20375e">大顶堆 max-heap</text>
  <text x="62" y="508" font-size="10.5" fill="#4a4a4f">父 ≥ 子 · 堆顶 = 最大 · siftDown 与「较大子」换</text>
  <text x="62" y="530" font-size="10.5" fill="#6e6e73">本参考 my_heap.go 即大顶堆</text>
  <line x1="290" y1="474" x2="290" y2="566" stroke="#eef0f3"/>
  <text x="312" y="486" font-size="11.5" font-weight="700" fill="#8a5a12">小顶堆 min-heap</text>
  <text x="312" y="508" font-size="10.5" fill="#4a4a4f">父 ≤ 子 · 堆顶 = 最小 · 比较符取反即可</text>
  <text x="312" y="530" font-size="10.5" fill="#6e6e73">TopK 求最大 k 个用它（见 P3）</text>
  <text x="62" y="560" font-size="10" fill="#2f6b4e">堆顶恒为极值 → 查极值 O(1)；插入/弹出只沿一条树高路径 O(log n)</text>

  <!-- 应用 -->
  <text x="580" y="446" font-size="12" font-weight="700" fill="#20375e">⑤ 它撑起了什么</text>
  <rect x="580" y="460" width="500" height="120" rx="12" fill="#f2f7ff" stroke="#c6d9f2"/>
  <text x="602" y="486" font-size="11.5" font-weight="700" fill="#20375e">优先队列 Priority Queue</text>
  <text x="602" y="508" font-size="10.5" fill="#4a4a4f">总是先出「优先级最高」者：push 入堆、pop 取顶</text>
  <text x="602" y="528" font-size="10.5" fill="#4a4a4f">Dijkstra / Huffman / 任务调度的底座</text>
  <line x1="602" y1="540" x2="1058" y2="540" stroke="#dbe6f7"/>
  <text x="602" y="562" font-size="11.5" font-weight="700" fill="#20375e">TopK</text>
  <text x="642" y="562" font-size="10.5" fill="#4a4a4f">维护大小 k 的堆，一遍扫描得前 k 大/小，O(n log k)</text>

  <!-- 底部性质框 -->
  <rect x="40" y="596" width="1040" height="96" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="58" y="620" font-size="10.5" font-weight="700" fill="#2f6b4e">为什么用数组而非指针树</text>
  <text x="58" y="640" font-size="10" fill="#4a4a4f">完全二叉树没有空洞，层序拍平后每一格都被占满 —— 于是「父子关系」可由下标算术复原，省去左右指针、缓存友好。</text>
  <text x="58" y="662" font-size="10" fill="#4a4a4f">代价：只维护父子偏序、不维护全序。所以堆能极快地「取一个极值」，却不能像有序数组/BST 那样按序遍历或范围查询（见 CMP 对比）。</text>
  <text x="58" y="682" font-size="10" fill="#8a97ab">核心三问：结构（数组隐式完全二叉树）→ 维护（上浮/下沉，P1）→ 应用（优先队列 / TopK，P3）。</text>
</svg>
