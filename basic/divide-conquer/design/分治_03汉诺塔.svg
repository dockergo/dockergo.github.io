<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="700" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">DC3 · 汉诺塔：移 n 盘 = 先挪走上面 n−1 → 移最大盘 → 再搬回 n−1</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">分解策略与折半不同：规模每次只减 1，但要解两个 f(n−1)，故移动数 2ⁿ−1 呈指数 —— 示例 n=3，A→C（借助 B）</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">圆盘（大盘不压小盘）</text>
  <rect x="230" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="248" y="82" font-size="10.5" fill="#3a3a3c">move · 一次真实移动</text>
  <rect x="420" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="438" y="82" font-size="10.5" fill="#3a3a3c">f(k) · 子问题递归</text>

  <text x="30" y="104" font-size="12" font-weight="700" fill="#8a5a12">① 三步分解（每步对应一个子问题，按序执行）</text>

  <!-- ===== Panel A initial ===== -->
  <rect x="40" y="112" width="255" height="186" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <rect x="58" y="262" width="219" height="8" rx="2" fill="#d8d8dd"/>
  <line x1="95" y1="162" x2="95" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <line x1="168" y1="162" x2="168" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <line x1="241" y1="162" x2="241" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <rect x="57" y="247" width="76" height="15" rx="4" fill="#f0c675" stroke="#d99a2b"/><text x="95" y="259" font-size="9" fill="#7a531a" text-anchor="middle">3</text>
  <rect x="68" y="232" width="54" height="15" rx="4" fill="#f7dca0" stroke="#e7c07a"/><text x="95" y="244" font-size="9" fill="#7a531a" text-anchor="middle">2</text>
  <rect x="78" y="217" width="34" height="15" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="95" y="229" font-size="9" fill="#7a531a" text-anchor="middle">1</text>
  <text x="95" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">A</text>
  <text x="168" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">B</text>
  <text x="241" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">C</text>
  <text x="167" y="132" font-size="10.5" font-weight="700" fill="#8a5a12" text-anchor="middle">初始：3 盘在 A</text>

  <!-- ===== Panel B after step1 ===== -->
  <rect x="307" y="112" width="255" height="186" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <rect x="325" y="262" width="219" height="8" rx="2" fill="#d8d8dd"/>
  <line x1="362" y1="162" x2="362" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <line x1="435" y1="162" x2="435" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <line x1="508" y1="162" x2="508" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <rect x="324" y="247" width="76" height="15" rx="4" fill="#f0c675" stroke="#d99a2b"/><text x="362" y="259" font-size="9" fill="#7a531a" text-anchor="middle">3</text>
  <rect x="408" y="247" width="54" height="15" rx="4" fill="#f7dca0" stroke="#e7c07a"/><text x="435" y="259" font-size="9" fill="#7a531a" text-anchor="middle">2</text>
  <rect x="418" y="232" width="34" height="15" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="435" y="244" font-size="9" fill="#7a531a" text-anchor="middle">1</text>
  <text x="362" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">A</text>
  <text x="435" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">B</text>
  <text x="508" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">C</text>
  <text x="434" y="132" font-size="10.5" font-weight="700" fill="#20375e" text-anchor="middle">① f(2)：A→B（借 C）</text>

  <!-- ===== Panel C after step2 ===== -->
  <rect x="574" y="112" width="255" height="186" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <rect x="592" y="262" width="219" height="8" rx="2" fill="#d8d8dd"/>
  <line x1="629" y1="162" x2="629" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <line x1="702" y1="162" x2="702" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <line x1="775" y1="162" x2="775" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <rect x="675" y="247" width="54" height="15" rx="4" fill="#f7dca0" stroke="#e7c07a"/><text x="702" y="259" font-size="9" fill="#7a531a" text-anchor="middle">2</text>
  <rect x="685" y="232" width="34" height="15" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="702" y="244" font-size="9" fill="#7a531a" text-anchor="middle">1</text>
  <rect x="737" y="247" width="76" height="15" rx="4" fill="#f0c675" stroke="#2f9e6e" stroke-width="1.6"/><text x="775" y="259" font-size="9" fill="#7a531a" text-anchor="middle">3</text>
  <text x="629" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">A</text>
  <text x="702" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">B</text>
  <text x="775" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">C</text>
  <text x="701" y="132" font-size="10.5" font-weight="700" fill="#1f6b47" text-anchor="middle">② move：最大盘 A→C</text>

  <!-- ===== Panel D final ===== -->
  <rect x="841" y="112" width="255" height="186" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.3" filter="url(#soft)"/>
  <rect x="859" y="262" width="219" height="8" rx="2" fill="#d8d8dd"/>
  <line x1="896" y1="162" x2="896" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <line x1="969" y1="162" x2="969" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <line x1="1042" y1="162" x2="1042" y2="262" stroke="#cfcfd5" stroke-width="3"/>
  <rect x="1004" y="247" width="76" height="15" rx="4" fill="#f0c675" stroke="#d99a2b"/><text x="1042" y="259" font-size="9" fill="#7a531a" text-anchor="middle">3</text>
  <rect x="1015" y="232" width="54" height="15" rx="4" fill="#f7dca0" stroke="#e7c07a"/><text x="1042" y="244" font-size="9" fill="#7a531a" text-anchor="middle">2</text>
  <rect x="1025" y="217" width="34" height="15" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="1042" y="229" font-size="9" fill="#7a531a" text-anchor="middle">1</text>
  <text x="896" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">A</text>
  <text x="969" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">B</text>
  <text x="1042" y="286" font-size="10" fill="#6e6e73" text-anchor="middle">C</text>
  <text x="968" y="132" font-size="10.5" font-weight="700" fill="#1f6b47" text-anchor="middle">③ f(2)：B→C（借 A）✓</text>

  <!-- 面板间箭头 -->
  <line x1="297" y1="205" x2="305" y2="205" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <line x1="564" y1="205" x2="572" y2="205" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <line x1="831" y1="205" x2="839" y2="205" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>

  <!-- ===== ② 递归树 ===== -->
  <text x="40" y="330" font-size="12" font-weight="700" fill="#20375e">② 递归树：f(n)=2·f(n−1)+1，展开成一棵高度 n 的树，叶子/中点都是单次移动</text>

  <rect x="290" y="346" width="90" height="30" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="335" y="366" font-size="12" font-weight="700" fill="#20375e" text-anchor="middle">f(3)</text>

  <rect x="95" y="424" width="110" height="28" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="150" y="443" font-size="10.5" fill="#20375e" text-anchor="middle">f(2) A→B</text>
  <rect x="300" y="424" width="70" height="28" rx="6" fill="#e6f4ec" stroke="#2f9e6e"/><text x="335" y="443" font-size="10.5" fill="#1f6b47" text-anchor="middle">move</text>
  <rect x="470" y="424" width="110" height="28" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="525" y="443" font-size="10.5" fill="#20375e" text-anchor="middle">f(2) B→C</text>

  <rect x="60" y="498" width="56" height="26" rx="6" fill="#e6f4ec" stroke="#2f9e6e"/><text x="88" y="515" font-size="10" fill="#1f6b47" text-anchor="middle">move</text>
  <rect x="126" y="498" width="48" height="26" rx="6" fill="#e6f4ec" stroke="#2f9e6e"/><text x="150" y="515" font-size="10" fill="#1f6b47" text-anchor="middle">move</text>
  <rect x="184" y="498" width="56" height="26" rx="6" fill="#e6f4ec" stroke="#2f9e6e"/><text x="212" y="515" font-size="10" fill="#1f6b47" text-anchor="middle">move</text>
  <rect x="435" y="498" width="56" height="26" rx="6" fill="#e6f4ec" stroke="#2f9e6e"/><text x="463" y="515" font-size="10" fill="#1f6b47" text-anchor="middle">move</text>
  <rect x="501" y="498" width="48" height="26" rx="6" fill="#e6f4ec" stroke="#2f9e6e"/><text x="525" y="515" font-size="10" fill="#1f6b47" text-anchor="middle">move</text>
  <rect x="559" y="498" width="56" height="26" rx="6" fill="#e6f4ec" stroke="#2f9e6e"/><text x="587" y="515" font-size="10" fill="#1f6b47" text-anchor="middle">move</text>

  <path d="M335 376 V400 H150 V424" fill="none" stroke="#4a7fd0" stroke-width="1.4"/>
  <path d="M335 376 V400 H335 V424" fill="none" stroke="#4a7fd0" stroke-width="1.4"/>
  <path d="M335 376 V400 H525 V424" fill="none" stroke="#4a7fd0" stroke-width="1.4"/>
  <path d="M150 452 V476 H88 V498" fill="none" stroke="#4a7fd0" stroke-width="1.2"/>
  <path d="M150 452 V476 H150 V498" fill="none" stroke="#4a7fd0" stroke-width="1.2"/>
  <path d="M150 452 V476 H212 V498" fill="none" stroke="#4a7fd0" stroke-width="1.2"/>
  <path d="M525 452 V476 H463 V498" fill="none" stroke="#4a7fd0" stroke-width="1.2"/>
  <path d="M525 452 V476 H525 V498" fill="none" stroke="#4a7fd0" stroke-width="1.2"/>
  <path d="M525 452 V476 H587 V498" fill="none" stroke="#4a7fd0" stroke-width="1.2"/>

  <text x="335" y="548" font-size="10.5" fill="#6e6e73" text-anchor="middle">叶层与中点合计 2³−1 = 7 次移动</text>

  <!-- ===== ③ 移动次数 / 复杂度 ===== -->
  <rect x="660" y="340" width="430" height="204" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="682" y="366" font-size="13" font-weight="700" fill="#1d1d1f">移动次数：每加一盘，翻倍再 +1</text>
  <text x="682" y="392" font-size="11" fill="#4a4a4f">f(1) = 1</text>
  <text x="682" y="412" font-size="11" fill="#4a4a4f">f(n) = 2·f(n−1) + 1　=　2ⁿ − 1</text>

  <g font-size="10" text-anchor="middle">
    <rect x="682" y="428" width="70" height="24" rx="5" fill="#f6f7f9" stroke="#e4e7ec"/><text x="717" y="444" fill="#6e6e73">n</text>
    <rect x="752" y="428" width="60" height="24" rx="5" fill="#f6f7f9" stroke="#e4e7ec"/><text x="782" y="444" fill="#20375e">1→1</text>
    <rect x="812" y="428" width="60" height="24" rx="5" fill="#f6f7f9" stroke="#e4e7ec"/><text x="842" y="444" fill="#20375e">2→3</text>
    <rect x="872" y="428" width="60" height="24" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="902" y="444" fill="#8a5a12">3→7</text>
    <rect x="932" y="428" width="60" height="24" rx="5" fill="#f6f7f9" stroke="#e4e7ec"/><text x="962" y="444" fill="#20375e">4→15</text>
    <rect x="992" y="428" width="70" height="24" rx="5" fill="#f6f7f9" stroke="#e4e7ec"/><text x="1027" y="444" fill="#20375e">5→31</text>
  </g>

  <text x="717" y="500" font-size="22" font-weight="700" fill="#d1544a">时间 O(2ⁿ)</text>
  <text x="920" y="500" font-size="16" font-weight="700" fill="#8a5a12">空间 O(n)</text>
  <text x="682" y="526" font-size="9.5" fill="#6e6e73">时间随盘数指数爆炸；空间＝递归最大深度 n（调用栈）。</text>

  <!-- 底部要点 -->
  <rect x="40" y="568" width="1056" height="110" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="62" y="592" font-size="12" font-weight="700" fill="#8a5a12">为什么会指数爆炸 · 关键取舍</text>
  <text x="62" y="616" font-size="10.5" fill="#4a4a4f">• 与折半分治不同：规模每次只减 1（n→n−1），且需解两个 f(n−1) —— 子问题不收敛，递归树按 2 的幂展开。</text>
  <text x="62" y="638" font-size="10.5" fill="#4a4a4f">• 三柱角色在每层轮换：递归调用把 src / buf / tar 互换（dfs(i−1,src,tar,buf) 与 dfs(i−1,buf,src,tar)），始终守住「小盘在上」。</text>
  <text x="62" y="660" font-size="10.5" fill="#4a4a4f">• 2ⁿ−1 是完成任务的最少移动次数，最优且唯一；这是分治「能解但不省」的典型 —— 分治解决可解性，未必降复杂度。</text>
</svg>
