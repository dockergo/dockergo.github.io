<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="660" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">H2 · 链式地址：每个桶挂一条链表收纳冲突项，负载因子超阈值触发扩容 rehash</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">put 前先查 loadFactor = size/capacity；超过 loadThres = 2/3 则 capacity ×2 并重建（源自 hash_map_chaining.go）</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">控制流</text>
  <rect x="130" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="148" y="82" font-size="10.5" fill="#3a3a3c">桶 / 链节点</text>
  <rect x="250" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="268" y="82" font-size="10.5" fill="#3a3a3c">搬运 rehash</text>
  <rect x="380" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="398" y="82" font-size="10.5" fill="#3a3a3c">冲突 / 越阈</text>

  <!-- ===== put 决策流 ===== -->
  <rect x="30" y="100" width="300" height="530" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="126" font-size="12.5" font-weight="700" fill="#1d1d1f">put(key, val) 流程</text>

  <g font-size="11">
    <rect x="52" y="142" width="256" height="40" rx="7" fill="#eaf1fb" stroke="#c6d9f2"/><text x="66" y="160" fill="#20375e" font-weight="700">① 查负载因子</text><text x="66" y="176" fill="#4a4a4f">loadFactor = size / capacity</text>
    <rect x="52" y="204" width="256" height="52" rx="7" fill="#fbe6e3" stroke="#e8a79f"/><text x="66" y="224" fill="#8a4038" font-weight="700">② 若 &gt; 2/3 → extend()</text><text x="66" y="240" fill="#8a4038">capacity ×2，重建桶数组</text><text x="66" y="252" font-size="9.5" fill="#b06a60">再把每个键 rehash 搬入新表</text>
    <rect x="52" y="278" width="256" height="40" rx="7" fill="#f2f7ff" stroke="#c6d9f2"/><text x="66" y="296" fill="#20375e" font-weight="700">③ idx = key % capacity</text><text x="66" y="312" fill="#4a4a4f">定位目标桶</text>
    <rect x="52" y="340" width="256" height="52" rx="7" fill="#f2f7ff" stroke="#c6d9f2"/><text x="66" y="360" fill="#20375e" font-weight="700">④ 顺链查 key</text><text x="66" y="376" fill="#4a4a4f">命中 → 覆盖 val，返回</text><text x="66" y="388" font-size="9.5" fill="#6e6e73">（键唯一，避免重复插入）</text>
    <rect x="52" y="414" width="256" height="52" rx="7" fill="#e7f4ee" stroke="#a9dcc6"/><text x="66" y="434" fill="#1f6b4a" font-weight="700">⑤ 未命中 → append 链尾</text><text x="66" y="450" fill="#2f6b4e">size += 1</text><text x="66" y="462" font-size="9.5" fill="#4e8a6e">新冲突项挂到该桶链表末端</text>
  </g>
  <line x1="180" y1="182" x2="180" y2="204" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  <line x1="180" y1="256" x2="180" y2="278" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  <line x1="180" y1="318" x2="180" y2="340" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  <line x1="180" y1="392" x2="180" y2="414" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>

  <rect x="52" y="486" width="256" height="126" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="66" y="508" font-size="10.5" font-weight="700" fill="#20375e">查找 / 删除同理</text>
  <text x="66" y="526" font-size="10" fill="#4a4a4f">先定位桶，再在链上线性比对 key。</text>
  <text x="66" y="544" font-size="10" fill="#4a4a4f">链长受负载因子约束：理想 O(1)，</text>
  <text x="66" y="560" font-size="10" fill="#4a4a4f">桶内冲突多则退化到 O(链长)。</text>
  <text x="66" y="582" font-size="10" fill="#8a4038">删除 = 从链上摘除该节点（切片删），</text>
  <text x="66" y="598" font-size="10" fill="#8a4038">无需墓碑，天然不破坏其它链。</text>

  <!-- ===== 扩容前 ===== -->
  <text x="358" y="126" font-size="12" font-weight="700" fill="#8a4038">扩容前：capacity = 4，size = 3 → loadFactor = 0.75 &gt; 2/3</text>
  <rect x="358" y="138" width="732" height="150" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <g font-size="11" text-anchor="middle">
    <rect x="380" y="156" width="52" height="26" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="406" y="174" fill="#8a5a12">[0]</text>
    <rect x="380" y="186" width="52" height="26" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="406" y="204" fill="#8a5a12">[1]</text>
    <rect x="380" y="216" width="52" height="26" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="406" y="234" fill="#8a5a12">[2]</text>
    <rect x="380" y="246" width="52" height="26" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="406" y="264" fill="#a1a1a6">[3]</text>
  </g>
  <!-- 链 for [0]: 12 -> 28 -->
  <g font-size="11" text-anchor="middle">
    <rect x="470" y="156" width="64" height="26" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="502" y="174" fill="#20375e">12</text>
    <rect x="574" y="156" width="64" height="26" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="606" y="174" fill="#8a4038">28</text>
    <rect x="470" y="186" width="64" height="26" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="502" y="204" fill="#20375e">5</text>
  </g>
  <line x1="432" y1="169" x2="470" y2="169" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aA)"/>
  <line x1="534" y1="169" x2="574" y2="169" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aA)"/>
  <line x1="432" y1="199" x2="470" y2="199" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aA)"/>
  <text x="660" y="174" font-size="9.5" fill="#8a4038">桶[0] 链：12、28 同桶冲突</text>
  <text x="380" y="284" font-size="10" fill="#6e6e73">此刻再 put(6) → 先判 0.75 &gt; 2/3，触发 extend()</text>

  <!-- 扩容箭头 -->
  <line x1="724" y1="298" x2="724" y2="330" stroke="#2f9e6e" stroke-width="2.2" marker-end="url(#aG)"/>
  <text x="740" y="320" font-size="10.5" fill="#2f6b4e">capacity ×2 = 8，逐键 rehash 搬运</text>

  <!-- ===== 扩容后 ===== -->
  <text x="358" y="356" font-size="12" font-weight="700" fill="#1f6b4a">扩容后：capacity = 8，重算 key % 8 → 冲突被摊薄（12、28 仍同为 4，示例保留）</text>
  <rect x="358" y="368" width="732" height="256" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <g font-size="10.5" text-anchor="middle">
    <rect x="380" y="386" width="48" height="24" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="404" y="402" fill="#a1a1a6">[0]</text>
    <rect x="380" y="414" width="48" height="24" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="404" y="430" fill="#a1a1a6">[1]</text>
    <rect x="380" y="442" width="48" height="24" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="404" y="458" fill="#a1a1a6">[2]</text>
    <rect x="380" y="470" width="48" height="24" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="404" y="486" fill="#a1a1a6">[3]</text>
    <rect x="380" y="498" width="48" height="24" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="404" y="514" fill="#8a5a12">[4]</text>
    <rect x="380" y="526" width="48" height="24" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="404" y="542" fill="#8a5a12">[5]</text>
    <rect x="380" y="554" width="48" height="24" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="404" y="570" fill="#8a5a12">[6]</text>
    <rect x="380" y="582" width="48" height="24" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="404" y="598" fill="#a1a1a6">[7]</text>
  </g>
  <!-- [4] = 12 -> 28 ; [5]=5 ; [6]=6 -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="470" y="498" width="60" height="24" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="500" y="514" fill="#20375e">12</text>
    <rect x="566" y="498" width="60" height="24" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="596" y="514" fill="#8a4038">28</text>
    <rect x="470" y="526" width="60" height="24" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="500" y="542" fill="#20375e">5</text>
    <rect x="470" y="554" width="60" height="24" rx="6" fill="#e7f4ee" stroke="#a9dcc6"/><text x="500" y="570" fill="#1f6b4a">6</text>
  </g>
  <line x1="428" y1="510" x2="470" y2="510" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aA)"/>
  <line x1="530" y1="510" x2="566" y2="510" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aA)"/>
  <line x1="428" y1="538" x2="470" y2="538" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aA)"/>
  <line x1="428" y1="566" x2="470" y2="566" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="700" y="440" font-size="10.5" fill="#4a4a4f">rehash 把每个键按新 capacity 重新取模，</text>
  <text x="700" y="458" font-size="10.5" fill="#4a4a4f">键被重新铺开到 8 个桶，平均链长下降，</text>
  <text x="700" y="476" font-size="10.5" fill="#4a4a4f">loadFactor 回落到 4/8 = 0.5，恢复 O(1)。</text>
  <text x="700" y="510" font-size="10" fill="#8a4038">注：12、28 在 %8 下仍同桶（4），</text>
  <text x="700" y="526" font-size="10" fill="#8a4038">rehash 摊薄冲突而非根除冲突。</text>
</svg>
