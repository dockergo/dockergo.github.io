<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1120" height="640" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">二分查找 · 左闭右闭 [i, j]：比中点，每一步排除一半，O(log n) 收敛</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">前提：数组有序 + 可随机访问。mid = i + (j−i)/2。示例 nums=[1,3,5,7,9,11,13]，target=13</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">存活区间 [i, j]</text>
  <rect x="180" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="198" y="82" font-size="10.5" fill="#3a3a3c">中点 mid（蓝框）</text>
  <rect x="330" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="348" y="82" font-size="10.5" fill="#3a3a3c">已淘汰半区</text>
  <rect x="460" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="478" y="82" font-size="10.5" fill="#3a3a3c">命中 target</text>

  <!-- 下标标注 -->
  <g font-size="9" fill="#8e8e93" text-anchor="middle">
    <text x="180" y="118">[0]</text><text x="246" y="118">[1]</text><text x="312" y="118">[2]</text><text x="378" y="118">[3]</text><text x="444" y="118">[4]</text><text x="510" y="118">[5]</text><text x="576" y="118">[6]</text>
  </g>

  <!-- 快照1 -->
  <text x="60" y="150" font-size="11" font-weight="700" fill="#8a5a12">① i=0, j=6</text>
  <g font-size="12" text-anchor="middle">
    <rect x="150" y="126" width="60" height="38" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="180" y="150" fill="#5a4a2a">1</text>
    <rect x="216" y="126" width="60" height="38" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="246" y="150" fill="#5a4a2a">3</text>
    <rect x="282" y="126" width="60" height="38" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="312" y="150" fill="#5a4a2a">5</text>
    <rect x="348" y="126" width="60" height="38" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="2"/><text x="368" y="139" font-size="8" fill="#4a7fd0">m</text><text x="378" y="150" fill="#20375e" font-weight="700">7</text>
    <rect x="414" y="126" width="60" height="38" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="444" y="150" fill="#5a4a2a">9</text>
    <rect x="480" y="126" width="60" height="38" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="510" y="150" fill="#5a4a2a">11</text>
    <rect x="546" y="126" width="60" height="38" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="576" y="150" fill="#5a4a2a">13</text>
  </g>
  <text x="180" y="180" font-size="10" font-weight="700" fill="#4a7fd0" text-anchor="middle">▲ i</text>
  <text x="576" y="180" font-size="10" font-weight="700" fill="#4a7fd0" text-anchor="middle">▲ j</text>
  <text x="640" y="142" font-size="10.5" fill="#3a3a3c">m = 0+(6−0)/2 = <tspan font-weight="700">3</tspan></text>
  <text x="640" y="160" font-size="10.5" fill="#8a4038">nums[3]=7 &lt; 13 → 弃左半含中点</text>
  <text x="640" y="178" font-size="10.5" fill="#20375e" font-weight="700">i = m+1 = 4</text>

  <!-- 快照2 -->
  <text x="60" y="234" font-size="11" font-weight="700" fill="#8a5a12">② i=4, j=6</text>
  <g font-size="12" text-anchor="middle">
    <rect x="150" y="210" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="180" y="234" fill="#c08a84">1</text>
    <rect x="216" y="210" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="246" y="234" fill="#c08a84">3</text>
    <rect x="282" y="210" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="312" y="234" fill="#c08a84">5</text>
    <rect x="348" y="210" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="378" y="234" fill="#c08a84">7</text>
    <rect x="414" y="210" width="60" height="38" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="444" y="234" fill="#5a4a2a">9</text>
    <rect x="480" y="210" width="60" height="38" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="2"/><text x="500" y="223" font-size="8" fill="#4a7fd0">m</text><text x="510" y="234" fill="#20375e" font-weight="700">11</text>
    <rect x="546" y="210" width="60" height="38" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="576" y="234" fill="#5a4a2a">13</text>
  </g>
  <text x="444" y="264" font-size="10" font-weight="700" fill="#4a7fd0" text-anchor="middle">▲ i</text>
  <text x="576" y="264" font-size="10" font-weight="700" fill="#4a7fd0" text-anchor="middle">▲ j</text>
  <text x="640" y="226" font-size="10.5" fill="#3a3a3c">m = 4+(6−4)/2 = <tspan font-weight="700">5</tspan></text>
  <text x="640" y="244" font-size="10.5" fill="#8a4038">nums[5]=11 &lt; 13 → 弃左半</text>
  <text x="640" y="262" font-size="10.5" fill="#20375e" font-weight="700">i = m+1 = 6</text>

  <!-- 快照3 命中 -->
  <text x="60" y="318" font-size="11" font-weight="700" fill="#1f6b4a">③ i=6, j=6</text>
  <g font-size="12" text-anchor="middle">
    <rect x="150" y="294" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="180" y="318" fill="#c08a84">1</text>
    <rect x="216" y="294" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="246" y="318" fill="#c08a84">3</text>
    <rect x="282" y="294" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="312" y="318" fill="#c08a84">5</text>
    <rect x="348" y="294" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="378" y="318" fill="#c08a84">7</text>
    <rect x="414" y="294" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="444" y="318" fill="#c08a84">9</text>
    <rect x="480" y="294" width="60" height="38" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="510" y="318" fill="#c08a84">11</text>
    <rect x="546" y="294" width="60" height="38" rx="6" fill="#e7f5ee" stroke="#2f9e6e" stroke-width="2"/><text x="562" y="307" font-size="8" fill="#2f9e6e">m</text><text x="576" y="318" fill="#1f6b4a" font-weight="700">13</text>
  </g>
  <text x="576" y="348" font-size="10" font-weight="700" fill="#2f9e6e" text-anchor="middle">▲ i = j</text>
  <text x="640" y="310" font-size="10.5" fill="#3a3a3c">m = 6+(6−6)/2 = <tspan font-weight="700">6</tspan></text>
  <text x="640" y="328" font-size="10.5" fill="#1f6b4a" font-weight="700">nums[6]=13 == 13 → 命中！return 6</text>

  <!-- 收缩规模条 -->
  <text x="30" y="392" font-size="11" font-weight="700" fill="#1d1d1f">区间规模：7 → 3 → 1　（每步约减半，故比较次数 ≈ log₂n）</text>
  <rect x="150" y="402" width="456" height="16" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="614" y="414" font-size="9.5" fill="#8a5a12">7 个</text>
  <rect x="414" y="424" width="192" height="16" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="614" y="436" font-size="9.5" fill="#8a5a12">3 个</text>
  <rect x="546" y="446" width="60" height="16" rx="4" fill="#e7f5ee" stroke="#9dd3ba"/><text x="614" y="458" font-size="9.5" fill="#1f6b4a">1 个 → 命中</text>

  <!-- 不变式与边界 -->
  <rect x="30" y="480" width="1060" height="140" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="52" y="506" font-size="11" font-weight="700" fill="#20375e">循环不变式</text>
  <text x="160" y="506" font-size="10.5" fill="#4a4a4f">若 target 存在，则它始终落在闭区间 [i, j] 内；每轮据 nums[m] 与 target 的大小丢掉不可能的一半。</text>
  <text x="52" y="536" font-size="11" font-weight="700" fill="#8a4038">跳出条件</text>
  <text x="160" y="536" font-size="10.5" fill="#4a4a4f">当 i &gt; j 时区间为空，说明 target 不存在 → return -1。左闭右开变体 [i, j) 用 i &lt; j 与 j = m。</text>
  <text x="52" y="566" font-size="11" font-weight="700" fill="#8a5a12">为何 i+(j−i)/2</text>
  <text x="160" y="566" font-size="10.5" fill="#4a4a4f">等价于 (i+j)/2，但先做差再折半可避免 i+j 在大数组下整型溢出 —— 工程上的经典细节。</text>
  <text x="52" y="596" font-size="9.5" fill="#8e8e93">命中即返回：nums[m]==target 时立刻结束（若需最左/最右一个 target，见「二分边界」）。</text>
</svg>
