<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
  </defs>
  <rect width="1120" height="660" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">哈希查找 · 预建 key→下标 表，把「找一个值」变成一次桶访问 O(1)</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">先花 O(n) 建表、占 O(n) 空间，换取之后每次等值查询直达；two-sum 更巧：边遍历边建表，用「补数」一趟命中</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">查询 / 补数</text>
  <rect x="160" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="178" y="82" font-size="10.5" fill="#3a3a3c">哈希表（已见值→下标）</text>
  <rect x="340" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="358" y="82" font-size="10.5" fill="#3a3a3c">命中</text>
  <rect x="430" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="448" y="82" font-size="10.5" fill="#3a3a3c">未命中（继续/-1）</text>

  <!-- ① 直接哈希查找 -->
  <rect x="30" y="100" width="1060" height="128" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="126" font-size="12" font-weight="700" fill="#8a5a12">① 直接哈希查找 hashingSearchArray：表已建好，key 即入口</text>
  <text x="50" y="152" font-size="10.5" fill="#6e6e73">哈希表 m（key → 下标）：</text>
  <g font-size="11" text-anchor="middle">
    <rect x="50" y="162" width="92" height="32" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="96" y="183" fill="#5a4a2a">12 → 0</text>
    <rect x="150" y="162" width="92" height="32" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="196" y="183" fill="#5a4a2a">5 → 1</text>
    <rect x="250" y="162" width="92" height="32" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="296" y="183" fill="#5a4a2a">6 → 2</text>
    <rect x="350" y="162" width="92" height="32" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="396" y="183" fill="#5a4a2a">28 → 3</text>
  </g>
  <!-- 命中查询 -->
  <rect x="516" y="146" width="120" height="32" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="576" y="167" font-size="10.5" fill="#20375e" text-anchor="middle">查 m[5]</text>
  <line x1="636" y1="162" x2="700" y2="162" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <rect x="700" y="146" width="150" height="32" rx="6" fill="#e7f5ee" stroke="#9dd3ba"/><text x="775" y="167" font-size="10.5" fill="#1f6b4a" text-anchor="middle">ok=true → return 1</text>
  <!-- 未命中查询 -->
  <rect x="516" y="188" width="120" height="30" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="576" y="208" font-size="10.5" fill="#20375e" text-anchor="middle">查 m[99]</text>
  <line x1="636" y1="203" x2="700" y2="203" stroke="#d1544a" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aR)"/>
  <rect x="700" y="188" width="150" height="30" rx="6" fill="#fbe6e3" stroke="#e8a79f"/><text x="775" y="208" font-size="10.5" fill="#8a4038" text-anchor="middle">无此 key → return -1</text>
  <text x="880" y="167" font-size="9.5" fill="#8e8e93">键即地址，</text>
  <text x="880" y="183" font-size="9.5" fill="#8e8e93">不比对、不扫描；</text>
  <text x="880" y="199" font-size="9.5" fill="#8e8e93">均摊 O(1)。</text>

  <!-- ② two_sum 补数命中 -->
  <text x="30" y="262" font-size="12" font-weight="700" fill="#8a5a12">② two_sum · 辅助哈希表：边遍历边记「已见值→下标」，查 target−val 是否已出现</text>
  <text x="30" y="282" font-size="10.5" fill="#6e6e73">nums = [2, 7, 11, 15]　target = 9　（目标：返回两数之和为 9 的下标对）</text>
  <!-- nums 数组 -->
  <g font-size="11" text-anchor="middle">
    <text x="470" y="284" font-size="9" fill="#8e8e93">[0]</text><text x="556" y="284" font-size="9" fill="#8e8e93">[1]</text><text x="642" y="284" font-size="9" fill="#8e8e93">[2]</text><text x="728" y="284" font-size="9" fill="#8e8e93">[3]</text>
  </g>

  <!-- 第1步 -->
  <rect x="30" y="296" width="1060" height="112" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="320" font-size="11.5" font-weight="700" fill="#20375e">第 1 步　i = 0, val = 2</text>
  <g font-size="11" text-anchor="middle">
    <rect x="443" y="306" width="54" height="28" rx="5" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.8"/><text x="470" y="325" fill="#20375e">2</text>
    <rect x="529" y="306" width="54" height="28" rx="5" fill="#f4f4f6" stroke="#d7d7dd"/><text x="556" y="325" fill="#a1a1a6">7</text>
    <rect x="615" y="306" width="54" height="28" rx="5" fill="#f4f4f6" stroke="#d7d7dd"/><text x="642" y="325" fill="#a1a1a6">11</text>
    <rect x="701" y="306" width="54" height="28" rx="5" fill="#f4f4f6" stroke="#d7d7dd"/><text x="728" y="325" fill="#a1a1a6">15</text>
  </g>
  <text x="50" y="352" font-size="10.5" fill="#4a7fd0">补数 = target − val = 9 − 2 = <tspan font-weight="700">7</tspan></text>
  <text x="50" y="374" font-size="10.5" fill="#8a4038">查 hashTable[7] → 表空，<tspan font-weight="700" fill="#d1544a">未命中</tspan></text>
  <text x="50" y="396" font-size="10.5" fill="#5a4a2a">→ 记录 hashTable[2] = 0（把「已见值 2」登记）</text>
  <!-- 表状态 -->
  <text x="800" y="320" font-size="10" fill="#8a5a12" text-anchor="middle">hashTable 状态</text>
  <rect x="778" y="330" width="90" height="30" rx="6" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="823" y="350" font-size="10" fill="#a1a1a6" text-anchor="middle">查 7：空</text>
  <line x1="880" y1="345" x2="912" y2="345" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aB)"/>
  <rect x="912" y="330" width="128" height="30" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="976" y="350" font-size="10.5" fill="#5a4a2a" text-anchor="middle">{ 2 → 0 }</text>

  <!-- 第2步 命中 -->
  <rect x="30" y="418" width="1060" height="130" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.3" filter="url(#soft)"/>
  <text x="50" y="442" font-size="11.5" font-weight="700" fill="#1f6b4a">第 2 步　i = 1, val = 7　—— 命中</text>
  <g font-size="11" text-anchor="middle">
    <rect x="443" y="428" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="470" y="447" fill="#a1a1a6">2</text>
    <rect x="529" y="428" width="54" height="28" rx="5" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.8"/><text x="556" y="447" fill="#20375e">7</text>
    <rect x="615" y="428" width="54" height="28" rx="5" fill="#f4f4f6" stroke="#d7d7dd"/><text x="642" y="447" fill="#a1a1a6">11</text>
    <rect x="701" y="428" width="54" height="28" rx="5" fill="#f4f4f6" stroke="#d7d7dd"/><text x="728" y="447" fill="#a1a1a6">15</text>
  </g>
  <text x="50" y="474" font-size="10.5" fill="#4a7fd0">补数 = 9 − 7 = <tspan font-weight="700">2</tspan></text>
  <text x="50" y="496" font-size="10.5" fill="#1f6b4a">查 hashTable[2] → <tspan font-weight="700" fill="#2f9e6e">命中！preIdx = 0</tspan>（值 2 在第 0 位见过）</text>
  <text x="50" y="518" font-size="10.5" fill="#1f6b4a" font-weight="700">→ return [preIdx, idx] = [0, 1]　（nums[0]+nums[1] = 2+7 = 9 ✓）</text>
  <!-- 表查询命中 -->
  <text x="800" y="442" font-size="10" fill="#8a5a12" text-anchor="middle">hashTable 状态</text>
  <rect x="912" y="452" width="128" height="30" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="976" y="472" font-size="10.5" fill="#5a4a2a" text-anchor="middle">{ 2 → 0 }</text>
  <rect x="778" y="452" width="90" height="30" rx="6" fill="#e7f5ee" stroke="#9dd3ba"/><text x="823" y="472" font-size="10" fill="#1f6b4a" text-anchor="middle">查 2：有</text>
  <line x1="912" y1="467" x2="872" y2="467" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="960" y="500" font-size="9" fill="#8e8e93" text-anchor="middle">先查后记：保证不与自身配对</text>

  <!-- 底部要点 -->
  <rect x="30" y="560" width="1060" height="76" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="52" y="586" font-size="10.5" font-weight="700" fill="#20375e">为何比暴力枚举快</text>
  <text x="180" y="586" font-size="10.5" fill="#4a4a4f">暴力两层循环 O(n²) 试遍所有对；哈希把「另一半是否存在」的判断降到 O(1)，整体一趟 O(n)。</text>
  <text x="52" y="610" font-size="10.5" font-weight="700" fill="#8a5a12">代价</text>
  <text x="180" y="610" font-size="10.5" fill="#4a4a4f">额外 O(n) 空间存表；哈希冲突多时最坏退化到 O(n)。用空间与「均摊」假设换来平均常数级查询。</text>
  <text x="52" y="628" font-size="9.5" fill="#8e8e93">关键顺序：每轮先查补数、再登记当前值 —— 反过来会让元素和自己凑成 target。</text>
</svg>
