<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">二叉树 · 原理总览：一棵树，四种玩法 —— 遍历次序 / 有序查找 / 平衡旋转 / 数组表示</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">每节点至多两个孩子（左/右）；本图以同一棵满二叉树 [1..7] 贯穿示例，右侧 BST/AVL 换有序值演示</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">主结构 / DFS 控制流</text>
  <rect x="210" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="228" y="82" font-size="10.5" fill="#3a3a3c">BFS / 命中 / 有序</text>
  <rect x="360" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="378" y="82" font-size="10.5" fill="#3a3a3c">数组存储 / 状态</text>
  <rect x="510" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="528" y="82" font-size="10.5" fill="#3a3a3c">失衡 / 待调整</text>

  <!-- ===== ① 结构与术语 ===== -->
  <rect x="30" y="98" width="520" height="212" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="122" font-size="12.5" font-weight="700" fill="#20375e">① 结构与术语：根 / 叶 / 高度</text>
  <!-- 边 -->
  <line x1="200" y1="150" x2="150" y2="197" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="200" y1="150" x2="255" y2="197" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="150" y1="197" x2="115" y2="248" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="150" y1="197" x2="175" y2="248" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="255" y1="197" x2="225" y2="248" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="255" y1="197" x2="285" y2="248" stroke="#9dbdea" stroke-width="1.6"/>
  <!-- 节点 -->
  <g font-size="12" text-anchor="middle">
    <circle cx="200" cy="150" r="16" fill="#dbe8fa" stroke="#4a7fd0" stroke-width="1.6"/><text x="200" y="154" fill="#20375e" font-weight="700">1</text>
    <circle cx="150" cy="197" r="16" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="150" y="201" fill="#20375e">2</text>
    <circle cx="255" cy="197" r="16" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="255" y="201" fill="#20375e">3</text>
    <circle cx="115" cy="248" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="115" y="252" fill="#1f6b4e">4</text>
    <circle cx="175" cy="248" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="175" y="252" fill="#1f6b4e">5</text>
    <circle cx="225" cy="248" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="225" y="252" fill="#1f6b4e">6</text>
    <circle cx="285" cy="248" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="285" y="252" fill="#1f6b4e">7</text>
  </g>
  <text x="340" y="152" font-size="10.5" fill="#4a4a4f">根 root：唯一无父节点</text>
  <text x="340" y="176" font-size="10.5" fill="#4a4a4f">叶 leaf：无孩子（绿色）</text>
  <text x="340" y="200" font-size="10.5" fill="#4a4a4f">高度 h：根到最深叶边数</text>
  <text x="340" y="224" font-size="10.5" fill="#4a4a4f">本树 h = 2，节点数 7</text>
  <text x="340" y="252" font-size="10" fill="#8a97ab">左右孩子有序，不可互换</text>
  <text x="50" y="296" font-size="10" fill="#6e6e73">性能全部与高度 h 挂钩：越平衡 h 越小 → 操作越快</text>

  <!-- ===== ② 数组表示 ===== -->
  <rect x="570" y="98" width="520" height="212" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="590" y="122" font-size="12.5" font-weight="700" fill="#8a5a12">② 数组表示（完全二叉树免指针）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="595" y="140" width="66" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="628" y="158" fill="#5a4a2a" font-weight="700">1</text><text x="628" y="170" font-size="8.5" fill="#8a5a12">i=0</text>
    <rect x="663" y="140" width="66" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="696" y="158" fill="#5a4a2a" font-weight="700">2</text><text x="696" y="170" font-size="8.5" fill="#8a5a12">i=1</text>
    <rect x="731" y="140" width="66" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="764" y="158" fill="#5a4a2a" font-weight="700">3</text><text x="764" y="170" font-size="8.5" fill="#8a5a12">i=2</text>
    <rect x="799" y="140" width="66" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="832" y="158" fill="#5a4a2a" font-weight="700">4</text><text x="832" y="170" font-size="8.5" fill="#8a5a12">i=3</text>
    <rect x="867" y="140" width="66" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="900" y="158" fill="#5a4a2a" font-weight="700">5</text><text x="900" y="170" font-size="8.5" fill="#8a5a12">i=4</text>
    <rect x="935" y="140" width="66" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="968" y="158" fill="#5a4a2a" font-weight="700">6</text><text x="968" y="170" font-size="8.5" fill="#8a5a12">i=5</text>
    <rect x="1003" y="140" width="66" height="34" rx="6" fill="#fdf3e0" stroke="#e7c07a"/><text x="1036" y="158" fill="#5a4a2a" font-weight="700">7</text><text x="1036" y="170" font-size="8.5" fill="#8a5a12">i=6</text>
  </g>
  <!-- i=1 的孩子指向 i=3 / i=4 -->
  <path d="M696 174 L696 196 L832 196 L832 176" fill="none" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aA)"/>
  <path d="M696 190 L900 190 L900 176" fill="none" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aA)"/>
  <text x="764" y="214" font-size="10" fill="#8a5a12" text-anchor="middle">i=1 的左孩子 = 2·1+1 = 3，右孩子 = 2·1+2 = 4</text>
  <rect x="590" y="228" width="480" height="66" rx="10" fill="#fff7e8" stroke="#e7c07a"/>
  <text x="606" y="250" font-size="11" font-weight="700" fill="#8a5a12">左 = 2i+1   右 = 2i+2   父 = (i−1)/2</text>
  <text x="606" y="271" font-size="10" fill="#5a4a2a">下标即可算出亲子关系，无需存指针；完全二叉树无空洞，最省内存</text>
  <text x="606" y="288" font-size="10" fill="#5a4a2a">非完全树需以 nil 占空位，会浪费空间 —— 堆常用此表示</text>

  <!-- ===== ③ 四大遍历 ===== -->
  <rect x="30" y="322" width="1060" height="152" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="346" font-size="12.5" font-weight="700" fill="#20375e">③ 四大遍历：同一棵树 [1..7]，访问「根」的时机不同 → 序列不同</text>
  <!-- 前序 -->
  <text x="50" y="374" font-size="11" fill="#4a7fd0" font-weight="700">前序 根→左→右</text>
  <g font-size="11" text-anchor="middle" fill="#20375e">
    <rect x="190" y="362" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="205" y="377">1</text>
    <rect x="226" y="362" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="241" y="377">2</text>
    <rect x="262" y="362" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="277" y="377">4</text>
    <rect x="298" y="362" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="313" y="377">5</text>
    <rect x="334" y="362" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="349" y="377">3</text>
    <rect x="370" y="362" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="385" y="377">6</text>
    <rect x="406" y="362" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="421" y="377">7</text>
  </g>
  <text x="452" y="377" font-size="9.5" fill="#8a97ab">先记根，再递归左右</text>
  <!-- 中序 -->
  <text x="50" y="404" font-size="11" fill="#4a7fd0" font-weight="700">中序 左→根→右</text>
  <g font-size="11" text-anchor="middle" fill="#20375e">
    <rect x="190" y="392" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="205" y="407">4</text>
    <rect x="226" y="392" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="241" y="407">2</text>
    <rect x="262" y="392" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="277" y="407">5</text>
    <rect x="298" y="392" width="30" height="22" rx="5" fill="#dbe8fa" stroke="#9dbdea"/><text x="313" y="407" font-weight="700">1</text>
    <rect x="334" y="392" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="349" y="407">6</text>
    <rect x="370" y="392" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="385" y="407">3</text>
    <rect x="406" y="392" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="421" y="407">7</text>
  </g>
  <text x="452" y="407" font-size="9.5" fill="#8a97ab">BST 中序即升序</text>
  <!-- 后序 -->
  <text x="50" y="434" font-size="11" fill="#4a7fd0" font-weight="700">后序 左→右→根</text>
  <g font-size="11" text-anchor="middle" fill="#20375e">
    <rect x="190" y="422" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="205" y="437">4</text>
    <rect x="226" y="422" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="241" y="437">5</text>
    <rect x="262" y="422" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="277" y="437">2</text>
    <rect x="298" y="422" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="313" y="437">6</text>
    <rect x="334" y="422" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="349" y="437">7</text>
    <rect x="370" y="422" width="30" height="22" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="385" y="437">3</text>
    <rect x="406" y="422" width="30" height="22" rx="5" fill="#dbe8fa" stroke="#9dbdea"/><text x="421" y="437" font-weight="700">1</text>
  </g>
  <text x="452" y="437" font-size="9.5" fill="#8a97ab">根最后访问，适合释放/求值</text>
  <!-- 层序 -->
  <text x="50" y="462" font-size="11" fill="#2f9e6e" font-weight="700">层序 BFS 逐层</text>
  <g font-size="11" text-anchor="middle" fill="#1f6b4e">
    <rect x="190" y="450" width="30" height="22" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="205" y="465">1</text>
    <rect x="226" y="450" width="30" height="22" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="241" y="465">2</text>
    <rect x="262" y="450" width="30" height="22" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="277" y="465">3</text>
    <rect x="298" y="450" width="30" height="22" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="313" y="465">4</text>
    <rect x="334" y="450" width="30" height="22" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="349" y="465">5</text>
    <rect x="370" y="450" width="30" height="22" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="385" y="465">6</text>
    <rect x="406" y="450" width="30" height="22" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="421" y="465">7</text>
  </g>
  <text x="452" y="465" font-size="9.5" fill="#8a97ab">用队列，非递归</text>
  <text x="560" y="392" font-size="10.5" fill="#4a4a4f">DFS（前/中/后）本质是递归下潜，靠<tspan font-weight="700" fill="#4a7fd0">调用栈</tspan>记住回溯点，栈深 O(h)</text>
  <text x="560" y="416" font-size="10.5" fill="#4a4a4f">BFS 靠<tspan font-weight="700" fill="#2f9e6e">队列</tspan>逐层推进，先进先出，空间 O(宽度)</text>
  <text x="560" y="440" font-size="10.5" fill="#4a4a4f">四者都恰好访问每节点一次 → 时间 O(n)</text>
  <text x="560" y="462" font-size="10" fill="#8a97ab">「根」插在左右子之间的位置，决定了是前序、中序还是后序</text>

  <!-- ===== ④ BST ===== -->
  <rect x="30" y="486" width="520" height="214" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="510" font-size="12.5" font-weight="700" fill="#20375e">④ 二叉搜索树 BST：左 &lt; 根 &lt; 右</text>
  <line x1="180" y1="536" x2="130" y2="580" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="180" y1="536" x2="245" y2="580" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="130" y1="580" x2="105" y2="624" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="130" y1="580" x2="165" y2="624" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="245" y1="580" x2="215" y2="624" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="245" y1="580" x2="285" y2="624" stroke="#9dbdea" stroke-width="1.6"/>
  <g font-size="11" text-anchor="middle">
    <circle cx="180" cy="536" r="15" fill="#dbe8fa" stroke="#4a7fd0" stroke-width="1.6"/><text x="180" y="540" fill="#20375e" font-weight="700">8</text>
    <circle cx="130" cy="580" r="15" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="130" y="584" fill="#20375e">4</text>
    <circle cx="245" cy="580" r="15" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="245" y="584" fill="#20375e">12</text>
    <circle cx="105" cy="624" r="15" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="105" y="628" fill="#20375e">2</text>
    <circle cx="165" cy="624" r="15" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="165" y="628" fill="#20375e">6</text>
    <circle cx="215" cy="624" r="15" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="215" y="628" fill="#20375e">10</text>
    <circle cx="285" cy="624" r="15" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="285" y="628" fill="#20375e">14</text>
  </g>
  <text x="330" y="540" font-size="10.5" fill="#4a4a4f">每节点：左子树全部更小，</text>
  <text x="330" y="558" font-size="10.5" fill="#4a4a4f">右子树全部更大</text>
  <text x="330" y="584" font-size="10.5" fill="#2f9e6e">查找 = 比大小选边下潜，O(h)</text>
  <text x="330" y="608" font-size="10.5" fill="#4a4a4f">中序遍历 → 天然升序</text>
  <rect x="70" y="656" width="440" height="30" rx="8" fill="#e7f4ee" stroke="#b5e0cd"/>
  <text x="90" y="675" font-size="10" fill="#1f6b4e">中序：2 · 4 · 6 · 8 · 10 · 12 · 14（有序）　隐患：插入退化成链则 h→n</text>

  <!-- ===== ⑤ AVL ===== -->
  <rect x="570" y="486" width="520" height="214" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="590" y="510" font-size="12.5" font-weight="700" fill="#20375e">⑤ AVL：旋转维持平衡 → h = O(log n)</text>
  <text x="620" y="536" font-size="10" fill="#d1544a" text-anchor="middle">失衡 bf=2</text>
  <line x1="620" y1="548" x2="620" y2="588" stroke="#e8a79f" stroke-width="1.6"/>
  <line x1="620" y1="588" x2="620" y2="628" stroke="#e8a79f" stroke-width="1.6"/>
  <g font-size="11" text-anchor="middle">
    <circle cx="620" cy="548" r="15" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.5"/><text x="620" y="552" fill="#8a4038">3</text>
    <circle cx="620" cy="588" r="15" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.3"/><text x="620" y="592" fill="#8a4038">2</text>
    <circle cx="620" cy="628" r="15" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.3"/><text x="620" y="632" fill="#8a4038">1</text>
  </g>
  <text x="620" y="662" font-size="9.5" fill="#8a4038" text-anchor="middle">左偏链（LL）</text>
  <!-- 箭头 -->
  <line x1="690" y1="588" x2="770" y2="588" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="730" y="578" font-size="10" fill="#20375e" text-anchor="middle">右旋</text>
  <!-- after -->
  <line x1="880" y1="568" x2="840" y2="608" stroke="#2f9e6e" stroke-width="1.6"/>
  <line x1="880" y1="568" x2="920" y2="608" stroke="#2f9e6e" stroke-width="1.6"/>
  <g font-size="11" text-anchor="middle">
    <circle cx="880" cy="568" r="15" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.5"/><text x="880" y="572" fill="#1f6b4e" font-weight="700">2</text>
    <circle cx="840" cy="608" r="15" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.3"/><text x="840" y="612" fill="#1f6b4e">1</text>
    <circle cx="920" cy="608" r="15" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.3"/><text x="920" y="612" fill="#1f6b4e">3</text>
  </g>
  <text x="880" y="642" font-size="9.5" fill="#1f6b4e" text-anchor="middle">平衡 bf=0</text>
  <rect x="590" y="656" width="480" height="30" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="606" y="675" font-size="10" fill="#4a4a4f">插入/删除后自底向上更新高度；|bf|&gt;1 即触发 LL/RR/LR/RL 四型旋转复衡</text>
</svg>
