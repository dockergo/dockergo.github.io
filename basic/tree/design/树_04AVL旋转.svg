<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
  </defs>
  <rect width="1120" height="770" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">AVL 树 · 平衡因子 |bf| &gt; 1 即失衡，四种形状对应四种旋转，一次或两次转回平衡</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">bf(节点) = 左子树高 − 右子树高；插入/删除后自底向上更新高度，谁先失衡就在谁身上旋转。四种情形最终都收敛到同一平衡形</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">失衡节点 |bf|&gt;1</text>
  <rect x="180" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="198" y="82" font-size="10.5" fill="#3a3a3c">复衡后 bf∈{−1,0,1}</text>
  <line x1="360" y1="78" x2="384" y2="78" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/><text x="392" y="82" font-size="10.5" fill="#3a3a3c">旋转（子树重挂）</text>

  <!-- ============ ① LL ============ -->
  <rect x="30" y="98" width="525" height="316" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="122" font-size="12.5" font-weight="700" fill="#20375e">① LL 左左偏 → 右旋（单旋）</text>
  <text x="50" y="140" font-size="10" fill="#6e6e73">失衡节点左沉、其左孩子也左沉；以左孩子为轴右旋</text>
  <!-- before -->
  <text x="105" y="168" font-size="9.5" fill="#8a4038" text-anchor="middle">失衡</text>
  <line x1="120" y1="188" x2="95" y2="228" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="95" y1="228" x2="72" y2="268" stroke="#9dbdea" stroke-width="1.6"/>
  <g font-size="11" text-anchor="middle">
    <circle cx="120" cy="188" r="13" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.7"/><text x="120" y="192" fill="#8a4038">3</text>
    <circle cx="95" cy="228" r="13" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="95" y="232" fill="#20375e">2</text>
    <circle cx="72" cy="268" r="13" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="72" y="272" fill="#20375e">1</text>
  </g>
  <text x="146" y="186" font-size="8.5" fill="#8a4038">bf +2</text>
  <text x="120" y="226" font-size="8.5" fill="#5a7099">bf +1</text>
  <!-- arrow -->
  <line x1="175" y1="228" x2="235" y2="228" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="205" y="218" font-size="10" fill="#20375e" text-anchor="middle">右旋(3)</text>
  <!-- after -->
  <text x="320" y="182" font-size="9.5" fill="#2f6b4e" text-anchor="middle">平衡</text>
  <line x1="320" y1="200" x2="295" y2="240" stroke="#2f9e6e" stroke-width="1.8"/>
  <line x1="320" y1="200" x2="345" y2="240" stroke="#2f9e6e" stroke-width="1.8"/>
  <g font-size="11" text-anchor="middle">
    <circle cx="320" cy="200" r="13" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.7"/><text x="320" y="204" fill="#1f6b4e" font-weight="700">2</text>
    <circle cx="295" cy="240" r="13" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="295" y="244" fill="#1f6b4e">1</text>
    <circle cx="345" cy="240" r="13" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="345" y="244" fill="#1f6b4e">3</text>
  </g>
  <text x="320" y="270" font-size="8.5" fill="#2f6b4e" text-anchor="middle">bf 0</text>
  <rect x="400" y="170" width="140" height="90" rx="8" fill="#f2f7ff" stroke="#c6d9f2"/>
  <text x="414" y="190" font-size="9.5" fill="#4a4a4f">中间节点 2 上位当根</text>
  <text x="414" y="208" font-size="9.5" fill="#4a4a4f">原根 3 变其右孩子</text>
  <text x="414" y="226" font-size="9.5" fill="#4a4a4f">子树 1 留在左侧</text>
  <text x="414" y="248" font-size="9" fill="#8a97ab">判定：bf&gt;1 且</text>
  <text x="414" y="262" font-size="9" fill="#8a97ab">左孩子 bf ≥ 0</text>
  <rect x="50" y="290" width="490" height="42" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="66" y="311" font-size="10" fill="#4a4a4f">rightRotate：child=node.Left；child.Right=node；node.Left=child 原来的右子。</text>
  <text x="66" y="328" font-size="9.5" fill="#8a97ab">只改三条指针 + 更新两个高度，O(1)。</text>

  <!-- ============ ② RR ============ -->
  <rect x="565" y="98" width="525" height="316" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="585" y="122" font-size="12.5" font-weight="700" fill="#20375e">② RR 右右偏 → 左旋（单旋）</text>
  <text x="585" y="140" font-size="10" fill="#6e6e73">LL 的镜像：失衡节点右沉、其右孩子也右沉；以右孩子为轴左旋</text>
  <text x="640" y="168" font-size="9.5" fill="#8a4038" text-anchor="middle">失衡</text>
  <line x1="640" y1="188" x2="665" y2="228" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="665" y1="228" x2="688" y2="268" stroke="#9dbdea" stroke-width="1.6"/>
  <g font-size="11" text-anchor="middle">
    <circle cx="640" cy="188" r="13" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.7"/><text x="640" y="192" fill="#8a4038">1</text>
    <circle cx="665" cy="228" r="13" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="665" y="232" fill="#20375e">2</text>
    <circle cx="688" cy="268" r="13" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="688" y="272" fill="#20375e">3</text>
  </g>
  <text x="600" y="186" font-size="8.5" fill="#8a4038">bf −2</text>
  <text x="640" y="226" font-size="8.5" fill="#5a7099">bf −1</text>
  <line x1="720" y1="228" x2="780" y2="228" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="750" y="218" font-size="10" fill="#20375e" text-anchor="middle">左旋(1)</text>
  <text x="855" y="182" font-size="9.5" fill="#2f6b4e" text-anchor="middle">平衡</text>
  <line x1="855" y1="200" x2="830" y2="240" stroke="#2f9e6e" stroke-width="1.8"/>
  <line x1="855" y1="200" x2="880" y2="240" stroke="#2f9e6e" stroke-width="1.8"/>
  <g font-size="11" text-anchor="middle">
    <circle cx="855" cy="200" r="13" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.7"/><text x="855" y="204" fill="#1f6b4e" font-weight="700">2</text>
    <circle cx="830" cy="240" r="13" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="830" y="244" fill="#1f6b4e">1</text>
    <circle cx="880" cy="240" r="13" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="880" y="244" fill="#1f6b4e">3</text>
  </g>
  <text x="855" y="270" font-size="8.5" fill="#2f6b4e" text-anchor="middle">bf 0</text>
  <rect x="935" y="170" width="140" height="90" rx="8" fill="#f2f7ff" stroke="#c6d9f2"/>
  <text x="949" y="190" font-size="9.5" fill="#4a4a4f">中间节点 2 上位当根</text>
  <text x="949" y="208" font-size="9.5" fill="#4a4a4f">原根 1 变其左孩子</text>
  <text x="949" y="226" font-size="9.5" fill="#4a4a4f">子树 3 留在右侧</text>
  <text x="949" y="248" font-size="9" fill="#8a97ab">判定：bf&lt;−1 且</text>
  <text x="949" y="262" font-size="9" fill="#8a97ab">右孩子 bf ≤ 0</text>
  <rect x="585" y="290" width="490" height="42" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="601" y="311" font-size="10" fill="#4a4a4f">leftRotate：child=node.Right；child.Left=node；node.Right=child 原来的左子。</text>
  <text x="601" y="328" font-size="9.5" fill="#8a97ab">与右旋完全对称。</text>

  <!-- ============ ③ LR ============ -->
  <rect x="30" y="428" width="525" height="326" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="452" font-size="12.5" font-weight="700" fill="#20375e">③ LR 左右偏 → 先左旋后右旋（双旋）</text>
  <text x="50" y="470" font-size="10" fill="#6e6e73">失衡节点左沉，但其左孩子右沉（拐弯）；先把左孩子转直，再单旋</text>
  <!-- before -->
  <text x="95" y="498" font-size="9" fill="#8a4038" text-anchor="middle">失衡</text>
  <line x1="105" y1="516" x2="82" y2="556" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="82" y1="556" x2="102" y2="596" stroke="#9dbdea" stroke-width="1.6"/>
  <g font-size="10.5" text-anchor="middle">
    <circle cx="105" cy="516" r="12" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.6"/><text x="105" y="520" fill="#8a4038">3</text>
    <circle cx="82" cy="556" r="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="82" y="560" fill="#20375e">1</text>
    <circle cx="102" cy="596" r="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="102" y="600" fill="#20375e">2</text>
  </g>
  <text x="128" y="514" font-size="8" fill="#8a4038">bf +2</text>
  <text x="60" y="556" font-size="8" fill="#8a4038">bf −1</text>
  <!-- arrow1 -->
  <line x1="140" y1="556" x2="185" y2="556" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="162" y="547" font-size="8.5" fill="#20375e" text-anchor="middle">①左旋(1)</text>
  <!-- mid -->
  <text x="245" y="498" font-size="9" fill="#8a97ab" text-anchor="middle">转直成 LL</text>
  <line x1="255" y1="516" x2="232" y2="556" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="232" y1="556" x2="212" y2="596" stroke="#9dbdea" stroke-width="1.6"/>
  <g font-size="10.5" text-anchor="middle">
    <circle cx="255" cy="516" r="12" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.5"/><text x="255" y="520" fill="#8a4038">3</text>
    <circle cx="232" cy="556" r="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="232" y="560" fill="#20375e">2</text>
    <circle cx="212" cy="596" r="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="212" y="600" fill="#20375e">1</text>
  </g>
  <!-- arrow2 -->
  <line x1="288" y1="556" x2="333" y2="556" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="310" y="547" font-size="8.5" fill="#20375e" text-anchor="middle">②右旋(3)</text>
  <!-- after -->
  <text x="400" y="510" font-size="9" fill="#2f6b4e" text-anchor="middle">平衡</text>
  <line x1="400" y1="528" x2="377" y2="568" stroke="#2f9e6e" stroke-width="1.8"/>
  <line x1="400" y1="528" x2="423" y2="568" stroke="#2f9e6e" stroke-width="1.8"/>
  <g font-size="10.5" text-anchor="middle">
    <circle cx="400" cy="528" r="12" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.7"/><text x="400" y="532" fill="#1f6b4e" font-weight="700">2</text>
    <circle cx="377" cy="568" r="12" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="377" y="572" fill="#1f6b4e">1</text>
    <circle cx="423" cy="568" r="12" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="423" y="572" fill="#1f6b4e">3</text>
  </g>
  <text x="400" y="596" font-size="8" fill="#2f6b4e" text-anchor="middle">bf 0</text>
  <rect x="50" y="640" width="490" height="98" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="66" y="662" font-size="10.5" font-weight="700" fill="#20375e">为何要两步</text>
  <text x="66" y="683" font-size="10" fill="#4a4a4f">失衡是「拐弯」形（左—右），直接右旋会转出另一边失衡。</text>
  <text x="66" y="703" font-size="10" fill="#4a4a4f">先对左孩子左旋，把它掰成一条直线（退化为 LL），再右旋一次即平衡。</text>
  <text x="66" y="726" font-size="9.5" fill="#8a97ab">判定：bf &gt; 1 且左孩子 bf &lt; 0 → 先 leftRotate(node.Left) 再 rightRotate(node)。</text>

  <!-- ============ ④ RL ============ -->
  <rect x="565" y="428" width="525" height="326" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="585" y="452" font-size="12.5" font-weight="700" fill="#20375e">④ RL 右左偏 → 先右旋后左旋（双旋）</text>
  <text x="585" y="470" font-size="10" fill="#6e6e73">LR 的镜像：失衡节点右沉，但其右孩子左沉；先转直再单旋</text>
  <text x="630" y="498" font-size="9" fill="#8a4038" text-anchor="middle">失衡</text>
  <line x1="640" y1="516" x2="663" y2="556" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="663" y1="556" x2="643" y2="596" stroke="#9dbdea" stroke-width="1.6"/>
  <g font-size="10.5" text-anchor="middle">
    <circle cx="640" cy="516" r="12" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.6"/><text x="640" y="520" fill="#8a4038">1</text>
    <circle cx="663" cy="556" r="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="663" y="560" fill="#20375e">3</text>
    <circle cx="643" cy="596" r="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="643" y="600" fill="#20375e">2</text>
  </g>
  <text x="600" y="514" font-size="8" fill="#8a4038">bf −2</text>
  <text x="686" y="556" font-size="8" fill="#8a4038">bf +1</text>
  <line x1="700" y1="556" x2="745" y2="556" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="722" y="547" font-size="8.5" fill="#20375e" text-anchor="middle">①右旋(3)</text>
  <text x="800" y="498" font-size="9" fill="#8a97ab" text-anchor="middle">转直成 RR</text>
  <line x1="790" y1="516" x2="813" y2="556" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="813" y1="556" x2="833" y2="596" stroke="#9dbdea" stroke-width="1.6"/>
  <g font-size="10.5" text-anchor="middle">
    <circle cx="790" cy="516" r="12" fill="#fbe6e3" stroke="#d1544a" stroke-width="1.5"/><text x="790" y="520" fill="#8a4038">1</text>
    <circle cx="813" cy="556" r="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="813" y="560" fill="#20375e">2</text>
    <circle cx="833" cy="596" r="12" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.4"/><text x="833" y="600" fill="#20375e">3</text>
  </g>
  <line x1="848" y1="556" x2="893" y2="556" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="870" y="547" font-size="8.5" fill="#20375e" text-anchor="middle">②左旋(1)</text>
  <text x="955" y="510" font-size="9" fill="#2f6b4e" text-anchor="middle">平衡</text>
  <line x1="955" y1="528" x2="932" y2="568" stroke="#2f9e6e" stroke-width="1.8"/>
  <line x1="955" y1="528" x2="978" y2="568" stroke="#2f9e6e" stroke-width="1.8"/>
  <g font-size="10.5" text-anchor="middle">
    <circle cx="955" cy="528" r="12" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.7"/><text x="955" y="532" fill="#1f6b4e" font-weight="700">2</text>
    <circle cx="932" cy="568" r="12" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="932" y="572" fill="#1f6b4e">1</text>
    <circle cx="978" cy="568" r="12" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.4"/><text x="978" y="572" fill="#1f6b4e">3</text>
  </g>
  <text x="955" y="596" font-size="8" fill="#2f6b4e" text-anchor="middle">bf 0</text>
  <rect x="585" y="640" width="490" height="98" rx="8" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="601" y="662" font-size="10.5" font-weight="700" fill="#20375e">四型速记</text>
  <text x="601" y="683" font-size="10" fill="#4a4a4f">看失衡节点连向更深的两条边：同向（LL / RR）单旋，异向（LR / RL）双旋。</text>
  <text x="601" y="703" font-size="10" fill="#4a4a4f">插入最多触发一次修复即恢复；删除可能一路向上多次旋转到根。</text>
  <text x="601" y="726" font-size="9.5" fill="#8a97ab">判定：bf &lt; −1 且右孩子 bf &gt; 0 → 先 rightRotate(node.Right) 再 leftRotate(node)。</text>
</svg>
