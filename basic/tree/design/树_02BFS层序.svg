<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
  </defs>
  <rect width="1120" height="640" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">BFS 层序遍历 · 一条队列，逐层推进：出队一个 → 把它的左右孩子入队</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">队列先进先出（FIFO）保证「先入的层先出」，于是节点按从上到下、从左到右的层序被记录，无需递归</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">已出队并记录</text>
  <rect x="180" y="72" width="12" height="12" rx="2" fill="#e7f4ee" stroke="#b5e0cd"/><text x="198" y="82" font-size="10.5" fill="#3a3a3c">在队列中等待</text>
  <rect x="320" y="72" width="12" height="12" rx="2" fill="#eaf1fb" stroke="#c6d9f2"/><text x="338" y="82" font-size="10.5" fill="#3a3a3c">尚未入队</text>

  <!-- ===== 树 + 层带 ===== -->
  <rect x="30" y="98" width="360" height="360" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="122" font-size="12" font-weight="700" fill="#20375e">树按层分组</text>
  <!-- 层带 -->
  <rect x="55" y="140" width="310" height="42" rx="8" fill="#f6f7f9" stroke="#e4e7ec" stroke-dasharray="4 3"/><text x="70" y="165" font-size="9.5" fill="#8a97ab">L0</text>
  <rect x="55" y="222" width="310" height="42" rx="8" fill="#f6f7f9" stroke="#e4e7ec" stroke-dasharray="4 3"/><text x="70" y="247" font-size="9.5" fill="#8a97ab">L1</text>
  <rect x="55" y="304" width="310" height="42" rx="8" fill="#f6f7f9" stroke="#e4e7ec" stroke-dasharray="4 3"/><text x="70" y="329" font-size="9.5" fill="#8a97ab">L2</text>
  <!-- 边 -->
  <line x1="210" y1="161" x2="150" y2="243" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="210" y1="161" x2="285" y2="243" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="150" y1="243" x2="115" y2="325" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="150" y1="243" x2="185" y2="325" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="285" y1="243" x2="250" y2="325" stroke="#9dbdea" stroke-width="1.6"/>
  <line x1="285" y1="243" x2="320" y2="325" stroke="#9dbdea" stroke-width="1.6"/>
  <g font-size="12" text-anchor="middle">
    <circle cx="210" cy="161" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.5"/><text x="210" y="165" fill="#1f6b4e" font-weight="700">1</text>
    <circle cx="150" cy="243" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.3"/><text x="150" y="247" fill="#1f6b4e">2</text>
    <circle cx="285" cy="243" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.3"/><text x="285" y="247" fill="#1f6b4e">3</text>
    <circle cx="115" cy="325" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.3"/><text x="115" y="329" fill="#1f6b4e">4</text>
    <circle cx="185" cy="325" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.3"/><text x="185" y="329" fill="#1f6b4e">5</text>
    <circle cx="250" cy="325" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.3"/><text x="250" y="329" fill="#1f6b4e">6</text>
    <circle cx="320" cy="325" r="16" fill="#e7f4ee" stroke="#2f9e6e" stroke-width="1.3"/><text x="320" y="329" fill="#1f6b4e">7</text>
  </g>
  <rect x="55" y="378" width="310" height="30" rx="8" fill="#e7f4ee" stroke="#b5e0cd"/>
  <text x="210" y="397" font-size="11" fill="#1f6b4e" text-anchor="middle" font-weight="700">结果：1 · 2 · 3 · 4 · 5 · 6 · 7</text>
  <text x="50" y="432" font-size="10" fill="#6e6e73">时间 O(n)；空间 O(w)，w = 最宽一层的节点数</text>
  <text x="50" y="450" font-size="10" fill="#8a97ab">最坏 w ≈ n/2（满树底层），故空间可达 O(n)</text>

  <!-- ===== 队列演进快照 ===== -->
  <rect x="410" y="98" width="680" height="510" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="430" y="122" font-size="12" font-weight="700" fill="#20375e">队列演进快照（左＝队首出队，右＝队尾入队）</text>
  <text x="430" y="140" font-size="9.5" fill="#8a97ab">每步：从队首取一个节点记录，再把它的左孩子、右孩子依次追加到队尾</text>

  <!-- 快照行 通用: 标签 + 队列chips -->
  <!-- 行 0 初始 -->
  <text x="430" y="172" font-size="10.5" fill="#4a4a4f">初始　入根</text>
  <g font-size="11" text-anchor="middle" fill="#1f6b4e">
    <rect x="620" y="158" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="635" y="175">1</text>
  </g>
  <!-- 行 1 -->
  <text x="430" y="208" font-size="10.5" fill="#4a4a4f">① 出 <tspan fill="#2f9e6e" font-weight="700">1</tspan> → 入 2,3</text>
  <g font-size="11" text-anchor="middle" fill="#1f6b4e">
    <rect x="620" y="194" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="635" y="211">2</text>
    <rect x="654" y="194" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="669" y="211">3</text>
  </g>
  <!-- 行 2 -->
  <text x="430" y="244" font-size="10.5" fill="#4a4a4f">② 出 <tspan fill="#2f9e6e" font-weight="700">2</tspan> → 入 4,5</text>
  <g font-size="11" text-anchor="middle" fill="#1f6b4e">
    <rect x="620" y="230" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="635" y="247">3</text>
    <rect x="654" y="230" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="669" y="247">4</text>
    <rect x="688" y="230" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="703" y="247">5</text>
  </g>
  <!-- 行 3 -->
  <text x="430" y="280" font-size="10.5" fill="#4a4a4f">③ 出 <tspan fill="#2f9e6e" font-weight="700">3</tspan> → 入 6,7</text>
  <g font-size="11" text-anchor="middle" fill="#1f6b4e">
    <rect x="620" y="266" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="635" y="283">4</text>
    <rect x="654" y="266" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="669" y="283">5</text>
    <rect x="688" y="266" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="703" y="283">6</text>
    <rect x="722" y="266" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="737" y="283">7</text>
  </g>
  <text x="775" y="283" font-size="9.5" fill="#8a97ab">← 队列最长的一刻</text>
  <!-- 行 4 -->
  <text x="430" y="316" font-size="10.5" fill="#4a4a4f">④ 出 <tspan fill="#2f9e6e" font-weight="700">4</tspan> → 叶，无入队</text>
  <g font-size="11" text-anchor="middle" fill="#1f6b4e">
    <rect x="620" y="302" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="635" y="319">5</text>
    <rect x="654" y="302" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="669" y="319">6</text>
    <rect x="688" y="302" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="703" y="319">7</text>
  </g>
  <!-- 行 5 -->
  <text x="430" y="352" font-size="10.5" fill="#4a4a4f">⑤ 出 <tspan fill="#2f9e6e" font-weight="700">5</tspan> → 叶</text>
  <g font-size="11" text-anchor="middle" fill="#1f6b4e">
    <rect x="620" y="338" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="635" y="355">6</text>
    <rect x="654" y="338" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="669" y="355">7</text>
  </g>
  <!-- 行 6 -->
  <text x="430" y="388" font-size="10.5" fill="#4a4a4f">⑥ 出 <tspan fill="#2f9e6e" font-weight="700">6</tspan> → 叶</text>
  <g font-size="11" text-anchor="middle" fill="#1f6b4e">
    <rect x="620" y="374" width="30" height="24" rx="5" fill="#e7f4ee" stroke="#b5e0cd"/><text x="635" y="391">7</text>
  </g>
  <!-- 行 7 -->
  <text x="430" y="424" font-size="10.5" fill="#4a4a4f">⑦ 出 <tspan fill="#2f9e6e" font-weight="700">7</tspan> → 队列空，结束</text>
  <g font-size="10" text-anchor="middle">
    <rect x="620" y="410" width="64" height="24" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="652" y="426" fill="#a1a1a6">空</text>
  </g>
  <!-- 出队方向箭头 -->
  <line x1="600" y1="168" x2="576" y2="168" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="588" y="150" font-size="9" fill="#2f6b4e" text-anchor="middle">出队</text>

  <rect x="430" y="446" width="640" height="146" rx="10" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="448" y="470" font-size="11" font-weight="700" fill="#20375e">为什么队列能保证「层序」</text>
  <text x="448" y="492" font-size="10.5" fill="#4a4a4f">① 根先入队；某节点出队时，它的孩子（下一层）才被追加到队尾。</text>
  <text x="448" y="512" font-size="10.5" fill="#4a4a4f">② FIFO 使「本层全部节点」一定排在「下一层任何节点」之前 → 层与层不会交错。</text>
  <text x="448" y="532" font-size="10.5" fill="#4a4a4f">③ 同层内，左孩子先于右孩子入队 → 出队也先左后右。</text>
  <text x="448" y="556" font-size="10.5" fill="#4a4a4f">对比 DFS：把队列换成栈（LIFO），就变成深度优先 —— 容器的取序决定遍历形态。</text>
  <text x="448" y="578" font-size="10" fill="#8a97ab">若需分层输出，可在每轮循环开始记录当前队列长度，一次弹完正好一层。</text>
</svg>
