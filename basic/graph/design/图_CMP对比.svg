<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1120" height="640" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">图 · 对比：两种表示（邻接矩阵 / 邻接表）＋ 两种遍历（BFS / DFS）</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">表示法看「怎么存这份关系」，两条轴是空间与查边；遍历看「怎么系统走遍」，两条轴是底层结构与是否求最短路</text>

  <!-- 图例 -->
  <text x="30" y="82" font-size="10.5" fill="#3a3a3c"><tspan fill="#2f9e6e" font-weight="700">✓</tspan> = 该维度的优势</text>
  <text x="180" y="82" font-size="10.5" fill="#3a3a3c"><tspan fill="#8a4038" font-weight="700">✗</tspan> = 该维度的短板</text>
  <rect x="330" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="348" y="82" font-size="10.5" fill="#3a3a3c">存储 / 表示</text>
  <rect x="470" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="488" y="82" font-size="10.5" fill="#3a3a3c">遍历</text>

  <!-- ===== 表 A：表示法 ===== -->
  <text x="30" y="112" font-size="12.5" font-weight="700" fill="#8a5a12">A · 邻接矩阵 vs 邻接表</text>
  <rect x="30" y="122" width="1060" height="238" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <!-- 表头 -->
  <rect x="30" y="122" width="1060" height="30" rx="12" fill="#fdf3e0"/>
  <rect x="30" y="140" width="1060" height="12" fill="#fdf3e0"/>
  <text x="48" y="142" font-size="11" font-weight="700" fill="#8a5a12">维度</text>
  <text x="360" y="142" font-size="11" font-weight="700" fill="#8a5a12">邻接矩阵 adjMat[V][V]</text>
  <text x="720" y="142" font-size="11" font-weight="700" fill="#8a5a12">邻接表 map[V]→[]V</text>
  <!-- 列分隔 -->
  <line x1="330" y1="122" x2="330" y2="360" stroke="#eee6d6"/>
  <line x1="700" y1="122" x2="700" y2="360" stroke="#eee6d6"/>
  <!-- 行 -->
  <g font-size="10.5">
    <!-- r1 空间 -->
    <rect x="30" y="152" width="1060" height="30" fill="#fdfbf6"/>
    <text x="48" y="171" fill="#4a4a4f" font-weight="700">空间复杂度</text>
    <text x="348" y="171" fill="#8a4038">O(V²) 恒定，与边数无关 <tspan font-weight="700">✗</tspan></text>
    <text x="720" y="171" fill="#1f6b4a">O(V+E) 随边增长，稀疏省 <tspan font-weight="700">✓</tspan></text>
    <!-- r2 查边 -->
    <text x="48" y="201" fill="#4a4a4f" font-weight="700">查边 (i,j) 是否相邻</text>
    <text x="348" y="201" fill="#1f6b4a">O(1) 直接读 M[i][j] <tspan font-weight="700">✓</tspan></text>
    <text x="720" y="201" fill="#8a4038">O(deg i) 扫 i 的邻居链 <tspan font-weight="700">✗</tspan></text>
    <!-- r3 加边 -->
    <rect x="30" y="212" width="1060" height="30" fill="#fdfbf6"/>
    <text x="48" y="231" fill="#4a4a4f" font-weight="700">加边</text>
    <text x="348" y="231" fill="#4a4a4f">O(1) 置 M[i][j]=M[j][i]=1</text>
    <text x="720" y="231" fill="#4a4a4f">O(1) 两条链各 append</text>
    <!-- r4 加顶点 -->
    <text x="48" y="261" fill="#4a4a4f" font-weight="700">加顶点</text>
    <text x="348" y="261" fill="#8a4038">O(V) 加一行 + 加一列 <tspan font-weight="700">✗</tspan></text>
    <text x="720" y="261" fill="#1f6b4a">O(1) 新建一条空链 <tspan font-weight="700">✓</tspan></text>
    <!-- r5 删顶点 -->
    <rect x="30" y="272" width="1060" height="30" fill="#fdfbf6"/>
    <text x="48" y="291" fill="#4a4a4f" font-weight="700">删顶点</text>
    <text x="348" y="291" fill="#8a4038">O(V²) 删行删列、下标重排 <tspan font-weight="700">✗</tspan></text>
    <text x="720" y="291" fill="#4a4a4f">O(V+E) 删自链 + 扫全表去边</text>
    <!-- r6 取邻居 -->
    <text x="48" y="321" fill="#4a4a4f" font-weight="700">取某点全部邻居</text>
    <text x="348" y="321" fill="#8a4038">O(V) 扫整行（含大量 0）</text>
    <text x="720" y="321" fill="#1f6b4a">O(deg) 链上直接给 <tspan font-weight="700">✓</tspan></text>
    <!-- r7 适用 -->
    <rect x="30" y="332" width="1060" height="28" fill="#f3ede0"/>
    <text x="48" y="350" fill="#8a5a12" font-weight="700">最适合</text>
    <text x="348" y="350" fill="#8a5a12">稠密图 · 顶点固定 · 频繁随机查边</text>
    <text x="720" y="350" fill="#8a5a12">稀疏图 · 顶点常变 · 要遍历邻居</text>
  </g>

  <!-- ===== 表 B：遍历 ===== -->
  <text x="30" y="392" font-size="12.5" font-weight="700" fill="#2f6b4e">B · BFS 广度优先 vs DFS 深度优先（皆 O(V+E)，皆用 visited 保证不重不漏）</text>
  <rect x="30" y="402" width="1060" height="196" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <rect x="30" y="402" width="1060" height="30" rx="12" fill="#e3f4ec"/>
  <rect x="30" y="420" width="1060" height="12" fill="#e3f4ec"/>
  <text x="48" y="422" font-size="11" font-weight="700" fill="#1f6b4a">维度</text>
  <text x="360" y="422" font-size="11" font-weight="700" fill="#1f6b4a">BFS 广度优先</text>
  <text x="720" y="422" font-size="11" font-weight="700" fill="#1f6b4a">DFS 深度优先</text>
  <line x1="330" y1="402" x2="330" y2="598" stroke="#d3ece0"/>
  <line x1="700" y1="402" x2="700" y2="598" stroke="#d3ece0"/>
  <g font-size="10.5">
    <!-- r1 底层结构 -->
    <rect x="30" y="432" width="1060" height="28" fill="#f6fbf8"/>
    <text x="48" y="450" fill="#4a4a4f" font-weight="700">底层结构</text>
    <text x="348" y="450" fill="#4a4a4f">队列 Queue（FIFO 先进先出）</text>
    <text x="720" y="450" fill="#4a4a4f">栈 / 递归（LIFO 后进先出）</text>
    <!-- r2 推进方式 -->
    <text x="48" y="478" fill="#4a4a4f" font-weight="700">推进方式</text>
    <text x="348" y="478" fill="#4a4a4f">从起点逐层向外扩散（就近优先）</text>
    <text x="720" y="478" fill="#4a4a4f">沿一条路径钻到底，再回溯换分支</text>
    <!-- r3 无权最短路 -->
    <rect x="30" y="488" width="1060" height="28" fill="#f6fbf8"/>
    <text x="48" y="506" fill="#4a4a4f" font-weight="700">无权图最短路</text>
    <text x="348" y="506" fill="#1f6b4a">✓ 层号即最短跳数，天然求最短路</text>
    <text x="720" y="506" fill="#8a4038">✗ 先到不一定最短，不保证</text>
    <!-- r4 空间峰值 -->
    <text x="48" y="534" fill="#4a4a4f" font-weight="700">空间峰值</text>
    <text x="348" y="534" fill="#4a4a4f">O(V)：最宽一层的顶点都在队列</text>
    <text x="720" y="534" fill="#4a4a4f">O(V)：最深一条路径都在栈上</text>
    <!-- r5 访问序（本例） -->
    <rect x="30" y="544" width="1060" height="28" fill="#f6fbf8"/>
    <text x="48" y="562" fill="#4a4a4f" font-weight="700">本篇例图访问序</text>
    <text x="348" y="562" fill="#1f6b4a">1 → 2 → 3 → 4 → 5（按层）</text>
    <text x="720" y="562" fill="#1f6b4a">1 → 2 → 4 → 5 → 3（按深）</text>
    <!-- r6 用途 -->
    <rect x="30" y="572" width="1060" height="26" fill="#e7f4ee"/>
    <text x="48" y="589" fill="#1f6b4a" font-weight="700">典型用途</text>
    <text x="348" y="589" fill="#1f6b4a">最短路 · 层序 · 洪泛广播 · N 度关系</text>
    <text x="720" y="589" fill="#1f6b4a">连通/环检测 · 拓扑排序 · 回溯搜索</text>
  </g>

  <!-- 底部选型一句话 -->
  <rect x="30" y="606" width="1060" height="0" fill="none"/>
  <text x="30" y="626" font-size="10.5" fill="#6e6e73">选型口诀：存关系——稠密选矩阵、稀疏选邻接表；走关系——要「最近/最短/逐层」选 BFS，要「深挖/连通/回溯」选 DFS。</text>
</svg>
