<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="660" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">图 · 邻接矩阵：V×V 方阵，M[i][j]=1 表示顶点 i 与 j 之间有边</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">用「顶点索引」作行列下标；无向图矩阵关于主对角线对称。空间 O(V²)、查边 O(1)，代价是增删顶点要重建整个矩阵</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">顶点 / 边</text>
  <rect x="150" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="168" y="82" font-size="10.5" fill="#3a3a3c">M[i][j]=1（有边）</text>
  <rect x="320" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="338" y="82" font-size="10.5" fill="#3a3a3c">对称的一对 (i,j)=(j,i)</text>
  <line x1="500" y1="78" x2="524" y2="78" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/><text x="530" y="82" font-size="10.5" fill="#3a3a3c">加一条边 → 同时置两格</text>

  <!-- ===== 左：图 ===== -->
  <text x="30" y="116" font-size="12" font-weight="700" fill="#20375e">同一张图（顶点旁标注索引 idx）</text>
  <rect x="30" y="128" width="300" height="316" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <g stroke="#4a7fd0" stroke-width="2">
    <line x1="180" y1="188" x2="105" y2="266"/>
    <line x1="180" y1="188" x2="255" y2="266"/>
    <line x1="105" y1="266" x2="105" y2="356"/>
    <line x1="105" y1="266" x2="255" y2="356"/>
    <line x1="255" y1="266" x2="255" y2="356"/>
  </g>
  <!-- 边 (2,5) 高亮 -->
  <line x1="105" y1="266" x2="255" y2="356" stroke="#2f9e6e" stroke-width="3"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="180" cy="188" r="20" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="180" y="193" fill="#20375e">1</text>
    <circle cx="105" cy="266" r="20" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="105" y="271" fill="#20375e">2</text>
    <circle cx="255" cy="266" r="20" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="255" y="271" fill="#20375e">3</text>
    <circle cx="105" cy="356" r="20" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="105" y="361" fill="#20375e">4</text>
    <circle cx="255" cy="356" r="20" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="255" y="361" fill="#20375e">5</text>
  </g>
  <g font-size="9" fill="#8a97ab" text-anchor="middle">
    <text x="180" y="164">idx0</text><text x="78" y="266">idx1</text><text x="282" y="266">idx2</text><text x="78" y="356">idx3</text><text x="282" y="356">idx4</text>
  </g>
  <text x="180" y="392" font-size="10" fill="#2f6b4e" text-anchor="middle">绿边 (2,5)：值→索引 = (1,4)</text>
  <text x="180" y="422" font-size="10" fill="#6e6e73" text-anchor="middle">vertices = [1,2,3,4,5]，索引即行列号</text>

  <!-- ===== 中：矩阵 ===== -->
  <text x="360" y="116" font-size="12" font-weight="700" fill="#8a5a12">V×V 邻接矩阵（行 i = 从，列 j = 到）</text>
  <rect x="360" y="128" width="360" height="360" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <!-- 列头 -->
  <g font-size="11" text-anchor="middle" fill="#6e6e73">
    <text x="486" y="192">1</text><text x="530" y="192">2</text><text x="574" y="192">3</text><text x="618" y="192">4</text><text x="662" y="192">5</text>
    <text x="486" y="204" font-size="8">idx0</text><text x="530" y="204" font-size="8">idx1</text><text x="574" y="204" font-size="8">idx2</text><text x="618" y="204" font-size="8">idx3</text><text x="662" y="204" font-size="8">idx4</text>
  </g>
  <!-- 对角线阴影背景 -->
  <g fill="#f0f0f2">
    <rect x="464" y="212" width="44" height="40"/><rect x="508" y="252" width="44" height="40"/><rect x="552" y="292" width="44" height="40"/><rect x="596" y="332" width="44" height="40"/><rect x="640" y="372" width="44" height="40"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <!-- headers rows -->
    <g fill="#6e6e73" font-size="11">
      <text x="440" y="236">1</text><text x="440" y="276">2</text><text x="440" y="316">3</text><text x="440" y="356">4</text><text x="440" y="396">5</text>
    </g>
    <!-- row v1(idx0): 0 1 1 0 0 -->
    <rect x="464" y="212" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="486" y="237" fill="#a1a1a6">0</text>
    <rect x="508" y="212" width="44" height="40" fill="#fdf3e0" stroke="#e7c07a"/><text x="530" y="237" fill="#8a5a12" font-weight="700">1</text>
    <rect x="552" y="212" width="44" height="40" fill="#fdf3e0" stroke="#e7c07a"/><text x="574" y="237" fill="#8a5a12" font-weight="700">1</text>
    <rect x="596" y="212" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="618" y="237" fill="#a1a1a6">0</text>
    <rect x="640" y="212" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="662" y="237" fill="#a1a1a6">0</text>
    <!-- row v2(idx1): 1 0 0 1 1 -->
    <rect x="464" y="252" width="44" height="40" fill="#fdf3e0" stroke="#e7c07a"/><text x="486" y="277" fill="#8a5a12" font-weight="700">1</text>
    <rect x="508" y="252" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="530" y="277" fill="#a1a1a6">0</text>
    <rect x="552" y="252" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="574" y="277" fill="#a1a1a6">0</text>
    <rect x="596" y="252" width="44" height="40" fill="#fdf3e0" stroke="#e7c07a"/><text x="618" y="277" fill="#8a5a12" font-weight="700">1</text>
    <rect x="640" y="252" width="44" height="40" fill="#e3f4ec" stroke="#2f9e6e" stroke-width="1.8"/><text x="662" y="277" fill="#1f6b4a" font-weight="700">1</text>
    <!-- row v3(idx2): 1 0 0 0 1 -->
    <rect x="464" y="292" width="44" height="40" fill="#fdf3e0" stroke="#e7c07a"/><text x="486" y="317" fill="#8a5a12" font-weight="700">1</text>
    <rect x="508" y="292" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="530" y="317" fill="#a1a1a6">0</text>
    <rect x="552" y="292" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="574" y="317" fill="#a1a1a6">0</text>
    <rect x="596" y="292" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="618" y="317" fill="#a1a1a6">0</text>
    <rect x="640" y="292" width="44" height="40" fill="#fdf3e0" stroke="#e7c07a"/><text x="662" y="317" fill="#8a5a12" font-weight="700">1</text>
    <!-- row v4(idx3): 0 1 0 0 0 -->
    <rect x="464" y="332" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="486" y="357" fill="#a1a1a6">0</text>
    <rect x="508" y="332" width="44" height="40" fill="#fdf3e0" stroke="#e7c07a"/><text x="530" y="357" fill="#8a5a12" font-weight="700">1</text>
    <rect x="552" y="332" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="574" y="357" fill="#a1a1a6">0</text>
    <rect x="596" y="332" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="618" y="357" fill="#a1a1a6">0</text>
    <rect x="640" y="332" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="662" y="357" fill="#a1a1a6">0</text>
    <!-- row v5(idx4): 0 1 1 0 0 -->
    <rect x="464" y="372" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="486" y="397" fill="#a1a1a6">0</text>
    <rect x="508" y="372" width="44" height="40" fill="#e3f4ec" stroke="#2f9e6e" stroke-width="1.8"/><text x="530" y="397" fill="#1f6b4a" font-weight="700">1</text>
    <rect x="552" y="372" width="44" height="40" fill="#fdf3e0" stroke="#e7c07a"/><text x="574" y="397" fill="#8a5a12" font-weight="700">1</text>
    <rect x="596" y="372" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="618" y="397" fill="#a1a1a6">0</text>
    <rect x="640" y="372" width="44" height="40" fill="none" stroke="#e4e7ec"/><text x="662" y="397" fill="#a1a1a6">0</text>
  </g>
  <!-- 对角线标注 -->
  <line x1="470" y1="218" x2="678" y2="406" stroke="#8a97ab" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="500" y="440" font-size="10" fill="#6e6e73">灰底对角线 M[i][i]=0：无自环（代码禁止 i==j）</text>
  <text x="500" y="458" font-size="10" fill="#2f6b4e">绿框 M[1][4]=M[4][1]=1：边 (2,5) 的对称两格</text>
  <text x="500" y="476" font-size="10" fill="#8a5a12">琥珀格 = 有边；每条无向边在矩阵里出现两次</text>

  <!-- ===== 右：操作复杂度 ===== -->
  <text x="740" y="116" font-size="12" font-weight="700" fill="#20375e">操作与代价</text>
  <rect x="740" y="128" width="350" height="98" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="758" y="152" font-size="11" font-weight="700" fill="#2f6b4e">查边 addEdge / 查询　O(1)</text>
  <text x="758" y="174" font-size="10" fill="#4a4a4f">加边：M[i][j]=1 且 M[j][i]=1（无向→两处）</text>
  <text x="758" y="192" font-size="10" fill="#4a4a4f">问「i、j 相邻吗？」直接读 M[i][j]，一次寻址</text>
  <text x="758" y="212" font-size="10" fill="#6e6e73">这是矩阵最大的优点：随机查边是常数时间</text>

  <rect x="740" y="238" width="350" height="120" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="758" y="262" font-size="11" font-weight="700" fill="#8a5a12">加顶点 addVertex　O(V)</text>
  <text x="758" y="284" font-size="10" fill="#4a4a4f">矩阵要「加一行 + 加一列」，每个已有行都要 append</text>
  <!-- mini matrix grow -->
  <g font-size="9" text-anchor="middle">
    <rect x="758" y="298" width="20" height="20" fill="#f0f0f2" stroke="#d7d7dd"/><rect x="778" y="298" width="20" height="20" fill="#f0f0f2" stroke="#d7d7dd"/>
    <rect x="758" y="318" width="20" height="20" fill="#f0f0f2" stroke="#d7d7dd"/><rect x="778" y="318" width="20" height="20" fill="#f0f0f2" stroke="#d7d7dd"/>
    <rect x="798" y="298" width="20" height="20" fill="#eaf1fb" stroke="#4a7fd0"/><rect x="798" y="318" width="20" height="20" fill="#eaf1fb" stroke="#4a7fd0"/>
    <rect x="758" y="338" width="20" height="20" fill="#eaf1fb" stroke="#4a7fd0"/><rect x="778" y="338" width="20" height="20" fill="#eaf1fb" stroke="#4a7fd0"/><rect x="798" y="338" width="20" height="20" fill="#eaf1fb" stroke="#4a7fd0"/>
  </g>
  <text x="832" y="326" font-size="10" fill="#4a4a4f">蓝格 = 新增的</text>
  <text x="832" y="344" font-size="10" fill="#4a4a4f">一行 + 一列</text>

  <rect x="740" y="370" width="350" height="118" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="758" y="394" font-size="11" font-weight="700" fill="#d99a2b">删顶点 removeVertex　O(V²)</text>
  <text x="758" y="416" font-size="10" fill="#4a4a4f">删索引 index 的整行，再从每一行删对应列</text>
  <text x="758" y="434" font-size="10" fill="#4a4a4f">后续行列整体前移、下标重排 → 近乎重建矩阵</text>
  <text x="758" y="456" font-size="10" fill="#6e6e73">结论：矩阵擅长「查」，不擅长顶点集频繁变动</text>
  <text x="758" y="476" font-size="10" fill="#6e6e73">空间恒为 O(V²)，与实际边数无关（稀疏图浪费）</text>

  <!-- 底部性质 -->
  <rect x="30" y="504" width="1060" height="128" rx="14" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="48" y="530" font-size="12" font-weight="700" fill="#1d1d1f">为什么这样设计</text>
  <text x="48" y="556" font-size="10.5" fill="#4a4a4f">矩阵把「关系」摊平成一张定长表：行列都以顶点索引寻址，于是「i 和 j 有没有边」退化为一次数组随机读——这正是它的立身之本。</text>
  <text x="48" y="578" font-size="10.5" fill="#4a4a4f">代价是空间恒定 O(V²)：哪怕只有几条边，也要为所有 V² 个「可能的边」留位；且顶点索引写死在行列里，一旦增删顶点就要移动整片数据。</text>
  <text x="48" y="600" font-size="10.5" fill="#4a4a4f">所以矩阵的甜区是<tspan font-weight="700" fill="#8a5a12">稠密图 + 顶点固定 + 频繁查边</tspan>；反之——稀疏、顶点常变——就该换邻接表（见 G2）。</text>
  <text x="48" y="622" font-size="10" fill="#6e6e73">无向图必对称，故实现只需存半张即可省一半空间；本参考实现为简明起见存了整张。</text>
</svg>
