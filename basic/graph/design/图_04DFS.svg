<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">图 · 深度优先遍历 DFS：递归（隐式栈）一路深入到底，无路可走再回溯</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">访问一个顶点即标 visited 并记录，然后对第一个未访问邻居递归深入；返回即回溯到上层试下一个分支。起点=1，访问序 1→2→4→5→3</text>

  <!-- 图例 -->
  <line x1="30" y1="78" x2="54" y2="78" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/><text x="60" y="82" font-size="10.5" fill="#3a3a3c">深入（进入递归，走树边）</text>
  <line x1="250" y1="78" x2="274" y2="78" stroke="#d1544a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aR)"/><text x="280" y="82" font-size="10.5" fill="#3a3a3c">回溯（递归返回）</text>
  <rect x="430" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="448" y="82" font-size="10.5" fill="#3a3a3c">递归调用栈帧</text>
  <rect x="560" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="578" y="82" font-size="10.5" fill="#3a3a3c">已访问 / 当前栈顶</text>

  <!-- ===== 左：图（深入/回溯路径） ===== -->
  <text x="30" y="112" font-size="12" font-weight="700" fill="#2f6b4e">深入与回溯（顶点角标 = 访问次序）</text>
  <rect x="30" y="124" width="320" height="292" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <!-- 非树边 1-3 -->
  <line x1="190" y1="192" x2="270" y2="262" stroke="#c9ccd1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="240" y="212" font-size="8.5" fill="#a1a1a6">非树边</text>
  <!-- 树边淡蓝 -->
  <g stroke="#4a7fd0" stroke-width="1.4" opacity="0.35">
    <line x1="190" y1="192" x2="120" y2="262"/>
    <line x1="120" y1="262" x2="120" y2="348"/>
    <line x1="120" y1="262" x2="270" y2="348"/>
    <line x1="270" y1="262" x2="270" y2="348"/>
  </g>
  <!-- 深入箭头 -->
  <g stroke="#2f9e6e" stroke-width="2.4" fill="none">
    <line x1="177" y1="203" x2="133" y2="251" marker-end="url(#aG)"/>
    <line x1="120" y1="282" x2="120" y2="328" marker-end="url(#aG)"/>
    <line x1="137" y1="273" x2="253" y2="337" marker-end="url(#aG)"/>
    <line x1="270" y1="328" x2="270" y2="282" marker-end="url(#aG)"/>
  </g>
  <text x="150" y="224" font-size="10" font-weight="700" fill="#1f6b4a">①</text>
  <text x="128" y="308" font-size="10" font-weight="700" fill="#1f6b4a">②</text>
  <text x="196" y="318" font-size="10" font-weight="700" fill="#1f6b4a">③</text>
  <text x="278" y="308" font-size="10" font-weight="700" fill="#1f6b4a">④</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="190" cy="192" r="20" fill="#c9ead9" stroke="#2f9e6e" stroke-width="1.8"/><text x="190" y="197" fill="#1f6b4a">1</text>
    <circle cx="120" cy="262" r="20" fill="#c9ead9" stroke="#2f9e6e" stroke-width="1.8"/><text x="120" y="267" fill="#1f6b4a">2</text>
    <circle cx="270" cy="262" r="20" fill="#c9ead9" stroke="#2f9e6e" stroke-width="1.8"/><text x="270" y="267" fill="#1f6b4a">3</text>
    <circle cx="120" cy="348" r="20" fill="#c9ead9" stroke="#2f9e6e" stroke-width="1.8"/><text x="120" y="353" fill="#1f6b4a">4</text>
    <circle cx="270" cy="348" r="20" fill="#c9ead9" stroke="#2f9e6e" stroke-width="1.8"/><text x="270" y="353" fill="#1f6b4a">5</text>
  </g>
  <g font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="207" cy="176" r="8" fill="#2f9e6e"/><text x="207" y="179">1</text>
    <circle cx="103" cy="246" r="8" fill="#2f9e6e"/><text x="103" y="249">2</text>
    <circle cx="253" cy="246" r="8" fill="#2f9e6e"/><text x="253" y="249">5</text>
    <circle cx="103" cy="332" r="8" fill="#2f9e6e"/><text x="103" y="335">3</text>
    <circle cx="287" cy="332" r="8" fill="#2f9e6e"/><text x="287" y="335">4</text>
  </g>
  <text x="180" y="386" font-size="9.5" fill="#8a4038" text-anchor="middle">4 是死路 → 回溯到 2 再走 5</text>
  <text x="180" y="402" font-size="9.5" fill="#8a4038" text-anchor="middle">3 走完 → 逐层回溯到 1，结束</text>

  <!-- ===== 右上：机制 ===== -->
  <text x="372" y="112" font-size="12" font-weight="700" fill="#20375e">机制：递归栈决定「先钻到底」</text>
  <rect x="372" y="124" width="718" height="128" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="392" y="150" font-size="10.5" fill="#4a4a4f">1. 进入 dfs(v)：把 v 记入结果并标 visited，然后遍历它的邻居。</text>
  <text x="392" y="172" font-size="10.5" fill="#4a4a4f">2. 遇到第一个未访问邻居就<tspan font-weight="700" fill="#2f6b4e">立刻递归深入</tspan>——不像 BFS 把邻居全排队，而是一头扎进去。</text>
  <text x="392" y="194" font-size="10.5" fill="#4a4a4f">3. 邻居全已访问 → 函数返回 = <tspan font-weight="700" fill="#8a4038">回溯</tspan>到上一层，继续它剩下的邻居。</text>
  <text x="392" y="216" font-size="10.5" fill="#4a4a4f">4. 递归天然用调用栈；也可显式用栈改写。时间 O(V+E)，栈深最坏 O(V)。</text>
  <text x="392" y="238" font-size="10" fill="#8a4038">注意：3 经由 5 的邻居进入（树边 5–3），边 1–3 成为「非树边」未用于首次访问。</text>

  <!-- ===== 右下：树边/非树边 ===== -->
  <rect x="372" y="264" width="718" height="152" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="392" y="288" font-size="11" font-weight="700" fill="#20375e">DFS 树边 vs 非树边</text>
  <text x="392" y="312" font-size="10.5" fill="#4a4a4f"><tspan font-weight="700" fill="#2f6b4e">树边</tspan>：首次访问某顶点时「深入」所走的边，构成一棵 DFS 树。</text>
  <text x="392" y="332" font-size="10.5" fill="#4a4a4f">本例树边：1–2、2–4、2–5、5–3（共 4 条 = V−1，恰为一棵树）。</text>
  <text x="392" y="356" font-size="10.5" fill="#4a4a4f"><tspan font-weight="700" fill="#8a97ab">非树边</tspan>：指向「已访问顶点」的边，遍历中被跳过（不再深入）。</text>
  <text x="392" y="376" font-size="10.5" fill="#4a4a4f">本例非树边：1–3（访问 3 时经由 5，边 1–3 已无新可达）。</text>
  <text x="392" y="400" font-size="10" fill="#6e6e73">无向图里非树边即「回边」，是<tspan font-weight="700">环检测</tspan>的信号：碰到指向已访问且非父的顶点 = 存在环。</text>

  <!-- ===== 调用栈深度时间线 ===== -->
  <text x="30" y="442" font-size="12" font-weight="700" fill="#8a5a12">调用栈深度随时间变化（栈底在下，栈顶为当前顶点）— 先涨后落的「深入-回溯」轮廓</text>
  <rect x="30" y="452" width="1060" height="212" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <!-- 基线 y=628 -->
  <line x1="60" y1="628" x2="1076" y2="628" stroke="#d7d7dd" stroke-width="1.2"/>
  <!-- 轮廓线 -->
  <path d="M90 604 L198 578 L306 552 L414 578 L522 552 L630 526 L738 552 L846 578 L954 604 L1062 628" fill="none" stroke="#8a6fd0" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="630" y="514" font-size="9" fill="#8a6fd0" text-anchor="middle">↑ 栈顶轮廓：深入时升高，回溯时回落</text>
  <!-- t1 depth1 [1] -->
  <g font-size="11" text-anchor="middle">
    <rect x="70" y="604" width="40" height="24" rx="4" fill="#c9ead9" stroke="#2f9e6e"/><text x="90" y="620" fill="#1f6b4a" font-weight="700">1</text>
  </g>
  <text x="90" y="646" font-size="9" fill="#2f6b4e" text-anchor="middle">进 1</text>
  <!-- t2 depth2 -->
  <g font-size="11" text-anchor="middle">
    <rect x="178" y="604" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="198" y="620" fill="#8a5a12">1</text>
    <rect x="178" y="578" width="40" height="24" rx="4" fill="#c9ead9" stroke="#2f9e6e"/><text x="198" y="594" fill="#1f6b4a" font-weight="700">2</text>
  </g>
  <text x="198" y="646" font-size="9" fill="#2f6b4e" text-anchor="middle">进 2</text>
  <!-- t3 depth3 [1,2,4] -->
  <g font-size="11" text-anchor="middle">
    <rect x="286" y="604" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="306" y="620" fill="#8a5a12">1</text>
    <rect x="286" y="578" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="306" y="594" fill="#8a5a12">2</text>
    <rect x="286" y="552" width="40" height="24" rx="4" fill="#c9ead9" stroke="#2f9e6e"/><text x="306" y="568" fill="#1f6b4a" font-weight="700">4</text>
  </g>
  <text x="306" y="646" font-size="9" fill="#2f6b4e" text-anchor="middle">进 4</text>
  <text x="306" y="658" font-size="8.5" fill="#8a4038" text-anchor="middle">死路</text>
  <!-- t4 depth2 return4 -->
  <g font-size="11" text-anchor="middle">
    <rect x="394" y="604" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="414" y="620" fill="#8a5a12">1</text>
    <rect x="394" y="578" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="414" y="594" fill="#8a5a12">2</text>
    <rect x="394" y="552" width="40" height="24" rx="4" fill="none" stroke="#e8a79f" stroke-dasharray="3 2"/><text x="414" y="568" fill="#c08b84" font-size="9">出4</text>
  </g>
  <text x="414" y="646" font-size="9" fill="#8a4038" text-anchor="middle">回溯</text>
  <!-- t5 depth3 [1,2,5] -->
  <g font-size="11" text-anchor="middle">
    <rect x="502" y="604" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="522" y="620" fill="#8a5a12">1</text>
    <rect x="502" y="578" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="522" y="594" fill="#8a5a12">2</text>
    <rect x="502" y="552" width="40" height="24" rx="4" fill="#c9ead9" stroke="#2f9e6e"/><text x="522" y="568" fill="#1f6b4a" font-weight="700">5</text>
  </g>
  <text x="522" y="646" font-size="9" fill="#2f6b4e" text-anchor="middle">进 5</text>
  <!-- t6 depth4 [1,2,5,3] -->
  <g font-size="11" text-anchor="middle">
    <rect x="610" y="604" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="630" y="620" fill="#8a5a12">1</text>
    <rect x="610" y="578" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="630" y="594" fill="#8a5a12">2</text>
    <rect x="610" y="552" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="630" y="568" fill="#8a5a12">5</text>
    <rect x="610" y="526" width="40" height="24" rx="4" fill="#c9ead9" stroke="#2f9e6e"/><text x="630" y="542" fill="#1f6b4a" font-weight="700">3</text>
  </g>
  <text x="630" y="646" font-size="9" fill="#2f6b4e" text-anchor="middle">进 3</text>
  <text x="630" y="658" font-size="8.5" fill="#8a4038" text-anchor="middle">死路</text>
  <!-- t7 depth3 return3 -->
  <g font-size="11" text-anchor="middle">
    <rect x="718" y="604" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="738" y="620" fill="#8a5a12">1</text>
    <rect x="718" y="578" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="738" y="594" fill="#8a5a12">2</text>
    <rect x="718" y="552" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="738" y="568" fill="#8a5a12">5</text>
    <rect x="718" y="526" width="40" height="24" rx="4" fill="none" stroke="#e8a79f" stroke-dasharray="3 2"/><text x="738" y="542" fill="#c08b84" font-size="9">出3</text>
  </g>
  <text x="738" y="646" font-size="9" fill="#8a4038" text-anchor="middle">回溯</text>
  <!-- t8 depth2 return5 -->
  <g font-size="11" text-anchor="middle">
    <rect x="826" y="604" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="846" y="620" fill="#8a5a12">1</text>
    <rect x="826" y="578" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="846" y="594" fill="#8a5a12">2</text>
    <rect x="826" y="552" width="40" height="24" rx="4" fill="none" stroke="#e8a79f" stroke-dasharray="3 2"/><text x="846" y="568" fill="#c08b84" font-size="9">出5</text>
  </g>
  <text x="846" y="646" font-size="9" fill="#8a4038" text-anchor="middle">回溯</text>
  <!-- t9 depth1 return2 -->
  <g font-size="11" text-anchor="middle">
    <rect x="934" y="604" width="40" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="954" y="620" fill="#8a5a12">1</text>
    <rect x="934" y="578" width="40" height="24" rx="4" fill="none" stroke="#e8a79f" stroke-dasharray="3 2"/><text x="954" y="594" fill="#c08b84" font-size="9">出2</text>
  </g>
  <text x="954" y="646" font-size="9" fill="#8a4038" text-anchor="middle">回溯</text>
  <!-- t10 depth0 return1 -->
  <g font-size="11" text-anchor="middle">
    <rect x="1042" y="604" width="40" height="24" rx="4" fill="none" stroke="#e8a79f" stroke-dasharray="3 2"/><text x="1062" y="620" fill="#c08b84" font-size="9">出1</text>
  </g>
  <text x="1062" y="646" font-size="9" fill="#8a4038" text-anchor="middle">栈空·结束</text>

  <!-- 底部不变式 -->
  <rect x="30" y="672" width="1060" height="42" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="48" y="690" font-size="10.5" fill="#4a4a4f"><tspan font-weight="700" fill="#2f6b4e">访问序 1 → 2 → 4 → 5 → 3</tspan>　与 BFS 同用 visited 保证不重不漏，但「下一个访问谁」由栈（后进先出）决定，故先钻到底再回头。</text>
  <text x="48" y="708" font-size="10.5" fill="#4a4a4f"><tspan font-weight="700" fill="#2f6b4e">用途</tspan>　连通性判定、路径/环检测、拓扑排序、生成树，以及回溯类搜索（全排列、N 皇后）——都建立在 DFS 的深入-回溯骨架上。</text>
</svg>
