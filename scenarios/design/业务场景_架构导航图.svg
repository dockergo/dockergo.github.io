<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 760" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',sans-serif">
  <defs>
    <filter id="sfSoft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0a0a0a" flood-opacity="0.10"/>
    </filter>
    <marker id="sfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8f98"/>
    </marker>
    <linearGradient id="sfPayBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5ff"/><stop offset="1" stop-color="#e4eeff"/>
    </linearGradient>
    <linearGradient id="sfDiscBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f0ff"/><stop offset="1" stop-color="#efe7fd"/>
    </linearGradient>
    <linearGradient id="sfSocialBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafaf3"/><stop offset="1" stop-color="#dff5ea"/>
    </linearGradient>
    <linearGradient id="sfGrowthBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4ec"/><stop offset="1" stop-color="#ffe9db"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1230" height="760" fill="#fbfbfd" class="ag-bg"/>

  <text x="70" y="52" font-size="20" font-weight="800" fill="#1d1d1f">互联网 TOP10 核心业务场景 · 技术全景</text>
  <text x="70" y="76" font-size="12.5" fill="#8a8a8e">上层 10 类高频场景 ── 中层 7 项跨场景通用组件 ── 底层基础设施底座</text>

  <!-- ============ 上层:业务场景(白卡 + 分类彩色描边) ============ -->
  <!-- 交易支付类:ecommerce / seckill / payment (蓝 #0071e3) -->
  <rect x="60" y="124" width="265" height="116" rx="16" fill="url(#sfPayBand)" stroke="#d7e4fb" class="sf-band-pay"/>
  <text x="72" y="118" font-size="13" font-weight="700" fill="#0071e3" class="sf-cat-pay">交易支付类</text>
  <rect x="72" y="146" width="77" height="84" rx="12" fill="#f4f8ff" stroke="#0071e3" stroke-width="1.4" class="sc-scene sc-pay" filter="url(#sfSoft)"/>
  <text x="110" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">电商</text>
  <text x="110" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">订单</text>
  <rect x="153" y="146" width="77" height="84" rx="12" fill="#f4f8ff" stroke="#0071e3" stroke-width="1.4" class="sc-scene sc-pay" filter="url(#sfSoft)"/>
  <text x="191" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">秒杀</text>
  <text x="191" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">抢购</text>
  <rect x="234" y="146" width="79" height="84" rx="12" fill="#f4f8ff" stroke="#0071e3" stroke-width="1.4" class="sc-scene sc-pay" filter="url(#sfSoft)"/>
  <text x="273" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">支付</text>
  <text x="273" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">清结算</text>
  <rect x="72" y="146" width="79" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="ecommerce" data-lab="交易支付类"/>
  <rect x="153" y="146" width="79" height="84" fill="#ffffff" fill-opacity="0" data-tid="seckill" data-lab="交易支付类"/>
  <rect x="234" y="146" width="79" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="payment" data-lab="交易支付类"/>

  <!-- 内容发现类:search / recommend / feed (紫 #7c3aed) -->
  <rect x="333" y="124" width="265" height="116" rx="16" fill="url(#sfDiscBand)" stroke="#e2d6f7" class="sf-band-disc"/>
  <text x="345" y="118" font-size="13" font-weight="700" fill="#7c3aed" class="sf-cat-disc">内容发现类</text>
  <rect x="345" y="146" width="77" height="84" rx="12" fill="#faf6ff" stroke="#7c3aed" stroke-width="1.4" class="sc-scene sc-disc" filter="url(#sfSoft)"/>
  <text x="383" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">搜索</text>
  <text x="383" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">检索</text>
  <rect x="426" y="146" width="77" height="84" rx="12" fill="#faf6ff" stroke="#7c3aed" stroke-width="1.4" class="sc-scene sc-disc" filter="url(#sfSoft)"/>
  <text x="464" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">个性</text>
  <text x="464" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">推荐</text>
  <rect x="507" y="146" width="79" height="84" rx="12" fill="#faf6ff" stroke="#7c3aed" stroke-width="1.4" class="sc-scene sc-disc" filter="url(#sfSoft)"/>
  <text x="546" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">信息</text>
  <text x="546" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">流</text>
  <rect x="345" y="146" width="79" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="search" data-lab="内容发现类"/>
  <rect x="426" y="146" width="79" height="84" fill="#ffffff" fill-opacity="0" data-tid="recommend" data-lab="内容发现类"/>
  <rect x="507" y="146" width="79" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="feed" data-lab="内容发现类"/>

  <!-- 社交互动类:im / live (绿 #34c759) -->
  <rect x="606" y="124" width="265" height="116" rx="16" fill="url(#sfSocialBand)" stroke="#c9ecd7" class="sf-band-social"/>
  <text x="618" y="118" font-size="13" font-weight="700" fill="#2aa14b" class="sf-cat-social">社交互动类</text>
  <rect x="618" y="146" width="117" height="84" rx="12" fill="#f1faf4" stroke="#34c759" stroke-width="1.4" class="sc-scene sc-social" filter="url(#sfSoft)"/>
  <text x="676" y="194" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">即时通讯</text>
  <rect x="739" y="146" width="120" height="84" rx="12" fill="#f1faf4" stroke="#34c759" stroke-width="1.4" class="sc-scene sc-social" filter="url(#sfSoft)"/>
  <text x="799" y="194" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">直播互动</text>
  <rect x="618" y="146" width="121" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="im" data-lab="社交互动类"/>
  <rect x="739" y="146" width="120" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="live" data-lab="社交互动类"/>

  <!-- 增长风控类:ad / risk (橙 #ff9f0a) -->
  <rect x="879" y="124" width="265" height="116" rx="16" fill="url(#sfGrowthBand)" stroke="#f7dcc0" class="sf-band-growth"/>
  <text x="891" y="118" font-size="13" font-weight="700" fill="#d98207" class="sf-cat-growth">增长风控类</text>
  <rect x="891" y="146" width="117" height="84" rx="12" fill="#fff7ef" stroke="#ff9f0a" stroke-width="1.4" class="sc-scene sc-growth" filter="url(#sfSoft)"/>
  <text x="949" y="194" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">广告竞价</text>
  <rect x="1012" y="146" width="120" height="84" rx="12" fill="#fff7ef" stroke="#ff9f0a" stroke-width="1.4" class="sc-scene sc-growth" filter="url(#sfSoft)"/>
  <text x="1072" y="194" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">实时风控</text>
  <rect x="891" y="146" width="121" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="ad" data-lab="增长风控类"/>
  <rect x="1012" y="146" width="120" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="risk" data-lab="增长风控类"/>

  <!-- 层间箭头 上→中 -->
  <path d="M601 244 L601 288" fill="none" stroke="#8a8f98" class="ag-line" stroke-width="2" marker-end="url(#sfArrow)"/>

  <!-- ============ 中层:7 项跨场景通用技术组件(浅底 tint 卡) ============ -->
  <text x="72" y="316" font-size="13" font-weight="700" fill="#8a8a8e" class="ag-sub">跨场景通用技术组件 · 支撑上层所有高频场景</text>
  <rect x="70" y="328" width="1090" height="150" rx="18" fill="#f4f4f7" stroke="#dcdce2" class="ag-band"/>

  <!-- 1 分布式ID -->
  <rect x="86" y="346" width="144" height="114" rx="12" fill="#f8fafc" class="ag-tint"/>
  <text x="158" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">分布式 ID</text>
  <text x="158" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">雪花算法</text>
  <text x="158" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">号段模式</text>
  <text x="158" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">全局唯一 · 趋势递增</text>

  <!-- 2 分库分表 -->
  <rect x="238" y="346" width="144" height="114" rx="12" fill="#f1f5f9" class="ag-tint"/>
  <text x="310" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">分库分表</text>
  <text x="310" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">ShardingSphere</text>
  <text x="310" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Vitess</text>
  <text x="310" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">水平拆分 · 路由聚合</text>

  <!-- 3 多级缓存 -->
  <rect x="390" y="346" width="144" height="114" rx="12" fill="#fcf4ff" class="ag-tint"/>
  <text x="462" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">多级缓存</text>
  <text x="462" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">本地 + Redis + CDN</text>
  <text x="462" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">穿透 · 击穿 · 雪崩</text>
  <text x="462" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">热点读加速</text>

  <!-- 4 消息队列 -->
  <rect x="542" y="346" width="144" height="114" rx="12" fill="#fffcf0" class="ag-tint"/>
  <text x="614" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">消息队列</text>
  <text x="614" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Kafka · RocketMQ</text>
  <text x="614" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">异步 · 解耦 · 削峰</text>
  <text x="614" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">流量缓冲</text>

  <!-- 5 限流降级熔断 -->
  <rect x="694" y="346" width="144" height="114" rx="12" fill="#f8fafc" class="ag-tint"/>
  <text x="766" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">限流降级熔断</text>
  <text x="766" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Sentinel</text>
  <text x="766" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Hystrix</text>
  <text x="766" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">过载保护</text>

  <!-- 6 分布式事务 -->
  <rect x="846" y="346" width="144" height="114" rx="12" fill="#f1f5f9" class="ag-tint"/>
  <text x="918" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">分布式事务</text>
  <text x="918" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">TCC · Saga</text>
  <text x="918" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">可靠消息</text>
  <text x="918" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">最终一致性</text>

  <!-- 7 分布式锁 -->
  <rect x="998" y="346" width="146" height="114" rx="12" fill="#fcf4ff" class="ag-tint"/>
  <text x="1071" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">分布式锁</text>
  <text x="1071" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Redis</text>
  <text x="1071" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">ZooKeeper</text>
  <text x="1071" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">互斥 · 幂等</text>

  <!-- 层间箭头 中→底 -->
  <path d="M601 490 L601 534" fill="none" stroke="#8a8f98" class="ag-line" stroke-width="2" marker-end="url(#sfArrow)"/>

  <!-- ============ 底层:基础设施底座(白卡) ============ -->
  <text x="72" y="562" font-size="13" font-weight="700" fill="#8a8a8e" class="ag-sub">基础设施底座</text>
  <rect x="70" y="574" width="352" height="150" rx="16" fill="#ffffff" stroke="#e4e4ec" class="ag-card" filter="url(#sfSoft)"/>
  <text x="246" y="612" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">存储引擎</text>
  <text x="246" y="644" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">MySQL · Redis · Elasticsearch</text>
  <text x="246" y="668" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">HBase · MongoDB</text>
  <text x="246" y="696" font-size="11" fill="#8a8a8e" class="ag-sub" text-anchor="middle">关系 · KV · 检索 · 宽表</text>

  <rect x="438" y="574" width="352" height="150" rx="16" fill="#ffffff" stroke="#e4e4ec" class="ag-card" filter="url(#sfSoft)"/>
  <text x="614" y="612" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">消息与计算</text>
  <text x="614" y="644" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">Kafka · RocketMQ · Pulsar</text>
  <text x="614" y="668" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">Flink · Spark</text>
  <text x="614" y="696" font-size="11" fill="#8a8a8e" class="ag-sub" text-anchor="middle">流式 · 批处理 · 实时数仓</text>

  <rect x="806" y="574" width="354" height="150" rx="16" fill="#ffffff" stroke="#e4e4ec" class="ag-card" filter="url(#sfSoft)"/>
  <text x="983" y="612" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">网络与部署</text>
  <text x="983" y="644" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">CDN · API 网关 · LB</text>
  <text x="983" y="668" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">Kubernetes · 服务网格</text>
  <text x="983" y="696" font-size="11" fill="#8a8a8e" class="ag-sub" text-anchor="middle">接入 · 弹性 · 容器编排</text>
</svg>