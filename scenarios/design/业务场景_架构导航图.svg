<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 760" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',sans-serif">
  <defs>
    <filter id="sfSoft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/>
    </filter>
    <marker id="sfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1a1a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1230" height="760" fill="#fbfbfd" class="ag-bg"/>

  <text x="70" y="50" font-size="15" font-weight="700" fill="#1d1d1f">互联网 TOP10 核心业务场景 · 技术全景</text>
  <text x="70" y="72" font-size="10.5" fill="#6e6e73">上层 10 类高频场景 ── 中层 7 项跨场景通用组件 ── 底层基础设施底座</text>

  <!-- ============ 上层:业务场景(白卡 + 分类彩色描边) ============ -->
  <!-- 交易支付类:ecommerce / fintech / o2o (蓝 #0071e3) -->
  <rect x="60" y="124" width="300" height="116" rx="14" fill="#eaf1fb" stroke="#c6d9f2" class="sf-band-pay"/>
  <text x="72" y="118" font-size="12" font-weight="700" fill="#20375e" class="sf-cat-pay">交易支付类</text>
  <rect x="72" y="146" width="88" height="84" rx="10" fill="#ffffff" stroke="#4a7fd0" stroke-width="1.2" class="sc-scene sc-pay" filter="url(#sfSoft)"/>
  <text x="116" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">电商</text>
  <text x="116" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">交易</text>
  <rect x="166" y="146" width="88" height="84" rx="10" fill="#ffffff" stroke="#4a7fd0" stroke-width="1.2" class="sc-scene sc-pay" filter="url(#sfSoft)"/>
  <text x="210" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">金融</text>
  <text x="210" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">科技</text>
  <rect x="260" y="146" width="88" height="84" rx="10" fill="#ffffff" stroke="#4a7fd0" stroke-width="1.2" class="sc-scene sc-pay" filter="url(#sfSoft)"/>
  <text x="304" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">O2O</text>
  <text x="304" y="204" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">本地生活</text>
  <rect x="72" y="146" width="88" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="ecommerce" data-lab="交易支付类"/>
  <rect x="166" y="146" width="88" height="84" fill="#ffffff" fill-opacity="0" data-tid="fintech" data-lab="交易支付类"/>
  <rect x="260" y="146" width="88" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="o2o" data-lab="交易支付类"/>

  <!-- 内容社交类:social / video (紫 #7c3aed) -->
  <rect x="368" y="124" width="232" height="116" rx="14" fill="#f4eefb" stroke="#dcc9ef" class="sf-band-disc"/>
  <text x="380" y="118" font-size="12" font-weight="700" fill="#6f3ea8" class="sf-cat-disc">内容社交类</text>
  <rect x="380" y="146" width="100" height="84" rx="10" fill="#ffffff" stroke="#8a5cae" stroke-width="1.2" class="sc-scene sc-disc" filter="url(#sfSoft)"/>
  <text x="430" y="194" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">社交网络</text>
  <rect x="486" y="146" width="102" height="84" rx="10" fill="#ffffff" stroke="#8a5cae" stroke-width="1.2" class="sc-scene sc-disc" filter="url(#sfSoft)"/>
  <text x="537" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">短视频</text>
  <text x="537" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">直播</text>
  <rect x="380" y="146" width="100" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="social" data-lab="内容社交类"/>
  <rect x="486" y="146" width="102" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="video" data-lab="内容社交类"/>

  <!-- 实时互动类:game / edu / health (绿 #34c759) -->
  <rect x="608" y="124" width="300" height="116" rx="14" fill="#eaf6f0" stroke="#bfe3d1" class="sf-band-social"/>
  <text x="620" y="118" font-size="12" font-weight="700" fill="#2f6b4e" class="sf-cat-social">实时互动类</text>
  <rect x="620" y="146" width="88" height="84" rx="10" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.2" class="sc-scene sc-social" filter="url(#sfSoft)"/>
  <text x="664" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">在线</text>
  <text x="664" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">游戏</text>
  <rect x="714" y="146" width="88" height="84" rx="10" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.2" class="sc-scene sc-social" filter="url(#sfSoft)"/>
  <text x="758" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">在线</text>
  <text x="758" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">教育</text>
  <rect x="808" y="146" width="88" height="84" rx="10" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.2" class="sc-scene sc-social" filter="url(#sfSoft)"/>
  <text x="852" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">医疗</text>
  <text x="852" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">健康</text>
  <rect x="620" y="146" width="88" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="game" data-lab="实时互动类"/>
  <rect x="714" y="146" width="88" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="edu" data-lab="实时互动类"/>
  <rect x="808" y="146" width="88" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="health" data-lab="实时互动类"/>

  <!-- 产业服务类:mobility / saas (橙 #ff9f0a) -->
  <rect x="916" y="124" width="232" height="116" rx="14" fill="#fbf3e2" stroke="#ecd6a8" class="sf-band-growth"/>
  <text x="928" y="118" font-size="12" font-weight="700" fill="#8a6417" class="sf-cat-growth">产业服务类</text>
  <rect x="928" y="146" width="100" height="84" rx="10" fill="#ffffff" stroke="#c99a3a" stroke-width="1.2" class="sc-scene sc-growth" filter="url(#sfSoft)"/>
  <text x="978" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">出行</text>
  <text x="978" y="204" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">物流</text>
  <rect x="1034" y="146" width="102" height="84" rx="10" fill="#ffffff" stroke="#c99a3a" stroke-width="1.2" class="sc-scene sc-growth" filter="url(#sfSoft)"/>
  <text x="1085" y="182" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">企业服务</text>
  <text x="1085" y="204" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">SaaS</text>
  <rect x="928" y="146" width="100" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="mobility" data-lab="产业服务类"/>
  <rect x="1034" y="146" width="102" height="84" rx="12" fill="#ffffff" fill-opacity="0" data-tid="saas" data-lab="产业服务类"/>

  <!-- 层间箭头 上→中 -->
  <path d="M601 244 L601 288" fill="none" stroke="#a1a1a6" class="ag-line" stroke-width="1.6" marker-end="url(#sfArrow)"/>

  <!-- ============ 中层:7 项跨场景通用技术组件(浅底 tint 卡) ============ -->
  <text x="72" y="316" font-size="12" font-weight="700" fill="#6e6e73" class="ag-sub">跨场景通用技术组件 · 支撑上层所有高频场景</text>
  <rect x="70" y="328" width="1090" height="150" rx="14" fill="#f4f4f6" stroke="#e4e7ec" class="ag-band"/>

  <!-- 1 分布式ID -->
  <rect x="86" y="346" width="144" height="114" rx="10" fill="#f6f7f9" stroke="#d7d7dd" class="ag-tint"/>
  <text x="158" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">分布式 ID</text>
  <text x="158" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">雪花算法</text>
  <text x="158" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">号段模式</text>
  <text x="158" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">全局唯一 · 趋势递增</text>

  <!-- 2 分库分表 -->
  <rect x="238" y="346" width="144" height="114" rx="10" fill="#f6f7f9" stroke="#d7d7dd" class="ag-tint"/>
  <text x="310" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">分库分表</text>
  <text x="310" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">ShardingSphere</text>
  <text x="310" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Vitess</text>
  <text x="310" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">水平拆分 · 路由聚合</text>

  <!-- 3 多级缓存 -->
  <rect x="390" y="346" width="144" height="114" rx="10" fill="#f6f7f9" stroke="#d7d7dd" class="ag-tint"/>
  <text x="462" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">多级缓存</text>
  <text x="462" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">本地 + Redis + CDN</text>
  <text x="462" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">穿透 · 击穿 · 雪崩</text>
  <text x="462" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">热点读加速</text>

  <!-- 4 消息队列 -->
  <rect x="542" y="346" width="144" height="114" rx="10" fill="#f6f7f9" stroke="#d7d7dd" class="ag-tint"/>
  <text x="614" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">消息队列</text>
  <text x="614" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Kafka · RocketMQ</text>
  <text x="614" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">异步 · 解耦 · 削峰</text>
  <text x="614" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">流量缓冲</text>

  <!-- 5 限流降级熔断 -->
  <rect x="694" y="346" width="144" height="114" rx="10" fill="#f6f7f9" stroke="#d7d7dd" class="ag-tint"/>
  <text x="766" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">限流降级熔断</text>
  <text x="766" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Sentinel</text>
  <text x="766" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Hystrix</text>
  <text x="766" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">过载保护</text>

  <!-- 6 分布式事务 -->
  <rect x="846" y="346" width="144" height="114" rx="10" fill="#f6f7f9" stroke="#d7d7dd" class="ag-tint"/>
  <text x="918" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">分布式事务</text>
  <text x="918" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">TCC · Saga</text>
  <text x="918" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">可靠消息</text>
  <text x="918" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">最终一致性</text>

  <!-- 7 分布式锁 -->
  <rect x="998" y="346" width="146" height="114" rx="10" fill="#f6f7f9" stroke="#d7d7dd" class="ag-tint"/>
  <text x="1071" y="378" font-size="13.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">分布式锁</text>
  <text x="1071" y="404" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">Redis</text>
  <text x="1071" y="422" font-size="11" fill="#6e6e73" class="ag-sub" text-anchor="middle">ZooKeeper</text>
  <text x="1071" y="446" font-size="10" fill="#8a8a8e" class="ag-sub" text-anchor="middle">互斥 · 幂等</text>

  <!-- 层间箭头 中→底 -->
  <path d="M601 490 L601 534" fill="none" stroke="#a1a1a6" class="ag-line" stroke-width="1.6" marker-end="url(#sfArrow)"/>

  <!-- ============ 底层:基础设施底座(白卡) ============ -->
  <text x="72" y="562" font-size="12" font-weight="700" fill="#6e6e73" class="ag-sub">基础设施底座</text>
  <rect x="70" y="574" width="352" height="150" rx="14" fill="#ffffff" stroke="#e4e7ec" class="ag-card" filter="url(#sfSoft)"/>
  <text x="246" y="612" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">存储引擎</text>
  <text x="246" y="644" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">MySQL · Redis · Elasticsearch</text>
  <text x="246" y="668" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">HBase · MongoDB</text>
  <text x="246" y="696" font-size="11" fill="#8a8a8e" class="ag-sub" text-anchor="middle">关系 · KV · 检索 · 宽表</text>

  <rect x="438" y="574" width="352" height="150" rx="14" fill="#ffffff" stroke="#e4e7ec" class="ag-card" filter="url(#sfSoft)"/>
  <text x="614" y="612" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">消息与计算</text>
  <text x="614" y="644" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">Kafka · RocketMQ · Pulsar</text>
  <text x="614" y="668" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">Flink · Spark</text>
  <text x="614" y="696" font-size="11" fill="#8a8a8e" class="ag-sub" text-anchor="middle">流式 · 批处理 · 实时数仓</text>

  <rect x="806" y="574" width="354" height="150" rx="14" fill="#ffffff" stroke="#e4e7ec" class="ag-card" filter="url(#sfSoft)"/>
  <text x="983" y="612" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">网络与部署</text>
  <text x="983" y="644" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">CDN · API 网关 · LB</text>
  <text x="983" y="668" font-size="12" fill="#6e6e73" class="ag-sub" text-anchor="middle">Kubernetes · 服务网格</text>
  <text x="983" y="696" font-size="11" fill="#8a8a8e" class="ag-sub" text-anchor="middle">接入 · 弹性 · 容器编排</text>
</svg>