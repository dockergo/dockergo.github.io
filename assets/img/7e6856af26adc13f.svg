<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="660" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="17" font-weight="700" fill="#1d1d1f">队列 Queue · FIFO：环形数组用取模回绕，出队免整体搬移</text>
  <text x="30" y="53" font-size="11" fill="#6e6e73">队尾 push、队首 pop。front 与 rear 都随取模前进；越过数组尾部就回到头部，空出的前段格子被重新利用。</text>

  <!-- 图例 -->
  <line x1="30" y1="74" x2="54" y2="74" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="60" y="78" font-size="10.5" fill="#3a3a3c">front 队首（出队端）</text>
  <line x1="210" y1="74" x2="234" y2="74" stroke="#d99a2b" stroke-width="2" marker-end="url(#aA)"/>
  <text x="240" y="78" font-size="10.5" fill="#3a3a3c">rear 下一写入位（入队端）</text>
  <rect x="430" y="67" width="13" height="13" rx="3" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/>
  <text x="449" y="78" font-size="10.5" fill="#3a3a3c">空闲格（可被回绕复用）</text>

  <text x="30" y="106" font-size="10.5" fill="#8a6a1f">容量 queCapacity = 5，索引 [0..4]。rear =(front+queSize) % cap；出队 front =(front+1) % cap。</text>

  <!-- S1 -->
  <text x="40" y="150" font-size="11" font-weight="700" fill="#4a4a4f">① push a,b,c</text>
  <text x="40" y="167" font-size="9" fill="#6e6e73">front=0 size=3</text>
  <line x1="257" y1="128" x2="257" y2="146" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="257" y="124" font-size="9" fill="#1f6b4b" text-anchor="middle">front</text>
  <line x1="419" y1="128" x2="419" y2="146" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="419" y="124" font-size="9" fill="#8a6a1f" text-anchor="middle">rear</text>
  <g text-anchor="middle" font-size="12">
    <rect x="230" y="148" width="54" height="40" rx="5" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="257" y="174" fill="#1f6b4b">a</text>
    <rect x="284" y="148" width="54" height="40" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="311" y="174" fill="#20375e">b</text>
    <rect x="338" y="148" width="54" height="40" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="365" y="174" fill="#20375e">c</text>
    <rect x="392" y="148" width="54" height="40" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="419" y="174" fill="#a1a1a6"></text>
    <rect x="446" y="148" width="54" height="40" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="473" y="174" fill="#a1a1a6"></text>
  </g>

  <!-- S2 -->
  <text x="40" y="248" font-size="11" font-weight="700" fill="#4a4a4f">② pop×2 → a,b</text>
  <text x="40" y="265" font-size="9" fill="#6e6e73">front=2 size=1</text>
  <text x="40" y="281" font-size="9" fill="#1f6b4b">仅移指针</text>
  <line x1="365" y1="226" x2="365" y2="244" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="365" y="222" font-size="9" fill="#1f6b4b" text-anchor="middle">front</text>
  <line x1="419" y1="226" x2="419" y2="244" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="419" y="222" font-size="9" fill="#8a6a1f" text-anchor="middle">rear</text>
  <g text-anchor="middle" font-size="12">
    <rect x="230" y="246" width="54" height="40" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="257" y="272" fill="#a1a1a6"></text>
    <rect x="284" y="246" width="54" height="40" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="311" y="272" fill="#a1a1a6"></text>
    <rect x="338" y="246" width="54" height="40" rx="5" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="365" y="272" fill="#1f6b4b">c</text>
    <rect x="392" y="246" width="54" height="40" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="419" y="272" fill="#a1a1a6"></text>
    <rect x="446" y="246" width="54" height="40" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="473" y="272" fill="#a1a1a6"></text>
  </g>
  <text x="257" y="272" font-size="8.5" fill="#b0b0b5" text-anchor="middle">出队不搬移</text>

  <!-- S3 -->
  <text x="40" y="360" font-size="11" font-weight="700" fill="#4a4a4f">③ push d,e,f</text>
  <text x="40" y="377" font-size="9" fill="#6e6e73">front=2 size=4</text>
  <text x="40" y="393" font-size="9" fill="#8a6a1f">f 回绕到 [0]</text>
  <line x1="365" y1="338" x2="365" y2="356" stroke="#2f9e6e" stroke-width="1.8" marker-end="url(#aG)"/>
  <text x="365" y="334" font-size="9" fill="#1f6b4b" text-anchor="middle">front</text>
  <line x1="311" y1="338" x2="311" y2="356" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="311" y="334" font-size="9" fill="#8a6a1f" text-anchor="middle">rear</text>
  <g text-anchor="middle" font-size="12">
    <rect x="230" y="358" width="54" height="40" rx="5" fill="#fbf1dc" stroke="#d99a2b" stroke-width="1.4"/><text x="257" y="384" fill="#8a6a1f">f</text>
    <rect x="284" y="358" width="54" height="40" rx="5" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="311" y="384" fill="#a1a1a6"></text>
    <rect x="338" y="358" width="54" height="40" rx="5" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.4"/><text x="365" y="384" fill="#1f6b4b">c</text>
    <rect x="392" y="358" width="54" height="40" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="419" y="384" fill="#20375e">d</text>
    <rect x="446" y="358" width="54" height="40" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="473" y="384" fill="#20375e">e</text>
  </g>
  <!-- 索引标签 -->
  <g font-size="9" fill="#8a6a1f" text-anchor="middle">
    <text x="257" y="412">[0]</text><text x="311" y="412">[1]</text><text x="365" y="412">[2]</text><text x="419" y="412">[3]</text><text x="473" y="412">[4]</text>
  </g>
  <!-- 回绕连接（正交） -->
  <path d="M500 430 L500 446 L230 446 L230 430" fill="none" stroke="#d99a2b" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aA)"/>
  <text x="365" y="440" font-size="9" fill="#8a6a1f" text-anchor="middle">数组尾部与头部首尾相连（取模）</text>
  <text x="365" y="464" font-size="9.5" fill="#1f6b4b" text-anchor="middle">逻辑队列 front→rear：c → d → e → f（绕过尾部继续）</text>

  <!-- 右侧机制说明 -->
  <rect x="560" y="120" width="520" height="150" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="582" y="146" font-size="12" font-weight="700" fill="#1d1d1f">为什么要环形？</text>
  <text x="582" y="170" font-size="10.5" fill="#4a4a4f">朴素做法：出队后把后面元素全部左移一格填补 front —— 每次出队 O(n)。</text>
  <text x="582" y="192" font-size="10.5" fill="#4a4a4f">环形做法：出队只让 front 前移一格，腾出的前段格子留给后来的 rear 回绕写入。</text>
  <text x="582" y="214" font-size="10.5" fill="#1f6b4b">入队 push O(1) · 出队 pop O(1)，数组空间循环复用，永不搬移。</text>
  <text x="582" y="240" font-size="10" fill="#8a6a1f">判满：queSize == queCapacity（用计数而非指针相等，避开"空/满都是 front==rear"的歧义）。</text>
  <text x="582" y="260" font-size="9.5" fill="#8a97ab">越界写入被直接拒绝（本实现不自动扩容）。</text>

  <!-- 链表版说明 -->
  <rect x="560" y="286" width="520" height="130" rx="14" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="582" y="312" font-size="12" font-weight="700" fill="#20375e">链表实现 linkedListQueue</text>
  <text x="582" y="335" font-size="10.5" fill="#4a4a4f">用 container/list：入队 PushBack（队尾），出队 Remove(Front)（队首）。</text>
  <g text-anchor="middle" font-size="10">
    <rect x="600" y="350" width="46" height="32" rx="7" fill="#e6f4ec" stroke="#b6ddc9"/><text x="623" y="370" fill="#1f6b4b">c</text>
    <rect x="676" y="350" width="46" height="32" rx="7" fill="#eaf1fb" stroke="#c6d9f2"/><text x="699" y="370" fill="#20375e">d</text>
    <rect x="752" y="350" width="46" height="32" rx="7" fill="#eaf1fb" stroke="#c6d9f2"/><text x="775" y="370" fill="#20375e">e</text>
  </g>
  <line x1="646" y1="366" x2="672" y2="366" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  <line x1="722" y1="366" x2="748" y2="366" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  <text x="623" y="396" font-size="9" fill="#1f6b4b" text-anchor="middle">Front 出队</text>
  <text x="775" y="396" font-size="9" fill="#20375e" text-anchor="middle">Back 入队</text>
  <text x="820" y="366" font-size="10" fill="#8a97ab">天然无容量上限；免取模，但每结点带指针开销。</text>

  <!-- 底部要点 -->
  <rect x="40" y="500" width="1040" height="120" rx="14" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="60" y="528" font-size="12" font-weight="700" fill="#2f6b4e">FIFO 不变式</text>
  <text x="60" y="552" font-size="10.5" fill="#4a4a4f">入队顺序 = 出队顺序。有效元素永远是从 front 起、沿取模方向连续的 queSize 个格子。</text>
  <text x="60" y="574" font-size="10.5" fill="#4a4a4f">front 和 rear 只增不减地"绕圈"，物理下标可能 rear &lt; front（如本例 rear=1 &lt; front=2），但逻辑顺序不乱。</text>
  <text x="60" y="600" font-size="10" fill="#8a6a1f">遍历/打印时按 (front + i) % cap 还原逻辑序（见 toSlice：跨尾部时拼接 nums[front:] 与 nums[:rear]）。</text>
</svg>
