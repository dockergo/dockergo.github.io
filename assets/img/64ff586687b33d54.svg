<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="650" viewBox="0 0 1150 650" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a97ab"/></marker>
  </defs>
  <rect width="1150" height="650" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">ClickHouse 多主异步复制 · 任意副本接收写、本地处理后异步扩散——无 leader、无写转发，一致性窗口=副本同步延迟</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">官方文档原话："Replication is asynchronous multi-master"；Keeper 只做协调元数据簿记，不参与 SELECT 路径，也不代理写流量</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">写路径（可发往任意副本）</text>
  <line x1="270" y1="80" x2="294" y2="80" stroke="#4a7fd0" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aB)"/>
  <text x="300" y="84" font-size="10" fill="#3a3a3c">副本间异步扩散（点对点直传）</text>
  <line x1="560" y1="80" x2="584" y2="80" stroke="#8a97ab" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#ar)"/>
  <text x="590" y="84" font-size="10" fill="#3a3a3c">元数据簿记（不参与数据体传输）</text>
  <line x1="30" y1="98" x2="1120" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 客户端 -->
  <rect x="30" y="120" width="180" height="80" rx="12" fill="#ffffff" stroke="#d9dde4" filter="url(#soft)"/>
  <text x="120" y="152" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">客户端 INSERT/ALTER</text>
  <text x="120" y="172" font-size="9" fill="#6e6e73" text-anchor="middle">可发给任意可用副本</text>
  <text x="120" y="188" font-size="8.5" fill="#a1a1a6" text-anchor="middle">无需知道谁是"主"</text>

  <!-- 三副本，全部对等，多主 -->
  <rect x="270" y="112" width="230" height="130" rx="12" fill="#eaf6f0" stroke="#bfe3d1" filter="url(#soft)"/>
  <text x="385" y="136" font-size="11.5" font-weight="700" fill="#2f6b4e" text-anchor="middle">副本 A</text>
  <text x="285" y="158" font-size="9" fill="#3f8a63">① 接收写，本地处理</text>
  <text x="285" y="176" font-size="9" fill="#3f8a63">② 写完即对客户端成功</text>
  <text x="285" y="194" font-size="9" fill="#3f8a63">③ 异步向其余副本扩散</text>
  <text x="285" y="222" font-size="8.5" fill="#5a9078" font-weight="700">本次接收写的即是"当次主"</text>

  <rect x="270" y="260" width="230" height="130" rx="12" fill="#eaf6f0" stroke="#bfe3d1" filter="url(#soft)"/>
  <text x="385" y="284" font-size="11.5" font-weight="700" fill="#2f6b4e" text-anchor="middle">副本 B</text>
  <text x="285" y="306" font-size="9" fill="#3f8a63">同样可独立接收写</text>
  <text x="285" y="324" font-size="9" fill="#3f8a63">与 A 对等，无层级关系</text>
  <text x="285" y="342" font-size="9" fill="#3f8a63">异步接收 A 扩散来的数据</text>
  <text x="285" y="370" font-size="8.5" fill="#5a9078" font-weight="700">此刻数据滞后于 A（同步窗口内）</text>

  <rect x="270" y="408" width="230" height="130" rx="12" fill="#eaf6f0" stroke="#bfe3d1" filter="url(#soft)"/>
  <text x="385" y="432" font-size="11.5" font-weight="700" fill="#2f6b4e" text-anchor="middle">副本 C</text>
  <text x="285" y="454" font-size="9" fill="#3f8a63">同样可独立接收写</text>
  <text x="285" y="472" font-size="9" fill="#3f8a63">与 A、B 对等</text>
  <text x="285" y="490" font-size="9" fill="#3f8a63">异步接收扩散来的数据</text>
  <text x="285" y="518" font-size="8.5" fill="#5a9078" font-weight="700">此刻数据也滞后于 A</text>

  <!-- 副本间异步扩散连线（点对点，不经 Keeper） -->
  <path d="M500 160 C 560 190 560 260 500 300" fill="none" stroke="#4a7fd0" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aB)"/>
  <path d="M500 200 C 560 300 560 420 500 450" fill="none" stroke="#4a7fd0" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aB)"/>
  <text x="512" y="230" font-size="8.5" fill="#5a7099">数据体经副本间直接网络传输</text>
  <text x="512" y="380" font-size="8.5" fill="#5a7099">不经 Keeper</text>

  <!-- 客户端 → 任一副本 -->
  <line x1="210" y1="160" x2="266" y2="160" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>

  <!-- Keeper：右侧，仅元数据簿记 -->
  <rect x="800" y="112" width="310" height="426" rx="14" fill="#f4eefb" stroke="#dcc9ef" filter="url(#soft)"/>
  <text x="955" y="140" font-size="13" font-weight="700" fill="#6f3ea8" text-anchor="middle">Keeper · 协调元数据（不是写路由）</text>

  <rect x="820" y="156" width="270" height="82" rx="9" fill="#fff" stroke="#dcc9ef"/>
  <text x="834" y="180" font-size="10" font-weight="700" fill="#5a3a7a">存副本元信息</text>
  <text x="834" y="198" font-size="9" fill="#5a3a7a">官方原文："used to store</text>
  <text x="834" y="214" font-size="9" fill="#5a3a7a">replicas' meta information"</text>
  <text x="834" y="230" font-size="8.5" fill="#8a5cae">每条 INSERT 约写入十条事务性记录做簿记</text>

  <rect x="820" y="250" width="270" height="70" rx="9" fill="#fbeceb" stroke="#e8a79f"/>
  <text x="834" y="272" font-size="10" font-weight="700" fill="#8a4038">不参与 SELECT 路径</text>
  <text x="834" y="290" font-size="9" fill="#b06a60">读不经过 Keeper 中转或确认</text>
  <text x="834" y="306" font-size="8.5" fill="#b06a60">Keeper 挂掉不影响已在运行的查询</text>

  <rect x="820" y="332" width="270" height="70" rx="9" fill="#fbeceb" stroke="#e8a79f"/>
  <text x="834" y="354" font-size="10" font-weight="700" fill="#8a4038">不代理写流量</text>
  <text x="834" y="372" font-size="9" fill="#b06a60">不做写请求转发 / 不做主节点指定</text>
  <text x="834" y="388" font-size="8.5" fill="#b06a60">无 leader 选举机制</text>

  <rect x="820" y="414" width="270" height="60" rx="9" fill="#fff" stroke="#dcc9ef"/>
  <text x="834" y="436" font-size="10" font-weight="700" fill="#5a3a7a">数据体不经 Keeper</text>
  <text x="834" y="454" font-size="9" fill="#5a3a7a">实际数据经副本间直接网络传输</text>

  <rect x="820" y="486" width="270" height="42" rx="8" fill="#f4eefb" stroke="#dcc9ef"/>
  <text x="834" y="508" font-size="9" fill="#6f3ea8" font-weight="700">结论：真正的多主异步</text>

  <!-- Keeper 虚线：仅元数据簿记连线，弱化，示意"不在数据路径上" -->
  <line x1="500" y1="176" x2="796" y2="200" stroke="#8a97ab" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#ar)"/>
  <line x1="500" y1="324" x2="796" y2="220" stroke="#8a97ab" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#ar)"/>
  <line x1="500" y1="472" x2="796" y2="230" stroke="#8a97ab" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#ar)"/>

  <!-- 底部结论条 -->
  <rect x="30" y="560" width="700" height="70" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="584" font-size="10.5" font-weight="700" fill="#1d1d1f">一致性窗口 = 副本同步延迟</text>
  <text x="48" y="606" font-size="10" fill="#4a4a4f">写完即对客户端返回成功，其余副本尚未同步到之前，读到旧值是预期行为——这不是 bug，是多主异步的设计代价。</text>
</svg>
