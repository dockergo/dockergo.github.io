<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#b8b8bf"/></marker></defs>
  <rect width="1000" height="450" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · 三级容器层级（File → RowGroup → ColumnChunk → Page）</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">从粗到细四层嵌套：文件按行组切（水平），行组内按列成块（垂直），列块由页背靠背组成——裁剪也沿这四级逐级收窄</text>

  <!-- File -->
  <rect x="30" y="76" width="940" height="60" rx="12" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="46" y="100" font-size="11" font-weight="700" fill="#5a3410">File · 整个 .parquet 文件（FileMetaData）</text>
  <text x="46" y="122" font-size="8.6" fill="#93762e">num_rows 总行数 · schema[] · row_groups[] · 一次尾读拿到全部行组/列块偏移</text>

  <path d="M500,136 L500,156" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="510" y="150" font-size="8" fill="#8a8a90">按“行数/大小”水平切</text>

  <!-- RowGroup -->
  <rect x="30" y="160" width="940" height="70" rx="12" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="46" y="184" font-size="11" font-weight="700" fill="#1b2a4a">RowGroup · 一批行（默认按大小切，如 128MB）</text>
  <rect x="46" y="194" width="150" height="28" rx="6" fill="#e9f2ff" stroke="#a9ccf5"/><text x="121" y="213" font-size="8.6" text-anchor="middle" fill="#0a3d78">列 A 的列块</text>
  <rect x="204" y="194" width="150" height="28" rx="6" fill="#e9f2ff" stroke="#a9ccf5"/><text x="279" y="213" font-size="8.6" text-anchor="middle" fill="#0a3d78">列 B 的列块</text>
  <rect x="362" y="194" width="150" height="28" rx="6" fill="#e9f2ff" stroke="#a9ccf5"/><text x="437" y="213" font-size="8.6" text-anchor="middle" fill="#0a3d78">列 C 的列块</text>
  <text x="540" y="213" font-size="8.6" fill="#5b7db1">… 每列一个列块 · 并列排放（列裁剪只读需要的列块）</text>

  <path d="M121,230 L121,250" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="131" y="244" font-size="8" fill="#8a8a90">取一列的块放大</text>

  <!-- ColumnChunk -->
  <rect x="30" y="254" width="940" height="74" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="46" y="278" font-size="11" font-weight="700" fill="#0a3d78">ColumnChunk · 一列在此行组的全部数据（ColumnMetaData 记偏移/编码/codec/统计）</text>
  <rect x="46" y="288" width="120" height="30" rx="6" fill="#fff7e6" stroke="#efdcb4"/><text x="106" y="308" font-size="8.4" text-anchor="middle" fill="#5a3410">字典页(可选)</text>
  <rect x="174" y="288" width="120" height="30" rx="6" fill="#f3f9ff" stroke="#bcd8f5"/><text x="234" y="308" font-size="8.4" text-anchor="middle" fill="#0a3d78">DataPage 0</text>
  <rect x="302" y="288" width="120" height="30" rx="6" fill="#f3f9ff" stroke="#bcd8f5"/><text x="362" y="308" font-size="8.4" text-anchor="middle" fill="#0a3d78">DataPage 1</text>
  <rect x="430" y="288" width="120" height="30" rx="6" fill="#f3f9ff" stroke="#bcd8f5"/><text x="490" y="308" font-size="8.4" text-anchor="middle" fill="#0a3d78">DataPage 2</text>
  <text x="566" y="308" font-size="8.6" fill="#5b7db1">… 页背靠背 · PageIndex 可跳无关页</text>

  <path d="M234,328 L234,348" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="244" y="342" font-size="8" fill="#8a8a90">取一页放大</text>

  <!-- Page -->
  <rect x="30" y="352" width="940" height="80" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="46" y="376" font-size="11" font-weight="700" fill="#12402a">Page · 编解码/压缩的最小单位（PageHeader + 页体）</text>
  <rect x="46" y="386" width="200" height="34" rx="6" fill="#e6f4f1" stroke="#b9dfd8"/><text x="146" y="408" font-size="8.4" text-anchor="middle" fill="#0f6b5e">PageHeader（类型/大小/CRC）</text>
  <rect x="254" y="386" width="200" height="34" rx="6" fill="#e6f4f1" stroke="#b9dfd8"/><text x="354" y="408" font-size="8.4" text-anchor="middle" fill="#0f6b5e">repetition + definition 级</text>
  <rect x="462" y="386" width="220" height="34" rx="6" fill="#e6f4f1" stroke="#b9dfd8"/><text x="572" y="408" font-size="8.4" text-anchor="middle" fill="#0f6b5e">encoded values（本页的列值）</text>
  <text x="700" y="408" font-size="8.6" fill="#2f6f5f">页是压缩/CRC/编码的边界,读时可整页跳过</text>
</svg>
