<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="744" viewBox="0 0 1280 744" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a5cae"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2aa0a4"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d9772f"/></marker>
  </defs>
  <rect width="1280" height="744" fill="#fbfbfd"/>

  <!-- 判型标题带 -->
  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">故障是常态不是异常 · 熔断阻止故障扩散、幂等让重试安全、重试让瞬时故障自愈——三者环环相扣，少一个都不完整</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">5 个真实项目落点分两类熔断（网络型 ×2 + 资源型 ×1）+ 1 个幂等实现 + 1 个安全重试实现，分别汇入下方三块拼图</text>

  <!-- 图例 -->
  <line x1="30" y1="82" x2="54" y2="82" stroke="#d1544a" stroke-width="2" marker-end="url(#aR)"/>
  <text x="60" y="86" font-size="10" fill="#3a3a3c">熔断 · 阻止故障扩散</text>
  <line x1="216" y1="82" x2="240" y2="82" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <text x="246" y="86" font-size="10" fill="#3a3a3c">幂等 · 让重试安全</text>
  <line x1="400" y1="82" x2="424" y2="82" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>
  <text x="430" y="86" font-size="10" fill="#3a3a3c">重试 · 让瞬时故障自愈</text>
  <line x1="616" y1="82" x2="640" y2="82" stroke="#a1a1a6" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="646" y="86" font-size="10" fill="#3a3a3c">真实项目落点 → 汇入对应拼图</text>
  <text x="1250" y="86" font-size="10" fill="#a1a1a6" text-anchor="end">概念层 + 真实项目落点</text>
  <line x1="30" y1="98" x2="1250" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- ============ 三块拼图（横向，环环相扣） ============ -->
  <!-- 熔断 -->
  <rect x="60" y="120" width="350" height="190" rx="14" fill="#fbe6e3" stroke="#e8a79f" filter="url(#soft)"/>
  <text x="235" y="148" font-size="13" font-weight="700" fill="#8a4038" text-anchor="middle">熔断 · Circuit Breaking</text>
  <line x1="78" y1="160" x2="392" y2="160" stroke="#e8a79f" stroke-width="1"/>
  <text x="78" y="182" font-size="9.5" fill="#8a4038">拦住持续故障 / 资源超限的节点，先止损</text>
  <text x="78" y="204" font-size="9.5" fill="#8a4038">覆盖两类触发：网络型（远端故障率）</text>
  <text x="78" y="224" font-size="9.5" fill="#8a4038">与资源型（本机资源超限）——见下方 B1/B2/B3</text>
  <text x="78" y="252" font-size="8.5" fill="#b06a60">少了它：重试持续冲向已知坏目标，甚至引发重试风暴</text>
  <text x="78" y="270" font-size="8.5" fill="#b06a60">（无边界的自愈尝试，反而放大故障）</text>

  <!-- 幂等 -->
  <rect x="465" y="120" width="350" height="190" rx="14" fill="#f4eefb" stroke="#dcc9ef" filter="url(#soft)"/>
  <text x="640" y="148" font-size="13" font-weight="700" fill="#6f3ea8" text-anchor="middle">幂等 · Idempotency</text>
  <line x1="483" y1="160" x2="797" y2="160" stroke="#dcc9ef" stroke-width="1"/>
  <text x="483" y="182" font-size="9.5" fill="#6f3ea8">同一操作重复执行 = 执行一次的效果</text>
  <text x="483" y="204" font-size="9.5" fill="#6f3ea8">典范实现：PID + 序列号 / 幂等键去重</text>
  <text x="483" y="224" font-size="9.5" fill="#6f3ea8">——见下方 B4 Kafka 幂等生产者</text>
  <text x="483" y="252" font-size="8.5" fill="#8a6bab">少了它：重试一旦发生就有重复副作用风险</text>
  <text x="483" y="270" font-size="8.5" fill="#8a6bab">（例如非幂等 POST 被重复提交）</text>

  <!-- 重试 -->
  <rect x="870" y="120" width="350" height="190" rx="14" fill="#e4f4f4" stroke="#bfe1e1" filter="url(#soft)"/>
  <text x="1045" y="148" font-size="13" font-weight="700" fill="#1d6b6e" text-anchor="middle">重试 · Safe Retry</text>
  <line x1="888" y1="160" x2="1202" y2="160" stroke="#bfe1e1" stroke-width="1"/>
  <text x="888" y="182" font-size="9.5" fill="#1d6b6e">换个目标节点或稍候再试，让瞬时故障自愈</text>
  <text x="888" y="204" font-size="9.5" fill="#1d6b6e">只解决"抖一下就恢复"的场景，不解决</text>
  <text x="888" y="224" font-size="9.5" fill="#1d6b6e">持续性故障——见下方 B5 nginx 安全重试</text>
  <text x="888" y="252" font-size="8.5" fill="#4a8a8c">少了它：瞬时失败直接暴露给用户，没有自愈机会</text>
  <text x="888" y="270" font-size="8.5" fill="#4a8a8c">（本可自行恢复的抖动被当成了硬故障）</text>

  <!-- 前进箭头：熔断→幂等，幂等→重试 -->
  <line x1="410" y1="215" x2="463" y2="215" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <text x="436" y="198" font-size="8.5" fill="#5a3a7a" text-anchor="middle">止损之后</text>
  <text x="436" y="248" font-size="8.5" fill="#5a3a7a" text-anchor="middle">重试是否</text>
  <text x="436" y="262" font-size="8.5" fill="#5a3a7a" text-anchor="middle">安全?</text>
  <line x1="815" y1="215" x2="868" y2="215" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>
  <text x="819" y="207" font-size="8.5" fill="#1a6d70">重复安全 → 才能放心</text>
  <text x="819" y="278" font-size="8.5" fill="#1a6d70">把请求再发一次</text>

  <!-- 回环弧：重试 → 熔断（无边界重试=重试风暴，仍需熔断兜底） -->
  <path d="M980 310 C 900 400 420 400 300 312" fill="none" stroke="#d1544a" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aR)"/>
  <rect x="470" y="366" width="340" height="46" rx="10" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="640" y="384" font-size="9.5" font-weight="700" fill="#1d1d1f" text-anchor="middle">⟳ 三者环环相扣，少一个都不完整</text>
  <text x="640" y="401" font-size="8.5" fill="#8a4038" text-anchor="middle">重试若不设边界：持续冲击故障点 = 重试风暴，反而扩大故障——仍需熔断兜底</text>

  <!-- ============ 下方：5 个真实项目落点，按拼图分组 ============ -->
  <text x="60" y="446" font-size="11.5" font-weight="700" fill="#1d1d1f">真实项目落点 · 汇入对应拼图</text>
  <line x1="60" y1="456" x2="1220" y2="456" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 熔断列：B1/B2/B3 三个 -->
  <line x1="180" y1="470" x2="180" y2="312" stroke="#2aa0a4" stroke-width="1.6" marker-end="url(#aT)"/>
  <rect x="60" y="470" width="350" height="52" rx="10" fill="#e4f4f4" stroke="#bfe1e1"/>
  <text x="76" y="490" font-size="10.5" font-weight="700" fill="#1a6d70">nginx 被动健康检查 · B1</text>
  <text x="76" y="508" font-size="8.5" fill="#4a8a8c">fails≥max_fails 且未过 fail_timeout → 标记不可用</text>

  <line x1="180" y1="532" x2="235" y2="312" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  <rect x="60" y="532" width="350" height="52" rx="10" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="76" y="552" font-size="10.5" font-weight="700" fill="#20375e">gRPC outlier_detection · B2</text>
  <text x="76" y="570" font-size="8.5" fill="#3a4a63">xDS 配置驱动，success_rate / failure_percentage 异常检测</text>

  <line x1="180" y1="594" x2="290" y2="312" stroke="#d9772f" stroke-width="1.6" marker-end="url(#aO)"/>
  <rect x="60" y="594" width="350" height="70" rx="10" fill="#fbeee2" stroke="#ecc6a8"/>
  <text x="76" y="614" font-size="10.5" font-weight="700" fill="#9a5f1c">StarRocks 大查询资源熔断 · B3</text>
  <text x="76" y="632" font-size="8.5" fill="#b0854a">Resource Group + Query Queue（CPU 秒数/内存/扫描行数）</text>
  <text x="76" y="650" font-size="8.5" font-weight="700" fill="#c9502f">⚠ 触发=资源超限，非网络故障 —— 与 B1/B2 类型不同，见 B3/CMP</text>

  <!-- 幂等列：B4 -->
  <line x1="640" y1="470" x2="640" y2="312" stroke="#8a5cae" stroke-width="1.6" marker-end="url(#aP)"/>
  <rect x="465" y="470" width="350" height="52" rx="10" fill="#f4eefb" stroke="#dcc9ef"/>
  <text x="481" y="490" font-size="10.5" font-weight="700" fill="#6f3ea8">Kafka 幂等生产者 · B4</text>
  <text x="481" y="508" font-size="8.5" fill="#8a6bab">PID + 序列号去重，broker 端识别并丢弃重复 batch</text>
  <text x="481" y="536" font-size="8.5" fill="#8a97ab">→ 让重试变安全的关键；见 B4，并与 B5 配对（详见 CMP）</text>

  <!-- 重试列：B5 -->
  <line x1="1045" y1="470" x2="1045" y2="312" stroke="#2aa0a4" stroke-width="1.6" marker-end="url(#aT)"/>
  <rect x="870" y="470" width="350" height="52" rx="10" fill="#e4f4f4" stroke="#bfe1e1"/>
  <text x="886" y="490" font-size="10.5" font-weight="700" fill="#1a6d70">nginx proxy_next_upstream · B5</text>
  <text x="886" y="508" font-size="8.5" fill="#4a8a8c">失败后自动切换下一个 upstream 重试</text>
  <text x="886" y="536" font-size="8.5" font-weight="700" fill="#8a4038">⚠ 重试非幂等方法（如非幂等 POST）有副作用风险 → 前提是 B4</text>

  <!-- 底部一句话总括 -->
  <rect x="60" y="674" width="1160" height="54" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="80" y="696" font-size="10.5" font-weight="700" fill="#1d1d1f">一句话</text>
  <text x="142" y="696" font-size="10" fill="#4a4a4f">熔断止损、幂等去重、重试自愈——三个能力分别独立存在，但只有<tspan font-weight="700" fill="#1d1d1f">三者齐备</tspan>才构成完整的故障容忍闭环。</text>
  <text x="142" y="714" font-size="9" fill="#8a97ab">下方 B1~B5 逐一点名真实项目怎么做；B3 与 B1/B2 的触发类型对比、B4+B5 的"幂等使重试安全"配对，见 CMP 对比图。</text>
</svg>
