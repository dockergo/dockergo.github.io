<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter></defs>
  <rect width="1000" height="430" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · 文件四段布局（PAR1 首尾夹数据 + 尾置元数据）</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">单个 .parquet = PAR1 + N列×M行组的列块 + FileMetaData + 4字节长度 + PAR1;魔数 PAR1 首尾各一,双重确认文件类型</text>

  <text x="30" y="80" font-size="9.5" fill="#6e6e73">文件偏移 →（从 0 到 EOF，元数据段在最后）</text>

  <!-- 四段条 -->
  <rect x="30" y="90" width="56" height="56" rx="11" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="58" y="118" font-size="9.4" font-weight="700" text-anchor="middle" fill="#5a3410">PAR1</text>
  <text x="58" y="134" font-size="7.6" text-anchor="middle" fill="#93762e">4B 头</text>

  <rect x="92" y="90" width="560" height="56" rx="11" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="372" y="114" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0a3d78">数据主体 · 列块背靠背（M 个行组 × N 列）</text>
  <text x="372" y="132" font-size="8.4" text-anchor="middle" fill="#2a5a92">列1块1 · 列2块1 … 列N块1 · 列1块2 …（同一行组内各列的块连续排列）</text>

  <rect x="658" y="90" width="230" height="56" rx="11" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="773" y="114" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5a3410">FileMetaData</text>
  <text x="773" y="132" font-size="8.4" text-anchor="middle" fill="#93762e">schema + 行组 + 列块偏移 + 统计</text>

  <rect x="894" y="90" width="76" height="56" rx="11" fill="#fdf1e0" stroke="#e8c99a" filter="url(#soft)"/>
  <text x="932" y="112" font-size="8.6" font-weight="700" text-anchor="middle" fill="#5a3410">4B 长度</text>
  <text x="932" y="128" font-size="8.6" font-weight="700" text-anchor="middle" fill="#5a3410">+ PAR1</text>

  <text x="970" y="82" font-size="8.4" text-anchor="end" fill="#a1a1a6">EOF ↑ 末 8 字节</text>

  <!-- 首尾 PAR1 呼应 -->
  <path d="M58,146 L58,168 L932,168 L932,146" stroke="#c7c7cc" stroke-width="1.4" fill="none"/>
  <rect x="430" y="156" width="200" height="24" rx="8" fill="#fdf6ea" stroke="#efdcb4"/>
  <text x="530" y="172" font-size="9" font-weight="600" text-anchor="middle" fill="#5a3410">PAR1 首尾两处 · 校验文件类型</text>

  <!-- 详解卡 -->
  <rect x="30" y="196" width="300" height="200" rx="12" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="46" y="220" font-size="11" font-weight="700" fill="#5a3410">① PAR1 魔数</text>
  <text x="46" y="242" font-size="9" fill="#93762e">首 4 字节固定 "PAR1"</text>
  <text x="46" y="260" font-size="9" fill="#93762e">尾 4 字节再出现一次</text>
  <text x="46" y="278" font-size="9" fill="#93762e">标识“这是 Parquet 文件”</text>
  <text x="46" y="304" font-size="8.6" fill="#8e8e93">作用：读者先看尾部 PAR1 确认,</text>
  <text x="46" y="320" font-size="8.6" fill="#8e8e93">再回读元数据长度 → 定位 FileMetaData。</text>
  <text x="46" y="344" font-size="8.6" fill="#8e8e93">与 ORC 的 "ORC" 魔数思路一致。</text>
  <text x="46" y="372" font-size="8.6" fill="#8e8e93">加密文件尾部改为 FileCryptoMetaData</text>
  <text x="46" y="388" font-size="8.6" fill="#8e8e93">+ 魔数 PARE。</text>

  <rect x="346" y="196" width="300" height="200" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="362" y="220" font-size="11" font-weight="700" fill="#0a3d78">② 数据主体</text>
  <text x="362" y="242" font-size="9" fill="#2a5a92">按行组切分（M 个 RowGroup）</text>
  <text x="362" y="260" font-size="9" fill="#2a5a92">每行组含全部列的列块</text>
  <text x="362" y="278" font-size="9" fill="#2a5a92">同列的值物理连续 → 高压缩</text>
  <rect x="362" y="292" width="268" height="86" rx="8" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="376" y="312" font-size="8.6" font-weight="600" fill="#0a3d78">排列顺序（一个行组内）</text>
  <text x="376" y="330" font-size="8.2" fill="#2a5a92">列1块 → 列2块 → … → 列N块</text>
  <text x="376" y="348" font-size="8.2" fill="#2a5a92">下一行组重复同结构</text>
  <text x="376" y="366" font-size="8.2" fill="#5b7db1">读时按列偏移直接 seek 需要的列</text>

  <rect x="662" y="196" width="308" height="200" rx="12" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="678" y="220" font-size="11" font-weight="700" fill="#5a3410">③ FileMetaData（尾置）</text>
  <text x="678" y="242" font-size="9" fill="#93762e">version / schema[] / num_rows</text>
  <text x="678" y="260" font-size="9" fill="#93762e">row_groups[]（各列块偏移/大小/统计）</text>
  <text x="678" y="278" font-size="9" fill="#93762e">column_orders / encryption_algorithm</text>
  <rect x="678" y="292" width="276" height="86" rx="8" fill="#fbf6ef" stroke="#e6d8c4"/>
  <text x="692" y="312" font-size="8.6" font-weight="600" fill="#5a3410">为何尾置？</text>
  <text x="692" y="330" font-size="8.2" fill="#93762e">数据先落盘,写完才知全部偏移/统计</text>
  <text x="692" y="348" font-size="8.2" fill="#93762e">→ 元数据后写,支持单遍流式写</text>
  <text x="692" y="366" font-size="8.2" fill="#93762e">读者靠末 4B 长度反跳到元数据起点</text>
</svg>
