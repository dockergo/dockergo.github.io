<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1120" height="640" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">O8 桶排序 · 按范围分桶 → 桶内各自排序 → 顺序拼接</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">对 [0,1) 数据，桶下标 i=⌊num×k⌋（k=n/2 个桶）；分配后各桶独立排序，再按桶序拼接。依赖数据分布均匀</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">分配映射</text>
  <rect x="150" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="168" y="82" font-size="10.5" fill="#3a3a3c">桶 / 元素</text>
  <rect x="270" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="288" y="82" font-size="10.5" fill="#3a3a3c">桶内已排序 / 结果</text>
  <rect x="440" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="458" y="82" font-size="10.5" fill="#3a3a3c">数据倾斜（反例）</text>

  <!-- ① 分配 -->
  <text x="30" y="112" font-size="12.5" font-weight="700" fill="#20375e">① 分配：i = ⌊num × 3⌋，把每个元素投入对应范围的桶</text>
  <g font-size="12" text-anchor="middle">
    <rect x="120" y="126" width="52" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="146" y="146" fill="#8a5a12">0.78</text>
    <rect x="180" y="126" width="52" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="206" y="146" fill="#8a5a12">0.17</text>
    <rect x="240" y="126" width="52" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="266" y="146" fill="#8a5a12">0.39</text>
    <rect x="300" y="126" width="52" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="326" y="146" fill="#8a5a12">0.26</text>
    <rect x="360" y="126" width="52" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="386" y="146" fill="#8a5a12">0.72</text>
    <rect x="420" y="126" width="52" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="446" y="146" fill="#8a5a12">0.94</text>
  </g>
  <text x="146" y="170" font-size="9" fill="#4a7fd0" text-anchor="middle">→桶2</text>
  <text x="206" y="170" font-size="9" fill="#4a7fd0" text-anchor="middle">→桶0</text>
  <text x="266" y="170" font-size="9" fill="#4a7fd0" text-anchor="middle">→桶1</text>
  <text x="326" y="170" font-size="9" fill="#4a7fd0" text-anchor="middle">→桶0</text>
  <text x="386" y="170" font-size="9" fill="#4a7fd0" text-anchor="middle">→桶2</text>
  <text x="446" y="170" font-size="9" fill="#4a7fd0" text-anchor="middle">→桶2</text>

  <!-- ② 三个桶 -->
  <text x="30" y="204" font-size="12.5" font-weight="700" fill="#20375e">② 桶内各自排序（元素少，任选排序算法）</text>

  <!-- 桶0 -->
  <rect x="70" y="216" width="270" height="180" rx="12" fill="#fdf6ea" stroke="#e7c07a"/>
  <text x="90" y="240" font-size="11.5" font-weight="700" fill="#8a5a12">桶0 · [0.00, 0.33)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="100" y="252" width="60" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="130" y="272" fill="#8a5a12">0.17</text>
    <rect x="168" y="252" width="60" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="198" y="272" fill="#8a5a12">0.26</text>
  </g>
  <line x1="205" y1="292" x2="205" y2="316" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="235" y="308" font-size="9.5" fill="#2f6b4e">桶内排序</text>
  <g font-size="12" text-anchor="middle">
    <rect x="100" y="322" width="60" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="130" y="342" fill="#2f6b4e">0.17</text>
    <rect x="168" y="322" width="60" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="198" y="342" fill="#2f6b4e">0.26</text>
  </g>
  <text x="90" y="378" font-size="9.5" fill="#6e6e73">已本就有序</text>

  <!-- 桶1 -->
  <rect x="360" y="216" width="270" height="180" rx="12" fill="#fdf6ea" stroke="#e7c07a"/>
  <text x="380" y="240" font-size="11.5" font-weight="700" fill="#8a5a12">桶1 · [0.33, 0.67)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="450" y="252" width="60" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="480" y="272" fill="#8a5a12">0.39</text>
  </g>
  <line x1="480" y1="292" x2="480" y2="316" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="512" y="308" font-size="9.5" fill="#2f6b4e">单元素</text>
  <g font-size="12" text-anchor="middle">
    <rect x="450" y="322" width="60" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="480" y="342" fill="#2f6b4e">0.39</text>
  </g>
  <text x="380" y="378" font-size="9.5" fill="#6e6e73">仅 1 个，天然有序</text>

  <!-- 桶2 -->
  <rect x="650" y="216" width="360" height="180" rx="12" fill="#fdf6ea" stroke="#e7c07a"/>
  <text x="670" y="240" font-size="11.5" font-weight="700" fill="#8a5a12">桶2 · [0.67, 1.00)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="680" y="252" width="60" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="710" y="272" fill="#8a5a12">0.78</text>
    <rect x="748" y="252" width="60" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="778" y="272" fill="#8a5a12">0.72</text>
    <rect x="816" y="252" width="60" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="846" y="272" fill="#8a5a12">0.94</text>
  </g>
  <line x1="778" y1="292" x2="778" y2="316" stroke="#2f9e6e" stroke-width="1.6" marker-end="url(#aG)"/>
  <text x="905" y="308" font-size="9.5" fill="#2f6b4e">排序 0.72&lt;0.78&lt;0.94</text>
  <g font-size="12" text-anchor="middle">
    <rect x="680" y="322" width="60" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="710" y="342" fill="#2f6b4e">0.72</text>
    <rect x="748" y="322" width="60" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="778" y="342" fill="#2f6b4e">0.78</text>
    <rect x="816" y="322" width="60" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="846" y="342" fill="#2f6b4e">0.94</text>
  </g>

  <!-- ③ 拼接 -->
  <text x="30" y="432" font-size="12.5" font-weight="700" fill="#20375e">③ 按桶序拼接：桶0 → 桶1 → 桶2，天然全局有序（桶间已按范围分好）</text>
  <line x1="205" y1="396" x2="205" y2="452" stroke="#2f9e6e" stroke-width="1.4"/>
  <line x1="480" y1="396" x2="480" y2="452" stroke="#2f9e6e" stroke-width="1.4"/>
  <line x1="778" y1="396" x2="778" y2="452" stroke="#2f9e6e" stroke-width="1.4"/>
  <line x1="205" y1="452" x2="778" y2="452" stroke="#2f9e6e" stroke-width="1.4"/>
  <line x1="490" y1="452" x2="490" y2="466" stroke="#2f9e6e" stroke-width="1.4" marker-end="url(#aG)"/>
  <g font-size="12" text-anchor="middle">
    <rect x="280" y="470" width="70" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="315" y="490" fill="#2f6b4e">0.17</text>
    <rect x="352" y="470" width="70" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="387" y="490" fill="#2f6b4e">0.26</text>
    <rect x="424" y="470" width="70" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="459" y="490" fill="#2f6b4e">0.39</text>
    <rect x="496" y="470" width="70" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="531" y="490" fill="#2f6b4e">0.72</text>
    <rect x="568" y="470" width="70" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="603" y="490" fill="#2f6b4e">0.78</text>
    <rect x="640" y="470" width="70" height="30" rx="5" fill="#e5f3ec" stroke="#a9d8c0"/><text x="675" y="490" fill="#2f6b4e">0.94</text>
  </g>

  <!-- 复杂度 + 倾斜 -->
  <rect x="40" y="520" width="600" height="100" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="60" y="546" font-size="11" font-weight="700" fill="#20375e">复杂度与性质</text>
  <text x="60" y="570" font-size="10.5" fill="#4a4a4f">分配 O(n) + 各桶排序。若数据均匀、每桶 O(1) 个元素，</text>
  <text x="60" y="590" font-size="10.5" fill="#4a4a4f">总体 <tspan font-weight="700" fill="#2f6b4e">平均 O(n + k)</tspan>；空间 O(n + k)。</text>
  <text x="60" y="612" font-size="10" fill="#6e6e73">稳定性取决于桶内所用排序；用稳定排序则整体稳定。</text>

  <rect x="660" y="520" width="430" height="100" rx="12" fill="#fdecea" stroke="#e8a79f"/>
  <text x="680" y="546" font-size="11" font-weight="700" fill="#8a4038">分布不均 → 退化</text>
  <text x="680" y="570" font-size="10.5" fill="#4a4a4f">数据倾斜时元素挤进同一桶，桶内排序主导开销：</text>
  <text x="680" y="590" font-size="10.5" fill="#8a4038">最坏 O(n²)（桶内用插入）或 O(n log n)（桶内用快排）。</text>
  <text x="680" y="612" font-size="10" fill="#6e6e73">故桶排序的价值前提是「已知数据近似均匀分布」。</text>
</svg>
