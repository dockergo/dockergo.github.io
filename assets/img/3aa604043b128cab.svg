<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1120" height="680" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="16" font-weight="700" fill="#1d1d1f">线性表的两种物理布局 · 连续内存（数组） vs 离散节点（链表），动态数组居中衔接</text>
  <text x="30" y="55" font-size="10.5" fill="#6e6e73">同一逻辑序列的两种落地方式：布局决定访问与增删的代价此消彼长 —— 数组以位置换搬移，链表以指针换遍历</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10" fill="#3a3a3c">连续内存 / 主结构</text>
  <rect x="200" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="218" y="82" font-size="10" fill="#3a3a3c">O(1) 高效路径</text>
  <rect x="350" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="368" y="82" font-size="10" fill="#3a3a3c">O(n) 需搬移 / 遍历</text>
  <rect x="540" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="558" y="82" font-size="10" fill="#3a3a3c">容量 / size 状态</text>

  <!-- 左：数组 -->
  <rect x="30" y="100" width="520" height="248" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="52" y="128" font-size="13" font-weight="700" fill="#20375e">数组 · 连续内存（contiguous）</text>
  <text x="52" y="146" font-size="10" fill="#6e6e73">一整块连续内存，元素等长紧密排列</text>

  <g font-size="12" text-anchor="middle">
    <rect x="60" y="158" width="64" height="44" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="92" y="185" fill="#20375e">a0</text>
    <rect x="124" y="158" width="64" height="44" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="156" y="185" fill="#20375e">a1</text>
    <rect x="188" y="158" width="64" height="44" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="220" y="185" fill="#20375e">a2</text>
    <rect x="252" y="158" width="64" height="44" rx="5" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="284" y="185" fill="#20375e">a3</text>
    <rect x="316" y="158" width="64" height="44" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="348" y="185" fill="#20375e">a4</text>
    <rect x="380" y="158" width="64" height="44" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/><text x="412" y="185" fill="#20375e">a5</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#8a97ab">
    <text x="92" y="215">idx 0</text><text x="156" y="215">1</text><text x="220" y="215">2</text><text x="284" y="215">3</text><text x="348" y="215">4</text><text x="412" y="215">5</text>
  </g>
  <text x="284" y="238" font-size="9.5" text-anchor="middle" fill="#2f6b4e">addr = base + i × size → 一步定位</text>

  <rect x="52" y="256" width="220" height="30" rx="6" fill="#eafaf2" stroke="#bfe6d3"/>
  <text x="62" y="275" font-size="10.5" fill="#2f6b4e">随机访问 <tspan font-weight="700">O(1)</tspan> · 按下标直达</text>
  <rect x="284" y="256" width="248" height="30" rx="6" fill="#fbecea" stroke="#eec5c0"/>
  <text x="294" y="275" font-size="10.5" fill="#8a4038">中间增删 <tspan font-weight="700">O(n)</tspan> · 后续元素整体搬移</text>
  <text x="52" y="312" font-size="10" fill="#6e6e73">长度固定：容量不足需另开新数组并整体复制</text>
  <text x="52" y="332" font-size="10" fill="#6e6e73">缓存友好：相邻元素同段内存，命中率高</text>

  <!-- 右：链表 -->
  <rect x="580" y="100" width="500" height="248" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="602" y="128" font-size="13" font-weight="700" fill="#20375e">链表 · 离散节点（scattered）</text>
  <text x="602" y="146" font-size="10" fill="#6e6e73">节点在内存中地址不连续，靠 next 指针串联</text>

  <g font-size="11" text-anchor="middle">
    <rect x="600" y="160" width="76" height="42" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/>
    <line x1="648" y1="160" x2="648" y2="202" stroke="#c6d9f2"/><text x="624" y="186" fill="#20375e">val</text><text x="662" y="186" font-size="9" fill="#5a7099">next</text>
    <rect x="740" y="160" width="76" height="42" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/>
    <line x1="788" y1="160" x2="788" y2="202" stroke="#c6d9f2"/><text x="764" y="186" fill="#20375e">val</text><text x="802" y="186" font-size="9" fill="#5a7099">next</text>
    <rect x="880" y="160" width="76" height="42" rx="5" fill="#eaf1fb" stroke="#c6d9f2"/>
    <line x1="928" y1="160" x2="928" y2="202" stroke="#c6d9f2"/><text x="904" y="186" fill="#20375e">val</text><text x="942" y="186" font-size="9" fill="#5a7099">next</text>
  </g>
  <line x1="662" y1="181" x2="738" y2="181" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <line x1="802" y1="181" x2="878" y2="181" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="990" y="185" font-size="12" fill="#a1a1a6">⊥</text>
  <line x1="942" y1="181" x2="982" y2="181" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="602" y="222" font-size="9" fill="#8a97ab">head → 逐跳指针，物理地址跳跃</text>

  <rect x="602" y="256" width="228" height="30" rx="6" fill="#eafaf2" stroke="#bfe6d3"/>
  <text x="612" y="275" font-size="10.5" fill="#2f6b4e">头插 / 结点后插 <tspan font-weight="700">O(1)</tspan> · 只改指针</text>
  <rect x="842" y="256" width="216" height="30" rx="6" fill="#fbecea" stroke="#eec5c0"/>
  <text x="852" y="275" font-size="10.5" fill="#8a4038">按位访问 <tspan font-weight="700">O(n)</tspan> · 从头遍历</text>
  <text x="602" y="312" font-size="10" fill="#6e6e73">长度弹性：随时增删节点，无需预留容量</text>
  <text x="602" y="332" font-size="10" fill="#6e6e73">每节点额外存指针；地址跳跃，缓存不友好</text>

  <!-- 中：动态数组桥接 -->
  <line x1="290" y1="348" x2="290" y2="392" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="298" y="374" font-size="9.5" fill="#20375e">以数组为底层</text>

  <rect x="300" y="392" width="520" height="196" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="322" y="420" font-size="13" font-weight="700" fill="#20375e">动态数组 = 数组 + 自动扩容</text>
  <text x="322" y="438" font-size="10" fill="#6e6e73">对上层像可变长序列，对底层仍是一块连续内存</text>

  <!-- size / capacity 条 -->
  <g text-anchor="middle" font-size="10">
    <rect x="322" y="452" width="52" height="34" rx="4" fill="#dbe8fa" stroke="#9dbdea"/><text x="348" y="474" fill="#20375e">e0</text>
    <rect x="374" y="452" width="52" height="34" rx="4" fill="#dbe8fa" stroke="#9dbdea"/><text x="400" y="474" fill="#20375e">e1</text>
    <rect x="426" y="452" width="52" height="34" rx="4" fill="#dbe8fa" stroke="#9dbdea"/><text x="452" y="474" fill="#20375e">e2</text>
    <rect x="478" y="452" width="52" height="34" rx="4" fill="#fdf4e3" stroke="#e8cf95" stroke-dasharray="4 2"/><text x="504" y="474" fill="#9a7420">空</text>
    <rect x="530" y="452" width="52" height="34" rx="4" fill="#fdf4e3" stroke="#e8cf95" stroke-dasharray="4 2"/><text x="556" y="474" fill="#9a7420">空</text>
  </g>
  <text x="400" y="502" font-size="9" text-anchor="middle" fill="#5a7099">size = 3</text>
  <text x="504" y="502" font-size="9" text-anchor="middle" fill="#9a7420">预留容量</text>
  <line x1="322" y1="510" x2="582" y2="510" stroke="#d99a2b" stroke-width="1.2"/>
  <text x="452" y="524" font-size="9" text-anchor="middle" fill="#9a7420">capacity = 5</text>

  <text x="610" y="466" font-size="10.5" fill="#2f6b4e">尾插均摊 <tspan font-weight="700">O(1)</tspan></text>
  <text x="610" y="486" font-size="10.5" fill="#8a4038">满则倍增（×2）扩容</text>
  <text x="610" y="506" font-size="10.5" fill="#6e6e73">分配新数组 + 拷贝旧元素</text>
  <text x="610" y="526" font-size="10" fill="#8a97ab">随机访问仍 O(1)，兼得下标与弹性</text>
  <text x="322" y="556" font-size="9.5" fill="#6e6e73">扩容是偶发的 O(n)，被大量 O(1) 尾插摊平 → 平均每次插入仍近似常数</text>
  <text x="322" y="574" font-size="9.5" fill="#6e6e73">代价：扩容瞬间需额外一整块内存并复制；容量常有冗余</text>

  <!-- 底部选型 -->
  <rect x="30" y="608" width="1050" height="54" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="48" y="632" font-size="10.5" font-weight="700" fill="#20375e">选型直觉</text>
  <text x="112" y="632" font-size="10" fill="#4a4a4f">随机访问密集、需按下标读写 → 数组 / 动态数组；频繁在两端或给定结点处增删、且不靠下标定位 → 链表。</text>
  <text x="112" y="651" font-size="10" fill="#4a4a4f">工程默认多用动态数组（如 Go slice、C++ vector）：绝大多数场景下缓存友好 + 尾插均摊 O(1) 的收益压过偶发扩容。</text>
</svg>
