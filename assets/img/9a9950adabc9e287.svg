<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="650" viewBox="0 0 1150 650" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#c99a3a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a5cae"/></marker>
  </defs>
  <rect width="1150" height="650" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">Kafka 消费者组 rebalance · 这是"竞争消费者"模式的真身：Group Coordinator 在成员加入/离开/Topic 元数据变化时触发分区重分配，组内每个 Partition 只交给一个 Member</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">目标不是广播（那是 M1 的事），是把同一 Topic 的消费负载在组内成员间分摊——分摊的具体切法由每次 rebalance 的分配结果决定</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#c99a3a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aA)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">触发条件 → Coordinator</text>
  <line x1="230" y1="80" x2="254" y2="80" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <text x="260" y="84" font-size="10" fill="#3a3a3c">JoinGroup / SyncGroup 协议往返</text>
  <line x1="480" y1="80" x2="504" y2="80" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="510" y="84" font-size="10" fill="#3a3a3c">重分配结果生效（组内竞争消费）</text>
  <text x="1120" y="86" font-size="10" fill="#a1a1a6" text-anchor="end">Kafka Group Coordinator</text>
  <line x1="30" y1="98" x2="1120" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 三个触发条件 -->
  <text x="48" y="122" font-size="12" font-weight="700" fill="#1d1d1f">触发条件（任一发生即启动 rebalance）</text>
  <rect x="30" y="132" width="270" height="70" rx="10" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="165" y="156" font-size="10.5" font-weight="700" fill="#8a6417" text-anchor="middle">成员加入</text>
  <text x="165" y="174" font-size="9" fill="#7a5a1a" text-anchor="middle">新 consumer 启动并发 JoinGroup</text>
  <text x="165" y="190" font-size="8.5" fill="#a98a3a" text-anchor="middle">（扩容 / 首次启动）</text>

  <rect x="320" y="132" width="270" height="70" rx="10" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="455" y="156" font-size="10.5" font-weight="700" fill="#8a6417" text-anchor="middle">成员离开</text>
  <text x="455" y="174" font-size="9" fill="#7a5a1a" text-anchor="middle">主动 LeaveGroup，或心跳超时被判定死亡</text>
  <text x="455" y="190" font-size="8.5" fill="#a98a3a" text-anchor="middle">（缩容 / 崩溃）</text>

  <rect x="610" y="132" width="270" height="70" rx="10" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="745" y="156" font-size="10.5" font-weight="700" fill="#8a6417" text-anchor="middle">Topic 元数据变化</text>
  <text x="745" y="174" font-size="9" fill="#7a5a1a" text-anchor="middle">订阅的 Topic 新增 partition</text>
  <text x="745" y="190" font-size="8.5" fill="#a98a3a" text-anchor="middle">（扩分区）</text>

  <line x1="165" y1="202" x2="480" y2="248" stroke="#c99a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aA)"/>
  <line x1="455" y1="202" x2="500" y2="248" stroke="#c99a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aA)"/>
  <line x1="745" y1="202" x2="560" y2="248" stroke="#c99a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aA)"/>

  <!-- Group Coordinator -->
  <rect x="400" y="252" width="350" height="88" rx="12" fill="#f4eefb" stroke="#dcc9ef" filter="url(#soft)"/>
  <text x="575" y="278" font-size="12.5" font-weight="700" fill="#6f3ea8" text-anchor="middle">Group Coordinator（某个 broker）</text>
  <text x="575" y="298" font-size="9" fill="#5a3a7a" text-anchor="middle">收集全部成员的订阅信息，选定 assignor 策略</text>
  <text x="575" y="316" font-size="9" fill="#5a3a7a" text-anchor="middle">（range / round-robin / sticky …）计算新分配</text>

  <!-- JoinGroup/SyncGroup 往返 -->
  <text x="230" y="368" font-size="9.5" fill="#5a3a7a">① JoinGroup：全体成员上报订阅 → 推举一个 leader member</text>
  <text x="230" y="386" font-size="9.5" fill="#5a3a7a">② leader member 按策略算出分配方案，交回 Coordinator</text>
  <text x="230" y="404" font-size="9.5" fill="#5a3a7a">③ SyncGroup：Coordinator 把分配方案下发给每个成员</text>

  <!-- 分配前后对比 -->
  <rect x="30" y="424" width="520" height="200" rx="13" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="48" y="450" font-size="11.5" font-weight="700" fill="#4a4a4f">重分配前 · 3 member 分摊 4 个 partition</text>
  <g font-size="9.5">
    <rect x="48" y="464" width="230" height="42" rx="7" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="60" y="480" font-weight="700" fill="#1d1d1f">m1</text><text x="60" y="497" fill="#6e6e73">P0, P1</text>
    <rect x="290" y="464" width="230" height="42" rx="7" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="302" y="480" font-weight="700" fill="#1d1d1f">m2</text><text x="302" y="497" fill="#6e6e73">P2</text>
    <rect x="48" y="514" width="230" height="42" rx="7" fill="#fbe6e3" stroke="#e8a79f"/>
    <text x="60" y="530" font-weight="700" fill="#8a4038">m3</text><text x="60" y="547" fill="#8a4038">P3 —— 心跳超时，判定离线 ✗</text>
  </g>
  <text x="48" y="590" font-size="9" fill="#8a97ab">m3 离线触发 rebalance：它持有的 P3 必须重新指派，其余成员的持有量也可能被重新打散（取决于 assignor 策略）。</text>
  <text x="48" y="608" font-size="9" fill="#8a97ab">stickiness 较好的策略会尽量保留 m1/m2 已有的分配，只把 P3 挪给别人，减少不必要的状态迁移。</text>

  <line x1="560" y1="524" x2="610" y2="524" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="585" y="514" font-size="9" fill="#2f6b4e" text-anchor="middle">rebalance</text>

  <rect x="620" y="424" width="500" height="200" rx="13" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="638" y="450" font-size="11.5" font-weight="700" fill="#2f6b4e">重分配后 · 2 个存活 member 重新分摊全部 4 个 partition</text>
  <g font-size="9.5">
    <rect x="638" y="464" width="230" height="90" rx="7" fill="#ffffff" stroke="#bfe3d1"/>
    <text x="650" y="482" font-weight="700" fill="#2f6b4e">m1</text>
    <text x="650" y="500" fill="#3f8a63">P0, P1（不变）</text>
    <text x="650" y="518" fill="#3f8a63" font-weight="700">+ P3（承接 m3 遗留）</text>
    <rect x="880" y="464" width="220" height="90" rx="7" fill="#ffffff" stroke="#bfe3d1"/>
    <text x="892" y="482" font-weight="700" fill="#2f6b4e">m2</text>
    <text x="892" y="500" fill="#3f8a63">P2（不变）</text>
  </g>
  <text x="638" y="580" font-size="9" fill="#3f8a63">每个 partition 组内仍恰好只属于一个 member —— 这就是「competing consumers」：</text>
  <text x="638" y="598" font-size="9" fill="#3f8a63">谁能读到哪条消息由分配决定，不存在两个 member 同时消费同一 partition 的情况。</text>
  <text x="638" y="616" font-size="8.5" fill="#8a97ab">已核实来源：group coordinator 在成员加入/离开/metadata 变化时触发分区(re)分配——principles/_VERIFIED_FACTS.md · messaging 节。</text>
</svg>
