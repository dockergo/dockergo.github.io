<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1120" height="640" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">排序 · 对比矩阵：9 种排序的时间 / 空间 / 稳定性 / 原地性 / 约束与场景</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">按流派分组：比较类简单 O(n²) ｜ 比较类高效 O(n log n) ｜ 非比较类（线性但受约束）</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">优（线性 / n log n / 稳定）</text>
  <rect x="230" y="72" width="12" height="12" rx="2" fill="#20375e"/><text x="248" y="82" font-size="10.5" fill="#3a3a3c">n log n</text>
  <rect x="330" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="348" y="82" font-size="10.5" fill="#3a3a3c">劣（n² / 不稳定 / 退化）</text>

  <!-- 分组底色 -->
  <rect x="40" y="142" width="1040" height="126" fill="#f6f9fe"/>
  <rect x="40" y="268" width="1040" height="126" fill="#eef4fc"/>
  <rect x="40" y="394" width="1040" height="126" fill="#fdf6ea"/>

  <!-- 外框 -->
  <rect x="40" y="100" width="1040" height="420" rx="10" fill="none" stroke="#e4e7ec"/>
  <!-- 表头 -->
  <rect x="40" y="100" width="1040" height="42" rx="10" fill="#eef1f5"/>
  <rect x="40" y="130" width="1040" height="12" fill="#eef1f5"/>
  <g font-size="11" font-weight="700" fill="#20375e" text-anchor="middle">
    <text x="95" y="126">算法</text>
    <text x="202" y="126">平均时间</text>
    <text x="307" y="126">最坏时间</text>
    <text x="407" y="126">空间</text>
    <text x="490" y="126">稳定</text>
    <text x="560" y="126">原地</text>
  </g>
  <text x="605" y="126" font-size="11" font-weight="700" fill="#20375e">约束 / 典型场景</text>

  <!-- 行数据 -->
  <g font-size="11">
    <!-- 冒泡 -->
    <text x="95" y="169" text-anchor="middle" font-weight="700" fill="#20375e">O1 冒泡</text>
    <text x="202" y="169" text-anchor="middle" fill="#8a4038">O(n²)</text>
    <text x="307" y="169" text-anchor="middle" fill="#8a4038">O(n²)</text>
    <text x="407" y="169" text-anchor="middle" fill="#2f6b4e">O(1)</text>
    <text x="490" y="169" text-anchor="middle" fill="#2f6b4e">稳定</text>
    <text x="560" y="169" text-anchor="middle" fill="#2f6b4e">是</text>
    <text x="605" y="169" fill="#4a4a4f">教学示例；带 flag 对近乎有序数据可达 O(n)</text>
    <!-- 插入 -->
    <text x="95" y="211" text-anchor="middle" font-weight="700" fill="#20375e">O2 插入</text>
    <text x="202" y="211" text-anchor="middle" fill="#8a4038">O(n²)</text>
    <text x="307" y="211" text-anchor="middle" fill="#8a4038">O(n²)</text>
    <text x="407" y="211" text-anchor="middle" fill="#2f6b4e">O(1)</text>
    <text x="490" y="211" text-anchor="middle" fill="#2f6b4e">稳定</text>
    <text x="560" y="211" text-anchor="middle" fill="#2f6b4e">是</text>
    <text x="605" y="211" fill="#4a4a4f">小数组 / 近序极快；作快排、归并小区间收尾</text>
    <!-- 选择 -->
    <text x="95" y="253" text-anchor="middle" font-weight="700" fill="#20375e">O3 选择</text>
    <text x="202" y="253" text-anchor="middle" fill="#8a4038">O(n²)</text>
    <text x="307" y="253" text-anchor="middle" fill="#8a4038">O(n²)</text>
    <text x="407" y="253" text-anchor="middle" fill="#2f6b4e">O(1)</text>
    <text x="490" y="253" text-anchor="middle" fill="#8a4038">不稳定</text>
    <text x="560" y="253" text-anchor="middle" fill="#2f6b4e">是</text>
    <text x="605" y="253" fill="#4a4a4f">交换次数最少（≤ n-1）；写 / 搬移代价高时占优</text>

    <!-- 快排 -->
    <text x="95" y="295" text-anchor="middle" font-weight="700" fill="#20375e">O4 快排</text>
    <text x="202" y="295" text-anchor="middle" fill="#20375e">O(n log n)</text>
    <text x="307" y="295" text-anchor="middle" fill="#8a4038">O(n²)</text>
    <text x="407" y="295" text-anchor="middle" fill="#20375e">O(log n)</text>
    <text x="490" y="295" text-anchor="middle" fill="#8a4038">不稳定</text>
    <text x="560" y="295" text-anchor="middle" fill="#2f6b4e">是</text>
    <text x="605" y="295" fill="#4a4a4f">通用最快、常数最小；三数取中 + 尾递归防退化</text>
    <!-- 归并 -->
    <text x="95" y="337" text-anchor="middle" font-weight="700" fill="#20375e">O5 归并</text>
    <text x="202" y="337" text-anchor="middle" fill="#20375e">O(n log n)</text>
    <text x="307" y="337" text-anchor="middle" fill="#2f6b4e">O(n log n)</text>
    <text x="407" y="337" text-anchor="middle" fill="#8a4038">O(n)</text>
    <text x="490" y="337" text-anchor="middle" fill="#2f6b4e">稳定</text>
    <text x="560" y="337" text-anchor="middle" fill="#8a4038">否</text>
    <text x="605" y="337" fill="#4a4a4f">要稳定 + 最坏可控；链表排序、外部 / 多路归并</text>
    <!-- 堆排 -->
    <text x="95" y="379" text-anchor="middle" font-weight="700" fill="#20375e">O6 堆排</text>
    <text x="202" y="379" text-anchor="middle" fill="#20375e">O(n log n)</text>
    <text x="307" y="379" text-anchor="middle" fill="#2f6b4e">O(n log n)</text>
    <text x="407" y="379" text-anchor="middle" fill="#2f6b4e">O(1)</text>
    <text x="490" y="379" text-anchor="middle" fill="#8a4038">不稳定</text>
    <text x="560" y="379" text-anchor="middle" fill="#2f6b4e">是</text>
    <text x="605" y="379" fill="#4a4a4f">最坏有保证且原地；Top-K、优先队列、内存受限</text>

    <!-- 计数 -->
    <text x="95" y="421" text-anchor="middle" font-weight="700" fill="#8a5a12">O7 计数</text>
    <text x="202" y="421" text-anchor="middle" fill="#2f6b4e">O(n+m)</text>
    <text x="307" y="421" text-anchor="middle" fill="#2f6b4e">O(n+m)</text>
    <text x="407" y="421" text-anchor="middle" fill="#8a4038">O(n+m)</text>
    <text x="490" y="421" text-anchor="middle" fill="#2f6b4e">稳定</text>
    <text x="560" y="421" text-anchor="middle" fill="#8a4038">否</text>
    <text x="605" y="421" fill="#4a4a4f">整数 + 小值域 m；作基数排序的每轮子过程</text>
    <!-- 桶 -->
    <text x="95" y="463" text-anchor="middle" font-weight="700" fill="#8a5a12">O8 桶</text>
    <text x="202" y="463" text-anchor="middle" fill="#2f6b4e">O(n+k)</text>
    <text x="307" y="463" text-anchor="middle" fill="#8a4038">O(n²)</text>
    <text x="407" y="463" text-anchor="middle" fill="#8a4038">O(n+k)</text>
    <text x="490" y="463" text-anchor="middle" fill="#6e6e73">视桶内</text>
    <text x="560" y="463" text-anchor="middle" fill="#8a4038">否</text>
    <text x="605" y="463" fill="#4a4a4f">数据近似均匀分布（浮点 / 实数）；否则退化</text>
    <!-- 基数 -->
    <text x="95" y="505" text-anchor="middle" font-weight="700" fill="#8a5a12">O9 基数</text>
    <text x="202" y="505" text-anchor="middle" fill="#2f6b4e">O(n·k)</text>
    <text x="307" y="505" text-anchor="middle" fill="#2f6b4e">O(n·k)</text>
    <text x="407" y="505" text-anchor="middle" fill="#8a4038">O(n+基数)</text>
    <text x="490" y="505" text-anchor="middle" fill="#2f6b4e">稳定</text>
    <text x="560" y="505" text-anchor="middle" fill="#8a4038">否</text>
    <text x="605" y="505" fill="#4a4a4f">定长键（整数 / 定长串）；大量固定长度主键排序</text>
  </g>

  <!-- 横向分隔 -->
  <g stroke="#e4e7ec" stroke-width="1">
    <line x1="40" y1="184" x2="1080" y2="184"/>
    <line x1="40" y1="226" x2="1080" y2="226"/>
    <line x1="40" y1="268" x2="1080" y2="268"/>
    <line x1="40" y1="310" x2="1080" y2="310"/>
    <line x1="40" y1="352" x2="1080" y2="352"/>
    <line x1="40" y1="394" x2="1080" y2="394"/>
    <line x1="40" y1="436" x2="1080" y2="436"/>
    <line x1="40" y1="478" x2="1080" y2="478"/>
  </g>
  <!-- 纵向分隔 -->
  <g stroke="#e4e7ec" stroke-width="1">
    <line x1="150" y1="100" x2="150" y2="520"/>
    <line x1="255" y1="100" x2="255" y2="520"/>
    <line x1="360" y1="100" x2="360" y2="520"/>
    <line x1="455" y1="100" x2="455" y2="520"/>
    <line x1="525" y1="100" x2="525" y2="520"/>
    <line x1="595" y1="100" x2="595" y2="520"/>
  </g>
  <!-- 分组标签（置于左外缘，竖排，不压行内文字） -->
  <text x="30" y="205" font-size="9.5" fill="#20375e" text-anchor="middle" transform="rotate(-90 30 205)">比较·简单 O(n²)</text>
  <text x="30" y="331" font-size="9.5" fill="#20375e" text-anchor="middle" transform="rotate(-90 30 331)">比较·高效 O(n log n)</text>
  <text x="30" y="457" font-size="9.5" fill="#8a5a12" text-anchor="middle" transform="rotate(-90 30 457)">非比较·线性</text>

  <!-- 选型建议 -->
  <rect x="40" y="536" width="1040" height="80" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="60" y="560" font-size="12" font-weight="700" fill="#20375e">选型速查</text>
  <text x="60" y="583" font-size="10.5" fill="#4a4a4f">通用首选 <tspan font-weight="700" fill="#20375e">快排</tspan>（库排序核心）· 需稳定用 <tspan font-weight="700" fill="#2f6b4e">归并</tspan> · 最坏受限 / 内存紧张 / 原地用 <tspan font-weight="700" fill="#20375e">堆排</tspan> · 小数据或近乎有序用 <tspan font-weight="700" fill="#2f6b4e">插入</tspan></text>
  <text x="60" y="605" font-size="10.5" fill="#4a4a4f">整数且值域小用 <tspan font-weight="700" fill="#8a5a12">计数</tspan> · 定长键 / 大值域用 <tspan font-weight="700" fill="#8a5a12">基数</tspan> · 均匀分布实数用 <tspan font-weight="700" fill="#8a5a12">桶</tspan>。比较类受 O(n log n) 下界束缚，非比较类以约束换线性。</text>
</svg>
