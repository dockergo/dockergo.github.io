<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2aa0a4"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d9772f"/></marker>
    <marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#a1a1a6"/></marker>
  </defs>
  <rect width="1140" height="720" fill="#fbfbfd"/>

  <!-- 判型标题带 -->
  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">缓存模式 · 缓存拿命中率换延迟，核心矛盾是「命中前谁去源站取」与「写后何时让缓存看见新值」——两条独立的路径</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">读路径决定未命中时怎么回源、怎么填充；写路径决定写入之后新值何时对读可见——同一套缓存机制常只专精其中一侧</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">读路径 · miss → 回源 → 填充缓存</text>
  <line x1="300" y1="80" x2="324" y2="80" stroke="#d9772f" stroke-width="2" marker-end="url(#aO)"/>
  <text x="330" y="84" font-size="10" fill="#3a3a3c">写路径 · 写入 → 落地滞后由 WAL 兜底</text>
  <line x1="620" y1="80" x2="644" y2="80" stroke="#a1a1a6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aN)"/>
  <text x="650" y="84" font-size="10" fill="#3a3a3c">两问题正交独立，实现各有侧重</text>
  <text x="1110" y="86" font-size="9.5" fill="#a1a1a6" text-anchor="end">两个真实项目 · 已源码/文档级核实</text>
  <line x1="30" y1="98" x2="1110" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- Band A：两个正交问题 -->
  <rect x="30" y="110" width="1080" height="96" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <line x1="570" y1="126" x2="570" y2="196" stroke="#d7d7dd" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="50" y="140" font-size="13" font-weight="700" fill="#1d6b6e">① 命中前，谁去源站取？</text>
  <text x="50" y="162" font-size="9.5" fill="#4a8a8c">读路径 Read Path —— 未命中时怎么回源、怎么把结果填回缓存</text>
  <text x="50" y="182" font-size="8.5" fill="#8a97ab">典范：nginx proxy_cache（挡在源站前的反向代理缓存）</text>

  <text x="610" y="140" font-size="13" font-weight="700" fill="#9a5f1c">② 写后，缓存什么时候看见新值？</text>
  <text x="610" y="162" font-size="9.5" fill="#b0854a">写路径 Write Path —— 写入之后，新值何时对读可见</text>
  <text x="610" y="182" font-size="8.5" fill="#8a97ab">典范：InnoDB Buffer Pool（存储引擎自身的内存缓冲）</text>

  <!-- 连接段：Band A → Band B 的脊线 -->
  <line x1="570" y1="206" x2="570" y2="226" stroke="#d7d7dd" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Band B：两个 Pole -->
  <!-- 左：读路径 Pole（teal / nginx） -->
  <rect x="30" y="226" width="510" height="350" rx="14" fill="#e4f4f4" stroke="#bfe1e1" filter="url(#soft)"/>
  <text x="50" y="254" font-size="13" font-weight="700" fill="#1d6b6e">读路径 Pole · miss → 回源 → 填充</text>
  <line x1="46" y1="272" x2="524" y2="272" stroke="#bfe1e1" stroke-width="1"/>

  <rect x="46" y="298" width="478" height="44" rx="9" fill="#ffffff" stroke="#bfe1e1"/>
  <text x="62" y="315" font-size="10.5" font-weight="700" fill="#1d6b6e">① 请求到达 · 检查本地缓存</text>
  <text x="62" y="332" font-size="9" fill="#4a8a8c">命中 → 直接返回；未命中 → 进入下一步</text>

  <line x1="66" y1="342" x2="66" y2="356" stroke="#2aa0a4" stroke-width="1.8" marker-end="url(#aT)"/>
  <rect x="46" y="356" width="478" height="44" rx="9" fill="#ffffff" stroke="#bfe1e1"/>
  <text x="62" y="373" font-size="10.5" font-weight="700" fill="#1d6b6e">② 未命中 → 回源取数据</text>
  <text x="62" y="390" font-size="9" fill="#4a8a8c">nginx：转发请求给 upstream 源站</text>

  <line x1="66" y1="400" x2="66" y2="414" stroke="#2aa0a4" stroke-width="1.8" marker-end="url(#aT)"/>
  <rect x="46" y="414" width="478" height="44" rx="9" fill="#ffffff" stroke="#bfe1e1"/>
  <text x="62" y="431" font-size="10.5" font-weight="700" fill="#1d6b6e">③ 回源结果落盘填充缓存</text>
  <text x="62" y="448" font-size="9" fill="#4a8a8c">nginx：<tspan font-family="'SF Mono',ui-monospace,Menlo,monospace">ngx_http_file_cache_new</tspan> / <tspan font-family="'SF Mono',ui-monospace,Menlo,monospace">_update</tspan></text>

  <line x1="66" y1="458" x2="66" y2="472" stroke="#2aa0a4" stroke-width="1.8" marker-end="url(#aT)"/>
  <rect x="46" y="472" width="478" height="44" rx="9" fill="#ffffff" stroke="#bfe1e1"/>
  <text x="62" y="489" font-size="10.5" font-weight="700" fill="#1d6b6e">④ 后续相同请求直接命中</text>
  <text x="62" y="506" font-size="9" fill="#4a8a8c">不再触发回源，延迟骤降 · 淘汰细节见 H1</text>

  <rect x="46" y="532" width="286" height="32" rx="16" fill="#2aa0a4"/>
  <text x="189" y="553" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">读路径典范 · nginx proxy_cache</text>
  <text x="344" y="553" font-size="9" fill="#4a8a8c">cache-aside 读路径</text>

  <!-- 右：写路径 Pole（orange / InnoDB） -->
  <rect x="600" y="226" width="510" height="350" rx="14" fill="#fbeee2" stroke="#ecc6a8" filter="url(#soft)"/>
  <text x="620" y="254" font-size="13" font-weight="700" fill="#9a5f1c">写路径 Pole · 写入 → 何时可见新值</text>
  <line x1="616" y1="272" x2="1094" y2="272" stroke="#ecc6a8" stroke-width="1"/>

  <rect x="616" y="298" width="478" height="44" rx="9" fill="#ffffff" stroke="#ecc6a8"/>
  <text x="632" y="315" font-size="10.5" font-weight="700" fill="#9a5f1c">① 写入到达 · 内存立即更新</text>
  <text x="632" y="332" font-size="9" fill="#b0854a">InnoDB：改动直接体现在 Buffer Pool 页</text>

  <line x1="636" y1="342" x2="636" y2="356" stroke="#d9772f" stroke-width="1.8" marker-end="url(#aO)"/>
  <rect x="616" y="356" width="478" height="44" rx="9" fill="#ffffff" stroke="#ecc6a8"/>
  <text x="632" y="373" font-size="10.5" font-weight="700" fill="#9a5f1c">② WAL 铁律：redo log 必须先落盘</text>
  <text x="632" y="390" font-size="9" fill="#b0854a">这是事务提交唯一硬性前提，不是可选项</text>

  <line x1="636" y1="400" x2="636" y2="414" stroke="#d9772f" stroke-width="1.8" marker-end="url(#aO)"/>
  <rect x="616" y="414" width="478" height="44" rx="9" fill="#ffffff" stroke="#ecc6a8"/>
  <text x="632" y="431" font-size="10.5" font-weight="700" fill="#9a5f1c">③ 脏页写回与事务提交解耦</text>
  <text x="632" y="448" font-size="9" fill="#b0854a">InnoDB：刷盘异步进行，不阻塞 commit</text>

  <line x1="636" y1="458" x2="636" y2="472" stroke="#d9772f" stroke-width="1.8" marker-end="url(#aO)"/>
  <rect x="616" y="472" width="478" height="44" rx="9" fill="#ffffff" stroke="#ecc6a8"/>
  <text x="632" y="489" font-size="10.5" font-weight="700" fill="#9a5f1c">④ 淘汰走 LRU 类策略滚动</text>
  <text x="632" y="506" font-size="9" fill="#b0854a">midpoint insertion strategy · 细节见 H2</text>

  <rect x="616" y="532" width="300" height="32" rx="16" fill="#d9772f"/>
  <text x="766" y="553" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">写路径典范 · InnoDB Buffer Pool</text>
  <text x="928" y="553" font-size="9" fill="#b0854a">存储引擎内部缓冲</text>

  <!-- 中间连接徽标：两问题正交 -->
  <line x1="570" y1="226" x2="570" y2="576" stroke="#e4e7ec" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="570" cy="401" r="26" fill="#ffffff" stroke="#d7d7dd" filter="url(#soft)"/>
  <text x="570" y="406" font-size="15" fill="#8a97ab" text-anchor="middle">⇄</text>
  <text x="570" y="365" font-size="8.5" fill="#8a97ab" text-anchor="middle">两问题正交</text>
  <text x="570" y="445" font-size="8.5" fill="#8a97ab" text-anchor="middle">各显其长</text>

  <!-- Band C：一句话总结横幅 -->
  <rect x="30" y="596" width="1080" height="104" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="622" font-size="10.5" font-weight="700" fill="#1d1d1f">一句话</text>
  <text x="110" y="622" font-size="10" fill="#4a4a4f">nginx proxy_cache 是挡在源站前的<tspan font-weight="700" fill="#1d6b6e">外部只读加速层</tspan>——命中率与新鲜度全看淘汰节奏，源站内部写入对它完全不可见；</text>
  <text x="110" y="646" font-size="10" fill="#4a4a4f">InnoDB Buffer Pool 是存储引擎自己的<tspan font-weight="700" fill="#9a5f1c">内存缓冲</tspan>——写入立即可见，真正滞后的是磁盘落地，且只受 redo log 先落盘这一条 WAL 铁律约束。</text>
  <text x="110" y="668" font-size="9" fill="#8a97ab">同样叫「缓存」：一个在系统外部做纯读加速层、对写被动；一个在系统内部本身就是热数据的家、读写合一——这是角色差异，不是同一想法的两份配置。</text>
</svg>
