<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d0a95a"/></marker></defs>
  <rect width="920" height="380" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="14" font-weight="600" fill="#1d1d1f">ACID：不可变 HDFS 上用 base + delta 目录模型做行级事务（读时合并 = MVCC）</text>

  <!-- directory layout -->
  <text x="30" y="66" font-size="11" font-weight="600" fill="#5a3410">表目录：base 全量快照 + 追加式 delta 增量</text>
  <g text-anchor="middle" font-size="10.5">
    <rect x="60" y="80" width="130" height="52" rx="10" fill="#eafaf1" stroke="#bfe0cd" filter="url(#s)"/><text x="125" y="102" font-weight="600" fill="#12402a">base_0000005</text><text x="125" y="120" font-size="9.5" fill="#3f7a56">全量快照·已合并</text>
    <rect x="220" y="80" width="130" height="52" rx="10" fill="#fdf6ea" stroke="#efdcb4" filter="url(#s)"/><text x="285" y="102" font-weight="600" fill="#5a3410">delta_6_6</text><text x="285" y="120" font-size="9.5" fill="#8a6a2e">insert 增量</text>
    <rect x="380" y="80" width="130" height="52" rx="10" fill="#fdf6ea" stroke="#efdcb4" filter="url(#s)"/><text x="445" y="102" font-weight="600" fill="#5a3410">delete_delta_7_7</text><text x="445" y="120" font-size="9.5" fill="#8a6a2e">delete 增量</text>
    <rect x="540" y="80" width="130" height="52" rx="10" fill="#fdf6ea" stroke="#efdcb4" filter="url(#s)"/><text x="605" y="102" font-weight="600" fill="#5a3410">delta_8_8</text><text x="605" y="120" font-size="9.5" fill="#8a6a2e">insert 增量</text>
  </g>
  <text x="720" y="102" font-size="9.5" fill="#a1a1a6">每次写事务 → 追加一个新目录</text>
  <text x="720" y="118" font-size="9.5" fill="#a1a1a6">行 = (writeId, bucketId, rowId)</text>

  <!-- read merge -->
  <text x="30" y="176" font-size="11" font-weight="600" fill="#1b2a4a">读路径：AcidUtils.getAcidState() 按「有效事务列表」合并 base + delta</text>
  <rect x="60" y="190" width="610" height="56" rx="12" fill="#eef3fb" stroke="#bcd0ec" filter="url(#s)"/>
  <text x="365" y="214" font-size="11" font-weight="600" fill="#1b2a4a" text-anchor="middle">读时合并：base 打底 → 叠加 insert delta → 扣除 delete delta</text>
  <text x="365" y="234" font-size="10" fill="#5b6b86" text-anchor="middle">只读「已提交且对本查询可见」的 writeId；未提交/已回滚的 delta 直接跳过 → 快照读，读不阻塞写</text>
  <g stroke="#8fb0d8" stroke-width="1.3" fill="none" marker-end="url(#a)"><path d="M125,132 L300,188" stroke="#bcd0ec"/><path d="M285,132 L340,188" stroke="#efc98a"/><path d="M445,132 L400,188" stroke="#efc98a"/><path d="M605,132 L430,188" stroke="#efc98a"/></g>

  <!-- compaction -->
  <text x="30" y="286" font-size="11" font-weight="600" fill="#5a3410">Compaction 三段式：后台把 delta 合并回 base，控制小文件</text>
  <g text-anchor="middle" font-size="10.5">
    <rect x="60" y="300" width="150" height="44" rx="10" fill="#fdf6ea" stroke="#efdcb4"/><text x="135" y="320" font-weight="600" fill="#5a3410">Initiator</text><text x="135" y="336" font-size="9.5" fill="#8a6a2e">决策·入队</text>
    <rect x="260" y="300" width="150" height="44" rx="10" fill="#fdf6ea" stroke="#efdcb4"/><text x="335" y="320" font-weight="600" fill="#5a3410">Worker</text><text x="335" y="336" font-size="9.5" fill="#8a6a2e">起 Tez 合并</text>
    <rect x="460" y="300" width="150" height="44" rx="10" fill="#fdf6ea" stroke="#efdcb4"/><text x="535" y="320" font-weight="600" fill="#5a3410">Cleaner</text><text x="535" y="336" font-size="9.5" fill="#8a6a2e">清孤儿目录</text>
  </g>
  <g stroke="#d0a95a" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M210,322 L258,322"/><path d="M410,322 L458,322"/></g>
  <rect x="640" y="300" width="220" height="44" rx="10" fill="#eafaf1" stroke="#bfe0cd"/>
  <text x="750" y="320" font-size="10" fill="#12402a" text-anchor="middle">Minor 合 delta / Major 合 base</text>
  <text x="750" y="336" font-size="10" fill="#12402a" text-anchor="middle">状态存 HMS 的 TxnHandler(RDBMS)</text>
</svg>