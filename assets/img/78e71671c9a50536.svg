<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1120" height="600" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">CMP · 链式地址 vs 开放寻址：同解冲突，取舍迥异</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">两者都实现平均 O(1)，差异在冲突的「安放方式」，进而影响缓存、删除与可承受的负载</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">✓ 占优</text>
  <rect x="130" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="148" y="82" font-size="10.5" fill="#3a3a3c">△ 折中</text>
  <rect x="230" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="248" y="82" font-size="10.5" fill="#3a3a3c">✗ 偏弱</text>

  <!-- 表头 -->
  <rect x="30" y="100" width="300" height="46" rx="8" fill="#f2f3f5" stroke="#e4e7ec"/><text x="48" y="128" font-size="12" font-weight="700" fill="#3a3a3c">维度</text>
  <rect x="338" y="100" width="376" height="46" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/><text x="526" y="128" font-size="13" font-weight="700" fill="#20375e" text-anchor="middle">链式地址 Chaining</text>
  <rect x="722" y="100" width="368" height="46" rx="8" fill="#fdf3e0" stroke="#e7c07a"/><text x="906" y="128" font-size="13" font-weight="700" fill="#8a5a12" text-anchor="middle">开放寻址 Open Addressing</text>

  <!-- 行1 冲突处理 -->
  <rect x="30" y="152" width="300" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><text x="48" y="182" font-size="11.5" font-weight="700" fill="#3a3a3c">冲突处理</text><text x="48" y="202" font-size="9.5" fill="#8e8e93">同桶键放哪里</text>
  <rect x="338" y="152" width="376" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="338" y="152" width="6" height="66" rx="3" fill="#2f9e6e"/><text x="358" y="180" font-size="11" fill="#3a3a3c">桶外挂链表，冲突项追加链尾</text><text x="358" y="200" font-size="10" fill="#6e6e73">桶只存表头，结构简单直观</text>
  <rect x="722" y="152" width="368" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="722" y="152" width="6" height="66" rx="3" fill="#d99a2b"/><text x="742" y="180" font-size="11" fill="#3a3a3c">桶内探测顺移，占用后续空槽</text><text x="742" y="200" font-size="10" fill="#6e6e73">全部键值同住一个数组</text>

  <!-- 行2 缓存局部性 -->
  <rect x="30" y="224" width="300" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><text x="48" y="254" font-size="11.5" font-weight="700" fill="#3a3a3c">缓存局部性</text><text x="48" y="274" font-size="9.5" fill="#8e8e93">CPU cache 友好度</text>
  <rect x="338" y="224" width="376" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="338" y="224" width="6" height="66" rx="3" fill="#d1544a"/><text x="358" y="252" font-size="11" fill="#3a3a3c">链节点散落堆上，指针跳转多</text><text x="358" y="272" font-size="10" fill="#8a4038">✗ cache 命中差，额外指针开销</text>
  <rect x="722" y="224" width="368" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="722" y="224" width="6" height="66" rx="3" fill="#2f9e6e"/><text x="742" y="252" font-size="11" fill="#3a3a3c">连续数组，探测即顺序访问</text><text x="742" y="272" font-size="10" fill="#1f6b4a">✓ cache 友好，无指针开销</text>

  <!-- 行3 删除难度 -->
  <rect x="30" y="296" width="300" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><text x="48" y="326" font-size="11.5" font-weight="700" fill="#3a3a3c">删除难度</text><text x="48" y="346" font-size="9.5" fill="#8e8e93">移除一个键的代价</text>
  <rect x="338" y="296" width="376" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="338" y="296" width="6" height="66" rx="3" fill="#2f9e6e"/><text x="358" y="324" font-size="11" fill="#3a3a3c">链上摘除节点即可</text><text x="358" y="344" font-size="10" fill="#1f6b4a">✓ 干净，不影响其它键</text>
  <rect x="722" y="296" width="368" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="722" y="296" width="6" height="66" rx="3" fill="#d1544a"/><text x="742" y="324" font-size="11" fill="#3a3a3c">必须写 TOMBSTONE 墓碑</text><text x="742" y="344" font-size="10" fill="#8a4038">✗ 置空会断探测链；墓碑会堆积</text>

  <!-- 行4 负载因子上限 -->
  <rect x="30" y="368" width="300" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><text x="48" y="398" font-size="11.5" font-weight="700" fill="#3a3a3c">负载因子上限</text><text x="48" y="418" font-size="9.5" fill="#8e8e93">能装多满</text>
  <rect x="338" y="368" width="376" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="338" y="368" width="6" height="66" rx="3" fill="#2f9e6e"/><text x="358" y="396" font-size="11" fill="#3a3a3c">可容忍 loadFactor &gt; 1</text><text x="358" y="416" font-size="10" fill="#1f6b4a">✓ 链变长而已，不会「装不下」</text>
  <rect x="722" y="368" width="368" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="722" y="368" width="6" height="66" rx="3" fill="#d99a2b"/><text x="742" y="396" font-size="11" fill="#3a3a3c">必须 &lt; 1，越满探测越长</text><text x="742" y="416" font-size="10" fill="#8a5a12">△ 阈值需保守（本实现均 2/3）</text>

  <!-- 行5 退化行为 -->
  <rect x="30" y="440" width="300" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><text x="48" y="470" font-size="11.5" font-weight="700" fill="#3a3a3c">最坏退化</text><text x="48" y="490" font-size="9.5" fill="#8e8e93">冲突密集时</text>
  <rect x="338" y="440" width="376" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="338" y="440" width="6" height="66" rx="3" fill="#d99a2b"/><text x="358" y="468" font-size="11" fill="#3a3a3c">单桶长链 → O(链长)</text><text x="358" y="488" font-size="10" fill="#8a5a12">△ 局部退化，其它桶不受累</text>
  <rect x="722" y="440" width="368" height="66" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="722" y="440" width="6" height="66" rx="3" fill="#d1544a"/><text x="742" y="468" font-size="11" fill="#3a3a3c">聚集(clustering) → 长探测</text><text x="742" y="488" font-size="10" fill="#8a4038">✗ 一处拥堵拖累邻近全体</text>

  <!-- 结论条 -->
  <rect x="30" y="518" width="1060" height="66" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="52" y="544" font-size="11" font-weight="700" fill="#20375e">选型直觉</text>
  <text x="130" y="544" font-size="10.5" fill="#4a4a4f">链式地址：实现稳、删除易、耐高负载 —— 通用默认（Go map、Java HashMap 桶内即链/树）。</text>
  <text x="130" y="564" font-size="10.5" fill="#4a4a4f">开放寻址：省指针、cache 友好、装填率低时极快 —— 适合读多、负载可控、追求极致局部性的场景。</text>
  <text x="52" y="580" font-size="9.5" fill="#8e8e93">共同点：都靠「负载因子超阈值 → 扩容 rehash」把平均复杂度稳定在 O(1)。</text>
</svg>
