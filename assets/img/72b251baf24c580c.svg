<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="620" viewBox="0 0 1140 620" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#c99a3a"/></marker>
  </defs>
  <rect width="1140" height="620" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">gRPC OutlierDetectionLb（网络型熔断，官方原生具名"熔断"能力）· 按 success_rate / failure_percentage 逐端点判异常，逐次驱逐退避倍数增长</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">配置源自 xDS Cluster.outlier_detection；EndpointState 逐端点跟踪健康与驱逐历史；multiplier 使重复驱逐的退避时间成倍拉长</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">调用结果上报</text>
  <line x1="200" y1="80" x2="224" y2="80" stroke="#d1544a" stroke-width="2" marker-end="url(#aR)"/>
  <text x="230" y="84" font-size="10" fill="#3a3a3c">判定异常 → 驱逐 eject</text>
  <line x1="420" y1="80" x2="444" y2="80" stroke="#2f9e6e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aG)"/>
  <text x="450" y="84" font-size="10" fill="#3a3a3c">驱逐期满 → 取消驱逐 uneject</text>
  <text x="1110" y="84" font-size="10" fill="#a1a1a6" text-anchor="end">gRPC · 官方 gRFC A50 核实</text>
  <line x1="30" y1="96" x2="1110" y2="96" stroke="#e4e7ec" stroke-width="1"/>

  <!-- Panel A: xDS 配置来源 -->
  <rect x="30" y="112" width="290" height="180" rx="13" fill="#fbf3e2" stroke="#ecd6a8" filter="url(#soft)"/>
  <text x="175" y="138" font-size="12" font-weight="700" fill="#8a6417" text-anchor="middle">xDS 配置来源</text>
  <text x="46" y="162" font-size="9.5" fill="#7a5a1a">Cluster.outlier_detection</text>
  <text x="46" y="182" font-size="9.5" fill="#7a5a1a">下发到 OutlierDetectionLb</text>
  <text x="46" y="204" font-size="9.5" fill="#7a5a1a">配置两类判定方式的阈值：</text>
  <rect x="46" y="214" width="238" height="64" rx="8" fill="#ffffff" stroke="#ecd6a8"/>
  <text x="58" y="234" font-size="9" font-weight="700" fill="#8a6417">success_rate</text>
  <text x="58" y="250" font-size="8.5" fill="#7a5a1a">统计离群（低于均值-stdev 因子）</text>
  <text x="58" y="266" font-size="8.5" fill="#7a5a1a">failure_percentage：失败率超阈值即判</text>

  <line x1="320" y1="200" x2="360" y2="200" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>

  <!-- Panel B: EndpointState 池 -->
  <rect x="360" y="112" width="380" height="256" rx="13" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="550" y="138" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="middle">EndpointState · 逐端点健康与驱逐历史</text>

  <rect x="378" y="152" width="344" height="50" rx="9" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="392" y="172" font-size="9.5" font-weight="700" fill="#2f6b4e">端点 1 · 正常</text>
  <text x="392" y="188" font-size="8.5" fill="#3f8a63">call counter：success 高占比 · multiplier=0</text>

  <rect x="378" y="210" width="344" height="50" rx="9" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="392" y="230" font-size="9.5" font-weight="700" fill="#8a4038">端点 2 · 第 1 次驱逐中</text>
  <text x="392" y="246" font-size="8.5" fill="#b06a60">ejection_timestamp=t0 · multiplier=1</text>

  <rect x="378" y="268" width="344" height="50" rx="9" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="392" y="288" font-size="9.5" font-weight="700" fill="#8a4038">端点 3 · 第 2 次驱逐中（重复异常）</text>
  <text x="392" y="304" font-size="8.5" fill="#b06a60">multiplier=2 · 退避时长随之翻倍</text>

  <rect x="378" y="326" width="344" height="34" rx="9" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="392" y="347" font-size="9" fill="#3a4a63">周期性扫描：按 interval 重新评估全部端点</text>

  <line x1="740" y1="200" x2="780" y2="200" stroke="#d1544a" stroke-width="2" marker-end="url(#aR)"/>
  <text x="744" y="192" font-size="8.5" fill="#8a4038">判定异常</text>

  <!-- Panel C: 退避倍数增长 -->
  <rect x="780" y="112" width="330" height="180" rx="13" fill="#eaf1fb" stroke="#c6d9f2" filter="url(#soft)"/>
  <text x="945" y="138" font-size="12" font-weight="700" fill="#20375e" text-anchor="middle">multiplier 驱动的退避时长</text>
  <rect x="798" y="152" width="294" height="58" rx="8" fill="#ffffff" stroke="#c6d9f2"/>
  <text x="812" y="176" font-size="9" fill="#20375e">multiplier 越大，驱逐时长越长</text>
  <text x="812" y="196" font-size="9" fill="#3a4a63">（退避时长随 multiplier 成倍拉长，</text>
  <text x="812" y="210" font-size="8.5" fill="#5a7099">有上限封顶，避免无限增长）</text>
  <text x="798" y="230" font-size="9" fill="#3a4a63">每次被驱逐 multiplier+1；未被驱逐的</text>
  <text x="798" y="248" font-size="9" fill="#3a4a63">评估周期 multiplier-1（有下限 0）</text>
  <text x="798" y="270" font-size="8.5" fill="#5a7099">→ 反复抖动的端点驱逐期越拉越长</text>

  <!-- Panel D: 时间轴 -->
  <rect x="30" y="384" width="1080" height="200" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="52" y="410" font-size="13" font-weight="700" fill="#1d1d1f">驱逐 → 退避 → 取消驱逐 时间轴（以端点 2 为例，退避随重复异常成倍增长）</text>

  <line x1="70" y1="490" x2="1060" y2="490" stroke="#d7d7dd" stroke-width="1.2"/>
  <text x="1058" y="506" font-size="9" fill="#a1a1a6" text-anchor="end">时间 →</text>

  <rect x="80" y="448" width="160" height="34" rx="8" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="160" y="470" font-size="9.5" font-weight="700" fill="#2f6b4e" text-anchor="middle">正常参与负载均衡</text>

  <rect x="250" y="448" width="200" height="34" rx="8" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="350" y="470" font-size="9.5" font-weight="700" fill="#8a4038" text-anchor="middle">第 1 次驱逐 · multiplier=1</text>

  <rect x="460" y="448" width="120" height="34" rx="8" fill="#eaf6f0" stroke="#bfe3d1" stroke-dasharray="5 3"/>
  <text x="520" y="470" font-size="9" font-weight="700" fill="#2f6b4e" text-anchor="middle">恢复参与</text>

  <rect x="590" y="448" width="280" height="34" rx="8" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="730" y="470" font-size="9.5" font-weight="700" fill="#8a4038" text-anchor="middle">再次异常 → 第 2 次驱逐 · multiplier=2（时长更长）</text>

  <rect x="880" y="448" width="160" height="34" rx="8" fill="#eaf6f0" stroke="#bfe3d1" stroke-dasharray="5 3"/>
  <text x="960" y="470" font-size="9.5" font-weight="700" fill="#2f6b4e" text-anchor="middle">恢复参与</text>

  <line x1="250" y1="482" x2="250" y2="500" stroke="#d1544a" stroke-width="1.4" stroke-dasharray="3 2"/>
  <line x1="460" y1="482" x2="460" y2="500" stroke="#2f9e6e" stroke-width="1.4" stroke-dasharray="3 2"/>
  <line x1="590" y1="482" x2="590" y2="500" stroke="#d1544a" stroke-width="1.4" stroke-dasharray="3 2"/>
  <line x1="880" y1="482" x2="880" y2="500" stroke="#2f9e6e" stroke-width="1.4" stroke-dasharray="3 2"/>

  <text x="52" y="538" font-size="9.5" fill="#4a4a4f">这是 gRPC 官方原生具名"熔断"（circuit breaking）能力，来自 xDS 生态；判定依据始终是<tspan font-weight="700" fill="#8a4038">远端调用结果统计</tspan>（success_rate / failure_percentage）。</text>
  <text x="52" y="558" font-size="9.5" fill="#4a4a4f">与 nginx 被动健康检查（B1）同属<tspan font-weight="700" fill="#1a6d70">网络型熔断</tspan>，但 gRPC 用显式 EndpointState + multiplier 退避，比 nginx 的隐式时间窗口更精细。</text>
  <text x="52" y="576" font-size="9" fill="#8a97ab">与 StarRocks 资源型熔断（触发=资源超限而非网络故障，见 B3）是两类不同触发机制，对比见 CMP。</text>
</svg>
