<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
  </defs>
  <rect width="1120" height="700" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">GD3 · 最大容量：双指针从两端夹逼，每一步都「移动较短的一侧」</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">容量 = min(ht[i], ht[j]) × (j − i)，受短板限制；移长板宽度必减、高度封顶不变，只可能更差，故只移短板</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">指针 i / j（挡板）</text>
  <rect x="190" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="208" y="82" font-size="10.5" fill="#3a3a3c">当前盛水面积</text>
  <rect x="320" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="338" y="82" font-size="10.5" fill="#3a3a3c">迄今最大容量</text>

  <!-- ===== ① 容器与初始状态 ===== -->
  <text x="30" y="118" font-size="12" font-weight="700" fill="#8a5a12">① 初始状态 i=0, j=4：ht = [4, 8, 5, 2, 6]，容量 = min(4,6)×4 = 16</text>

  <!-- 基线 -->
  <line x1="80" y1="340" x2="600" y2="340" stroke="#c7c7cc" stroke-width="1.5"/>
  <!-- 水面 (初始 min=4 => level y=260) -->
  <rect x="120" y="260" width="440" height="80" fill="#f5e2bb" fill-opacity="0.7" stroke="#d99a2b" stroke-dasharray="4 3"/>
  <!-- 挡板 (bars) -->
  <rect x="98" y="260" width="44" height="80" rx="3" fill="#e8ecf1" stroke="#9a9aa0"/>
  <rect x="208" y="180" width="44" height="160" rx="3" fill="#e8ecf1" stroke="#9a9aa0"/>
  <rect x="318" y="240" width="44" height="100" rx="3" fill="#e8ecf1" stroke="#9a9aa0"/>
  <rect x="428" y="300" width="44" height="40" rx="3" fill="#e8ecf1" stroke="#9a9aa0"/>
  <rect x="538" y="220" width="44" height="120" rx="3" fill="#e8ecf1" stroke="#9a9aa0"/>
  <!-- 高度标注 -->
  <g font-size="11" text-anchor="middle" fill="#4a4a4f">
    <text x="120" y="254">4</text><text x="230" y="174">8</text><text x="340" y="234">5</text><text x="450" y="294">2</text><text x="560" y="214">6</text>
  </g>
  <!-- 索引 -->
  <g font-size="10" text-anchor="middle" fill="#a1a1a6">
    <text x="120" y="356">0</text><text x="230" y="356">1</text><text x="340" y="356">2</text><text x="450" y="356">3</text><text x="560" y="356">4</text>
  </g>
  <!-- i / j 指针 -->
  <rect x="98" y="256" width="44" height="88" rx="3" fill="none" stroke="#4a7fd0" stroke-width="2.4"/>
  <text x="120" y="380" font-size="12" font-weight="700" fill="#20375e" text-anchor="middle">i（矮 → 移它）</text>
  <rect x="538" y="216" width="44" height="128" rx="3" fill="none" stroke="#4a7fd0" stroke-width="2.4"/>
  <text x="560" y="380" font-size="12" font-weight="700" fill="#20375e" text-anchor="middle">j</text>
  <!-- 面积注 -->
  <text x="340" y="304" font-size="12" font-weight="700" fill="#8a5a12" text-anchor="middle">水位受短板 4 封顶</text>

  <!-- ===== ② 步进表 ===== -->
  <text x="640" y="118" font-size="12" font-weight="700" fill="#8a5a12">② 每步：算容量 → 移短板 → 记最大</text>
  <rect x="640" y="132" width="450" height="230" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <!-- 表头 -->
  <text x="660" y="156" font-size="10.5" font-weight="700" fill="#6e6e73">步</text>
  <text x="700" y="156" font-size="10.5" font-weight="700" fill="#6e6e73">i(ht)</text>
  <text x="770" y="156" font-size="10.5" font-weight="700" fill="#6e6e73">j(ht)</text>
  <text x="850" y="156" font-size="10.5" font-weight="700" fill="#6e6e73">min×宽</text>
  <text x="945" y="156" font-size="10.5" font-weight="700" fill="#6e6e73">容量</text>
  <text x="1010" y="156" font-size="10.5" font-weight="700" fill="#6e6e73">动作</text>
  <line x1="656" y1="164" x2="1074" y2="164" stroke="#e4e7ec"/>
  <g font-size="10.5" fill="#4a4a4f">
    <text x="660" y="186">1</text><text x="700" y="186">0(4)</text><text x="770" y="186">4(6)</text><text x="850" y="186">4×4</text><text x="945" y="186">16</text><text x="1010" y="186" fill="#20375e">i++</text>
    <text x="660" y="212">2</text><text x="700" y="212">1(8)</text><text x="770" y="212">4(6)</text><text x="850" y="212">6×3</text><text x="945" y="212" font-weight="700" fill="#1f6b47">18 ★</text><text x="1010" y="212" fill="#20375e">j--</text>
    <text x="660" y="238">3</text><text x="700" y="238">1(8)</text><text x="770" y="238">3(2)</text><text x="850" y="238">2×2</text><text x="945" y="238">4</text><text x="1010" y="238" fill="#20375e">j--</text>
    <text x="660" y="264">4</text><text x="700" y="264">1(8)</text><text x="770" y="264">2(5)</text><text x="850" y="264">5×1</text><text x="945" y="264">5</text><text x="1010" y="264" fill="#20375e">j--</text>
    <text x="660" y="290">5</text><text x="700" y="290">1</text><text x="770" y="290">1</text><text x="850" y="290" fill="#a1a1a6">i≥j</text><text x="945" y="290" fill="#a1a1a6">停</text><text x="1010" y="290" fill="#a1a1a6">—</text>
  </g>
  <line x1="656" y1="302" x2="1074" y2="302" stroke="#e4e7ec"/>
  <text x="660" y="326" font-size="11" font-weight="700" fill="#1f6b47">结果 res = 18（步2，i=1 j=4）</text>
  <text x="660" y="348" font-size="10" fill="#6e6e73">整趟只从两端向内扫一遍，O(n)、常数空间</text>

  <!-- ===== ③ 为何只移短板 ===== -->
  <text x="30" y="424" font-size="12" font-weight="700" fill="#1f6b47">③ 为何移短板：唯一「有可能变好」的方向，移长板必然更差 —— 可安全丢弃</text>

  <!-- 移短板 -->
  <rect x="40" y="440" width="510" height="150" rx="14" fill="#f2faf6" stroke="#a8ddc3" filter="url(#soft)"/>
  <text x="62" y="466" font-size="12.5" font-weight="700" fill="#1f6b47">移短板：宽度 −1，但高度上限可能抬升</text>
  <text x="62" y="490" font-size="10.5" fill="#2a5a43">容量被短板 min 封顶；短板留着，它和任何对手配对都超不过当前值。</text>
  <text x="62" y="509" font-size="10.5" fill="#2a5a43">丢掉短板换一根新板，min 有机会上升 → 面积可能变大。</text>
  <text x="62" y="533" font-size="10.5" fill="#2a5a43">所以短板对应的所有「更窄」组合可一次性排除，不会漏最优。</text>
  <rect x="62" y="548" width="466" height="30" rx="7" fill="#e6f4ec" stroke="#a8ddc3"/>
  <text x="74" y="568" font-size="10" fill="#1f6b47">本例步1移矮板 i(4)，min 由 4 升到 6，容量 16 → 18，正是最优。</text>

  <!-- 移长板 -->
  <rect x="570" y="440" width="510" height="150" rx="14" fill="#fff6f5" stroke="#e8a79f" filter="url(#soft)"/>
  <text x="592" y="466" font-size="12.5" font-weight="700" fill="#8a4038">移长板：宽度 −1，高度上限仍被短板压死</text>
  <text x="592" y="490" font-size="10.5" fill="#8a4038">min 仍等于（或低于）原短板，不可能上升；</text>
  <text x="592" y="509" font-size="10.5" fill="#8a4038">而 (j − i) 却减小 —— 面积 min × 宽 只会 ≤ 当前值。</text>
  <text x="592" y="533" font-size="10.5" fill="#8a4038">这一步「不可能变好」，是纯亏损方向，直接排除。</text>
  <rect x="592" y="548" width="466" height="30" rx="7" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="604" y="568" font-size="10" fill="#8a4038">正因两端各只有一个「可能更优」方向，双指针才不必回头、O(n) 扫完全部有效组合。</text>

  <!-- 底部不变式 -->
  <rect x="40" y="606" width="1040" height="66" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="58" y="630" font-size="11" font-weight="700" fill="#8a5a12">贪心不变式</text>
  <text x="150" y="630" font-size="10.5" fill="#4a4a4f">被丢弃的短板，其与「更窄区间」内任意板配对的容量都不超过当前已算值 —— 故排除它绝不丢失最优解。</text>
  <text x="58" y="654" font-size="11" font-weight="700" fill="#1f6b47">复杂度</text>
  <text x="150" y="654" font-size="10.5" fill="#4a4a4f">每步指针至少内移一格，i、j 相遇即停，共 n−1 步：时间 O(n)、空间 O(1)，远优于枚举全部 O(n²) 组合。</text>
</svg>
