<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="660" viewBox="0 0 1140 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1140" height="660" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">etcd Lease vs ZooKeeper Session · 不是两种不同的思想，是同一个「TTL 续约、超时判死」思想的两种实现外壳</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">分歧在存活判定的载体是否显式对象、过期检查是逐一计时还是分桶批量、故障后状态能不能恢复——下表按 4 个维度横向对照</text>

  <!-- 列头 -->
  <rect x="30" y="72" width="196" height="42" rx="9" fill="#eef0f3" stroke="#e4e7ec"/>
  <text x="128" y="98" font-size="12" font-weight="700" fill="#4a4a4f" text-anchor="middle">对比维度</text>
  <rect x="234" y="72" width="428" height="42" rx="9" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="448" y="98" font-size="13" font-weight="800" fill="#20375e" text-anchor="middle">etcd Lease</text>
  <rect x="670" y="72" width="440" height="42" rx="9" fill="#fbeee2" stroke="#ecc6a8"/>
  <text x="890" y="98" font-size="13" font-weight="800" fill="#9a5f1c" text-anchor="middle">ZooKeeper Session</text>

  <!-- 行1 存活判定单元 -->
  <rect x="30" y="122" width="196" height="102" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="152" font-size="11.5" font-weight="700" fill="#1d1d1f">① 存活判定单元</text>
  <text x="46" y="172" font-size="9" fill="#8a97ab">谁是承载"活着"</text>
  <text x="46" y="186" font-size="9" fill="#8a97ab">这件事的对象</text>

  <rect x="234" y="122" width="428" height="102" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="250" y="148" font-size="10" font-weight="700" fill="#20375e">显式 Lease 对象</text>
  <text x="250" y="168" font-size="9.5" fill="#4a4a4f">Lessor 接口管理，Grant 建、Renew 续、</text>
  <text x="250" y="184" font-size="9.5" fill="#4a4a4f">Revoke 撤；key 显式绑定到 leaseID 上，</text>
  <text x="250" y="200" font-size="9.5" fill="#4a4a4f">一个 lease 可绑多个 key。</text>

  <rect x="670" y="122" width="440" height="102" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="686" y="148" font-size="10" font-weight="700" fill="#9a5f1c">隐式·绑定连接本身</text>
  <text x="686" y="168" font-size="9.5" fill="#4a4a4f">无显式租约对象；SessionTrackerImpl 记录</text>
  <text x="686" y="184" font-size="9.5" fill="#4a4a4f">sessionId 与协商 timeout，"活着"就是这条</text>
  <text x="686" y="200" font-size="9.5" fill="#4a4a4f">连接的生命周期本身。</text>

  <!-- 行2 过期检查方式 -->
  <rect x="30" y="230" width="196" height="112" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="258" font-size="11.5" font-weight="700" fill="#1d1d1f">② 过期检查方式</text>
  <text x="46" y="278" font-size="9" fill="#8a97ab">单独计时器，还是</text>
  <text x="46" y="292" font-size="9" fill="#8a97ab">分桶批量检查</text>

  <rect x="234" y="230" width="428" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="250" y="256" font-size="10" font-weight="700" fill="#20375e">周期性扫描 + 撤销 channel</text>
  <text x="250" y="276" font-size="9.5" fill="#4a4a4f">后台循环周期性检查到期未续的租约，</text>
  <text x="250" y="292" font-size="9.5" fill="#4a4a4f">检出结果推入撤销 channel 异步处理——</text>
  <text x="250" y="308" font-size="9.5" fill="#4a4a4f">"发现"与"清理"两步解耦。</text>
  <text x="250" y="326" font-size="9" fill="#8a97ab">检查粒度是"租约"本身</text>

  <rect x="670" y="230" width="440" height="112" rx="9" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="686" y="256" font-size="10" font-weight="700" fill="#8a6417">分桶批量 · roundToNextInterval</text>
  <text x="686" y="276" font-size="9.5" fill="#7a5a1a">过期时刻向上对齐到固定间隔的桶；续期即</text>
  <text x="686" y="292" font-size="9.5" fill="#7a5a1a">移到后面的桶。到点整桶取出全部未续期</text>
  <text x="686" y="308" font-size="9.5" fill="#7a5a1a">会话一次性批量检查，而非逐一计时判定。</text>
  <text x="686" y="326" font-size="9" fill="#9a7a3a">检查粒度是"桶"，不是单个会话</text>

  <!-- 行3 故障恢复后状态还在不在 -->
  <rect x="30" y="348" width="196" height="112" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="376" font-size="11.5" font-weight="700" fill="#1d1d1f">③ 故障恢复后</text>
  <text x="46" y="392" font-size="9" fill="#8a97ab">状态还在不在</text>
  <text x="46" y="410" font-size="9" fill="#8a97ab">（leader 换届/重启）</text>

  <rect x="234" y="348" width="428" height="112" rx="9" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="250" y="374" font-size="10" font-weight="700" fill="#8a6417">Checkpointer 持久化剩余 TTL</text>
  <text x="250" y="394" font-size="9.5" fill="#7a5a1a">周期性把每个租约的剩余 TTL 写进共识</text>
  <text x="250" y="410" font-size="9.5" fill="#7a5a1a">日志；leader 换届或进程重启后，新状态</text>
  <text x="250" y="426" font-size="9.5" fill="#7a5a1a">可从日志恢复准确剩余 TTL，不从头计时。</text>
  <text x="250" y="444" font-size="9" fill="#9a7a3a">不是纯内存计时器</text>

  <rect x="670" y="348" width="440" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="686" y="374" font-size="10" font-weight="700" fill="#9a5f1c">过期裁决统一由 Leader 经 ZAB 广播</text>
  <text x="686" y="394" font-size="9.5" fill="#4a4a4f">closeSession 走 ZAB 全序广播，各节点在</text>
  <text x="686" y="410" font-size="9.5" fill="#4a4a4f">同一点一致回收——临时节点存在性本身是</text>
  <text x="686" y="426" font-size="9.5" fill="#4a4a4f">强一致的，不会出现副本间不一致。</text>
  <text x="686" y="444" font-size="9" fill="#8a97ab">依赖的是共识广播，而非显式 checkpoint</text>

  <!-- 行4 典型使用场景 -->
  <rect x="30" y="466" width="196" height="96" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="494" font-size="11.5" font-weight="700" fill="#1d1d1f">④ 典型使用场景</text>
  <text x="46" y="514" font-size="9" fill="#8a97ab">服务注册/分布式锁/</text>
  <text x="46" y="528" font-size="9" fill="#8a97ab">选主里怎么落地</text>

  <rect x="234" y="466" width="428" height="96" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="250" y="492" font-size="10" font-weight="700" fill="#20375e">key 挂 lease · 服务发现最常见形态</text>
  <text x="250" y="512" font-size="9.5" fill="#4a4a4f">节点把自己的注册信息（key）绑定到租约，</text>
  <text x="250" y="528" font-size="9.5" fill="#4a4a4f">持续 keepalive 即在线；停止续租则 key</text>
  <text x="250" y="544" font-size="9.5" fill="#4a4a4f">随 Revoke 级联删除，注册信息自动消失。</text>

  <rect x="670" y="466" width="440" height="96" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="686" y="492" font-size="10" font-weight="700" fill="#9a5f1c">临时节点 · 分布式锁/选主的经典载体</text>
  <text x="686" y="512" font-size="9.5" fill="#4a4a4f">节点创建 ephemeral node 代表在线/持锁；</text>
  <text x="686" y="528" font-size="9.5" fill="#4a4a4f">会话在则节点在，会话过期节点随之被移除，</text>
  <text x="686" y="544" font-size="9.5" fill="#4a4a4f">其他节点通过 watch 感知变化。</text>

  <!-- 底部一句话总结横幅 -->
  <rect x="30" y="578" width="1080" height="66" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="602" font-size="10.5" font-weight="700" fill="#1d1d1f">一句话</text>
  <text x="110" y="602" font-size="10" fill="#4a4a4f">两者不是"哪个更先进"的竞争关系，而是同一个 <tspan font-weight="700" fill="#1d1d1f">TTL 续约思想</tspan> 的两种实现外壳：<tspan font-weight="700" fill="#20375e">etcd</tspan> 把它做成显式对象（Lease + Checkpointer），<tspan font-weight="700" fill="#9a5f1c">ZooKeeper</tspan> 把它做成隐式连接状态（Session + 分桶批量）。</text>
  <text x="110" y="622" font-size="9" fill="#8a97ab">对上层的服务注册/分布式锁/选主而言，两者提供的都是同一个信号——"超时未续 = 判定死亡、清理关联状态"。</text>
</svg>
