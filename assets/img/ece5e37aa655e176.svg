<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="670" viewBox="0 0 1150 670" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d9772f"/></marker>
    <marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#a1a1a6"/></marker>
  </defs>
  <rect width="1150" height="670" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">H2 · InnoDB Buffer Pool 写回 · midpoint insertion strategy 防全表扫描冲刷热数据；脏页刷盘异步、只受 redo log 先落盘的 WAL 铁律约束</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">写入立即体现在内存页；「新值何时可见」几乎等于「事务何时提交」，真正滞后的是磁盘落地，且滞后与提交解耦</text>

  <line x1="30" y1="80" x2="54" y2="80" stroke="#d9772f" stroke-width="2" marker-end="url(#aO)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">LRU 链表 · 中点插入与晋升/滑落</text>
  <line x1="280" y1="80" x2="304" y2="80" stroke="#d9772f" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aO)"/>
  <text x="310" y="84" font-size="10" fill="#3a3a3c">写路径 · 提交只等 redo log</text>
  <line x1="530" y1="80" x2="554" y2="80" stroke="#a1a1a6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aN)"/>
  <text x="560" y="84" font-size="10" fill="#3a3a3c">脏页刷盘 · 异步、与提交解耦</text>
  <text x="1120" y="86" font-size="9.5" fill="#a1a1a6" text-anchor="end">InnoDB Buffer Pool · 官方术语已核实</text>
  <line x1="30" y1="98" x2="1120" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- Panel A: midpoint insertion LRU -->
  <rect x="30" y="110" width="1090" height="256" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="136" font-size="13" font-weight="700" fill="#1d1d1f">① LRU 链表的 midpoint insertion strategy（官方术语）</text>
  <rect x="850" y="118" width="240" height="28" rx="14" fill="#d9772f"/>
  <text x="970" y="137" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">防全表扫描冲刷热数据</text>
  <line x1="46" y1="150" x2="1104" y2="150" stroke="#e4e7ec" stroke-width="1"/>

  <!-- LRU 链表可视化：head - midpoint - tail -->
  <text x="50" y="176" font-size="9.5" fill="#8a97ab">链表头（最热）→ 中点插入处 → 链表尾（最冷，先被淘汰）</text>

  <!-- young sublist -->
  <rect x="50" y="188" width="470" height="78" rx="10" fill="#fbeee2" stroke="#ecc6a8"/>
  <text x="66" y="210" font-size="10.5" font-weight="700" fill="#9a5f1c">young sublist · 已验证「值得留」的热页</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="66" y="220" width="60" height="30" rx="6" fill="#d9772f"/><text x="96" y="239" fill="#fff">热页</text>
    <rect x="132" y="220" width="60" height="30" rx="6" fill="#d9772f"/><text x="162" y="239" fill="#fff">热页</text>
    <rect x="198" y="220" width="60" height="30" rx="6" fill="#d9772f"/><text x="228" y="239" fill="#fff">热页</text>
    <rect x="264" y="220" width="60" height="30" rx="6" fill="#d9772f"/><text x="294" y="239" fill="#fff">热页</text>
    <rect x="330" y="220" width="60" height="30" rx="6" fill="#ecc6a8" stroke="#d9772f" stroke-dasharray="3 2"/><text x="360" y="239" fill="#9a5f1c">晋升而来</text>
  </g>
  <text x="66" y="258" font-size="8.5" fill="#b0854a">在 old sublist 存活期内被再次访问 → 晋升进入这里</text>

  <!-- midpoint marker -->
  <line x1="530" y1="188" x2="530" y2="360" stroke="#c4562f" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="530" y="180" font-size="9" font-weight="700" fill="#9a5f1c" text-anchor="middle">中点插入处</text>

  <!-- old sublist -->
  <rect x="560" y="188" width="500" height="78" rx="10" fill="#fbeee2" stroke="#ecc6a8"/>
  <text x="576" y="210" font-size="10.5" font-weight="700" fill="#9a5f1c">old sublist · 新读入页先在此观察</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="576" y="220" width="70" height="30" rx="6" fill="#ffffff" stroke="#ecc6a8" stroke-dasharray="3 2"/><text x="611" y="239" fill="#9a5f1c">新页 · 观察中</text>
    <rect x="654" y="220" width="70" height="30" rx="6" fill="#ffffff" stroke="#ecc6a8" stroke-dasharray="3 2"/><text x="689" y="239" fill="#9a5f1c">新页 · 观察中</text>
    <rect x="732" y="220" width="70" height="30" rx="6" fill="#ffffff" stroke="#ecc6a8" stroke-dasharray="3 2"/><text x="767" y="239" fill="#9a5f1c">扫描页</text>
    <rect x="810" y="220" width="70" height="30" rx="6" fill="#ffffff" stroke="#ecc6a8" stroke-dasharray="3 2"/><text x="845" y="239" fill="#9a5f1c">扫描页</text>
    <rect x="888" y="220" width="70" height="30" rx="6" fill="#ffffff" stroke="#ecc6a8" stroke-dasharray="3 2"/><text x="923" y="239" fill="#9a5f1c">扫描页</text>
  </g>
  <text x="576" y="258" font-size="8.5" fill="#b0854a">一次性全表扫描涌入的页绝大多数只停留在这里，来不及晋升即被淘汰</text>

  <!-- 淘汰方向 -->
  <line x1="1060" y1="227" x2="1090" y2="227" stroke="#d9772f" stroke-width="2" marker-end="url(#aO)"/>
  <text x="1075" y="215" font-size="8.5" fill="#9a5f1c" text-anchor="middle">尾部滑落</text>
  <text x="1075" y="252" font-size="8.5" fill="#9a5f1c" text-anchor="middle">淘汰出池</text>

  <!-- 两条分支说明 -->
  <rect x="50" y="280" width="470" height="72" rx="10" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="66" y="302" font-size="10" font-weight="700" fill="#1d1d1f">晋升条件</text>
  <text x="66" y="322" font-size="9.5" fill="#4a4a4f">页在 old sublist 存活期内被再次访问，</text>
  <text x="66" y="340" font-size="9.5" fill="#4a4a4f">才被移动 / 晋升进入 young sublist。</text>

  <rect x="560" y="280" width="500" height="72" rx="10" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="576" y="302" font-size="10" font-weight="700" fill="#1d1d1f">这样防住了什么</text>
  <text x="576" y="322" font-size="9.5" fill="#4a4a4f">一次性 SELECT 大范围扫描 / mysqldump 涌入的页只在 old sublist 短暂停留，</text>
  <text x="576" y="340" font-size="9.5" fill="#4a4a4f">来不及晋升就被清出，young sublist 里的真正热数据几乎不受影响。</text>

  <!-- Panel B: 写路径与 WAL 铁律 -->
  <rect x="30" y="382" width="1090" height="258" rx="14" fill="#fbeee2" stroke="#ecc6a8" filter="url(#soft)"/>
  <text x="50" y="408" font-size="13" font-weight="700" fill="#9a5f1c">② 写路径 · 内存立即改，脏页刷盘异步、只受 WAL 铁律约束</text>
  <text x="50" y="426" font-size="9.5" fill="#b0854a">脏页写回是异步的、独立于事务提交——提交只有一条硬性要求：redo log 必须先持久化落盘</text>
  <line x1="46" y1="438" x2="1104" y2="438" stroke="#ecc6a8" stroke-width="1"/>

  <rect x="50" y="454" width="220" height="86" rx="10" fill="#ffffff" stroke="#ecc6a8"/>
  <text x="160" y="478" font-size="10.5" font-weight="700" fill="#9a5f1c" text-anchor="middle">① 事务写入</text>
  <text x="160" y="498" font-size="9" fill="#b0854a" text-anchor="middle">改动立即体现在</text>
  <text x="160" y="514" font-size="9" fill="#b0854a" text-anchor="middle">Buffer Pool 内存页</text>
  <text x="160" y="530" font-size="8.5" fill="#8a97ab" text-anchor="middle">该页标记为「脏页」</text>

  <rect x="304" y="454" width="240" height="86" rx="10" fill="#ffffff" stroke="#ecc6a8"/>
  <text x="424" y="478" font-size="10.5" font-weight="700" fill="#9a5f1c" text-anchor="middle">② redo log 落盘（WAL 铁律）</text>
  <text x="424" y="498" font-size="9" fill="#b0854a" text-anchor="middle">事务提交的唯一硬性前提：</text>
  <text x="424" y="514" font-size="9" fill="#b0854a" text-anchor="middle">redo log 必须先持久化</text>
  <text x="424" y="530" font-size="8.5" fill="#8a97ab" text-anchor="middle">保证已提交数据不因宕机丢失</text>

  <rect x="578" y="454" width="240" height="86" rx="10" fill="#ffffff" stroke="#ecc6a8"/>
  <text x="698" y="478" font-size="10.5" font-weight="700" fill="#2f6b4e" text-anchor="middle">③ 事务提交（commit）</text>
  <text x="698" y="498" font-size="9" fill="#3f8a63" text-anchor="middle">仅依赖 ② 完成</text>
  <text x="698" y="514" font-size="9" fill="#3f8a63" text-anchor="middle">不等待脏页刷盘</text>
  <text x="698" y="530" font-size="8.5" fill="#8a97ab" text-anchor="middle">「新值可见」≈「事务提交」同一时刻</text>

  <rect x="852" y="454" width="238" height="86" rx="10" fill="#ffffff" stroke="#ecc6a8" stroke-dasharray="4 3"/>
  <text x="971" y="478" font-size="10.5" font-weight="700" fill="#9a5f1c" text-anchor="middle">④ 脏页写回（晚刷）</text>
  <text x="971" y="498" font-size="9" fill="#b0854a" text-anchor="middle">异步、独立于提交时机</text>
  <text x="971" y="514" font-size="9" fill="#b0854a" text-anchor="middle">磁盘数据文件此时才更新</text>
  <text x="971" y="530" font-size="8.5" fill="#8a97ab" text-anchor="middle">真正滞后的是「磁盘看见新值」</text>

  <line x1="270" y1="497" x2="302" y2="497" stroke="#d9772f" stroke-width="2" marker-end="url(#aO)"/>
  <line x1="544" y1="497" x2="576" y2="497" stroke="#d9772f" stroke-width="2" marker-end="url(#aO)"/>
  <line x1="818" y1="497" x2="850" y2="497" stroke="#a1a1a6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aN)"/>
  <text x="834" y="486" font-size="8" fill="#8a97ab" text-anchor="middle">解耦</text>

  <rect x="50" y="558" width="1040" height="60" rx="10" fill="#ffffff" stroke="#ecc6a8"/>
  <text x="66" y="580" font-size="9.5" fill="#4a4a4f">数据落到最终存储（磁盘数据文件）的时间点，晚于「新值对读可见」的时间点——两者之间的窗口，</text>
  <text x="66" y="598" font-size="9.5" fill="#4a4a4f">只由 redo log 是否已落盘这一条 WAL 铁律兜底崩溃恢复正确性，脏页本身刷盘早晚不影响缓存内新值的可见性。</text>
</svg>
