<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1120" height="600" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">线性查找 · 指针 i 从头逐格比对，命中即返回下标，扫到底则 -1</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">不依赖任何前提（可无序、可链表）；代价是最坏要看遍全部 n 个元素。示例 nums=[4,2,7,1,9,5]</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">当前指针 i</text>
  <rect x="160" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="178" y="82" font-size="10.5" fill="#3a3a3c">待比对数据</text>
  <rect x="290" y="72" width="12" height="12" rx="2" fill="#e9eaed"/><text x="308" y="82" font-size="10.5" fill="#3a3a3c">已比对（跳过）</text>
  <rect x="420" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="438" y="82" font-size="10.5" fill="#3a3a3c">命中 target</text>

  <!-- ① 命中扫描：target = 9 -->
  <text x="30" y="112" font-size="12" font-weight="700" fill="#8a5a12">① 命中扫描　target = 9　（每行 = i 前进一格的一张快照）</text>
  <text x="612" y="112" font-size="10" fill="#6e6e73">下标：</text>
  <g font-size="9" fill="#8e8e93" text-anchor="middle">
    <text x="177" y="112">[0]</text><text x="235" y="112">[1]</text><text x="293" y="112">[2]</text><text x="351" y="112">[3]</text><text x="409" y="112">[4]</text><text x="467" y="112">[5]</text>
  </g>

  <!-- 行 i=0 -->
  <text x="60" y="141" font-size="11" font-weight="700" fill="#20375e">i = 0</text>
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="126" width="54" height="28" rx="5" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.8"/><text x="177" y="145" fill="#20375e">4</text>
    <rect x="208" y="126" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="235" y="145" fill="#5a4a2a">2</text>
    <rect x="266" y="126" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="293" y="145" fill="#5a4a2a">7</text>
    <rect x="324" y="126" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="351" y="145" fill="#5a4a2a">1</text>
    <rect x="382" y="126" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="409" y="145" fill="#5a4a2a">9</text>
    <rect x="440" y="126" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="467" y="145" fill="#5a4a2a">5</text>
  </g>
  <path d="M172 116 L182 116 L177 124 z" fill="#4a7fd0"/>
  <text x="520" y="145" font-size="10.5" fill="#6e6e73">nums[0]=4 ≠ 9　→ i++</text>

  <!-- 行 i=1 -->
  <text x="60" y="187" font-size="11" font-weight="700" fill="#20375e">i = 1</text>
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="172" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="177" y="191" fill="#a1a1a6">4</text>
    <rect x="208" y="172" width="54" height="28" rx="5" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.8"/><text x="235" y="191" fill="#20375e">2</text>
    <rect x="266" y="172" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="293" y="191" fill="#5a4a2a">7</text>
    <rect x="324" y="172" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="351" y="191" fill="#5a4a2a">1</text>
    <rect x="382" y="172" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="409" y="191" fill="#5a4a2a">9</text>
    <rect x="440" y="172" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="467" y="191" fill="#5a4a2a">5</text>
  </g>
  <path d="M230 162 L240 162 L235 170 z" fill="#4a7fd0"/>
  <text x="520" y="191" font-size="10.5" fill="#6e6e73">nums[1]=2 ≠ 9　→ i++</text>

  <!-- 行 i=2 -->
  <text x="60" y="233" font-size="11" font-weight="700" fill="#20375e">i = 2</text>
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="218" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="177" y="237" fill="#a1a1a6">4</text>
    <rect x="208" y="218" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="235" y="237" fill="#a1a1a6">2</text>
    <rect x="266" y="218" width="54" height="28" rx="5" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.8"/><text x="293" y="237" fill="#20375e">7</text>
    <rect x="324" y="218" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="351" y="237" fill="#5a4a2a">1</text>
    <rect x="382" y="218" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="409" y="237" fill="#5a4a2a">9</text>
    <rect x="440" y="218" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="467" y="237" fill="#5a4a2a">5</text>
  </g>
  <path d="M288 208 L298 208 L293 216 z" fill="#4a7fd0"/>
  <text x="520" y="237" font-size="10.5" fill="#6e6e73">nums[2]=7 ≠ 9　→ i++</text>

  <!-- 行 i=3 -->
  <text x="60" y="279" font-size="11" font-weight="700" fill="#20375e">i = 3</text>
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="264" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="177" y="283" fill="#a1a1a6">4</text>
    <rect x="208" y="264" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="235" y="283" fill="#a1a1a6">2</text>
    <rect x="266" y="264" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="293" y="283" fill="#a1a1a6">7</text>
    <rect x="324" y="264" width="54" height="28" rx="5" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.8"/><text x="351" y="283" fill="#20375e">1</text>
    <rect x="382" y="264" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="409" y="283" fill="#5a4a2a">9</text>
    <rect x="440" y="264" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="467" y="283" fill="#5a4a2a">5</text>
  </g>
  <path d="M346 254 L356 254 L351 262 z" fill="#4a7fd0"/>
  <text x="520" y="283" font-size="10.5" fill="#6e6e73">nums[3]=1 ≠ 9　→ i++</text>

  <!-- 行 i=4 命中 -->
  <text x="60" y="325" font-size="11" font-weight="700" fill="#1f6b4a">i = 4</text>
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="310" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="177" y="329" fill="#a1a1a6">4</text>
    <rect x="208" y="310" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="235" y="329" fill="#a1a1a6">2</text>
    <rect x="266" y="310" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="293" y="329" fill="#a1a1a6">7</text>
    <rect x="324" y="310" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="351" y="329" fill="#a1a1a6">1</text>
    <rect x="382" y="310" width="54" height="28" rx="5" fill="#e7f5ee" stroke="#2f9e6e" stroke-width="1.8"/><text x="409" y="329" fill="#1f6b4a" font-weight="700">9</text>
    <rect x="440" y="310" width="54" height="28" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="467" y="329" fill="#5a4a2a">5</text>
  </g>
  <path d="M404 300 L414 300 L409 308 z" fill="#2f9e6e"/>
  <text x="520" y="329" font-size="10.5" fill="#1f6b4a" font-weight="700">nums[4]=9 == 9　→ 命中！return 4</text>

  <!-- ② 未命中反例：target = 8 -->
  <rect x="30" y="360" width="1060" height="140" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="386" font-size="12" font-weight="700" fill="#8a4038">② 未命中反例　target = 8　（数组中不存在）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="400" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="177" y="419" fill="#a1a1a6">4</text>
    <rect x="208" y="400" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="235" y="419" fill="#a1a1a6">2</text>
    <rect x="266" y="400" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="293" y="419" fill="#a1a1a6">7</text>
    <rect x="324" y="400" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="351" y="419" fill="#a1a1a6">1</text>
    <rect x="382" y="400" width="54" height="28" rx="5" fill="#e9eaed" stroke="#d7d7dd"/><text x="409" y="419" fill="#a1a1a6">9</text>
    <rect x="440" y="400" width="54" height="28" rx="5" fill="#fbe6e3" stroke="#e8a79f" stroke-width="1.6"/><text x="467" y="419" fill="#8a4038">5</text>
  </g>
  <path d="M462 390 L472 390 L467 398 z" fill="#d1544a"/>
  <text x="520" y="419" font-size="10.5" fill="#8a4038">逐格比对全部 ≠ 8，i 越过末尾 → 循环结束</text>
  <text x="50" y="456" font-size="10.5" fill="#6e6e73">扫完 n 个元素仍无匹配，落到函数末尾 <tspan font-weight="700" fill="#d1544a">return -1</tspan>（约定「未找到」的哨兵值）。</text>
  <text x="50" y="480" font-size="10" fill="#8e8e93">链表版同理：沿 node.Next 逐个走，命中返回节点、走到 nil 返回 nil —— 无随机访问，也只能线性。</text>

  <text x="30" y="524" font-size="10" fill="#a1a1a6">要点：命中位置越靠后越慢；平均比较 n/2 次、最坏 n 次，故复杂度 O(n)，与数据是否有序无关。</text>
  <text x="30" y="548" font-size="10" fill="#a1a1a6">这是唯一无前提的路线 —— 当数据无序又无法建表时，它是保底选择。</text>
</svg>
