<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a5cae"/></marker>
  </defs>
  <rect width="1300" height="660" fill="#fbfbfd"/>

  <!-- 判型标题带 -->
  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">消息队列模式 · 消息系统把「谁发」与「谁收」解耦，但解耦后要分别回答三个正交问题——广播给谁 / 谁分摊 / 丢不丢重不重</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">Producer 只管写 Topic、Consumer 只管订阅；广播范围、负载分摊、投递可靠性由三套独立机制决定——Kafka 恰好三者兼备，下面同一套内核贯穿全图</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">① 广播给谁 · pub-sub 范围</text>
  <line x1="300" y1="80" x2="324" y2="80" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="330" y="84" font-size="10" fill="#3a3a3c">② 谁分摊 · 组内负载分摊</text>
  <line x1="570" y1="80" x2="594" y2="80" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <text x="600" y="84" font-size="10" fill="#3a3a3c">③ 丢不丢 / 重不重 · 投递语义</text>
  <text x="1270" y="86" font-size="10" fill="#a1a1a6" text-anchor="end">Kafka 贯穿三问</text>
  <line x1="30" y1="98" x2="1270" y2="98" stroke="#e4e7ec" stroke-width="1"/>

  <!-- 统一模型 spine -->
  <rect x="30" y="118" width="1240" height="150" rx="14" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="48" y="142" font-size="12" font-weight="700" fill="#4a4a4f">Kafka 统一模型 · Producer / Consumer API 与 Topic-Partition 日志内核 —— 下面三层能力全部长在同一套内核上</text>

  <rect x="120" y="158" width="220" height="88" rx="10" fill="#ffffff" stroke="#d9dde4" filter="url(#soft)"/>
  <text x="230" y="188" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Producer</text>
  <text x="230" y="206" font-size="9" fill="#6e6e73" text-anchor="middle">按 key 路由到 partition</text>
  <text x="230" y="222" font-size="9" fill="#6e6e73" text-anchor="middle">顺序 append 写入</text>

  <rect x="370" y="158" width="560" height="88" rx="10" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="650" y="180" font-size="11.5" font-weight="600" fill="#20375e" text-anchor="middle">Topic T · 有序、不可变、只增日志</text>
  <g font-size="9.5" text-anchor="middle" fill="#20375e">
    <rect x="386" y="194" width="120" height="30" rx="5" fill="#ffffff" stroke="#c6d9f2"/><text x="446" y="213">P0</text>
    <rect x="522" y="194" width="120" height="30" rx="5" fill="#ffffff" stroke="#c6d9f2"/><text x="582" y="213">P1</text>
    <rect x="658" y="194" width="120" height="30" rx="5" fill="#ffffff" stroke="#c6d9f2"/><text x="718" y="213">P2</text>
    <rect x="794" y="194" width="120" height="30" rx="5" fill="#ffffff" stroke="#c6d9f2"/><text x="854" y="213">P3</text>
  </g>

  <rect x="960" y="158" width="220" height="88" rx="10" fill="#ffffff" stroke="#d9dde4" filter="url(#soft)"/>
  <text x="1070" y="188" font-size="11.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Consumers</text>
  <text x="1070" y="206" font-size="9" fill="#6e6e73" text-anchor="middle">订阅 Topic</text>
  <text x="1070" y="222" font-size="9" fill="#6e6e73" text-anchor="middle">拉取分区流（pull）</text>

  <line x1="340" y1="202" x2="368" y2="202" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>
  <line x1="932" y1="202" x2="958" y2="202" stroke="#4a7fd0" stroke-width="2" marker-end="url(#aB)"/>

  <!-- 三个正交问题面板 -->
  <rect x="30" y="292" width="400" height="210" rx="13" fill="#eaf1fb" stroke="#c6d9f2" filter="url(#soft)"/>
  <text x="50" y="318" font-size="12.5" font-weight="700" fill="#20375e">① 广播给谁 · pub-sub</text>
  <line x1="46" y1="328" x2="414" y2="328" stroke="#c6d9f2" stroke-width="1"/>
  <text x="46" y="348" font-size="9.5" fill="#3a4a63">同一 Topic 的完整 partition 流，可以被</text>
  <text x="46" y="365" font-size="9.5" fill="#3a4a63">任意多个独立 Consumer Group 各自完整</text>
  <text x="46" y="382" font-size="9.5" fill="#3a4a63">重读一遍——一个 Group 读过不消耗数据</text>
  <g font-size="9" text-anchor="middle">
    <rect x="150" y="404" width="100" height="28" rx="7" fill="#ffffff" stroke="#c6d9f2"/><text x="200" y="422" fill="#20375e">Topic</text>
    <rect x="60" y="452" width="120" height="28" rx="7" fill="#ffffff" stroke="#c6d9f2"/><text x="120" y="470" fill="#20375e">Group A · 全量</text>
    <rect x="220" y="452" width="120" height="28" rx="7" fill="#ffffff" stroke="#c6d9f2"/><text x="280" y="470" fill="#20375e">Group B · 全量</text>
    <line x1="180" y1="432" x2="130" y2="450" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
    <line x1="220" y1="432" x2="270" y2="450" stroke="#4a7fd0" stroke-width="1.6" marker-end="url(#aB)"/>
  </g>
  <text x="46" y="494" font-size="8.5" fill="#5a7099">→ 机制细节见 M1（Topic/Partition 广播模型）</text>

  <rect x="450" y="292" width="400" height="210" rx="13" fill="#eaf6f0" stroke="#bfe3d1" filter="url(#soft)"/>
  <text x="470" y="318" font-size="12.5" font-weight="700" fill="#2f6b4e">② 谁分摊 · 竞争消费者</text>
  <line x1="466" y1="328" x2="834" y2="328" stroke="#bfe3d1" stroke-width="1"/>
  <text x="466" y="348" font-size="9.5" fill="#2f6b4e">同一个 Consumer Group 内部，每个</text>
  <text x="466" y="365" font-size="9.5" fill="#2f6b4e">Partition 只分配给一个 Member；成员</text>
  <text x="466" y="382" font-size="9.5" fill="#2f6b4e">共同分摊整条 Topic 的消费负载</text>
  <g font-size="9" text-anchor="middle">
    <rect x="466" y="404" width="368" height="76" rx="8" fill="#ffffff" stroke="#bfe3d1"/>
    <text x="650" y="418" font-size="8.5" fill="#5a9078">Group（组内 rebalance 分配 partition）</text>
    <rect x="480" y="426" width="106" height="42" rx="6" fill="#d7efe2" stroke="#9ed3b8"/><text x="533" y="444" fill="#2f6b4e">M1 ← P0</text>
    <rect x="594" y="426" width="106" height="42" rx="6" fill="#d7efe2" stroke="#9ed3b8"/><text x="647" y="444" fill="#2f6b4e">M2 ← P1,P2</text>
    <rect x="708" y="426" width="112" height="42" rx="6" fill="#d7efe2" stroke="#9ed3b8"/><text x="764" y="444" fill="#2f6b4e">M3 ← P3</text>
  </g>
  <text x="466" y="494" font-size="8.5" fill="#3f8a63">→ 机制细节见 M2（Group Coordinator Rebalance）</text>

  <rect x="870" y="292" width="400" height="210" rx="13" fill="#f4eefb" stroke="#dcc9ef" filter="url(#soft)"/>
  <text x="890" y="318" font-size="12.5" font-weight="700" fill="#6f3ea8">③ 丢不丢 / 重不重 · 投递语义</text>
  <line x1="886" y1="328" x2="1254" y2="328" stroke="#dcc9ef" stroke-width="1"/>
  <text x="886" y="348" font-size="9.5" fill="#5a3a7a">幂等 Producer 用 PID+序列号去重，重试</text>
  <text x="886" y="365" font-size="9.5" fill="#5a3a7a">不重复写；事务 Producer 跨分区原子写，</text>
  <text x="886" y="382" font-size="9.5" fill="#5a3a7a">配合 Consumer 端 read_committed 隔离</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="886" y="404" width="150" height="34" rx="7" fill="#ffffff" stroke="#dcc9ef"/><text x="961" y="424" fill="#6f3ea8">幂等去重 → 无重复</text>
    <rect x="1050" y="404" width="204" height="34" rx="7" fill="#ffffff" stroke="#dcc9ef"/><text x="1152" y="424" fill="#6f3ea8">事务 + read_committed</text>
    <rect x="886" y="448" width="368" height="30" rx="7" fill="#f2f0fa" stroke="#d3c6ee"/><text x="1070" y="468" font-weight="700" fill="#5a3a7a">两者叠加 = exactly-once</text>
  </g>
  <text x="886" y="494" font-size="8.5" fill="#5a3a7a">→ 机制细节见 M3（幂等 + 事务 Producer）</text>

  <!-- 连接线：spine → 三面板 -->
  <line x1="446" y1="246" x2="230" y2="290" stroke="#4a7fd0" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aB)"/>
  <line x1="650" y1="246" x2="650" y2="290" stroke="#2f9e6e" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aG)"/>
  <line x1="854" y1="246" x2="1070" y2="290" stroke="#8a5cae" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aP)"/>

  <!-- 一句话总结 -->
  <rect x="30" y="524" width="1240" height="108" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="550" font-size="10.5" font-weight="700" fill="#1d1d1f">一句话</text>
  <text x="112" y="550" font-size="10" fill="#4a4a4f">Kafka 不是三个不同项目的拼盘对比，是<tspan font-weight="700" fill="#6f3ea8">同一套 Topic/Partition 内核</tspan>在三层正交问题上分别长出的三套机制：</text>
  <text x="50" y="574" font-size="10" fill="#4a4a4f">广播用 <tspan font-weight="700" fill="#20375e">Topic/Partition 模型</tspan> 答「广播给谁」，分摊用 <tspan font-weight="700" fill="#2f6b4e">Consumer Group Rebalance</tspan> 答「谁分摊」，投递可靠性用 <tspan font-weight="700" fill="#6f3ea8">幂等 + 事务 Producer</tspan> 答「丢不丢/重不重」。</text>
  <text x="50" y="598" font-size="9" fill="#8a97ab">三问互不包含也互不替代——这正是本页把 M1/M2/M3 都点名 Kafka、却不算重复的原因（详见对比图 CMP）。</text>
  <text x="50" y="618" font-size="9" fill="#8a97ab">三套机制均为本会话源码/文档级核实：Topic/Partition 读写模型、group coordinator rebalance 触发条件、checkSequence + findDuplicateBatch 去重机制。</text>
</svg>
