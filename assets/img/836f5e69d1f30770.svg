<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1120" height="660" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">对比 · 四种遍历怎么选 &amp; BST 与 AVL 的取舍</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">遍历选谁由「何时需要根」决定；BST 与 AVL 之别在于是否花旋转代价换取最坏情形的高度保证</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">DFS（递归/栈）</text>
  <rect x="180" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="198" y="82" font-size="10.5" fill="#3a3a3c">BFS（队列）/ 有保证</text>
  <rect x="360" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="378" y="82" font-size="10.5" fill="#3a3a3c">最坏退化风险</text>

  <!-- ===== A 遍历对比 ===== -->
  <rect x="30" y="98" width="1060" height="252" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="122" font-size="12.5" font-weight="700" fill="#20375e">① 四种遍历用途对比</text>

  <!-- 表头 -->
  <g font-size="10.5" font-weight="700" fill="#4a4a4f">
    <rect x="50" y="134" width="130" height="30" rx="5" fill="#eef2f7"/><text x="115" y="154" text-anchor="middle">遍历</text>
    <rect x="184" y="134" width="180" height="30" rx="5" fill="#eef2f7"/><text x="274" y="154" text-anchor="middle">根访问时机</text>
    <rect x="368" y="134" width="180" height="30" rx="5" fill="#eef2f7"/><text x="458" y="154" text-anchor="middle">容器 / 空间</text>
    <rect x="552" y="134" width="518" height="30" rx="5" fill="#eef2f7"/><text x="811" y="154" text-anchor="middle">典型用途</text>
  </g>
  <!-- 行 前序 -->
  <g font-size="10.5" fill="#4a4a4f">
    <rect x="50" y="168" width="130" height="40" rx="5" fill="#f2f7ff" stroke="#dbe6f5"/><text x="62" y="192" font-weight="700" fill="#20375e">前序 根左右</text>
    <rect x="184" y="168" width="180" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="196" y="192">最先，一进节点就记</text>
    <rect x="368" y="168" width="180" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="380" y="192">递归栈，O(h)</text>
    <rect x="552" y="168" width="518" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="564" y="192">复制/序列化树、自顶向下导出（先父后子），如目录树打印</text>
  </g>
  <!-- 行 中序 -->
  <g font-size="10.5" fill="#4a4a4f">
    <rect x="50" y="212" width="130" height="40" rx="5" fill="#f2f7ff" stroke="#dbe6f5"/><text x="62" y="236" font-weight="700" fill="#20375e">中序 左根右</text>
    <rect x="184" y="212" width="180" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="196" y="236">居中，左子做完才记</text>
    <rect x="368" y="212" width="180" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="380" y="236">递归栈，O(h)</text>
    <rect x="552" y="212" width="518" height="40" rx="5" fill="#eefaf4" stroke="#c9ebdb"/><text x="564" y="236" fill="#1f6b4e">在 BST 上输出升序、范围查询、找第 k 小 —— 中序 = 排序结果</text>
  </g>
  <!-- 行 后序 -->
  <g font-size="10.5" fill="#4a4a4f">
    <rect x="50" y="256" width="130" height="40" rx="5" fill="#f2f7ff" stroke="#dbe6f5"/><text x="62" y="280" font-weight="700" fill="#20375e">后序 左右根</text>
    <rect x="184" y="256" width="180" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="196" y="280">最后，左右都完才记</text>
    <rect x="368" y="256" width="180" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="380" y="280">递归栈，O(h)</text>
    <rect x="552" y="256" width="518" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="564" y="280">先算子树再合并：释放内存、算子树大小、表达式树求值</text>
  </g>
  <!-- 行 层序 -->
  <g font-size="10.5" fill="#4a4a4f">
    <rect x="50" y="300" width="130" height="40" rx="5" fill="#eefaf4" stroke="#c9ebdb"/><text x="62" y="324" font-weight="700" fill="#1f6b4e">层序 BFS</text>
    <rect x="184" y="300" width="180" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="196" y="324">逐层，无递归</text>
    <rect x="368" y="300" width="180" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="380" y="324">队列，O(宽度)</text>
    <rect x="552" y="300" width="518" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="564" y="324">按层处理、最短路径（无权）、逐层打印；四者均 O(n) 时间</text>
  </g>

  <!-- ===== B BST vs AVL ===== -->
  <rect x="30" y="364" width="1060" height="272" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="388" font-size="12.5" font-weight="700" fill="#20375e">② 二叉搜索树 BST vs 平衡树 AVL</text>

  <g font-size="10.5" font-weight="700" fill="#4a4a4f">
    <rect x="50" y="400" width="230" height="30" rx="5" fill="#eef2f7"/><text x="165" y="420" text-anchor="middle">维度</text>
    <rect x="284" y="400" width="393" height="30" rx="5" fill="#eef2f7"/><text x="480" y="420" text-anchor="middle">普通 BST</text>
    <rect x="681" y="400" width="389" height="30" rx="5" fill="#eef2f7"/><text x="875" y="420" text-anchor="middle">AVL（自平衡 BST）</text>
  </g>
  <!-- 行1 高度保证 -->
  <g font-size="10.5">
    <rect x="50" y="434" width="230" height="40" rx="5" fill="#f2f7ff" stroke="#dbe6f5"/><text x="62" y="458" font-weight="700" fill="#20375e">高度保证</text>
    <rect x="284" y="434" width="393" height="40" rx="5" fill="#fdecea" stroke="#f3cbc5"/><text x="296" y="458" fill="#8a4038">无保证：有序插入退化成链，h = n</text>
    <rect x="681" y="434" width="389" height="40" rx="5" fill="#eefaf4" stroke="#c9ebdb"/><text x="693" y="458" fill="#1f6b4e">恒为 h = O(log n)，任何输入都成立</text>
  </g>
  <!-- 行2 查删增复杂度 -->
  <g font-size="10.5">
    <rect x="50" y="478" width="230" height="40" rx="5" fill="#f2f7ff" stroke="#dbe6f5"/><text x="62" y="502" font-weight="700" fill="#20375e">查 / 插 / 删</text>
    <rect x="284" y="478" width="393" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="296" y="502" fill="#4a4a4f">平均 O(log n)，最坏 <tspan fill="#8a4038" font-weight="700">O(n)</tspan></text>
    <rect x="681" y="478" width="389" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="693" y="502" fill="#4a4a4f">最坏也 <tspan fill="#1f6b4e" font-weight="700">O(log n)</tspan>，稳定</text>
  </g>
  <!-- 行3 维护代价 -->
  <g font-size="10.5">
    <rect x="50" y="522" width="230" height="40" rx="5" fill="#f2f7ff" stroke="#dbe6f5"/><text x="62" y="546" font-weight="700" fill="#20375e">写入维护代价</text>
    <rect x="284" y="522" width="393" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="296" y="546" fill="#4a4a4f">插删后无额外操作，写入更轻</text>
    <rect x="681" y="522" width="389" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="693" y="546" fill="#4a4a4f">每次写要更新高度 + 可能旋转（O(1) 次）</text>
  </g>
  <!-- 行4 适用 -->
  <g font-size="10.5">
    <rect x="50" y="566" width="230" height="40" rx="5" fill="#f2f7ff" stroke="#dbe6f5"/><text x="62" y="590" font-weight="700" fill="#20375e">适用场景</text>
    <rect x="284" y="566" width="393" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="296" y="590" fill="#4a4a4f">数据随机、教学、可控输入</text>
    <rect x="681" y="566" width="389" height="40" rx="5" fill="#fbfbfd" stroke="#eef0f3"/><text x="693" y="590" fill="#4a4a4f">读多写少、需最坏保证；查频高更划算</text>
  </g>
  <text x="50" y="626" font-size="10" fill="#8a97ab">一句话：BST 用平均性能换写入简单，赌输入够随机；AVL 用旋转代价买断最坏情形。工程上读密集常选红黑树（更宽松的平衡，旋转更少）。</text>
</svg>
