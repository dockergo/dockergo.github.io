<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="680" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="17" font-weight="700" fill="#1d1d1f">栈 / 队列 / 双端队列 · 受限线性表家族地图</text>
  <text x="30" y="53" font-size="11" fill="#6e6e73">给线性表加上「只能在端点操作」的纪律，就得到三种受限结构；三者的底层都可用数组或链表承载。</text>

  <!-- 图例 -->
  <rect x="30" y="68" width="13" height="13" rx="3" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="49" y="79" font-size="10.5" fill="#3a3a3c">受限结构 / 操作端</text>
  <rect x="190" y="68" width="13" height="13" rx="3" fill="#e6f4ec" stroke="#b6ddc9"/>
  <text x="209" y="79" font-size="10.5" fill="#3a3a3c">元素进 / 出方向</text>
  <rect x="340" y="68" width="13" height="13" rx="3" fill="#fbf1dc" stroke="#ecd6a3"/>
  <text x="359" y="79" font-size="10.5" fill="#3a3a3c">底层存储载体</text>

  <!-- ① 出发点 -->
  <text x="30" y="112" font-size="12" font-weight="700" fill="#1d1d1f">① 出发点 · 普通线性表：任意位置皆可增删查</text>
  <g text-anchor="middle" font-size="11">
    <rect x="40" y="122" width="58" height="38" rx="6" fill="#f4f4f6" stroke="#d7d7dd"/><text x="69" y="146" fill="#4a4a4f">e0</text>
    <rect x="100" y="122" width="58" height="38" rx="6" fill="#f4f4f6" stroke="#d7d7dd"/><text x="129" y="146" fill="#4a4a4f">e1</text>
    <rect x="160" y="122" width="58" height="38" rx="6" fill="#f4f4f6" stroke="#d7d7dd"/><text x="189" y="146" fill="#4a4a4f">e2</text>
    <rect x="220" y="122" width="58" height="38" rx="6" fill="#f4f4f6" stroke="#d7d7dd"/><text x="249" y="146" fill="#4a4a4f">e3</text>
    <rect x="280" y="122" width="58" height="38" rx="6" fill="#f4f4f6" stroke="#d7d7dd"/><text x="309" y="146" fill="#4a4a4f">e4</text>
  </g>
  <line x1="129" y1="100" x2="129" y2="120" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#aB)"/>
  <line x1="249" y1="100" x2="249" y2="120" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#aB)"/>
  <text x="360" y="138" font-size="10.5" fill="#6e6e73">中间任意位置可插入 / 删除</text>
  <text x="360" y="154" font-size="10.5" fill="#6e6e73">灵活，但无访问纪律</text>

  <!-- 约束箭头 -->
  <line x1="560" y1="172" x2="560" y2="206" stroke="#4a7fd0" stroke-width="2.4" marker-end="url(#aB)"/>
  <text x="575" y="192" font-size="12" font-weight="700" fill="#20375e">施加约束 · 只允许在「端点」操作</text>

  <!-- ② 三成员 -->
  <text x="30" y="234" font-size="12" font-weight="700" fill="#1d1d1f">② 三个受限成员：约束越松，能力越强（双端队列是栈与队列的超集）</text>

  <!-- 栈 卡片 -->
  <rect x="40" y="246" width="332" height="216" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="60" y="274" font-size="13" font-weight="700" fill="#20375e">栈 Stack · LIFO 后进先出</text>
  <text x="60" y="293" font-size="10" fill="#6e6e73">仅一端（栈顶 top）既进又出</text>
  <g text-anchor="middle" font-size="11">
    <rect x="78" y="360" width="52" height="38" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="104" y="384" fill="#20375e">a</text>
    <rect x="132" y="360" width="52" height="38" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="158" y="384" fill="#20375e">b</text>
    <rect x="186" y="360" width="52" height="38" rx="6" fill="#dbe8fa" stroke="#9dbdea" stroke-width="1.5"/><text x="212" y="384" fill="#20375e">c</text>
  </g>
  <text x="212" y="418" font-size="9.5" fill="#20375e" text-anchor="middle">↑ 栈顶 top（唯一开口）</text>
  <line x1="270" y1="315" x2="230" y2="352" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="278" y="316" font-size="10" fill="#1f6b4b">push 压入</text>
  <line x1="300" y1="352" x2="340" y2="315" stroke="#2f9e6e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aG)"/>
  <text x="300" y="345" font-size="10" fill="#1f6b4b" text-anchor="middle">pop 弹出</text>
  <line x1="78" y1="352" x2="238" y2="352" stroke="#4a7fd0" stroke-width="2"/>
  <line x1="78" y1="352" x2="78" y2="404" stroke="#c6d9f2" stroke-width="4"/>
  <text x="80" y="440" font-size="9.5" fill="#8a4038">另一端封闭，元素进不去也出不来</text>

  <!-- 队列 卡片 -->
  <rect x="394" y="246" width="332" height="216" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="414" y="274" font-size="13" font-weight="700" fill="#20375e">队列 Queue · FIFO 先进先出</text>
  <text x="414" y="293" font-size="10" fill="#6e6e73">一端进（队尾 rear）另一端出（队首 front）</text>
  <g text-anchor="middle" font-size="11">
    <rect x="470" y="360" width="52" height="38" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="496" y="384" fill="#20375e">a</text>
    <rect x="524" y="360" width="52" height="38" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="550" y="384" fill="#20375e">b</text>
    <rect x="578" y="360" width="52" height="38" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="604" y="384" fill="#20375e">c</text>
  </g>
  <line x1="430" y1="379" x2="466" y2="379" stroke="#2f9e6e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aG)"/>
  <text x="414" y="345" font-size="10" fill="#1f6b4b">pop 出队</text>
  <text x="470" y="418" font-size="9.5" fill="#20375e">队首 front</text>
  <line x1="670" y1="379" x2="634" y2="379" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="640" y="345" font-size="10" fill="#1f6b4b">push 入队</text>
  <text x="576" y="418" font-size="9.5" fill="#20375e">队尾 rear</text>

  <!-- 双端 卡片 -->
  <rect x="748" y="246" width="332" height="216" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="768" y="274" font-size="13" font-weight="700" fill="#20375e">双端队列 Deque · 两端皆可</text>
  <text x="768" y="293" font-size="10" fill="#6e6e73">front 与 back 两端都能进又能出</text>
  <g text-anchor="middle" font-size="11">
    <rect x="828" y="360" width="52" height="38" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="854" y="384" fill="#20375e">a</text>
    <rect x="882" y="360" width="52" height="38" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="908" y="384" fill="#20375e">b</text>
    <rect x="936" y="360" width="52" height="38" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="962" y="384" fill="#20375e">c</text>
  </g>
  <line x1="788" y1="371" x2="824" y2="371" stroke="#2f9e6e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aG)"/>
  <line x1="824" y1="388" x2="788" y2="388" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <text x="784" y="345" font-size="10" fill="#1f6b4b">pushFirst / popFirst</text>
  <text x="828" y="418" font-size="9.5" fill="#20375e">front</text>
  <line x1="1028" y1="371" x2="992" y2="371" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aG)"/>
  <line x1="992" y1="388" x2="1028" y2="388" stroke="#2f9e6e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aG)"/>
  <text x="912" y="345" font-size="10" fill="#1f6b4b">pushLast / popLast</text>
  <text x="962" y="418" font-size="9.5" fill="#20375e">back</text>

  <!-- ③ 底层承载 -->
  <text x="30" y="504" font-size="12" font-weight="700" fill="#1d1d1f">③ 底层承载 · 三者皆可用两种载体实现（本条目每个成员各给两版）</text>
  <rect x="40" y="516" width="516" height="132" rx="14" fill="#fefaf0" stroke="#ecd6a3"/>
  <text x="60" y="542" font-size="12" font-weight="700" fill="#8a6a1f">数组承载（连续内存）</text>
  <g text-anchor="middle" font-size="10">
    <rect x="60" y="556" width="46" height="34" rx="5" fill="#fbf1dc" stroke="#ecd6a3"/><text x="83" y="577" fill="#8a6a1f">[0]</text>
    <rect x="106" y="556" width="46" height="34" rx="5" fill="#fbf1dc" stroke="#ecd6a3"/><text x="129" y="577" fill="#8a6a1f">[1]</text>
    <rect x="152" y="556" width="46" height="34" rx="5" fill="#fbf1dc" stroke="#ecd6a3"/><text x="175" y="577" fill="#8a6a1f">[2]</text>
    <rect x="198" y="556" width="46" height="34" rx="5" fill="#fbf1dc" stroke="#ecd6a3"/><text x="221" y="577" fill="#8a6a1f">[3]</text>
  </g>
  <path d="M244 573 A 30 30 0 0 1 244 573" fill="none"/>
  <line x1="256" y1="573" x2="284" y2="573" stroke="#d99a2b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="300" y="562" font-size="10" fill="#8a6a1f">下标随机访问、缓存友好</text>
  <text x="300" y="579" font-size="10" fill="#8a6a1f">可环形复用；越界需扩容</text>
  <text x="60" y="620" font-size="9.5" fill="#a07e2a">队列 / 双端可让 front、rear 取模回绕，避免出队后整体搬移</text>

  <rect x="564" y="516" width="516" height="132" rx="14" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="584" y="542" font-size="12" font-weight="700" fill="#20375e">链表承载（离散结点）</text>
  <g text-anchor="middle" font-size="10">
    <rect x="584" y="556" width="52" height="34" rx="7" fill="#eaf1fb" stroke="#c6d9f2"/><text x="610" y="577" fill="#20375e">node</text>
    <rect x="676" y="556" width="52" height="34" rx="7" fill="#eaf1fb" stroke="#c6d9f2"/><text x="702" y="577" fill="#20375e">node</text>
    <rect x="768" y="556" width="52" height="34" rx="7" fill="#eaf1fb" stroke="#c6d9f2"/><text x="794" y="577" fill="#20375e">node</text>
  </g>
  <line x1="636" y1="573" x2="672" y2="573" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <line x1="728" y1="573" x2="764" y2="573" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="850" y="562" font-size="10" fill="#20375e">指针连接、端点增删 O(1)</text>
  <text x="850" y="579" font-size="10" fill="#20375e">无需扩容；每结点额外指针</text>
  <text x="584" y="620" font-size="9.5" fill="#8a97ab">本条目链表版用 container/list（双向链表），Front / Back 两端操作均 O(1)</text>

  <rect x="40" y="656" width="1040" height="18" fill="none"/>
  <text x="560" y="669" font-size="10" fill="#6e6e73" text-anchor="middle">要点：结构（栈/队列/双端）定义「能在哪些端操作」，载体（数组/链表）决定「用什么内存布局承载」——两者正交。</text>
</svg>
