<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#7c5fe6"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d9524a"/></marker></defs>
  <rect width="1000" height="420" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · AAD：把“身份”绑进密文，防止模块被搬移替换</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">仅加密还不够:攻击者可把一页原样搬到别处冒充;AAD（附加认证数据）把“文件+行组+列+页”的坐标绑进 GCM,错位即校验失败</text>

  <!-- AAD 构成 -->
  <rect x="30" y="76" width="470" height="180" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="46" y="100" font-size="11" font-weight="700" fill="#0a3d78">AAD = AAD prefix + AAD suffix</text>
  <rect x="46" y="112" width="438" height="46" rx="7" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="60" y="131" font-size="9.2" font-weight="700" fill="#0a3d78">AAD prefix（文件级，可选）</text>
  <text x="60" y="148" font-size="8.2" fill="#2a5a92">标识文件身份，防跨文件搬运；可留空</text>
  <rect x="46" y="166" width="438" height="80" rx="7" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="60" y="185" font-size="9.2" font-weight="700" fill="#0a3d78">AAD suffix（模块坐标，自动派生）</text>
  <text x="60" y="203" font-size="8.4" fill="#2a5a92">row_group 序号 + column 序号</text>
  <text x="60" y="219" font-size="8.4" fill="#2a5a92">+ 模块类型（DataPage / Dict / Index …）</text>
  <text x="60" y="235" font-size="8.4" fill="#2a5a92">+ page 序号 → 每个模块的 AAD 唯一</text>

  <!-- GCM 绑定 -->
  <rect x="520" y="76" width="450" height="180" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="536" y="100" font-size="11" font-weight="700" fill="#12402a">GCM 加密时把 AAD 一起认证</text>
  <rect x="536" y="114" width="418" height="30" rx="6" fill="#fff" stroke="#b9dfd8"/>
  <text x="550" y="134" font-size="8.8" fill="#0f6b5e">密文 + 认证标签 tag = GCM(密钥, 明文, AAD)</text>
  <rect x="536" y="152" width="418" height="30" rx="6" fill="#fff" stroke="#b9dfd8"/>
  <text x="550" y="172" font-size="8.8" fill="#0f6b5e">解密时用相同 AAD 重算 tag,一致才通过</text>
  <text x="536" y="204" font-size="8.8" fill="#2f6f5f">→ AAD 不参与保密,只参与“完整性 + 定位绑定”。</text>
  <text x="536" y="222" font-size="8.8" fill="#2f6f5f">密钥相同、密文相同,但坐标不同 → tag 对不上。</text>
  <text x="536" y="240" font-size="8.4" fill="#4c8567">因此“同密钥的两页”也不能互相顶替。</text>

  <!-- 攻击被挡 -->
  <rect x="30" y="268" width="470" height="138" rx="12" fill="#fdeeec" stroke="#f0c4bf" filter="url(#soft)"/>
  <text x="46" y="292" font-size="11" font-weight="700" fill="#a12d24">攻击场景：把列A的页搬去冒充列B的页</text>
  <path d="M60,306 L60,340" stroke="#d9524a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="74" y="316" font-size="8.8" fill="#a12d24">搬运后模块坐标变了（列号/页号不符）</text>
  <text x="74" y="336" font-size="8.8" fill="#a12d24">解密用新位置的 AAD 重算 tag</text>
  <rect x="60" y="352" width="420" height="40" rx="7" fill="#fbe6e3" stroke="#eebcb5"/>
  <text x="74" y="370" font-size="9" font-weight="700" fill="#a12d24">tag 校验失败 → 解密拒绝，篡改被发现</text>
  <text x="74" y="386" font-size="8" fill="#c25b52">删页/截断/重排同样破坏坐标绑定</text>

  <rect x="520" y="268" width="450" height="138" rx="12" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="536" y="292" font-size="11" font-weight="700" fill="#1b2a4a">设计意义</text>
  <text x="536" y="314" font-size="9.2" fill="#5b7db1">· 保密性来自密钥,完整性 + 抗搬移来自 AAD,二者互补。</text>
  <text x="536" y="334" font-size="9.2" fill="#5b7db1">· AAD suffix 由文件结构自动派生,无需额外存储,读写双方各自算出。</text>
  <text x="536" y="354" font-size="9.2" fill="#5b7db1">· AAD prefix 可由应用注入（如表名+版本）,进一步绑定业务上下文。</text>
  <text x="536" y="376" font-size="9.2" fill="#5b7db1">· 与双 footer 模式配合,既能防篡改,又能灵活控制元数据可见性。</text>
  <text x="536" y="396" font-size="8.2" fill="#7fa0c4">AAD 是 Parquet 加密“防重放/防换位”的核心手段。</text>
</svg>
