<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="680" viewBox="0 0 1130 680" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1130" height="680" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">跨项目一致性取舍对比 · etcd / ZooKeeper / ClickHouse —— 同为分布式存储，一致性保证的强弱、代价与失败行为完全不同</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">不是三种实现同一目标的替代方案，是三个不同的架构选择；下表按 4 个维度横向对照</text>

  <!-- 列头 -->
  <rect x="30" y="72" width="176" height="40" rx="9" fill="#eef0f3" stroke="#e4e7ec"/>
  <text x="118" y="97" font-size="12" font-weight="700" fill="#4a4a4f" text-anchor="middle">对比维度</text>
  <rect x="214" y="72" width="288" height="40" rx="9" fill="#eaf1fb" stroke="#c6d9f2"/>
  <text x="358" y="97" font-size="13" font-weight="800" fill="#20375e" text-anchor="middle">etcd</text>
  <rect x="510" y="72" width="288" height="40" rx="9" fill="#fbf3e2" stroke="#ecd6a8"/>
  <text x="654" y="97" font-size="13" font-weight="800" fill="#8a6417" text-anchor="middle">ZooKeeper</text>
  <rect x="806" y="72" width="284" height="40" rx="9" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="948" y="97" font-size="13" font-weight="800" fill="#2f6b4e" text-anchor="middle">ClickHouse</text>

  <!-- 行1：写入路径是否单点 -->
  <rect x="30" y="120" width="176" height="112" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="150" font-size="11.5" font-weight="700" fill="#1d1d1f">① 写入路径</text>
  <text x="46" y="164" font-size="11.5" font-weight="700" fill="#1d1d1f">是否单点</text>
  <text x="46" y="186" font-size="9" fill="#8a97ab">写请求最终</text>
  <text x="46" y="200" font-size="9" fill="#8a97ab">经不经过唯一点</text>

  <rect x="214" y="120" width="288" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="230" y="146" font-size="10" font-weight="700" fill="#20375e">是 · 经 Raft leader</text>
  <text x="230" y="166" font-size="9.5" fill="#4a4a4f">sendReadIndex 靠一次心跳向</text>
  <text x="230" y="182" font-size="9.5" fill="#4a4a4f">Raft 确认「自己仍是 leader」</text>
  <text x="230" y="198" font-size="9.5" fill="#4a4a4f">——隐含写路径本就单点序列化。</text>
  <text x="230" y="218" font-size="9" fill="#8a97ab">读也要向这个单点确认身份</text>

  <rect x="510" y="120" width="288" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="526" y="146" font-size="10" font-weight="700" fill="#8a6417">是 · 经 leader 广播</text>
  <text x="526" y="166" font-size="9.5" fill="#4a4a4f">所有写必须经 leader 广播</text>
  <text x="526" y="182" font-size="9.5" fill="#4a4a4f">（Proposal→Ack→Commit），</text>
  <text x="526" y="198" font-size="9.5" fill="#4a4a4f">zxid=⟨epoch,counter⟩ 全局定序。</text>
  <text x="526" y="218" font-size="9" fill="#8a97ab">写路径单点，但读路径不同于 etcd</text>

  <rect x="806" y="120" width="284" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="822" y="146" font-size="10" font-weight="700" fill="#2f6b4e">不是 · 任意副本可写</text>
  <text x="822" y="166" font-size="9.5" fill="#4a4a4f">INSERT/ALTER 可发给任意可用</text>
  <text x="822" y="182" font-size="9.5" fill="#4a4a4f">副本；无 leader 选举、无主节点</text>
  <text x="822" y="198" font-size="9.5" fill="#4a4a4f">指定、无写转发机制。</text>
  <text x="822" y="218" font-size="9" fill="#8a97ab">Keeper 只做元数据簿记，不路由写</text>

  <!-- 行2：读到最新的延迟代价 -->
  <rect x="30" y="236" width="176" height="112" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="266" font-size="11.5" font-weight="700" fill="#1d1d1f">② 读到最新</text>
  <text x="46" y="280" font-size="11.5" font-weight="700" fill="#1d1d1f">的延迟代价</text>
  <text x="46" y="302" font-size="9" fill="#8a97ab">为保证读到最新</text>
  <text x="46" y="316" font-size="9" fill="#8a97ab">已提交值要付什么</text>

  <rect x="214" y="236" width="288" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="230" y="262" font-size="10" font-weight="700" fill="#20375e">默认每读一轮心跳 RTT</text>
  <text x="230" y="282" font-size="9.5" fill="#4a4a4f">ReadIndex：多数派心跳确认身份</text>
  <text x="230" y="298" font-size="9.5" fill="#4a4a4f">+ 等本地 AppliedIndex 追平。</text>
  <text x="230" y="318" font-size="9" fill="#8a97ab">Serializable flag 可退化为直读本地（更快、可能读旧）</text>

  <rect x="510" y="236" width="288" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="526" y="262" font-size="10" font-weight="700" fill="#8a6417">不逐读向多数派确认</text>
  <text x="526" y="282" font-size="9.5" fill="#4a4a4f">顺序一致保证「所有客户端看到</text>
  <text x="526" y="298" font-size="9.5" fill="#4a4a4f">同一操作顺序」，不等价于</text>
  <text x="526" y="318" font-size="9" fill="#8a97ab">etcd 式逐读线性一致确认（保证粒度更弱）</text>

  <rect x="806" y="236" width="284" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="822" y="262" font-size="10" font-weight="700" fill="#2f6b4e">代价=副本同步延迟窗口</text>
  <text x="822" y="282" font-size="9.5" fill="#4a4a4f">写完即对客户端返回成功，</text>
  <text x="822" y="298" font-size="9.5" fill="#4a4a4f">其余副本异步追赶，窗口内</text>
  <text x="822" y="318" font-size="9" fill="#8a97ab">读到旧值是预期行为，不是故障</text>

  <!-- 行3：故障时的行为 -->
  <rect x="30" y="352" width="176" height="112" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="382" font-size="11.5" font-weight="700" fill="#1d1d1f">③ 故障时</text>
  <text x="46" y="396" font-size="11.5" font-weight="700" fill="#1d1d1f">的行为</text>
  <text x="46" y="418" font-size="9" fill="#8a97ab">单点/leader 出问题</text>
  <text x="46" y="432" font-size="9" fill="#8a97ab">时系统怎么反应</text>

  <rect x="214" y="352" width="288" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="230" y="378" font-size="10" font-weight="700" fill="#20375e">读阻塞，不返回旧值</text>
  <text x="230" y="398" font-size="9.5" fill="#4a4a4f">心跳收不到多数派响应即无法</text>
  <text x="230" y="414" font-size="9.5" fill="#4a4a4f">确认 leader 身份，读无法经此</text>
  <text x="230" y="430" font-size="9.5" fill="#4a4a4f">路径完成——不会返回脏数据。</text>

  <rect x="510" y="352" width="288" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="526" y="378" font-size="10" font-weight="700" fill="#8a6417">写停摆直到新 leader 可广播</text>
  <text x="526" y="398" font-size="9.5" fill="#4a4a4f">写强依赖 leader 广播；leader</text>
  <text x="526" y="414" font-size="9.5" fill="#4a4a4f">不可用期间，新写无法进入</text>
  <text x="526" y="430" font-size="9.5" fill="#4a4a4f">Proposal→Ack→Commit 流程。</text>

  <rect x="806" y="352" width="284" height="112" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="822" y="378" font-size="10" font-weight="700" fill="#2f6b4e">单副本故障不阻塞其余副本</text>
  <text x="822" y="398" font-size="9.5" fill="#4a4a4f">无单点、无需选主，其余副本</text>
  <text x="822" y="414" font-size="9.5" fill="#4a4a4f">继续独立接收写；故障副本</text>
  <text x="822" y="430" font-size="9.5" fill="#4a4a4f">恢复后按同一异步机制追赶。</text>

  <!-- 行4：一致性保证的名字 -->
  <rect x="30" y="468" width="176" height="96" rx="9" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="46" y="498" font-size="11.5" font-weight="700" fill="#1d1d1f">④ 一致性保证</text>
  <text x="46" y="512" font-size="11.5" font-weight="700" fill="#1d1d1f">的名字</text>
  <text x="46" y="534" font-size="9" fill="#8a97ab">教科书术语对号</text>

  <rect x="214" y="468" width="288" height="96" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="230" y="496" font-size="11" font-weight="700" fill="#20375e">线性一致 Linearizable</text>
  <text x="230" y="518" font-size="9.5" fill="#4a4a4f">默认读语义；Serializable 是</text>
  <text x="230" y="536" font-size="9.5" fill="#4a4a4f">显式选择的更弱退化路径。</text>

  <rect x="510" y="468" width="288" height="96" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="526" y="496" font-size="11" font-weight="700" fill="#8a6417">顺序一致 Sequential</text>
  <text x="526" y="518" font-size="9.5" fill="#4a4a4f">保证操作全局顺序一致，</text>
  <text x="526" y="536" font-size="9.5" fill="#4a4a4f">明确不是逐读线性一致。</text>

  <rect x="806" y="468" width="284" height="96" rx="9" fill="#fff" stroke="#e4e7ec"/>
  <text x="822" y="496" font-size="11" font-weight="700" fill="#2f6b4e">最终一致 Eventual</text>
  <text x="822" y="518" font-size="9.5" fill="#4a4a4f">真正的多主异步；一致性窗口</text>
  <text x="822" y="536" font-size="9.5" fill="#4a4a4f">= 副本同步延迟。</text>

  <!-- 底部一句话 -->
  <rect x="30" y="580" width="1070" height="86" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="606" font-size="10.5" font-weight="700" fill="#1d1d1f">一句话</text>
  <text x="110" y="606" font-size="10" fill="#4a4a4f"><tspan font-weight="700" fill="#20375e">etcd</tspan> 用「每读一轮心跳」的延迟换线性一致；<tspan font-weight="700" fill="#8a6417">ZooKeeper</tspan> 用「全局广播定序」换顺序一致——两者都是 CP，但保证粒度不同；<tspan font-weight="700" fill="#2f6b4e">ClickHouse</tspan> 放弃写路径协调换可用性与延迟，一致性窗口摊开在副本同步的时间里。</text>
  <text x="110" y="628" font-size="10" fill="#4a4a4f">三者不是同一目标下的优劣排名，是三个不同的架构选择——选型的问题不是「哪个更一致」，是「你愿意为多强的一致性支付多少延迟」。</text>
  <text x="110" y="648" font-size="9" fill="#8a97ab">共同背景：CAP 定理（Brewer 猜想 / Gilbert-Lynch 证明）与 PACELC 框架把这条频谱系统化——分区时选 C 或 A，无分区时也要在延迟与一致性间选边。</text>
</svg>
