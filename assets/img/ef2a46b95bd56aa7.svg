<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#e8730f"/></marker></defs>
  <rect width="1000" height="450" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · 写路径：一次顺序写完，元数据尾置收尾</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">缓冲行组 → 按大小切 → 页编码压缩 → 列块背靠背落盘 → FileMetaData 尾置 + PAR1;数据只写一遍，不回头改文件头</text>

  <!-- 五步流水线 -->
  <text x="30" y="82" font-size="10" font-weight="600" fill="#8a8a90">写入流水线 →（append-only 顺序落盘）</text>

  <rect x="30" y="94" width="176" height="82" rx="10" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="118" y="120" font-size="10" font-weight="700" text-anchor="middle" fill="#12402a">① 缓冲行组</text>
  <text x="118" y="140" font-size="8.2" text-anchor="middle" fill="#2f6f5f">按列聚拢内存中的行</text>
  <text x="118" y="156" font-size="8.2" text-anchor="middle" fill="#2f6f5f">攒到一个行组量级</text>

  <rect x="222" y="94" width="176" height="82" rx="10" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="310" y="120" font-size="10" font-weight="700" text-anchor="middle" fill="#0a3d78">② 按大小切行组</text>
  <text x="310" y="140" font-size="8.2" text-anchor="middle" fill="#2a5a92">达 row_group_size</text>
  <text x="310" y="156" font-size="8.2" text-anchor="middle" fill="#2a5a92">（默认 ~128MB）即切</text>

  <rect x="414" y="94" width="176" height="82" rx="10" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="502" y="118" font-size="10" font-weight="700" text-anchor="middle" fill="#0a3d78">③ 页编码 + 压缩</text>
  <text x="502" y="138" font-size="8.2" text-anchor="middle" fill="#2a5a92">每列切页 → 编码</text>
  <text x="502" y="154" font-size="8.2" text-anchor="middle" fill="#2a5a92">→ codec 压缩 → 写页</text>

  <rect x="606" y="94" width="176" height="82" rx="10" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="694" y="118" font-size="10" font-weight="700" text-anchor="middle" fill="#0a3d78">④ 列块背靠背</text>
  <text x="694" y="138" font-size="8.2" text-anchor="middle" fill="#2a5a92">一列所有页连续存</text>
  <text x="694" y="154" font-size="8.2" text-anchor="middle" fill="#2a5a92">记 data_page_offset</text>

  <rect x="798" y="94" width="172" height="82" rx="10" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="884" y="118" font-size="10" font-weight="700" text-anchor="middle" fill="#5a3410">⑤ 尾置元数据</text>
  <text x="884" y="138" font-size="8.2" text-anchor="middle" fill="#93762e">FileMetaData 最后写</text>
  <text x="884" y="154" font-size="8.2" text-anchor="middle" fill="#93762e">+ 4B 长度 + PAR1</text>

  <path d="M206,135 L220,135" stroke="#0a84ff" stroke-width="2.2" fill="none" marker-end="url(#ah)"/>
  <path d="M398,135 L412,135" stroke="#0a84ff" stroke-width="2.2" fill="none" marker-end="url(#ah)"/>
  <path d="M590,135 L604,135" stroke="#0a84ff" stroke-width="2.2" fill="none" marker-end="url(#ah)"/>
  <path d="M782,135 L796,135" stroke="#e8730f" stroke-width="2.2" fill="none" marker-end="url(#ag)"/>

  <!-- 落盘后的物理字节序 -->
  <text x="30" y="204" font-size="10" font-weight="600" fill="#8a8a90">落盘后的物理字节序（从头到尾）</text>
  <g text-anchor="middle" font-size="8.6">
    <rect x="30" y="214" width="70" height="52" rx="8" fill="#fdf6ea" stroke="#efdcb4"/><text x="65" y="244" font-weight="700" fill="#5a3410">PAR1</text>
    <rect x="108" y="214" width="220" height="52" rx="8" fill="#e9f2ff" stroke="#a9ccf5"/><text x="218" y="238" font-weight="700" fill="#0a3d78">行组0：列A块·列B块·…</text><text x="218" y="256" fill="#2a5a92">各列块页背靠背</text>
    <rect x="336" y="214" width="220" height="52" rx="8" fill="#e9f2ff" stroke="#a9ccf5"/><text x="446" y="238" font-weight="700" fill="#0a3d78">行组1：列A块·列B块·…</text><text x="446" y="256" fill="#2a5a92">下一行组顺序追加</text>
    <rect x="564" y="214" width="120" height="52" rx="8" fill="#faf5ff" stroke="#e4d5f2"/><text x="624" y="238" font-weight="700" fill="#3d2a5a">PageIndex</text><text x="624" y="256" fill="#6a4f9a">/布隆（可选）</text>
    <rect x="692" y="214" width="196" height="52" rx="8" fill="#fdf6ea" stroke="#efdcb4"/><text x="790" y="238" font-weight="700" fill="#5a3410">FileMetaData</text><text x="790" y="256" fill="#93762e">全部偏移/统计此刻已知</text>
    <rect x="896" y="214" width="74" height="52" rx="8" fill="#fdf1e0" stroke="#e8c99a"/><text x="933" y="238" font-weight="700" fill="#5a3410">4B len</text><text x="933" y="256" fill="#93762e">+PAR1</text>
  </g>

  <!-- 为什么能单遍 -->
  <rect x="30" y="286" width="455" height="150" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="48" y="310" font-size="11" font-weight="700" fill="#12402a">为什么能“单遍写”</text>
  <text x="48" y="332" font-size="9.2" fill="#2f6f5f">· 偏移/统计写完那一刻才确定 → 自然放最后</text>
  <text x="48" y="352" font-size="9.2" fill="#2f6f5f">· 数据只顺序写一次，绝不回头改文件头</text>
  <text x="48" y="372" font-size="9.2" fill="#2f6f5f">· 一个行组写完即可刷出 → 内存占用可控</text>
  <text x="48" y="392" font-size="9.2" fill="#2f6f5f">· 可写到只能顺序追加的介质（管道/对象存储）</text>
  <text x="48" y="416" font-size="8.6" fill="#4c8567">代价：文件不可再改，追加数据须新写文件（与列存不可变一致）。</text>

  <rect x="505" y="286" width="465" height="150" rx="12" fill="#eef3fb" stroke="#bcd0ec" filter="url(#soft)"/>
  <text x="523" y="310" font-size="11" font-weight="700" fill="#1b2a4a">写者边写边攒（三样随行组累计）</text>
  <text x="523" y="332" font-size="9.2" fill="#5b7db1">· Statistics：每列 min/max/null_count/distinct</text>
  <text x="523" y="352" font-size="9.2" fill="#5b7db1">· 各页偏移：data_page_offset / dictionary_page_offset</text>
  <text x="523" y="372" font-size="9.2" fill="#5b7db1">· 编码集合与压缩 codec：记入 ColumnMetaData</text>
  <text x="523" y="392" font-size="9.2" fill="#5b7db1">· 可选：PageIndex（尾部集中）、布隆（列块附近）</text>
  <text x="523" y="416" font-size="8.6" fill="#7fa0c4">全部行组写完 → 一次组装 FileMetaData 写下（读路径倒序拿它）。</text>
</svg>
