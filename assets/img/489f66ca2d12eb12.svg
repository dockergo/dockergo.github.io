<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1120" height="620" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">CMP · 线性 / 二分 / 哈希：同一个「定位」问题，前提与空间买来不同的时间</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">从上到下看代价，从左到右看前提递增：无前提 → 需有序 → 需预建表。前提越强、越舍得空间，查询越快</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">占优</text>
  <rect x="110" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="128" y="82" font-size="10.5" fill="#3a3a3c">折中 / 有条件</text>
  <rect x="240" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="258" y="82" font-size="10.5" fill="#3a3a3c">短板</text>

  <!-- 表头 -->
  <rect x="30" y="100" width="250" height="46" rx="8" fill="#f2f3f5" stroke="#e4e7ec"/><text x="48" y="128" font-size="12" font-weight="700" fill="#3a3a3c">维度</text>
  <rect x="288" y="100" width="264" height="46" rx="8" fill="#f2f3f5" stroke="#e4e7ec"/><text x="420" y="128" font-size="13" font-weight="700" fill="#3a3a3c" text-anchor="middle">线性 Linear</text>
  <rect x="560" y="100" width="264" height="46" rx="8" fill="#eaf1fb" stroke="#c6d9f2"/><text x="692" y="128" font-size="13" font-weight="700" fill="#20375e" text-anchor="middle">二分 Binary</text>
  <rect x="832" y="100" width="258" height="46" rx="8" fill="#fdf3e0" stroke="#e7c07a"/><text x="961" y="128" font-size="13" font-weight="700" fill="#8a5a12" text-anchor="middle">哈希 Hash</text>

  <!-- 行1 时间复杂度 -->
  <rect x="30" y="152" width="250" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><text x="48" y="182" font-size="11.5" font-weight="700" fill="#3a3a3c">时间复杂度</text><text x="48" y="200" font-size="9.5" fill="#8e8e93">单次查询</text>
  <rect x="288" y="152" width="264" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="288" y="152" width="6" height="62" rx="3" fill="#d1544a"/><text x="308" y="182" font-size="11" fill="#3a3a3c">O(n)</text><text x="308" y="200" font-size="10" fill="#8a4038">逐个比对，最坏扫完全部</text>
  <rect x="560" y="152" width="264" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="560" y="152" width="6" height="62" rx="3" fill="#d99a2b"/><text x="580" y="182" font-size="11" fill="#3a3a3c">O(log n)</text><text x="580" y="200" font-size="10" fill="#8a5a12">每步排除一半区间</text>
  <rect x="832" y="152" width="258" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="832" y="152" width="6" height="62" rx="3" fill="#2f9e6e"/><text x="852" y="182" font-size="11" fill="#3a3a3c">O(1) 均摊</text><text x="852" y="200" font-size="10" fill="#1f6b4a">直达桶，最坏退化 O(n)</text>

  <!-- 行2 前提条件 -->
  <rect x="30" y="220" width="250" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><text x="48" y="250" font-size="11.5" font-weight="700" fill="#3a3a3c">前提条件</text><text x="48" y="268" font-size="9.5" fill="#8e8e93">查询前要求</text>
  <rect x="288" y="220" width="264" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="288" y="220" width="6" height="62" rx="3" fill="#2f9e6e"/><text x="308" y="250" font-size="11" fill="#3a3a3c">无</text><text x="308" y="268" font-size="10" fill="#1f6b4a">可无序、可链表，最灵活</text>
  <rect x="560" y="220" width="264" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="560" y="220" width="6" height="62" rx="3" fill="#d99a2b"/><text x="580" y="250" font-size="11" fill="#3a3a3c">数据需有序</text><text x="580" y="268" font-size="10" fill="#8a5a12">且要能随机访问</text>
  <rect x="832" y="220" width="258" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="832" y="220" width="6" height="62" rx="3" fill="#d99a2b"/><text x="852" y="250" font-size="11" fill="#3a3a3c">可哈希 + 预建表</text><text x="852" y="268" font-size="10" fill="#8a5a12">建表先花 O(n)</text>

  <!-- 行3 额外空间 -->
  <rect x="30" y="288" width="250" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><text x="48" y="318" font-size="11.5" font-weight="700" fill="#3a3a3c">额外空间</text><text x="48" y="336" font-size="9.5" fill="#8e8e93">数据之外</text>
  <rect x="288" y="288" width="264" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="288" y="288" width="6" height="62" rx="3" fill="#2f9e6e"/><text x="308" y="318" font-size="11" fill="#3a3a3c">O(1)</text><text x="308" y="336" font-size="10" fill="#1f6b4a">零额外结构</text>
  <rect x="560" y="288" width="264" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="560" y="288" width="6" height="62" rx="3" fill="#2f9e6e"/><text x="580" y="318" font-size="11" fill="#3a3a3c">O(1)</text><text x="580" y="336" font-size="10" fill="#1f6b4a">仅 lo / hi 两个指针</text>
  <rect x="832" y="288" width="258" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="832" y="288" width="6" height="62" rx="3" fill="#d1544a"/><text x="852" y="318" font-size="11" fill="#3a3a3c">O(n)</text><text x="852" y="336" font-size="10" fill="#8a4038">额外一张哈希表</text>

  <!-- 行4 结构 / 访问 -->
  <rect x="30" y="356" width="250" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><text x="48" y="386" font-size="11.5" font-weight="700" fill="#3a3a3c">结构 / 访问</text><text x="48" y="404" font-size="9.5" fill="#8e8e93">依赖什么</text>
  <rect x="288" y="356" width="264" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="288" y="356" width="6" height="62" rx="3" fill="#2f9e6e"/><text x="308" y="386" font-size="11" fill="#3a3a3c">数组或链表</text><text x="308" y="404" font-size="10" fill="#1f6b4a">顺序访问即可</text>
  <rect x="560" y="356" width="264" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="560" y="356" width="6" height="62" rx="3" fill="#d99a2b"/><text x="580" y="386" font-size="11" fill="#3a3a3c">有序数组</text><text x="580" y="404" font-size="10" fill="#8a5a12">靠下标随机访问中点</text>
  <rect x="832" y="356" width="258" height="62" rx="8" fill="#ffffff" stroke="#e4e7ec"/><rect x="832" y="356" width="6" height="62" rx="3" fill="#d99a2b"/><text x="852" y="386" font-size="11" fill="#3a3a3c">哈希表</text><text x="852" y="404" font-size="10" fill="#8a5a12">key 经哈希函数直达桶</text>

  <!-- 行5 适用场景 -->
  <rect x="30" y="424" width="250" height="62" rx="8" fill="#f8f9fb" stroke="#e4e7ec"/><text x="48" y="454" font-size="11.5" font-weight="700" fill="#3a3a3c">适用场景</text><text x="48" y="472" font-size="9.5" fill="#8e8e93">该选谁</text>
  <rect x="288" y="424" width="264" height="62" rx="8" fill="#f8f9fb" stroke="#e4e7ec"/><text x="304" y="452" font-size="10" fill="#4a4a4f">数据少 / 只查一次</text><text x="304" y="472" font-size="10" fill="#4a4a4f">无法排序或建表时兜底</text>
  <rect x="560" y="424" width="264" height="62" rx="8" fill="#f8f9fb" stroke="#e4e7ec"/><text x="576" y="452" font-size="10" fill="#4a4a4f">一次排序、多次查询</text><text x="576" y="472" font-size="10" fill="#4a4a4f">求边界 / 插入点 / 范围</text>
  <rect x="832" y="424" width="258" height="62" rx="8" fill="#f8f9fb" stroke="#e4e7ec"/><text x="848" y="452" font-size="10" fill="#4a4a4f">同批数据高频等值查</text><text x="848" y="472" font-size="10" fill="#4a4a4f">two-sum 补数 / 去重</text>

  <!-- 结论条 -->
  <rect x="30" y="502" width="1060" height="104" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="52" y="528" font-size="11" font-weight="700" fill="#20375e">选型直觉</text>
  <text x="150" y="528" font-size="10.5" fill="#4a4a4f">线性：无前提的保底；二分：有序数据里省内存的首选；哈希：肯为速度付出 O(n) 空间的高频等值查。</text>
  <text x="52" y="556" font-size="11" font-weight="700" fill="#8a5a12">核心权衡</text>
  <text x="150" y="556" font-size="10.5" fill="#4a4a4f">前提越强、越舍得空间，能买到的查询时间越低：O(n) → O(log n) → O(1)；拿不到前提就退回上一档。</text>
  <text x="52" y="584" font-size="11" font-weight="700" fill="#1f6b4a">一条主线</text>
  <text x="150" y="584" font-size="10.5" fill="#4a4a4f">二分的「命中不停」还能推广出最左/最右边界与插入点；哈希把「另一半是否存在」压到常数级判断。</text>
</svg>
