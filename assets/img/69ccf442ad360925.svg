<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="680" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">DC2 · 前序 + 中序重建二叉树：前序定「根」，中序在根处切出左右子树</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">哈希表 O(1) 把根定位到中序索引 m，据此分出左右子问题区间，递归重建 —— 示例 preorder=[3,9,2,1,7]，inorder=[9,3,1,2,7]</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">根 root</text>
  <rect x="130" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="148" y="82" font-size="10.5" fill="#3a3a3c">左子树段</text>
  <rect x="240" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="258" y="82" font-size="10.5" fill="#3a3a3c">右子树段</text>
  <rect x="350" y="72" width="12" height="12" rx="2" fill="#8a6fd0"/><text x="368" y="82" font-size="10.5" fill="#3a3a3c">哈希定位 / 边界</text>

  <!-- ===== ① 前序：定根 ===== -->
  <text x="40" y="116" font-size="12" font-weight="700" fill="#20375e">① 前序 preorder ＝ [ 根 | 左子树 | 右子树 ]，首元素即根</text>
  <g font-size="9" fill="#a1a1a6" text-anchor="middle">
    <text x="70" y="132">i=0</text><text x="136" y="132">1</text><text x="202" y="132">2</text><text x="268" y="132">3</text><text x="334" y="132">4</text>
  </g>
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="138" width="60" height="40" rx="6" fill="#fdf3e0" stroke="#e7c07a" stroke-width="1.8"/><text x="70" y="163" fill="#8a5a12" font-weight="700">3</text>
    <rect x="106" y="138" width="60" height="40" rx="6" fill="#e6f4ec" stroke="#a8ddc3"/><text x="136" y="163" fill="#1f6b47">9</text>
    <rect x="172" y="138" width="60" height="40" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="202" y="163" fill="#20375e">2</text>
    <rect x="238" y="138" width="60" height="40" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="268" y="163" fill="#20375e">1</text>
    <rect x="304" y="138" width="60" height="40" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="334" y="163" fill="#20375e">7</text>
  </g>
  <text x="70" y="196" font-size="9.5" fill="#8a5a12" text-anchor="middle">根</text>
  <text x="136" y="196" font-size="9.5" fill="#1f6b47" text-anchor="middle">左(1个)</text>
  <text x="268" y="196" font-size="9.5" fill="#20375e" text-anchor="middle">右(3个)</text>

  <!-- hashmap -->
  <rect x="410" y="118" width="210" height="132" rx="12" fill="#ffffff" stroke="#8a6fd0" stroke-width="1.3" filter="url(#soft)"/>
  <text x="424" y="140" font-size="11" font-weight="700" fill="#5b45a0">inorderMap（值 → 中序索引）</text>
  <text x="424" y="162" font-size="10.5" fill="#4a4a4f">9→0　　1→2　　7→4</text>
  <rect x="422" y="172" width="80" height="24" rx="6" fill="#f3eefb" stroke="#c8b8ee"/><text x="462" y="188" font-size="10.5" fill="#5b45a0" text-anchor="middle" font-weight="700">3 → m=1</text>
  <text x="512" y="188" font-size="10.5" fill="#4a4a4f">2→3</text>
  <text x="424" y="220" font-size="9.5" fill="#6e6e73">预建哈希表：查根位置</text>
  <text x="424" y="236" font-size="9.5" fill="#6e6e73">从 O(n) 扫描降到 O(1)</text>

  <line x1="70" y1="138" x2="70" y2="112" stroke="#d99a2b" stroke-width="0"/>
  <path d="M100 158 H120 V108 H410 V128" fill="none" stroke="#8a6fd0" stroke-width="1.6" marker-end="url(#aA)"/>
  <text x="250" y="102" font-size="9.5" fill="#8a5a12">取 preorder[0]=3 去哈希表查位置</text>

  <!-- ===== ② 中序：切分 ===== -->
  <text x="40" y="286" font-size="12" font-weight="700" fill="#20375e">② 中序 inorder ＝ [ 左子树 | 根 | 右子树 ]，在 m=1 处一刀切开</text>
  <g font-size="9" fill="#a1a1a6" text-anchor="middle">
    <text x="70" y="302">l=0</text><text x="136" y="302">m=1</text><text x="202" y="302">2</text><text x="268" y="302">3</text><text x="334" y="302">r=4</text>
  </g>
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="308" width="60" height="40" rx="6" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.5"/><text x="70" y="333" fill="#1f6b47">9</text>
    <rect x="106" y="308" width="60" height="40" rx="6" fill="#fdf3e0" stroke="#e7c07a" stroke-width="1.8"/><text x="136" y="333" fill="#8a5a12" font-weight="700">3</text>
    <rect x="172" y="308" width="60" height="40" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/><text x="202" y="333" fill="#20375e">1</text>
    <rect x="238" y="308" width="60" height="40" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/><text x="268" y="333" fill="#20375e">2</text>
    <rect x="304" y="308" width="60" height="40" rx="6" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.3"/><text x="334" y="333" fill="#20375e">7</text>
  </g>
  <text x="70" y="366" font-size="9.5" fill="#1f6b47" text-anchor="middle">左区间[0,0]</text>
  <text x="136" y="366" font-size="9.5" fill="#8a5a12" text-anchor="middle">根 m</text>
  <text x="268" y="366" font-size="9.5" fill="#20375e" text-anchor="middle">右区间[2,4]</text>

  <!-- 区间公式 -->
  <rect x="40" y="392" width="580" height="140" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="62" y="416" font-size="12" font-weight="700" fill="#1d1d1f">子问题区间：i＝根在 preorder 的索引，[l,r]＝子树在 inorder 的区间</text>
  <text x="62" y="444" font-size="11" fill="#4a4a4f">当前树　　根 i＝0　　inorder [l,r]＝[0,4]　　m＝1</text>
  <text x="62" y="472" font-size="11" fill="#1f6b47">左子树　　根 i+1＝1　　　　　inorder [l, m−1]＝[0,0]</text>
  <text x="62" y="500" font-size="11" fill="#20375e">右子树　　根 i+1+(m−l)＝2　　inorder [m+1, r]＝[2,4]</text>
  <text x="62" y="522" font-size="9.5" fill="#6e6e73">(m−l) ＝ 左子树节点数，用来跳过前序里整段左子树，定位右子树的根。</text>

  <!-- ===== ③ 递归重建结果树 ===== -->
  <rect x="640" y="118" width="450" height="414" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="662" y="144" font-size="13" font-weight="700" fill="#1d1d1f">③ 对左右区间递归 → 重建结果树</text>
  <text x="662" y="164" font-size="10" fill="#6e6e73">向下「递」建节点，向上「归」连边；区间为空(r−l&lt;0)则返回 nil</text>

  <!-- 树节点 -->
  <!-- root 3 -->
  <circle cx="865" cy="210" r="26" fill="#fdf3e0" stroke="#e7c07a" stroke-width="1.8"/><text x="865" y="216" font-size="16" font-weight="700" fill="#8a5a12" text-anchor="middle">3</text>
  <text x="865" y="184" font-size="9" fill="#6e6e73" text-anchor="middle">i=0 [0,4]</text>
  <!-- left 9 -->
  <circle cx="765" cy="300" r="24" fill="#e6f4ec" stroke="#2f9e6e" stroke-width="1.6"/><text x="765" y="306" font-size="15" font-weight="700" fill="#1f6b47" text-anchor="middle">9</text>
  <text x="765" y="340" font-size="9" fill="#6e6e73" text-anchor="middle">i=1 [0,0]</text>
  <!-- right 2 -->
  <circle cx="965" cy="300" r="24" fill="#eaf1fb" stroke="#4a7fd0" stroke-width="1.6"/><text x="965" y="306" font-size="15" font-weight="700" fill="#20375e" text-anchor="middle">2</text>
  <text x="965" y="266" font-size="9" fill="#6e6e73" text-anchor="middle">i=2 [2,4]</text>
  <!-- 2 children: 1 and 7 -->
  <circle cx="905" cy="400" r="22" fill="#eaf1fb" stroke="#c6d9f2"/><text x="905" y="406" font-size="14" fill="#20375e" text-anchor="middle">1</text>
  <text x="905" y="436" font-size="9" fill="#a1a1a6" text-anchor="middle">i=3 [2,2]</text>
  <circle cx="1025" cy="400" r="22" fill="#eaf1fb" stroke="#c6d9f2"/><text x="1025" y="406" font-size="14" fill="#20375e" text-anchor="middle">7</text>
  <text x="1025" y="436" font-size="9" fill="#a1a1a6" text-anchor="middle">i=4 [4,4]</text>

  <!-- edges orthogonal -->
  <path d="M865 236 V268 H765 V276" fill="none" stroke="#2f9e6e" stroke-width="1.6"/>
  <path d="M865 236 V268 H965 V276" fill="none" stroke="#4a7fd0" stroke-width="1.6"/>
  <path d="M965 324 V368 H905 V378" fill="none" stroke="#4a7fd0" stroke-width="1.4"/>
  <path d="M965 324 V368 H1025 V378" fill="none" stroke="#4a7fd0" stroke-width="1.4"/>

  <text x="662" y="480" font-size="10.5" fill="#4a4a4f">左子树 [0,0] 仅 1 个节点 → 叶子 9；右子树 [2,4] 再以同法切分，</text>
  <text x="662" y="498" font-size="10.5" fill="#4a4a4f">根 2 定位在中序索引 3，分出左 [1] 与右 [7]，各自成叶。</text>
  <text x="662" y="520" font-size="10.5" fill="#8a5a12">还原 preorder 3,9,2,1,7 / inorder 9,3,1,2,7 的唯一二叉树。</text>

  <!-- 底部 -->
  <rect x="40" y="552" width="1050" height="104" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="62" y="578" font-size="12" font-weight="700" fill="#8a5a12">复杂度与取舍</text>
  <text x="62" y="602" font-size="10.5" fill="#4a4a4f">• 每个节点恰被创建一次，共 n 个节点；哈希表把「在中序里找根」从每次 O(n) 降到 O(1)，总时间 <tspan font-weight="700" fill="#2f9e6e">O(n)</tspan>。</text>
  <text x="62" y="624" font-size="10.5" fill="#4a4a4f">• 前提：节点值互不重复（否则中序定位有歧义）。前序给「根」、中序给「左右边界」，二者信息互补才可唯一重建。</text>
  <text x="62" y="646" font-size="10.5" fill="#4a4a4f">• 分治三要素在此成立：子问题同构（仍是「前序+中序建树」）· 左右子树互不重叠 · 子树接到根上即完成合并。</text>
</svg>
