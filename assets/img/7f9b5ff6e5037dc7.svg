<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="600" viewBox="0 0 1140 600" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2aa0a4"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d1544a"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a5cae"/></marker>
    <marker id="aBk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#8a8a8f"/></marker>
  </defs>
  <rect width="1140" height="600" fill="#fbfbfd"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1d1d1f">nginx proxy_next_upstream · 一个 upstream 失败后自动改投下一个，让瞬时故障对客户端透明——但重试本身不检查请求是否幂等</text>
  <text x="30" y="53" font-size="10.5" fill="#6e6e73">判定"失败"的条件与 B1 被动健康检查共享（超时/5xx/429 等）；这里的重点是：重试动作本身安全与否，取决于被重试的方法是否幂等</text>

  <!-- 图例 -->
  <line x1="30" y1="80" x2="54" y2="80" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>
  <text x="60" y="84" font-size="10" fill="#3a3a3c">首次请求 → 失败</text>
  <line x1="200" y1="80" x2="224" y2="80" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <text x="230" y="84" font-size="10" fill="#3a3a3c">自动改投下一个 upstream</text>
  <line x1="430" y1="80" x2="454" y2="80" stroke="#d1544a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aR)"/>
  <text x="460" y="84" font-size="10" fill="#3a3a3c">非幂等重试 → 副作用风险</text>
  <text x="1110" y="84" font-size="10" fill="#a1a1a6" text-anchor="end">nginx · 源码级核实</text>
  <line x1="30" y1="96" x2="1110" y2="96" stroke="#e4e7ec" stroke-width="1"/>

  <!-- Panel A: 正常重试路径 -->
  <rect x="30" y="112" width="1080" height="164" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="52" y="138" font-size="13" font-weight="700" fill="#1d1d1f">① 正常路径：第一个 upstream 失败，nginx 自动改投下一个，客户端无感知</text>

  <rect x="52" y="154" width="130" height="98" rx="10" fill="#ffffff" stroke="#d9dde4"/>
  <text x="117" y="180" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">客户端</text>
  <text x="117" y="200" font-size="8.5" fill="#6e6e73" text-anchor="middle">发出一次请求</text>
  <text x="117" y="218" font-size="8.5" fill="#6e6e73" text-anchor="middle">只看到最终结果</text>
  <text x="117" y="236" font-size="8.5" fill="#8a97ab" text-anchor="middle">对重试过程无感</text>

  <line x1="182" y1="200" x2="222" y2="200" stroke="#2aa0a4" stroke-width="2" marker-end="url(#aT)"/>

  <rect x="222" y="154" width="150" height="98" rx="10" fill="#fbe6e3" stroke="#e8a79f"/>
  <text x="297" y="180" font-size="10.5" font-weight="600" fill="#8a4038" text-anchor="middle">upstream A</text>
  <text x="297" y="200" font-size="8.5" fill="#8a4038" text-anchor="middle">超时 / 5xx / 429</text>
  <text x="297" y="220" font-size="8.5" fill="#b06a60" text-anchor="middle">判定条件与 B1 共享</text>
  <text x="297" y="238" font-size="8" fill="#b06a60" text-anchor="middle">（ngx_http_upstream_next）</text>

  <line x1="372" y1="200" x2="412" y2="200" stroke="#8a5cae" stroke-width="2" marker-end="url(#aP)"/>
  <text x="376" y="192" font-size="8.5" fill="#5a3a7a">proxy_next_upstream</text>

  <rect x="412" y="154" width="150" height="98" rx="10" fill="#eaf6f0" stroke="#bfe3d1"/>
  <text x="487" y="180" font-size="10.5" font-weight="600" fill="#2f6b4e" text-anchor="middle">upstream B</text>
  <text x="487" y="200" font-size="8.5" fill="#2f6b4e" text-anchor="middle">处理成功</text>
  <text x="487" y="220" font-size="8.5" fill="#3f8a63" text-anchor="middle">返回结果给客户端</text>

  <line x1="562" y1="200" x2="602" y2="200" stroke="#2f9e6e" stroke-width="2" marker-end="url(#aBk)"/>

  <rect x="602" y="154" width="150" height="98" rx="10" fill="#ffffff" stroke="#d9dde4"/>
  <text x="677" y="180" font-size="10.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">客户端收到响应</text>
  <text x="677" y="200" font-size="8.5" fill="#6e6e73" text-anchor="middle">一次请求 · 一次响应</text>
  <text x="677" y="220" font-size="8.5" fill="#6e6e73" text-anchor="middle">瞬时故障已自愈</text>

  <rect x="778" y="154" width="312" height="98" rx="10" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="934" y="176" font-size="10" font-weight="700" fill="#1d1d1f" text-anchor="middle">这一层解决什么问题</text>
  <text x="792" y="198" font-size="8.5" fill="#4a4a4f">upstream A 的故障多半是瞬时的</text>
  <text x="792" y="216" font-size="8.5" fill="#4a4a4f">（重启/短暂过载）——换一个目标</text>
  <text x="792" y="234" font-size="8.5" fill="#4a4a4f">重试，让这类故障对用户透明。</text>

  <!-- Panel B: 风险警示——非幂等方法 -->
  <rect x="30" y="294" width="1080" height="140" rx="14" fill="#fbe6e3" stroke="#e8a79f" filter="url(#soft)"/>
  <text x="52" y="320" font-size="12.5" font-weight="800" fill="#8a4038">⚠ 风险：proxy_next_upstream 不检查请求是否幂等——重试非幂等方法有真实副作用</text>
  <text x="52" y="344" font-size="9.5" fill="#7a5a1a">场景：客户端 POST /pay/charge 到 upstream A；A 其实已经处理了扣款请求，只是响应包在返回途中超时——nginx 判定为失败，</text>
  <text x="52" y="362" font-size="9.5" fill="#7a5a1a">自动把同一个 POST 请求重发给 upstream B。如果 upstream B 独立处理这个请求（没有去重机制），后端可能被扣款两次。</text>
  <text x="52" y="384" font-size="9.5" fill="#7a5a1a">这不是 nginx 的 bug——proxy_next_upstream 的设计目标只是"换目标重试"，它无法也不负责判断"这个请求重复执行是否安全"，</text>
  <text x="52" y="402" font-size="9.5" font-weight="700" fill="#8a4038">这个判断责任在于：请求本身是否幂等（GET/PUT 天然更安全，非幂等 POST 需要应用层或幂等键机制兜底）。</text>
  <text x="52" y="422" font-size="9" fill="#b06a60">这类风险不是配置失误才会触发，而是"自动重试"这个能力本身的固有代价——用不用、对哪些方法用，需要调用方对幂等性有清醒判断。</text>

  <!-- Panel C: 与 B4 的显式连接 -->
  <rect x="30" y="450" width="1080" height="110" rx="14" fill="#f4eefb" stroke="#dcc9ef" filter="url(#soft)"/>
  <text x="52" y="476" font-size="12" font-weight="800" fill="#6f3ea8">安全重试的前提是幂等——见 B4</text>
  <line x1="52" y1="486" x2="1086" y2="486" stroke="#dcc9ef" stroke-width="1"/>
  <text x="52" y="506" font-size="9.5" fill="#5a3a7a">Kafka 幂等生产者（B4）展示了另一条路：把"重复是否安全"这件事从"客户端别重试"变成"broker 端识别并丢弃重复"——</text>
  <text x="52" y="524" font-size="9.5" fill="#5a3a7a">PID + 序列号让 broker 能分辨"这是重发的同一条消息"还是"两条不同的消息"，于是重试本身不再有副作用，可以放心做。</text>
  <text x="52" y="544" font-size="9.5" font-weight="700" fill="#5a3a7a">B5 这里没有等价的去重机制，因此重试的安全性完全依赖上游请求本身幂等——这正是"重试为何必须配幂等"的具体反例。</text>

  <line x1="1050" y1="450" x2="1050" y2="392" stroke="#8a5cae" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aP)"/>
</svg>
