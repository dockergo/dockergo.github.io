<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#0f9e8e"/></marker></defs>
  <rect width="1000" height="440" fill="#fbfbfd"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Parquet 原理 · 字典编码（RLE_DICTIONARY，字典页居首）</text>
  <text x="30" y="50" font-size="10.5" fill="#a1a1a6">低基数列：把不同值收进字典页,数据页只存“下标”并用 RLE/bit-pack 编码;字典页必须放列块首位,至多一个</text>

  <!-- 原始列 -->
  <text x="30" y="80" font-size="11" font-weight="700" fill="#1b2a4a">原始列（高重复，低基数）</text>
  <g text-anchor="middle" font-size="8.8">
    <rect x="30" y="92" width="86" height="34" rx="7" fill="#eef3fb" stroke="#bcd0ec"/><text x="73" y="114" fill="#1b2a4a">"CN"</text>
    <rect x="122" y="92" width="86" height="34" rx="7" fill="#eef3fb" stroke="#bcd0ec"/><text x="165" y="114" fill="#1b2a4a">"US"</text>
    <rect x="214" y="92" width="86" height="34" rx="7" fill="#eef3fb" stroke="#bcd0ec"/><text x="257" y="114" fill="#1b2a4a">"CN"</text>
    <rect x="306" y="92" width="86" height="34" rx="7" fill="#eef3fb" stroke="#bcd0ec"/><text x="349" y="114" fill="#1b2a4a">"CN"</text>
    <rect x="398" y="92" width="86" height="34" rx="7" fill="#eef3fb" stroke="#bcd0ec"/><text x="441" y="114" fill="#1b2a4a">"JP"</text>
    <rect x="490" y="92" width="86" height="34" rx="7" fill="#eef3fb" stroke="#bcd0ec"/><text x="533" y="114" fill="#1b2a4a">"US"</text>
  </g>

  <path d="M300,132 L300,158" stroke="#0f9e8e" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="310" y="152" font-size="8.4" fill="#0f9e8e">去重建字典 + 转下标</text>

  <!-- 字典页 -->
  <rect x="30" y="170" width="300" height="140" rx="12" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)"/>
  <text x="46" y="194" font-size="10.5" font-weight="700" fill="#5a3410">字典页（列块首位 · DictionaryPageHeader）</text>
  <g text-anchor="middle" font-size="9">
    <rect x="46" y="206" width="120" height="30" rx="6" fill="#fff" stroke="#efdcb4"/><text x="106" y="226" fill="#5a3410">0 → "CN"</text>
    <rect x="176" y="206" width="120" height="30" rx="6" fill="#fff" stroke="#efdcb4"/><text x="236" y="226" fill="#5a3410">1 → "US"</text>
    <rect x="46" y="244" width="120" height="30" rx="6" fill="#fff" stroke="#efdcb4"/><text x="106" y="264" fill="#5a3410">2 → "JP"</text>
    <rect x="176" y="244" width="120" height="30" rx="6" fill="#f7f0e4" stroke="#e6d8c4"/><text x="236" y="264" fill="#93762e">值本身用 PLAIN 存</text>
  </g>
  <text x="46" y="296" font-size="8.4" fill="#93762e">至多一个字典页,居首;字典过大则该列回退 PLAIN。</text>

  <!-- 数据页 下标 -->
  <rect x="360" y="170" width="610" height="140" rx="12" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)"/>
  <text x="376" y="194" font-size="10.5" font-weight="700" fill="#0a3d78">数据页（RLE_DICTIONARY = 8）· 只存下标</text>
  <g text-anchor="middle" font-size="9.5">
    <rect x="376" y="206" width="60" height="34" rx="6" fill="#fff" stroke="#a9ccf5"/><text x="406" y="228" fill="#0a3d78">0</text>
    <rect x="442" y="206" width="60" height="34" rx="6" fill="#fff" stroke="#a9ccf5"/><text x="472" y="228" fill="#0a3d78">1</text>
    <rect x="508" y="206" width="60" height="34" rx="6" fill="#fff" stroke="#a9ccf5"/><text x="538" y="228" fill="#0a3d78">0</text>
    <rect x="574" y="206" width="60" height="34" rx="6" fill="#fff" stroke="#a9ccf5"/><text x="604" y="228" fill="#0a3d78">0</text>
    <rect x="640" y="206" width="60" height="34" rx="6" fill="#fff" stroke="#a9ccf5"/><text x="670" y="228" fill="#0a3d78">2</text>
    <rect x="706" y="206" width="60" height="34" rx="6" fill="#fff" stroke="#a9ccf5"/><text x="736" y="228" fill="#0a3d78">1</text>
  </g>
  <text x="376" y="266" font-size="8.6" fill="#2a5a92">下标序列再用 RLE/Bit-Packing 编码：位宽只需 ⌈log2(字典大小)⌉ 位</text>
  <text x="376" y="286" font-size="8.6" fill="#2a5a92">"CN CN" 连续 → RLE run 进一步压缩</text>
  <text x="376" y="302" font-size="8.4" fill="#5b7db1">首字节记下标位宽,其后是标准 RLE/bit-pack 流</text>

  <rect x="30" y="322" width="940" height="96" rx="12" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)"/>
  <text x="48" y="346" font-size="11" font-weight="700" fill="#12402a">收益与规则</text>
  <text x="48" y="368" font-size="9.4" fill="#2f6f5f">· 长字符串/低基数：字典把重复值存一次,数据页仅存小整数下标 → 空间与解码都快</text>
  <text x="48" y="388" font-size="9.4" fill="#2f6f5f">· 字典可跨页共享（一个列块一个字典）;超阈值时该列块放弃字典,数据页改用 PLAIN 等</text>
  <text x="48" y="408" font-size="8.6" fill="#4c8567">PLAIN_DICTIONARY(=2) 已弃用,等价语义用 RLE_DICTIONARY(=8);字典本身的值用 PLAIN 编码存在字典页里。</text>
</svg>
