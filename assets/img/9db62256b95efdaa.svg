<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="680" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">动态规划 · 对比：背包家族的遍历方向　+　爬楼梯四步演进的时间 / 空间</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">背包家族只差「一维遍历方向」；四步演进则是同一递推式在「时间 / 空间 / 是否递归」上的逐级优化</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">状态 / 转移</text>
  <rect x="150" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="168" y="82" font-size="10.5" fill="#3a3a3c">高效 / 结果</text>
  <rect x="270" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="288" y="82" font-size="10.5" fill="#3a3a3c">关键取舍</text>
  <rect x="390" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="408" y="82" font-size="10.5" fill="#3a3a3c">低效 / 指数</text>

  <!-- ① 背包家族 -->
  <text x="30" y="112" font-size="12" font-weight="700" fill="#8a5a12">① 背包家族：转移「选」项引用哪一行 → 决定一维遍历方向（唯一区别）</text>
  <!-- header -->
  <g font-size="10.5" font-weight="700" fill="#3a3a3c">
    <rect x="40" y="120" width="150" height="34" fill="#eef1f5" stroke="#e4e7ec"/><text x="115" y="142" text-anchor="middle">变体</text>
    <rect x="190" y="120" width="130" height="34" fill="#eef1f5" stroke="#e4e7ec"/><text x="255" y="142" text-anchor="middle">物品可选次数</text>
    <rect x="320" y="120" width="230" height="34" fill="#eef1f5" stroke="#e4e7ec"/><text x="435" y="142" text-anchor="middle">「选」项引用</text>
    <rect x="550" y="120" width="170" height="34" fill="#eef1f5" stroke="#e4e7ec"/><text x="635" y="142" text-anchor="middle">一维遍历方向</text>
    <rect x="720" y="120" width="360" height="34" fill="#eef1f5" stroke="#e4e7ec"/><text x="900" y="142" text-anchor="middle">典型题 / 合并算子</text>
  </g>
  <!-- row 0-1 -->
  <g font-size="10.5">
    <rect x="40" y="154" width="150" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="52" y="182" font-weight="700" fill="#20375e">0-1 背包 · DP3</text>
    <rect x="190" y="154" width="130" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="255" y="182" text-anchor="middle" fill="#4a4a4f">至多 1 次</text>
    <rect x="320" y="154" width="230" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="332" y="182" fill="#4a4a4f">上一行 dp[i-1][c-w]+v</text>
    <rect x="550" y="154" width="170" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="635" y="182" text-anchor="middle" font-weight="700" fill="#2f9e6e">逆序 c: cap→1</text>
    <rect x="720" y="154" width="360" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="732" y="182" fill="#4a4a4f">选物品使价值最大化（max）</text>
  </g>
  <!-- row 完全 -->
  <g font-size="10.5">
    <rect x="40" y="200" width="150" height="46" fill="#fdf9f0" stroke="#e4e7ec"/><text x="52" y="228" font-weight="700" fill="#8a5a12">完全背包 · DP4</text>
    <rect x="190" y="200" width="130" height="46" fill="#fdf9f0" stroke="#e4e7ec"/><text x="255" y="228" text-anchor="middle" fill="#4a4a4f">无限次</text>
    <rect x="320" y="200" width="230" height="46" fill="#fdf9f0" stroke="#e4e7ec"/><text x="332" y="228" fill="#8a5a12">本行 dp[i][c-w]+v</text>
    <rect x="550" y="200" width="170" height="46" fill="#fdf9f0" stroke="#e4e7ec"/><text x="635" y="228" text-anchor="middle" font-weight="700" fill="#d99a2b">正序 c: 1→cap</text>
    <rect x="720" y="200" width="360" height="46" fill="#fdf9f0" stroke="#e4e7ec"/><text x="732" y="228" fill="#4a4a4f">物品可重复放（max）</text>
  </g>
  <!-- row 零钱 -->
  <g font-size="10.5">
    <rect x="40" y="246" width="150" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="52" y="274" font-weight="700" fill="#8a5a12">零钱兑换 · DP4</text>
    <rect x="190" y="246" width="130" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="255" y="274" text-anchor="middle" fill="#4a4a4f">无限次</text>
    <rect x="320" y="246" width="230" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="332" y="274" fill="#8a5a12">本行 dp[a-coin]+1</text>
    <rect x="550" y="246" width="170" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="635" y="274" text-anchor="middle" font-weight="700" fill="#d99a2b">正序 a: 1→amt</text>
    <rect x="720" y="246" width="360" height="46" fill="#ffffff" stroke="#e4e7ec"/><text x="732" y="274" fill="#4a4a4f">凑金额最少硬币数（min，+1）</text>
  </g>
  <text x="40" y="312" font-size="10" fill="#6e6e73">口诀：<tspan font-weight="700" fill="#2f9e6e">方向</tspan> 管「同一物品能否复选」（逆序=否 / 正序=是），<tspan font-weight="700" fill="#d99a2b">算子</tspan> 管「求什么」（max 价值 / min 步数 / 累加计数）——两者正交。</text>

  <!-- ② 四步演进 -->
  <text x="30" y="352" font-size="12" font-weight="700" fill="#8a5a12">② 爬楼梯四步演进：同一递推式 dp[i]=dp[i-1]+dp[i-2]，逐级消除重复、递归与冗余空间</text>
  <!-- header -->
  <g font-size="10.5" font-weight="700" fill="#3a3a3c">
    <rect x="40" y="360" width="180" height="34" fill="#eef1f5" stroke="#e4e7ec"/><text x="130" y="382" text-anchor="middle">阶段</text>
    <rect x="220" y="360" width="130" height="34" fill="#eef1f5" stroke="#e4e7ec"/><text x="285" y="382" text-anchor="middle">时间</text>
    <rect x="350" y="360" width="150" height="34" fill="#eef1f5" stroke="#e4e7ec"/><text x="425" y="382" text-anchor="middle">空间</text>
    <rect x="500" y="360" width="580" height="34" fill="#eef1f5" stroke="#e4e7ec"/><text x="790" y="382" text-anchor="middle">相对上一阶段消除了什么</text>
  </g>
  <!-- row1 暴力 -->
  <g font-size="10.5">
    <rect x="40" y="394" width="180" height="42" fill="#ffffff" stroke="#e4e7ec"/><text x="52" y="420" font-weight="700" fill="#8a4038">① 暴力回溯</text>
    <rect x="220" y="394" width="130" height="42" fill="#ffffff" stroke="#e4e7ec"/><text x="285" y="420" text-anchor="middle" font-weight="700" fill="#d1544a">O(2ⁿ)</text>
    <rect x="350" y="394" width="150" height="42" fill="#ffffff" stroke="#e4e7ec"/><text x="425" y="420" text-anchor="middle" fill="#4a4a4f">O(n) 递归栈</text>
    <rect x="500" y="394" width="580" height="42" fill="#ffffff" stroke="#e4e7ec"/><text x="512" y="420" fill="#4a4a4f">基准：重叠子问题被整棵子树重复展开</text>
  </g>
  <!-- row2 记忆化 -->
  <g font-size="10.5">
    <rect x="40" y="436" width="180" height="42" fill="#fafbfc" stroke="#e4e7ec"/><text x="52" y="462" font-weight="700" fill="#20375e">② 记忆化搜索</text>
    <rect x="220" y="436" width="130" height="42" fill="#fafbfc" stroke="#e4e7ec"/><text x="285" y="462" text-anchor="middle" font-weight="700" fill="#2f9e6e">O(n)</text>
    <rect x="350" y="436" width="150" height="42" fill="#fafbfc" stroke="#e4e7ec"/><text x="425" y="462" text-anchor="middle" fill="#4a4a4f">O(n) 表 + 栈</text>
    <rect x="500" y="436" width="580" height="42" fill="#fafbfc" stroke="#e4e7ec"/><text x="512" y="462" fill="#4a4a4f">用 mem[] 缓存 → 消除重复计算（时间指数→线性）</text>
  </g>
  <!-- row3 递推 -->
  <g font-size="10.5">
    <rect x="40" y="478" width="180" height="42" fill="#ffffff" stroke="#e4e7ec"/><text x="52" y="504" font-weight="700" fill="#20375e">③ DP 递推</text>
    <rect x="220" y="478" width="130" height="42" fill="#ffffff" stroke="#e4e7ec"/><text x="285" y="504" text-anchor="middle" font-weight="700" fill="#2f9e6e">O(n)</text>
    <rect x="350" y="478" width="150" height="42" fill="#ffffff" stroke="#e4e7ec"/><text x="425" y="504" text-anchor="middle" fill="#4a4a4f">O(n) 表</text>
    <rect x="500" y="478" width="580" height="42" fill="#ffffff" stroke="#e4e7ec"/><text x="512" y="504" fill="#4a4a4f">自底向上填表 → 消除递归栈开销、避免栈溢出</text>
  </g>
  <!-- row4 压缩 -->
  <g font-size="10.5">
    <rect x="40" y="520" width="180" height="42" fill="#fdf9f0" stroke="#e4e7ec"/><text x="52" y="546" font-weight="700" fill="#8a5a12">④ 状态压缩</text>
    <rect x="220" y="520" width="130" height="42" fill="#fdf9f0" stroke="#e4e7ec"/><text x="285" y="546" text-anchor="middle" font-weight="700" fill="#2f9e6e">O(n)</text>
    <rect x="350" y="520" width="150" height="42" fill="#fdf9f0" stroke="#e4e7ec"/><text x="425" y="546" text-anchor="middle" font-weight="700" fill="#d99a2b">O(1)</text>
    <rect x="500" y="520" width="580" height="42" fill="#fdf9f0" stroke="#e4e7ec"/><text x="512" y="546" fill="#4a4a4f">转移只依赖最近两项 → 滚动变量消除整表（代价：丢失路径）</text>
  </g>
  <line x1="285" y1="576" x2="425" y2="576" stroke="#d99a2b" stroke-width="1.6" marker-end="url(#aA)"/>
  <text x="440" y="580" font-size="9.5" fill="#6e6e73">时间早在②就降到线性，后两步专注砍空间与递归开销</text>

  <text x="30" y="620" font-size="10.5" fill="#6e6e73">选型：能写出转移方程即可先记忆化验证正确，再改递推求稳与快；转移窗口很窄时再上滚动数组压空间。</text>
  <text x="30" y="642" font-size="10" fill="#8a5a12">二维 DP（最小路径和 / 编辑距离）同理：先二维表跑通，再按「只依赖上一行」压成一维，注意首行首列边界的特判。</text>
</svg>
