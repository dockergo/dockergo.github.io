<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#4a7fd0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#d99a2b"/></marker>
  </defs>
  <rect width="1120" height="700" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">搜索 · 原理总览：在数据中定位 target 的三条路线 —— 前提决定上界，越快代价越高</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">同一个问题「给定 target，返回其下标或不存在」，能用哪条路取决于数据前提：是否有序、是否愿为速度预付空间</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#4a7fd0"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">控制 / 指针</text>
  <rect x="160" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="178" y="82" font-size="10.5" fill="#3a3a3c">数据 / 存储</text>
  <rect x="290" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="308" y="82" font-size="10.5" fill="#3a3a3c">命中 / 成功</text>
  <rect x="420" y="72" width="12" height="12" rx="2" fill="#d1544a"/><text x="438" y="82" font-size="10.5" fill="#3a3a3c">淘汰 / 未命中</text>

  <!-- ===== ① 三条路线卡片 ===== -->
  <text x="30" y="112" font-size="12" font-weight="700" fill="#8a5a12">① 三条定位路线（target = 命中目标）</text>

  <!-- 卡片 A 线性 -->
  <rect x="30" y="122" width="342" height="256" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="50" y="148" font-size="13" font-weight="700" fill="#1d1d1f">线性查找 · 任意数据</text>
  <text x="50" y="167" font-size="10" fill="#6e6e73">无需任何前提，逐个比对到命中或到底</text>
  <!-- mini 无序数组 -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="50" y="184" width="42" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="71" y="203" fill="#5a4a2a">4</text>
    <rect x="96" y="184" width="42" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="117" y="203" fill="#5a4a2a">2</text>
    <rect x="142" y="184" width="42" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="163" y="203" fill="#5a4a2a">7</text>
    <rect x="188" y="184" width="42" height="30" rx="5" fill="#e7f5ee" stroke="#9dd3ba"/><text x="209" y="203" fill="#1f6b4a">9</text>
    <rect x="234" y="184" width="42" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="255" y="203" fill="#5a4a2a">5</text>
    <rect x="280" y="184" width="42" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="301" y="203" fill="#5a4a2a">1</text>
  </g>
  <line x1="50" y1="228" x2="322" y2="228" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="50" y="244" font-size="10" fill="#4a7fd0">i 从 0 逐格右移，比对 nums[i]==target</text>
  <text x="209" y="176" font-size="9" fill="#1f6b4a" text-anchor="middle">↓ 命中</text>
  <!-- 徽章 -->
  <rect x="50" y="262" width="272" height="98" rx="10" fill="#fbfbfd" stroke="#eceef1"/>
  <text x="66" y="284" font-size="10.5" fill="#3a3a3c"><tspan font-weight="700" fill="#8a4038">时间</tspan>　O(n)　最坏扫完全部</text>
  <text x="66" y="308" font-size="10.5" fill="#3a3a3c"><tspan font-weight="700" fill="#20375e">前提</tspan>　无　—　可无序、可链表</text>
  <text x="66" y="332" font-size="10.5" fill="#3a3a3c"><tspan font-weight="700" fill="#1f6b4a">空间</tspan>　O(1)　零额外结构</text>
  <text x="66" y="352" font-size="9.5" fill="#8e8e93">数据量小 / 只查一次 / 无法排序时的兜底</text>

  <!-- 卡片 B 二分 -->
  <rect x="388" y="122" width="342" height="256" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="408" y="148" font-size="13" font-weight="700" fill="#1d1d1f">二分查找 · 必须有序</text>
  <text x="408" y="167" font-size="10" fill="#6e6e73">比中点，每次排除一半区间</text>
  <!-- mini 有序数组 -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="408" y="184" width="42" height="30" rx="5" fill="#fbe6e3" stroke="#e8a79f"/><text x="429" y="203" fill="#8a4038">1</text>
    <rect x="454" y="184" width="42" height="30" rx="5" fill="#fbe6e3" stroke="#e8a79f"/><text x="475" y="203" fill="#8a4038">3</text>
    <rect x="500" y="184" width="42" height="30" rx="5" fill="#fbe6e3" stroke="#e8a79f"/><text x="521" y="203" fill="#8a4038">5</text>
    <rect x="546" y="184" width="42" height="30" rx="5" fill="#eaf1fb" stroke="#9dbdea" stroke-width="1.5"/><text x="567" y="203" fill="#20375e" font-weight="700">7</text>
    <rect x="592" y="184" width="42" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="613" y="203" fill="#5a4a2a">9</text>
    <rect x="638" y="184" width="42" height="30" rx="5" fill="#fdf3e0" stroke="#e7c07a"/><text x="659" y="203" fill="#5a4a2a">11</text>
  </g>
  <text x="567" y="176" font-size="9" fill="#20375e" text-anchor="middle">mid</text>
  <text x="475" y="230" font-size="9" fill="#8a4038" text-anchor="middle">✗ 弃左半</text>
  <text x="636" y="230" font-size="9" fill="#5a4a2a" text-anchor="middle">保留右半 →</text>
  <line x1="592" y1="242" x2="680" y2="242" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <!-- 徽章 -->
  <rect x="408" y="262" width="272" height="98" rx="10" fill="#fbfbfd" stroke="#eceef1"/>
  <text x="424" y="284" font-size="10.5" fill="#3a3a3c"><tspan font-weight="700" fill="#1f6b4a">时间</tspan>　O(log n)　对数级收缩</text>
  <text x="424" y="308" font-size="10.5" fill="#3a3a3c"><tspan font-weight="700" fill="#8a4038">前提</tspan>　有序 + 随机访问（数组）</text>
  <text x="424" y="332" font-size="10.5" fill="#3a3a3c"><tspan font-weight="700" fill="#1f6b4a">空间</tspan>　O(1)　仅需 lo / hi 指针</text>
  <text x="424" y="352" font-size="9.5" fill="#8e8e93">一次排序、多次查询 / 求边界与插入点</text>

  <!-- 卡片 C 哈希 -->
  <rect x="746" y="122" width="344" height="256" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="766" y="148" font-size="13" font-weight="700" fill="#1d1d1f">哈希查找 · 空间换时间</text>
  <text x="766" y="167" font-size="10" fill="#6e6e73">预建 key→下标 表，一步直达桶</text>
  <!-- key -> hash -> bucket -->
  <rect x="766" y="184" width="66" height="30" rx="6" fill="#eaf1fb" stroke="#c6d9f2"/><text x="799" y="203" font-size="10.5" fill="#20375e" text-anchor="middle">key</text>
  <line x1="832" y1="199" x2="866" y2="199" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <rect x="866" y="184" width="78" height="30" rx="6" fill="#ffffff" stroke="#4a7fd0" stroke-width="1.3"/><text x="905" y="203" font-size="9.5" fill="#20375e" text-anchor="middle">hash%N</text>
  <line x1="944" y1="199" x2="978" y2="199" stroke="#4a7fd0" stroke-width="1.8" marker-end="url(#aB)"/>
  <rect x="978" y="184" width="94" height="30" rx="6" fill="#e7f5ee" stroke="#9dd3ba"/><text x="1025" y="203" font-size="10" fill="#1f6b4a" text-anchor="middle">桶 → 命中</text>
  <text x="766" y="244" font-size="10" fill="#8a5a12">先花 O(n) 建表，之后每次查询直达</text>
  <!-- 徽章 -->
  <rect x="766" y="262" width="306" height="98" rx="10" fill="#fbfbfd" stroke="#eceef1"/>
  <text x="782" y="284" font-size="10.5" fill="#3a3a3c"><tspan font-weight="700" fill="#1f6b4a">时间</tspan>　O(1) 均摊　最坏 O(n) 退化</text>
  <text x="782" y="308" font-size="10.5" fill="#3a3a3c"><tspan font-weight="700" fill="#8a4038">前提</tspan>　可哈希的 key + 预建表</text>
  <text x="782" y="332" font-size="10.5" fill="#3a3a3c"><tspan font-weight="700" fill="#8a5a12">空间</tspan>　O(n)　额外一张哈希表</text>
  <text x="782" y="352" font-size="9.5" fill="#8e8e93">同一批数据高频等值查询 / two-sum 补数</text>

  <!-- ===== ② 权衡地图 ===== -->
  <text x="30" y="410" font-size="12" font-weight="700" fill="#8a5a12">② 权衡地图：查询时间 ⇄ 前提 / 额外空间代价（越靠右下越快，但要求越高）</text>
  <rect x="30" y="422" width="1060" height="256" rx="14" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>

  <!-- 坐标轴 -->
  <line x1="150" y1="446" x2="150" y2="638" stroke="#d7d7dd" stroke-width="1.4"/>
  <line x1="150" y1="638" x2="1050" y2="638" stroke="#d7d7dd" stroke-width="1.4"/>
  <text x="60" y="440" font-size="10" font-weight="700" fill="#3a3a3c">查询时间</text>
  <text x="1050" y="662" font-size="10" font-weight="700" fill="#3a3a3c" text-anchor="end">前提 / 额外空间代价 →</text>
  <!-- y 刻度：上慢下快 -->
  <text x="142" y="466" font-size="9.5" fill="#8e8e93" text-anchor="end">O(n) 慢</text>
  <text x="142" y="546" font-size="9.5" fill="#8e8e93" text-anchor="end">O(log n)</text>
  <text x="142" y="626" font-size="9.5" fill="#8e8e93" text-anchor="end">O(1) 快</text>
  <line x1="146" y1="462" x2="150" y2="462" stroke="#d7d7dd"/><line x1="146" y1="542" x2="150" y2="542" stroke="#d7d7dd"/><line x1="146" y1="622" x2="150" y2="622" stroke="#d7d7dd"/>
  <!-- x 刻度 -->
  <text x="290" y="658" font-size="9.5" fill="#8e8e93" text-anchor="middle">无序即可 · O(1) 空间</text>
  <text x="590" y="658" font-size="9.5" fill="#8e8e93" text-anchor="middle">需先排序（有序前提）</text>
  <text x="900" y="658" font-size="9.5" fill="#8e8e93" text-anchor="middle">需预建表 · O(n) 空间</text>

  <!-- 权衡前沿虚线 -->
  <path d="M290 462 L590 542 L900 622" fill="none" stroke="#d99a2b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aA)"/>
  <text x="470" y="500" font-size="9.5" fill="#8a5a12">权衡前沿：更快 ⇄ 更多前提 / 空间</text>

  <!-- 三个点 -->
  <circle cx="290" cy="462" r="8" fill="#4a7fd0"/><text x="290" y="448" font-size="10.5" font-weight="700" fill="#20375e" text-anchor="middle">线性</text>
  <text x="310" y="480" font-size="9" fill="#6e6e73">O(n) · 无前提 · O(1)</text>
  <circle cx="590" cy="542" r="8" fill="#4a7fd0"/><text x="590" y="528" font-size="10.5" font-weight="700" fill="#20375e" text-anchor="middle">二分</text>
  <text x="610" y="560" font-size="9" fill="#6e6e73">O(log n) · 有序 · O(1)</text>
  <circle cx="900" cy="622" r="8" fill="#2f9e6e"/><text x="900" y="608" font-size="10.5" font-weight="700" fill="#1f6b4a" text-anchor="middle">哈希</text>
  <text x="920" y="632" font-size="9" fill="#6e6e73">O(1) · 预建表 · O(n)</text>

  <text x="1074" y="672" font-size="9" fill="#a1a1a6" text-anchor="end">没有免费的午餐：拿不到前提就退回上一档</text>
</svg>
