<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#2f9e6e"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fbfbfd"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#1d1d1f">图 · 广度优先遍历 BFS：队列 + visited 集合，从起点逐层向外扩散</text>
  <text x="30" y="56" font-size="11" fill="#6e6e73">起点入队并标记 visited；反复「队首出队 → 记录 → 未访问的邻居入队并即刻标记」。起点=顶点1，访问序 1→2→3→4→5</text>

  <!-- 图例 -->
  <rect x="30" y="72" width="12" height="12" rx="2" fill="#2f9e6e"/><text x="48" y="82" font-size="10.5" fill="#3a3a3c">已访问 / 已入队</text>
  <rect x="190" y="72" width="12" height="12" rx="2" fill="#d99a2b"/><text x="208" y="82" font-size="10.5" fill="#3a3a3c">队列缓冲（FIFO）</text>
  <rect x="330" y="72" width="12" height="12" rx="2" fill="#eaf1fb" stroke="#c6d9f2"/><text x="348" y="82" font-size="10.5" fill="#3a3a3c">未访问</text>
  <text x="440" y="82" font-size="10.5" fill="#3a3a3c">关键：邻居在「入队」时即标 visited，避免重复入队</text>

  <!-- ===== 左：图（按层着色） ===== -->
  <text x="30" y="112" font-size="12" font-weight="700" fill="#2f6b4e">逐层扩散（顶点角标 = 访问次序）</text>
  <rect x="30" y="124" width="320" height="286" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="46" y="180" font-size="9.5" fill="#8a97ab">第0层</text>
  <text x="46" y="266" font-size="9.5" fill="#8a97ab">第1层</text>
  <text x="46" y="352" font-size="9.5" fill="#8a97ab">第2层</text>
  <g stroke="#4a7fd0" stroke-width="1.6">
    <line x1="190" y1="192" x2="120" y2="262"/>
    <line x1="190" y1="192" x2="270" y2="262"/>
    <line x1="120" y1="262" x2="120" y2="348"/>
    <line x1="120" y1="262" x2="270" y2="348"/>
    <line x1="270" y1="262" x2="270" y2="348"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="190" cy="192" r="20" fill="#c9ead9" stroke="#2f9e6e" stroke-width="1.8"/><text x="190" y="197" fill="#1f6b4a">1</text>
    <circle cx="120" cy="262" r="20" fill="#d8f0e4" stroke="#2f9e6e" stroke-width="1.8"/><text x="120" y="267" fill="#1f6b4a">2</text>
    <circle cx="270" cy="262" r="20" fill="#d8f0e4" stroke="#2f9e6e" stroke-width="1.8"/><text x="270" y="267" fill="#1f6b4a">3</text>
    <circle cx="120" cy="348" r="20" fill="#e6f6ee" stroke="#2f9e6e" stroke-width="1.8"/><text x="120" y="353" fill="#1f6b4a">4</text>
    <circle cx="270" cy="348" r="20" fill="#e6f6ee" stroke="#2f9e6e" stroke-width="1.8"/><text x="270" y="353" fill="#1f6b4a">5</text>
  </g>
  <g font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="207" cy="176" r="8" fill="#2f9e6e"/><text x="207" y="179">1</text>
    <circle cx="137" cy="246" r="8" fill="#2f9e6e"/><text x="137" y="249">2</text>
    <circle cx="287" cy="246" r="8" fill="#2f9e6e"/><text x="287" y="249">3</text>
    <circle cx="137" cy="332" r="8" fill="#2f9e6e"/><text x="137" y="335">4</text>
    <circle cx="287" cy="332" r="8" fill="#2f9e6e"/><text x="287" y="335">5</text>
  </g>
  <text x="190" y="392" font-size="10" fill="#2f6b4e" text-anchor="middle">无权图：层号 = 起点到该点最短边数</text>

  <!-- ===== 右上：机制 ===== -->
  <text x="372" y="112" font-size="12" font-weight="700" fill="#20375e">机制：队列决定「谁先展开」</text>
  <rect x="372" y="124" width="718" height="130" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="392" y="150" font-size="10.5" fill="#4a4a4f">1. 起点 1 入队，并标记 visited{1}——先标记再入队，是「不重复」的关键。</text>
  <text x="392" y="172" font-size="10.5" fill="#4a4a4f">2. 循环：队首出队记入结果；遍历它的邻居，只把「尚未 visited」的入队，并立刻标 visited。</text>
  <text x="392" y="194" font-size="10.5" fill="#4a4a4f">3. 队列 FIFO 保证「先入先出」= 距起点近的先被展开，于是访问天然按层推进。</text>
  <text x="392" y="216" font-size="10.5" fill="#4a4a4f">4. 队列空 → 与起点连通的顶点全部访问完毕，结束。时间 O(V+E)，空间 O(V)。</text>
  <text x="392" y="238" font-size="10" fill="#8a4038">易错：若在「出队时」才标 visited，同一顶点可能被多个邻居重复入队 → 重复访问。</text>

  <!-- ===== 右下：层集合 ===== -->
  <rect x="372" y="266" width="718" height="144" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="392" y="290" font-size="11" font-weight="700" fill="#2f6b4e">为什么「逐层」= 无权最短路</text>
  <g font-size="12" text-anchor="middle" font-weight="700">
    <text x="420" y="330" font-size="10" fill="#6e6e73" text-anchor="start" font-weight="400">第0层</text>
    <circle cx="510" cy="326" r="15" fill="#c9ead9" stroke="#2f9e6e"/><text x="510" y="330" fill="#1f6b4a">1</text>
    <text x="420" y="366" font-size="10" fill="#6e6e73" text-anchor="start" font-weight="400">第1层</text>
    <circle cx="510" cy="362" r="15" fill="#d8f0e4" stroke="#2f9e6e"/><text x="510" y="366" fill="#1f6b4a">2</text>
    <circle cx="550" cy="362" r="15" fill="#d8f0e4" stroke="#2f9e6e"/><text x="550" y="366" fill="#1f6b4a">3</text>
    <text x="640" y="330" font-size="10" fill="#6e6e73" text-anchor="start" font-weight="400">第2层</text>
    <circle cx="730" cy="326" r="15" fill="#e6f6ee" stroke="#2f9e6e"/><text x="730" y="330" fill="#1f6b4a">4</text>
    <circle cx="770" cy="326" r="15" fill="#e6f6ee" stroke="#2f9e6e"/><text x="770" y="330" fill="#1f6b4a">5</text>
  </g>
  <text x="820" y="322" font-size="10.5" fill="#4a4a4f">先入先出 → 距起点近的先展开</text>
  <text x="820" y="342" font-size="10.5" fill="#4a4a4f">→ 顶点按「离起点的边数」分层</text>
  <text x="820" y="362" font-size="10.5" fill="#2f6b4e">→ 首次访问的层号即最短跳数</text>
  <text x="392" y="396" font-size="10" fill="#6e6e73">若要「按层」处理：每轮循环前记录当前队列长度，一次性弹出整层再展开下一层。</text>

  <!-- ===== 快照表 ===== -->
  <text x="30" y="436" font-size="12" font-weight="700" fill="#8a5a12">逐步快照（队首在左，← front）</text>
  <rect x="30" y="448" width="1060" height="216" rx="12" fill="#ffffff" stroke="#e4e7ec" filter="url(#soft)"/>
  <text x="48" y="472" font-size="10" font-weight="700" fill="#6e6e73">时刻</text>
  <text x="110" y="472" font-size="10" font-weight="700" fill="#6e6e73">动作</text>
  <text x="470" y="472" font-size="10" font-weight="700" fill="#6e6e73">队列状态（出队 ← ... ← 入队）</text>
  <text x="900" y="472" font-size="10" font-weight="700" fill="#6e6e73">res 访问序列</text>
  <line x1="46" y1="480" x2="1074" y2="480" stroke="#e4e7ec"/>

  <!-- t0 -->
  <text x="48" y="507" font-size="10.5" fill="#4a4a4f">t0</text>
  <text x="110" y="507" font-size="10" fill="#4a4a4f">起点 1 入队，标 visited{1}</text>
  <g font-size="11" text-anchor="middle"><rect x="470" y="492" width="28" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="484" y="509" fill="#8a5a12">1</text></g>
  <text x="900" y="507" font-size="10.5" fill="#a1a1a6">（空）</text>
  <line x1="46" y1="520" x2="1074" y2="520" stroke="#f0f0f2"/>
  <!-- t1 -->
  <text x="48" y="543" font-size="10.5" fill="#4a4a4f">t1</text>
  <text x="110" y="543" font-size="10" fill="#4a4a4f">出队 1 → 入队 2,3（标 visited）</text>
  <g font-size="11" text-anchor="middle"><rect x="470" y="528" width="28" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="484" y="545" fill="#8a5a12">2</text><rect x="502" y="528" width="28" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="516" y="545" fill="#8a5a12">3</text></g>
  <text x="900" y="543" font-size="10.5" fill="#1f6b4a" font-weight="700">1</text>
  <line x1="46" y1="556" x2="1074" y2="556" stroke="#f0f0f2"/>
  <!-- t2 -->
  <text x="48" y="579" font-size="10.5" fill="#4a4a4f">t2</text>
  <text x="110" y="579" font-size="10" fill="#4a4a4f">出队 2 → 入队 4,5（1 已访问跳过）</text>
  <g font-size="11" text-anchor="middle"><rect x="470" y="564" width="28" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="484" y="581" fill="#8a5a12">3</text><rect x="502" y="564" width="28" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="516" y="581" fill="#8a5a12">4</text><rect x="534" y="564" width="28" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="548" y="581" fill="#8a5a12">5</text></g>
  <text x="900" y="579" font-size="10.5" fill="#1f6b4a" font-weight="700">1 · 2</text>
  <line x1="46" y1="592" x2="1074" y2="592" stroke="#f0f0f2"/>
  <!-- t3 -->
  <text x="48" y="615" font-size="10.5" fill="#4a4a4f">t3</text>
  <text x="110" y="615" font-size="10" fill="#4a4a4f">出队 3 → 邻居 1,5 均已访问</text>
  <g font-size="11" text-anchor="middle"><rect x="470" y="600" width="28" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="484" y="617" fill="#8a5a12">4</text><rect x="502" y="600" width="28" height="24" rx="4" fill="#fdf3e0" stroke="#e7c07a"/><text x="516" y="617" fill="#8a5a12">5</text></g>
  <text x="900" y="615" font-size="10.5" fill="#1f6b4a" font-weight="700">1 · 2 · 3</text>
  <line x1="46" y1="628" x2="1074" y2="628" stroke="#f0f0f2"/>
  <!-- t4 + t5 合并两行 -->
  <text x="48" y="651" font-size="10.5" fill="#4a4a4f">t4·t5</text>
  <text x="110" y="651" font-size="10" fill="#4a4a4f">出队 4 → 出队 5 → 邻居皆已访问，队空结束</text>
  <g font-size="11" text-anchor="middle"><rect x="470" y="636" width="60" height="24" rx="4" fill="#f4f4f6" stroke="#d7d7dd" stroke-dasharray="3 2"/><text x="500" y="653" fill="#a1a1a6" font-size="10">空</text></g>
  <text x="900" y="651" font-size="10.5" fill="#1f6b4a" font-weight="700">1 · 2 · 3 · 4 · 5</text>

  <!-- 底部不变式 -->
  <rect x="30" y="672" width="1060" height="42" rx="12" fill="#f6f7f9" stroke="#e4e7ec"/>
  <text x="48" y="690" font-size="10.5" fill="#4a4a4f"><tspan font-weight="700" fill="#2f6b4e">不变式</tspan> 每个顶点入队恰一次、出队恰一次（靠 visited 保证），时间 O(V+E)、队列峰值 O(V)。</text>
  <text x="48" y="708" font-size="10.5" fill="#4a4a4f"><tspan font-weight="700" fill="#2f6b4e">用途</tspan> 无权最短路、逐层扩散、迷宫最短步、社交 N 度好友、洪泛广播——凡「先近后远 / 最短跳数」皆用 BFS。</text>
</svg>
