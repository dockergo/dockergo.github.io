<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="aHot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#0a84ff"/></marker>
    <marker id="aState" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#0f9e8e"/></marker>
    <marker id="aCtl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10 z" fill="#7c5fe6"/></marker>
  </defs>
  <rect width="1080" height="880" fill="#fbfbfd"/>

  <!-- 标题条 -->
  <rect x="0" y="0" width="1080" height="48" fill="#f4f5f7" stroke="#e6e6eb"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1d1d1f">Apache Parquet 总架构 · 自描述列式文件格式（单文件剖面）</text>
  <text x="560" y="30" font-size="11.5" fill="#8a8a90">schema 树 → 行组 → 列块 → 页 · 元数据尾置，一次尾读拿全图</text>

  <!-- 顶部 接触面：类型系统与 schema 树 -->
  <rect x="24" y="60" width="1032" height="66" rx="12" fill="#f4eefb" stroke="#d9c7ec" filter="url(#soft)" data-tid="Parquet原理_接触面_类型系统与schema树"/>
  <text x="44" y="82" font-size="12" font-weight="700" fill="#3d2a5a">接触面 · 类型系统与 schema 树（引擎给 schema + 数据，Parquet 只做编解码，不是引擎）</text>
  <rect x="44" y="92" width="300" height="26" rx="7" fill="#fff" stroke="#d9c7ec" data-tid="Parquet原理_接触面_类型系统与schema树"/>
  <text x="58" y="109" font-size="9.5" fill="#5a3f82">8 种物理 Type + LogicalType 注解</text>
  <rect x="356" y="92" width="320" height="26" rx="7" fill="#fff" stroke="#d9c7ec" data-tid="Parquet原理_接触面_类型系统与schema树"/>
  <text x="370" y="109" font-size="9.5" fill="#5a3f82">SchemaElement 深度优先扁平 · num_children 还原树</text>
  <rect x="688" y="92" width="368" height="26" rx="7" fill="#eef0f3" stroke="#d2d6dd" data-tid="Parquet原理_接触面_类型系统与schema树"/>
  <text x="702" y="109" font-size="9.5" fill="#33373e">REQUIRED / OPTIONAL / REPEATED 决定 max def/rep 级</text>

  <!-- 文件物理剖面标题 -->
  <text x="24" y="150" font-size="11" font-weight="600" fill="#8a8a90">单个 .parquet 文件物理布局（左→右按字节偏移，元数据尾置）</text>

  <!-- 头 PAR1 -->
  <rect x="24" y="160" width="46" height="470" rx="9" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)" data-tid="Parquet原理_支撑_文件布局"/>
  <text x="47" y="395" font-size="11" font-weight="700" fill="#5a3410" transform="rotate(-90 47 395)">PAR1 魔数</text>

  <!-- Body 大框 = N 行组 -->
  <rect x="82" y="160" width="640" height="470" rx="12" fill="#ffffff" stroke="#d0d0d6" filter="url(#soft)"/>
  <text x="100" y="182" font-size="12" font-weight="700" fill="#1d1d1f">数据主体 · M 个 RowGroup（每组按大小切，含全部列的列块）</text>

  <!-- RowGroup 放大 -->
  <rect x="100" y="196" width="292" height="418" rx="11" fill="#fafbfc" stroke="#d8dce2" data-tid="Parquet原理_支撑_文件布局"/>
  <text x="114" y="216" font-size="10.5" font-weight="700" fill="#33373e">RowGroup（放大 · 一批行）</text>

  <!-- ColumnChunk -->
  <rect x="114" y="228" width="264" height="248" rx="9" fill="#e9f2ff" stroke="#a9ccf5" filter="url(#soft)" data-tid="Parquet原理_支撑_列块与页组装"/>
  <text x="130" y="247" font-size="10" font-weight="700" fill="#0a3d78">ColumnChunk（一列 · 页背靠背）</text>
  <text x="130" y="263" font-size="8.4" fill="#2a5a92">ColumnMetaData：偏移 / 编码集 / codec / 统计</text>

  <!-- Dictionary page -->
  <rect x="128" y="272" width="236" height="30" rx="7" fill="#fff7e6" stroke="#e8cf9a" data-tid="Parquet原理_支撑_列编码"/>
  <text x="142" y="291" font-size="8.8" fill="#5a3410">字典页（居首，至多一个）</text>

  <!-- Data page 放大 -->
  <rect x="128" y="308" width="236" height="158" rx="8" fill="#f3f9ff" stroke="#bcd8f5"/>
  <text x="142" y="325" font-size="8.8" font-weight="700" fill="#0a3d78">DataPage（放大 · 三段背靠背）</text>
  <rect x="142" y="332" width="208" height="34" rx="6" fill="#e6f4f1" stroke="#b9dfd8" data-tid="Parquet原理_支撑_Dremel嵌套编码"/>
  <text x="156" y="347" font-size="8.4" fill="#0f6b5e">① repetition levels（RLE）</text>
  <text x="156" y="360" font-size="8" fill="#4c8567">② definition levels（RLE · null 编这里）</text>
  <rect x="142" y="372" width="208" height="30" rx="6" fill="#e9f2ff" stroke="#a9ccf5" data-tid="Parquet原理_支撑_列编码"/>
  <text x="156" y="391" font-size="8.4" fill="#0a3d78">③ encoded values（PLAIN/字典/DELTA）</text>
  <rect x="142" y="408" width="208" height="24" rx="6" fill="#fdf6ea" stroke="#efdcb4" data-tid="Parquet原理_支撑_压缩与页"/>
  <text x="156" y="424" font-size="8" fill="#5a3410">PageHeader：压缩前/后大小 + CRC</text>
  <text x="142" y="452" font-size="8" fill="#7fa0c4">reader 可整页跳过（不感兴趣）</text>

  <!-- 布隆过滤器 区域 -->
  <rect x="114" y="486" width="264" height="52" rx="9" fill="#eafaf1" stroke="#bfe0cd" filter="url(#soft)" data-tid="Parquet原理_支撑_布隆过滤器"/>
  <text x="130" y="505" font-size="9.6" font-weight="700" fill="#12402a">布隆过滤器（可选 · SplitBlock）</text>
  <text x="130" y="521" font-size="8.2" fill="#2f6f5f">块内 8 word/256bit · 等值查询补 min/max</text>
  <text x="130" y="533" font-size="8" fill="#4c8567">offset/length 记于 ColumnMetaData</text>

  <!-- 其它行组占位 -->
  <rect x="402" y="196" width="150" height="418" rx="11" fill="#fafbfc" stroke="#e2e5ea"/>
  <text x="477" y="405" font-size="9.5" fill="#a1a1a6" text-anchor="middle" transform="rotate(-90 477 405)">RowGroup 1 … M-1</text>
  <rect x="562" y="196" width="150" height="418" rx="11" fill="#fafbfc" stroke="#e2e5ea"/>
  <text x="637" y="405" font-size="9" fill="#b8b8bf" text-anchor="middle" transform="rotate(-90 637 405)">同结构重复</text>

  <!-- 尾部 PageIndex -->
  <rect x="734" y="160" width="150" height="300" rx="11" fill="#e6f4f1" stroke="#b9dfd8" filter="url(#soft)" data-tid="Parquet原理_支撑_PageIndex跳页"/>
  <text x="750" y="182" font-size="10.5" font-weight="700" fill="#0f6b5e">PageIndex（尾部集中）</text>
  <text x="748" y="204" font-size="8.4" fill="#2f6f5f">ColumnIndex：每页 min/max</text>
  <text x="748" y="219" font-size="8.4" fill="#2f6f5f">null_pages / boundary_order</text>
  <text x="748" y="238" font-size="8.4" fill="#2f6f5f">OffsetIndex：PageLocation</text>
  <text x="748" y="253" font-size="8.4" fill="#2f6f5f">offset / size / first_row</text>
  <rect x="748" y="266" width="122" height="40" rx="7" fill="#f0f7ff" stroke="#bcd8f5"/>
  <text x="809" y="284" font-size="8" text-anchor="middle" fill="#0a3d78">两级裁页：</text>
  <text x="809" y="297" font-size="7.6" text-anchor="middle" fill="#2a5a92">先选页 → 再定位</text>
  <text x="748" y="330" font-size="8" fill="#4c8567">两偏移记于 ColumnChunk</text>

  <!-- 尾部 FileMetaData -->
  <rect x="896" y="160" width="112" height="470" rx="11" fill="#fff7e6" stroke="#e8cf9a" filter="url(#soft)" data-tid="Parquet原理_支撑_统计与排序"/>
  <text x="952" y="182" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5a3410">FileMetaData</text>
  <text x="952" y="206" font-size="8.2" text-anchor="middle" fill="#93762e">schema[]（扁平）</text>
  <text x="952" y="222" font-size="8.2" text-anchor="middle" fill="#93762e">num_rows</text>
  <text x="952" y="238" font-size="8.2" text-anchor="middle" fill="#93762e">row_groups[]</text>
  <rect x="908" y="252" width="88" height="72" rx="7" fill="#fdf6ea" stroke="#efdcb4"/>
  <text x="952" y="270" font-size="8" text-anchor="middle" fill="#5a3410">Statistics</text>
  <text x="952" y="284" font-size="7.6" text-anchor="middle" fill="#93762e">min/max</text>
  <text x="952" y="297" font-size="7.6" text-anchor="middle" fill="#93762e">null_count</text>
  <text x="952" y="310" font-size="7.6" text-anchor="middle" fill="#93762e">column_orders</text>
  <text x="952" y="342" font-size="8" text-anchor="middle" fill="#93762e">尾置：允许</text>
  <text x="952" y="355" font-size="8" text-anchor="middle" fill="#93762e">单遍写</text>

  <!-- 尾 长度 + PAR1 -->
  <rect x="734" y="472" width="274" height="40" rx="9" fill="#fdf6ea" stroke="#efdcb4" filter="url(#soft)" data-tid="Parquet原理_支撑_文件布局"/>
  <text x="871" y="490" font-size="9.4" font-weight="700" text-anchor="middle" fill="#5a3410">4B FileMetaData 长度（小端） + PAR1</text>
  <text x="871" y="505" font-size="8" text-anchor="middle" fill="#93762e">尾读 8 字节即得元数据长度与魔数</text>

  <!-- 读写主轴 -->
  <path d="M950,634 L950,660" stroke="#0a84ff" stroke-width="2.2" fill="none" marker-end="url(#aHot)"/>
  <text x="810" y="650" font-size="8.4" fill="#0a84ff">写：数据先落，元数据尾置聚合</text>
  <path d="M400,660 L400,634" stroke="#0a84ff" stroke-width="2.2" fill="none" marker-end="url(#aHot)"/>
  <text x="200" y="650" font-size="8.4" fill="#0a84ff">读：尾读元数据 → 定位列块/页</text>

  <!-- Control 剪枝 -->
  <g stroke="#7c5fe6" stroke-width="1.6" stroke-dasharray="6 4" fill="none">
    <path d="M808,240 L392,300" marker-end="url(#aCtl)"/>
  </g>
  <text x="470" y="262" font-size="8" fill="#7c5fe6">统计/PageIndex 裁页</text>

  <!-- State 列 ID 贯穿 -->
  <path d="M540,126 L540,158" stroke="#0f9e8e" stroke-width="1.6" fill="none" marker-end="url(#aState)"/>
  <text x="546" y="146" font-size="8" fill="#0f9e8e">path_in_schema 贯穿</text>

  <!-- 底部铭牌 + 图例 -->
  <rect x="24" y="668" width="1032" height="86" rx="12" fill="#f4f5f7" stroke="#e6e6eb"/>
  <text x="44" y="692" font-size="11" font-weight="700" fill="#1d1d1f">核心设计张力 · 列式压缩率 + 三级裁剪（列裁剪 + PageIndex/统计裁页 + 布隆等值）vs 写复杂度（缓冲整行组、先编码后落盘、元数据尾置）</text>
  <text x="44" y="712" font-size="9.5" fill="#5b6470">自描述单文件（schema + 统计内嵌，无需外部 catalog）vs 多文件表 / schema 演进 / 事务交给引擎；Dremel 定义/重复级把嵌套压平进列。</text>
  <g font-size="9.5" fill="#5b6470">
    <line x1="44" y1="734" x2="70" y2="734" stroke="#0a84ff" stroke-width="2.2"/><text x="76" y="737">读/写主轴</text>
    <line x1="180" y1="734" x2="206" y2="734" stroke="#0f9e8e" stroke-width="1.6"/><text x="212" y="737">数据/schema 贯穿</text>
    <line x1="380" y1="734" x2="406" y2="734" stroke="#7c5fe6" stroke-width="1.6" stroke-dasharray="6 4"/><text x="412" y="737">裁页/裁列控制流</text>
    <line x1="580" y1="734" x2="606" y2="734" stroke="#e8730f" stroke-width="1.6"/><text x="612" y="737">存储/落盘（元数据尾置）</text>
    <text x="870" y="737" font-size="8.5" fill="#a1a1a6">点击任一区域下钻对应主线</text>
  </g>

  <!-- 覆盖 8 主线的整体大热区（保证可点） -->
  <rect x="24" y="160" width="46" height="470" fill="transparent" data-tid="Parquet原理_支撑_文件布局"/>
</svg>
